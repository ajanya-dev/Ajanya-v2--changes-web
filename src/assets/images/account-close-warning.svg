<svg viewBox="0 0 480 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Account closure warning illustration">
  <defs>
    <linearGradient id="aw-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D3EAF" />
      <stop offset="100%" stop-color="#1C2B8A" />
    </linearGradient>
    <linearGradient id="aw-card-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="aw-chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="aw-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#FEF2F2" />
    </linearGradient>
    <radialGradient id="aw-danger-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0" />
    </radialGradient>
    <filter id="aw-f-card" x="-18%" y="-14%" width="136%" height="142%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1C2B8A" flood-opacity="0.32" />
    </filter>
    <filter id="aw-f-shield" x="-28%" y="-18%" width="156%" height="148%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#EF4444" flood-opacity="0.22" />
    </filter>
    <filter id="aw-f-warn" x="-28%" y="-18%" width="156%" height="148%">
