	animation: 1s 1 forwards cubic-bezier(.36, -0.01, .5, 1.38) zoomIn, 3s Infinite linear heartbeat;
	animation-delay: 0s, 1s;
}

@keyframes zoomOut {
	0% {
		opacity: 0;
		transform: scale(1.5);
	}
	100% {
		opacity: 1;
		transform: scale(1);
	}
}

@keyframes slideUp {
	0% {
		opacity: 0;
		transform: translateY(30px);
	}
	100% {
		opacity: 1;
		transform: inherit;
	}
}

@keyframes lightSpeedRight {
	from {
		transform: translate3d(50%, 0, 0) skewX(-20deg);
		opacity: 0;
	}
	60% {
		transform: skewX(10deg);
		opacity: 1;
	}
	80% {
		transform: skewX(-2deg);
	}
	to {
		opacity: 1;
		transform: translate3d(0, 0, 0);
	}
}

@keyframes floating {
	0% {
		opacity: 1;
		transform: translateY(0px);
	}
	50% {
		transform: translateY(-10px);
	}
	100% {
		opacity: 1;
		transform: translateY(0px);
	}
}

@keyframes slideDown {
	0% {
		opacity: 0;
		transform: translateY(-30px);
	}
	100% {
		opacity: 1;
		transform: translateY(0);
	}
}

@keyframes wind {
	0% {
		transform: rotate( 0deg);
	}
	25% {
		transform: rotate( 1deg);
	}
	75% {
		transform: rotate( -1deg);
	}
}

@keyframes zoomIn {
	0% {
		opacity: 0;
		transform: scale(0.5);
	}
	100% {
		opacity: 1;
		transform: scale(1);
	}
}

@keyframes heartbeat {
	0% {
		transform: scale(1);
	}
	10% {
		transform: scale(1.1);
	}
	30% {
		transform: scale(1);
	}
	40% {
		transform: scale(1);
	}
	50% {
		transform: scale(1.1);
	}
	60% {
		transform: scale(1);
	}
	100% {
		transform: scale(1);
	}
}

