<div class="v4-common-input-full-width">
  <!-- ==================== HEADER ==================== -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
      Add Wire Routing Number
    </h1>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- ==================== CONTENT ==================== -->
  <div class="p-6 bg-v4-tertiary-background-color space-y-4">
    <!-- Info note -->
    <div
      class="flex gap-3 p-4 rounded-lg bg-v4-secondary-background-color border border-v4-border-color"
    >
      <lucide-icon
        [img]="InfoIcon"
        [size]="20"
        class="text-v4-primary-brand-color shrink-0 mt-0.5"
      />
      <p class="text-sm text-v4-secondary-text-color leading-relaxed">
        {{ noteMessage }}
      </p>
    </div>

    <!-- Input field -->
    <app-common-input-v4
      placeholder="Wire Routing Number"
      [formControl]="wireRoutingNumber"
      [control]="wireRoutingNumber"
      [isNumberOnly]="true"
      [maxLength]="9"
    />
  </div>

  <!-- ==================== FOOTER ==================== -->
  <div
    class="flex justify-end gap-3 px-6 py-4 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      [mat-dialog-close]="false"
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      [type]="{ style: 'primary', name: 'main' }"
      [textColorInput]="'white'"
      text="Submit"
      (clickEvent)="submit()"
    />
  </div>
</div>
