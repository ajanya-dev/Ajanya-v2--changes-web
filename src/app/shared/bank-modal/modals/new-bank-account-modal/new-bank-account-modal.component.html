<div class="ocw_man_modal_wrapper add_bank_modal">
  <form [formGroup]="bankForm" (ngSubmit)="submit()">
    <div class="ocw_modal_header">
      <div class="ocw_modal_title">Add New Bank Account</div>
      <div class="close_btn" [mat-dialog-close]="false">
        <fa-icon [icon]="['fas', 'xmark']"></fa-icon>
      </div>
    </div>
    <div class="ocw_modal_body !bg-main-background-color">
      <div class="h-12 w-full mb-4 flex justify-between items-center gap-4">
        <div class="v35-button-switch w-full">
          <div
            role="presentation"
            [ngClass]="{ selected: countryType === 1 }"
            (click)="onTabChange(1)"
          >
            <h1>
              <mat-radio-button
                class="example-radio-button"
                [checked]="countryType === 1"
                (change)="onTabChange(1)"
              >
                USA
              </mat-radio-button>
            </h1>
          </div>
          <div
            role="presentation"
            [ngClass]="{ selected: countryType === 2 }"
            (click)="onTabChange(2)"
          >
            <h1>
              <mat-radio-button
                class="example-radio-button"
                [checked]="countryType === 2"
                (change)="onTabChange(2)"
              >
                Canada
              </mat-radio-button>
            </h1>
          </div>
        </div>
      </div>
      <div>
        @if (countryType === 2) {
          <div class="country_selected_field mb-3 gap-x-6 gap-y-3.5">
            <div class="single_input">
              <input
                type="text"
                class="input_style"
                placeholder=" "
                formControlName="transitNumber"
                (keypress)="utils.numberOnly($event, 'numeric')"
                maxlength="5"
              />
              <span class="floating_label_field"
                >Transit Number <span class="required">*</span></span
              >
              <app-control-message
                [control]="bankForm.controls.transitNumber"
              ></app-control-message>
            </div>
            <div class="single_input">
              <input
                type="text"
                class="input_style require_fields"
                placeholder=" "
                formControlName="financialNumber"
                id="financialNumber"
                (keypress)="utils.numberOnly($event, 'numeric')"
                maxlength="3"
              />
              <label for="financialNumber" class="floating_label_field"
                >Financial Institute No. <span class="required">*</span></label
              >
              <app-control-message
                [control]="bankForm.controls.financialNumber"
              ></app-control-message>
            </div>
            <div class="single_input">
              <input
                type="text"
                formControlName="bankAccountNumber"
                class="input_style require_fields"
                id="AccNumber"
                maxlength="20"
                placeholder=" "
                (keypress)="utils.numberOnly($event, 'numeric')"
              />
              <label for="AccNumber" class="floating_label_field"
                >Account Number <span class="required">*</span></label
              >
              <app-control-message
                [control]="bankForm.controls.bankAccountNumber"
              ></app-control-message>
            </div>
            <div class="single_input">
              <input
                type="text"
                formControlName="confirmAccountNumber"
                class="input_style require_fields"
                id="AccNumber"
                maxlength="20"
                placeholder=" "
                (keypress)="utils.numberOnly($event, 'numeric')"
              />
              <label for="AccNumber" class="floating_label_field"
                >Confirm Account Number <span class="required">*</span></label
              >
              <app-control-message
                [control]="bankForm.controls.confirmAccountNumber"
              ></app-control-message>
            </div>
          </div>
        }
        @if (countryType === 1) {
          <div class="country_selected_field mb-3 gap-x-6 gap-y-3.5">
            <div class="single_input">
              <input
                type="text"
                formControlName="bankRoutingNumber"
                (keyup)="lookupRoutingNumber($event)"
                (keypress)="utils.numberOnly($event, 'numeric')"
                class="input_style"
                placeholder=" "
                autofocus="off"
                maxlength="9"
              />
              <span class="floating_label_field"
                >Routing Number <span class="required">*</span></span
              >
              <app-control-message
                [control]="bankForm.controls.bankRoutingNumber"
              ></app-control-message>
            </div>
            <div class="single_input">
              <input
                type="text"
                formControlName="bankAccountNumber"
                class="input_style require_fields"
                id="AccNumber"
                maxlength="20"
                placeholder=" "
                (keypress)="utils.numberOnly($event, 'numeric')"
              />
              <label for="AccNumber" class="floating_label_field"
                >Account Number <span class="required">*</span></label
              >
              <app-control-message
                [control]="bankForm.controls.bankAccountNumber"
              ></app-control-message>
            </div>
            <div class="account_number_field single_input">
              <input
                type="text"
                formControlName="confirmAccountNumber"
                class="input_style require_fields"
                id="AccNumber"
                maxlength="20"
                placeholder=" "
                (keypress)="utils.numberOnly($event, 'numeric')"
              />
              <label for="AccNumber" class="floating_label_field"
                >Confirm Account Number <span class="required">*</span></label
              >
              <app-control-message
                [control]="bankForm.controls.confirmAccountNumber"
              ></app-control-message>
            </div>
          </div>
        }
        <div class="single_input mb-3">
          <select formControlName="bankAccountType" class="input_style">
            <option value="" disabled selected>Select Account Type</option>
            <option value="5">Personal Checking</option>
            <option value="6">Business Checking</option>
            <option value="7">Personal Savings</option>
            <option value="8">Business Savings</option>
          </select>
        </div>
      </div>
      <div class="input_group bank_credential">
        <div class="single_input">
          <input
            type="text"
            formControlName="bankAccountName"
            class="input_style"
            id="AccName"
            maxlength="60"
            (keypress)="backtickDesble($event)"
            placeholder=" "
          />
          <label for="AccName" class="floating_label_field"
            >Account Name <span class="required">*</span></label
          >
          <app-control-message
            [control]="bankForm.controls.bankAccountName"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="bankAccountNickName"
            class="input_style require_fields"
            id="nickName"
            (keypress)="backtickDesble($event)"
            maxlength="60"
            placeholder=" "
          />
          <label for="nickName" class="floating_label_field"
            >Nick Name <span class="required">*</span></label
          >
          <app-control-message
            [control]="bankForm.controls.bankAccountNickName"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="bankAccountAddressLine1"
            id="bankAccountAddressLine1"
            maxlength="150"
            class="input_style require_fields"
            id="AccAddress"
            placeholder=" "
            #bankHolderAddressSearch
            (focus)="loadGoogleAddress(bankHolderAddressSearch)"
          />
          <label for="bankAccountAddressLine1" class="floating_label_field"
            >Address Line 1 <span class="required">*</span></label
          >
          <app-control-message
            [control]="bankForm.controls.bankAccountAddressLine1"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="bankAccountAddressLine2"
            class="input_style require_fields"
            maxlength="100"
            id="AccAddress"
            placeholder=" "
          />
          <label for="AccAddress" class="floating_label_field"
            >Address Line 2
          </label>
          <app-control-message
            [control]="bankForm.controls.bankAccountAddressLine2"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="bankAccountCity"
            class="input_style require_fields"
            id="AccCity"
            maxlength="100"
            placeholder=" "
          />
          <label for="AccCity" class="floating_label_field"
            >City <span class="required">*</span></label
          >
          <app-control-message
            [control]="bankForm.controls.bankAccountCity"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="bankAccountState"
            class="input_style require_fields"
            id="AccState"
            maxlength="100"
            placeholder=" "
          />
          <label for="AccState" class="floating_label_field"
            >State <span class="required">*</span></label
          >
          <app-control-message
            [control]="bankForm.controls.bankAccountState"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="bankAccountZip"
            class="input_style require_fields"
            id="AccZip"
            maxlength="10"
            placeholder=" "
          />
          @if (countryType === 2) {
            <label for="AccZip" class="floating_label_field"
              >Postal Code <span class="required">*</span>
            </label>
          } @else {
            <label for="AccZip" class="floating_label_field"
              >Zip <span class="required">*</span>
            </label>
          }
          <app-control-message
            [control]="bankForm.controls.bankAccountZip"
          ></app-control-message>
        </div>
        <div class="single_input">
          <input
            type="text"
            formControlName="bankAccountPhone"
            class="input_style require_fields"
            id="AccPhone"
            (keypress)="utils.numberOnly($event, 'numeric')"
            mask="(000) 000-0000"
            placeholder=" "
          />
          <label for="AccPhone" class="floating_label_field">Phone </label>
          <app-control-message
            [control]="bankForm.controls.bankAccountPhone"
          ></app-control-message>
        </div>
        <div class="single_input">
          <input
            type="text"
            formControlName="bankAccountEmail"
            class="input_style require_fields"
            id="AccEmail"
            maxlength="60"
            placeholder=" "
          />
          <label for="AccEmail" class="floating_label_field">Email</label>
          <app-control-message
            [control]="bankForm.controls.bankAccountEmail"
          ></app-control-message>
        </div>
      </div>

      <h3 class="sec_from_head">Bank Details</h3>

      <div class="input_group bank_detail">
        <div class="single_input">
          <input
            type="text"
            formControlName="bankName"
            maxlength="50"
            class="input_style require_fields"
            id="bankName"
            (keypress)="backtickDesble($event)"
            placeholder=" "
          />
          <label for="bankName" class="floating_label_field"
            >Bank Name <span class="required">*</span></label
          >
          <app-control-message
            [control]="bankForm.controls.bankName"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="bankAddress1"
            class="input_style"
            id="bankAddress"
            maxlength="150"
            placeholder=" "
            #BankAddressSearch
            (focus)="loadBankGoogleAddress(BankAddressSearch, 0)"
          />
          <label for="bankAddress" class="floating_label_field"
            >Street Address <span class="required">*</span></label
          >
          <app-control-message
            [control]="bankForm.controls.bankAddress1"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="bankCity"
            class="input_style"
            id="bankCity"
            placeholder=" "
            maxlength="50"
          />
          <label for="bankCity" class="floating_label_field"
            >City <span class="required">*</span></label
          >
          <app-control-message
            [control]="bankForm.controls.bankCity"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="bankState"
            class="input_style"
            id="bankState"
            placeholder=" "
            maxlength="100"
          />
          <label for="bankState" class="floating_label_field"
            >State <span class="required">*</span></label
          >
          <app-control-message
            [control]="bankForm.controls.bankState"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="bankZip"
            class="input_style"
            id="bankZip"
            placeholder=" "
            maxlength="10"
          />
          @if (countryType === 2) {
            <label for="bankZip" class="floating_label_field"
              >Postal Code <span class="required">*</span>
            </label>
          } @else {
            <label for="bankZip" class="floating_label_field"
              >Zip <span class="required">*</span>
            </label>
          }
          <app-control-message
            [control]="bankForm.controls.bankZip"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="bankStartingCheckNumber"
            id="bankStartingCheckNumber"
            maxlength="12"
            class="input_style"
            (keypress)="numberOnly($event)"
            placeholder=" "
          />
          <label for="bankStartingCheckNumber" class="floating_label_field"
            >Starting Check Number</label
          >
          <app-control-message
            [control]="bankForm.controls.bankStartingCheckNumber"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="bankFractionalNumber"
            id="bankFractionalNumber"
            maxlength="12"
            class="input_style"
            (keypress)="disbleBacktick($event)"
            placeholder=" "
          />
          <label for="bankFractionalNumber" class="floating_label_field"
            >Fractional Number</label
          >
          <app-control-message
            [control]="bankForm.controls.bankFractionalNumber"
          ></app-control-message>
        </div>
      </div>
    </div>
    <!-- modal body end -->

    <div class="ocw_modal_footer">
      <mat-dialog-actions align="end">
        <button mat-dialog-close class="ocw-btn ocw-btn-modal-bordered">
          Cancel
        </button>
        <button
          type="submit"
          class="ocw-btn ocw-btn-modal-blue add_btn"
          [disabled]="loading"
        >
          @if (!loading) {
            <ng-container>
              <fa-icon [icon]="['fas', 'plus']"></fa-icon>
              <span>Add</span>
            </ng-container>
          }
          @if (loading) {
            <span class="loadingSpinner"></span>
          }
        </button>
      </mat-dialog-actions>
    </div>
  </form>
</div>
