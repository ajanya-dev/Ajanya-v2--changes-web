<div class="ocw_man_modal_wrapper add_bank_modal">
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">Add Wire Routing Number</div>
    <div class="close_btn" [mat-dialog-close]="false">
      <img
        src="./../../../../../assets/icon/close-icon.svg"
        type="image/svg+xml"
        alt="Close Icon"
      />
    </div>
  </div>

  <!-- modal body start -->
  <div class="ocw_modal_body">
    <div class="note mb-2">
      <p>
        <i [matTooltip]="'info'" class="fas fa-info-circle"></i> The routing
        number you provided{{
          bankAc ? " for " + bankAc.name + " - " + bankAc.accountNumber : ""
        }}
        is not valid for wire transfers. Please provide your wire routing
        number, we will use this routing number to transfer money to your
        account.
      </p>
    </div>
    <div class="grid grid-cols-1 gap-2">
      <div class="single_input">
        <input
          type="text"
          [formControl]="wireRoutingNumber"
          (keypress)="utils.numberOnly($event, 'numeric')"
          class="input_style"
          placeholder=" "
          autofocus="off"
          maxlength="9"
        />
        <span class="floating_label_field"
          >Wire Routing Number <span class="required">*</span></span
        >
        <app-control-message
          [control]="wireRoutingNumber"
        ></app-control-message>
      </div>
    </div>
  </div>
  <!-- modal body end -->
  <div class="ocw_modal_footer">
    <mat-dialog-actions align="end">
      <button mat-dialog-close class="ocw-btn ocw-btn-modal-bordered">
        Cancel
      </button>
      <button
        type="submit"
        class="ocw-btn ocw-btn-modal-blue add_btn"
        (click)="submit()"
      >
        Submit
      </button>
    </mat-dialog-actions>
  </div>
</div>
