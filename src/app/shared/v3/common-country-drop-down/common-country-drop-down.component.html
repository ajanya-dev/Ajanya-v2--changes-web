<div class="relative country-list">
  <small
    *ngIf="selectedCountry"
    [ngClass]="{ '!text-secondary-text-color': isV3Component }"
    class="absolute top-[-8px] left-[3px] profile-country-list bg-main-background-color text-xs text-[var(--common_input_color)] opacity-100 font-normal transition-[0.3s] duration-[ease] ease-[all] font-inter px-1"
    >{{ placeHolder
    }}<span *ngIf="isFieldRequired" class="text-common-red-color"
      >*</span
    ></small
  >
  <select
    class="px-[10px] border border-input-border-color rounded-md h-[38px] w-full text-[var(--common_input_color)] profile-country-list"
    [ngClass]="{ '!text-secondary-text-color !h-10': isV3Component }"
    (change)="onOptionChange($event)"
    [ngModel]="selectedCountry"
  >
    <option value="" selected disabled>{{ placeHolder }}</option>
    <option
      *ngFor="let item of allowedCountries; trackBy: trackByIndex"
      [value]="item.code"
    >
      {{ item.name }}
    </option>
  </select>
  <p
    *ngIf="invalid"
    class="absolute text-common-red-color text-xs font-medium font-roboto"
  >
    Invalid Country
  </p>
  <span
    *ngIf="isFieldRequired && !selectedCountry"
    class="absolute text-common-red-color text-sm font-normal left-[2px] pl-10 top-[10px] tracking-wider"
  >
    <ng-container *ngFor="let _ of [].constructor(placeHolder.length)"
      >&nbsp;</ng-container
    >*</span
  >
</div>
