<small
  *ngIf="errorMessage"
  class="static-class"
  [class]="marginTopOverride"
  [ngClass]="{
    'mt-1': isMarginTopEnabled,
    'mb-2.5': isMarginBottomEnabled,
    'justify-center': isErrorMessageCentered
  }"
  class="flex items-start gap-1 text-warning-color text-sm font-normal pl-1"
>
  <fa-icon
    class="flex h-4 shrink-0 items-center text-common-red-color text-[12px]"
    [icon]="['fas', 'circle-exclamation']"
    animation="shake"
    size="lg"
    [matTooltip]="tooltip"
  ></fa-icon>
  <p class="text-common-red-color text-xs font-medium font-roboto">
    {{ label ? label : errorMessage ? errorMessage : "This field is required" }}
  </p>
</small>
