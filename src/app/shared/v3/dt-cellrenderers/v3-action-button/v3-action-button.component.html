<div class="pay-button-container">
  <app-common-button-v35
    *ngIf="isButtonClickable"
    width="60px"
    type="list"
    [text]="actionText"
    matTooltip="Proccess Payment"
    (clickEvent)="onPayButtonClick()"
  >
  </app-common-button-v35>
</div>
<button *ngIf="!isButtonClickable" class="button-resize">
  <div class="action-button-container no-select">
    <i
      *ngIf="isCheckIconShown"
      class="fa-solid fa-circle-check"
      matTooltip="Completed"
    ></i>
    <i
      *ngIf="isTimerIconShown"
      matTooltip="Processing"
      class="fa-solid fa-hourglass-half"
    ></i>
    <i
      *ngIf="isCrossIconShown"
      class="fa-solid fa-circle-xmark"
      matTooltip="Canceled"
    ></i>
    <h2>{{ actionText }}</h2>
  </div>
</button>
