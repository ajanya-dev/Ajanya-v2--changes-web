<div
  [style.width]="width + 'px'"
  class="flex items-center gap-1"
  (mouseenter)="showFilterIcon = true"
  (mouseleave)="showFilterIcon = false"
>
  <div class="flex flex-col">
    <p
      class="text-main-text-color font-normal font-roboto text-[13px] leading-4"
      [matTooltip]="param.type === 'payee' ? param.data?.payee_nick_name : ''"
    >
      {{ cellValue }}
    </p>
    @if (createdTime) {
      <span class="text-xs text-secondary-text-color font-inter font-normal">{{
        createdTime
      }}</span>
    }
  </div>
  @if (
    param.type === "payee" &&
    (param.data.qbd_exported || param.data.qbo_exported)
  ) {
    <div [style.order]="isQbIconOnLeft ? -1 : null">
      <img
        [matTooltip]="
          param.data.qbd_exported
            ? 'Exported to Quickbooks Desktop'
            : 'Exported to Quickbooks Online'
        "
        ngSrc="assets/images/integration/qb-logo-stacked.svg"
        alt="QuickBooks logo"
        width="50"
        height="30"
      />
    </div>
  }
  @if (param.type === "payee" && param.data.freshbooks_exported) {
    <div>
      <img
        matTooltip="Exported to FreshBooks"
        ngSrc="assets/images/integration/freshbook.png"
        alt="FreshBooks logo"
        width="20"
        height="10"
      />
    </div>
  }
  @if (showFilterIcon) {
    <div
      role="presentation"
      class="flex justify-center items-center bg-common-secondary-blue-color text-common-blue-color p-1 cursor-pointer"
      (click)="onFilterClicked()"
    >
      <fa-icon class="-my-3" [icon]="faFilterList"></fa-icon>
    </div>
  }
</div>
