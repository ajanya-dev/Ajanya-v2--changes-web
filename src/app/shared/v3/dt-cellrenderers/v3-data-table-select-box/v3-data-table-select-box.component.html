@if (optionResult !== null && optionResult !== undefined) {
  <div
    class="flex items-center pr-2"
    [ngClass]="{ 'border border-common-blue-color rounded': currentValue }"
  >
    <select
      [(ngModel)]="bindedValues"
      (ngModelChange)="onChangeValue()"
      value=""
      class="form-control bg-main-background-color"
      [ngClass]="getCurrentColumn === 'source_type' ? 'source_type' : ''"
    >
      <option selected="selected" value="">All</option>
      @for (value of optionResult; track $index) {
        <option [ngValue]="value.name">
          {{ value.name }}
        </option>
      }
      @if (
        (params.table === "payment_table" ||
          params.tableName === "payee_transaction") &&
        getCurrentColumn === "status"
      ) {
        <optgroup class="!text-main-text-color !font-extrabold" label="Check">
          @for (value of checkStatus; track $index) {
            <option class="!text-secondary-text-color" [ngValue]="value.name">
              {{ value.name }}
            </option>
          }
        </optgroup>
      }
    </select>
    @if (bindedValues) {
      <fa-icon
        (click)="resetFilter()"
        class="text-secondary-text-color cursor-pointer font-black text-sm mb-[-2px]"
        [icon]="faXmark"
      ></fa-icon>
    }
  </div>
}
