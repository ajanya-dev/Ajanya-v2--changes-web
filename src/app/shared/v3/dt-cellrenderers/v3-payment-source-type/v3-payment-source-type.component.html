<div
  class="payment-source-container w-full"
  [ngClass]="{ 'disabled-field': isFieldReadOnly }"
  (click)="$event.stopPropagation()"
>
  <ng-select
    [(ngModel)]="currentPaymentSourceType"
    (ngModelChange)="valueChanged()"
    ngDefaultControl
    class="my-ng-select-class"
    appendTo=".ag-center-cols-container"
    placeholder="Select Source"
    [readonly]="isFieldReadOnly"
    [clearable]="false"
  >
    <ng-option *ngFor="let item of paymentSourceTypes" [value]="item.sourceId">
      {{ item.label }}
    </ng-option>
  </ng-select>
</div>
