<div
  class="flex h-full items-center"
  (mouseenter)="showFilterIconForRow(true)"
  (mouseleave)="showFilterIconForRow()"
>
  <div>
    <button
      class="payment-type-button payment-type-container text-center"
      [ngClass]="[
      dynamicColorScheme, 
      isFieldReadOnly ? 'no-bg' : '', 
      currentPaymentType === 'INTERNATIONAL PAYMENT' ? '!w-fit !max-w-fit' : ''
    ]"
      #dynamicPaymentTypeDropdown="matMenuTrigger"
      mat-icon-button
      [matMenuTriggerFor]="paymentTypeDropdown"
      matTooltip="Change Payment Type"
      [disabled]="isFieldReadOnly"
      (click)="$event.stopPropagation()"
    >
      <h2>{{ currentPaymentType }}</h2>
      @if (!isFieldReadOnly) {
        <fa-icon class="faCaretDown mt-2 mr-2" [icon]="faCaretDown"></fa-icon>
      }
    </button>
    <mat-menu #paymentTypeDropdown="matMenu" class="ocw-meterial-menu">
      <div class="payment-type-dropdown">
        <ul>
          @for (
            paymentOption of this.avaliablePaymentTypes;
            track $index
          ) {
            <li
              role="presentation"
              [class]="paymentOption.id"
              (click)="changePaymentType(paymentOption)"
            >
              <h2>{{ paymentOption.label }}</h2>
            </li>
          }
        </ul>
      </div>
    </mat-menu>
  </div>
  @if (showFilterIcon) {
    <app-common-filter-icon (filterEvent)="onFilterClicked()" />
  }
</div>
