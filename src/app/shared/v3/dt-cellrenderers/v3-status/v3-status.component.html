<div
  class="flex items-center w-full"
  (mouseenter)="showFilterIconForRow(true)"
  (mouseleave)="showFilterIconForRow()"
>
  <div class="flex items-center justify-center">
    <div
      class="font-medium text-[13px] cursor-pointer"
      role="presentation"
      (click)="openStatement()"
      [ngClass]="{ '!cursor-default': isStatementDisable }"
    >
      <span [ngStyle]="{ color: statusProps.color }">{{
        statusProps.status
      }}</span>
    </div>
    <div class="text-common-blue-color pl-3 flex gap-2 cursor-pointer">
      <fa-icon
        *ngIf="areCommentsPresent || isIntHasComments()"
        matTooltip="View Comments"
        [icon]="faMessageExclamation"
        (click)="openCommentModal()"
      ></fa-icon>
      <fa-icon
        *ngIf="areAttachmentsPresent || isIntHasAttachments()"
        matTooltip="View Attachments"
        [icon]="faPaperclip"
        (click)="openAttachmentModal()"
      ></fa-icon>
    </div>
  </div>
  @if (showFilterIcon) {
    <app-common-filter-icon (filterEvent)="onFilterClicked()" />
  }
</div>
