<div
  class="flex gap-1 h-full items-center"
  (mouseenter)="showFilterIcon = true"
  (mouseleave)="showFilterIcon = false"
>
  <div [matTooltip]="payeeNickName" class="min-w-0">
    <span
      #nameElement="ellipsisElement"
      appEllipsisActive
      [matTooltipDisabled]="!nameElement.ellipsisActive"
      matTooltip="{{ payeeName }}"
      class="block truncate"
      >{{ payeeName ?? "No Payee" }}
    </span>
  </div>
  @if (isImportedFromThirdParty) {
    <div class="shrink-0" [style.order]="isQbIconOnLeft ? -1 : null">
      <img
        [ngClass]="[thirdPartyApp?.width, thirdPartyApp?.height]"
        matTooltip="{{ thirdPartyApp?.name }}"
        [ngSrc]="thirdPartyApp?.image"
        alt="Third party logo"
        width="50"
        height="30"
      />
    </div>
  }
  @if (param.data.qbd_exported || param.data.qbo_exported) {
    <div class="shrink-0" [style.order]="isQbIconOnLeft ? -1 : null">
      <img
        [matTooltip]="
          param.data.qbd_exported
            ? 'Exported to Quickbooks Desktop'
            : 'Exported to Quickbooks Online'
        "
        ngSrc="assets/images/integration/qb-logo-stacked.svg"
        alt="QuickBooks logo"
        width="50"
        height="30"
      />
    </div>
  }
  @if (param.data.netsuite_exported===1) {
    <div class="shrink-0" [style.order]="isQbIconOnLeft ? -1 : null">
      <img
        matTooltip="Exported to NetSuite"
        ngSrc="assets/images/integration/oracle-netsuite.png"
        alt="NetSuite logo"
        width="50"
        height="30"
      />
    </div>
  }
  @if (param.data.freshbooks_exported) {
    <div class="shrink-0">
      <img
        matTooltip="Exported to FreshBooks"
        ngSrc="assets/images/integration/freshbook.png"
        alt="FreshBooks logo"
        width="20"
        height="10"
      />
    </div>
  }
  @if (showFilterIcon && !isHideFilter) {
    <div
      role="presentation"
      class="flex shrink-0 justify-center items-center bg-common-secondary-blue-color text-common-blue-color p-1 cursor-pointer"
      (click)="onFilterClicked()"
    >
      <fa-icon class="-my-3" [icon]="faFilterList"></fa-icon>
    </div>
  }
</div>
