<div class="v3-dt-wallet-type-drop-down-wrapper w-[175px]">
  <ng-select
    [searchable]="false"
    (change)="onChange($event)"
    (clear)="clear()"
    class="ng-select-wallet-type bg-main-background-color wallet-type-dropdown-dt w-[175px]"
    placeholder="All"
    [(ngModel)]="text"
    appendTo="body"
    #ngSelect
    (open)="onOpen()"
    (close)="onClose()"
  >
    @for (item of walletDataService.walletTransactionTypes; track item) {
      <ng-option [value]="item.subject_type">
        {{ item.name }}
      </ng-option>
    }
  </ng-select>
</div>
