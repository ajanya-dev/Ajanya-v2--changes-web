<div class="flex gap-1 items-center w-full"
(mouseenter)="showFilterIconForRow(true)"
(mouseleave)="showFilterIconForRow()">
<div class="flex flex-col gap-1">
  <h2 class="pt-1" [ngClass]="{ 'pt-2': !timeUpdatedAt }" 
  [ngClass]="{ '!text-v4-main-text-color': isV4(), '!font-peridot': isV4(),'!text-xs': isV4() }"
  >
    {{ dateUpdatedAt }}
  </h2>
  @if(timeUpdatedAt){
    <h3 class="pt-px !text-xs"
    [ngClass]="{ '!text-v4-secondary-text-color': isV4(), '!font-peridot': isV4(),'!text-xs': isV4() }"
    >{{ timeUpdatedAt }}</h3>
  }
</div>
@if (showFilterIcon && !disableFilter) {
  <app-common-filter-icon (filterEvent)="onFilterClicked()" />
}
</div>
