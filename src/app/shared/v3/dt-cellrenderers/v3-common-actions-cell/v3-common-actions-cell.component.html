@if (versionType() === 'v4') {
  <div class="main">
    <div class="eye_btn">
     @if(agGridCellRendererParams.onView) {
       <lucide-icon  (click)="onView()" name="eye" [size]="14" [matTooltip]="'View'"></lucide-icon>
     }
     </div>
     <div class="delete_btn">
       @if(agGridCellRendererParams.onDelete) {
         <lucide-icon (click)="onDelete()" name="trash-2" [size]="14" [matTooltip]="'Delete'"></lucide-icon>
       }
     </div>
  </div>
}@else {
  <div class="flex items-center gap-2">
    @if(agGridCellRendererParams.onView) {
      <fa-icon class="cursor-pointer" (click)="onView()" [icon]="faEye" [matTooltip]="'View'"></fa-icon>
    }
    @if(agGridCellRendererParams.onDelete) {
      <fa-icon class="cursor-pointer text-common-red-color" (click)="onDelete()" [icon]="faTrash" [matTooltip]="'Delete'"></fa-icon>
    }
  </div>
}
