<div
  class="flex gap-1 items-center w-full !pl-1"
  (mouseenter)="showFilterIconForRow(true)"
  (mouseleave)="showFilterIconForRow()"
>
  <div
    class="mode-of-transfer-container border-none rounded"
    [ngClass]="dynamicColorScheme"
  >
    <h2 class="px-1">
      {{
        commonTransactionTableRowData?.transfer_mode ||
          commonTransactionTableRowData?.transfer_type
      }}
    </h2>
  </div>
  @if (showFilterIcon) {
    <app-common-filter-icon (filterEvent)="onFilterClicked()" />
  }
</div>
