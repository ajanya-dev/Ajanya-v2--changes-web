<div class="flex" [ngClass]="[stepperGap]">
  <div
    class="flex flex-col gap-2"
    [ngClass]="[stepperWidth]"
    *ngFor="let item of stepperHeaders; let i = index"
  >
    <h1 class="font-roboto flex gap-3 text-sm font-medium text-main-text-color">
      {{ item }}
      <span *ngIf="showIcon">
        <fa-icon [icon]="icons"></fa-icon>
      </span>
    </h1>
    <div>
      <div
        [ngClass]="[
          currentStepperTabIndex > i ? '!bg-common-green-color' : '',
          currentStepperTabIndex === i ? selectedStepperColor : stepperColor
        ]"
        class="h-[6px] rounded-[10px]"
      ></div>
    </div>
  </div>
</div>
