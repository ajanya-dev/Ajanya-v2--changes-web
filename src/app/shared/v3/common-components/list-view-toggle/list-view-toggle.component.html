<div
  class="h-5 flex rounded border-x-2 border-secondary-background-color bg-secondary-background-color text-secondary-text-color justify-center items-center gap-1"
>
  <fa-icon
    (click)="gridView()"
    tabindex="0"
    class="px-[3px] rounded-sm text-xs hover:bg-main-background-color cursor-pointer"
    [icon]="['fas', 'grid-2']"
    [ngClass]="{
      'bg-main-background-color text-main-text-color cursor-auto shadow-lg':
        isGridView
    }"
  ></fa-icon>
  <fa-icon
    (click)="listView()"
    tabindex="0"
    class="px-[3px] rounded-sm text-xs hover:bg-main-background-color cursor-pointer"
    [icon]="['fas', 'list-ul']"
    [ngClass]="{
      'bg-main-background-color text-main-text-color cursor-auto shadow-lg':
        !isGridView
    }"
  ></fa-icon>
</div>
