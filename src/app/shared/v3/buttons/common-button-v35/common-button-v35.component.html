<button
  class="block"
  [class]="
    customClasses +
    (!disableHoverEffect ? ' hover:shadow-common-button ocw-btn' : '')
  "
  [style]="styles"
  (click)="onClick()"
  [disabled]="loading || disabled"
  [matTooltip]="toolTip ? toolTip : ''"
  [matTooltipClass]="toolTipClass ? toolTipClass : ''"
  [id]="buttonId()"
  [type]="btnType()"
>
  <div class="flex justify-center items-center gap-1">
    @if (isAddIcon) {
      <fa-icon [icon]="icon"></fa-icon>
    }
    <span
      [style]="{ color: textColor }"
      [ngClass]="textClasses() || 'text-class'"
      >{{ text }}</span
    >
    @if (suffix) {
      <fa-icon [icon]="suffixIcon"></fa-icon>
    }
    @if (loading) {
      <span
        class="loadingSpinner after:border-x-transparent"
        [ngClass]="loadingSpinnerClass"
      ></span>
    }
  </div>
</button>
