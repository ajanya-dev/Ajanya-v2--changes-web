<div
  class="flex justify-center cursor-pointer items-center h-10 bg-common-secondary-blue-color rounded relative"
  [style.width]="inputWidth"
  role="presentation"
  (click)="chooseImage(uploadedFileHTMLInput)"
  [ngClass]="{
    'bg-tertiary-background-color': uploadedFile?.name,
    'border border-common-blue-color border-dashed': isDrageFile || isHovered
  }"
  (dragover)="handleDragOver($event)"
  (dragleave)="handleDragLeave($event)"
  (drop)="handleDrop($event)"
  (mouseenter)="handleMouseEnter()"
  (mouseleave)="handleMouseLeave()"
>
  @if (uploadedFile === null || !uploadedFile?.name) {
    <div
      [matTooltip]="buttonText?.length > 50 ? buttonText : ''"
      class="w-full px-2 text-center"
    >
      @if (!isHovered) {
        <fa-icon
          class="text-common-blue-color text-sm font-medium"
          [icon]="['fas', 'up-to-line']"
        ></fa-icon>
      }
      <span
        class="pl-1 text-common-blue-color text-sm font-medium font-roboto"
        >{{
          isHovered
            ? "Choose File or Drag and Drop"
            : (buttonText | truncate: 50)
        }}</span
      >
    </div>
  } @else {
    <div class="flex w-full px-3 justify-between">
      <div class="flex gap-2 items-baseline">
        <fa-icon
          class="text-common-green-color"
          [icon]="['fas', 'circle-check']"
        ></fa-icon>
        <span
          class="font-roboto font-normal text-main-text-color"
          [matTooltip]="uploadedFile.name?.length > fileNameMaxLength ? uploadedFile.name : ''"
          >{{ uploadedFile.name | truncate: fileNameMaxLength }}</span
        >
      </div>
      <div class="flex gap-2">
        <fa-icon
          *ngIf="isPreviewNeed || isCustomePreviewNeed"
          class="cursor-pointer text-main-text-color"
          [icon]="['fas', 'eye']"
          role="presentation"
          matTooltip="Preview"
          (click)="previewImage()"
        ></fa-icon>
        <fa-icon
          class="cursor-pointer text-main-text-color"
          [icon]="['fas', 'xmark']"
          (click)="removeImage(uploadedFileHTMLInput, $event)"
          role="presentation"
        ></fa-icon>
      </div>
    </div>
  }

  <input
    [id]="inputId"
    class="hidden"
    (change)="imagePicked($event)"
    type="file"
    [accept]="acceptedFileTypes"
    #uploadedFileHTMLInput
    title="fileUpload"
  />
  <!--Here top-[-8px] Used for move this div to top of parent div-->
  <div
    *ngIf="uploadedFile?.name && buttonHeader"
    class="bg-main-background-color absolute left-3 top-[-8px] text-secondary-text-color font-roboto font-normal text-xs"
  >
    {{ buttonHeader }}
  </div>
</div>
