@if (hasStates() || loading()) {
  <div
    class="angular-ocw-v35-ng-select-dropdown relative ocw-location-select"
    [style.width]="width()"
  >
    <ng-select
      class="ng-dropdown-panel-v35 text-sm"
      [ngClass]="controlClass()"
      appendTo="body"
      [items]="stateList()"
      bindLabel="name"
      [bindValue]="bindValue() === 'name' ? 'name' : 'code'"
      [clearable]="clearable()"
      [loading]="loading()"
      [disabled]="isDisabled()"
      [placeholder]="placeholder()"
      [required]="isRequired()"
      [ngModel]="displayValue()"
      [ngModelOptions]="{ standalone: true }"
      (ngModelChange)="onValueChange($event)"
      (open)="onPanelOpen()"
      (close)="onPanelClose()"
    >
      <!-- Show the full name on hover (native tooltip), even when not truncated. -->
      <ng-template ng-option-tmp let-item="item">
        <span class="block w-full truncate" [attr.title]="item.name">{{
          item.name
        }}</span>
      </ng-template>
    </ng-select>
    <app-control-message-v35
      [control]="ngControl?.control"
    ></app-control-message-v35>
  </div>
} @else {
  <!-- No states for this country: free-text input, wrapped so a caller's [controlClass] height helper still applies. -->
  <div class="angular-ocw-v35-ng-select-dropdown" [style.width]="width()">
    <input
      type="text"
      class="input_style"
      [ngClass]="controlClass()"
      [placeholder]="placeholder()"
      [maxlength]="maxLength()"
      [disabled]="isDisabled()"
      [ngModel]="value()"
      [ngModelOptions]="{ standalone: true }"
      (ngModelChange)="onValueChange($event)"
    />
    <app-control-message-v35
      [control]="ngControl?.control"
    ></app-control-message-v35>
  </div>
}
