<div class="px-[6px] pb-[6px]">
  <!-- modal header -->
  <div class="flex justify-between pb-6">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
        <span class="pl-1 font-inter font-semibold text-base pb-0.5"
          >Request a Free Callback</span
        >
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      ></fa-icon>
    </div>
  </div>
  <!-- modal body start -->
  <div class="flex flex-col gap-2 justify-center items-center">
    <div class="pb-6">
      <p
        class="text-main-text-color text-base font-inter font-semibold text-center"
      >
        Please enter your phone number.<br />We will call you now
      </p>
    </div>
    <form [formGroup]="callForm">
      <div class="phone-country-drop-down">
        <app-new-phone-input
          formControlName="phoneNumber"
          (countryDropdown)="countryChange($event)"
          (countryCodeEmit)="countryCodeChange($event)"
          dropdownWidth="250px"
        />
        <app-control-message-v35 [control]="callForm.controls.phoneNumber" />
      </div>
    </form>
    <div class="pt-7 pb-1">
      <app-common-button-v35
        width="255px"
        [type]="{ style: 'modal', name: 'main' }"
        text="CALL ME NOW"
        (clickEvent)="submit()"
        [disabled]="loading"
        [loading]="loading"
      />
    </div>
    @if (supportNo) {
      <a
        class="text-main-text-color font-inter font-medium text-sm"
        href="tel:{{ supportNo }}"
        ><span class="pr-1 text-main-text-color font-inter font-normal text-xs"
          >Call us anytime on</span
        >{{ supportNo }}</a
      >
    }
  </div>
</div>
