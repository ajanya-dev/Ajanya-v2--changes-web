<div class="ocw_man_modal_wrapper">
  <div class="ocw_modal_header flex justify-between items-baseline">
    <div class="ocw_modal_title">Statement</div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="['fas', 'xmark']"
      ></fa-icon>
    </div>
  </div>

  <div class="ocw_modal_body">
    <div class="ocw_table_wrapper">
      <table class="ocw-table ocw-table-striped">
        <thead>
          <tr>
            <td>Date</td>
            <td>Status</td>
            <td>Description</td>
          </tr>
        </thead>

        <tbody>
          @for (item of statements; track $index) {
            <tr>
              <td>{{ item.created_at }}</td>
              <td>{{ item.status }}</td>
              <td>{{ item.description }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
