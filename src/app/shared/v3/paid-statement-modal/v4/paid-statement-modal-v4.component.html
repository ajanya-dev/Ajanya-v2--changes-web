<div class="flex flex-col font-funnel rounded-2xl overflow-hidden">
  <!-- HEADER -->
  <div
    class="flex justify-between items-center px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
      Statement
    </h1>
    <div
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
      [mat-dialog-close]="false"
    >
      <lucide-icon
        [img]="XIcon"
        class="text-v4-subtle-text-color"
        [size]="18"
      />
    </div>
  </div>

  <!-- BODY -->
  <div class="px-6 py-6 bg-v4-tertiary-background-color">
    <div class="overflow-x-auto rounded-xl border border-v4-border-color">
      <table class="w-full text-sm">
        <thead>
          <tr
            class="bg-v4-secondary-background-color text-v4-secondary-text-color"
          >
            <td class="px-4 py-3 font-medium">Date</td>
            <td class="px-4 py-3 font-medium">Status</td>
            <td class="px-4 py-3 font-medium">Description</td>
          </tr>
        </thead>

        <tbody>
          @for (item of statements; track $index) {
            <tr
              class="border-t border-v4-border-color text-v4-main-text-color hover:bg-v4-secondary-background-color"
            >
              <td class="px-4 py-3">{{ item.created_at }}</td>
              <td class="px-4 py-3">{{ item.status }}</td>
              <td class="px-4 py-3">{{ item.description }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
