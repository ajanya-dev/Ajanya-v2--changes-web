<div class="relative">
  <input
    #commonInput
    class="input_style px-[10px] border border-input-border-color rounded-md h-10 w-full text-main-text-color"
    [style.height]="fieldHeight()"
    [ngClass]="{
      'border-common-red-color': !inputValue.value,
      '!pr-10': showInfoIcon(),
      '!opacity-50': disabled
    }"
    [readonly]="readOnly"
    [type]="type"
    [formControl]="inputValue"
    id="{{ inputId ? inputId : placeholder }}"
    (blur)="onTouched($event)"
    (keypress)="isNumberOnly && !customMask ? utils.numberOnly($event, numberType,isAllowHyphen) : undefined"
    (keydown)="preventCharacter($event)"
    [maxlength]="maxLength ? maxLength : ''"
    [mask]="customMask"
    (input)="onInput(commonInput)"
    (focus)="onFocus(commonInput)"
    (focusout)="onFocusOut(commonInput)"
    [thousandSeparator]="customMask === 'separator.2' ? ',' : undefined"
    placeholder=" "
    [max]="type === 'date' && maxDate ? maxDate : undefined"
    [min]="type === 'date' && minDate ? minDate : undefined"
    [disabled]="disabled"
    [autocomplete]="autocomplete()"
  />
  <div
    class="absolute left-3 text-secondary-text-color transition-all duration-200 flex"
    [ngClass]="{
      'top-[10px] text-sm':
        (isNumberOnly
          ? inputValue.value === null || inputValue.value === ''
          : !inputValue.value) && type !== 'date',
      'top-[-9px] text-xs bg-main-background-color':
        (isNumberOnly
          ? inputValue.value !== null && inputValue.value !== ''
          : inputValue.value) || type === 'date'
    }"
  >
    <label class="cursor-text" for="{{ inputId ? inputId : placeholder }}">{{
      placeholder
    }}</label>
    <h4 *ngIf="isFieldRequired" class="text-common-red-color">*</h4>
  </div>
  <div
    class="absolute top-[1px] right-[1px] h-[38px] w-[38px] bg-secondary-background-color rounded-[0px_5px_5px_0px] border-l border-input-border-color"
    *ngIf="isCalculator"
  >
    <div
      role="presentation"
      class="flex justify-center items-center w-full h-full cursor-pointer"
      (click)="openCalculator()"
    >
      <fa-icon
        class="text-secondary-text-color"
        [icon]="['fas', 'calculator']"
      ></fa-icon>
    </div>
  </div>
  @if(showInfoIcon()){
    <div class="absolute inset-y-0 right-0 flex items-center pr-3">
      <span class="text-gray-500 cursor-pointer" [matTooltip]="tooltip()">
        <fa-icon
        class="text-common-blue-color"
        [icon]="faInfo"
      />
      </span>
    </div>
  }
</div>

<app-control-message-v35
  [control]="control"
  [isMarginTopEnabled]="false"
  marginTopOverride="mt-1"
></app-control-message-v35>
