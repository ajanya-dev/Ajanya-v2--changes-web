<app-common-input-v4
  [fieldLabel]="label()"
  [placeholder]="placeholder()"
  [control]="control()"
  [formControl]="$any(control())"
  [maxLength]="maxLength()"
  [isFieldRequired]="isFieldRequired()"
  [inputId]="inputId()"
  [readOnly]="readOnly()"
  [isInvalid]="isInvalid()"
  autocomplete="off"
  (inputFocusEvent)="onFocus($event)"
  (inputFocusOutEvent)="onBlur()"
/>
