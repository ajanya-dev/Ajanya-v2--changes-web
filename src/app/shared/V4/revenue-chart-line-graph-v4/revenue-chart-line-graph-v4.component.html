<div
  #chartHost
  class="relative flex h-full flex-col rounded-lg border border-v4-border-color bg-v4-secondary-background-color p-4 shadow-sm"
>
  <!-- Header -->
  <div class="mb-4 flex items-start justify-between">
    <div>
      <h3 class="text-sm font-bold text-foreground">{{ title() }}</h3>
      <p class="mt-1 text-xs text-muted-foreground">{{ subtitle() }}</p>
    </div>
    @if (trendLabel(); as label) {
      <div
        class="flex items-center gap-1 rounded-full px-2.5 py-1 text-xs font-semibold"
        [class.bg-green-100]="(trendPercentage() ?? 0) >= 0"
        [class.text-green-700]="(trendPercentage() ?? 0) >= 0"
        [class.bg-red-100]="(trendPercentage() ?? 0) < 0"
        [class.text-red-700]="(trendPercentage() ?? 0) < 0"
      >
        <lucide-icon
          [name]="
            (trendPercentage() ?? 0) >= 0 ? 'trending-up' : 'trending-down'
          "
          [size]="12"
        ></lucide-icon>
        {{ label }}
      </div>
    }
  </div>

  <!-- Chart area -->
  <div class="relative min-h-[300px] flex-1">
    @if (isLoading()) {
      <div class="absolute inset-0 flex flex-col gap-3 animate-pulse">
        <div class="flex-1 rounded-md bg-gray-100"></div>
        <div class="flex justify-center gap-6">
          <div class="h-3 w-14 rounded-full bg-gray-100"></div>
          <div class="h-3 w-14 rounded-full bg-gray-100"></div>
        </div>
      </div>
    }
    <div
      class="absolute inset-0"
      [ngClass]="{
        'opacity-0': isLoading(),
        'pointer-events-none': isLoading()
      }"
    >
      <canvas #chartCanvas></canvas>
    </div>
  </div>

  <!-- Legend -->
  <div
    class="mt-3 flex items-center justify-center gap-6 pt-2"
    [ngClass]="{ 'opacity-0': isLoading(), 'pointer-events-none': isLoading() }"
  >
    <div class="flex items-center gap-2">
      <div class="h-3 w-3 rounded-full bg-v4-common-green-color"></div>
      <span class="text-xs font-medium text-foreground">Paid</span>
    </div>
    <div class="flex items-center gap-2">
      <div class="h-3 w-3 rounded-full bg-v4-common-blue-color"></div>
      <span class="text-xs font-medium text-foreground">Pending</span>
    </div>
  </div>

  <!-- Custom tooltip -->
  <div
    #tooltipEl
    class="pointer-events-none absolute z-10 opacity-0 transition-opacity duration-150"
    style="transform: translate(-50%, calc(-100% - 8px))"
  >
    <ng-container #tooltipAnchor></ng-container>
  </div>
</div>

<ng-template #tooltipTpl let-month="month" let-rows="rows">
  <div class="chart-tooltip">
    <p class="chart-tooltip__title">{{ month }}</p>
    <div class="chart-tooltip__body">
      @for (r of rows; track r.label) {
        <div class="chart-tooltip__row">
          <div class="chart-tooltip__row-label">
            <span
              class="chart-tooltip__dot"
              [style.background-color]="r.color"
            ></span>
            <span class="chart-tooltip__label">{{ r.label }}</span>
          </div>
          <span class="chart-tooltip__amount">{{ r.amount }}</span>
        </div>
      }
    </div>
  </div>
</ng-template>
