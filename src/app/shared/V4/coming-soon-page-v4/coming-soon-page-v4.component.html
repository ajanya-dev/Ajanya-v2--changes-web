<div class="flex items-center justify-center w-full min-h-[calc(100vh-200px)]">
  <div class="flex flex-col items-center text-center px-6 py-10 max-w-[540px]">
    <!-- Animated Rocket Illustration -->
    <div class="animate-float mb-8">
      <div class="relative">
        <!-- Main icon container -->
        <div class="rocket-circle">
          <lucide-icon
            [img]="icons.rocket"
            [size]="48"
            style="color: var(--v4-secondary-brand-color); transform: rotate(45deg); display: flex"
          ></lucide-icon>
        </div>

        <!-- Sparkle circle -->
        <div class="sparkle-circle animate-pulse-sparkle">
          <lucide-icon
            [img]="icons.sparkles"
            [size]="16"
            style="color: var(--v4-primary-brand-color)"
          ></lucide-icon>
        </div>

        <!-- Decorative circle -->
        <div
          class="decorative-circle animate-pulse-sparkle"
          style="animation-delay: 0.5s"
        ></div>
      </div>
    </div>

    <!-- Title -->
    <h1 class="text-2xl font-bold text-v4-main-text-color font-funnel mb-3">
      Coming Soon!
    </h1>

    <!-- Subtitle -->
    <p
      class="text-sm text-v4-secondary-text-color font-funnel leading-relaxed mb-8 max-w-[440px]"
    >
      {{ subtitle }}
    </p>

    <!-- Buttons -->
    <div class="flex items-center gap-3">
      <app-common-button-v4
        [type]="{ style: 'outline', name: 'main' }"
        text="Go Back"
        lucideIcon="arrow-left"
        (clickEvent)="goBack()"
      />
      <app-common-button-v4
        [type]="{ style: 'primary', name: 'main' }"
        text="Go Home"
        lucideIcon="home"
        (clickEvent)="goHome()"
      />
    </div>
  </div>
</div>
