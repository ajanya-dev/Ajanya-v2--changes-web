<div
  class="relative flex flex-col h-full rounded-xl overflow-hidden border border-v4-border-color bg-v4-secondary-background-color p-3 md:p-4 shadow-sm"
>
  @if (loading()) {
    <div class="relative z-10">
      <div class="min-h-[2rem] md:min-h-[2.25rem] flex items-start">
        <div class="shimmer h-3 w-24 mt-1"></div>
      </div>
      <div class="shimmer h-7 w-28"></div>
    </div>
  } @else {
  @if (card().showDollarIcon) {
    <div class="absolute top-3 right-3 md:top-4 md:right-4 w-8 h-8 rounded-sm flex items-center justify-center"
      [ngClass]="iconBgClass(card().valueColor)">
      <lucide-icon [img]="dollarSignIcon" [size]="14" class="shrink-0" />
    </div>
  }
  <div class="relative z-10">
    <p
      class="text-[12px] md:text-xs font-semibold uppercase text-v4-tertiary-text-color min-h-[2rem] md:min-h-[2.25rem]"
    >
      {{ card().title }}
    </p>
    @if (card().comingSoon) {
      <span
        class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[12px] font-bold bg-v4-primary-brand-color text-white mt-1"
      >
        <img
          [ngSrc]="'assets/images/v4-icons/coming-soon-badge-v4.svg'"
          width="10"
          height="10"
          alt="Coming Soon"
          class="w-2.5 h-2.5"
        />
        Coming Soon
      </span>
    } @else {
      <p
        class="text-xl md:text-2xl font-bold tabular-nums"
        [ngClass]="valueColorClass(card().valueColor)"
      >
        {{ card().primaryValue }}
      </p>

      <p
        class="text-[12px] md:text-xs tabular-nums mt-1"
        [ngClass]="
          card().secondaryMuted || card().valueColor === 'neutral'
            ? 'text-v4-tertiary-text-color'
            : valueColorClass(card().valueColor)
        "
      >
        {{ card().secondaryValue }}
      </p>
    }
  </div>
  }
</div>
