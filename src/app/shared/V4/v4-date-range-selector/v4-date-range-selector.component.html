<button
  [ngClass]="width()"
  class="flex items-center justify-between px-3 gap-2 cursor-pointer border border-v4-input-border-color rounded-sm text-sm text-v4-secondary-text-color bg-v4-secondary-background-color hover:border-v4-primary-brand-color transition-colors h-[44px]"
  (click)="toggleDateRange(); $event.stopPropagation()"
  cdkOverlayOrigin
  #trigger="cdkOverlayOrigin"
>
  <span class="truncate font-peridot">
    {{
      selectedDateRangeName === "Custom"
        ? ((startDate | date) ?? "") + " - " + ((endDate | date) ?? "")
        : selectedDateRangeName
    }}
  </span>
  <lucide-icon
    [img]="CalendarDaysIcon"
    [size]="15"
    class="text-v4-subtle-text-color flex-shrink-0"
  />
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="isOpen"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  (backdropClick)="onBackdropClick($event)"
  (detach)="isOpen = false"
>
  <div
    class="date-range-dropdown"
    tabindex="-1"
    (click)="$event.stopPropagation()"
    (keydown.enter)="$event.stopPropagation()"
    (keydown.space)="$event.stopPropagation()"
  >
    <div class="flex items-stretch bg-v4-popup-background-color">
      <!-- Quick select list -->
      <div
        class="flex flex-col border-r border-v4-border-color py-2 min-w-[130px]"
      >
        @for (item of dateRanges; track item.id) {
          <button
            class="px-4 py-2 text-sm text-left font-peridot hover:bg-v4-tertiary-background-color transition-colors w-full"
            [ngClass]="
              item.name === selectedDateRangeName
                ? 'bg-v4-insight-card-border-blue text-v4-primary-brand-bold-color font-semibold'
                : 'text-v4-main-text-color'
            "
            (click)="selectDateRange(item.id)"
          >
            {{ item.name }}
          </button>
        }
      </div>

      <!-- From / To inputs -->
      <div class="flex flex-col justify-between p-4 gap-4 w-full">
        <div class="flex flex-col gap-4">
          <div class="flex flex-col gap-1.5">
            <span
              class="text-xs font-medium text-v4-tertiary-text-color font-peridot"
              >From</span
            >
            <app-v4-date-picker
              placeholder="From"
              [fieldHeight]="'32px'"
              [isFieldRequired]="false"
              [ngModel]="getFormatedDate(startDate)"
              (ngModelChange)="onFromDateChange($event)"
            />
          </div>
          <div class="flex flex-col gap-1.5">
            <span
              class="text-xs font-medium text-v4-tertiary-text-color font-peridot"
              >To</span
            >
            <app-v4-date-picker
              placeholder="To"
              [fieldHeight]="'32px'"
              [isFieldRequired]="false"
              [ngModel]="getFormatedDate(endDate)"
              (ngModelChange)="onToDateChange($event)"
            />
          </div>
        </div>

        <div class="flex gap-2 justify-end">
          <app-common-button-v4
            [type]="{ style: 'outline', name: 'main' }"
            text="Clear"
            width="80px"
            (clickEvent)="resetFilter()"
          />
          <app-common-button-v4
            [type]="{ style: 'primary', name: 'main' }"
            text="Done"
            width="80px"
            (clickEvent)="customFilter()"
          />
        </div>
      </div>
    </div>
  </div>
</ng-template>
