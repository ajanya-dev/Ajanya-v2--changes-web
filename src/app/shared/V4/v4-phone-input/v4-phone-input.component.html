<!--
  min-w-0 + w-full are critical at narrow breakpoints (~1024px md grid).
  Without min-w-0 the inner <input> defaults to min-width: auto and
  refuses to shrink below its intrinsic content width, causing the
  whole phone input to overflow its parent column. The same min-w-0
  rule has to be applied to the <input> child below for the flex
  shrink to actually take effect.
-->
<div
  class="relative flex w-full min-w-0 border border-v4-input-border-color rounded-[10px] focus-within:border-v4-brand-border-color transition-colors"
  [ngClass]="{
    'bg-v4-popup-background-color shadow-sm focus-within:ring-2 focus-within:ring-v4-brand-border-color': variant() === 'default',
    'h-[44px] bg-v4-secondary-background-color': variant() === 'compact'
  }"
  [ngClass]="{
    'border-common-red-color': control()?.touched && control()?.invalid,
    'opacity-50 pointer-events-none': isDisabled
  }"
  [style.min-height]="fieldHeight()"
  cdkOverlayOrigin
  #trigger="cdkOverlayOrigin"
>
  <!-- Country selector -->
  @if (showCountryDropdown()) {
    <button
      type="button"
      class="flex items-center gap-1 px-2 border-r border-v4-input-border-color rounded-l-[10px] bg-transparent hover:bg-v4-tertiary-background-color transition-colors shrink-0"
      (click)="toggleDropDown()"
    >
      <img
        [src]="currentCountryURL || selectedCountry?.flage_url"
        alt="flag"
        class="w-5 h-5 rounded-full object-cover"
      />
      <lucide-icon
        [img]="showDropDown ? ChevronUpIcon : ChevronDownIcon"
        [size]="12"
        class="text-v4-subtle-text-color"
      />
    </button>
  }

  <!-- Phone number input -->
  @if (isPhoneValueLoading) {
    <div class="flex-1 min-w-0 px-3 flex items-center" [style.min-height]="fieldHeight()">
      <div class="phone-skeleton h-4 w-28"></div>
    </div>
  } @else {
    <input
      type="tel"
      autocomplete="off"
      [class]="
        'flex-1 min-w-0 w-full px-3 bg-transparent text-sm text-v4-main-text-color placeholder:text-v4-tertiary-text-color font-peridot focus:outline-none ' +
        (fieldHeight() === '32px' ? 'py-1' : 'py-2.5') +
        ' ' +
        (showCountryDropdown() ? 'rounded-r-[10px]' : 'rounded-[10px]')
      "
      [mask]="currentCountryMask"
      [placeholder]="placeholder() + (isFieldRequired() ? ' *' : '')"
      [(ngModel)]="phoneNumber"
      (ngModelChange)="onInput()"
      (blur)="onTouched()"
      (paste)="onPaste($event)"
      (keydown)="preventInvalidInput($event)"
      [readOnly]="isReadOnly()"
    />
  }
</div>

<!-- V4 validation message -->
<app-control-message-v4
  [control]="control()"
  [isMarginTopEnabled]="false"
  [marginTopOverride]="'mt-1'"
  [customMessages]="customMessages()"
/>

<!-- Country dropdown overlay -->
<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="showCountryDropdown() && showDropDown"
  [cdkConnectedOverlayHasBackdrop]="true"
  [cdkConnectedOverlayBackdropClass]="'cdk-overlay-transparent-backdrop'"
  (backdropClick)="toggleDropDown()"
>
  <div
    class="bg-v4-popup-background-color border border-v4-input-border-color rounded-[10px] shadow-common-box-shadow flex flex-col gap-2 p-3 z-50"
    [style.width]="dropdownWidth()"
  >
    <!-- Search -->
    <app-common-input-v4
      #searchInputRef
      placeholder="Search"
      [isFieldRequired]="false"
      [(ngModel)]="searchInput"
    />

    <!-- Country list -->
    <div class="max-h-52 overflow-y-auto flex flex-col gap-0.5">
      @for (
        country of countryList | searchFilter: searchInput;
        track country.code
      ) {
        <div
          role="button"
          tabindex="0"
          class="flex items-center gap-3 px-3 py-2 rounded-lg cursor-pointer hover:bg-v4-tertiary-background-color transition-colors text-sm text-v4-main-text-color"
          (click)="selectCountry(country)"
          (keydown.enter)="selectCountry(country)"
        >
          <img
            [src]="country.flage_url"
            alt=""
            class="w-6 h-6 rounded-full object-cover shrink-0"
          />
          <span>{{ country.name }} {{ country.dial_code }}</span>
        </div>
      }
    </div>
  </div>
</ng-template>
