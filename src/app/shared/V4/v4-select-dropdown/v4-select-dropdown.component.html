<div
  class="v4-common-dropdown"
  [ngClass]="{ compact: compact }"
  cdkOverlayOrigin
  #trigger="cdkOverlayOrigin"
  #triggerEl
>
  <button
    type="button"
    (click)="toggleDropdown()"
    class="flex items-center gap-1"
    [class.w-full]="!autoWidth"
    [ngClass]="{ 'opacity-50 pointer-events-none': isDisabled }"
    [ngStyle]="extraStyle"
  >
    <span
      class="flex-1 text-left truncate"
      [ngClass]="
        displayText() ? 'text-v4-tertiary-text-color' : 'text-v4-subtle-text-color'
      "
    >
      {{ displayText() || placeholder }}
    </span>
    @if (clearable && displayText()) {
      <lucide-icon
        name="x"
        role="button"
        tabindex="0"
        [size]="compact ? 12 : 14"
        class="text-v4-subtle-text-color hover:text-v4-main-text-color cursor-pointer"
        (click)="clearSelection($event)"
        (keydown.enter)="clearSelection($event)"
      ></lucide-icon>
    }
    <lucide-icon
      name="chevron-down"
      [size]="compact ? 12 : 14"
      class="text-v4-subtle-text-color transition-transform"
      [ngClass]="isOpen ? 'rotate-180' : ''"
    ></lucide-icon>
  </button>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="trigger"
    [cdkConnectedOverlayOpen]="isOpen"
    [cdkConnectedOverlayHasBackdrop]="true"
    cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
    (backdropClick)="closeDropdown()"
    [cdkConnectedOverlayPositions]="overlayPositions"
    [cdkConnectedOverlayMinWidth]="overlayWidth"
    [cdkConnectedOverlayWidth]="autoWidth ? undefined : overlayWidth"
  >
    <div
      class="v4-common-dropdown-panel w-full box-border"
      [ngClass]="[compact ? 'compact' : '', panelClass]"
    >
      <div class="overflow-y-auto max-h-[240px]">
        @if (loading) {
          <div
            class="flex items-center justify-center gap-2 px-3 py-4 text-sm text-v4-subtle-text-color"
          >
            <lucide-icon name="loader-circle" [size]="14" class="animate-spin" />
            Loading…
          </div>
        } @else {
        @for (option of items; track option.id) {
          <div
            role="button"
            tabindex="0"
            class="v4-dropdown-item gap-2"
            [class.selected]="_selectedValue() === option.value"
            [class.disabled]="option.disabled"
            (click)="selectItem(option)"
            (keydown.enter)="selectItem(option)"
            (keydown.space)="selectItem(option); $event.preventDefault()"
          >
            <span [class.truncate]="!autoWidth" [class.whitespace-nowrap]="autoWidth">{{ option.name }}</span>
            @if (_selectedValue() === option.value) {
              <lucide-icon
                name="check"
                [size]="compact ? 12 : 14"
                class="ml-auto"
              ></lucide-icon>
            }
          </div>
        } @empty {
          <div class="px-3 py-4 text-sm text-center text-v4-tertiary-text-color">
            {{ emptyMessage }}
          </div>
        }
        }
      </div>
    </div>
  </ng-template>
</div>
