<button
  class="block"
  [class]="
    customClasses() +
    compactClass() +
    v21Class() +
    outlineMainClass() +
    (!disableHoverEffect() ? ' hover:shadow-common-button ocw-btn' : '') +
    (hoverStyle() ? ' btn-custom-hover' : '')
  "
  [style]="styles()"
  [style.--btn-hover-bg]="hoverStyle()?.bgColor"
  [style.--btn-hover-text]="hoverStyle()?.textColor"
  (click)="onClick()"
  [disabled]="loading() || disabled()"
  [attr.aria-label]="accessibleName() ?? null"
  [matTooltip]="toolTip() ? toolTip() : ''"
  [matTooltipClass]="toolTipClass() ? toolTipClass() : ''"
  [id]="buttonId()"
  [type]="btnType()"
>
  <div
    class="flex justify-center items-center overflow-hidden"
    [ngClass]="{ 'gap-1': text() !== '' }"
  >
    @if (iconPosition() === "start") {
      @if (lucideIcon()) {
        <lucide-angular
          [name]="lucideIcon()"
          [size]="lucideIconSize()"
          [class.animate-spin]="spinIconOnLoading() && loading()"
        />
      } @else if (isAddIcon()) {
        <fa-icon [icon]="icon()"></fa-icon>
      }
    }
    @if (text()) {
      <span
        [style]="{ color: textColor }"
        [ngClass]="textClasses() || 'text-class'"
        class="whitespace-nowrap overflow-hidden text-ellipsis"
        >{{ text() }}</span
      >
    }
    @if (iconPosition() === "end") {
      @if (lucideIcon()) {
        <lucide-angular
          [name]="lucideIcon()"
          [size]="lucideIconSize()"
          [class.animate-spin]="spinIconOnLoading() && loading()"
        />
      } @else if (isAddIcon()) {
        <fa-icon [icon]="icon()"></fa-icon>
      }
    }
    @if (suffix()) {
      <fa-icon [icon]="suffixIcon()"></fa-icon>
    }
    @if (loading() && !(spinIconOnLoading() && lucideIcon())) {
      <lucide-icon
        [img]="LoaderCircleIcon"
        [size]="16"
        class="animate-spin"
        [style.color]="textColor"
      ></lucide-icon>
    }
  </div>
</button>
