<div class="angular-ocw-v4-ng-select-dropdown relative" [ngClass]="fontClass()">
  <ng-select
    [(ngModel)]="selectedItem"
    [items]="categories"
    bindLabel="name"
    (scrollToEnd)="onScrollToEnd()"
    (keyup)="search($event)"
    (change)="getChange($event)"
    (open)="onOpen()"
    (close)="onDropdownClose()"
    (clear)="clear()"
    class="ng-dropdown-panel-v4 text-sm"
    placeholder="{{ placeholder() }}"
    [class]="'height-' + customHeight()"
    dropdownPosition="{{ dropdownPosition() }}"
    [appendTo]="appendTo()"
    [ngStyle]="{ 'z-index': zIndex() }"
    [searchable]="true"
    [searchFn]="searchFn"
  >
    <ng-template ng-header-tmp>
      @if (enableAddNew()) {
        <button
          type="button"
          (click)="getChange('add-new')"
          class="w-full px-3 py-2 mb-1 flex items-center gap-3 rounded-lg border-2 border-dashed border-v4-secondary-brand-color bg-v4-secondary-background-color text-left cursor-pointer hover:bg-v4-badge-success-bg-color transition-colors"
        >
          <div
            class="flex h-8 w-8 items-center justify-center rounded bg-v4-badge-success-bg-color text-v4-common-green-color shrink-0"
          >
            <lucide-icon [img]="PlusIcon" [size]="18"></lucide-icon>
          </div>
          <div class="min-w-0">
            <div
              class="font-peridot font-medium text-sm text-v4-badge-success-text-color truncate"
            >
              New Category
            </div>
            <div
              class="font-peridot text-xs text-v4-common-green-color truncate"
            >
              Add a new category
            </div>
          </div>
        </button>
      }
    </ng-template>
    <ng-template ng-option-tmp let-item="item">
      <div class="v4-option-row min-w-full flex items-center py-2">
        <div
          class="mr-3 flex h-9 w-9 items-center justify-center rounded-lg bg-v4-badge-info-bg-color text-v4-primary-brand-color shrink-0"
        >
          <lucide-icon [img]="LayersIcon" [size]="18"></lucide-icon>
        </div>
        <div
          class="flex-1 truncate min-w-0 text-sm font-medium text-v4-main-text-color"
        >
          {{ item.name }}
        </div>
      </div>
    </ng-template>
    <ng-template ng-label-tmp let-item="item">
      <div class="min-w-0 flex flex-col">
        <div
          class="font-peridot font-medium text-sm text-v4-main-text-color truncate"
        >
          {{ item.name }}
        </div>
      </div>
    </ng-template>
  </ng-select>
  @if (!selectedItem && showInfoIcon()) {
    <span
      class="tooltip-question-icon absolute"
      [matTooltip]="
        '• Organize payment for your records.\n• Helps with expense tracking/taxes.'
      "
      matTooltipPosition="before"
      [matTooltipShowDelay]="300"
    >
      <lucide-icon
        class="text-v4-tertiary-text-color"
        [img]="InfoIcon"
        [size]="14"
      />
    </span>
  }
</div>
