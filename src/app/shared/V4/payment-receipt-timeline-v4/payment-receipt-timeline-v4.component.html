<div
  class="flex h-full flex-col overflow-hidden rounded-lg border border-v4-border-color bg-v4-secondary-background-color px-4 py-4 shadow-sm"
>
  @if (variant() === "comingSoon") {
    <!-- Header -->
    <div>
      <h3 class="text-sm font-bold text-v4-main-text-color">{{ title() }}</h3>
    </div>

    <!-- Coming Soon — no chart -->
    <div class="flex flex-1 items-center justify-center">
      <app-coming-soon-card-v4 [title]="'Coming Soon'" [description]="''" />
    </div>
  } @else {
    <!-- Header -->
    <div
      class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between"
    >
      <div>
        <h3 class="text-sm font-bold text-v4-main-text-color">
          {{ title() }}
        </h3>
        <p class="mt-1 text-xs text-v4-secondary-text-color">
          {{ description() }}
        </p>
      </div>
      <div class="flex items-center gap-2">
        <div
          class="flex items-center gap-2 rounded-md p-2 bg-v4-main-background-color"
        >
          <button
            class="toggle-segment"
            [class.active]="activeMode() === 'count'"
            (click)="setMode('count')"
          >
            # Count
          </button>
          <button
            class="toggle-segment"
            [class.active]="activeMode() === 'amount'"
            (click)="setMode('amount')"
          >
            $ Amount
          </button>
        </div>
        <div
          class="on-time-badge rounded-lg px-2.5 py-1.5 flex items-center gap-1.5"
        >
          <lucide-icon name="trending-up" [size]="14" />
          <span class="text-xs font-bold">
            {{ data().onTimePercent }}% On-time
          </span>
        </div>
      </div>
    </div>
    <!-- Chart -->
    <div class="relative min-h-[250px] flex-1">
      <div class="absolute inset-0">
        <canvas #chartCanvas></canvas>
      </div>
    </div>
    <!-- Legend -->
    <div class="mt-3 border-t border-v4-border-color pt-1">
      <div class="flex justify-around">
        <div class="text-center payment-legend-early">
          <div class="mb-1 flex items-center justify-center gap-1.5">
            <lucide-icon name="trending-down" [size]="12" />
            <span class="text-xs font-medium text-text-foreground">Early</span>
          </div>
          <span class="text-lg font-bold legend-amount">{{
            data().earlyAmount
          }}</span>
        </div>
        <div class="text-center payment-legend-ontime">
          <div class="mb-1 flex items-center justify-center gap-1.5">
            <lucide-icon name="circle-check" [size]="12" />
            <span class="text-xs font-medium text-text-foreground"
              >On-time</span
            >
          </div>
          <span class="text-lg font-bold legend-amount">{{
            data().onTimeAmount
          }}</span>
        </div>
        <div class="text-center payment-legend-late">
          <div class="mb-1 flex items-center justify-center gap-1.5">
            <lucide-icon name="trending-up" [size]="12" />
            <span class="text-xs font-medium text-text-foreground">Late</span>
          </div>
          <span class="text-lg font-bold legend-amount">{{
            data().lateAmount
          }}</span>
        </div>
      </div>
    </div>
  }
</div>
