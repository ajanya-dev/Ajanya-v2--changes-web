@if (variant() === "toggle") {
  <div
    class="grid p-1 bg-v4-secondary-background-color rounded-lg border border-v4-border-color"
    [style.grid-template-columns]="'repeat(' + tabs().length + ', 1fr)'"
  >
    @for (tab of tabs(); track tab.value) {
      <button
        class="toggle-tab flex justify-center gap-2 py-2.5 px-4 rounded-lg text-sm font-semibold transition-all"
        [class.items-center]="!tab.description"
        [class.items-start]="tab.description"
        [class.active]="activeTab() === tab.value"
        [class.opacity-40]="tab.disabled"
        [class.cursor-not-allowed]="tab.disabled"
        [class.pointer-events-none]="tab.disabled"
        (click)="selectTab(tab.value)"
        [style.height]="height()"
      >
        @if (tab.lucideIcon) {
          <lucide-icon
            [name]="tab.lucideIcon"
            [size]="15"
            [class.mt-0.5]="tab.description"
          />
        } @else if (tab.icon) {
          <fa-icon
            [icon]="tab.icon"
            class="text-xs"
            [class.mt-1]="tab.description"
          ></fa-icon>
        }
        @if (tab.description) {
          <span class="flex min-w-0 flex-col items-start text-left">
            <span>{{ tab.label }}</span>
            <span class="tab-description text-xs font-normal">{{
              tab.description
            }}</span>
          </span>
        } @else {
          <span>{{ tab.label }}</span>
        }
      </button>
    }
  </div>
}

@if (variant() === "pill") {
  <div
    class="flex gap-2"
    [class.flex-wrap]="!noWrap()"
    [class.flex-nowrap]="noWrap()"
  >
    @for (tab of tabs(); track tab.value) {
      <button
        class="pill-tab px-4 py-1.5 rounded-sm text-xs font-semibold transition-all flex items-center justify-center"
        [class.active]="activeTab() === tab.value"
        [class.opacity-40]="tab.disabled"
        [class.cursor-not-allowed]="tab.disabled"
        [class.pointer-events-none]="tab.disabled"
        (click)="selectTab(tab.value)"
        [style.height]="height()"
      >
        @if (tab.lucideIcon) {
          <lucide-icon [name]="tab.lucideIcon" [size]="14" class="mr-1" />
        } @else if (tab.icon) {
          <fa-icon [icon]="tab.icon" class="mr-1"></fa-icon>
        }
        <span>{{ tab.label }}</span>
      </button>
    }
  </div>
}

@if (variant() === "flat") {
  <div class="inline-flex gap-0.5">
    @for (tab of tabs(); track tab.value) {
      <button
        class="flat-tab px-3 py-1.5 rounded-md text-sm font-medium transition-all"
        [class.active]="activeTab() === tab.value"
        [class.opacity-40]="tab.disabled"
        [class.cursor-not-allowed]="tab.disabled"
        [class.pointer-events-none]="tab.disabled"
        (click)="selectTab(tab.value)"
        [style.height]="height()"
      >
        @if (tab.icon) {
          <fa-icon [icon]="tab.icon" class="mr-1 text-xs"></fa-icon>
        }
        <span>{{ tab.label }}</span>
      </button>
    }
  </div>
}

@if (variant() === "underline") {
  <div
    class="flex gap-6 border-b border-v4-border-color overflow-x-auto underline-tab-container"
    [class.gap-4]="!justified()"
    [ngClass]="{'!border-none' : borderNone()}"
  >
    @for (tab of tabs(); track tab.value) {
      <button
        class="underline-tab flex items-center gap-1.5 pb-3 font-semibold transition-all relative whitespace-nowrap shrink-0"
        [class]="size() === 'xs' ? 'text-xs' : 'text-sm'"
        [class.active]="activeTab() === tab.value"
        (click)="selectTab(tab.value)"
      >
        @if (tab.lucideIcon) {
          <lucide-icon [name]="tab.lucideIcon" [size]="14" />
        } @else if (tab.icon) {
          <fa-icon [icon]="tab.icon" class="text-xs"></fa-icon>
        }
        <span>{{ tab.label }}</span>
      </button>
    }
  </div>
}
