<header class="v4-page-header">
  @if (showBackButton()) {
    <button
      type="button"
      class="flex items-center justify-center w-8 h-8 rounded-lg border border-v4-border-color bg-v4-secondary-background-color text-v4-main-text-color cursor-pointer hover:bg-v4-tertiary-background-color transition-colors"
      (click)="goBack()"
    >
      <lucide-icon name="arrow-left" [size]="16" />
    </button>
  }
  <ng-content select="[headerLead]"></ng-content>
  <div class="v4-page-header__titles">
    <h1 class="v4-page-header__title">
      <!-- The h1 stretches to the column width; the span keeps the tooltip's
           hover target on the text itself. -->
      <span [matTooltip]="titleToolTip()" matTooltipPosition="below">{{
        title()
      }}</span>
    </h1>
    @if (subtitle()) {
      <span class="v4-page-header__subtitle">{{ subtitle() }}</span>
    }
  </div>
  <div class="v4-page-header__actions">
    @for (action of actions(); track action.id) {
      @if (!action.menu) {
        <app-common-button-v4
          [type]="buttonType(action)"
          [text]="action.text"
          [lucideIcon]="action.lucideIcon"
          [lucideIconSize]="15"
          [isAddIcon]="action.isAddIcon ?? false"
          [icon]="action.icon ?? ['fas', 'plus']"
          [disabled]="action.disabled ?? false"
          [loading]="action.loading ?? false"
          [toolTip]="action.toolTip ?? ''"
          (clickEvent)="actionClick.emit(action.id)"
        />
      } @else {
        <app-common-button-v4
          mat-button
          [matMenuTriggerFor]="actionMenu"
          [type]="buttonType(action)"
          [text]="action.text"
          [lucideIcon]="action.lucideIcon"
          [lucideIconSize]="15"
          [isAddIcon]="action.isAddIcon ?? false"
          [icon]="action.icon ?? ['fas', 'plus']"
          [suffix]="true"
          [disabled]="action.disabled ?? false"
          [loading]="action.loading ?? false"
          [toolTip]="action.toolTip ?? ''"
        />
        <mat-menu #actionMenu="matMenu" class="v4-action-menu">
          @for (item of action.menu; track item.id) {
            <button mat-menu-item (click)="actionClick.emit(item.id)">
              <div class="flex items-center gap-2">
                @if (item.lucideIcon) {
                  <lucide-icon
                    [name]="item.lucideIcon"
                    [size]="14"
                    class="inline-flex shrink-0"
                  ></lucide-icon>
                }
                <span>{{ item.name }}</span>
              </div>
            </button>
          }
        </mat-menu>
      }
    }
    <ng-content select="[headerActions]"></ng-content>
  </div>
</header>
