<div class="flex items-center justify-center w-full min-h-[calc(100vh-200px)]">
  <div class="flex flex-col items-center text-center px-6 py-10 max-w-[540px]">
    <!-- Image -->
    <img
      class="w-[280px] mb-8"
      src="../../../assets/images/page-not-found.svg"
      alt="Page Not Found"
    />

    <!-- Title -->
    <h1 class="text-2xl font-bold text-v4-main-text-color font-funnel mb-3">
      Page Not Found
    </h1>

    <!-- Description -->
    <p
      class="text-sm text-v4-secondary-text-color font-funnel leading-relaxed mb-8 max-w-[440px]"
    >
      We're sorry, the page you requested could not be found. Please go back to
      the home page or try navigating from the menu.
    </p>

    <!-- Buttons -->
    <div class="flex items-center gap-3">
      <app-common-button-v4
        [type]="{ style: 'primary', name: 'main' }"
        text="Go Home"
        lucideIcon="home"
        (clickEvent)="goHome()"
      />
      <app-common-button-v4
        [type]="{ style: 'outline', name: 'main' }"
        text="Go Back"
        lucideIcon="arrow-left"
        (clickEvent)="goBack()"
      />
    </div>
  </div>
</div>
