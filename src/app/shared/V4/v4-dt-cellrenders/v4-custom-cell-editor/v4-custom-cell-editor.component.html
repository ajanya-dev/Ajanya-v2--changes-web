<div class="v4-cell-editor">
  @if (params.colDef.headerName === 'Amount') {
    <input
      class="v4-input-style v4-cell-editor__input"
      [(ngModel)]="value"
      mask="separator.2"
      thousandSeparator=","
      (keydown)="onChange($event)"
      (keypress)="utils.numberOnly($event, 'decimal')"
    />
  } @else {
    <input
      class="v4-input-style v4-cell-editor__input"
      [(ngModel)]="value"
      (keydown)="onChange($event)"
    />
  }

  @if (isUpdate()) {
    <span class="v4-cell-editor__action" matTooltip="Updating..">
      <lucide-icon
        class="v4-cell-editor__spinner"
        name="loader-circle"
        [size]="12"
      ></lucide-icon>
    </span>
  } @else {
    <span
      role="presentation"
      class="v4-cell-editor__action v4-cell-editor__action--clickable"
      matTooltip="Update"
      (click)="update()"
    >
      <lucide-icon name="check" [size]="12"></lucide-icon>
    </span>
  }
</div>
