<div
  class="angular-ocw-v4-ng-select-dropdown angular-v4-multi-dropdown-filter  w-full"
  [matTooltip]="selectedNamesString"
>
  <ng-select
    (scrollToEnd)="onScrollToEnd()"
    (focus)="onSearch($event)"
    (keyup)="onSearch($event)"
    (change)="onChange()"
    (clear)="clear()"
    appendTo=".ag-root-wrapper"
    panelClass="v4-filter-dropdown-panel"
    [placeholder]="placeholder"
    dropdownPosition="bottom"
    [multiple]="true"
    [closeOnSelect]="false"
    [formControl]="selectedItemsControl"
    [searchable]="showSearch"
    [notFoundText]="permissionDenied() ? 'Permission Denied' : 'No items found'"
    #ngSelect
    (open)="showSearch = true"
    (close)="showSearch = false"
    [ngClass]="{ 'border border-v4-primary-brand-color rounded-md': selectedItemsControl.value }"
    class="ng-dropdown-panel-v4 text-sm height-1"
  >
    @for (item of items(); track item.id; let index = $index) {
      <ng-option [value]="item">
        <ng-template
          ng-option-tmp
          let-item="item"
          let-item$="item$"
          let-index="index"
        >
          <div class="flex items-center gap-2 py-0.5">
            <input
              class="h-4 w-4 shrink-0 accent-[var(--v4-primary-brand-color)]"
              id="item-{{ index }}"
              type="checkbox"
              [ngModel]="item$.selected"
            />
            <span class="truncate text-sm text-v4-main-text-color">{{ getDisplayName(item) }}</span>
          </div>
        </ng-template>
      </ng-option>
    }

    @if (!showSearch) {
      <ng-template ng-multi-label-tmp let-items="items">
        @if (items.length === 1) {
          <span class="truncate text-v4-main-text-color block" style="font-size: 11px; max-width: 90%;">
            {{ getDisplayName(items[0]) }}
          </span>
        } @else {
          <span class="text-v4-main-text-color whitespace-nowrap" style="font-size: 11px;">
            Selected: {{ items.length }}
          </span>
        }
      </ng-template>
    } @else {
      <ng-template ng-multi-label-tmp let-items="items">
        <div class="selected-items"></div>
      </ng-template>
    }

    <ng-template ng-footer-tmp>
      <div class="flex justify-center">
        <button
          (click)="applyFilter()"
          class="px-4 py-1.5 bg-v4-primary-brand-color text-v4-secondary-brand-color text-xs font-semibold rounded-lg transition-colors hover:opacity-90"
        >
          Apply
        </button>
      </div>
    </ng-template>
  </ng-select>
</div>
