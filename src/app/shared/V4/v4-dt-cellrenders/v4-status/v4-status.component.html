<div
  class="flex items-center w-full gap-1"
  (mouseenter)="showFilterIconForRow(true)"
  (mouseleave)="showFilterIconForRow()"
>
  <div class="flex items-center gap-2">
    <span
      class="status-badge"
      [style.background-color]="statusBadge.bgColor"
      [style.color]="statusBadge.textColor"
      [title]="statusBadge.title ?? ''"
      [class.cursor-pointer]="statusMode === 'payments'"
      [class.status-badge--clickable]="isClickable"
      (click)="statusMode === 'payments' ? openStatement() : null"
    >
      {{ statusBadge.status }}
    </span>

    @if (statusMode === "check-draft") {
      @if (statusIcon()?.attachment === 1) {
        <div class="dt-cell-edit-btn">
          <lucide-icon
            name="paperclip"
            [size]="16"
            matTooltip="View Attachments"
            (click)="addAttachmentCheckDraft()"
          />
        </div>
      }
      @if (statusIcon()?.comment === 1) {
        <div class="dt-cell-edit-btn">
          <lucide-icon
            name="message-square"
            [size]="16"
            matTooltip="View Comments"
            (click)="addCommentCheckDraft()"
          />
        </div>
      }
    } @else {
      @if (areCommentsPresent) {
        <div class="dt-cell-edit-btn">
          <lucide-icon
            name="message-square"
            [size]="16"
            matTooltip="View Comments"
            (click)="openCommentModal()"
          />
        </div>
      }
      @if (areAttachmentsPresent) {
        <div class="dt-cell-edit-btn">
          <lucide-icon
            name="paperclip"
            [size]="16"
            matTooltip="View Attachments"
            (click)="openAttachmentModal()"
          />
        </div>
      }
    }
  </div>

  @if (showFilterIcon) {
    <app-common-filter-icon (filterEvent)="onFilterClicked()" />
  }
</div>
