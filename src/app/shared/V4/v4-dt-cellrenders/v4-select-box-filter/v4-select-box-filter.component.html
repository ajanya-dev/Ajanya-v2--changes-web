@if (optionResult.length) {
  <div class="v4-select-filter relative flex items-center w-full">
    <select
      [(ngModel)]="bindedValues"
      (ngModelChange)="onChangeValue()"
      class="v4-select"
      [class.has-value]="bindedValues"
    >
      <option selected value="">All</option>
      @for (value of optionResult; track $index) {
        <option [ngValue]="value.name">{{ value.name }}</option>
      }
    </select>
    @if (bindedValues) {
      <button
        (click)="resetFilter(); $event.stopPropagation()"
        class="clear-btn"
      >
        <lucide-icon [img]="XIcon" [size]="12" />
      </button>
    }
  </div>
}
