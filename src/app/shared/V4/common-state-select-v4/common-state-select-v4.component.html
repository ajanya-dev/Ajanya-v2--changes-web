@if (hasStates() || loading()) {
  <div
    class="angular-ocw-v4-ng-select-dropdown relative ocw-location-select"
    [style.width]="width()"
  >
    <ng-select
      class="ng-dropdown-panel-v4 text-sm"
      [ngClass]="controlClass()"
      appendTo="body"
      [dropdownPosition]="dropdownPosition()"
      [items]="stateList()"
      bindLabel="name"
      [bindValue]="bindValue() === 'name' ? 'name' : 'code'"
      [clearable]="clearable()"
      [loading]="loading()"
      [disabled]="isDisabled()"
      [placeholder]="placeholder()"
      [required]="isRequired()"
      [ngModel]="displayValue()"
      [ngModelOptions]="{ standalone: true }"
      (ngModelChange)="onValueChange($event)"
      (open)="onPanelOpen()"
      (close)="onPanelClose()"
    >
      <!-- Show the full name on hover (native tooltip), even when not truncated. -->
      <ng-template ng-option-tmp let-item="item">
        <span class="block w-full truncate" [attr.title]="item.name">{{
          item.name
        }}</span>
      </ng-template>
    </ng-select>
    <app-control-message-v4
      [control]="ngControl?.control"
    ></app-control-message-v4>
  </div>
} @else {
  <!-- No states for this country: free-text input using the shared v4 input field. -->
  <div [style.width]="width()">
    <app-common-input-v4
      [placeholder]="placeholder()"
      [isFieldRequired]="isRequired()"
      [maxLength]="maxLength()"
      [disabled]="isDisabled()"
      [control]="ngControl?.control"
      [ngModel]="value()"
      [ngModelOptions]="{ standalone: true }"
      (ngModelChange)="onValueChange($event)"
    ></app-common-input-v4>
  </div>
}
