<div
  class="px-3 py-2 border-b border-v4-border-color bg-v4-secondary-background-color"
>
  @if (isSwitchOption()) {
    <!-- Header + View Toggle (only shown when view switch is needed) -->
    <div class="flex justify-between items-center mb-2">
      <h1 class="font-semibold text-sm text-foreground">
        {{ header() }}
      </h1>
      <div class="flex items-center gap-1">
        <button aria-label="Grid view"
          class="p-1 rounded"
          [class]="
            isGridView
              ? 'text-v4-primary-brand-color'
              : 'text-v4-tertiary-text-color'
          "
          matTooltip="Grid view"
          (click)="viewToggle(true)"
        >
          <lucide-icon name="layout-grid" [size]="16" />
        </button>
        <button aria-label="List view"
          class="p-1 rounded"
          [class]="
            !isGridView
              ? 'text-v4-primary-brand-color'
              : 'text-v4-tertiary-text-color'
          "
          matTooltip="List view"
          (click)="viewToggle(false)"
        >
          <lucide-icon name="list" [size]="16" />
        </button>
      </div>
    </div>
  }

  <!-- Search Input + Add Button -->
  <div class="flex items-center gap-2">
    <div class="relative flex-1">
      <!-- Search icon -->
      <span
        class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none flex items-center text-v4-subtle-text-color"
      >
        <lucide-icon name="search" [size]="14" />
      </span>

      <!-- Clear (X) icon -->
      @if (searchInput) {
        <button aria-label="Clear search"
          type="button"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-v4-subtle-text-color hover:text-v4-main-text-color cursor-pointer"
          matTooltip="Clear search"
          (click)="clearSearch($event)"
        >
          <lucide-icon name="x" [size]="12" />
        </button>
      }

      <input
        type="text"
        class="w-full rounded-lg border border-v4-input-border-color bg-v4-secondary-background-color text-xs text-v4-main-text-color pl-10 pr-3 py-3 placeholder:text-v4-subtle-text-color focus:outline-none focus:ring-1 focus:ring-v4-primary-brand-color/50 focus:border-v4-primary-brand-color"
        [disabled]="loading()"
        [(ngModel)]="searchInput"
        (ngModelChange)="fetchSearchData()"
        [placeholder]="searchPlaceholder()"
      />
    </div>

    @if (isAddButton()) {
      <button [attr.aria-label]="(addButtonTooltip()) || null"
        class="h-11 w-11 flex items-center justify-center rounded-lg bg-v4-primary-brand-color text-v4-secondary-brand-color hover:bg-v4-primary-brand-color/80 transition-colors disabled:opacity-20 disabled:pointer-events-none shrink-0"
        [disabled]="disabled()"
        (click)="buttonClick()"
        [matTooltip]="addButtonTooltip()"
        type="button"
      >
        <lucide-icon name="plus" [size]="18" />
      </button>
    }
  </div>
</div>
