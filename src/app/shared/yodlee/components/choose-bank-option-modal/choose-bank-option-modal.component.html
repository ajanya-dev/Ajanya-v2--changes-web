<div class="choose-bank-option" [ngClass]="isModel ? '' : 'padding-customcom'">
  <div class="flex justify-end">
    <div
      class="close-icon-container flex justify-center items-center"
      mat-dialog-close
      *ngIf="isModel"
    >
      <i class="fa-light fa-xmark close-icon"></i>
    </div>
  </div>
  <div class="flex justify-center">
    <div class="header">Found accounts from previously connected bank</div>
  </div>
  <div class="flex justify-center margin py-1 px-5 mx-5">
    <div class="detail">
      Do you want to add a bank account from previously connected bank? or
      connect a new bank?
    </div>
  </div>
  <div class="bank-list py-3 px-3 mx-6 my-2">
    <div
      class="bankac-item flex items-center p-1 mb-2"
      *ngFor="let item of accountsArray"
      (click)="bankAcItemClicked(item)"
    >
      <div class="mx-1"><i class="fal fa-university icon"></i></div>

      <div class="mx-1 bank_name">
        {{ item.accountName | slice: 0 : 15
        }}<span *ngIf="item.accountName?.length > 15">..</span>
      </div>
      <div class="mx-1 acc_no ml-auto">
        ({{
          item.hiddenAccountNumber
            ? item.hiddenAccountNumber
            : item.hiddenFullAccountNumber
        }})
      </div>
    </div>
    <!-- <div class="flex items-center" *ngIf="accountsArray.length>3">
            <i class="fa-light fa-ellipsis trailing-icon"></i>
        </div> -->
  </div>
  <div class="flex flex-col items-center buttons-wrapper py-3">
    <button
      type="submit"
      class="ocw-btn ocw-btn-dark-blue mx-2 justify-center"
      (click)="onAddFromConnectedBankClicked()"
    >
      Add from Connected Bank
    </button>
    <div class="flex my-2 items-center">
      <div class="lineL"></div>
      <div class="or-label mx-2">OR</div>
      <div class="lineR"></div>
    </div>
    <button
      type="submit"
      class="ocw-btn ocw-btn-dark-green mx-2 justify-center"
      (click)="onConnectNewBankClicked()"
    >
      Connect New Bank
    </button>
  </div>
</div>
