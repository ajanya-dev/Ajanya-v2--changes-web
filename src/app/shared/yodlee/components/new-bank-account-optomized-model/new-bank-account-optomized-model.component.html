<div
  class="ocw_man_modal_wrapper add_bank_modal"
  [ngClass]="isComponent ? 'component-main' : ''"
>
  <form [formGroup]="bankForm" (ngSubmit)="submit()">
    <div class="ocw_modal_header">
      <div class="ocw_modal_title">Add New Bank Account</div>
      <div class="close_btn" [mat-dialog-close]="false" *ngIf="!isComponent">
        <svg
          aria-hidden="true"
          focusable="false"
          data-prefix="fal"
          data-icon="times"
          class="svg-inline--fa fa-times fa-w-10"
          role="img"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 320 512"
        >
          <path
            fill="currentColor"
            d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
          ></path>
        </svg>
      </div>
    </div>
    <div class="text-sm instruction flex pt-2">
      <span><i class="fa-solid fa-circle-info mr-2"></i></span>
      <span
        >Kindly make sure that all the account information is accurately entered
        to facilitate the payment process.</span
      >
    </div>
    <!-- modal body start -->
    <div class="ocw_modal_body">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
        <div class="single_input">
          <input
            type="text"
            formControlName="bankRoutingNumber"
            (keyup)="lookupRoutingNumber($event)"
            (keypress)="utils.numberOnly($event, 'numeric')"
            class="input_style"
            placeholder=" "
            autofocus="off"
            maxlength="9"
          />
          <span class="floating_label_field"
            >Routing Number <span class="required">*</span></span
          >
          <app-control-message
            [control]="bankForm.controls.bankRoutingNumber"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="bankAccountNumber"
            class="input_style require_fields"
            id="AccNumber"
            mask="0000000000000000000000"
            [patterns]="customPattern"
            [hiddenInput]="true"
            maxlength="20"
            placeholder=" "
            (keypress)="utils.numberOnly($event, 'numeric')"
            (copy)="(false)"
            (cut)="(false)"
            (focus)="onFocus()"
            (blur)="onBlur()"
          />
          <label class="floating_label_field"
            >Account Number <span class="required">*</span></label
          >
          <app-control-message
            [control]="bankForm.controls.bankAccountNumber"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="confirmAccountNumber"
            class="input_style require_fields"
            id="AccNumber"
            maxlength="20"
            placeholder=" "
            (keypress)="utils.numberOnly($event, 'numeric')"
            (paste)="(false)"
          />
          <label class="floating_label_field"
            >Confirm Account Number <span class="required">*</span></label
          >
          <app-control-message
            [control]="bankForm.controls.confirmAccountNumber"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="bankAccountName"
            class="input_style"
            id="AccName"
            maxlength="60"
            (keypress)="backtickDesble($event)"
            placeholder=" "
          />
          <label class="flex floating_label_field input-with-info items-center"
            >Name on Account<span class="required">*</span>
            <span
              mat-raised-button
              matTooltipPosition="right"
              matTooltip="Exactly as in your bank statement. If not matching, the wire may be returned."
              class="example-button cursor-pointer"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
                focusable="false"
                data-prefix="fas"
                data-icon="question-circle"
                class="svg-inline--fa fa-question-circle fa-w-16"
                role="img"
                viewBox="0 0 512 512"
              >
                <path
                  fill="currentColor"
                  d="M504 256c0 136.997-111.043 248-248 248S8 392.997 8 256C8 119.083 119.043 8 256 8s248 111.083 248 248zM262.655 90c-54.497 0-89.255 22.957-116.549 63.758-3.536 5.286-2.353 12.415 2.715 16.258l34.699 26.31c5.205 3.947 12.621 3.008 16.665-2.122 17.864-22.658 30.113-35.797 57.303-35.797 20.429 0 45.698 13.148 45.698 32.958 0 14.976-12.363 22.667-32.534 33.976C247.128 238.528 216 254.941 216 296v4c0 6.627 5.373 12 12 12h56c6.627 0 12-5.373 12-12v-1.333c0-28.462 83.186-29.647 83.186-106.667 0-58.002-60.165-102-116.531-102zM256 338c-25.365 0-46 20.635-46 46 0 25.364 20.635 46 46 46s46-20.636 46-46c0-25.365-20.635-46-46-46z"
                /></svg
            ></span>
          </label>
          <app-control-message
            [control]="bankForm.controls.bankAccountName"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="bankAccountNickName"
            class="input_style require_fields"
            id="nickName"
            (keypress)="backtickDesble($event)"
            maxlength="60"
            placeholder=" "
          />
          <label class="floating_label_field"
            >Nick Name <span class="required">*</span></label
          >
          <app-control-message
            [control]="bankForm.controls.bankAccountNickName"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="bankAccountAddressLine1"
            maxlength="150"
            class="input_style require_fields"
            id="AccAddress"
            placeholder=" "
            #bankHolderAddressSearch
            (change)="isShowAddressSections = true"
            (focus)="loadGoogleAddress(bankHolderAddressSearch)"
          />
          <label class="floating_label_field"
            >Address Line 1 <span class="required">*</span></label
          >
          <app-control-message
            [control]="bankForm.controls.bankAccountAddressLine1"
          ></app-control-message>
        </div>

        <div class="single_input" *ngIf="isShowAddressSections">
          <input
            type="text"
            formControlName="bankAccountAddressLine2"
            class="input_style require_fields"
            maxlength="100"
            id="AccAddress"
            placeholder=" "
          />
          <label class="floating_label_field">Address Line 2 (optional)</label>
          <app-control-message
            [control]="bankForm.controls.bankAccountAddressLine2"
          ></app-control-message>
        </div>

        <ng-container *ngIf="isShowAddressSections">
          <div class="single_input">
            <input
              type="text"
              formControlName="bankAccountCity"
              class="input_style require_fields"
              id="AccCity"
              maxlength="100"
              placeholder=" "
            />
            <label class="floating_label_field"
              >City <span class="required">*</span></label
            >
            <app-control-message
              [control]="bankForm.controls.bankAccountCity"
            ></app-control-message>
          </div>

          <div class="single_input">
            <input
              type="text"
              formControlName="bankAccountState"
              class="input_style require_fields"
              id="AccState"
              maxlength="100"
              placeholder=" "
            />
            <label class="floating_label_field"
              >State <span class="required">*</span></label
            >
            <app-control-message
              [control]="bankForm.controls.bankAccountState"
            ></app-control-message>
          </div>

          <div class="single_input">
            <input
              type="text"
              formControlName="bankAccountZip"
              class="input_style require_fields"
              id="AccZip"
              maxlength="10"
              placeholder=" "
            />
            <label class="floating_label_field"
              >Zip <span class="required">*</span>
            </label>
            <app-control-message
              [control]="bankForm.controls.bankAccountZip"
            ></app-control-message>
          </div>
        </ng-container>
      </div>

      <ng-container *ngIf="bankForm.controls.bankRoutingNumber.value !== ''">
        <h3 class="sec_from_head">Bank Details</h3>

        <div class="input_group bank_detail">
          <div class="single_input">
            <input
              type="text"
              formControlName="bankName"
              maxlength="50"
              class="input_style require_fields"
              id="bankName"
              (keypress)="backtickDesble($event)"
              placeholder=" "
            />
            <label class="floating_label_field"
              >Bank Name <span class="required">*</span></label
            >
            <app-control-message
              [control]="bankForm.controls.bankName"
            ></app-control-message>
          </div>

          <div class="single_input">
            <input
              type="text"
              formControlName="bankAddress1"
              class="input_style"
              id="bankAddress"
              maxlength="150"
              placeholder=" "
              #BankAddressSearch
              (focus)="loadBankGoogleAddress(bankHolderAddressSearch, 0)"
            />
            <label class="floating_label_field"
              >Street Address <span class="required">*</span></label
            >
            <app-control-message
              [control]="bankForm.controls.bankAddress1"
            ></app-control-message>
          </div>

          <div class="single_input">
            <input
              type="text"
              formControlName="bankCity"
              class="input_style"
              id="bankCity"
              placeholder=" "
              maxlength="50"
            />
            <label class="floating_label_field"
              >City <span class="required">*</span></label
            >
            <app-control-message
              [control]="bankForm.controls.bankCity"
            ></app-control-message>
          </div>

          <div class="single_input">
            <input
              type="text"
              formControlName="bankState"
              class="input_style"
              id="bankState"
              placeholder=" "
              maxlength="100"
            />
            <label class="floating_label_field"
              >State <span class="required">*</span></label
            >
            <app-control-message
              [control]="bankForm.controls.bankState"
            ></app-control-message>
          </div>

          <div class="single_input">
            <input
              type="text"
              formControlName="bankZip"
              class="input_style"
              id="bankZip"
              placeholder=" "
              maxlength="10"
            />
            <label class="floating_label_field"
              >Zip <span class="required">*</span></label
            >
            <app-control-message
              [control]="bankForm.controls.bankZip"
            ></app-control-message>
          </div>

          <!-- <div class="single_input">
            <input type="text" formControlName="bankStartingCheckNumber" maxlength="12" class="input_style" (keypress)="utils.numberOnly($event,'numeric');"
              placeholder=" ">
            <label class="floating_label_field">Starting Check Number<span class="required">*</span></label>
            <app-control-message [control]="bankForm.controls.bankStartingCheckNumber"></app-control-message>
          </div>

          <div class="single_input">
            <input type="text" formControlName="bankFractionalNumber" maxlength="12" class="input_style" (keypress)="disbleBacktick($event);"
             placeholder=" ">
            <label class="floating_label_field">Fractional Number(optional)</label>
            <app-control-message [control]="bankForm.controls.bankFractionalNumber"></app-control-message>
          </div> -->
        </div>
      </ng-container>
    </div>
    <!-- modal body end -->

    <div class="ocw_modal_footer">
      <mat-dialog-actions align="end">
        <button
          mat-dialog-close
          class="ocw-btn ocw-btn-modal-bordered"
          *ngIf="!isComponent"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="ocw-btn ocw-btn-modal-blue add_btn"
          [disabled]="loading"
        >
          <ng-container *ngIf="!loading">
            <svg
              aria-hidden="true"
              focusable="false"
              data-prefix="fas"
              data-icon="plus"
              class="svg-inline--fa fa-plus fa-w-14"
              role="img"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 448 512"
            >
              <path
                fill="currentColor"
                d="M416 208H272V64c0-17.67-14.33-32-32-32h-32c-17.67 0-32 14.33-32 32v144H32c-17.67 0-32 14.33-32 32v32c0 17.67 14.33 32 32 32h144v144c0 17.67 14.33 32 32 32h32c17.67 0 32-14.33 32-32V304h144c17.67 0 32-14.33 32-32v-32c0-17.67-14.33-32-32-32z"
              ></path>
            </svg>
            <span>Add</span>
          </ng-container>

          <span *ngIf="loading" class="loadingSpinner"></span>
        </button>
      </mat-dialog-actions>
    </div>
  </form>
</div>
