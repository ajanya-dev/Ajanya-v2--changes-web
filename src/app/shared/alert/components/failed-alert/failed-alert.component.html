<div class="alert_wrapper failed_alert">
  <!-- header -->
  <div class="alert_header">

            <svg aria-hidden="true" focusable="false" data-prefix="fal" data-icon="times" class="svg-inline--fa fa-times fa-w-10" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512"><path fill="currentColor" d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"></path></svg>
        </div> -->
    <div class="alert_icon">
      <svg
        version="1.1"
        id="Layer_1"
        xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink"
        x="0px"
        y="0px"
        viewBox="0 0 512 512"
        style="enable-background: new 0 0 512 512"
        xml:space="preserve"
      >
        <ellipse
          style="fill: #e04f5f"
          cx="256"
          cy="256"
          rx="256"
          ry="255.832"
        />
        <g transform="matrix(-0.7071 0.7071 -0.7071 -0.7071 77.26 32)">
          <rect
            x="3.98"
            y="-427.615"
            style="fill: #ffffff"
            width="55.992"
            height="285.672"
          />
          <rect
            x="-110.828"
            y="-312.815"
            style="fill: #ffffff"
            width="285.672"
            height="55.992"
          />
        </g>
      </svg>
    </div>
  </div>

  <!-- body -->
  <div class="alert_body">
    <h2 class="title">{{ title }}</h2>
    <h3 *ngIf="content !== 'null'" class="content">{{ content }}</h3>
  </div>

  <!-- actions -->
  <div mat-dialog-actions class="alert_button_wrapper">
    <button
      *ngIf="isCancel"
      [mat-dialog-close]="false"
      class="ocw-btn ocw-btn-modal-bordered cancel-btn"
    >
      {{ cancelMsg }}
    </button>
    <button
      *ngIf="(this.close == false || isOk) && refresh"
      [mat-dialog-close]="true"
      (click)="done()"
      class="ocw-btn ocw-btn-modal-bordered cancel-btn"
    >
      {{ doneMsg }}
    </button>
    <button
      *ngIf="!refresh"
      [mat-dialog-close]="true"
      (click)="done()"
      class="ocw-btn ocw-btn-modal-blue cancel-btn"
    >
      {{ doneMsg }}
    </button>
    <button
      *ngIf="refresh"
      (click)="refreshPage()"
      class="ocw-btn ocw-btn-modal-blue done_btn"
    >
      Refresh
    </button>
  </div>
</div>
