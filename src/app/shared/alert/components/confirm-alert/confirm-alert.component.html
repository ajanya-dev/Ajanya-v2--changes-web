<div class="alert_wrapper confirm_alert">
  <!-- header -->
  <div class="alert_header">
    <div class="alert_icon">
      <img
        src="../../../../../assets/images/alert-icons/{{ icon }}-icon.svg"
        alt=""
      />
    </div>
  </div>

  <!-- body -->
  <div class="alert_body">
    <h2 class="title">{{ title }}</h2>
    @if(isShowAsHtml){
      <div class="content" [innerHTML]="content"></div>
    }@else if (content !== 'null') {
      <h3 class="content">{{ content }}</h3>
    }
  </div>

  <!-- actions -->
  <div
    *ngIf="this.close == false"
    mat-dialog-actions
    class="alert_button_wrapper"
  >
    <button
      *ngIf="isCancel"
      [mat-dialog-close]="false"
      class="ocw-btn ocw-btn-modal-bordered cancel-btn"
    >
      {{ cancelMsg }}
    </button>
    <button
      *ngIf="isOk"
      [mat-dialog-close]="true"
      (click)="done()"
      class="ocw-btn ocw-btn-modal-blue done_btn"
    >
      {{ doneMsg }}
    </button>
  </div>
</div>
