<div class="alert_wrapper confirm_alert">
  <!-- header -->
  <div class="alert_header">
    <div class="alert_icon">
      <svg
        version="1.1"
        id="Capa_1"
        xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink"
        x="0px"
        y="0px"
        viewBox="0 0 512 512"
        style="enable-background: new 0 0 512 512"
        xml:space="preserve"
      >
        <path
          style="fill: #00c1fd"
          d="M256,512c-68.38,0-132.667-26.629-181.02-74.98C26.629,388.667,0,324.38,0,256
       S26.629,123.333,74.98,74.98C123.333,26.629,187.62,0,256,0s132.667,26.629,181.02,74.98C485.371,123.333,512,187.62,512,256
       s-26.629,132.667-74.98,181.02C388.667,485.371,324.38,512,256,512z"
        />
        <path
          style="fill: #08a8ee"
          d="M437.02,74.98C388.667,26.629,324.38,0,256,0v512c68.38,0,132.667-26.629,181.02-74.98
       C485.371,388.667,512,324.38,512,256S485.371,123.333,437.02,74.98z"
        />
        <g>
          <polygon
            style="fill: #e4f7ff"
            points="301,371 301,221 191,221 191,251 211,251 211,371 190,371 190,401 320,401 320,371 	"
          />
          <path
            style="fill: #e4f7ff"
            d="M256,191c24.813,0,45-20.187,45-45s-20.187-45-45-45s-45,20.187-45,45S231.187,191,256,191z"
          />
        </g>
        <g>
          <path
            style="fill: #cbedfd"
            d="M256,191c24.813,0,45-20.187,45-45s-20.187-45-45-45V191z"
          />
          <polygon
            style="fill: #cbedfd"
            points="301,371 301,221 256,221 256,401 320,401 320,371 	"
          />
        </g>
      </svg>
    </div>
  </div>

  <!-- body -->
  <div class="alert_body">
    <h2 class="title">{{ title }}</h2>
    <!-- <h3 *ngIf="content!=='null'" class="content">{{content}}</h3> -->
    <h3 class="content" [innerHTML]="content"></h3>
    <div class="my-2">
    @if(isInputRequired){
      <input type="text" class="input_style floating_input_field" [placeholder]="inputPlaceholder" [formControl]="inputValue">
    }
    @if(inputValue.errors && (inputValue.touched || isSubmitted)){
      <app-control-message
      [control]="inputValue"
    ></app-control-message>
    }
    </div>
  </div>

  <!-- actions -->
  <div
    *ngIf="this.close == false"
    mat-dialog-actions
    class="alert_button_wrapper"
  >
    <button
      [mat-dialog-close]="false"
      *ngIf="isCancel"
      class="ocw-btn ocw-btn-modal-bordered cancel-btn"
    >
      {{ cancelMsg }}
    </button>
    <button
      [mat-dialog-close]="true"
      *ngIf="isOk"
      (click)="done()"
      [disabled]="isInputRequired && inputValue.invalid"
      class="ocw-btn ocw-btn-modal-blue done_btn"
      [class.disabled]="isInputRequired && inputValue.invalid"
    >
      {{ doneMsg }}
    </button>
  </div>
</div>
