<div class="text-center font-funnel">
  <!-- Icon -->
  <div class="flex justify-center mb-4">
    <div
      class="w-16 h-16 rounded-full flex items-center justify-center"
      style="
        background-color: var(--v4-badge-error-bg-color);
        color: var(--v4-badge-error-text-color);
      "
    >
      <lucide-icon [img]="CircleXIcon" [size]="32"></lucide-icon>
    </div>
  </div>

  <!-- Body -->
  <div class="text-center">
    <h2
      class="text-lg font-semibold font-funnel text-v4-main-text-color mb-2 break-words"
    >
      {{ title }}
    </h2>
    @if (content !== "null") {
      <p
        class="text-sm font-peridot text-muted-foreground max-w-[40ch] mx-auto break-words"
      >
        {{ content }}
      </p>
    }
  </div>

  <!-- Actions -->
  <div mat-dialog-actions class="flex gap-3 justify-center">
    @if (isCancel) {
      <app-common-button-v4
        class="flex-1"
        [type]="{ style: 'outline', name: 'main' }"
        [text]="cancelMsg"
        [width]="'100%'"
        (clickEvent)="cancel()"
      />
    }
    @if ((close == false || isOk) && refresh) {
      <app-common-button-v4
        class="flex-1"
        [type]="{ style: 'outline', name: 'main' }"
        [text]="doneMsg"
        [width]="'100%'"
        (clickEvent)="done()"
      />
    }
    @if (!refresh) {
      <app-common-button-v4
        class="flex-1"
        [type]="{ style: 'primary', name: 'main' }"
        [text]="doneMsg"
        [width]="'100%'"
        (clickEvent)="done()"
      />
    }
    @if (refresh) {
      <app-common-button-v4
        class="flex-1"
        [type]="{ style: 'destructive', name: 'main' }"
        [text]="'Refresh'"
        [width]="'100%'"
        (clickEvent)="refreshPage()"
      />
    }
  </div>
</div>
