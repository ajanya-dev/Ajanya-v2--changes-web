<div class="text-center font-funnel">
  <!-- Icon -->
  <div class="flex justify-center mb-4">
    <div
      class="w-16 h-16 rounded-full flex items-center justify-center"
      [style.background-color]="activeBgColor"
      [style.color]="activeIconColor"
    >
      <lucide-icon [img]="activeIcon" [size]="32"></lucide-icon>
    </div>
  </div>

  <!-- Body -->
  <div class="text-center">
    <h2
      class="text-lg font-semibold font-funnel text-v4-main-text-color mb-2 break-words"
    >
      {{ title }}
    </h2>
    @if (content !== "null") {
      @if (isShowAsHtml) {
        <p
          class="text-sm font-peridot text-muted-foreground max-w-[40ch] mx-auto break-words whitespace-pre-line"
          [innerHTML]="content"
        ></p>
      } @else {
        <p
          class="text-sm font-peridot text-muted-foreground max-w-[40ch] mx-auto break-words whitespace-pre-line"
        >
          {{ content }}
        </p>
      }
    }
  </div>

  <!-- Actions -->
  @if (!close) {
    <div mat-dialog-actions class="flex gap-3 justify-center">
      @if (isCancel) {
        <app-common-button-v4
          class="flex-1 whitespace-nowrap"
          [type]="{ style: 'outline', name: 'main' }"
          [text]="cancelMsg"
          [width]="'100%'"
          (clickEvent)="cancel()"
        />
      }
      @if (isOk) {
        <app-common-button-v4
          class="flex-1 whitespace-nowrap"
          [type]="{ style: 'primary', name: 'main' }"
          [text]="doneMsg"
          [width]="'100%'"
          (clickEvent)="done()"
        />
      }
    </div>
  }
</div>
