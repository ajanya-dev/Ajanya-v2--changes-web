<div class="px-[6px] pb-[6px]">
  <!-- Modal header -->
  <div class="mb-6">
    <h2 class="font-inter font-semibold text-lg text-main-text-color mb-1">Confirm Bank Details</h2>
    <p class="text-secondary-text-color text-sm">
      Please review the bank account details below
    </p>
  </div>

  <!-- Modal body -->
  <div class="space-y-6">
      <div class="space-y-6">
        <div class="space-y-3">
          <label for="bankAccountHolderName" class="block text-sm font-medium">
            Bank Account Holder Name<span class="text-common-red-color">*</span>
          </label>
          <input 
            id="bankAccountHolderName"
            type="text" 
            class="w-full h-12 px-4 rounded-lg border border-input-border-color text-secondary-text-color focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" 
            [(ngModel)]="bankAccountHolderName">
        </div>
        <div class="space-y-3">
          <label for="bankAccountName" class="block text-sm font-medium">
            Bank Account Name<span class="text-common-red-color">*</span>
          </label>
          <input 
            id="bankAccountName"
            type="text" 
            class="w-full h-12 px-4 rounded-lg border border-input-border-color text-secondary-text-color focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" 
            [(ngModel)]="bankAccountName">
        </div>
      </div>
  </div>

  <!-- Action buttons -->
  <div class="mt-8">
    <app-common-button-v35 
      [type]="{style:'modal', name: 'main'}" 
      [text]="'Confirm & Continue'"
      [backGroundInput]="'var(--common-blue-color)'"
      class="w-full"
      [customClasses]="'w-full rounded-lg text-white font-medium'"
      (clickEvent)="onConfirm()">
    </app-common-button-v35>
  </div>
</div>
