<div class="font-peridot">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Confirm Bank Details
      </h1>
      <h2 class="text-xs text-v4-subtle-text-color">
        Please review the bank account details below
      </h2>
    </div>
    <div
      (click)="onClose()"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <div class="flex flex-col gap-5">
      <!-- Bank Account Holder Name -->
      <app-common-input-v4
        [fieldLabel]="'Bank Account Holder Name'"
        [placeholder]="'Bank Account Holder Name'"
        [inputId]="'bankAccountHolderName'"
        [(ngModel)]="bankAccountHolderName"
      />

      <!-- Bank Account Name -->
      <app-common-input-v4
        [fieldLabel]="'Bank Account Name'"
        [placeholder]="'Bank Account Name'"
        [inputId]="'bankAccountName'"
        [(ngModel)]="bankAccountName"
      />
    </div>

    <!-- Action button -->
    <div class="mt-6">
      <app-common-button-v4
        [type]="{ style: 'primary', name: 'main' }"
        [text]="'Confirm & Continue'"
        [width]="'100%'"
        [loading]="confirming"
        (clickEvent)="onConfirm()"
      />
    </div>
  </div>
</div>
