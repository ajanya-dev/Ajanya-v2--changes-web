<div class="">
  <!-- Header -->
  <div class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color">
    <div class="flex items-center gap-3">
      <lucide-icon [img]="TableIcon" [size]="20" class="text-v4-primary-brand-bold-color"></lucide-icon>
      <div class="flex flex-col">
        <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">Import Checks</h1>
      </div>
    </div>
  </div>

  <!-- Body -->
  <div class="p-6 bg-v4-tertiary-background-color">
    @if (isLoading()) {
      <div class="flex items-center justify-center py-12">
        <span class="text-sm text-v4-tertiary-text-color">Loading imported checks...</span>
      </div>
    } @else if (!checkData().length) {
      <div class="flex items-center justify-center py-12">
        <span class="text-sm text-v4-tertiary-text-color">No checks found.</span>
      </div>
    } @else {
      <div class="overflow-x-auto border border-v4-border-color rounded-xl">
        <div class="max-h-[490px] overflow-y-auto">
          <table class="v4-ocw-table w-max">
            <thead>
              <tr>
                <th>
                  <input
                    type="checkbox"
                    class="v4-checkbox-sm"
                    (click)="toggleSelect($any($event.target).checked)"
                    checked
                  />
                </th>
                <th class="text-center whitespace-nowrap">S.No</th>
                <th class="whitespace-nowrap">DATE</th>
                <th class="whitespace-nowrap">AMOUNT</th>
                <th class="whitespace-nowrap">CHECK SERIAL #</th>
              </tr>
            </thead>
            <tbody>
              @for (item of checkData(); track item.id; let i = $index) {
                <tr>
                  <td>
                    <input type="checkbox" class="v4-checkbox-sm" [(ngModel)]="item.selected" />
                  </td>
                  <td class="text-center">
                    <span class="text-xs text-v4-tertiary-text-color">{{ i + 1 }}</span>
                  </td>
                  <td class="whitespace-nowrap">{{ item.date }}</td>
                  <td class="whitespace-nowrap">{{ item.amount }}</td>
                  <td class="whitespace-nowrap">{{ item.checkSerialNumber }}</td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      </div>
    }
  </div>

  <!-- Footer -->
  <div class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color">
    <app-common-button-v4
      [width]="'100px'"
      [type]="{ style: 'outline', name: 'main' }"
      [text]="'Cancel'"
      (clickEvent)="onBack.emit()"
    ></app-common-button-v4>
    <app-common-button-v4
      [width]="'140px'"
      [type]="{ style: 'primary', name: 'main' }"
      [text]="'Process Now'"
      [loading]="isSubmit()"
      [disabled]="isSubmit() || isLoading()"
      (clickEvent)="processNow()"
    ></app-common-button-v4>
  </div>
</div>
