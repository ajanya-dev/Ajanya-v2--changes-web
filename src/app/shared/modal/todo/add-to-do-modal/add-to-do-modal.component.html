<div class="ocw_man_modal_wrapper">
  <!-- modal header -->
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">
      {{ data?.editMode ? "Edit To Do" : "Add To-Dos" }}
    </div>
    <div class="close_btn" [mat-dialog-close]="false">
      <svg
        aria-hidden="true"
        focusable="false"
        data-prefix="fal"
        data-icon="times"
        class="svg-inline--fa fa-times fa-w-10"
        role="img"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 320 512"
      >
        <path
          fill="currentColor"
          d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
        ></path>
      </svg>
    </div>
  </div>
  <!-- modal body start -->
  <div class="ocw_modal_body">
    <form action="ng-submit" [formGroup]="todoForm">
      <div class="flex justify-between">
        <div class="single_input date-sec no_modal_btn">
          <input
            class="input_style"
            matInput
            formControlName="dueDate"
            [min]="mindate"
            type="date"
            placeholder="due date"
          />
          <label class="floating_label_field">Due Date</label>
        </div>
        <div class="single_input date-sec no_modal_btn">
          <input
            class="input_style"
            matInput
            type="time"
            placeholder="due time"
            [(ngModel)]="time"
            [ngModelOptions]="{ standalone: true }"
          />
          <label class="floating_label_field">Due Time</label>
        </div>
      </div>
      <mat-form-field class="example-full-width mt-5" appearance="fill">
        <mat-label class="content-details">Details</mat-label>
        <textarea
          matInput
          formControlName="details"
          maxlength="200"
          placeholder=""
        ></textarea>
        <mat-error *ngIf="todoForm.controls.details.hasError('required')"
          >Please enter some text</mat-error
        >
      </mat-form-field>
    </form>
  </div>
  <!-- modal body end -->
  <div class="ocw_modal_footer">
    <mat-dialog-actions align="end">
      <button
        [ngClass]="{ disableBtn: submitting }"
        (click)="onSubmit()"
        type="submit"
        class="ocw-btn ocw-btn-modal-blue"
      >
        <span>{{ data?.editMode ? "Update" : "Save" }}</span>
      </button>
    </mat-dialog-actions>
  </div>
</div>
