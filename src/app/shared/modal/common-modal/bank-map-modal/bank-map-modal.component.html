<div class="ocw_man_modal_wrapper category_modal">
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">Update Bank Account</div>
    <div class="close_btn" [mat-dialog-close]="false">
      <svg
        aria-hidden="true"
        focusable="false"
        data-prefix="fal"
        data-icon="times"
        class="svg-inline--fa fa-times fa-w-10"
        role="img"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 320 512"
      >
        <path
          fill="currentColor"
          d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
        ></path>
      </svg>
    </div>
  </div>

  <div class="detail">
    <p>Please select a bank account to this invoice for processing.</p>
  </div>

  <div class="comments_wrapper">
    <div class="select-box">
      <div class="py-4 mb-5">
        <label>Invoice From</label>
        <div class="single_input">
          <app-bank-ac-dropdown-v3
            class="drop_style"
            [(ngModel)]="bankAccount"
            (ngModelChange)="onChangeBank($event)"
            placeholder="Select Bank Account"
            append="body"
          ></app-bank-ac-dropdown-v3>
        </div>
        <app-control-message [control]="bankAccount"></app-control-message>
      </div>
    </div>
    <div class="flex justify-end">
      <button
        type="button"
        (click)="update()"
        [ngClass]="{ 'disable-btn': disable }"
        class="ocw-btn ocw-btn-modal-blue add_btn"
      >
        Update
      </button>
    </div>
  </div>
</div>
