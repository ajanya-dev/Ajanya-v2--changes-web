<div class="flex flex-col max-h-[80vh]">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color flex-shrink-0"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Select a Company to Import
        {{ data.mode === "Bank" ? "Bank Accounts" : data.mode }}
      </h1>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon name="x" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="flex-1 overflow-y-auto p-6 bg-v4-tertiary-background-color">
    <span class="block mb-2 text-sm font-medium text-v4-secondary-text-color">
      Company
    </span>

    <div class="relative w-full mb-3">
      <span
        class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none flex items-center text-v4-subtle-text-color"
      >
        <lucide-icon name="search" [size]="14" />
      </span>
      <input
        type="text"
        class="w-full h-[38px] rounded-lg border border-v4-input-border-color bg-v4-secondary-background-color text-sm text-v4-main-text-color pl-10 pr-9 placeholder:text-v4-subtle-text-color focus:outline-none focus:ring-1 focus:ring-v4-primary-brand-color/50 focus:border-v4-primary-brand-color"
        placeholder="Search by company name..."
        [ngModel]="searchTerm"
        (ngModelChange)="onSearchChange($event)"
      />
      @if (searchTerm) {
        <button
          type="button"
          class="absolute right-3 top-1/2 -translate-y-1/2 flex items-center cursor-pointer text-v4-subtle-text-color hover:text-v4-main-text-color transition-colors"
          aria-label="Clear search"
          (click)="clearSearch()"
        >
          <lucide-icon name="x" [size]="14" />
        </button>
      }
    </div>

    <div
      class="h-[258px] overflow-y-auto rounded-xl border border-v4-input-border-color bg-v4-secondary-background-color"
    >
      @for (company of filteredCompanies; track company) {
        <button
          type="button"
          class="flex items-center gap-3 w-full min-h-[60px] px-3 py-3 text-left border-b border-v4-border-subtle-color last:border-b-0 cursor-pointer hover:bg-v4-list-hover-color transition-colors"
          [class.bg-v4-list-hover-color]="isSelected(company)"
          [attr.aria-pressed]="isSelected(company)"
          (click)="selectCompany(company)"
        >
          <span
            class="flex-none flex items-center justify-center w-9 h-9 rounded-lg text-xs font-semibold"
            [style.background-color]="getAvatarTone(company).bg"
            [style.color]="getAvatarTone(company).text"
          >
            {{ getInitials(company) }}
          </span>
          <span class="flex flex-col gap-0.5 flex-1 min-w-0">
            <span
              class="text-sm font-medium text-v4-main-text-color truncate"
              >{{ company.companyName }}</span
            >
            @if (getCompanyMeta(company)) {
              <span class="text-xs text-v4-tertiary-text-color truncate">{{
                getCompanyMeta(company)
              }}</span>
            }
          </span>
          @if (isSelected(company)) {
            <lucide-icon
              name="check"
              [size]="16"
              class="flex-none text-v4-primary-brand-color"
            />
          }
        </button>
      } @empty {
        <div
          class="flex items-center justify-center h-full text-sm text-v4-tertiary-text-color"
        >
          Company not found
        </div>
      }
    </div>
  </div>
  <!-- modal body end -->

  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color flex-shrink-0"
  >
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Import"
      [disabled]="!companySelected"
      (clickEvent)="onImportClicked()"
    />
  </div>
</div>
