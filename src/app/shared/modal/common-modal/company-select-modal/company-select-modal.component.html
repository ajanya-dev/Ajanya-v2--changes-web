<div class="component-container flex flex-col">
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">
      Select a Company to Import
      {{ data.mode === "Bank" ? "Bank Accounts" : data.mode }}
    </div>
    <div class="close_btn" [mat-dialog-close]="false">
      <svg
        aria-hidden="true"
        focusable="false"
        data-prefix="fal"
        data-icon="times"
        class="svg-inline--fa fa-times fa-w-10"
        role="img"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 320 512"
      >
        <path
          fill="currentColor"
          d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
        ></path>
      </svg>
    </div>
  </div>

  <div class="company-select grow">
    <label class="company-select-label">Company</label>

    <div class="company-search">
      <i class="fa-solid fa-magnifying-glass company-search-icon"></i>
      <input
        type="text"
        class="input_style company-search-input"
        placeholder="Search by company name..."
        [ngModel]="searchTerm"
        (ngModelChange)="onSearchChange($event)"
      />
      @if (searchTerm) {
        <button
          type="button"
          class="company-search-clear"
          aria-label="Clear search"
          (click)="clearSearch()"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      }
    </div>

    <div class="company-list">
      @for (company of filteredCompanies; track company) {
        <button
          type="button"
          class="company-row"
          [class.selected]="isSelected(company)"
          [attr.aria-pressed]="isSelected(company)"
          (click)="selectCompany(company)"
        >
          <span
            class="company-avatar"
            [style.background-color]="getAvatarTone(company).bg"
            [style.color]="getAvatarTone(company).text"
          >
            {{ getInitials(company) }}
          </span>
          <span class="company-info">
            <span class="company-name">{{ company.companyName }}</span>
            @if (getCompanyMeta(company)) {
              <span class="company-meta">{{ getCompanyMeta(company) }}</span>
            }
          </span>
          @if (isSelected(company)) {
            <i class="fa-solid fa-check company-check"></i>
          }
        </button>
      } @empty {
        <div class="company-empty">Company not found</div>
      }
    </div>
  </div>

  <div class="import-section flex justify-end">
    <button
      type="button"
      class="ocw-data-btn ocw-btn ocw-btn-modal-blue"
      [disabled]="!companySelected"
      (click)="onImportClicked()"
    >
      <i class="fa-solid fa-down-to-line"></i> Import
    </button>
  </div>
</div>
