<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Transaction Statement
      </h1>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color">
    @if (isLoading()) {
      <div class="overflow-x-auto border border-v4-border-color rounded-xl">
        <div class="max-h-[490px] overflow-y-auto">
          <table class="v4-ocw-table">
            <thead>
              <tr>
                <th class="text-center">#</th>
                <td>Date</td>
                <td>Status</td>
                <td>Notes</td>
              </tr>
            </thead>
            <tbody>
              @for (i of [1, 2, 3, 4, 5]; track i) {
                <tr>
                  <td class="text-center">
                    <div
                      class="h-4 w-4 bg-v4-input-background-color rounded animate-pulse mx-auto"
                    ></div>
                  </td>
                  <td>
                    <div
                      class="h-4 w-24 bg-v4-input-background-color rounded animate-pulse"
                    ></div>
                  </td>
                  <td>
                    <div
                      class="h-4 w-20 bg-v4-input-background-color rounded animate-pulse"
                    ></div>
                  </td>
                  <td>
                    <div
                      class="h-4 w-32 bg-v4-input-background-color rounded animate-pulse"
                    ></div>
                  </td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      </div>
    } @else {
      <div class="overflow-x-auto border border-v4-border-color rounded-xl">
        <div class="max-h-[490px] overflow-y-auto">
          <table class="v4-ocw-table">
            <thead>
              <tr>
                <th class="text-center">#</th>
                <td>Date</td>
                <td>Status</td>
                <td>Notes</td>
              </tr>
            </thead>
            <tbody>
              @for (item of transactions(); track $index) {
                <tr>
                  <td class="text-center">
                    <span class="text-xs text-v4-tertiary-text-color">{{
                      $index + 1
                    }}</span>
                  </td>
                  <td>{{ item.date }}</td>
                  <td>{{ item.status }}</td>
                  <td>{{ item.note }}</td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      </div>
    }
  </div>
  <!-- modal body end -->

  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
  </div>
</div>
