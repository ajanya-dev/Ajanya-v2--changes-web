<div class="flex flex-col h-[600px] max-h-[80vh]">
  <!-- Header -->
  <div
    class="flex items-center justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color flex-shrink-0"
  >
    <div class="flex items-center gap-3">
      <img
        ngSrc="/assets/images/integration/oracle-netsuite.png"
        alt="NetSuite"
        width="32"
        height="32"
      />
      <span class="text-base font-semibold text-v4-main-text-color font-funnel"
        >Import from NetSuite</span
      >
    </div>
    <button
      class="flex items-center gap-2 px-3 py-1.5 text-sm text-v4-secondary-text-color hover:bg-v4-tertiary-background-color rounded-lg transition-colors cursor-pointer border-none bg-transparent"
      matTooltip="Integration Settings"
      (click)="goToThirdpartyHome()"
    >
      <lucide-icon [img]="SettingsIcon" [size]="16"></lucide-icon>
      <span class="hidden sm:inline">Settings</span>
    </button>
  </div>

  <!-- Loading Spinner -->
  <div class="data_spinner" [ngClass]="{ data_fetched: dataLoaded }"></div>

  <!-- Disconnected State -->
  @if (!isConnected && dataLoaded) {
    <div
      class="flex-1 flex flex-col justify-center items-center px-6 py-12 overflow-auto"
    >
      <div
        class="bg-v4-secondary-background-color border border-v4-border-color rounded-xl p-8 max-w-md w-full text-center"
      >
        <div
          class="w-20 h-20 mx-auto mb-6 bg-v4-tertiary-background-color rounded-full flex items-center justify-center"
        >
          <img
            ngSrc="/assets/images/integration/oracle-netsuite.png"
            alt="NetSuite"
            width="48"
            height="48"
          />
        </div>
        <h3
          class="text-xl font-semibold text-v4-main-text-color mb-2 font-funnel"
        >
          NetSuite
        </h3>
        <div class="flex items-center justify-center gap-2 mb-6">
          <span class="w-2 h-2 bg-v4-common-red-color rounded-full"></span>
          <span class="text-sm text-v4-secondary-text-color">Disconnected</span>
        </div>
        <p class="text-sm text-v4-secondary-text-color mb-6">
          Connect your Oracle NetSuite account to import checks and bills.
        </p>
        <app-common-button-v4
          [type]="{ style: 'primary', name: 'main' }"
          [text]="'Integrate NetSuite'"
          [textColorInput]="'white'"
          [width]="'100%'"
          (clickEvent)="goToThirdpartyHome()"
        ></app-common-button-v4>
      </div>
    </div>
  }

  <!-- Connected State - Filter Form -->
  @if (isConnected && dataLoaded) {
    <div class="flex-1 overflow-y-auto px-6 py-4" [formGroup]="netsuiteForm">
      <div class="flex flex-col gap-4 max-w-2xl mx-auto">
        <!-- Default Subsidiary Card -->
        @if (env?.env_id !== "compass") {
          <div
            class="netsuite-subsidiary-card bg-v4-secondary-background-color rounded-xl p-4 border border-v4-border-color"
          >
            <h4 class="text-sm font-semibold text-v4-main-text-color mb-3">
              Default Subsidiary
            </h4>
            <app-v4-common-dropdown
              [config]="{
                placeholder: 'Select Subsidiary',
                displayField: 'name',
                outputField: 'id',
                displaySubField: 'defaultLabel'
              }"
              [listData]="subsidiaryListWithDefault()"
              [ngModel]="defaultSubsidiaryId()"
              (ngModelChange)="
                $event ? setSubsidiaryId($event) : onSubsidiarySearchClear()
              "
              [ngModelOptions]="{ standalone: true }"
              [clearable]="true"
              [loading]="subsidiaryLoading()"
              [appendTo]="'body'"
              (scrollToEnd)="onSubsidiaryScrollToEnd()"
              (searchEvent)="onSubsidiarySearch($event)"
            ></app-v4-common-dropdown>
          </div>
        }

        <!-- Time Span Card -->
        <div
          class="bg-v4-secondary-background-color rounded-xl p-4 border border-v4-border-color"
        >
          <h4
            class="text-sm font-semibold text-v4-main-text-color mb-3 flex items-center gap-2"
          >
            <lucide-icon
              [img]="ClockIcon"
              [size]="16"
              class="text-v4-primary-brand-bold-color"
            ></lucide-icon>
            Time Span
          </h4>
          <app-v4-radio-group
            formControlName="importTime"
            [options]="importTime"
            [columns]="2"
            ariaLabel="Time Span"
          />
        </div>
      </div>
    </div>

    <!-- Footer Actions -->
    <div
      class="flex items-center justify-end gap-3 px-6 py-4 border-t border-v4-border-color bg-v4-secondary-background-color flex-shrink-0"
    >
      <app-common-button-v4
        [width]="'125px'"
        [type]="{ style: 'outline', name: 'main' }"
        [text]="'Cancel'"
        (clickEvent)="back()"
      ></app-common-button-v4>
      <app-common-button-v4
        [width]="'125px'"
        [type]="{ style: 'primary', name: 'main' }"
        [text]="'Import'"
        [textColorInput]="'white'"
        (clickEvent)="onSubmit()"
        [loading]="loading"
        [disabled]="loading"
      ></app-common-button-v4>
    </div>
  }
</div>
