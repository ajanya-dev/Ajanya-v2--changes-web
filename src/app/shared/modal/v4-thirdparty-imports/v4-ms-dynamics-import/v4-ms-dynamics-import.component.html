<div class="flex flex-col h-[600px] max-h-[80vh]">
  <!-- Header -->
  <div
    class="flex items-center justify-between pb-4 border-b border-v4-border-color flex-shrink-0"
  >
    <div class="flex items-center gap-3">
      <img
        ngSrc="/assets/images/integration/microsoft-dynamics.png"
        alt="Microsoft Dynamics 365"
        width="32"
        height="32"
      />
      <span class="text-base font-semibold font-funnel text-v4-main-text-color"
        >Import from Microsoft Dynamics 365</span
      >
    </div>
    <button
      class="flex items-center gap-2 px-3 py-1.5 text-sm text-v4-secondary-text-color hover:bg-v4-tertiary-background-color rounded-lg transition-colors cursor-pointer border-none bg-transparent"
      matTooltip="Integration Settings"
      (click)="goToThirdpartyHome()"
    >
      <lucide-icon [img]="SettingsIcon" [size]="16"></lucide-icon>
      <span class="hidden sm:inline">Settings</span>
    </button>
  </div>

  <!-- Loading Spinner -->
  <div class="data_spinner" [ngClass]="{ data_fetched: dataLoaded }"></div>

  <!-- Disconnected State -->
  @if (!isConnected && dataLoaded) {
    <div
      class="flex-1 flex flex-col justify-center items-center py-12 overflow-auto"
    >
      <div
        class="bg-v4-secondary-background-color border border-v4-border-color rounded-xl p-8 max-w-md w-full text-center"
      >
        <div
          class="w-20 h-20 mx-auto mb-6 bg-v4-tertiary-background-color rounded-full flex items-center justify-center"
        >
          <img
            ngSrc="/assets/images/integration/microsoft-dynamics.png"
            alt="Microsoft Dynamics 365"
            width="48"
            height="48"
          />
        </div>
        <h3 class="text-xl font-semibold text-v4-main-text-color mb-2">
          Microsoft Dynamics 365
        </h3>
        <div class="flex items-center justify-center gap-2 mb-6">
          <span class="w-2 h-2 bg-v4-common-red-color rounded-full"></span>
          <span class="text-sm text-v4-secondary-text-color">Disconnected</span>
        </div>
        <p class="text-sm text-v4-secondary-text-color mb-6">
          Connect your Microsoft Dynamics 365 Business Central account to import
          bills and invoices.
        </p>
        <app-common-button-v4
          [type]="{ style: 'primary', name: 'main' }"
          [text]="'Integrate Dynamics 365'"
          [textColorInput]="'white'"
          [width]="'100%'"
          (clickEvent)="goToThirdpartyHome()"
        ></app-common-button-v4>
      </div>
    </div>
  }

  <!-- Connected State - Filter Form -->
  @if (isConnected && dataLoaded) {
    <div class="flex-1 overflow-y-auto py-4" [formGroup]="dynamicsForm">
      <div class="flex flex-col gap-4 max-w-2xl mx-auto">
        <!-- Time Span Card -->
        <div
          class="bg-v4-secondary-background-color rounded-xl border border-v4-border-color p-4"
        >
          <h4
            class="text-sm font-semibold text-v4-main-text-color mb-3 flex items-center gap-2"
          >
            <lucide-icon
              [img]="ClockIcon"
              [size]="16"
              class="text-v4-primary-brand-bold-color"
            ></lucide-icon>
            Time Span
          </h4>
          <app-v4-radio-group
            formControlName="importTime"
            [options]="importTime"
            [columns]="2"
            ariaLabel="Time Span"
          />
        </div>
      </div>
    </div>

    <!-- Footer Actions -->
    <div
      class="flex items-center justify-end pt-4 border-t border-v4-border-color bg-v4-secondary-background-color flex-shrink-0"
    >
      <div class="flex items-center gap-3">
        <app-common-button-v4
          [width]="'125px'"
          [type]="{ style: 'outline', name: 'main' }"
          [text]="'Cancel'"
          (clickEvent)="back()"
        ></app-common-button-v4>
        <app-common-button-v4
          [width]="'125px'"
          [type]="{ style: 'primary', name: 'main' }"
          [text]="'Import'"
          [textColorInput]="'white'"
          (clickEvent)="onSubmit()"
          [loading]="loading"
          [disabled]="loading"
        ></app-common-button-v4>
      </div>
    </div>
  }
</div>
