<div
  class="bg-v4-primary-brand-color px-7 pt-5 pb-0 relative flex flex-col items-center"
>
  <div class="text-center mb-4 w-full">
    <h2 class="text-xl font-extrabold text-white leading-snug font-funnel">
      Your new Zil Money experience is here.
    </h2>
    <p class="text-sm text-white/70 mt-1.5 max-w-md mx-auto font-peridot">
      Rebuilt to help you send payments, manage vendors, and track activity — all in fewer clicks.
    </p>
  </div>
  <div class="relative w-full max-w-xl mx-auto preview-3d-stage">
    <div
      class="preview-3d-card rounded-t-2xl overflow-hidden border border-white/20 shadow-2xl bg-white max-h-52 cursor-pointer"
    >
      <img
        ngSrc="/assets/images/dashboard-preview-v4.webp"
        alt="New dashboard preview"
        width="1024"
        height="576"
        class="w-full h-auto object-cover object-top pointer-events-none"
      />
    </div>
    <div
      class="absolute -bottom-1 left-0 right-0 h-8 bg-gradient-to-b from-transparent to-v4-popup-background-color pointer-events-none"
    ></div>
  </div>
</div>
<div class="bg-v4-secondary-background-color px-7 pt-6 pb-7">
  <p class="text-sm font-bold text-v4-main-text-color mb-4 font-peridot">
    What's new
  </p>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-3 mb-7">
    @for (item of updatesInfo; track $index) {
      <div class="flex items-start gap-3">
        <lucide-icon
          [img]="CircleCheckIcon"
          [size]="16"
          class="text-v4-common-green-color flex-shrink-0 mt-0.5"
        ></lucide-icon>
        <span
          class="text-sm text-v4-secondary-text-color leading-relaxed font-peridot"
        >
          @for (seg of item; track $index) {
            @if (seg.bold) {
              <strong class="font-semibold text-v4-main-text-color">{{ seg.text }}</strong>
            } @else {
              {{ seg.text }}
            }
          }
        </span>
      </div>
    }
  </div>
  <div class="flex gap-3">
    <div class="flex-1">
        <app-common-button-v4
        [type]="{ style: 'outline', name: 'main' }"
        [text]="neverShowThisMessageAgain ? 'Never show this again':'Use the current version'"
        width="100%"
        [loading] = "loading()"
        (clickEvent)="closeDialog(neverShowThisMessageAgain)"
      />  
    </div>
    <div class="flex-1">
      <app-common-button-v4
        [type]="{ style: 'primary', name: 'main' }"
        text="Switch to the new version"
        width="100%"
        (clickEvent)="switchToNewVersion()"
      />
    </div>
  </div>
</div>
