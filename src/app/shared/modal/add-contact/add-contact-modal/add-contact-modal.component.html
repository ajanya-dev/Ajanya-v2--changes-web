<div class="ocw_man_modal_wrapper">
  <!-- modal header -->
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">
      {{ data?.editMode ? "Edit Contact" : "Add Contact" }}
    </div>
    <div class="close_btn" [mat-dialog-close]="false">
      <svg
        aria-hidden="true"
        focusable="false"
        data-prefix="fal"
        data-icon="times"
        class="svg-inline--fa fa-times fa-w-10"
        role="img"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 320 512"
      >
        <path
          fill="currentColor"
          d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
        ></path>
      </svg>
    </div>
  </div>
  <!-- modal body start -->
  <div class="ocw_modal_body">
    <form action="ng-submit" [formGroup]="contactForm">
      <div class="pb-2 single_input no_modal_btn">
        <input
          type="text"
          class="input_style"
          placeholder=" "
          required
          formControlName="name"
        />
        <label class="floating_label_field"
          >Full Name<span class="text-red-600">*</span></label
        >
        <app-control-message
          [control]="contactForm.controls.name"
          labelName="Please enter name"
        ></app-control-message>
      </div>
      <div class="pb-2 single_input no_modal_btn">
        <input
          type="text"
          class="input_style"
          placeholder=" "
          required
          formControlName="email"
        />
        <label class="floating_label_field"
          >Your Email<span class="text-red-600">*</span></label
        >
        <app-control-message
          [control]="contactForm.controls.email"
          labelName="Please enter your email"
        ></app-control-message>
      </div>
      <div class="pb-2 single_input no_modal_btn">
        <input
          type="text"
          class="input_style"
          placeholder=" "
          required
          formControlName="phoneNumber"
          mask="(000) 000-0000"
          autocomplete="off"
        />
        <label class="floating_label_field"
          >Phone Number<span class="text-red-600">*</span></label
        >
        <app-control-message
          [control]="contactForm.controls.phoneNumber"
          labelName="Please enter your Phone Number"
        ></app-control-message>
      </div>
      <div class="pb-2">
        <div class="single_input w-full">
          <select
            class="form-select input_style"
            #value
            formControlName="contactType"
          >
            <option value="" selected disabled>Contact Type</option>
            <option *ngFor="let item of contactType" [value]="item.value">
              {{ item.name }}
            </option>
          </select>
          <app-control-message
            [control]="contactForm.controls.contactType"
          ></app-control-message>
        </div>
      </div>
    </form>
  </div>
  <!-- modal body end -->
  <div class="ocw_modal_footer">
    <mat-dialog-actions align="end">
      <button
        [ngClass]="{ disableBtn: submitting }"
        (click)="submit()"
        type="submit"
        class="ocw-btn ocw-btn-modal-blue"
      >
        <span>{{ data?.editMode ? "Update" : "Save" }}</span>
      </button>
    </mat-dialog-actions>
  </div>
</div>
