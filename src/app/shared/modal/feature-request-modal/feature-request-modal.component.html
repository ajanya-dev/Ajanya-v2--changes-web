<div class="ocw_man_modal_wrapper category_modal max-w-[540px]">
  <form [formGroup]="featureForm">
    <div class="flex justify-between pb-6">
      <div>
        <span
          class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
        >
          <span class="pl-1 font-inter font-semibold text-base pb-0.5\">
            Enter Feature Details
          </span>
        </span>
      </div>
      <div [mat-dialog-close]="false">
        <fa-icon
          class="text-secondary-text-color cursor-pointer"
          [icon]="['fas', 'xmark']"
        ></fa-icon>
      </div>
    </div>

    <div class="ocw_modal_body">
      <div class="input_group mt-4">
        <div class="single_input">
          <textarea
            type="text"
            #descriptionTextarea
            id="hyperlinkContainer"
            class="input_style"
            id="description"
            placeholder=" "
            formControlName="description"
            maxlength="240"
          ></textarea>
          <span class="floating_label_field"
            >Description <span class="required">*</span></span
          >
          <app-control-message
            [control]="featureForm.controls.description"
            labelName="Description is Required"
          ></app-control-message>
        </div>
        <div class="ocw-browse-file mt-1">
          <app-common-button-v35
            #loomBtn
            type="list"
            [icon]="['fas', 'camera']"
            [isAddIcon]="true"
            text="Take a Video"
            [disabled]="loomService.isVideoLoading"
            [loading]="loomService.isVideoLoading"
            class="mb-5"
            (click)="openLoom()"
          >
          </app-common-button-v35>
        </div>
        @if (loomService.loomVideos.length !== 0) {
          <div class="ocw-browse-file mt-1 max-h-[300px] overflow-y-auto">
            @for (item of loomService.loomVideos; track item) {
              <div
                class="bg-secondary-background-color mb-1 rounded p-1 flex justify-between overflow-hidden"
              >
                <div class="max-w-[60px]">
                  <a
                    target="_blank"
                    class="text-[13px] text-common-blue-color ml-2"
                    [href]="item"
                    >{{ item | truncate: 60 }}</a
                  >
                </div>
                <div>
                  <span class="relative right-0">
                    <fa-icon
                      (click)="removeVideo(item)"
                      class="text-common-red-color cursor-pointer"
                      [icon]="['fas', 'trash']"
                    ></fa-icon
                  ></span>
                </div>
              </div>
            }
          </div>
        }
        <div class="ocw-browse-file min-w-[250px]">
          <app-common-upload-button-v35
            buttonText="Upload Document"
            [uploadedFile]="attachment"
            [acceptedFileTypes]="[
              '.pdf',
              '.csv',
              '.xlsx',
              '.xls',
              '.docx',
              '.doc',
              '.rtf',
              '.txt',
              '.jpg',
              '.png'
            ]"
            (selectedFileEvent)="uploadInput($event)"
          ></app-common-upload-button-v35>
        </div>
      </div>
      <div class="flex justify-end gap-3 pt-8">
        <app-common-button-v35
          [type]="{ style: 'modal', name: 'main' }"
          [disabled]="loading"
          [loading]="loading"
          text="Submit"
          (clickEvent)="onSave()"
        ></app-common-button-v35>
      </div>
    </div>
  </form>
</div>
