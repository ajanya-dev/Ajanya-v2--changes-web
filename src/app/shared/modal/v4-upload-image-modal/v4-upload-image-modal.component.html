<div class="v4-upload-image-modal">
  <!-- Header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
      Upload Image
    </h1>
    <button
      (click)="close()"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </button>
  </div>

  <!-- Body -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <div class="grid gap-5 md:grid-cols-[minmax(0,1fr)_auto] items-start">
      <!-- Cropper Card -->
      <div
        class="rounded-2xl border border-v4-border-color bg-v4-secondary-background-color p-4 overflow-hidden"
      >
        <div class="cropper-wrapper mx-auto">
          <image-cropper
            [imageChangedEvent]="data.event"
            [maintainAspectRatio]="true"
            [aspectRatio]="1"
            format="png"
            (imageCropped)="imageCropped($event)"
            [resizeToWidth]="228"
            [onlyScaleDown]="true"
            [cropperMinWidth]="128"
            [roundCropper]="isRounded"
          />
        </div>
      </div>

      <!-- Preview Card -->
      <div
        class="rounded-2xl border border-v4-border-color bg-v4-secondary-background-color p-4 flex flex-col items-center gap-3 md:w-[160px] mx-auto md:mx-0"
      >
        <span
          class="text-xs font-semibold uppercase tracking-wide text-v4-secondary-text-color font-peridot"
        >
          Preview
        </span>
        @if (croppedImage.url) {
          <img
            [src]="croppedImage.url"
            alt="Preview"
            class="w-28 h-28 object-cover border border-v4-border-color"
            [class.rounded-full]="isRounded"
            [class.rounded-xl]="!isRounded"
          />
        } @else {
          <div
            class="w-28 h-28 border border-dashed border-v4-border-color flex items-center justify-center text-[12px] text-v4-tertiary-text-color font-peridot text-center px-2"
            [class.rounded-full]="isRounded"
            [class.rounded-xl]="!isRounded"
          >
            Crop to see preview
          </div>
        }
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div
    class="flex justify-end gap-3 px-6 py-4 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      width="120px"
      customHeight="44px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
      (clickEvent)="close()"
    />
    <app-common-button-v4
      customHeight="44px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Submit"
      (clickEvent)="submit()"
      [loading]="submitting()"
      [disabled]="submitting()"
    />
  </div>
</div>
