<div>
  <!-- Modal Header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
      Request a Free Callback
    </h1>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="closeIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- Modal Body -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <div class="flex flex-col items-center gap-5">
      <p
        class="text-sm text-v4-secondary-text-color text-center font-peridot"
      >
        Please enter your phone number.<br />We will call you now.
      </p>

      <form [formGroup]="callForm" class="w-full">
        <app-phone-input-v4
          formControlName="phoneNumber"
          (countryDropdown)="countryChange($event)"
          dropdownWidth="250px"
        />
        <app-control-message-v4
          [control]="callForm.controls.phoneNumber"
        />
      </form>

      <div class="w-full px-8">
        <app-common-button-v4
          width="100%"
          [type]="{ style: 'primary', name: 'main' }"
          text="Call Me Now"
          (clickEvent)="submit()"
          [disabled]="loading()"
          [loading]="loading()"
        />
      </div>

      @if (supportNo) {
        <p class="text-xs text-v4-tertiary-text-color font-peridot">
          Call us anytime on
          <a
            class="text-sm font-semibold text-v4-main-text-color"
            href="tel:{{ supportNo }}"
          >
            {{ supportNo }}
          </a>
        </p>
      }
    </div>
  </div>
</div>
