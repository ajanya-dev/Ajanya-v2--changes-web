<div class="bank_info_wrapper">
  <div class="info_modal_wrapper">
    <h3>For Direct Deposit Add/Request Payee Bank Info</h3>
    <div class="button_area">
      <button
        class="ocw-btn ocw-btn-peacock"
        (click)="bankDetailModalOpen('customer')"
      >
        Add Yourself
      </button>

      <button
        *ngIf="editMode"
        class="ocw-btn ocw-waikava-gray"
        (click)="
          requestPayBtn(
            payeeForm.controls.payeeEmail,
            payeeForm.value.payeeEmail,
            payeeForm.controls.payeePhone,
            payeeForm.value.payeePhone
          )
        "
      >
        <svg
          aria-hidden="true"
          focusable="false"
          data-prefix="fas"
          class="svg-inline--fa fa-envelope fa-w-16"
          role="img"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 512 512"
        >
          <path
            *ngIf="!isRequestedBankInfo"
            fill="currentColor"
            d="M502.3 190.8c3.9-3.1 9.7-.2 9.7 4.7V400c0 26.5-21.5 48-48 48H48c-26.5 0-48-21.5-48-48V195.6c0-5 5.7-7.8 9.7-4.7 22.4 17.4 52.1 39.5 154.1 113.6 21.1 15.4 56.7 47.8 92.2 47.6 35.7.3 72-32.8 92.3-47.6 102-74.1 131.6-96.3 154-113.7zM256 320c23.2.4 56.6-29.2 73.4-41.4 132.7-96.3 142.8-104.7 173.4-128.7 5.8-4.5 9.2-11.5 9.2-18.9v-19c0-26.5-21.5-48-48-48H48C21.5 64 0 85.5 0 112v19c0 7.4 3.4 14.3 9.2 18.9 30.6 23.9 40.7 32.4 173.4 128.7 16.8 12.2 50.2 41.8 73.4 41.4z"
          ></path>
          <path
            *ngIf="isRequestedBankInfo"
            fill="currentColor"
            d="M173.898 439.404l-166.4-166.4c-9.997-9.997-9.997-26.206 0-36.204l36.203-36.204c9.997-9.998 26.207-9.998 36.204 0L192 312.69 432.095 72.596c9.997-9.997 26.207-9.997 36.204 0l36.203 36.204c9.997 9.997 9.997 26.206 0 36.204l-294.4 294.401c-9.998 9.997-26.207 9.997-36.204-.001z"
          ></path>
        </svg>
        <span>Request Payee to Add</span>
      </button>

      <label id="request_bank_info" *ngIf="!editMode">
        <input
          type="checkbox"
          (change)="
            requestPayBtn(
              payeeForm.value.payeeEmail,
              payeeForm.value.payeeEmail,
              payeeForm.value.payeePhone,
              payeeForm.value.payeePhone,
              $event
            )
          "
        />

        Request Payee to Add
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="15"
          height="15"
          viewBox="0 0 512 512"
          matTooltip="A link will be sent to payee email to add their bank account details"
        >
          <path
            d="M256 0C114.6 0 0 114.6 0 256s114.6 256 256 256s256-114.6 256-256S397.4 0 256 0zM256 400c-18 0-32-14-32-32s13.1-32 32-32c17.1 0 32 14 32 32S273.1 400 256 400zM325.1 258L280 286V288c0 13-11 24-24 24S232 301 232 288V272c0-8 4-16 12-21l57-34C308 213 312 206 312 198C312 186 301.1 176 289.1 176h-51.1C225.1 176 216 186 216 198c0 13-11 24-24 24s-24-11-24-24C168 159 199 128 237.1 128h51.1C329 128 360 159 360 198C360 222 347 245 325.1 258z"
          />
        </svg>
      </label>
    </div>
  </div>

  <!-- table start -->
  <div class="bank_detail_table">
    <form [formGroup]="payeeForm">
      <table width="100%">
        <thead *ngIf="this.fBankData?.controls?.length">
          <tr>
            <td>Routing Number</td>
            <td>Bank A/C Number</td>
            <td>Verify</td>
            <td>Mark as Default</td>
            <td>Action</td>
          </tr>
        </thead>
        <tbody>
          <ng-container formArrayName="bankData">
            <ng-container
              *ngFor="
                let bank of payeeForm?.controls['bankData']['controls'];
                let i = index
              "
            >
              <ng-container [formGroupName]="i">
                <tr>
                  <td>{{ bank?.value?.routingNumber }}</td>
                  <td>{{ bank?.value?.accountNumber }}</td>
                  <td style="cursor: not-allowed">
                    {{ bank !== "" ? "Request to Verify" : "" }}
                  </td>
                  <td style="text-align: center">
                    <span>
                      <!-- <mat-radio-button  [value]="bank.value.default_dd_account" (click)="onRadioBtnClick($event,i)"  formControlName="default_dd_account"  ></mat-radio-button> -->
                      <mat-radio-group formControlName="default_dd_account">
                        <mat-radio-button
                          value="1"
                          [checked]="bank?.value?.default_dd_account == 1"
                          (click)="
                            onActivateMarkAsDefaultBtn(bank?.value?.id, i)
                          "
                        ></mat-radio-button>
                      </mat-radio-group>
                    </span>
                  </td>
                  <td>
                    <div
                      class="action_wrapper"
                      *ngIf="bank"
                      [ngStyle]="{ 'pointer-events': loading ? 'none' : 'all' }"
                    >
                      <svg
                        aria-hidden="true"
                        focusable="false"
                        data-prefix="fas"
                        (click)="onBankModalEdit(i)"
                        data-icon="pencil"
                        class="svg-inline--fa fa-pencil fa-w-16"
                        role="img"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 512 512"
                      >
                        <path
                          fill="currentColor"
                          d="M497.9 142.1l-46.1 46.1c-4.7 4.7-12.3 4.7-17 0l-111-111c-4.7-4.7-4.7-12.3 0-17l46.1-46.1c18.7-18.7 49.1-18.7 67.9 0l60.1 60.1c18.8 18.7 18.8 49.1 0 67.9zM284.2 99.8L21.6 362.4.4 483.9c-2.9 16.4 11.4 30.6 27.8 27.8l121.5-21.3 262.6-262.6c4.7-4.7 4.7-12.3 0-17l-111-111c-4.8-4.7-12.4-4.7-17.1 0zM88 424h48v36.3l-64.5 11.3-31.1-31.1L51.7 376H88v48z"
                        ></path>
                      </svg>
                      <svg
                        aria-hidden="true"
                        focusable="false"
                        data-prefix="fas"
                        data-icon="trash"
                        (click)="onBankModalDelete(i, bank?.value?.id)"
                        class="svg-inline--fa fa-trash fa-w-14"
                        role="img"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 448 512"
                      >
                        <path
                          fill="currentColor"
                          d="M432 32H312l-9.4-18.7A24 24 0 0 0 281.1 0H166.8a23.72 23.72 0 0 0-21.4 13.3L136 32H16A16 16 0 0 0 0 48v32a16 16 0 0 0 16 16h416a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16zM53.2 467a48 48 0 0 0 47.9 45h245.8a48 48 0 0 0 47.9-45L416 128H32z"
                        ></path>
                      </svg>
                    </div>
                  </td>
                </tr>
              </ng-container>
            </ng-container>
          </ng-container>
        </tbody>
      </table>
    </form>
  </div>
  <!-- table end -->
</div>
