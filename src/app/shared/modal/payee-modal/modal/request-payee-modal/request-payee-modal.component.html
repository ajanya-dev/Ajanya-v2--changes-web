<div class="px-[6px] pb-[6px]">
  <!-- modal header -->
  <div class="flex justify-between pb-6">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
        <span class="pl-1 font-inter font-semibold text-base pb-0.5"
          >Send Request To Add</span
        >
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      ></fa-icon>
    </div>
  </div>
  <!-- modal body start -->
  <div [formGroup]="requestpayeeForm" class="flex flex-col gap-4">
    <div class="flex items-start">
      <input
        type="checkbox"
        name="email-checkbox"
        id="email-checkbox"
        class="mr-2 mt-3"
        formControlName="emailCheck"
      />
      <div class="w-full">
        <app-common-input-field
          placeholder="Email Address"
          formControlName="payeeEmail"
          [isFieldRequired]="false"
        />
        <app-control-message-v35
          [control]="requestpayeeForm.controls.payeeEmail"
        />
      </div>
    </div>

    <div class="flex items-start">
      <input
        type="checkbox"
        name="phone-checkbox"
        id="phone-checkbox"
        class="mr-2 mt-3"
        formControlName="phoneCheck"
      />
      <div class="w-full">
        <app-new-phone-input formControlName="payeePhone"></app-new-phone-input>
        <app-control-message-v35
          [control]="requestpayeeForm.controls.payeePhone"
        />
      </div>
    </div>
  </div>
  <!-- modal body end -->
  <div class="flex justify-end gap-3 pt-8">
    <app-common-button-v35
      width="90px"
      mat-dialog-close
      [type]="{ style: 'bordered', name: 'main' }"
      text="Cancel"
    ></app-common-button-v35>
    <app-common-button-v35
      width="90px"
      [type]="{ style: 'modal', name: 'main' }"
      text="Send"
      (clickEvent)="onSubmit()"
      [disabled]="loading"
      [loading]="loading"
    ></app-common-button-v35>
  </div>
</div>
