<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
      Update Payment Method
    </h1>
    <div
      mat-dialog-close
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body -->
  <div class="p-6 bg-v4-tertiary-background-color font-peridot">
    <form [formGroup]="updateForm">
      <div class="my-5">
        <app-v4-radio-group
          formControlName="payeeTypeId"
          [options]="payeeTypeOptions"
          ariaLabel="Select payee type"
        />

        <app-control-message-v4
          label="Please select payee type"
          [control]="updateForm.controls.payeeTypeId"
        />
      </div>

      <div>
        <select class="v4-native-select" formControlName="defaultPaymentMethod">
          <option value="" disabled>Select</option>
          @for (method of DefaultPayMethods; track method) {
            <option [value]="method.value">
              {{ method.name }}
            </option>
          }
        </select>

        <app-control-message-v4
          [control]="updateForm.controls.defaultPaymentMethod"
        />
      </div>
    </form>
  </div>

  <!-- modal footer -->
  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Update"
      [disabled]="submitting()"
      [loading]="submitting()"
      (clickEvent)="submit()"
    />
  </div>
</div>
