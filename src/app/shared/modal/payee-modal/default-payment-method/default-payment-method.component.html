<div class="px-[6px] pb-[6px]">
  <div class="flex justify-between pb-6">
     <div>
        <span class="mt-18 w-full text-base text-main-text-color align-middle flex items-center">
             <span class="pl-1 font-inter font-semibold text-base pb-0.5">Update Payment Method</span>
        </span>
     </div>
     <div [mat-dialog-close]="false">
      <fa-icon class="text-secondary-text-color cursor-pointer" [icon]="faXmark"></fa-icon>
    </div>
  </div>
  <div>
    <form [formGroup]="updateForm">
      <div class="single_input my-5">
        <mat-radio-group
          aria-label="Select an option"
          formControlName="payeeTypeId"
          class="flex justify-between"
        >
          <mat-radio-button value="1">Customer/AnyOne</mat-radio-button>
          <mat-radio-button value="2">Vendor</mat-radio-button>
          <mat-radio-button value="3">Employee</mat-radio-button>
        </mat-radio-group>

        <app-control-message
          labelName="Please select payee type"
          [control]="updateForm.controls.payeeTypeId"
        >
        </app-control-message>
      </div>

      <div class="single_input">
        <select class="input_style" formControlName="defaultPaymentMethod">
          <option value="" disabled>Select</option>
          @for(method of DefaultPayMethods; track method){
            <option [value]="method.value">
              {{ method.name }}
            </option>
          }
        </select>

        <app-control-message
          [control]="updateForm.controls.defaultPaymentMethod"
        >
        </app-control-message>
      </div>
    </form>
  </div>
  <div class="flex justify-end gap-3 pt-8">
     <app-common-button-v35 mat-dialog-close [type]="{style:'bordered', name: 'main' }" text="Cancel"></app-common-button-v35>
     <app-common-button-v35 [type]="{style:'modal', name: 'main' }" text="Update" [disabled]="submitting" [loading]="submitting" (clickEvent)="submit()"></app-common-button-v35>
  </div>
</div>
