<div class="">

  <!-- modal header -->
  <div class="flex justify-between px-6 py-4 bg-v4-popup-header-footer-color border-b border-v4-border-color">
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Change Root URL
      </h1>
    </div>
    <div [mat-dialog-close]="false" class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center">
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body -->
  <div class="p-6 bg-v4-tertiary-background-color space-y-3">

    <app-common-input-v4
      [formControl]="url"
      [control]="url"
      [fieldLabel]="'Root URL'"
      [placeholder]="'https://'"
      [type]="'text'"
      [isFieldRequired]="true"
      [errorLabel]="'URL'"
    />

    <p class="text-xs text-v4-subtle-text-color font-peridot">
      eg: https://test.api.ocw.sebipay.com
    </p>

    <div class="flex items-start gap-1 text-sm font-peridot">
      <span class="text-v4-secondary-text-color shrink-0">Current URL:</span>
      <span class="text-v4-primary-brand-color font-medium break-all">
        {{ isChangedUrlExist || rootUrl }}
      </span>
    </div>

    @if (isChangedUrlExist) {
      <div class="pt-1">
        <app-common-button-v4
          [type]="{ style: 'destructive', name: 'main' }"
          text="Reset to Default"
          width="auto"
          [matTooltip]="'Reset to default staging URL'"
          (clickEvent)="resetBaseUrl()"
        />
      </div>
    }

  </div>

  <!-- modal footer -->
  <div class="flex justify-end gap-3 p-6 bg-v4-popup-header-footer-color border-t border-v4-border-color">
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Change"
      (clickEvent)="onSubmit()"
      [disabled]="url.invalid"
    />
  </div>

</div>
