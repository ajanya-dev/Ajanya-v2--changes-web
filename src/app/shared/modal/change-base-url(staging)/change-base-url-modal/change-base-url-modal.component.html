<div class="ocw_man_modal_wrapper">
  <!-- modal header -->
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">Change Root URL</div>
  </div>
  <!-- modal body start -->
  <div class="ocw_modal_body">
    <div class="single_input">
      <input
        type="text"
        class="input_style"
        [formControl]="url"
        placeholder=" "
      />
      <span class="floating_label_field">Root URL</span>
      <app-control-message
        [control]="url"
        labelName="URL is required"
      ></app-control-message>
    </div>

    <div class="example">
      <p>eg: https://test.api.ocw.sebipay.com</p>
    </div>
    <div class="changed_url">
      <p *ngIf="isChangedUrlExist; else current">
        Current URL: <span>{{ isChangedUrlExist }}</span>
      </p>
      <ng-template #current>
        <p>
          Current URL: <span id="root_url">{{ rootUrl }}</span>
        </p>
      </ng-template>
    </div>
  </div>
  <!-- modal body end -->
  <div class="ocw_modal_footer">
    <mat-dialog-actions align="start">
      <button
        (click)="resetBaseUrl()"
        *ngIf="isChangedUrlExist"
        matTooltip="click to reset default staging url(API)"
        class="ocw-btn ocw-btn-trash"
      >
        Reset
      </button>
    </mat-dialog-actions>

    <mat-dialog-actions align="end">
      <button mat-dialog-close class="ocw-btn ocw-btn-gray">Cancel</button>
      <button
        (click)="onSubmit()"
        type="submit"
        class="ocw-btn ocw-btn-light-green add_btn"
      >
        <span>Change</span>
      </button>
    </mat-dialog-actions>
  </div>
</div>
