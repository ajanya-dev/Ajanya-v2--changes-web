<div class="ocw_man_modal_wrapper">
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">
      {{ data?.heading ? data.heading : 'Add Email to ' + ('Payee' | whiteLabel: 'payeeName') }}
    </div>
    <div class="close_btn" [mat-dialog-close]="false">
      <svg
        aria-hidden="true"
        focusable="false"
        data-prefix="fal"
        data-icon="times"
        class="svg-inline--fa fa-times fa-w-10"
        role="img"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 320 512"
      >
        <path
          fill="currentColor"
          d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
        ></path>
      </svg>
    </div>
  </div>

  <div class="ocw_modal_body">
    <form [formGroup]="emailPayee">
      <div class="input_group my-8">
        <!-- 1st line -->
        <!-- <div class="single_input no_modal_btn flex-half">
               <input type="text" class="input_style" placeholder=" " formControlName="name">
               <span class="floating_label_field">Payee Name</span>
               <app-control-message [control]="emailPayee.controls.name" labelName="please enter name"></app-control-message>
            </div>

            <div class="single_input no_modal_btn flex-half">
               <input type="text" class="input_style" placeholder=" " formControlName="nick_name" >
               <span class="floating_label_field">Nick Name </span>
               <app-control-message [control]="emailPayee.controls.nick_name" labelName="please ente nick name"></app-control-message>
            </div> -->

        <div class="single_input no_modal_btn flex-full">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="email"
          />
          <span class="floating_label_field">Email</span>
          <app-control-message
            [control]="emailPayee.controls.email"
            labelName="Invalid email"
          ></app-control-message>
        </div>
      </div>
    </form>
  </div>

  <div class="ocw_modal_footer">
    <mat-dialog-actions align="end">
      <button
        (click)="submit()"
        type="submit"
        class="ocw-btn ocw-btn-modal-blue add_btn"
        [ngClass]="{ 'loadingSpinner spinner-gap': isloading }"
      >
        <span>Save</span>
      </button>
    </mat-dialog-actions>
  </div>
</div>
