<div class="ocw_man_modal_wrapper">
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">Add {{ entityLabel }} Bank Account</div>
  </div>

  <form [formGroup]="addBankAccount">
    <div class="ocw_modal_body">
      <div class="title">
        <p>Please add bank account details of the {{ entityLabel | lowercase }}.</p>
      </div>
      <div *ngIf="!isConfirm" class="input_group my-8">
        <!-- 1st line -->
        <div class="single_input no_modal_btn flex-half">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            required
            formControlName="bankName"
          />
          <span class="floating_label_field"
            >Bank Account Holder Name <span class="required">*</span></span
          >
          <app-control-message
            [control]="addBankAccount.controls.bankName"
            labelName="Bank name is required"
          ></app-control-message>
        </div>

        <div class="single_input no_modal_btn flex-half">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            required
            formControlName="routingNumber"
            maxlength="9"
            max="999999999"
            (keypress)="utils.numberOnly($event, 'numeric')"
          />
          <span class="floating_label_field"
            >Routing Number <span class="required">*</span></span
          >
          <app-control-message
            [control]="addBankAccount.controls.routingNumber"
            labelName="Routing number is required"
          ></app-control-message>
        </div>

        <div class="single_input no_modal_btn flex-half">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            required
            formControlName="accountNumber"
            (keypress)="utils.numberOnly($event, 'numeric')"
          />
          <span class="floating_label_field"
            >Account Number <span class="required">*</span></span
          >
          <app-control-message
            [control]="addBankAccount.controls.accountNumber"
            labelName="Account number is required"
          ></app-control-message>
        </div>

        <div class="single_input no_modal_btn flex-half">
          <select
            formControlName="accountType"
            class="input_style"
            required
          >
          <option value="" selected disabled>Account Type</option>
          @for(accountType of bankAccountType; track accountType.value) {
              <option [value]=" accountType.value">{{ accountType.name }}</option>
            }
          </select>
          <app-control-message
            [control]="addBankAccount.controls.accountType"
            labelName="Account type is required"
          ></app-control-message>
        </div>
      </div>
      <div *ngIf="isConfirm" class="input_group my-8">
        <div class="single_input no_modal_btn flex-half">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="confirmAccountNumber"
            (keyup)="notMatch = false"
            (keypress)="utils.numberOnly($event, 'numeric')"
          />
          <span class="floating_label_field"
            >Confirm Account Number<span class="required">*</span></span
          >
          <app-control-message
            [control]="addBankAccount.controls.confirmAccountNumber"
            labelName="Confirm account number is required"
          ></app-control-message>
          <span *ngIf="notMatch" class="error_msg"
            >Account number and Confirm account number doesn't match</span
          >
        </div>
      </div>
    </div>

    <div class="ocw_modal_footer">
      <mat-dialog-actions align="end">
        <button mat-dialog-close class="ocw-btn ocw-btn-modal-bordered">
          Close
        </button>

        <button
          class="ocw-btn add_btn"
          [ngClass]="isConfirm ? 'ocw-btn-modal-blue' : 'ocw-btn-modal-blue'"
          (click)="change()"
        >
          <span>{{ isConfirm ? "Back" : "Next" }}</span>
        </button>

        <button
          *ngIf="isConfirm"
          type="submit"
          class="ocw-btn ocw-btn-modal-blue add_btn"
          [ngClass]="{ 'loadingSpinner spinner-gap': isloading }"
          (click)="submit()"
        >
          <span>Save</span>
        </button>
      </mat-dialog-actions>
    </div>
  </form>
</div>
