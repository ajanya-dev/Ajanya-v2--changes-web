<div class="px-[6px] pb-[6px]">
  <!-- modal header -->
  <div class="flex justify-between pb-6">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
        <span class="font-inter font-semibold text-base pb-0.5">Recurring</span>
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      ></fa-icon>
    </div>
  </div>
  <!-- modal body start -->
  <div [formGroup]="reccuringForm" class="flex flex-col gap-4">
    <div class="flex justify-between items-center">
      <span class="w-36 text-sm font-inter font-normal text-main-text-color"
        >Frequency</span
      >
      <div class="single_input no_modal_btn w-[220px]">
        <select formControlName="frequency" class="input_style" required>
          @for (option of frequencyOptions; track option.value) {
            <option [value]="option.value">
              {{ option.label }}
            </option>
          }
        </select>
      </div>
    </div>
    <div class="flex justify-between items-center">
      <span class="w-36 text-sm font-inter font-normal text-main-text-color"
        >Starting Date</span
      >
      <div class="w-[220px]">
        <input
          type="date"
          class="input_style"
          formControlName="start_date"
          [min]="minDate"
        />
        @if (reccuringForm.controls.start_date.value < minDate) {
          <div class="flex gap-1 pt-[2px]">
            <fa-icon
              class="text-common-red-color text-[12px]"
              [icon]="faCircleExclamation"
              animation="shake"
              size="lg"
            ></fa-icon>
            <p class="text-common-red-color text-xs font-medium font-roboto">
              Starting date should be a future date.
            </p>
          </div>
        }
      </div>
    </div>
    <div class="flex w-full justify-between mb-5">
      <mat-radio-group
        formControlName="end_select"
        aria-label="Select an option"
        class="flex flex-col"
      >
        <mat-radio-button
          value="3"
          checked="checked"
          class="flex items-center input-text-color text-sm font-inter font-normal text-main-text-color cursor-pointer"
          >Pay Until I Cancel</mat-radio-button
        >
        <mat-radio-button
          value="1"
          class="flex"
          class="flex items-center mt-4 input-text-color text-sm font-inter font-normal text-main-text-color cursor-pointer"
          >Pay for
        </mat-radio-button>
      </mat-radio-group>
      <div class="flex items-end flex-col">
        <div class="h-7"></div>
        @if (reccuringForm.controls.end_select.value === "1") {
          <div>
            <app-common-input-field
              placeholder=""
              formControlName="count"
              [isFieldRequired]="false"
              [isNumberOnly]="true"
              [maxLength]="3"
            />
            <app-control-message-v35 [control]="reccuringForm.controls.count" />
          </div>
        }
      </div>
    </div>
  </div>
  <!-- modal body end -->
  <div class="flex justify-end gap-3 pt-8">
    <app-common-button-v35
      mat-dialog-close
      width="120px"
      [type]="{ style: 'bordered', name: 'main' }"
      text="Close"
    ></app-common-button-v35>
    <app-common-button-v35
      width="120px"
      [type]="{ style: 'modal', name: 'main' }"
      text="Submit"
      (clickEvent)="submit()"
    ></app-common-button-v35>
  </div>
</div>
