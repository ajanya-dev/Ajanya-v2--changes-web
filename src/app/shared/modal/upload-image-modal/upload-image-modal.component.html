<div class="flex">
  <div>
    <image-cropper
      style="width: 400px"
      [imageChangedEvent]="data.event"
      [maintainAspectRatio]="true"
      [aspectRatio]="2 / 2"
      format="png"
      (imageCropped)="imageCropped($event)"
      [resizeToWidth]="228"
      [onlyScaleDown]="true"
      [cropperMinWidth]="128"
      [roundCropper]="isRounded"
    >
    </image-cropper>
  </div>

  <div>
    <img
      [src]="croppedImage"
      alt=""
      style="width: 100%"
      [ngStyle]="isRounded ? { 'border-radius': '50%' } : ''"
    />
  </div>
</div>

<div class="ocw_modal_footer">
  <mat-dialog-actions align="end">
    <button class="ocw-btn ocw-btn-modal-bordered" (click)="close()">
      Cancel
    </button>

    <div class="grid justify-items-end">
      <button
        (click)="imageUpload()"
        type="submit"
        class="ocw-btn ocw-btn-modal-blue add_btn"
        [disabled]="btnDesable"
      >
        <ng-container *ngIf="!btnDesable">
          <span>{{ btnDesable ? "" : "SUBMIT" }}</span>
        </ng-container>
        <span *ngIf="btnDesable" class="loadingSpinner"></span>
      </button>
    </div>
  </mat-dialog-actions>
</div>
