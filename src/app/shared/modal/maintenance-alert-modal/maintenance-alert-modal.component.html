<div class="w-[400px] mx-auto   overflow-hidden ">
    <!-- Simple header -->
    <div class="bg-common-blue-color p-4 flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white mr-3" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z"
          clip-rule="evenodd" />
      </svg>
      <h2 class="text-base font-semibold text-white">System Upgrade</h2>
    </div>
  
    <!-- Compact content -->
    <div class="p-4">
      <p class="text-main-text-color text-sm mb-4" [innerHTML]="injectedData.content">
      </p>
  
      <!-- Simplified help section -->
      <div class="bg-secondary-background-color p-3 rounded-md  text-sm">
        <h3 class="text-secondary-text-color mb-2 font-medium">Need help?</h3>
  
        <div class="space-y-2">
  
          <!-- Email -->
          <div class="flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-[#4361ee] mr-2" viewBox="0 0 20 20"
              fill="currentColor">
              <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
              <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
            </svg>
            <a [href]="
              'mailto:' + staticWhiteLabelConditions.customerSupportEmail
            " class="text-[#4361ee] hover:underline">{{
              staticWhiteLabelConditions.customerSupportEmail
              }}</a>
          </div>
  
          <!-- Phone -->
          @if (staticWhiteLabelConditions.customerSupportNo) {
          <div class="flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-[#4361ee] mr-2" viewBox="0 0 20 20"
              fill="currentColor">
              <path
                d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z" />
            </svg>
            <a [href]="
              'tel:' + staticWhiteLabelConditions.customerSupportNo
            " class="text-[#4361ee] hover:underline">{{ staticWhiteLabelConditions.customerSupportNo }}</a>
          </div>
          }
  
          <!-- Chat -->
          <!-- <div class="flex items-center">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-[#4361ee] mr-2" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z" clip-rule="evenodd" />
              </svg>
              <button class="text-[#4361ee] hover:underline">Chat with us</button>
            </div> -->
        </div>
      </div>
    </div>
  
    <!-- Simple button area -->
    <div class="p-3 flex justify-end bg-main-background-color">
      <button [mat-dialog-close]="false"
        class="bg-common-blue-color text-white px-4 py-1.5 rounded text-sm transition-colors duration-300">OK</button>
    </div>
  </div>
