<div class="font-funnel rounded-2xl overflow-hidden w-[420px]">
  <!-- modal header -->
  <div
    class="flex justify-between items-center px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex items-center gap-2">
      <div
        class="w-9 h-9 rounded-full bg-v4-primary-brand-color flex justify-center items-center"
      >
        <lucide-icon [img]="ClockIcon" class="text-white" [size]="18" />
      </div>
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel m-0">
        System Upgrade
      </h1>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color space-y-4">
    <p
      class="text-sm text-v4-main-text-color leading-relaxed"
      [innerHTML]="injectedData.content"
    ></p>

    <!-- Support section -->
    <div
      class="rounded-xl border border-v4-border-color bg-v4-secondary-background-color p-4 space-y-2"
    >
      <p class="text-xs font-medium text-v4-subtle-text-color">Need help?</p>

      <a
        [href]="'mailto:' + staticWhiteLabelConditions.customerSupportEmail"
        class="flex items-center gap-2 text-sm text-v4-primary-brand-color hover:underline"
      >
        <lucide-icon [img]="MailIcon" [size]="14" />
        {{ staticWhiteLabelConditions.customerSupportEmail }}
      </a>

      @if (staticWhiteLabelConditions.customerSupportNo) {
        <a
          [href]="'tel:' + staticWhiteLabelConditions.customerSupportNo"
          class="flex items-center gap-2 text-sm text-v4-primary-brand-color hover:underline"
        >
          <lucide-icon [img]="PhoneIcon" [size]="14" />
          {{ staticWhiteLabelConditions.customerSupportNo }}
        </a>
      }
    </div>
  </div>
  <!-- modal body end -->

  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      mat-dialog-close=""
      width="100px"
      [type]="{ style: 'primary', name: 'main' }"
      text="OK"
    />
  </div>
</div>
