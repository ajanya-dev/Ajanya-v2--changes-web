<!-- Modal Container -->
<div class="fixed inset-0 z-[10000]">
  <!-- Backdrop overlay for blur effect and click blocking (not clickable) -->
  <div class="fixed inset-0 bg-[rgba(0,0,0,0.3)] transition-opacity duration-200"></div>
  
  <!-- Popup positioned absolutely -->
  <div class="relative bg-white rounded-lg shadow-xl w-80 pointer-events-auto transition-all duration-400 international-payment-popup z-[10001]">
    <!-- Top Arrow Pointer (pointing up to menu item) -->
    <div class="absolute left-6 top-[-6px] w-0 h-0 border-l-[6px] border-r-[6px] border-b-[6px] border-l-transparent border-r-transparent border-b-white z-10"></div>
    
    <!-- Content -->
    <div class="p-3">
      <div class="flex items-start gap-2.5">
        <!-- Icon -->
        <div class="w-8 h-8 bg-common-secondary-blue-color rounded-lg flex items-center justify-center flex-shrink-0">
          <fa-icon [icon]="faGlobe" class="text-common-blue-color text-sm"></fa-icon>
        </div>
        
        <!-- Text content -->
        <div class="flex-1">
          <div class="flex items-center gap-1 mb-0.5">
            <h3 class="font-semibold text-[13px] text-gray-900">
              New:International Payments
            </h3>
          </div>
          <p class="text-gray-600 text-[12px] leading-snug mb-3">
            Send money globally in minutes at the best rates
          </p>
          <!-- Buttons side by side -->
          <div class="flex gap-2">
            <app-common-button-v35
              [text]="'Start Sending Now'"
              [type]="'small'"
              [customClasses]="'bg-common-blue-color hover:bg-common-dark-blue-color text-white font-medium text-[12px] py-1.5 px-3 rounded-lg flex-1'"
              (clickEvent)="onStartSending()"
            />
            <app-common-button-v35
              [text]="'Dismiss'"
              [type]="'borderless'"
              [textColorInput]="'#4B5563'" 
              [customClasses]="'hover:text-gray-900 font-medium text-[12px] py-1.5 px-3'"
              (clickEvent)="onDismiss()"
            />
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
