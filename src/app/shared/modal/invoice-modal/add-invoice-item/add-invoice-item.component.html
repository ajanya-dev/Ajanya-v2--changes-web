<div class="ocw_man_modal_wrapper add_bank_modal">
  <form method="POST">
    <div class="ocw_modal_header">
      <div class="ocw_modal_title">
        {{ !editMode ? "Add Item" : "Edit Item" }}
      </div>
      <div class="close_btn" [mat-dialog-close]="false">
        <svg
          aria-hidden="true"
          focusable="false"
          data-prefix="fal"
          data-icon="times"
          class="svg-inline--fa fa-times fa-w-10"
          role="img"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 320 512"
        >
          <path
            fill="currentColor"
            d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
          ></path>
        </svg>
      </div>
    </div>

    <!-- modal body start -->
    <div class="ocw_modal_body">
      <form [formGroup]="itemForm">
        <div class="input_group bank_credential">
          <div class="single_input">
            <input
              type="text"
              class="input_style"
              formControlName="product_name"
              autocomplete="product_name"
              maxlength="30"
              placeholder=" "
            />
            <span class="floating_label_field"
              >Product Name <span class="required">*</span></span
            >
            <app-control-message
              [control]="itemForm.controls.product_name"
            ></app-control-message>
          </div>

          <div class="single_input">
            <input
              type="text"
              class="input_style"
              formControlName="unit_price"
              placeholder=" "
              (keypress)="utils.numberOnly($event, 'decimal')"
              maxlength="13"
              mask="separator.2"
              thousandSeparator=","
            />
            <span class="floating_label_field"
              >Unit Price <span class="required">*</span></span
            >
            <app-control-message
              [control]="itemForm.controls.unit_price"
            ></app-control-message>
          </div>

          <div class="single_input">
            <input
              type="text"
              class="input_style"
              maxlength="50"
              formControlName="description"
              placeholder=" "
            />
            <span class="floating_label_field">Description </span>
          </div>

          <div class="single_input">
            <input
              type="text"
              class="input_style"
              formControlName="private_note"
              placeholder=" "
              maxlength="100"
            />
            <span class="floating_label_field">Private Note </span>
          </div>

          <div>
            <input
              type="checkbox"
              formControlName="track"
              id="product_track"
              (click)="checked($event)"
              placeholder=" "
            />
            <label for="product_track" class="track">Track Product</label>
          </div>

          <div *ngIf="Instock" class="single_input">
            <input
              type="text"
              class="input_style"
              (keypress)="utils.numberOnly($event, 'numeric')"
              maxlength="8"
              formControlName="instock"
              placeholder="0"
            />
            <span class="floating_label_field"
              >Stock Quantity <span class="required">*</span></span
            >
            <app-control-message
              [control]="itemForm.controls.instock"
            ></app-control-message>
          </div>
        </div>
      </form>
    </div>
    <!-- modal body end -->

    <div class="ocw_modal_footer">
      <mat-dialog-actions align="end">
        <button
          mat-dialog-close
          class="ocw-btn ocw-btn-modal-bordered close_btn"
        >
          Close
        </button>
        <button
          type="button"
          *ngIf="!editMode"
          (click)="submit()"
          class="ocw-btn ocw-btn-modal-blue add_btn"
        >
          <svg
            aria-hidden="true"
            focusable="false"
            data-prefix="fas"
            data-icon="plus"
            class="svg-inline--fa fa-plus fa-w-14"
            role="img"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 448 512"
          >
            <path
              fill="currentColor"
              d="M416 208H272V64c0-17.67-14.33-32-32-32h-32c-17.67 0-32 14.33-32 32v144H32c-17.67 0-32 14.33-32 32v32c0 17.67 14.33 32 32 32h144v144c0 17.67 14.33 32 32 32h32c17.67 0 32-14.33 32-32V304h144c17.67 0 32-14.33 32-32v-32c0-17.67-14.33-32-32-32z"
            ></path>
          </svg>
          <span> {{ loading ? "Saving..." : "Add " }}</span>
        </button>
        <button
          type="button"
          *ngIf="editMode"
          (click)="update()"
          class="ocw-btn ocw-btn-modal-blue add_btn"
        >
          <svg
            aria-hidden="true"
            focusable="false"
            data-prefix="fas"
            data-icon="plus"
            class="svg-inline--fa fa-plus fa-w-14"
            role="img"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 448 512"
          >
            <path
              fill="currentColor"
              d="M416 208H272V64c0-17.67-14.33-32-32-32h-32c-17.67 0-32 14.33-32 32v144H32c-17.67 0-32 14.33-32 32v32c0 17.67 14.33 32 32 32h144v144c0 17.67 14.33 32 32 32h32c17.67 0 32-14.33 32-32V304h144c17.67 0 32-14.33 32-32v-32c0-17.67-14.33-32-32-32z"
            ></path>
          </svg>
          <span> {{ loading ? "Saving..." : "Update" }}</span>
        </button>
      </mat-dialog-actions>
    </div>
  </form>
</div>
