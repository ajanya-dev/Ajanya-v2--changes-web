<div class="ocw_man_modal_wrapper">
  <form [formGroup]="deviceForm" (ngSubmit)="onSubmit()">
    <div class="ocw_modal_header">
      <div class="ocw_modal_title">Edit Device Name</div>
    </div>

    <div class="ocw_modal_body">
      <table style="width: 100%" class="device_table">
        <tbody>
          <tr>
            <td>Device Address</td>
            <td>:</td>
            <td>{{ deviceData?.deviceAddress }}</td>
          </tr>
          <tr>
            <td>Enter Device Name</td>
            <td>:</td>
            <td>
              <input
                type="text"
                formControlName="deviceName"
                placeholder="Enter Device Name Here"
                class="input_style"
              />
              <app-control-message
                [control]="deviceForm.controls.deviceName"
                [labelName]="'Device Name is Required.'"
              ></app-control-message>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="ocw_modal_footer">
      <mat-dialog-actions align="end">
        <button mat-dialog-close class="ocw-btn ocw-btn-gray">Cancel</button>

        <button type="submit" class="ocw-btn ocw-btn-light-green add_btn">
          <span>Save</span>

          <!-- <svg aria-hidden="true" focusable="false" data-prefix="fas" data-icon="plus"
          class="svg-inline--fa fa-plus fa-w-14" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
          <path fill="currentColor"
            d="M416 208H272V64c0-17.67-14.33-32-32-32h-32c-17.67 0-32 14.33-32 32v144H32c-17.67 0-32 14.33-32 32v32c0 17.67 14.33 32 32 32h144v144c0 17.67 14.33 32 32 32h32c17.67 0 32-14.33 32-32V304h144c17.67 0 32-14.33 32-32v-32c0-17.67-14.33-32-32-32z">
          </path>
        </svg> -->
        </button>
      </mat-dialog-actions>
    </div>
  </form>
</div>
