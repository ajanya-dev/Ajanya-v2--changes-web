<div class="ocw_man_modal_wrapper">
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">
      <h3>{{ data?.mode === "edit" ? "Edit" : "Add New" }} Vendor Credit</h3>
    </div>

    <div class="close_btn" [mat-dialog-close]="false">
      <svg
        aria-hidden="true"
        focusable="false"
        data-prefix="fal"
        data-icon="times"
        class="svg-inline--fa fa-times fa-w-10"
        role="img"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 320 512"
      >
        <path
          fill="currentColor"
          d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
        ></path>
      </svg>
    </div>
  </div>
  <div class="items-center w-full flex justify-between p-3 bg-common-secondary-blue-color rounded mt-3">
    <div class="flex justify-start items-center gap-2 w-1/2">
      <input
      type="radio"
      name="credit-type"
      class="w-4 h-4"
      id="credit-type-bill"
      [value]="'bill'"
      [checked]="isBill()"
      [ngModel]="selectedCreditType()"
      (ngModelChange)="onCreditTypeChange($event)"
      >
      <label for="credit-type-bill text-sm">Bill</label>
    </div>
    <div class="flex justify-start items-center gap-2 w-1/2">
      <input
      type="radio"
      name="credit-type"
      class="w-4 h-4"
      id="credit-type-payee"
      [value]="'payee'"
      [checked]="!isBill()"
      [ngModel]="selectedCreditType()"
      (ngModelChange)="onCreditTypeChange($event)"
      >
      <label for="credit-type-payee text-sm">Payee</label>
    </div>
  </div>

  <!-- FORM START -->
  <form [formGroup]="vendorForm" (ngSubmit)="save()">
    <div class="ocw_modal_body">
      <!-------- input_group start -------->
      <div class="input_group">
        @if(isBill()) {
        <div class="single_input no_modal_btn">
          <ng-select 
            [items]="bills" 
            formControlName="bill" 
            placeholder="Select Bill" 
            bindLabel="invNo" 
            bindValue="billId"
            [loading]="loadingBills()" 
            [clearable]="true" 
            [searchable]="true"
            [notFoundText]="loadingBills() ? 'Loading...' : 'No bills found'" 
            (scrollToEnd)="onScrollToEnd()"
            (keyup)="onSearch($event)" 
            class="ng-dropdown-panel-v35 text-sm height-0"
          >
          </ng-select>
          <app-control-message
            [control]="vendorForm.controls.bill"
            labelName="Bill is required"
          ></app-control-message>
        </div>
        }@else {
        <div class="single_input no_modal_btn">
          <app-drop-down-payee
            class="drop_style"
            (selectionEvent)="onPayeeChange($event)"
          ></app-drop-down-payee>
          <app-control-message
            [control]="vendorForm.controls.payee"
            labelName="Payee is required"
          ></app-control-message>
        </div>
        }
        <div class="single_input no_modal_btn">
          <app-drop-down-bank
            class="drop_style"
            (selectionEvent)="onBankAccountChange($event)"
          ></app-drop-down-bank>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="creditNo"
          />
          <span class="floating_label_field">
            Credit No <span class="required">*</span></span
          >
          <app-control-message
            [control]="vendorForm.controls.creditNo"
            labelName="Credit No. is required"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="date"
            class="input_style"
            formControlName="creditDate"
            placeholder=" "
          />
          <span class="floating_label_field"
            >Credit Date <span class="required">*</span></span
          >
          <app-control-message
            [control]="vendorForm.controls.creditDate"
            labelName="Credit Date is required"
          ></app-control-message>
        </div>

        <div class="single_input">
          <app-amount-input
            [maxLength]="13"
            formControlName="amount"
          ></app-amount-input>
          <app-control-message
            [control]="vendorForm.controls.amount"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="accNo"
          />
          <span class="floating_label_field">Account No </span>
        </div>

        <div class="single_input no_modal_btn">
          <app-drop-down-category
            class="drop_style"
            (selectionEvent)="changeCat($event)"
            dropdownPosition="top"
          ></app-drop-down-category>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="memo"
            maxlength="150"
          />
          <span class="floating_label_field">Memo</span>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="ocw_modal_footer">
      <mat-dialog-actions align="end">
        <button
          type="submit"
          class="ocw-btn ocw-btn-modal-blue add_btn"
          [ngClass]="{ disableBtn: submitting }"
        >
          <span *ngIf="submitting" class="loadingSpinner"></span>
          {{ data?.mode === "edit" ? "Update" : "Add" }}
        </button>
      </mat-dialog-actions>
    </div>
  </form>
  <!-- FORM END -->
</div>
