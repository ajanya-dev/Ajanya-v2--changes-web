<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between items-center px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex items-center gap-2">
      <div
        class="w-8 h-8 rounded-lg flex items-center justify-center"
        style="background-color: rgba(5, 149, 229, 0.12)"
      >
        <lucide-icon
          [img]="UserPlusIcon"
          [size]="16"
          style="color: var(--v4-primary-brand-color)"
        ></lucide-icon>
      </div>
      <h1 class="text-base font-semibold text-v4-main-text-color font-funnel">
        {{ CurrentTab }}
      </h1>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <form [formGroup]="newUserForm" class="space-y-4">
      <!-- User Type Dropdown -->
      <div appWhiteLabel hiddenIf="isCompassRequirement">
        <label
          class="text-sm font-medium font-funnel text-v4-main-text-color mb-1.5 block"
        >
          User Type <span class="text-v4-common-red-color">*</span>
        </label>
        <app-v4-common-dropdown
          [listData]="userTypeOptions"
          [config]="{ placeholder: 'Select User Type' }"
          formControlName="userType"
          (ngModelChange)="onUserTypeChange($event)"
        ></app-v4-common-dropdown>
        <app-control-message-v4
          [control]="newUserForm.controls.userType"
        ></app-control-message-v4>
      </div>

      <!-- User Email -->
      <div>
        <app-common-input-v4
          formControlName="email"
          fieldLabel="User Email"
          [isFieldRequired]="true"
          placeholder="Enter user email"
          class="w-full"
        ></app-common-input-v4>
        <app-control-message-v4
          [control]="newUserForm.controls.email"
        ></app-control-message-v4>
      </div>

      <!-- Confirm User Email -->
      <div>
        <app-common-input-v4
          formControlName="confirmUserEmail"
          fieldLabel="Confirm User Email"
          [isFieldRequired]="true"
          placeholder="Confirm user email"
          class="w-full"
        ></app-common-input-v4>
        <app-control-message-v4
          [control]="newUserForm.controls.confirmUserEmail"
        ></app-control-message-v4>
      </div>

      <!-- Full Legal Name -->
      <div>
        <app-common-input-v4
          formControlName="name"
          fieldLabel="Full Legal Name"
          [isFieldRequired]="true"
          placeholder="Enter full legal name"
          class="w-full"
        ></app-common-input-v4>
        <app-control-message-v4
          [control]="newUserForm.controls.name"
        ></app-control-message-v4>
      </div>

      <!-- Nick Name -->
      <div appWhiteLabel hiddenIf="isCompassRequirement">
        <app-common-input-v4
          formControlName="nickName"
          fieldLabel="Nick Name"
          [isFieldRequired]="true"
          placeholder="Enter nick name"
          class="w-full"
        ></app-common-input-v4>
        <app-control-message-v4
          [control]="newUserForm.controls.nickName"
        ></app-control-message-v4>
      </div>

      <!-- Preferred Company Name -->
      <div>
        <app-common-input-v4
          formControlName="companyName"
          fieldLabel="Preferred Company Name"
          [isFieldRequired]="true"
          placeholder="Enter preferred company name"
          class="w-full"
        ></app-common-input-v4>
        <app-control-message-v4
          [control]="newUserForm.controls.companyName"
        ></app-control-message-v4>
      </div>
    </form>
  </div>

  <!-- modal footer -->
  <div
    class="flex justify-end gap-3 px-6 py-4 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="160px"
      [type]="{ style: 'primary', name: 'main' }"
      [text]="buttonText"
      (clickEvent)="newUserSubmit()"
      [disabled]="isUserAdding"
      [loading]="isUserAdding"
    />
  </div>
</div>
