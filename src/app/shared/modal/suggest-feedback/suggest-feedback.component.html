<div class="ocw_man_modal_wrapper category_modal w-[540px]">
  <form [formGroup]="feedbackForm">
    <div class="flex justify-between pb-4">
      <div>
        <span
          class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
        >
          <span class="pl-1 font-inter font-semibold text-base pb-0.5">
            We'd welcome your feedback!
          </span>
        </span>
      </div>
      <div
        [mat-dialog-close]="false"
        (click)="close()"
        (keydown)="close()"
        tabindex="0"
      >
        <fa-icon
          class="text-secondary-text-color cursor-pointer"
          [icon]="faXmark"
        ></fa-icon>
      </div>
    </div>

    <div class="relative">
      <p class="text-xs">
        Thank you for visiting our website. Let us know how we can improve your
        experience.
      </p>
      <div class="mt-4 flex flex-wrap gap-y-4 gap-x-6">
        <div class="single_input w-full">
          <textarea
            type="text"
            #descriptionTextarea
            id="hyperlinkContainer"
            class="input_style !h-36"
            id="description"
            placeholder=" "
            formControlName="description"
            maxlength="240"
          ></textarea>
          <span class="floating_label_field"
            >Description <span class="required">*</span></span
          >
          <app-control-message
            [control]="feedbackForm.controls.description"
            labelName="Description is Required"
          ></app-control-message>
        </div>
        <div class="ocw-browse-file !max-w-full min-w-[250px]">
          <app-common-upload-button-v35
            buttonText="Upload File"
            [acceptedFileTypes]="acceptedFileTypes"
            (selectedFileEvent)="uploadInput($event)"
          ></app-common-upload-button-v35>
        </div>
      </div>
      <div class="flex justify-end gap-3 pt-8">
        <app-common-button-v35
          [type]="{ style: 'modal', name: 'main' }"
          [disabled]="loading()"
          [loading]="loading()"
          text="Submit"
          (clickEvent)="onSave()"
        ></app-common-button-v35>
      </div>
    </div>
  </form>
</div>
