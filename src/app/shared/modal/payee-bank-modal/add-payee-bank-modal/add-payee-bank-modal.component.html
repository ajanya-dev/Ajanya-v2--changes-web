<ng-container *ngIf="!isItConfirmed; else confirmed">
  <div class="ocw_man_modal_wrapper">
    <div class="ocw_modal_header">
      <div
        class="ocw_modal_title !text-base !font-semibold !text-main-text-color"
      >
        {{
          data.editMode ? "Edit Payee Bank Account" : "Add Payee Bank Account"
        }}
      </div>
    </div>

    <form [formGroup]="addBankForm">
      <div class="ocw_modal_body">
        <div class="input_group my-8">
          <div class="single_input no_modal_btn flex-half">
            <input
              type="text"
              class="input_style"
              placeholder=" "
              required
              formControlName="bankName"
            />
            <span class="floating_label_field"
              >Bank Account Holder Name <span class="required">*</span></span
            >
            <app-control-message
              [control]="addBankForm.controls.bankName"
              labelName="Bank name is required"
            >
            </app-control-message>
          </div>

          <div class="single_input no_modal_btn flex-half">
            <input
              type="text"
              class="input_style"
              placeholder=" "
              (keyup)="lookupRoutingNumber($event.target.value)"
              required
              formControlName="routingNumber"
              max="999999999"
              maxlength="9"
              (keypress)="utils.numberOnly($event, 'numeric')"
            />
            <span class="floating_label_field"
              >Routing Number <span class="required">*</span></span
            >
            <app-control-message
              [control]="addBankForm.controls.routingNumber"
              labelName="Routing number is required"
            ></app-control-message>
          </div>

          <div class="single_input no_modal_btn flex-half">
            <input
              type="text"
              class="input_style"
              placeholder=" "
              required
              formControlName="accountNumber"
              (keypress)="utils.numberOnly($event, 'numeric')"
            />
            <span class="floating_label_field"
              >Account Number <span class="required">*</span></span
            >
            <app-control-message
              [control]="addBankForm.controls.accountNumber"
              labelName="Account number is required"
            ></app-control-message>
          </div>

          <div class="single_input no_modal_btn flex-half">
            <select
              [value]="this.data?.accountType ? this.data?.accountType : 'main'"
              class="input_style"
              required
              (change)="changeAccountType($event.target.value)"
            >
              <option value="main" selected disabled>-- Account Type --</option>
              @for (type of bankAccountType; track type) {
                <option [value]="type.value">{{ type.name }}</option>
              }
            </select>
            <app-control-message
              [control]="addBankForm.controls.accountType"
              labelName="Account type is required"
            >
            </app-control-message>
          </div>
        </div>
      </div>

      <div class="ocw_modal_footer">
        <mat-dialog-actions align="end">
          <button mat-dialog-close class="ocw-btn ocw-btn-gray">Close</button>
          <button
            type="submit"
            class="ocw-btn ocw-btn-light-green add_btn"
            (click)="submit()"
          >
          <div class="flex justify-center items-center gap-1">
            <span>{{ !this.data.editMode ? "Add" : "Update" }}</span>
            @if (loading()) {
              <span class="loadingSpinner after:border-x-transparent"></span>
            }
          </div>
          </button>
        </mat-dialog-actions>
      </div>
    </form>
  </div>
</ng-container>

<!-- Confirmed body start  -->
<ng-template #confirmed>
  <div *ngIf="isItConfirmed" class="ocw_man_modal_wrapper">
    <div class="ocw_modal_header">
      <div class="ocw_modal_title">Confirm Bank Account Number</div>
    </div>

    <form [formGroup]="addBankForm">
      <div class="ocw_modal_body">
        <div class="input_group my-8">
          <div class="single_input no_modal_btn flex-half">
            <input
              type="text"
              class="input_style"
              placeholder=" "
              required
              formControlName="routingbankName"
            />
            <span class="floating_label_field"
              >Bank Name <span class="required">*</span></span
            >
            <app-control-message
              [control]="addBankForm.controls.routingbankName"
              labelName="Bank name is required"
            >
            </app-control-message>
          </div>

          <div class="single_input no_modal_btn flex-half">
            <input
              type="text"
              class="input_style"
              placeholder=" "
              required
              formControlName="confirmAccountNumber"
              (keypress)="utils.numberOnly($event, 'numeric')"
            />
            <span class="floating_label_field"
              >Confirm Bank Account No <span class="required">*</span></span
            >
            <app-control-message
              [control]="addBankForm.controls.confirmAccountNumber"
              labelName="Account number is required"
            ></app-control-message>
          </div>
        </div>
      </div>

      <div class="ocw_modal_footer">
        <mat-dialog-actions align="end">
          <button class="ocw-btn ocw-btn-gray" (click)="backBtn()">Back</button>
          <button
            type="submit"
            class="ocw-btn ocw-btn-light-green add_btn"
            (click)="confirmBtn()"
          >
          <div class="flex justify-center items-center gap-1">
            <span>Confirm</span>
            @if (loading()) {
              <span class="loadingSpinner after:border-x-transparent"></span>
            }
          </div>
          </button>
        </mat-dialog-actions>
      </div>
    </form>
    </div>
  </ng-template>
  <!-- Confirmed body end  -->
