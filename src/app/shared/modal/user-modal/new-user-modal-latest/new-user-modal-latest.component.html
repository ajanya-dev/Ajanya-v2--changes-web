<div class="modal-title items-center">
  <div class="flex justify-between pb-4">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
        <span class="pl-1 font-inter font-semibold text-base pb-0.5">
          {{ currentTab }}
        </span>
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="['fas', 'xmark']"
      ></fa-icon>
    </div>
  </div>
</div>
<!-- Form -->
<div class="form-container mr-2">
  <form action="ng-submit" [formGroup]="newUserForm">
    <div class="pb-2" appWhiteLabel hiddenIf="isCompassRequirement">
      <div class="single_input w-full">
        <small class="small_floating_label bg-main-background-color" #small1
          >User Type<span class="required">*</span></small
        >
        <select
          class="form-select input_style"
          #value
          formControlName="userType"
          (change)="userChange(small1)"
        >
          <option value="" selected disabled>User Type</option>
          @for (item of userType; track $index) {
            <option>{{ item }}</option>
          }
        </select>
        <app-control-message
          [control]="newUserForm.controls.userType"
        ></app-control-message>
      </div>
    </div>

    <div class="pb-2 single_input no_modal_btn">
      <input
        type="text"
        class="input_style"
        placeholder=" "
        required
        formControlName="email"
      />
      <small class="floating_label_field bg-main-background-color"
        >User Email<span class="required">*</span></small
      >
      <app-control-message
        [control]="newUserForm.controls.email"
        labelName="Please enter your email"
      ></app-control-message>
    </div>

    <div class="pb-2 single_input no_modal_btn">
      <input
        type="text"
        class="input_style"
        placeholder=" "
        required
        formControlName="confirmUserEmail"
      />
      <small class="floating_label_field bg-main-background-color"
        >Confirm User Email<span class="required">*</span></small
      >
      <app-control-message
        [control]="newUserForm.controls.confirmUserEmail"
        labelName="Please enter confirm email"
      ></app-control-message>
    </div>

    <div class="pb-2 single_input no_modal_btn">
      <input
        type="text"
        class="input_style"
        placeholder=" "
        required
        formControlName="name"
      />
      <small class="floating_label_field bg-main-background-color"
        >Full Legal Name<span class="required">*</span></small
      >
      <app-control-message
        [control]="newUserForm.controls.name"
        labelName="Please enter name"
      ></app-control-message>
    </div>

    <div
      class="pb-2 single_input no_modal_btn"
      appWhiteLabel
      hiddenIf="isCompassRequirement"
    >
      <input
        type="text"
        class="input_style"
        placeholder=" "
        required
        formControlName="nickName"
      />
      <small class="floating_label_field bg-main-background-color"
        >Nick Name<span class="required">*</span></small
      >
      <app-control-message
        [control]="newUserForm.controls.nickName"
        labelName="Please enter your nickname"
      ></app-control-message>
    </div>

    <div class="pb-2 single_input no_modal_btn">
      <input
        type="text"
        class="input_style"
        placeholder=" "
        required
        formControlName="companyName"
      />
      <small class="floating_label_field bg-main-background-color"
        >Preferred Company Name<span class="required">*</span></small
      >
      <app-control-message
        [control]="newUserForm.controls.companyName"
        labelName="Please enter your preferred company name"
      ></app-control-message>
    </div>

    <div class="pb-2">
      <div class="text-right set_permission_button">
        <app-common-button-v35
          class="mb-5 flex-1"
          [text]="buttonText"
          [type]="{ style: 'modal', name: 'main' }"
          width="100%"
          [loading]="isUserAdding"
          [disabled]="isUserAdding"
          textColorInput="white"
          (clickEvent)="newUserSubmit()"
        ></app-common-button-v35>
      </div>
    </div>
  </form>
</div>
