<div class="modal-title items-center">
  <div class="flex justify-between pb-4">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
        <span class="pl-1 font-inter font-semibold text-base pb-0.5">
          Edit {{ currentUserType }}
        </span>
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="['fas', 'xmark']"
      ></fa-icon>
    </div>
  </div>
</div>
<!-- Form -->
<div class="form-container mr-2">
  <form action="ng-submit" [formGroup]="userForm">
    <div class="pb-2">
      <div class="single_input w-full">
        <select
          id="userType"
          class="form-select input_style"
          #value
          formControlName="userType"
        >
          <option value="" selected disabled>User Type</option>
          @for (item of userType; track item) {
            <option [value]="item">
              {{ item }}
            </option>
          }
        </select>
        <label for="userType" class="floating_label_field"
          >User Type<span class="text-red-600">*</span></label
        >
        <app-control-message
          [control]="userForm.controls.userType"
        ></app-control-message>
      </div>
    </div>

    <div class="pb-2 single_input no_modal_btn">
      <input
        id="name"
        type="text"
        class="input_style"
        placeholder=" "
        required
        formControlName="name"
      />
      <label for="name" class="floating_label_field"
        >Full Legal Name<span class="text-red-600">*</span></label
      >
      <app-control-message
        [control]="userForm.controls.name"
        labelName="Please enter name"
      ></app-control-message>
    </div>

    <div class="pb-2 single_input no_modal_btn">
      <input
        id="nickName"
        type="text"
        class="input_style"
        placeholder=" "
        required
        formControlName="nickName"
      />
      <label for="nickName" class="floating_label_field"
        >Nickname<span class="text-red-600">*</span></label
      >
      <app-control-message
        [control]="userForm.controls.nickName"
        labelName="Please enter your nickname"
      ></app-control-message>
    </div>

    <div class="pb-2 single_input no_modal_btn">
      <input
        id="companyName"
        type="text"
        class="input_style"
        placeholder=" "
        required
        formControlName="companyName"
      />
      <label for="companyName" class="floating_label_field"
        >Preferred Company Name<span class="text-red-600">*</span></label
      >
      <app-control-message
        [control]="userForm.controls.companyName"
        labelName="Please enter your preferred company name"
      ></app-control-message>
    </div>

    <div class="pb-2">
      <div class="text-right set_permission_button">
        <app-common-button-v35
          class="mb-5 flex-1"
          text="Submit"
          [type]="{ style: 'modal', name: 'main' }"
          width="100%"
          [loading]="loading"
          [disabled]="loading"
          textColorInput="white"
          (clickEvent)="submit()"
        ></app-common-button-v35>
      </div>
    </div>
  </form>
</div>
