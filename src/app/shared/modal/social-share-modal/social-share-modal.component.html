<div class="">
  <!-- modal header -->
  <div class="flex justify-between px-6 py-4 bg-v4-popup-header-footer-color border-b border-v4-border-color">
    <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
      More Options
    </h1>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
      (click)="close()"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body -->
  <div class="px-5 py-5 bg-v4-tertiary-background-color">
    <div class="grid grid-cols-3 gap-2">
      @for (platform of socialPlatforms; track platform.key) {
        <div
          class="flex flex-col items-center gap-2 p-2 rounded-xl cursor-pointer transition-all duration-200 relative hover:bg-v4-primary-color/5"
          [class.opacity-70]="platform.key === 'copy' && isCopyLoading()"
          [class.cursor-not-allowed]="platform.key === 'copy' && isCopyLoading()"
          (click)="onShare(platform.key)"
        >
          <!-- Platform Icon -->
          <div
            class="flex items-center justify-center w-10 h-10 rounded-full"
            [style.background-color]="platform.config.bgColor"
            [style.color]="platform.config.iconColor"
            [matTooltip]="platform.config.name"
          >
            @if (platform.key === 'copy') {
              <lucide-icon [img]="CopyIcon" [size]="18" />
            } @else {
              <fa-icon [icon]="brandIcons[platform.key]" class="text-base"></fa-icon>
            }
          </div>

          <!-- Platform Name -->
          <div class="text-xs font-medium text-v4-secondary-text-color text-center leading-tight">
            {{ platform.config.name }}
          </div>

          <!-- Loading Indicator for Copy -->
          @if (platform.key === "copy" && isCopyLoading()) {
            <div
              class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex items-center justify-center"
            >
              <fa-icon
                [icon]="faSpinner"
                class="text-xl text-common-green-color animate-spin"
              ></fa-icon>
            </div>
          }
        </div>
      }
    </div>
  </div>
</div>
