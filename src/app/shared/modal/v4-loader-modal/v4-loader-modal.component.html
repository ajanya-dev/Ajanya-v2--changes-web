<div>
  <!-- Modal Header -->
  <div
    class="flex justify-between items-center px-6 py-4 border-b border-v4-border-color"
  >
    <h1 class="text-lg font-semibold text-v4-main-text-color font-funnel">
      {{ headerTitle }}
    </h1>
    <div
      [mat-dialog-close]="false"
      class="w-8 h-8 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon
        [img]="XIcon"
        [size]="18"
        class="text-v4-subtle-text-color"
      />
    </div>
  </div>

  <!-- Modal Body -->
  <div class="flex flex-col items-center justify-center px-6 py-10">
    <div class="loader-spinner"></div>
    <h4
      class="text-base font-semibold text-v4-main-text-color mt-4 font-funnel"
    >
      {{ title }}
    </h4>
    <p
      class="text-sm text-v4-secondary-text-color mt-2 text-center max-w-[320px]"
    >
      {{ content }}
    </p>
  </div>
</div>
