<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Add Card
      </h1>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <div class="flex flex-col gap-5">
      <!-- Nickname -->
      <app-common-input-v4
        [formControl]="nickNameControl"
        [control]="nickNameControl"
        [placeholder]="'Nick Name'"
        [fieldLabel]="'Nick Name'"
        [isFieldRequired]="true"
      />

      <!-- Card Provider -->
      <div class="flex flex-col gap-2">
        <label
          class="block text-sm font-medium text-v4-secondary-text-color font-peridot mb-1.5"
          for="cardprovider"
        >
          Card Provider
        </label>
        <div class="grid grid-cols-4 gap-3">
          @for (card of cardProviders; track card.id) {
            <button
              type="button"
              (click)="selectProvider(card)"
              [style.border-color]="
                card.id === selectedProvider.id
                  ? 'var(--v4-primary-brand-color)'
                  : 'var(--v4-border-color)'
              "
              [class.bg-v4-input-background-color]="
                card.id === selectedProvider.id
              "
              [attr.aria-label]="'Select ' + card.id"
              class="h-16 flex items-center justify-center rounded-xl border-2 bg-v4-secondary-background-color cursor-pointer transition-all w-full p-0 appearance-none outline-none focus:outline-none"
            >
              <img
                [ngSrc]="card.icon"
                [width]="card.width"
                [height]="card.height"
                class="object-contain"
                alt=""
              />
            </button>
          }
        </div>
      </div>

      <!-- Card Color -->
      <div class="flex flex-col gap-2">
        <label
          class="block text-sm font-medium text-v4-secondary-text-color font-peridot mb-1.5"
          for="cardColor"
        >
          Card Color
        </label>
        <div class="flex gap-3">
          @for (color of colors; track color.code) {
            <button
              (click)="selectColor(color)"
              [style.background-color]="color.displayCode"
              [class.ring-2]="color.color === selectedColor.color"
              [class.ring-v4-primary-brand-color]="
                color.color === selectedColor.color
              "
              [class.ring-offset-2]="color.color === selectedColor.color"
              [attr.aria-label]="color.color + ' card color'"
              class="w-8 h-8 rounded-full cursor-pointer border border-v4-border-color transition-transform hover:scale-110"
            ></button>
          }
        </div>
      </div>
    </div>
  </div>
  <!-- modal body end -->

  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      [text]="'Continue'"
      [loading]="loading"
      (clickEvent)="onContinue()"
    />
  </div>
</div>
