<div class="px-[6px] pb-[6px]">
  <div class="flex justify-between pb-6">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
        <span class="pl-1 font-inter font-semibold text-base pb-0.5">
          Add Card
        </span>
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="['fas', 'xmark']"
      ></fa-icon>
    </div>
  </div>
  <div>
    <div class="flex flex-col gap-6">
      <div>
        <app-common-input-field
          [formControl]="nickNameControl"
          [control]="nickNameControl"
          placeholder="Nickname"
        />
      </div>
      <div class="flex flex-col gap-2">
        <span class="font-roboto font-medium text-sm text-main-text-color"
          >Card Provider</span
        >
        <div class="flex justify-between">
          @for (card of cardProviders; track card.id) {
            <div
              (click)="selectProvider(card)"
              [ngClass]="{
                '!border-common-blue-color shadow-common-button':
                  card.id === selectedProvider.id
              }"
              class="h-20 w-20 p-2 flex items-center justify-center rounded-[4px] bg-tertiary-background-color box-border border-transparent border-2 cursor-pointer"
            >
              <img
                [height]="card.height"
                [width]="card.width"
                [ngSrc]="card.icon"
                [class.grayscale]="card.id === 'amex'"
                alt=""
              />
            </div>
          }
        </div>
      </div>
      <div class="flex flex-col gap-2">
        <span class="font-roboto font-medium text-sm text-main-text-color"
          >Choose Color</span
        >
        <div class="flex gap-2.5">
          @for (color of colors; track color.code) {
            <div
              (click)="selectColor(color)"
              [ngClass]="{
                'border-common-blue-color border-[1.5px] shadow-common-box-shadow':
                  color.color === selectedColor.color
              }"
              class="cursor-pointer rounded-full w-8 h-8 bg-common-secondary-{{
                color.color
              }}-color"
            ></div>
          }
        </div>
      </div>
    </div>
  </div>
  <div class="flex justify-end gap-3 pt-8">
    <app-common-button-v35
      (click)="onContinue()"
      [loading]="loading"
      width="124px"
      [type]="{ style: 'modal', name: 'main' }"
      text="Continue"
    />
  </div>
</div>
