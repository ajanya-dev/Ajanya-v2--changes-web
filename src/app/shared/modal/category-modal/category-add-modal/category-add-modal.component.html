<div class="ocw_man_modal_wrapper category_modal">
  <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
    <div class="ocw_modal_header">
      <div class="ocw_modal_title">
        {{ !selectedItem ? "Add Category" : "Update Category" }}
      </div>
      <div class="close_btn" [mat-dialog-close]="false">
        <svg
          aria-hidden="true"
          focusable="false"
          data-prefix="fal"
          data-icon="times"
          class="svg-inline--fa fa-times fa-w-10"
          role="img"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 320 512"
        >
          <path
            fill="currentColor"
            d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
          ></path>
        </svg>
      </div>
    </div>

    <!-- MODAL BODY START -->
    <div class="ocw_modal_body">
      <span class="error_msg common_err"></span>
      <div class="input_group">
        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="categoryName"
            maxlength="40"
          />
          <span class="floating_label_field"
            >Category Name <span class="required">*</span></span
          >
          <app-control-message
            [control]="categoryForm.controls.categoryName"
            labelName="Category Name is Required"
          ></app-control-message>
        </div>
        <div class="single_input">
          <select
            name=""
            id=""
            class="input_style"
            formControlName="categoryType"
          >
            <option value="" selected disabled>Select category type</option>
            <option value="1">Income</option>
            <option value="2">Expense</option>
          </select>
          <span></span>
          <app-control-message
            [control]="categoryForm.controls.categoryType"
            labelName="Select Category Type"
          >
          </app-control-message>
        </div>
        @if (UpdateMode()) {
        <div class="single_input">
          <select
            name=""
            id=""
            class="input_style"
            formControlName="categoryStatus"
          >
            <option value=1 selected>Active</option>
            <option value=0>Inactive</option>
          </select>
          <span class="floating_label_field">Status <span class="required">*</span></span>
          <app-control-message
            [control]="categoryForm.controls.categoryStatus"
            labelName="Select Category Status"
          >
          </app-control-message>
        </div>
        }
      </div>
    </div>
    <!-- MODAL BODY END -->

    <div class="ocw_modal_footer">
      <mat-dialog-actions align="end">
        <button
          mat-dialog-close
          class="ocw-btn ocw-btn-modal-bordered"
          [ngStyle]="{ 'pointer-events': loading ? 'none' : 'all' }"
        >
          Close
        </button>
        <div
      >
        <button
          type="submit"
          class="ocw-btn ocw-btn-modal-blue add_btn"
          [disabled]="loading "
          [ngStyle]="{
            'pointer-events': (loading ) ? 'none' : 'all',
          }"
        >
          <ng-container *ngIf="!loading">
            <span>
              {{ !selectedItem ? (loading ? '' : 'Add') : loading ? '' : 'Update' }}
            </span>
          </ng-container>
      
          <span *ngIf="loading" class="loadingSpinner"></span>
        </button>
      </div>
      </mat-dialog-actions>
    </div>
  </form>
</div>
