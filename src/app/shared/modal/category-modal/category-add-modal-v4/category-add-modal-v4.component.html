<div class="">
  <!-- modal header -->
  <div class="flex justify-between px-6 py-4 bg-v4-popup-background-color">
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        {{ editMode ? 'Edit Category' : 'Add Category' }}
      </h1>
      <p class="text-xs text-v4-subtle-text-color font-peridot">
        {{ editMode ? 'Update the category details below' : 'Create a new payment category' }}
      </p>
    </div>
    <div [mat-dialog-close]="false" class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center">
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    class="px-6 pb-2 bg-v4-popup-background-color space-y-4"
  >
    <!-- Category Name -->
    <div>
      <label
        class="mb-1.5 block text-xs font-medium text-v4-main-text-color"
        for="category-name"
      >
        Category Name <span class="text-v4-common-red-color">*</span>
      </label>
      <app-common-input-v4
        formControlName="categoryName"
        placeholder="Enter category name"
        [maxLength]="40"
        [control]="form.controls.categoryName"
        errorLabel="Category Name is Required"
      />
    </div>

    <!-- Category Type -->
    <div>
      <label
        class="mb-1.5 block text-xs font-medium text-v4-main-text-color"
        for="category-type"
      >
        Category Type <span class="text-v4-common-red-color">*</span>
      </label>
      <app-v4-common-dropdown
        [config]="categoryTypeConfig"
        [listData]="categoryTypeOptions"
        formControlName="categoryType"
        [clearable]="false"
        [searchable]="false"
        appendTo="body"
      />
      <app-control-message-v4
        [control]="form.controls.categoryType"
        [label]="'Category Type is required'"
      />
    </div>

    <!-- Status (edit mode only) -->
    @if (editMode) {
      <div>
        <label
          class="mb-1.5 block text-xs font-medium text-v4-main-text-color"
          for="category-status"
        >
          Status <span class="text-v4-common-red-color">*</span>
        </label>
        <app-v4-common-dropdown
          [config]="categoryStatusConfig"
          [listData]="categoryStatusOptions"
          formControlName="categoryStatus"
          [clearable]="false"
          [searchable]="false"
          appendTo="body"
        />
        <app-control-message-v4
          [control]="form.controls.categoryStatus"
          [label]="'Status is required'"
        />
      </div>
    }
  </form>
  <!-- modal body end -->

  <div class="flex justify-end gap-3 px-6 py-5 bg-v4-popup-background-color">
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      [text]="editMode ? 'Update' : 'Add Category'"
      [loading]="submitting()"
      (clickEvent)="onSubmit()"
      [disabled]="submitting()"
    />
  </div>
</div>
