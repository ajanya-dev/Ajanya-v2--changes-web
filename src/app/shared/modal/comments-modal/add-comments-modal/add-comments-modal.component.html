<div class="ocw_man_modal_wrapper category_modal">
  <form [formGroup]="commentForm" (ngSubmit)="onSubmit()">
    <div class="flex justify-between pb-6">
      <div>
        <span
          class="mt-18 w-full text-base text-main-text-color align-middle flex items-center\"
        >
          <span class="pl-1 font-inter font-semibold text-base pb-0.5">
            Add Comments
          </span>
        </span>
      </div>
      <div>
        <fa-icon
          class="text-secondary-text-color cursor-pointer"
          [icon]="['fas', 'xmark']"
          (click)="close()"
        ></fa-icon>
      </div>
    </div>

    <div class="comments_wrapper">
      <div class="input_group_wrapp">
        <input
          type="text"
          formControlName="comment"
          class="input_style"
          placeholder="Comment"
          maxlength="90"
          required
        />
      </div>
      <app-control-message
        [control]="commentForm.controls.comment"
        labelName="Comment is required"
      >
      </app-control-message>
      <div class="flex justify-end gap-3 pt-4">
        <button
          (click)="close()"
          class="ocw-btn ocw-btn-modal-bordered !mt-.5 !h-[38px]"
        >
          Close
        </button>
        <app-common-button-v35
          [type]="{ style: 'modal', name: 'main' }"
          width="150px"
          (click)="onSubmit()"
          text="Add Comment"
          [disabled]="loading"
          [loading]="loading"
        ></app-common-button-v35>
      </div>
      <div class="comment_table !text-main-text-color">
        <table>
          <thead>
            <tr>
              <td>Date</td>
              <td>User</td>
              <td>Comment</td>
              @if (enableDelete) {
                <td>Action</td>
              }
            </tr>
          </thead>
          <tbody>
            @for (item of listData; track item) {
              <tr>
                <td>{{ currentDateTime }}</td>
                <td>{{ item.user_name }}</td>
                <td>
                  {{ item.comments }}
                  @if (item?.status?.status_text) {
                    <a class="info">
                      <fa-icon
                        [icon]="['fas', 'envelop']"
                        aria-hidden="true"
                        title="{{ item.status?.status_text }}"
                      ></fa-icon>
                    </a>
                  }
                </td>
                @if (enableDelete) {
                  <td class="icon">
                    <fa-icon
                      class="text-common-red-color cursor-pointer"
                      [icon]="['fas', 'trash']"
                      (click)="deleteComment(item.encrypted_id || item.id)"
                    ></fa-icon>
                  </td>
                }
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </form>
</div>
