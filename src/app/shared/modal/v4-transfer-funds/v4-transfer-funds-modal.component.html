<div class="flex flex-col max-h-[95vh]">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Transfer Funds
      </h1>
      <h2 class="text-xs text-v4-subtle-text-color">
        Move money between wallets and accounts
      </h2>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="flex-1 px-6 bg-v4-tertiary-background-color overflow-y-auto">
    <form [formGroup]="transferFundsForm" class="flex flex-col gap-4">
      <!-- Amount -->
      <div class="flex flex-col items-center">
        <app-common-amount-input-v4
          formControlName="amount"
          [customClass]="'hero-input'"
          [maxLength]="15"
          (blurEvent)="totalAmountCal()"
        />
        <app-control-message-v4
          [control]="transferFundsForm.controls['amount']"
        />
      </div>

      <!-- Memo -->
      <div>
        <app-common-input-v4
          formControlName="comment"
          [placeholder]="'Memo'"
          [maxLength]="50"
          [control]="transferFundsForm.controls['comment']"
          [fieldLabel]="'Memo'"
          [isFieldRequired]="true"
        />
      </div>

      <!-- From Card -->
      <div
        class="rounded-xl border border-v4-border-color bg-v4-secondary-background-color px-4 py-2 flex flex-col gap-3"
      >
        <span class="text-sm font-medium text-v4-subtle-text-color">From</span>
        <app-common-tab-v4
          [tabs]="transferFromTabs"
          [(activeTab)]="activeFromTab"
          [variant]="'toggle'"
          (tabChange)="onFromTabChange($event)"
        />

        @switch (isFrom()) {
          @case (2) {
            <div>
              <app-wallet-dropdown-v4
                [formControl]="fromWalletControl"
                [placeholder]="'Select Wallet'"
                [showLogoUpdateModal]="false"
                [append]="'body'"
                (ready)="autoPopulateWallet($event, transferFromId)"
                (dropdownOpenChange)="isAnyDropdownOpen.set($event)"
              />
            </div>
          }
          @case (1) {
            <div>
              <app-bank-ac-dropdown-v4
                [formControl]="fromBankControl"
                [placeholder]="'Select Bank Account'"
                [append]="'body'"
                [zIndex]="1001"
                [showVerificationBadge]="true"
                (dropdownOpen)="isAnyDropdownOpen.set(true)"
                (dropdownClose)="isAnyDropdownOpen.set(false)"
                (bankAccountCreated)="onFromBankCreated()"
              />
            </div>
          }
          @case (3) {
            <div>
              <app-cloud-account-dropdown-v35
                id="from-cloud"
                [placeholder]="'Select Cloud Account'"
                (selectionEvent)="cloudBankFromSelect($event)"
              />
            </div>
          }
        }
      </div>
      <app-control-message-v4
        [control]="transferFundsForm.controls['transferFrom']"
        [label]="
          'Please select a ' +
          (isFrom() === 2
            ? 'Wallet'
            : isFrom() === 1
              ? 'Account'
              : 'Cloud Bank')
        "
      />

      <!-- Arrow divider -->
      <div class="flex justify-center">
        <div
          class="w-8 h-8 rounded-full flex justify-center items-center"
          style="
            background-color: var(--v4-badge-success-bg-color);
            color: var(--v4-badge-success-text-color);
          "
        >
          <lucide-icon [img]="CircleArrowDownIcon" [size]="16" />
        </div>
      </div>

      <!-- To Card -->
      <div
        class="rounded-xl border border-v4-border-color bg-v4-secondary-background-color px-4 py-2 flex flex-col gap-3"
      >
        <span class="text-sm font-medium text-v4-subtle-text-color">To</span>
        <app-common-tab-v4
          [tabs]="transferToTabs"
          [(activeTab)]="activeToTab"
          [variant]="'toggle'"
          (tabChange)="onToTabChange($event)"
        />

        @switch (isTo()) {
          @case (2) {
            <div>
              <app-wallet-dropdown-v4
                [formControl]="toWalletControl"
                [placeholder]="'Select Wallet'"
                [showLogoUpdateModal]="false"
                [append]="'body'"
                (dropdownOpenChange)="isAnyDropdownOpen.set($event)"
              />
            </div>
          }
          @case (1) {
            <div>
              <app-bank-ac-dropdown-v4
                [formControl]="toBankControl"
                [placeholder]="'Select Bank Account'"
                [append]="'body'"
                [zIndex]="1001"
                [showVerificationBadge]="true"
                (dropdownOpen)="isAnyDropdownOpen.set(true)"
                (dropdownClose)="isAnyDropdownOpen.set(false)"
                (bankAccountCreated)="onToBankCreated()"
              />
            </div>
          }
          @case (3) {
            <div>
              <app-cloud-account-dropdown-v35
                id="to-cloud"
                [placeholder]="'Select Cloud Account'"
                (selectionEvent)="cloudBankToSelect($event)"
              />
            </div>
          }
        }
      </div>
      <app-control-message-v4
        [control]="transferFundsForm.controls['transferTo']"
        [label]="
          'Please select a ' +
          (isTo() === 2 ? 'Wallet' : isTo() === 1 ? 'Account' : 'Cloud Bank')
        "
      />
    </form>
  </div>
  <!-- modal body end -->

  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Transfer"
      [loading]="isSubmitting()"
      [disabled]="isSubmitting()"
      (clickEvent)="onSubmit()"
    />
  </div>
</div>
