
  <div class="absolute top-[-26px] left-[26px] font-semibold">
    <div class="text-main-text-color">Import from Square</div>
  </div>
@if (!isConnected()) {
  <div
    class="flex justify-center items-center mt-3 min-w-[600px] min-h-[500px]"
  >
    <div
      class="min-w-[600px] min-h-[120px] flex bg-main-background-color border-2 border-input-border-color rounded-xl"
    >
      <div class="min-w-[100px]">
        <img
          height="100"
          width="210"
          ngSrc="/assets/images/integration/square.webp"
          class="!rounded-xl"
          alt=""
        />
      </div>
      <div class="flex-1 flex justify-between items-center px-4">
        <div class="flex flex-col">
          <div>
            <span class="font-inter text-main-text-color font-semibold"
              >Square</span
            >
          </div>
          <div>
            <span class="font-inter text-main-text-color text-sm"
              >Status:
              <span class="text-common-red-color font-semibold"
                >Disconnected</span
              ></span
            >
          </div>
        </div>
        <div>
          <button
            class="ocw-btn ocw-btn-gradient submit-btn mr-4"
            (click)="goToThirdpartyHome()"
          >
            Integrate Square
          </button>
        </div>
      </div>
    </div>
  </div>
} @else {
  <!-- modal body start -->
  @if (isConnected()) {
    <div class="text-sm py-4 grow min-h-[600px]" [formGroup]="squareForm">
      <div class="bg-tertiary-background-color p-4 flex flex-col gap-4">
        <span class="font-inter text-main-text-color font-semibold text-base">Filter</span>
        <div class="flex flex-col gap-4">
          <div class="w-1/2 flex flex-col">
            <span class="font-inter text-main-text-color font-semibold text-sm">Time Span</span>
            <mat-radio-group aria-labelledby="mat-radio-group-label" formControlName="importTime"
              class="mat-radio-group grid grid-cols-2 gap-4 pt-5">
              @for(time of importTime; track time){
              <mat-radio-button class="mat-radio-button" [value]="time.value">
                {{ time.name }}
              </mat-radio-button>
              }
            </mat-radio-group>
          </div>
        </div>
      </div>
    </div>
  }
  @if (isConnected()) {
    <div class="flex justify-end gap-4">
      <app-common-button-v35 [type]="{style:'bordered', name: 'main' }" text="Cancel"
        (clickEvent)="back()"></app-common-button-v35>
      <app-common-button-v35 [type]="{style:'modal', name: 'main' }" text="Import" [disabled]="loading"
        [loading]="loading" (clickEvent)="onSubmit()"></app-common-button-v35>
    </div>
  }
}
