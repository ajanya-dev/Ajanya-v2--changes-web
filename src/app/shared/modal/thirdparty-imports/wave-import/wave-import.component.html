<div class="flex flex-col main-body">
  <div class="flex mb-1 import-settings">
    <div class="font-semibold">Import From Wave</div>
    <div
      class="flex items-center font-semibold w-min pl-2 pr-2 pb-1 cursor-pointer"
      matTooltip="More Settings"
      (click)="goToThirdpartyHome()"
    >
      <svg
        aria-hidden="true"
        focusable="false"
        data-prefix="fas"
        data-icon="cog"
        class="svg-inline--fa fa-cog fa-w-16"
        role="img"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 512 512"
      >
        <path
          fill="currentColor"
          d="M487.4 315.7l-42.6-24.6c4.3-23.2 4.3-47 0-70.2l42.6-24.6c4.9-2.8 7.1-8.6 5.5-14-11.1-35.6-30-67.8-54.7-94.6-3.8-4.1-10-5.1-14.8-2.3L380.8 110c-17.9-15.4-38.5-27.3-60.8-35.1V25.8c0-5.6-3.9-10.5-9.4-11.7-36.7-8.2-74.3-7.8-109.2 0-5.5 1.2-9.4 6.1-9.4 11.7V75c-22.2 7.9-42.8 19.8-60.8 35.1L88.7 85.5c-4.9-2.8-11-1.9-14.8 2.3-24.7 26.7-43.6 58.9-54.7 94.6-1.7 5.4.6 11.2 5.5 14L67.3 221c-4.3 23.2-4.3 47 0 70.2l-42.6 24.6c-4.9 2.8-7.1 8.6-5.5 14 11.1 35.6 30 67.8 54.7 94.6 3.8 4.1 10 5.1 14.8 2.3l42.6-24.6c17.9 15.4 38.5 27.3 60.8 35.1v49.2c0 5.6 3.9 10.5 9.4 11.7 36.7 8.2 74.3 7.8 109.2 0 5.5-1.2 9.4-6.1 9.4-11.7v-49.2c22.2-7.9 42.8-19.8 60.8-35.1l42.6 24.6c4.9 2.8 11 1.9 14.8-2.3 24.7-26.7 43.6-58.9 54.7-94.6 1.5-5.5-.7-11.3-5.6-14.1zM256 336c-44.1 0-80-35.9-80-80s35.9-80 80-80 80 35.9 80 80-35.9 80-80 80z"
        ></path>
      </svg>
    </div>
  </div>

  <div class="data_spinner" [ngClass]="{ data_fetched: dataLoaded }"></div>
  <div
    class="grow disconnected-banner flex flex-col justify-center items-center"
    *ngIf="!isConnected && dataLoaded"
  >
    <section
      class="top-box mt-6 border-solid border-2 border-input-border-color relative"
    >
      <div class="logo-bg"></div>
      <div class="top-twobox">
        <div class="top-box-centr main-bx-padding">
          <p class="main-p">Wave</p>
          <div class="status-color">
            <p><span>Status:</span><span class="red-clr">Disconnected</span></p>
          </div>
        </div>
        <div>
          <button
            class="ocw-btn ocw-btn-gradient submit-btn mr-4"
            (click)="goToThirdpartyHome()"
          >
            Integrate Wave
          </button>
        </div>
      </div>
      <div class="top-box-img"></div>
      <div class="top-box-img-2"></div>
      <div class="logo-sec">
        <img src="../../../../../assets/images/integration/wave.png" />
      </div>
    </section>
  </div>

  <!-- modal body start -->
  <div
    class="grid grid-cols-2 text-sm py-4 grow"
    [formGroup]="waveForm"
    *ngIf="isConnected && dataLoaded"
  >
    <!-- left section start-->
    <div class="flex flex-col border border-r-0 rounded-sm p-4">
      <div class="search_box">
        <svg
          aria-hidden="true"
          focusable="false"
          data-prefix="far"
          data-icon="search"
          class="svg-inline--fa fa-search fa-w-16 ml-2"
          role="img"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 512 512"
        >
          <path
            fill="currentColor"
            d="M508.5 468.9L387.1 347.5c-2.3-2.3-5.3-3.5-8.5-3.5h-13.2c31.5-36.5 50.6-84 50.6-136C416 93.1 322.9 0 208 0S0 93.1 0 208s93.1 208 208 208c52 0 99.5-19.1 136-50.6v13.2c0 3.2 1.3 6.2 3.5 8.5l121.4 121.4c4.7 4.7 12.3 4.7 17 0l22.6-22.6c4.7-4.7 4.7-12.3 0-17zM208 368c-88.4 0-160-71.6-160-160S119.6 48 208 48s160 71.6 160 160-71.6 160-160 160z"
          ></path>
        </svg>
        <input
          type="search"
          class="input_style"
          [(ngModel)]="searchText"
          (ngModelChange)="onSearchCompany()"
          [ngModelOptions]="{ standalone: true }"
          placeholder="Search company.."
        />
      </div>

      <div class="mt-5">
        <div class="flex flex-wrap gap-2 flex-col import_from_wrapper">
          <span class="importFrom">
            <mat-checkbox
              class="setting_heading_main"
              [checked]="allChecked"
              [indeterminate]="someComplete()"
              (change)="setAll($event.checked); changeImportFrom()"
            >
              {{ importFrom.name }}
            </mat-checkbox>
          </span>
          <span
            class="importFrom_sub_check_box"
            [ngClass]="
              dataLoaded ? 'loader_white_bg_end' : 'loader_white_bg_start'
            "
          >
            <div class="company_Section">
              <ul>
                <li
                  *ngFor="
                    let list of companyData | sort: 'asc' : 'name';
                    let i = index
                  "
                >
                  <mat-checkbox
                    [(ngModel)]="list.checked"
                    [name]="list.value"
                    [ngModelOptions]="{ standalone: true }"
                    checked="true"
                    (ngModelChange)="updateAllComplete()"
                    (change)="changeImportFrom()"
                    [matTooltip]="tooltip(list.name)"
                  >
                    {{ list.name }}
                  </mat-checkbox>
                </li>
              </ul>
            </div>
          </span>

          <ng-container>
            <div
              class="data_spinner"
              [ngClass]="{ data_fetched: dataLoaded }"
            ></div>
          </ng-container>

          <ng-container *ngIf="companyData?.length == 0">
            <span class="no_data"> No Company Found.</span>
          </ng-container>
        </div>
      </div>
    </div>
    <!-- left section end -->

    <!-- right section start -->
    <div class="flex flex-col gap-8 rightbox">
      <span class="setting_heading">Filter</span>

      <!-- Time span start -->
      <div>
        <span class="setting_heading">Time Span</span>
        <mat-radio-group
          aria-labelledby="mat-radio-group-label"
          formControlName="importTime"
          class="mat-radio-group grid grid-cols-2"
        >
          <mat-radio-button
            class="mat-radio-button"
            *ngFor="let time of importTime"
            [value]="time.value"
          >
            {{ time.name }}
          </mat-radio-button>
        </mat-radio-group>
      </div>
      <!-- Time span end -->
      <div class="text-sm">
        <span class="setting_heading">Download Filter</span>
        <mat-radio-group
          aria-labelledby="mat-radio-group-label"
          formControlName="importStatus"
          class="mat-radio-group grid"
        >
          <mat-radio-button
            class="mat-radio-button"
            *ngFor="let radio of downloadFilter"
            [checked]="radio.value === 'markAsPrintLater'"
            [value]="radio.value"
          >
            {{ radio.name }}
          </mat-radio-button>
        </mat-radio-group>
      </div>
    </div>

    <!-- right section end -->
  </div>

  <!-- footer -->
  <div class="flex justify-end pt-4" *ngIf="isConnected && dataLoaded">
    <button
      class="ocw-btn ocw-btn-modal-bordered cancel-btn px-2 cursor-pointer"
      (click)="back()"
    >
      <span> Cancel</span>
    </button>
    <button
      class="ocw-btn ocw-btn-modal-blue submit-btn ml-2"
      (click)="onSubmit()"
    >
      <ng-container *ngIf="loading">
        <span class="loadingSpinner"></span>
      </ng-container>
      <span> {{ !loading ? "Import" : "Importing" }}</span>
    </button>
  </div>
</div>
