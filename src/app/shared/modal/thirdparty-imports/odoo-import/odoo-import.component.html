<div class="flex flex-col main-body">
  <div class="flex mb-1 import-settings">
    <div>Import from Odoo</div>
    <div
      class="flex items-center font-semibold w-min px-2 cursor-pointer"
      matTooltip="More Settings"
      role="presentation"
      (click)="goToThirdpartyHome()"
    >
      <fa-icon [icon]="faGear"></fa-icon>
    </div>
  </div>

  @if (!isConnected) {
  <div
    class="grow disconnected-banner flex flex-col justify-center items-center"
  >
    <section
      class="top-box mt-6 border-solid border-2 border-input-border-color relative"
    >
      <div class="logo-bg"></div>
      <div class="top-twobox">
        <div class="top-box-centr main-bx-padding">
          <p class="main-p">Odoo</p>
          <div class="status-color">
            <p><span>Status:</span><span class="red-clr">Disconnected</span></p>
          </div>
        </div>
        <div>
          <button
            class="ocw-btn ocw-btn-gradient submit-btn mr-4"
            (click)="goToThirdpartyHome()"
          >
            Integrate Odoo
          </button>
        </div>
      </div>
      <div class="top-box-img"></div>
      <div class="top-box-img-2"></div>
      <div class="logo-sec">
        <img ngSrc="/assets/images/integration/odoo.png" alt="odoo logo" width="190" height="75" />
      </div>
    </section>
  </div>
  }
  @if (isConnected) {
    <div
      class="grid grid-cols-2 h-full text-sm py-4 grow"
      [formGroup]="importFrom"
    >
      <!-- right section start -->
      <div class="rightbox flex flex-col gap-8">
        <span class="setting_heading">Filter</span>

        <!-- Time span start -->
        <div class="">
          <span class="setting_heading">Time Span</span>
          <mat-radio-group
            aria-labelledby="mat-radio-group-label"
            formControlName="time"
            class="mat-radio-group grid grid-cols-2 radiobtn"
          >
            @for (time of importTime; track time.value) {
              <mat-radio-button
                class="mat-radio-button"
                [value]="time.value"
                [ngClass]="{
                  'border-for-last-two mt-2.5':
                    time.value === 9 || time.value === 8,
                  '!border-r-0 !rounded-r-none pl-2': time.value === 8,
                  '!border-l-0 !rounded-l-none mr-6': time.value === 9
                }"
              >
                <div class="radio_label">{{ time.name }}</div>
              </mat-radio-button>
            }
          </mat-radio-group>
        </div>
        <!-- Time span end -->
      </div>
    </div>
  }
  @if (isConnected) {
    <div class="flex justify-end pt-4">
      <button
        class="ocw-btn ocw-btn-modal-bordered cancel-btn px-2 cursor-pointer"
        (click)="back()"
      >
        <span> Cancel</span>
      </button>
      <button
        class="ocw-btn ocw-btn-modal-blue submit-btn ml-2"
        (click)="onSubmit()"
      >
        @if (loading) {
          <ng-container>
            <span class="loadingSpinner"></span>
          </ng-container>
        }
        <span> {{ !loading ? "Import" : "Importing" }}</span>
      </button>
    </div>
  }
</div>
