<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Verification Required
      </h1>
      <h2 class="text-xs font-peridot text-v4-secondary-text-color">
        You need to verify your email and phone number to create and process check payments.    
        </h2>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <div
      class="w-16 h-16 md:w-20 md:h-20 mx-auto mb-5 rounded-full flex items-center justify-center"
      style="
        background: color-mix(
          in srgb,
          var(--v4-accent-violet-color) 20%,
          transparent
        );
      "
    >
      <lucide-icon
        [img]="LockIcon"
        [size]="32"
        class="text-v4-accent-violet-color"
      ></lucide-icon>
    </div>

    <p class="text-v4-tertiary-text-color text-sm font-peridot mb-4">
      Complete our quick verification process to unlock:
    </p>

    <div class="flex flex-col gap-3 mb-6">
      @for (benefit of benefits; track benefit) {
        <div class="flex items-start gap-3">
          <div
            class="w-5 h-5 min-w-[20px] rounded-full flex items-center justify-center mt-0.5 bg-v4-badge-success-bg-color"
          >
            <lucide-icon
              [img]="CheckIcon"
              [size]="12"
              class="text-v4-common-green-color"
            ></lucide-icon>
          </div>
          <span class="text-sm font-peridot text-v4-main-text-color font-semibold">{{
            benefit
          }}</span>
        </div>
      }
    </div>
  </div>
  <!-- modal body end -->

  <div
    class="flex flex-col gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      width="100%"
      [type]="{ style: 'primary', name: 'main' }"
      text="Start Verification"
      (clickEvent)="startVerification()"
    />
    <app-common-button-v4
      mat-dialog-close=""
      width="100%"
      [type]="{ style: 'outline', name: 'main' }"
      text="Maybe Later"
    />
  </div>
</div>
