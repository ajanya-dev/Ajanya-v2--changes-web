<div class="px-[6px] pb-[6px]">
  <div class="flex justify-between pb-6">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
        <span class="pl-1 font-inter font-semibold text-base pb-0.5">
          Text Us
        </span>
      </span>
    </div>
    <div role="presentation" (click)="close()">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      ></fa-icon>
    </div>
  </div>
  <div class="w-[404px] flex flex-col justify-center">
    <div
      class="flex justify-center gap-2 mt-4"
      [formGroup]="textUsForm"
      [ngClass]="isCountryDropdownOpened() ? 'min-h-[250px]' : 'min-h-[80px]'"
    >
      <div class="single_input">
        <app-new-phone-input
          type="text"
          id="phone_2"
          formControlName="phone"
          [inputWidth]="'400px'"
          mask="(000) 000-0000"
          (countryDropdown)="countryChange($event)"
        ></app-new-phone-input>
        <app-control-message
          [control]="textUsForm.controls.phone"
        ></app-control-message>
      </div>
      <div>
        <app-common-button-v35
          [type]="{ style: 'modal', name: 'main' }"
          [text]="isSendingMsg() ? 'Sending..' : 'Send'"
          [disabled]="isSendingMsg()"
          [loading]="isSendingMsg()"
          (clickEvent)="submit()"
        ></app-common-button-v35>
      </div>
    </div>
  </div>
</div>
