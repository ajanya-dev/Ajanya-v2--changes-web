<div class="p-6 text-center">
  <div class="flex flex-col items-center  mx-auto">
    <div class="mb-6">
      <img [ngSrc]="maintenanceImage" alt="Scheduled Maintenance" class="max-w-[220px] max-h-[220px]">
      width="220"
      height="220"
      alt="Scheduled Maintenance"
      class="max-w-[220px] max-h-[220px]"
      />
      </div>

    <h2 class="text-2xl font-bold text-main-text-color mb-4">
      Scheduled Maintenance Break
    </h2>

    <p class="text-sm text-secondary-text-color leading-relaxed mb-6">
      {{ data.description }}
    </p>

    <app-common-button-v35 
      [type]="{ style: 'filled', name: 'main' }"
      (click)="onClose()"
      text="Close"
      width="150px"
    ></app-common-button-v35>
  </div>
</div>
