<table class="w-full">
  <tr>
    <td colspan="5" class="memo-input-line">
      <textarea
        class="text-center w-full h-5 mt-2 text-sm"
        (keydown.enter)="$event.preventDefault()"
        [(ngModel)]="memoValue"
        (input)="updateValue($event.target.value)"
        type="text"
        placeholder="{{ placeholder }}"
        maxlength="50"
      ></textarea>
    </td>
  </tr>
  <tr>
    <td></td>
    <td></td>
    <td class="border-t-2 border-solid border-input-border-color"></td>
    <td></td>
    <td></td>
  </tr>
</table>
