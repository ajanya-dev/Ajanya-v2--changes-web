<div role="presentation"
  class="w-[34px] h-[34px] rounded-[5px] flex justify-center items-center cursor-pointer"
  (click)="goBack()"
  [ngClass]="{
    'bg-main-background-color': btnStyle.bg === 'light',
    'bg-secondary-background-color': btnStyle.bg === 'dark',
    '!rounded-full':isRounded()
  }"
>
  <fa-icon [icon]="faArrowLeft" />
</div>
