<div class="input_style phone_input">
  <div (click)="toggleDropDown()" role="presentation">
    <img
      *ngIf="currentCountryURL === undefined"
      [src]="selectedCountry?.flage_url"
      alt=""
    />
    <img *ngIf="currentCountryURL" [src]="currentCountryURL" alt="" />
    <i class="fa-solid fa-caret-{{ showDropDown ? 'up' : 'down' }}"></i>
  </div>

  <div class="single_input">
    <input
      class="input_style"
      type="tel"
      autocomplete="off"
      id="phone"
      name="phone"
      mask="(000) 000-0000"
      placeholder=" "
      [(ngModel)]="phoneNumber"
      (ngModelChange)="phoneChange()"
      (blur)="getChangeEvent()"
      (keypress)="preventInvalidInput($event)"
      (paste)="onPaste($event)"
    />

    <span class="floating_label_field">Phone</span>
  </div>

  <div class="list_container" *ngIf="showDropDown">
    <input
      type="search"
      class="input_style"
      name="search"
      id="search"
      [(ngModel)]="searchInput"
      placeholder="Search.."
    />

    <div class="country_list">
      <div
        class="item"
        role="presentation"
        *ngFor="let country of countryList | searchFilter: searchInput"
        (click)="selectCountry(country)"
      >
        <img [src]="country.flage_url" alt="" />

        <span>{{ country.name }} {{ country.dial_code }}</span>
      </div>
    </div>
  </div>
</div>

<div
  *ngIf="invalidPhoneNumber && showInvalidNumberErrorMessage"
  class="invalid-phone-number"
>
  <h4>This field requires ten digits</h4>
</div>

<div
  class="overlay"
  *ngIf="showDropDown"
  role="presentation"
  (click)="toggleDropDown()"
></div>
