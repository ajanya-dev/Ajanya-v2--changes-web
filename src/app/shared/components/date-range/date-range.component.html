<form [formGroup]="range" class="text-center">
  <mat-form-field class="date-range">
    <label
      class="date_label cursor-pointer"
      (click)="datePicker(dateToggle)"
      [for]="picker"
      >{{
        enableCustom ? selected : selected === "Custom" ? "" : selected
      }}</label
    >
    <mat-date-range-input
      [formGroup]="range"
      [rangePicker]="picker"
      class="range"
      [ngClass]="{ hide: enableCustom || selected !== 'Custom' }"
    >
      <input
        matStartDate
        formControlName="start"
        placeholder="Start date"
        (dateChange)="isChange = false"
      />
      <input matEndDate formControlName="end" placeholder="End date" />
    </mat-date-range-input>
    <mat-datepicker-toggle
      #dateToggle
      matSuffix
      [for]="picker"
      class="toggle"
    ></mat-datepicker-toggle>
    <mat-date-range-picker
      #picker
      (closed)="changeEvent()"
      [calendarHeaderComponent]="ExampleHeaderComponent"
      (opened)="open(); isChange = true"
    ></mat-date-range-picker>
  </mat-form-field>
</form>
