<!-- Compact row: the whole card is the link, so there is no separate button. -->
<button
  type="button"
  class="group w-full h-full bg-v4-secondary-background-color border border-v4-border-color rounded-2xl px-5 py-4 flex items-center gap-3.5 text-left cursor-pointer transition-shadow hover:shadow-md focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-v4-primary-brand-color"
  [attr.aria-label]="buttonText()"
  [disabled]="comingSoon()"
  [class.opacity-60]="comingSoon()"
  [class.cursor-not-allowed]="comingSoon()"
  (click)="buttonClick.emit()"
>
  <!-- Icon -->
  <span
    class="w-11 h-11 shrink-0 rounded-xl flex items-center justify-center"
    [style.background-color]="iconBgColor()"
  >
    @if (fontIcon()) {
      <fa-icon [icon]="fontIcon()" />
    } @else {
      <lucide-icon [img]="icon()" [size]="22" [style.color]="iconColor()" />
    }
  </span>

  <!-- Heading + description -->
  <span class="min-w-0 flex-1 flex flex-col gap-0.5">
    <span
      class="truncate text-[15px] font-bold text-v4-main-text-color font-funnel"
    >
      {{ heading() }}
    </span>
    <span
      class="text-[13px] text-v4-secondary-text-color font-peridot leading-snug line-clamp-2 min-h-[36px] max-w-[40ch]"
    >
      {{ description() }}
    </span>
  </span>

  @if (comingSoon()) {
    <span
      class="shrink-0 rounded-full bg-v4-accent-violet-color px-2 py-0.5 text-[11px] font-bold text-white font-peridot whitespace-nowrap"
    >
      Coming soon
    </span>
  } @else if (badge()) {
    <span
      class="shrink-0 rounded-full px-2 py-0.5 text-[11px] font-bold text-white font-peridot whitespace-nowrap"
      [style.background-color]="badgeColor()"
    >
      {{ badge() }}
    </span>
  }

  <lucide-icon
    [img]="ChevronRightIcon"
    [size]="16"
    class="shrink-0 text-v4-tertiary-text-color transition-transform group-hover:translate-x-0.5 group-hover:text-v4-primary-brand-bold-color"
  />
</button>
