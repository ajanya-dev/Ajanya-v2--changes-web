<div
  class="rounded-2xl border border-v4-border-color bg-v4-secondary-background-color p-6"
>
  <h2 class="text-xl font-bold text-v4-main-text-color font-funnel mb-6">
    {{ heading() }}
  </h2>
  <div class="grid md:grid-cols-2 xl:grid-cols-3 gap-6">
    @for (benefit of benefits(); track benefit.title) {
      <div class="flex items-start gap-3">
        <lucide-icon
          [img]="benefit.icon || defaultIcon"
          [size]="22"
          class="text-v4-text-success shrink-0 mt-0.5"
        />
        <div>
          <p
            class="text-base font-bold text-v4-main-text-color font-funnel m-0"
          >
            {{ benefit.title }}
          </p>
          <p class="text-sm text-v4-secondary-text-color font-peridot m-0 mt-1">
            {{ benefit.description }}
          </p>
        </div>
      </div>
    }
  </div>
</div>
