@if ((paymentSourceType$() | async); as sourceType) {
  <!-- Bank Dropdown -->
  @if (sourceType === 'bankaccount') {
    <app-bank-ac-dropdown-v4
      [labelIconNeeded]="displayIcon()"
      (touch)="onTouched()"
      (ready)="setDropDownAPIAndBindId(selectedBankAcDropDownHelpers, $event)"
      [formControl]="selectedBankAccount"
      permissionContext="forPayment"
      [zIndex]="pageType() === 'bulkMail' ? '997' : '998'"
      [customHeight]="customHeight()"
      [isInvalid]="isInvalid()"
    >
    </app-bank-ac-dropdown-v4>
  }
  <!-- Card Dropdown -->
  @if (sourceType === 'card') {
    <app-cards-dropdown-v4
      [labelIconNeeded]="displayIcon()"
      (ready)="setDropDownAPIAndBindId(selectedCardsDropDownHelpers, $event)"
      (touch)="onTouched()"
      [formControl]="selectedCard"
      [customHeight]="customHeight()"
      [isInvalid]="isInvalid()"
      [hideInlineHelpIcon]="hideInlineHelpIcon()"
    ></app-cards-dropdown-v4>
  }
  <!-- Wallet Dropdown -->
  @if (sourceType === 'wallet') {
    <app-wallet-dropdown-v4
      [labelIconNeeded]="displayIcon()"
      (touch)="onTouched()"
      (ready)="setDropDownAPIAndBindId(selectedWalletDropDownHelpers, $event)"
      [formControl]="selectedWallet"
      [showLogoUpdateModal]="false"
      [customHeight]="customHeight()"
      [isInvalid]="isInvalid()"
    ></app-wallet-dropdown-v4>
  }
}
