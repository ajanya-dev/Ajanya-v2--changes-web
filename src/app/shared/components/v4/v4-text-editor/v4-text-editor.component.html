<div class="v4-editor-wrapper rounded-xl border border-v4-border-color overflow-hidden bg-v4-secondary-background-color">
  <angular-editor
    [placeholder]="placeholder()"
    [config]="editorConfig()"
    [ngModel]="editorContent()"
    (ngModelChange)="onContentChange($event)"
  >
  </angular-editor>
</div>
