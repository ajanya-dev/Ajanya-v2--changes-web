@if (visible()) {
  <a
    [href]="link()"
    (click)="onPlayClick($event)"
    matTooltip="Click to play"
    class="inline-flex items-center gap-1.5 rounded-[10px] border px-3 py-1 cursor-pointer no-underline select-none transition-[background-color,border-color,color] duration-150"
    [style.color]="effectiveTextColor()"
    [style.background-color]="effectiveBackgroundColor()"
    [style.border-color]="effectiveBorderColor()"
    #demoVideoLink
  >
    <lucide-icon
      [img]="playIcon"
      [size]="24"
      class="shrink-0"
      [style.color]="effectiveIconColor()"
    />
    <span
      class="text-sm font-semibold leading-none whitespace-nowrap"
      [class.max-lg:hidden]="responsive()"
    >
      {{ label() }}
    </span>
  </a>
}
