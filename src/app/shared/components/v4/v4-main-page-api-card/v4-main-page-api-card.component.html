<div
  class="bg-v4-secondary-background-color border border-v4-border-color rounded-2xl px-4 py-3 flex items-center justify-between gap-2 h-full transition-shadow hover:shadow-md overflow-hidden"
>
  <!-- Left Content -->
  <div class="flex flex-col gap-1 min-w-0">
    <span
      class="text-xs text-v4-secondary-text-color font-peridot whitespace-nowrap"
    >
      {{ label() }}
    </span>
    @if (isLoading()) {
      <div class="skeleton-line h-7 w-24 rounded-md"></div>
    } @else if (comingSoon()) {
      <span
        class="inline-flex items-center gap-1.5 self-start rounded-full px-2.5 py-1 my-0.5 text-xs font-bold font-peridot whitespace-nowrap"
        [style.background-color]="
          'color-mix(in srgb, ' + iconBgColor() + ' 14%, transparent)'
        "
        [style.color]="iconBgColor()"
      >
        <lucide-icon [img]="clockIcon" [size]="13" />
        Coming Soon
      </span>
    } @else {
      <span
        class="text-lg xl:text-xl font-bold font-funnel truncate"
        [class.text-v4-main-text-color]="!valueColor()"
        [style.color]="valueColor()"
      >
        {{ value() }}
      </span>
    }
    @if (subtitle()) {
      <span
        class="text-xs font-peridot whitespace-nowrap"
        [style.color]="subtitleColor()"
      >
        {{ subtitle() }}
      </span>
    }
  </div>

  <!-- Right Icon -->
  <div
    class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0"
    [style.background-color]="iconBgColor()"
  >
    <lucide-icon [img]="icon()" [size]="18" [style.color]="iconColor()" />
  </div>
</div>
