<div class="flex justify-end items-center gap-2 p-3">
  <div class="controls">
    <nav
      class="relative flex gap-1 rounded-md font-color"
      aria-label="Pagination"
    >
      <a
        (click)="prev()"
        role="presentation"
        class="control-item"
        [ngClass]="{ '!cursor-no-drop opacity-50 pointer-events-none': page <= 1 }"
      >
        <span class="sr-only">Previous</span>
        <fa-icon [icon]="faAngleLeft" />
      </a>

      @for (item of pages; track $index) {
        <a
          role="presentation"
          class="control-item"
          [ngClass]="{
            'current-page': item === page,
            'pointer-events-none': item === '...'
          }"
          (click)="select(item)"
        >
          {{ item }}
        </a>
      }

      <a
        (click)="next()"
        role="presentation"
        class="control-item"
        [ngClass]="{
          '!cursor-no-drop opacity-50 pointer-events-none': page >= totalPages
        }"
      >
        <span class="sr-only">Next</span>
        <fa-icon [icon]="faAngleRight" />
      </a>
    </nav>
  </div>

  <div class="specific-page-input-container flex gap-1 items-center pl-1">
    <input
      [(ngModel)]="goto"
      (keyup.enter)="gotoEntered()"
      (keyup)="onGotoInput($any($event.target).value)"
      type="number"
      min="1"
      [max]="totalPages"
      placeholder="#"
    />
    <button role="presentation" (click)="gotoEntered()">Go to</button>
  </div>
</div>
