<div class="support_wrapper">
  <div class="support_container">
    <div class="support__header">
      <div class="left">
        <p class="sub_head">Support</p>
      </div>
    </div>

    <div class="support_body">
      <div class="p-arrow">
        <div class="p-arrow-text">
          <ng-container
            *ngIf="staticWhiteLabelConditions.zohoSupportChat; else help"
          >
            <span>
              <p><a (click)="goToLiveChat()">Live Chat</a></p>
            </span>
          </ng-container>
          <ng-template #help>
            <span>
              <p><a (click)="goToHelp()">Help</a></p>
            </span>
          </ng-template>
        </div>
        <div class="p-arrow-text">
          <span>
            <p>
              Email us at
              <a
                [href]="
                  'mailto:' + staticWhiteLabelConditions.customerSupportEmail
                "
                >{{ staticWhiteLabelConditions.customerSupportEmail }}</a
              >
            </p>
          </span>
        </div>
        <div
          class="p-arrow-text"
          *ngIf="staticWhiteLabelConditions.customerSupportNo"
        >
          <span>
            <p>
              Call at
              <a
                [href]="'tel:' + staticWhiteLabelConditions.customerSupportNo"
                >{{ staticWhiteLabelConditions.customerSupportNo }}</a
              >
            </p>
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
