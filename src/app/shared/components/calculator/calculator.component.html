<div
  cdkDrag
  cdkDragRootElement=".cdk-overlay-pane"
  class="calculator__wrapper"
  cdkDragHandle
>
  <div [mat-dialog-close]="false">
    <fa-icon
      class="text-secondary-text-color cursor-pointer"
      [icon]="['fas', 'xmark']"
    ></fa-icon>
  </div>

  <div class="container-fluid">
    <div class="calculator_body">
      <div class="calc_header">
        <div class="calc_display max-h-[43px] overflow-y-hidden">
          <div class="" type="text">{{ input }}</div>
        </div>

        <div class="calc_result max-h-[50px] overflow-y-hidden">
          <div class="" type="text">{{ result }}</div>
        </div>
      </div>

      <div class="calc_button_row">
        <button class="clearBtn" type="button" (click)="allClear()">AC</button>
        <!-- <button class="normalBtn" type="button" (click)="clear()">c</button> -->
        <button
          class="normalBtn arth_btn"
          type="button"
          (click)="pressOperator('/')"
        >
          /
        </button>
      </div>

      <div class="calc_button_row keys">
        <button class="normalBtn" type="button" (click)="pressNum('7')">
          7
        </button>
        <button class="normalBtn" type="button" (click)="pressNum('8')">
          8
        </button>
        <button class="normalBtn" type="button" (click)="pressNum('9')">
          9
        </button>
        <button
          class="normalBtn arth_btn"
          type="button"
          (click)="pressOperator('*')"
        >
          X
        </button>
      </div>
      <div class="calc_button_row keys">
        <button class="normalBtn" type="button" (click)="pressNum('4')">
          4
        </button>
        <button class="normalBtn" type="button" (click)="pressNum('5')">
          5
        </button>
        <button class="normalBtn" type="button" (click)="pressNum('6')">
          6
        </button>
        <button
          class="normalBtn arth_btn"
          type="button"
          (click)="pressOperator('-')"
        >
          -
        </button>
      </div>
      <div class="calc_button_row keys">
        <button class="normalBtn" type="button" (click)="pressNum('1')">
          1
        </button>
        <button class="normalBtn" type="button" (click)="pressNum('2')">
          2
        </button>
        <button class="normalBtn" type="button" (click)="pressNum('3')">
          3
        </button>
        <button
          class="normalBtn arth_btn"
          type="button"
          (click)="pressOperator('+')"
        >
          +
        </button>
      </div>
      <div class="calc_button_row">
        <button class="normalBtn" type="button" (click)="pressNum('.')">
          .
        </button>
        <button class="normalBtn" type="button" (click)="pressNum('0')">
          0
        </button>
        <button class="equalBtn" type="button" (click)="getAnswer()">=</button>
      </div>
    </div>

    @if(showAddAmountButton)
    {<div mat-dialog-actions class="add_btn__wrapper">
      @if(dialogData.isV4) {
        <app-common-button-v4
          [type]="{ style: 'primary', name: 'main' }"
          text="Add to Amount"
          (clickEvent)="addValue()"
          [disabled]="!valueExist"
          [isAddIcon]="true"
          [icon]="['fas', 'plus']"
        >
        </app-common-button-v4>
      } @else {
      <app-common-button-v35
        [type]="{ style: 'modal', name: 'main' }"
        text="Add to Amount"
        (clickEvent)="addValue()"
        [disabled]="!valueExist"
        [isAddIcon]="true"
        [icon]="['fas', 'plus']"
      >
      </app-common-button-v35>
      }
    </div>}
  </div>
</div>
