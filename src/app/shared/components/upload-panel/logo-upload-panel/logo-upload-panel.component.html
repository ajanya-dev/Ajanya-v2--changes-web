<section cdkDragRootElement=".cdk-overlay-pane" class="upload_section_wrapper">
  <div class="close_btn" [mat-dialog-close]="false">
    <svg
      aria-hidden="true"
      focusable="false"
      data-prefix="fal"
      data-icon="times"
      class="svg-inline--fa fa-times fa-w-10"
      role="img"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 320 512"
    >
      <path
        fill="currentColor"
        d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
      ></path>
    </svg>
  </div>
  <!--====================================================
			            LEFT SIDE SECTION START
  ======================================================-->
  <div class="left_section">
    <ul>
      <li
        *ngFor="let list of uploadLogoListTitle"
        (click)="openMenuList(list.heading)"
        [ngClass]="{ active: selectedList === list.heading }"
      >
        <div class="head_wrap">
          <i class="{{ list.icon }}"></i>
          <span class="content">{{ list.heading }}</span>
        </div>
        <b class="first"></b>
        <b class="second"></b>
      </li>
    </ul>
  </div>
  <!--=====================================================
			            LEFT SIDE SECTION END
  ======================================================-->

  <!--=====================================================
			            RIGHT SIDE SECTION START
  ======================================================-->
  <div class="right_section">
    <!-- single_box -->
    <li class="single_box" *ngIf="selectedList === 'Upload Logo'">
      <h3 class="main_head text-center">Add Logo</h3>
      <div class="input_wrapper">
        <div class="buttons">
          <div class="upload_wrapper">
            <input
              type="file"
              name="file-input"
              onclick="this.value=null"
              id="file-input"
              class="file_input"
              accept="image/png, image/jpeg"
              (change)="uploadImgFile($event)"
            />
            <label class="upload__label ocw-btn" for="file-input">
              <i class="fa-solid fa-upload"></i>
              <span>Upload file</span>
            </label>
          </div>
          <div class="create_wrapper">
            <div class="create_wrapper" (click)="openAITab()">
              <label class="create__label ocw-btn">
                <span>CREATE AI LOGO</span>
              </label>
            </div>
          </div>
        </div>

        <div class="uploaded_img_shown" *ngIf="uploadLogoImg">
          <img src="{{ uploadLogoImg }}" alt="" />
          <span class="close" (click)="remoteUploadImg()">
            <i class="far fa-times"></i>
          </span>

          <div class="upload_sign_add_btn">
            <button
              type="button"
              (click)="logoAddToCheck(uploadLogoImg, 'Upload Logo')"
              class="ocw-btn ocw-btn-light-green"
              [disabled]="btnDesable"
            >
              Save Logo
              <span *ngIf="btnDesable" class="loadingSpinner"></span>
            </button>
          </div>
        </div>
      </div>

      <div *ngIf="!uploadLogoImg">
        <span class="data_spinner" *ngIf="deleteExistLogo"></span>
        <ng-container *ngIf="existingAllLogosImages?.length !== 0">
          <h3 class="main_head text-center">All your existing Logos</h3>
          <div class="prev_img_wrapper">
            <div
              class="single_img"
              *ngFor="
                let singleImg of existingAllLogosImages;
                trackBy: trackById
              "
              (click)="logoAddToCheck(currentImg.src, 'Existing Logos')"
            >
              <img #currentImg src="{{ singleImg.imageUrlNoAuth }}" alt="" />
              <span
                class="delete_img"
                (click)="
                  deleteExistingLogo($event, singleImg.id, currentImg.src)
                "
              >
                <i class="fa fa-close"></i>
              </span>
            </div>
          </div>
        </ng-container>

        <ng-container *ngIf="existingAllLogosImages?.length === 0">
          <div class="no_img_found_upload">
            <div class="content">
              <img
                src="/assets/images/no-image-found.png"
                alt="no-image-found"
              />
              <h3>Sorry, No Logo Found</h3>
            </div>
          </div>
        </ng-container>
      </div>
    </li>

    <!-- single_box -->
    <li
      class="single_box for_logo"
      *ngIf="selectedList === 'Existing Logos'"
      [ngClass]="{ loader_white_bg: deleteExistLogo }"
    >
      <span class="data_spinner" *ngIf="deleteExistLogo"></span>
      <ng-container *ngIf="existingAllLogosImages?.length !== 0">
        <h3 class="main_head text-center">All your existing Logos</h3>
        <div class="prev_img_wrapper">
          <div
            class="single_img"
            *ngFor="let singleImg of existingAllLogosImages"
            (click)="logoAddToCheck(currentImg.src, 'Existing Logos')"
          >
            <img #currentImg src="{{ singleImg.imageUrlNoAuth }}" alt="" />
            <span
              class="delete_img"
              (click)="deleteExistingLogo($event, singleImg.id, currentImg.src)"
            >
              <i class="fa fa-close"></i>
            </span>
          </div>
        </div>
      </ng-container>

      <ng-container *ngIf="existingAllLogosImages?.length === 0">
        <div class="no_img_found_upload">
          <div class="content">
            <img src="../../../../../assets/images/no-image-found.png" />
            <h3>Sorry, No Logo Found</h3>
          </div>
        </div>
      </ng-container>
    </li>

    <li class="single_box" *ngIf="selectedList === 'AI Logo'">
      <ng-container>
        <h3 class="main_head text-left">Create a logo using AI</h3>
        <div class="category_wrapper">
          <span
            *ngIf="generatedAIImages.length === 0"
            class="data_spinner"
          ></span>
          <div *ngIf="generatedAIImages" class="ai-container">
            <div
              class="ai-image-box"
              *ngFor="let item of generatedAIImages; trackBy: trackByIndex"
              (click)="selectGeneratedImage(item)"
              [ngClass]="{
                select_generated_image: selectedGeneratedImage === item
              }"
            >
              <div class="item">
                <img src="{{ item }}" alt="ai-images" />
              </div>
            </div>
          </div>
          <div class="generate_btn_container">
            <button (click)="generateLogo()" class="ocw-btn ocw-btn-dark-blue">
              GENERATE
              <span
                *ngIf="generatedAIImages.length > 0 && loading"
                class="loadingSpinner"
              ></span>
            </button>
            <button
              (click)="saveGeneratedLogo()"
              class="ocw-btn ocw-btn-dark-green"
            >
              SAVE
              <span *ngIf="isLoading" class="loadingSpinner"></span>
            </button>
          </div>
        </div>
      </ng-container>
    </li>
  </div>

  <a
    data-fancybox
    href="https://cdn.onlinecheckwriter.com/video-tutorial/Checklist-v1.jpg"
  >
    <img
      src="https://cdn.onlinecheckwriter.com/video-tutorial/Checklist-v1.jpg"
      alt=""
    />
  </a>
  <!--=====================================================
			            RIGHT SIDE SECTION END
  ======================================================-->
</section>
