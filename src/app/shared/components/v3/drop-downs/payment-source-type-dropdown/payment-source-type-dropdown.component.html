<div class="angular-ocw-v35-ng-select-dropdown relative">
  <div class="height-2 absolute top-0 z-[999]">
    <div
      class="flex justify-center items-center v35-dropdown-labeled-icon border-r border-input-border-color"
    >
      <fa-icon
        [style]="
          'color:var(--' +
          selectedPaymentSourceType?.value?.fontawesomeIconDataV35?.color +
          ')'
        "
        [icon]="selectedPaymentSourceType?.value?.fontawesomeIconDataV35?.icon"
      ></fa-icon>
    </div>
  </div>
  <ng-select
    class="height-2 ng-dropdown-panel-v35"
    [items]="paymentSourceTypes"
    placeholder="Select a payment Type"
    appendTo="body"
    [formControl]="selectedPaymentSourceType"
    [clearable]="false"
    (blur)="onTouched()"
    style="width: 200px"
    #dropdown
    [ngClass]="{
      'drop-down-select': dropdown.isOpen
    }"
  >
    >
    <ng-template ng-label-tmp let-item="item">
      <div class="flex items-center text-sm">
        <div>{{ item.label }}</div>
      </div>
    </ng-template>
    <ng-template ng-option-tmp let-item="item" let-index="index">
      <div
        class="rounded-full mr-2 text-sm"
        [ngClass]="
          'w-8 h-8 flex justify-center items-center bg-tertiary-background-color text-common-green-color'
        "
      >
        @if (item.fontawesomeIconDataV35?.icon) {
          <fa-icon
            class="px-2"
            [style]="'color:var(--' + item.fontawesomeIconDataV35?.color + ')'"
            [icon]="item.fontawesomeIconDataV35?.icon"
          ></fa-icon>
        }
      </div>
      <div class="flex-1 justify-between flex">
        <div>
          <p class="main-text-highlight text-ellipsis">
            {{ item?.label }}
          </p>
        </div>
      </div>
    </ng-template>
  </ng-select>
</div>
