<div
  class="angular-ocw-v35-ng-select-dropdown angular-ocw-v35-multi-select-dropdown relative"
>
  @if (labelIconNeeded) {
    <div
      [class]="labelIconNeeded ? 'height-' + customHeight : ''"
      class="height-5 absolute top-0 z-[1002]"
    >
      <div
        class="flex justify-center items-center v35-dropdown-labeled-icon border-r border-input-border-color"
      >
        <fa-icon
          class="text-common-violet-color"
          [icon]="['fas', 'wallet']"
        ></fa-icon>
      </div>
    </div>
  }
  <ng-select
    [appendTo]="append"
    id="payee_drop_down_{{ id }}"
    placeholder="{{ placeholder }}"
    [formControl]="selectedWallet"
    (scrollToEnd)="onScrollToEnd()"
    (keyup)="search($event)"
    (focus)="search($event)"
    [items]="walletsToList$ | async"
    [loading]="isLoadingWithId"
    (clear)="clear()"
    (blur)="onTouched(); touch.emit()"
    [notFoundText]="
      (selectIsWalletsLoading$ | async) === false &&
      (walletsToList$ | async).length === 0
        ? 'No Wallets Found'
        : 'Loading...'
    "
    class="ng-dropdown-panel-v35 text-sm height-5"
    [class]="labelIconNeeded ? 'height-' + customHeight : ''"
    bindLabel="walletName"
    [multiple]="true"
    [closeOnSelect]="false"
  >
    <ng-template
      ng-option-tmp
      let-item="item"
      let-item$="item$"
      let-index="index"
    >
      <input id="item-{{ index }}" type="checkbox" [ngModel]="item$.selected" />
      <span class="pl-2">{{
        item.walletName ?? item.bankAccountNickName
      }}</span>
    </ng-template>

    <ng-template ng-option-tmp let-item="item" let-index="index">
      <div class="flex-1 main-text-highlight font-medium overflow-hidden">
        <div class="main-text-highlight text-ellipsis truncate text-sm">
          {{ item.walletName ?? item.bankAccountNickName }}
        </div>
      </div>
    </ng-template>

    <ng-template ng-footer-tmp>
      @if (selectIsWalletsLoading$ | async) {
        <div class="skelton p-1.5"></div>
      }
    </ng-template>
  </ng-select>
</div>
