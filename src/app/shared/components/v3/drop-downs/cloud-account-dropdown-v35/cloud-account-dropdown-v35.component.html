<div class="angular-ocw-v35-ng-select-dropdown relative">
  <div [class]="'height-' + customHeight" class="absolute top-0 z-[999]">
    <div
      class="flex justify-center items-center v35-dropdown-labeled-icon border-r border-input-border-color"
    >
      <fa-icon
        class="text-common-green-color"
        [icon]="['fas', 'building-columns']"
      ></fa-icon>
    </div>
  </div>
  <ng-select
    [appendTo]="append"
    class="ng-dropdown-panel-v35 text-sm height-0"
    [class]="'height-' + customHeight"
    id="drop_down_{{ id }}"
    (change)="getChange($event)"
    (clear)="clear()"
    groupBy="title"
    placeholder="{{ placeholder }}"
    [(ngModel)]="selectedItem"
    [loading]="isLoadingWithId"
  >
    @for (item of accountArray; track item) {
      @if (item.accountStatus === "ACTIVE") {
        <ng-option [value]="item">
          <div
            class="text-sm"
            class="w-8 h-8 flex justify-center rounded-full mr-2 items-center bg-tertiary-background-color text-common-green-color"
          >
            <fa-icon
              class="text-common-green-color px-2"
              [icon]="faBuildingColumns"
            ></fa-icon>
          </div>
          <div class="flex-1 justify-between flex">
            <div>
              <p class="main-text-highlight text-ellipsis">
                {{ item?.accountName }}
              </p>
              <ng-container>
                <span class="text-sm text-secondary-text-color">
                  {{ utils.getMaskedAcNo(item?.accountNumber ?? "") }}
                </span>
              </ng-container>
            </div>
            <div>
              <span class="text-sm hidden text-secondary-text-color">
                ${{ item?.availableBalance ?? "0.00" }}
              </span>
            </div>
          </div>
        </ng-option>
      }
    }
    <ng-template ng-footer-tmp>
      @if (((isLoading$ | async) ?? false) || isLoadingWithId) {
        <div class="skelton p-1.5 -mt-1"></div>
      }
    </ng-template>
  </ng-select>
</div>
