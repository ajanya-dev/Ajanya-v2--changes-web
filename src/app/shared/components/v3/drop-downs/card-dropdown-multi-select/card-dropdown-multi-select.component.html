<div
  class="angular-ocw-v35-ng-select-dropdown angular-ocw-v35-multi-select-dropdown relative"
>
  @if (dropdownIconNeeded) {
    <div
      [class]="labelIconNeeded ? 'height-' + customHeight : ''"
      class="height-5 absolute top-0 z-[1002]"
    >
      <div
        class="flex justify-center items-center v35-dropdown-labeled-icon border-r border-input-border-color"
      >
        <fa-icon
          class="text-common-yellow-color"
          [icon]="['fas', 'credit-card']"
        ></fa-icon>
      </div>
    </div>
  }
  <ng-select
    [appendTo]="append"
    id="payee_drop_down_{{ id }}"
    [class]="labelIconNeeded ? 'height-' + customHeight : ''"
    class="ng-dropdown-panel-v35 text-sm w-auto height-5"
    [items]="cards"
    [formControl]="selectedCard"
    (blur)="onTouched(); touch.emit()"
    placeholder="{{ placeholder }}"
    [loading]="(selectIsCardsLoading$ | async) ?? false"
    bindLabel="nickName"
    [multiple]="true"
    [closeOnSelect]="false"
  >
    <ng-template ng-header-tmp>
      @if (enableAddNew) {
        <div
          (click)="addNewCard()"
          role="presentation"
          class="add-new-btn-ng-option p-2 flex justify-center items-center text-center bg-common-secondary-blue-color rounded-lg text-common-blue-color cursor-pointer font-semibold text-[14px]"
        >
          <fa-icon class="mr-1" [icon]="['fas', 'plus']"></fa-icon>
          <span class="add-new-text-ng-option">New</span>
        </div>
      }
    </ng-template>
    <ng-template
      ng-option-tmp
      let-item="item"
      let-item$="item$"
      let-index="index"
    >
      <input id="item-{{ index }}" type="checkbox" [ngModel]="item$.selected" />
      <span class="pl-2">{{ item.nickName }}</span>
    </ng-template>

    <ng-template ng-option-tmp let-item="item" let-index="index">
      <div class="flex-1 main-text-highlight font-medium overflow-hidden">
        <div class="main-text-highlight text-ellipsis truncate text-sm">
          {{ item.nickName }}
        </div>
        <div class="!text-secondary-text-color">
          **** **** **** {{ item.last4 }}
        </div>
      </div>
    </ng-template>

    <ng-template ng-footer-tmp>
      @if (selectIsCardsLoading$ | async) {
        <div class="skelton p-1.5 -mt-1 mx-1"></div>
      }
    </ng-template>
  </ng-select>
</div>
