<div
  [matTooltip]="
    (payeeId === null || payeeId === undefined) && enableUpdate
      ? 'Please select the payee first'
      : ''
  "
  class="angular-ocw-v35-ng-select-dropdown industry-dropdown payee-bank-ac-dropdown-overrides"
>
  <ng-select
    [ngClass]="{
      'pointer-events-none':
        (payeeId === null || payeeId === undefined) && enableUpdate
    }"
    [readonly]="readonly"
    class="border-input-border-color"
    [(ngModel)]="selectedItem"
    [bindLabel]="'mcc_description'"
    [bindValue]="'mcc_description'"
    (change)="getChange($event)"
    [placeholder]="placeholder"
    [loading]="loading"
    [loadingText]="'Loading...'"
  >
    <!-- Loop through grouped industry types -->
    @for (group of groupedIndustryTypes; track $index) {
      @if (group.main) {
        <!-- For main categories -->
        <ng-option
          [ngClass]="'dropdown-option main-category'"
          [value]="group.main.mcc_code"
        >
          <div class="flex justify-between">
            <p class="main-text-highlight !font-bold text-ellipsis">
              {{ group.main.mcc_description }}
            </p>
          </div>
        </ng-option>
        <!-- Subcategories -->
        @for (sub of group.sub; track sub) {
          <!-- For subcategories -->
          <ng-option
            [ngClass]="'dropdown-option'"
            [value]="sub.mcc_code"
          >
            <div class="sub-option flex justify-between pl-5">
              <p class="main-text-highlight !font-normal text-ellipsis">
                {{ sub.mcc_description }}
              </p>
            </div>
          </ng-option>
        }
      } @else {
        <!-- Standalone subcategories when main is null -->
        @for (sub of group.sub; track sub) {
          <ng-option
            [ngClass]="'dropdown-option'"
            [value]="sub.mcc_code"
          >
            <div class="sub-option flex justify-between">
              <p class="text-ellipsis !font-normal">
                {{ sub.mcc_description }}
              </p>
            </div>
          </ng-option>
        }
      }
    }
  </ng-select>
</div>
