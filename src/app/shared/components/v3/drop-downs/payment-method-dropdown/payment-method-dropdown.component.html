<div class="angular-ocw-v35-ng-select-dropdown">
  <ng-select
    appendTo="body"
    class="ng-dropdown-panel-v35 text-sm w-auto"
    [clearable]="false"
    [formControl]="selectedPaymentMethod"
    placeholder="Pay As"
    notFoundText="No categories found"
    [loading]="
      loading ||
      (paymentTypeAccessService.isDisabledPaymentsLoadingSignal() ?? false)
    "
    [disabled]="
      loading ||
      (paymentTypeAccessService.isDisabledPaymentsLoadingSignal() ?? false)
    "
    (change)="onInputChanges()"
  >
    <ng-option *ngFor="let item of paymentMethods" [value]="item">
      <span class="text-sm main-text-highlight">
        {{ item.label }}
      </span>
    </ng-option>
  </ng-select>
</div>
