<div class="w-full flex gap-1">
  <div class="angular-ocw-v35-ng-select-dropdown relative w-full">
    @if (dropdownIconNeeded) {
      <div
        [class]="labelIconNeeded ? 'height-' + customHeight : ''"
        class="height-0 absolute top-0 z-[999]"
      >
        <div
          class="flex justify-center items-center v35-dropdown-labeled-icon border-r border-input-border-color"
        >
          <fa-icon
            class="text-common-yellow-color"
            [icon]="faLocationDot"
          ></fa-icon>
        </div>
      </div>
    }

    <ng-select
      [ngClass]="'!z-[' + zIndex() + ']'"
      [appendTo]="append"
      id="from_address_drop_down_{{ id }}"
      [class]="labelIconNeeded ? 'height-' + customHeight : ''"
      class="ng-dropdown-panel-v35 text-sm w-auto height-0"
      [items]="shippingAddressFrom()"
      [formControl]="selectedAddress"
      (blur)="onTouched(); touch.emit()"
      placeholder="{{ placeholder }}"
      [loading]="isLoading()"
      bindLabel="name"
      notFoundText="No addresses found"
    >
      <ng-template ng-header-tmp>
        @if (enableAddNew) {
          <div
            (click)="addNewAddress()"
            role="presentation"
            class="add-new-btn-ng-option p-2 flex justify-center items-center text-center bg-common-secondary-blue-color rounded-lg text-common-blue-color cursor-pointer font-semibold text-[14px]"
          >
            <fa-icon class="mr-1" [icon]="faPlus"></fa-icon>
            <span class="add-new-text-ng-option">New Address</span>
          </div>
        }
      </ng-template>

      <ng-template ng-label-tmp let-item="item" let-index="index">
        <div
          class="main-text-highlight text-ellipsis overflow-hidden font-medium text-sm"
        >
          {{ item.name }}
        </div>
      </ng-template>

      <ng-template ng-option-tmp let-item="item" let-index="index">
        <div class="flex items-center w-full">
          @if (labelIconNeeded) {
            <div
              class="rounded-full mr-2 text-sm text-common-yellow-color w-8 h-8 flex justify-center items-center bg-tertiary-background-color"
            >
              <fa-icon class="px-2" [icon]="faLocationDot"></fa-icon>
            </div>
          }
          <div class="flex-1 main-text-highlight font-medium overflow-hidden">
            <div
              class="main-text-highlight text-ellipsis truncate text-sm font-semibold"
            >
              {{ item.name }}
            </div>
          </div>
        </div>
      </ng-template>

      <ng-template ng-footer-tmp>
        @if (isLoading) {
          <div class="skelton p-1.5 -mt-1 mx-1"></div>
        }
      </ng-template>
    </ng-select>

    <!-- Tooltip icon absolutely positioned to the right, before the arrow -->
    @if (!selectedAddress.value) {
      <fa-icon
        [icon]="faCircleQuestion"
        [matTooltip]="
          '• Choose your saved from address. \n• Select \'+ New Address\' to add a different address.'
        "
        [matTooltipPosition]="'right'"
        [matTooltipShowDelay]="300"
        class="tooltip-question-icon absolute"
      ></fa-icon>
    }
  </div>
  @if (selectedAddress.value) {
    <div
      class="flex items-center justify-center bg-common-blue-color rounded py-1 px-3"
    >
      <fa-icon
        [icon]="faPenToSquare"
        class="text-white cursor-pointer text-base"
        (click)="openAddMailAddressModal(true)"
      ></fa-icon>
    </div>
  }
</div>
