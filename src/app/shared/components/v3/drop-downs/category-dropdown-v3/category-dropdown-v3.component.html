<div class="angular-ocw-v35-ng-select-dropdown relative">
  
  <ng-select
    [appendTo]="append"
    id="payee_drop_down_{{ id }}"
    class="ng-dropdown-panel-v35 text-sm"
    [formControl]="selectedCategory"
    (scrollToEnd)="onScrollToEnd()"
    (focus)="search($event)"
    (keyup)="search($event)"
    (clear)="clear()"
    (blur)="(onTouched)"
    (change)="onChange($event)"
    placeholder="{{ placeholder }}"
    [notFoundText]="
      (categoriesState$ | async)?.isLoading
        ? 'Loading ...'
        : 'No categories found'
    "
    [loading]="isLoadingWithId"
  >
    <ng-option value="add-new" *ngIf="enableAddNew">
      <div
        role="presentation"
        class="add-new-btn-ng-option p-2 flex justify-center items-center text-center text-sm bg-common-secondary-blue-color rounded-lg text-common-blue-color cursor-pointer"
      >
        <fa-icon class="mr-1" [icon]="['fas', 'plus']"></fa-icon>
        <span class="add-new-text-ng-option">New</span>
      </div>
    </ng-option>
    <ng-option [value]="item" *ngFor="let item of categoriesToList$ | async"
      ><p
        class="main-text-highlight text-ellipsis overflow-hidden font-medium text-sm"
      >
        {{ item.name }} {{ item?.nickName ? "(" + item?.nickName + ")" : "" }}
      </p>
    </ng-option>

    <ng-template ng-footer-tmp>
      <div
        class="skelton p-1.5 -mt-1 mx-1"
        *ngIf="(categoriesState$ | async)?.isLoading || isLoadingWithId"
      ></div>
    </ng-template>
  </ng-select>
  @if(!selectedCategory?.value){
  <fa-icon
  [icon]="faCircleQuestion"
  [matTooltip]="'• Organize payment for your records.\n• Helps with expense tracking/taxes.'"
  [matTooltipPosition]="'right'"
  [matTooltipShowDelay]="300"
  class="tooltip-question-icon absolute"
></fa-icon>
  }
  
</div>
