<div class="flex flex-col">
  <a
    class="group relative mt-2.5 bg-main-background-color w-8 h-8 rounded-full text-center shadow-xl border border-main-background-color flex items-center justify-center"
    appWhiteLabel
    hiddenIf="hideLiveChat"
  >
    <fa-icon
      (click)="goToLiveChat()"
      class="text-common-blue-color text-base cursor-pointer"
      [icon]="faMessage"
    ></fa-icon>
    <div
      class="absolute shadow-common-box-shadow z-10 text-main-text-color opacity-0 !ml-[105px] bg-main-background-color group-hover:opacity-100 top-0 rounded-md w-[70px]"
    >
      <span class="text-xs font-inter !text-common-blue-color pl-2"
        >Live Chat</span
      >
    </div>
  </a>
  <a
    class="group relative mt-2.5 bg-main-background-color w-8 h-8 flex items-center justify-center rounded-full text-center shadow-xl border border-main-background-color"
    [href]="'mailto:' + staticWhiteLabelConditions.customerSupportEmail"
  >
    <fa-icon
      class="text-common-blue-color text-base cursor-pointer"
      [icon]="faEnvelope"
    ></fa-icon>
    <div
      class="absolute shadow-common-box-shadow z-10 text-main-text-color opacity-0 !ml-[220px] bg-main-background-color group-hover:opacity-100 top-0 rounded-md w-[200px]"
    >
      <span class="text-xs font-inter !text-common-blue-color pl-2">
        {{ staticWhiteLabelConditions.customerSupportEmail }}</span
      >
    </div>
  </a>
  @if (staticWhiteLabelConditions.customerSupportNo) {
    <a
      [href]="'tel:' + staticWhiteLabelConditions.customerSupportNo"
      class="group relative flex justify-center items-center mt-2.5 bg-main-background-color w-8 h-8 rounded-full text-center border border-main-background-color"
    >
      <fa-icon
        class="text-common-blue-color text-base cursor-pointer"
        [icon]="faHeadset"
      ></fa-icon>
      <div
        class="absolute shadow-common-box-shadow z-10 text-main-text-color opacity-0 !ml-[180px] bg-main-background-color group-hover:opacity-100 top-0 rounded-md w-[145px]"
      >
        <span class="text-xs font-inter !text-common-blue-color pl-2">
          Call at {{ staticWhiteLabelConditions.customerSupportNo }}</span
        >
      </div>
    </a>
  } @else {
    <a
      [href]="staticWhiteLabelConditions.helpWebsite"
      target="_blank"
      rel="noopener noreferrer"
      class="group relative flex justify-center items-center mt-2.5 bg-secondary-background-color w-8 h-8 rounded-full text-center shadow-xl border border-main-background-color"
    >
      <fa-icon
        class="text-common-blue-color text-base cursor-pointer"
        [icon]="faHeadset"
      ></fa-icon>
      <div
        class="absolute shadow-common-box-shadow z-10 text-main-text-color opacity-0 !ml-[180px] bg-main-background-color group-hover:opacity-100 top rounded-md w-[145px]"
      >
        <span class="text-xs font-inter !text-common-blue-color pl-2">
          Contact Us</span
        >
      </div>
    </a>
  }
</div>
