<div class="flex items-center pr-2"
    [ngClass]="{'border border-common-blue-color rounded':selectedDateRangeName !== 'All Time'}">
  <button
    class="flex items-center p-[3px] color cursor-pointer w-full gap-1 !text-secondary-text-color"
    (click)="showDateRange()"
    #menuTrigger="matMenuTrigger"
    id="btn"
    matMenuTrigger
    [matMenuTriggerFor]="dateRangeMenu"
    mat-button
  >
    <fa-icon class="fa-icon-calender" [icon]="faCalendar"></fa-icon>
    {{ selectedDateRangeName }}
  </button>
  @if(selectedDateRangeName !== 'All Time'){
    <fa-icon (click)="resetFilter()" class="text-secondary-text-color cursor-pointer font-black text-sm" [icon]="faXmark"></fa-icon>
  }
</div>

<mat-menu
  #dateRangeMenu="matMenu"
  class="date-range-menu-panel bg-tertiary-background-color"
>
  @if (!closeDataRange) {
    <div class="flex items-center h-full">
      <div
        class="date-options text-sm border border-input-border-color border-solid rounded-[3px] mt-2.5 ml-5"
      >
        @for (item of dateRanges; track item.id) {
          <button
            class="ml-3 !text-sm"
            mat-menu-item
            [ngClass]="{
              '!bg-input-border-color': item.name === selectedDateRangeName
            }"
            (click)="selectDateRange(item.id)"
          >
            {{ item.name }}
          </button>
        }
      </div>

      <!-- Right side - MatCalendar to select a date range -->
      <div class="relative ml-5">
        <div>
          <mat-calendar
            class="w-64"
            [selected]="dateRange"
            (selectedChange)="rangeChanged($event)"
            (click)="stopClickEvent($event)"
          ></mat-calendar>
        </div>
        <div class="flex gap-2 justify-end">
          <app-common-button-v35
            type="list"
            text="Clear"
            (clickEvent)="resetFilter()"
          ></app-common-button-v35>
          <app-common-button-v35
            type="list"
            text="Done"
            (clickEvent)="customFilter()"
          ></app-common-button-v35>
        </div>
      </div>
    </div>
  }
</mat-menu>
