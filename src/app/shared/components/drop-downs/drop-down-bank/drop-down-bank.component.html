<ng-select
  class="drop-down-select"
  id="drop_down_{{ id }}"
  style="width: 200px"
  [(ngModel)]="selectedItem"
  (scrollToEnd)="onScrollToEnd()"
  (keyup)="search($event)"
  [addTag]="addTag"
  (change)="getChange($event)"
  placeholder="{{ placeholder }}"
  [disabled]="isDropdownDisabled"
  (clear)="clear()"
  [appendTo]="appendTo"
>
  <!-- Temporary Disable -->
  <!-- <ng-option value="pay_using_credit_card" *ngIf="displayCreditCardAd && bankAccounts?.length">
        <div class="credit-card-label">
          <p class="itemname">Pay From Credit Card</p>
          <span class="new_badge">New</span>
        </div>
      </ng-option> -->
  <ng-option *ngIf="enableAddNew" [value]="'add-new'"
    ><div class="border-b-2 -m-2 p-2">
      <span class="add-new-text">New Bank Account</span
      ><i class="add-new-icon fa-solid fa-plus ml-2"></i></div
  ></ng-option>
  <ng-option *ngFor="let item of bankAccounts" [value]="item">
    <div class="label_wrapper">
      <span class="itemname">
        {{ item.nickName != null ? item.nickName : item.name }}
        {{ item.accountNumber }}</span
      >
      <span
        *ngIf="
          showACHBadge && (item.isItZil || item.achApplicationStatus === 1);
          else verified
        "
        class="ach_badge"
        title="ACH Verified"
        >ACH</span
      >
      <ng-template #verified>
        <div *ngIf="isPayroll && item.verified === 1" class="verfied_badge">
          <i class="fa-solid fa-circle-check" title="Verfied"></i>
        </div>
      </ng-template>
    </div>
  </ng-option>
</ng-select>
