<ng-select
  style="width: 200px"
  class="drop-down-select"
  id="drop_down_{{ id }}"
  [(ngModel)]="selectedItem"
  (scrollToEnd)="onScrollToEnd()"
  (keyup)="search($event)"
  (change)="getChange($event)"
  (clear)="clear()"
  placeholder="{{ placeholder }}"
  [loading]="isLoading()"
>
  @for (item of payees; track item.id) {
    <ng-option [value]="item">
      {{ item.name }}
      {{ item?.nickName ? "(" + item?.nickName + ")" : "" }}
    </ng-option>
  }
  <ng-template ng-loadingspinner>
    <div class="flex justify-center p-2">
      <fa-icon [icon]="faSpinner" animation="spin" />
    </div>
  </ng-template>
</ng-select>
