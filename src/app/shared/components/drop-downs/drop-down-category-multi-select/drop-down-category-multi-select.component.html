<div
  class="angular-ocw-v35-ng-select-dropdown angular-ocw-v35-multi-select-dropdown"
>
  <ng-select
    style="width: 200px"
    [items]="categories"
    [multiple]="true"
    [closeOnSelect]="false"
    [placeholder]="placeholder"
    [appendTo]="appendTo"
    bindLabel="name"
    bindValue="id"
    (keyup)="search($event)"
    (scrollToEnd)="onScrollToEnd()"
    (change)="getChange($event)"
    class="ng-dropdown-panel-v35 text-sm height-5"
  >
    <ng-template
      ng-option-tmp
      let-item="item"
      let-item$="item$"
      let-index="index"
    >
      <input id="item-{{ index }}" type="checkbox" [ngModel]="item$.selected" />
      <span class="pl-2">{{ item.name }}</span>
    </ng-template>
  </ng-select>
</div>
