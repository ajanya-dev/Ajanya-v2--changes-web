<ng-select
  style="width: 200px"
  id="drop_down_{{ id }}"
  (change)="onChange($event)"
  placeholder="{{ placeholder }}"
>
  <ng-option *ngIf="enableAddNew" [value]="'add-new'">
    <div class="border-b-2 -m-2 p-2">
      <span class="add-new-text">Add Business</span
      ><i class="fa-solid fa-plus ml-2 add-new-icon"></i>
    </div>
  </ng-option>
  <ng-option *ngFor="let item of businessList" [value]="item.id">{{
    item.name
  }}</ng-option>
</ng-select>
