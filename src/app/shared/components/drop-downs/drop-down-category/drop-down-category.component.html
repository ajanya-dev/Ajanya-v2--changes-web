<div class="angular-ocw-v35-ng-select-dropdown relative">
<ng-select
  style="width: 200px"
  [(ngModel)]="selectedItem"
  (scrollToEnd)="onScrollToEnd()"
  (keyup)="search($event)"
  (change)="getChange($event)"
  (clear)="clear()"
  placeholder="{{ placeholder }}"
  dropdownPosition="{{ dropdownPosition }}"
>
  <ng-option *ngIf="enableAddNew" [value]="'add-new'">
    <div class="border-b-2 -m-2 p-2">
      <span class="add-new-text">New Category</span
      ><i class="fa-solid fa-plus ml-2 add-new-icon"></i>
    </div>
  </ng-option>
  <ng-option *ngFor="let item of categories" [value]="item">{{
    item.name
  }}</ng-option>
</ng-select>
@if(!selectedItem){
  <fa-icon
  [icon]="faCircleQuestion"
  [matTooltip]="'• Organize payment for your records.\n• Helps with expense tracking/taxes.'"
  [matTooltipPosition]="'right'"
  [matTooltipShowDelay]="300"
  class="tooltip-question-icon absolute"
  ></fa-icon>
}
