<ng-select
  *ngIf="type === 'ach-apply'"
  [(ngModel)]="selectedItem"
  (scrollToEnd)="onScrollToEnd()"
  (keyup)="search($event)"
  [addTag]="addTag"
  (change)="getChange($event)"
  placeholder="{{ placeholder }}"
>
  <ng-option
    *ngFor="let item of bankAccounts"
    [value]="item"
    (click)="getChange(item)"
  >
    <!-- <span [ngClass]="{'orange' : item.status!=='' && item.verified==1, 'red' : item.verified==0 ,'green':item.status==='' && item.verified==1}"> {{item.nickName}} <span class="font-size-sm">{{' ('+item.accountNumber+')'}}</span> </span>    -->
    <span
      [ngClass]="{
        orange: item.status !== '' && item.verified == 1,
        red: item.verified == 0,
        green: item.status === '' && item.verified == 1
      }"
    >
      {{
        item.verified
          ? item.nickName + " (" + item.accountNumber + ")"
          : item.nickName +
            " (" +
            item.accountNumber +
            ")" +
            " " +
            "(not verified)"
      }}
    </span>
  </ng-option>
</ng-select>

<ng-select
  *ngIf="type === 'manual-ach'"
  [(ngModel)]="selectedItem"
  (scrollToEnd)="onScrollToEnd()"
  (keyup)="search($event)"
  [addTag]="addTag"
  (change)="getChange($event)"
  placeholder="{{ placeholder }}"
>
  <ng-option
    *ngFor="let item of bankAccounts"
    [value]="item"
    (click)="getChange(item)"
  >
    <span
      [ngClass]="{
        orange: item.mAch !== 1 && item.verified == 1,
        red: item.verified == 0,
        green: item.mAch == 1 && item.verified == 1
      }"
    >
      {{ item.nickName }}
      <span class="font-size-sm">{{ " (" + item.accountNumber + ")" }}</span>
    </span>
  </ng-option>
</ng-select>

<ng-select
  *ngIf="type === 'subscription'"
  [(ngModel)]="selectedItem"
  (scrollToEnd)="onScrollToEnd()"
  (keyup)="search($event)"
  [addTag]="addTag"
  (change)="getChange($event)"
  placeholder="{{ placeholder }}"
>
  <ng-option
    *ngFor="let item of bankAccounts"
    [value]="item"
    (click)="getChange(item)"
  >
    <span
      [ngClass]="{
        red: item.verified != 1,
        green:
          (item.status == 3 && item.verified == 1) ||
          (item.status == 2 && item.verified == 1)
      }"
    >
      {{ item.nickName }}
      <span class="font-size-sm">{{ " (" + item.accountNumber + ")" }}</span>
    </span>
  </ng-option>
</ng-select>
