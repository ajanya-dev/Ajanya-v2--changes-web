<ng-select
  [(ngModel)]="selectedItem"
  class="drop-down-ng-select"
  (scrollToEnd)="onScrollToEnd()"
  (keyup)="search($event)"
  [addTag]="addTag"
  (change)="getChange($event)"
  placeholder="{{ placeholder }}"
  [appendTo]="appendTo"
  (clear)="clear()"
>
  <ng-option *ngFor="let item of data" [value]="item[name]"
    >{{ item.name }}
    {{ item?.nickName ? "(" + item?.nickName + ")" : "" }}</ng-option
  >
</ng-select>
