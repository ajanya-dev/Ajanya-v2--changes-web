<div class="flex w-100 flex-1">
  <app-v35-common-dropdown
    #dropDownCustomAddress
    [config]="dropDownConfig"
    class="w-full"
    [listData]="listData"
    [(ngModel)]="selectedItem"
    [ngModelOptions]="{ standalone: true }"
    appendTo="body"
    [disabled]="config.disabled"
    (buttonClick)="openAddMailAddressModal(config.dataKey)"
    (ngModelChange)="onDropDownChange($event)"
  ></app-v35-common-dropdown>

  <div class="flex-shrink-0">
    <button
      type="button "
      class="ocw-btn-skyblue ocw-btn ml-2"
      value="mail-from"
      (click)="openAddMailAddressModal(config.dataKey)"
    >
      <fa-icon [icon]="selectedItem ? faEdit : faPlus"></fa-icon>
    </button>
  </div>
</div>
