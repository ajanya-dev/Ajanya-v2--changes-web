<div
  class="angular-ocw-v35-ng-select-dropdown angular-ocw-v35-multi-select-dropdown"
>
  <ng-select
    [attr.id]="id"
    style="width: 200px"
    dropdownPosition="{{ dropdownPosition }}"
    placeholder="{{ placeholder }}"
    [(ngModel)]="selectedItem"
    (scrollToEnd)="onScrollToEnd()"
    (change)="getChange($event)"
    [items]="kybBusinessData"
    class="ng-dropdown-panel-v35 text-sm height-5"
  >
    <ng-template ng-header-tmp>
      <div
        (click)="addNewBusiness()"
        role="presentation"
        class="add-new-btn-ng-option p-2 flex justify-center items-center text-center bg-common-secondary-blue-color rounded-lg text-common-blue-color cursor-pointer font-semibold text-[14px]"
      >
        <fa-icon class="mr-1" [icon]="['fas', 'plus']"></fa-icon>
        <span class="add-new-text-ng-option">New</span>
      </div>
    </ng-template>
    <ng-template ng-label-tmp let-item="item" let-index="index">
      <div
        class="main-text-highlight text-ellipsis overflow-hidden font-medium text-sm"
      >
        {{ item.businessName }}
      </div>
    </ng-template>

    <ng-template ng-option-tmp let-item="item" let-index="index">
      <div class="flex-1 main-text-highlight font-medium overflow-hidden">
        <div class="main-text-highlight text-ellipsis truncate text-sm">
          {{ item.businessName }}
        </div>
      </div>
    </ng-template>
  </ng-select>
</div>
