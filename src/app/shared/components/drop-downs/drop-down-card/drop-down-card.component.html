<ng-select
  class="drop-down-select"
  id="drop_down_{{ id }}"
  [placeholder]="placeholder"
  (change)="onChange($event)"
  [(ngModel)]="selectedItem"
  [disabled]="isDropdownDisabled"
>
  <ng-option *ngIf="enableAddNew" [value]="'add-new'">
    <div class="border-b-2 -m-2 p-2">
      <span class="add-new-text">New Card</span
      ><i class="fa-solid fa-plus ml-2 add-new-icon"></i>
    </div>
  </ng-option>
  <ng-option [value]="card" *ngFor="let card of cardList">
    {{ card?.nickName }}
  </ng-option>
</ng-select>
