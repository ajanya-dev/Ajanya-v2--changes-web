<div class="h-full w-full flex items-center justify-center font-inter">
  <div
    [ngClass]="{ 'bg-secondary-background-color border-solid': hasFocus }"
    class="relative flex flex-col items-center justify-center gap-2 min-w-60 w-full min-h-44 border-2 border-dashed border-main-text-color rounded-md transition"
  >
    @if (preViewUrl && isImage) {
      <img [ngStyle]="previewStyle" [src]="preViewUrl" alt="preview" />
    }

    @if (preViewUrl && !isImage) {
      <img
        [ngStyle]="previewStyle"
        src="assets/images/document.svg"
        alt="document"
      />
    }

    @if (clearable && file) {
      <fa-icon
        (click)="clear()"
        class="absolute top-2 right-2 text-secondary-text-color z-20 cursor-pointer"
        [icon]="faCircleXmark"
      ></fa-icon>
    }

    <span
      class="text-sm whitespace-normal overflow-hidden text-ellipsis text-main-text-color font-semibold"
      >{{ file ? file.name : "Upload or drag a file here" }}</span
    >
    <input
      (click)="changeFocus(true)"
      (dragenter)="changeFocus(true)"
      (focus)="changeFocus(true)"
      (drop)="changeFocus(false)"
      (blur)="changeFocus(false)"
      (dragleave)="changeFocus(false)"
      (change)="fileChange($event)"
      [multiple]="false"
      [accept]="accept"
      #inputElm
      class="absolute left-0 top-0 h-full w-full cursor-pointer opacity-0 focus:outline-none z-10"
      type="file"
    />
  </div>
</div>
