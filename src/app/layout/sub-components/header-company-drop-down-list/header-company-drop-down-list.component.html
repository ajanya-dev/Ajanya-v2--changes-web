<div>
  <P class="text-xs pt-2 pb-0.5 pl-4 font-semibold text-common-dark-blue-color"
    >OWN COMPANIES</P
  >
  <ng-container
    *ngFor="let company of allCompanies?.ownCompanies; let i = index"
  >
    <div
      role="presentation"
      (click)="selectCompany(company, 'owncmp')"
    >
      <ul>
        <li
          class="flex justify-start items-center gap-3.5 py-2 px-3.5 cursor-pointer transition-all duration-100 ease-linear hover:bg-common-secondary-blue-color"
          *ngIf="company.companyName"
        >
          <div
            class="w-8 h-8 rounded-full object-cover flex justify-center items-center"
          >
            <img
              class="object-cover w-full h-full rounded-full"
              [src]="
                company.companyLogoUrl
                  ? company.companyLogoUrl
                  : '../../../assets/images/company_img_new.png'
              "
              alt="Company Icon"
            />
          </div>
          <div>
            <p
              class="text-main-text-color capitalize text-sm w-[16ch] whitespace-nowrap overflow-hidden text-ellipsis"
            >
              {{ company.companyName }}
            </p>
          </div>
        </li>
      </ul>
    </div>
  </ng-container>

  <P
    class="text-xs pt-2 pb-0.5 pl-4 font-semibold text-common-dark-blue-color"
    *ngIf="allCompanies?.invitedCompanies?.length"
    >INVITED COMPANIES</P
  >
  <ng-container
    *ngFor="let company of allCompanies?.invitedCompanies; let i = index"
  >
    <div
      role="presentation"
      (click)="
        selectCompany(
          company,
          'invcomp',
          true
        )
      "
      class="invited_companies hover:bg-common-secondary-blue-color"
    >
      <ul>
        <li
          class="flex justify-start items-center gap-3.5 py-2 px-3.5 cursor-pointer transition-all duration-100 ease-linear"
          *ngIf="company.companyName !== personalName"
        >
          <div>
            <div
              *ngIf="company.companyLogoUrl; else nologo"
              class="w-8 h-8 rounded-full object-cover flex justify-center items-center"
            >
              <img
                class="object-cover w-full h-full rounded-full"
                [src]="company.companyLogoUrl"
                alt="Company Icon"
              />
            </div>
            <ng-template #nologo>
              <span
                class="w-9 h-9 flex bg-common-secondary-blue-color p-2 box-border rounded-full justify-center"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 384 512"
                  width="28"
                >
                  <path
                    d="M336 0C362.5 0 384 21.49 384 48V464C384 490.5 362.5 512 336 512H240V432C240 405.5 218.5 384 192 384C165.5 384 144 405.5 144 432V512H48C21.49 512 0 490.5 0 464V48C0 21.49 21.49 0 48 0H336zM64 272C64 280.8 71.16 288 80 288H112C120.8 288 128 280.8 128 272V240C128 231.2 120.8 224 112 224H80C71.16 224 64 231.2 64 240V272zM176 224C167.2 224 160 231.2 160 240V272C160 280.8 167.2 288 176 288H208C216.8 288 224 280.8 224 272V240C224 231.2 216.8 224 208 224H176zM256 272C256 280.8 263.2 288 272 288H304C312.8 288 320 280.8 320 272V240C320 231.2 312.8 224 304 224H272C263.2 224 256 231.2 256 240V272zM80 96C71.16 96 64 103.2 64 112V144C64 152.8 71.16 160 80 160H112C120.8 160 128 152.8 128 144V112C128 103.2 120.8 96 112 96H80zM160 144C160 152.8 167.2 160 176 160H208C216.8 160 224 152.8 224 144V112C224 103.2 216.8 96 208 96H176C167.2 96 160 103.2 160 112V144zM272 96C263.2 96 256 103.2 256 112V144C256 152.8 263.2 160 272 160H304C312.8 160 320 152.8 320 144V112C320 103.2 312.8 96 304 96H272z"
                  />
                </svg>
              </span>
            </ng-template>
          </div>
          <button class="flex text-start">
            <p
              class="text-main-text-color capitalize text-sm w-[16ch] whitespace-nowrap overflow-hidden text-ellipsis"
            >
              {{ company.companyName }}
            </p>
          </button>
        </li>
      </ul>
    </div>
  </ng-container>
</div>
