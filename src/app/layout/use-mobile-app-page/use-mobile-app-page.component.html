<div
  class="main-container flex flex-col h-full w-full"
  appWhiteLabel
  shownIf="isShowMobileAppDownloadScreen"
>
  <div class="logo-section flex flex-col items-center justify-center">
    <img [src]="appConfig.websiteLogo" />
  </div>

  <div class="header-section flex flex-col items-center gap-3">
    <div class="label-2 w-3/4">Pay Effortlessly!</div>
    <div class="px-5">
      <div class="label-3">
        To enjoy the optimal mobile experience, we kindly recommend downloading
        our mobile app
      </div>
    </div>
  </div>
  <div class="flex flex-col flex-grow image-section items-center pt-6">
    <img
      src="../../../assets/images/use-mobileapp-screen/mobile-mini.png"
      alt="App Icon"
    />
  </div>
  <div
    class="bottom-banner-section flex flex-col items-center justify-center gap-6"
  >
    <div class="cursor-pointer tap-text mt-2">Download The App Now</div>
    <div
      class="app-stores-icon-container flex items-center justify-center px-4 py-3 rounded-2xl shadow-sm"
    >
      <div
        class="play-store cursor-pointer"
        (click)="googlePlayStoreNavigate()"
      >
        <img
          src="../../../../assets/icon/svg/download-from-store/google_play_store.svg"
          class="mr-4"
        />
      </div>
      <div class="line"></div>
      <div class="app-store cursor-pointer" (click)="appStoreNavigate()">
        <img
          src="../../../../assets/icon/svg/download-from-store/apple_app_store.svg"
          class="ml-4"
        />
      </div>
    </div>
    <div class="gap-1">
      <div class="label-4">Or</div>
      <div class="label-4">Use Desktop Version</div>
    </div>
  </div>
</div>

<div
  class="main-container flex flex-col h-full w-full items-center image-section2 justify-center"
  appWhiteLabel
  hiddenIf="isShowMobileAppDownloadScreen"
>
  <div class="flex flex-col h-2/5 items-center justify-evenly">
    <div class="flex flex-col items-center justify-center">
      <img [src]="appConfig.websiteLogo" alt="App Icon" />
    </div>
    <div class="header-section flex flex-col items-center gap-3">
      <div class="px-5">
        <div class="label-3">
          To enjoy the optimal mobile experience, we kindly recommend using a
          larger screen
        </div>
      </div>
      <div class="label-4">Or</div>
      <div class="label-3">Turn on 'Desktop Site' mode in browser settings</div>
    </div>
  </div>
</div>
