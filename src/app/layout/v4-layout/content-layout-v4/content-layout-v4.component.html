<div class="min-h-screen">
  <div class="flex h-screen relative">
    <!-- Sidebar -->
    <app-side-bar-v4></app-side-bar-v4>

    <!-- Main content section -->
    <div class="flex-1 flex flex-col overflow-hidden relative">
      <!-- Header -->
      <app-header-v4></app-header-v4>

      <!-- Content area -->
      <main
        class="main-content flex-1 flex flex-col overflow-hidden bg-v4-main-background-color"
      >
        <div class="flex-1 min-h-0 flex flex-col overflow-y-auto px-2 lg:px-4 py-4 bg-v4-main-background-color">
          <router-outlet></router-outlet>
        </div>
      </main>
    </div>
  </div>
</div>

@if (detailPanelService.row()) {
  <app-payments-out-detail-panel
    [uuid]="detailPanelService.uuid()"
    [row]="detailPanelService.row()"
    [isOpen]="detailPanelService.isOpen()"
    [backdropZIndex]="detailPanelService.backdropZIndex()"
    (closed)="detailPanelService.close()"
  />
}
