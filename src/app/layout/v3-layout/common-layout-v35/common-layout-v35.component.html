<div
  class="h-full w-full flex flex-col laptop:flex-row gap-[10px] px-[10px] laptop:overflow-hidden bg-secondary-background-color "
>
  <!-- Left Section -->
  <div
    [ngClass]="{
      'min-w-[230px]': !isNarrow,
      '!min-w-[150px] !w-[150px]': isNarrow,
      'w-full rounded bg-main-background-color laptop:w-1/4 laptop:max-w-[280px]': true,
      'flex-1 laptop:w-full laptop:max-w-none': !isGridView,
      'transition-width': true,
      'pb-8': true
    }"
  >
    @if (showToggle && isGridView) {
      <div class="text-common-blue-color text-end pr-5 pt-0.5 hide-on-small">
        <fa-icon
          class="cursor-pointer"
          (click)="toggle()"
          [matTooltip]="isNarrow ? 'Expand' : 'Collaps'"
          tooltipPossition="rigth"
          role="presentation"
          [icon]="isNarrow ? faAngleRight : faAngleLeft"
        />
      </div>
    }
    <ng-container
      *ngComponentOutlet="listComponent; inputs: listInputs()"
    ></ng-container>
    <div class="data_spinner absolute top-1/2 left-1/2" *ngIf="isLoading"></div>
  </div>

  <!-- Right Section -->
  <div *ngIf="isGridView" class="flex-1 rounded bg-main-background-color">
    <ng-container
      *ngComponentOutlet="detailsComponent; inputs: detailsInputs()"
    ></ng-container>
  </div>
</div>
