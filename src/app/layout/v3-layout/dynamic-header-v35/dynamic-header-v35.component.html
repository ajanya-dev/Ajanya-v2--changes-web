<div
  class="dynamic-header w-full flex justify-start items-center gap-[10px] px-[10px] pt-[10px] bg-secondary-background-color text-main-text-color font-inter overflow-x-auto pb-[10px]"
>
  <button
    class="overview-card"
    [ngClass]="{
      'border !border-common-blue-color shadow-common-button':
        isCreditPath && !overallDataLoading,
      skelton: overallDataLoading,
      'shadow-none': isHidden
    }"
    (click)="navigateToUrl('credit')"
  >
    <div class="hidden laptop:flex justify-end items-center">
      <fa-icon
        [icon]="faDollar"
        class="text-2xl text-common-blue-color"
      ></fa-icon>
    </div>
    <div
      class="flex-1 flex flex-col justify-between items-start pl-3 max-lg:pl-0"
    >
      <p class="font-normal text-xs">My Credits</p>
      <p class="text-base font-semibold">
        {{ mailCreditBalance | currency }}
      </p>
    </div>
    <div class="hidden laptop:flex justify-end items-center">
      <fa-icon
        [icon]="['fas', 'chevron-right']"
        class="text-common-green-color"
      ></fa-icon>
    </div>
  </button>
  <button
    class="overview-card"
    appWhiteLabel hiddenIf="isCompassRequirement"
    [ngClass]="{
      'border !border-common-blue-color shadow-common-button':
        isWalletPath && !overallDataLoading,
      skelton: overallDataLoading,
      'shadow-none': isHidden
    }"
    (click)="navigateToUrl('wallet')"
  >
    <div class="hidden laptop:flex justify-end items-center">
      <fa-icon
        [icon]="['fas', 'wallet']"
        class="text-2xl text-common-violet-color"
      ></fa-icon>
    </div>
    <div
      class="flex-1 flex flex-col justify-between items-start pl-3 max-lg:pl-0"
    >
      <div class="font-normal text-xs">My Wallet</div>
      @if (overallData?.walletBalance !== null) {
        <div class="text-base font-semibold">
          {{ "$" + overallData?.walletBalance }}
        </div>
      }
    </div>
    <div class="hidden laptop:flex justify-end items-center">
      <fa-icon
        [icon]="['fas', 'chevron-right']"
        class="text-common-green-color"
      ></fa-icon>
    </div>
  </button>

  <button
    class="overview-card"
    *ngIf="overallData?.bankAccountCount"
    [ngClass]="{
      'border !border-common-blue-color shadow-common-button':
        isBankAccountPath && !overallDataLoading,
      skelton: overallDataLoading,
      'shadow-none': isHidden
    }"
    (click)="navigateToUrl('account')"
  >
    <div class="hidden laptop:flex justify-end items-center">
      <fa-icon
        [icon]="['fas', 'building-columns']"
        class="text-2xl text-common-blue-color"
      ></fa-icon>
    </div>
    <div
      class="flex-1 flex flex-col justify-between items-start pl-3 max-lg:pl-0"
    >
      <div class="font-normal text-xs">Bank Accounts</div>
      <div class="text-base font-semibold">
        {{ overallData?.bankAccountCount }}
      </div>
    </div>
    <div class="hidden laptop:flex justify-end items-center">
      <fa-icon
        [icon]="['fas', 'chevron-right']"
        class="text-common-green-color"
      ></fa-icon>
    </div>
  </button>

  <button
    class="overview-card"
    (click)="navigateToUrl('add_account')"
    *ngIf="!overallData?.bankAccountCount"
    [ngClass]="{
      'border !border-common-blue-color shadow-common-button':
        isAddBankAccountPath && !overallDataLoading,
      skelton: overallDataLoading,
      'shadow-none': isHidden
    }"
  >
    <div class="hidden laptop:flex justify-end items-center">
      <fa-icon
        [icon]="['fas', 'building-columns']"
        class="text-2xl text-common-blue-color"
      ></fa-icon>
    </div>
    <div
      class="flex-1 flex flex-col justify-between items-start pl-3 max-lg:pl-0"
    >
      <div class="font-normal text-xs">Bank Accounts</div>
      <div class="text-base font-semibold hidden laptop:block">
        {{ overallData?.bankAccountCount }}
      </div>
      <div
        class="text-base text-common-blue-color font-semibold flex laptop:hidden"
      >
        <fa-icon [icon]="['fas', 'plus']" class="text-base"></fa-icon>Add
      </div>
    </div>
    <div class="hidden laptop:flex justify-end items-center">
      <fa-icon
        [icon]="['fas', 'plus']"
        class="text-2xl text-common-blue-color"
      ></fa-icon>
    </div>
  </button>

  <button
    appWhiteLabel hiddenIf="isCompassRequirement"
    class="overview-card"
    *ngIf="overallData?.cloudbankExist === 1"
    (click)="navigateToUrl('cloud')"
    [ngClass]="{
      'border !border-common-blue-color shadow-common-button':
        isCloudPath && !overallDataLoading,
      skelton: overallDataLoading,
      'shadow-none': isHidden
    }"
  >
    <div class="hidden laptop:flex justify-end items-center">
      <fa-icon
        [icon]="['fas', 'building-columns']"
        class="text-2xl text-common-green-color"
      ></fa-icon>
    </div>
    <div
      class="flex-1 flex flex-col justify-between items-start pl-3 max-lg:pl-0"
    >
      <div class="font-normal text-xs">Cloud Bank</div>
      @if (overallData?.cloudbankBalance !== null) {
        <div class="text-base font-semibold">
          {{ "$" + overallData?.cloudbankBalance }}
        </div>
      }
    </div>
    <div class="hidden laptop:flex justify-end items-center">
      <fa-icon
        [icon]="['fas', 'chevron-right']"
        class="text-common-green-color"
      ></fa-icon>
    </div>
  </button>

  <button
    appWhiteLabel hiddenIf="isCompassRequirement"
    class="overview-card"
    (click)="navigateToUrl('cloud')"
    *ngIf="!overallData?.cloudbankExist"
    appWhiteLabel
    shownIf="isZilBankAdShown"
    [ngClass]="{
      'border !border-common-blue-color shadow-common-button':
        isCloudPath && !overallDataLoading,
      skelton: overallDataLoading,
      'shadow-none': isHidden
    }"
  >
    <div class="hidden laptop:flex justify-end items-center">
      <fa-icon
        [icon]="['fas', 'building-columns']"
        class="text-2xl text-common-green-color"
      ></fa-icon>
    </div>
    <div
      class="flex-1 flex flex-col justify-between items-start pl-3 max-lg:pl-0"
    >
      <div class="font-normal text-xs">Cloud Bank</div>
      @if (overallData?.cloudbankBalance !== null) {
        <div class="text-base font-semibold">
          {{ "$" + overallData?.cloudbankBalance }}
        </div>
      }
    </div>
    <div class="flex justify-end items-center">
      <fa-icon
        [icon]="['fas', 'plus']"
        class="text-2xl text-common-blue-color"
      ></fa-icon>
    </div>
  </button>

  <button
    class="overview-card"
    *ngIf="overallData?.creditCardCount"
    appWhiteLabel
    hiddenIf="isAddCreditCardRestricted"
    (click)="navigateToUrl('credit_card')"
    [ngClass]="{
      'border !border-common-blue-color shadow-common-button':
        isCreditCardPath && !overallDataLoading,
      skelton: overallDataLoading,
      'shadow-none': isHidden
    }"
  >
    <div class="hidden laptop:flex justify-end items-center">
      <fa-icon
        [icon]="['fas', 'credit-card-front']"
        class="text-2xl text-common-yellow-color"
      ></fa-icon>
    </div>
    <div
      class="flex-1 flex flex-col justify-between items-start pl-3 max-lg:pl-0"
    >
      <div class="font-normal text-xs">My Cards</div>
      <div class="text-base font-semibold">
        {{ overallData?.creditCardCount }}
      </div>
    </div>
    <div class="hidden laptop:flex justify-end items-center">
      <fa-icon
        [icon]="['fas', 'chevron-right']"
        class="text-common-green-color"
      ></fa-icon>
    </div>
  </button>

  <button
    class="overview-card"
    *ngIf="!overallData?.creditCardCount"
    appWhiteLabel
    hiddenIf="isAddCreditCardRestricted"
    (click)="navigateToUrl('credit_card')"
    [ngClass]="{
      'border !border-common-blue-color shadow-common-button':
        isCreditCardPath && !overallDataLoading,
      skelton: overallDataLoading,
      'shadow-none': isHidden
    }"
  >
    <div class="hidden laptop:flex justify-end items-center">
      <fa-icon
        [icon]="['fas', 'credit-card-front']"
        class="text-2xl text-common-yellow-color"
      ></fa-icon>
    </div>
    <div
      class="flex-1 flex flex-col justify-between items-start pl-3 max-lg:pl-0"
    >
      <div class="font-normal text-xs">My Cards</div>
      <div class="text-base font-semibold hidden laptop:block">
        {{ overallData?.creditCardCount }}
      </div>
      <div
        class="text-base text-common-blue-color font-semibold flex laptop:hidden"
      >
        <fa-icon [icon]="['fas', 'plus']" class="text-base"></fa-icon>Add
      </div>
    </div>
    <div class="hidden laptop:flex justify-end items-center">
      <fa-icon
        [icon]="['fas', 'plus']"
        class="text-2xl text-common-blue-color"
      ></fa-icon>
    </div>
  </button>
</div>
