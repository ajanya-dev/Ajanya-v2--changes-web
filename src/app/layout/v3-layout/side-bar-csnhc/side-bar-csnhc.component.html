<section class="h-full">
  <!-- Desktop Sidebar -->
  <div
    class="csnhc-sidebar-container z-999 h-full hidden lg:block"
    [ngClass]="{
      'sidebar-open': sideBarAction === 'open',
      'sidebar-close': sideBarAction === 'close',
      'w-[65px]': sideBarCollapsed,
      'w-[200px]': !sideBarCollapsed
    }"
  >
    <div class="csnhc-sidebar w-full h-full flex flex-col relative">
      <!-- Logo -->
      <div
        class="csnhc-logo-section pt-4 pb-4 mx-auto relative transition-all duration-300 ease-in-out w-full px-3"
      >
        <a
          class="flex items-center justify-center w-full h-14"
          routerLink="/manage/home"
        >
          <img
            alt="CSNHC"
            title="CSNHC"
            class="mx-auto max-h-10 transition-opacity duration-200"
            [ngClass]="sideBarCollapsed ? 'hidden' : 'w-4/5'"
            [src]="'assets/white_label/csnhc/assets/app_logo_white.svg'"
            loading="lazy"
          />
          <fa-icon
            [icon]="['fas', 'bars']"
            [class.hidden]="!sideBarCollapsed"
            class="csnhc-hamburger text-2xl pb-2 cursor-pointer mx-auto transition-colors duration-200"
            (click)="collapseSideBar()"
            role="presentation"
          ></fa-icon>
        </a>
      </div>

      <!-- Toggle Button -->
      <button
        class="toggle-area cursor-pointer absolute right-[-12px] top-16 w-6 h-6 flex justify-center items-center rounded-full z-[99999] transition-all duration-300"
        (click)="collapseSideBar()"
        [class.rotate-180]="!sideBarCollapsed"
      >
        <img
          class="text-xs w-3 h-3"
          src="/assets/icon/svg/right-arrow.svg"
          alt="toggle"
        />
      </button>

      <!-- Menu Items -->
      <div class="main-items flex flex-col justify-between h-full pt-4">
        <div class="flex flex-col gap-0.5 px-2">
          <!-- Expanded Sidebar -->
          @if (!sideBarCollapsed) {
            <div class="menu-section transition-all duration-300 ease-in-out">
              @for (item of menuItems; track item.id) {
                <button
                  class="csnhc-menu-item w-full flex items-center gap-3 text-[13px] py-2.5 px-3 cursor-pointer"
                  [ngClass]="{ active: selectedItem === item.id }"
                  (click)="navigate(item)"
                  [ngClass]="{ 'csnhc-skeleton ': headerService.isHeaderDataLoaded() }"
                >
                  <span class="csnhc-menu-icon w-[18px] flex justify-center" [ngClass]="{ 'hidden ': headerService.isHeaderDataLoaded() }">
                    @if (item.image) {
                      <svg
                        width="10"
                        height="13"
                        viewBox="0 0 10 13"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          d="M9.31339 0H9.32183V8.73799C9.30083 8.82312 9.30489 8.95826 9.2934 9.04992C9.27107 9.22854 9.24441 9.40196 9.20501 9.57779C8.96666 10.68 8.29935 11.6419 7.35054 12.251C6.74091 12.6396 6.04959 12.8816 5.33077 12.9583C5.20934 12.9714 5.09041 12.9806 4.96863 12.988C4.89886 12.9923 4.75652 12.9888 4.69449 13H4.64125C4.59293 12.9898 4.41752 12.9904 4.35683 12.9867C4.22473 12.9787 4.09808 12.9695 3.96617 12.9535C3.19788 12.8653 2.46346 12.5879 1.82868 12.1461C0.924924 11.507 0.302496 10.5438 0.0910633 9.45712C0.0586086 9.29576 0.0375867 9.13618 0.0197615 8.97292C0.0103268 8.88653 0.015821 8.77646 0 8.694V8.31835C0.00702247 8.28991 0.0111203 8.16689 0.0135419 8.13154C0.0204819 8.03683 0.0301928 7.94231 0.0426619 7.84812C0.101546 7.4053 0.227486 6.97404 0.416152 6.56919C0.910627 5.51736 1.80347 4.70581 2.89738 4.31389C4.10016 3.8729 5.62587 3.91965 6.78939 4.45934C6.784 4.03972 6.78882 3.60921 6.78882 3.18887L6.78901 0.834171C6.99239 0.758989 7.23981 0.684614 7.4489 0.615697L8.73746 0.191272C8.91736 0.132077 9.13844 0.0655535 9.31339 0ZM4.83431 10.7728C4.92881 10.7717 5.03802 10.7516 5.13022 10.7317C5.50697 10.6501 5.81028 10.4694 6.07871 10.1944C6.54172 9.72004 6.72175 9.14539 6.71641 8.49202C6.71102 7.83021 6.52833 7.25937 6.05088 6.78761C5.64817 6.3898 5.17092 6.21715 4.60869 6.23301C4.57691 6.23391 4.53593 6.23353 4.50462 6.23693C3.15982 6.3449 2.52569 7.53835 2.63079 8.77862C2.72985 9.94773 3.59753 10.8774 4.80691 10.7758C4.81606 10.775 4.82519 10.7739 4.83431 10.7728Z"
                          fill="currentColor"
                        />
                      </svg>
                    } @else {
                      <fa-icon
                        [icon]="['fas', item.icon]"
                        role="presentation"
                      ></fa-icon>
                    }
                  </span>
                  <span class="whitespace-nowrap font-medium" [ngClass]="{ 'hidden ': headerService.isHeaderDataLoaded() }">{{
                    item.title
                  }}</span>
                </button>
              }
            </div>
          }

          <!-- Collapsed Sidebar (icons only) -->
          @if (sideBarCollapsed) {
            <div
              class="transition-all duration-300 ease-in-out flex flex-col items-center gap-1"
            >
              @for (item of menuItems; track item.id) {
                <div
                  role="presentation"
                  matTooltipPosition="right"
                  [matTooltip]="item.tooltip"
                  (click)="navigate(item)"
                  [ngClass]="{ 'csnhc-skeleton ': headerService.isHeaderDataLoaded() }"
                >
                  <button
                    class="csnhc-icon-btn flex justify-center items-center p-2.5 cursor-pointer"
                    [ngClass]="{ active: selectedItem === item.id }"
                  >
                    <span class="csnhc-menu-icon w-[18px] flex justify-center" [ngClass]="{ 'hidden ': headerService.isHeaderDataLoaded() }">
                      @if (item.image) {
                        <svg
                          width="10"
                          height="13"
                          viewBox="0 0 10 13"
                          fill="none"
                          xmlns="http://www.w3.org/2000/svg"
                        >
                          <path
                            d="M9.31339 0H9.32183V8.73799C9.30083 8.82312 9.30489 8.95826 9.2934 9.04992C9.27107 9.22854 9.24441 9.40196 9.20501 9.57779C8.96666 10.68 8.29935 11.6419 7.35054 12.251C6.74091 12.6396 6.04959 12.8816 5.33077 12.9583C5.20934 12.9714 5.09041 12.9806 4.96863 12.988C4.89886 12.9923 4.75652 12.9888 4.69449 13H4.64125C4.59293 12.9898 4.41752 12.9904 4.35683 12.9867C4.22473 12.9787 4.09808 12.9695 3.96617 12.9535C3.19788 12.8653 2.46346 12.5879 1.82868 12.1461C0.924924 11.507 0.302496 10.5438 0.0910633 9.45712C0.0586086 9.29576 0.0375867 9.13618 0.0197615 8.97292C0.0103268 8.88653 0.015821 8.77646 0 8.694V8.31835C0.00702247 8.28991 0.0111203 8.16689 0.0135419 8.13154C0.0204819 8.03683 0.0301928 7.94231 0.0426619 7.84812C0.101546 7.4053 0.227486 6.97404 0.416152 6.56919C0.910627 5.51736 1.80347 4.70581 2.89738 4.31389C4.10016 3.8729 5.62587 3.91965 6.78939 4.45934C6.784 4.03972 6.78882 3.60921 6.78882 3.18887L6.78901 0.834171C6.99239 0.758989 7.23981 0.684614 7.4489 0.615697L8.73746 0.191272C8.91736 0.132077 9.13844 0.0655535 9.31339 0ZM4.83431 10.7728C4.92881 10.7717 5.03802 10.7516 5.13022 10.7317C5.50697 10.6501 5.81028 10.4694 6.07871 10.1944C6.54172 9.72004 6.72175 9.14539 6.71641 8.49202C6.71102 7.83021 6.52833 7.25937 6.05088 6.78761C5.64817 6.3898 5.17092 6.21715 4.60869 6.23301C4.57691 6.23391 4.53593 6.23353 4.50462 6.23693C3.15982 6.3449 2.52569 7.53835 2.63079 8.77862C2.72985 9.94773 3.59753 10.8774 4.80691 10.7758C4.81606 10.775 4.82519 10.7739 4.83431 10.7728Z"
                            fill="currentColor"
                          />
                        </svg>
                      } @else {
                        <fa-icon
                          [icon]="['fas', item.icon]"
                          role="presentation"
                        ></fa-icon>
                      }
                    </span>
                  </button>
                </div>
              }
            </div>
          }
        </div>

        <!-- Bottom Section: Logout -->
        <div class="csnhc-bottom-divider mx-3 pt-3 pb-4 px-2">
          @if (!sideBarCollapsed) {
            <button
              class="csnhc-logout-item w-full flex items-center gap-3 text-[13px] py-2.5 px-3 cursor-pointer"
              (click)="onLogout()"
            >
              <span class="csnhc-logout-icon w-[18px] flex justify-center">
                <fa-icon
                  [icon]="['fas', 'right-from-bracket']"
                  role="presentation"
                ></fa-icon>
              </span>
              <span class="whitespace-nowrap font-medium">Logout</span>
            </button>
          }
          @if (sideBarCollapsed) {
            <div class="flex justify-center">
              <div
                role="presentation"
                matTooltipPosition="right"
                matTooltip="Logout"
                (click)="onLogout()"
              >
                <button
                  class="csnhc-icon-btn flex justify-center items-center p-2.5 cursor-pointer"
                >
                  <span class="csnhc-logout-icon w-[18px] flex justify-center">
                    <fa-icon
                      [icon]="['fas', 'right-from-bracket']"
                      role="presentation"
                    ></fa-icon>
                  </span>
                </button>
              </div>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Mobile Sidebar Drawer -->
<section
  class="mob-csnhc-sidebar-wrapper"
  [ngClass]="toggleMobileMenu ? 'showMobileMenu' : 'hideMobileMenu'"
>
  <div class="mob-sidebar-container px-4 py-5 h-full flex flex-col relative">
    <!-- Top: Logo + Close -->
    <div class="top-section flex justify-between items-center pb-8 px-2">
      <div></div>
      <div>
        <a routerLink="/manage/home" (click)="hideMobileMenus()">
          <img
            alt="CSNHC"
            class="w-28 max-h-10"
            [src]="
              appConfig?.whiteLogo ||
              'assets/white_label/csnhc/assets/app_logo_white.svg'
            "
            loading="lazy"
          />
        </a>
      </div>
      <button
        class="mob-close-btn cursor-pointer flex items-center justify-center w-9 h-9 rounded-full"
        (click)="hideMobileMenus()"
      >
        <fa-icon
          [icon]="['fas', 'xmark']"
          class="text-xl"
          role="presentation"
        ></fa-icon>
      </button>
    </div>

    <!-- Menu Items -->
    <div class="mob-sidebar-items flex-1 overflow-auto pb-4">
      <ul class="list-none p-0 m-0 flex flex-col gap-1">
        @for (item of menuItems; track item.id) {
          <li>
            <button
              class="mob-menu-item w-full flex items-center gap-4 py-3 px-4 rounded-xl"
              [ngClass]="{ 'mob-active': selectedItem === item.id }"
              (click)="navigate(item)"
              [ngClass]="{ 'csnhc-skeleton ': headerService.isHeaderDataLoaded() }"
            >
              <span
                class="mob-icon-wrapper flex items-center justify-center w-10 h-10 rounded-full"
              >
                <fa-icon
                  [ngClass]="{ 'hidden ': headerService.isHeaderDataLoaded() }"
                  [icon]="['fas', item.icon]"
                  class="mob-menu-icon text-base"
                ></fa-icon>
              </span>
              <span class="text-sm font-semibold" [ngClass]="{ 'hidden ': headerService.isHeaderDataLoaded() }">{{ item.title }}</span>
            </button>
          </li>
        }

        <!-- Logout -->
        <li class="mt-6 pt-4 mob-divider border-t">
          <button
            class="mob-logout-item w-full flex items-center gap-4 py-3 px-4 rounded-xl"
            (click)="onLogout()"
          >
            <span
              class="mob-logout-icon-wrapper flex items-center justify-center w-10 h-10 rounded-full"
            >
              <fa-icon
                [icon]="['fas', 'right-from-bracket']"
                class="text-base"
                style="color: #f87171"
              ></fa-icon>
            </span>
            <span class="text-sm font-semibold">Logout</span>
          </button>
        </li>
      </ul>
    </div>
  </div>
</section>
