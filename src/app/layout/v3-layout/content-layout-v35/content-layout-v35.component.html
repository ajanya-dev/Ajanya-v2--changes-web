<div
  class="v3-main-wrapper flex w-screen h-screen overflow-hidden fixed top-0 left-0"
>
  <div class="left-section-wrapper relative">
    <div class="v3-side-bar-wrapper w-full h-full">
      @if (isCsnhc) {
        <app-side-bar-csnhc></app-side-bar-csnhc>
      } @else {
        <app-side-bar-v35></app-side-bar-v35>
      }
    </div>
  </div>

  <div class="right-section-wrapper flex flex-col relative flex-1">
    <div
      class="v3-header-wrapper w-full sticky top-0 bg-secondary-background-color h-[128px] z-[1000] duration-300 ease-in-out"
      [ngClass]="{ '!h-[66px] duration-300 ease-in-out': isHidden }"
    >
      <app-header-v35></app-header-v35>
    </div>
    <div
      class="v3-body-wrapper w-full overflow-auto h-full p-0 !bg-secondary-background-color"
    >
      <!--
  ====================================
  TEMPORARILY DISABLED:
  <app-v3-todo-button></app-v3-todo-button>
  TODO: Re-enable this section in future
  ====================================
 -->
      <app-chat-box></app-chat-box>
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
<app-nps></app-nps>
<app-loom></app-loom>
