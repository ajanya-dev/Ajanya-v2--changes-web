<div
  class="text-common-dark-blue-color cursor-pointer font-semibold"
  [ngClass]="{'!text-white': isFromPlanPage()}"
  #helpMenu="matMenuTrigger"
  mat-icon-button
  [matMenuTriggerFor]="supportDropdownMenu"
>
  <fa-icon [icon]="faHelpIcon" matTooltip="Help & Support"></fa-icon>
</div>
<mat-menu #supportDropdownMenu="matMenu" class="absolute top-[5px] ocw-meterial-menu">
  <div>
    @for (item of supportDropdown; track item.id) {
      <li
        class="flex gap-2 items-center py-2.5 px-3.5 cursor-pointer transition duration-200 ease-linear hover:bg-common-secondary-blue-color"
        role="presentation"
        (click)="onSupportMenuClick(item)"
      >
        @if (item.faIcon) {
          <fa-icon
            [icon]="item.faIcon"
            class="text-common-dark-blue-color"
          ></fa-icon>
        }
        <p
          class="text-common-dark-blue-color font-roboto font-normal text-sm leading-normal tracking-tight"
        >
          {{ item.title }}
        </p>
      </li>
    }
  </div>
</mat-menu>
