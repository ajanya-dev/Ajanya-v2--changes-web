<div class="h-full overflow-hidden main-div">
  <div class="h-[56%] v3-border-b">
    <div class="ocw_modal_header">
      <div class="ocw_modal_title">To-Dos</div>
      <button class="close_btn" (click)="close()" [disabled]="loading">
        <img
          src="./../../../../assets/icon/close-icon.svg"
          type="image/svg+xml"
          alt="Close Icon"
        />
      </button>
    </div>
    <div class="h-[80%]">
      <div class="ocw_modal_body h-full overflow-auto">
        <span *ngIf="todoData?.length < 1 && loading">Loading ...</span>
        <span *ngIf="todoData?.length < 1 && !loading"
          >No ToDo Notes added</span
        >
        <div class="text-sm">
          <div
            class="w-full flex flex-row mb-4"
            *ngFor="let todo of todoData; let i = index"
          >
            <div class="justify-center items-center">
              <mat-checkbox
                [checked]="todo.todo_status === 'done'"
                (click)="onTodoStatusChange($event, todo, i)"
                [disabled]="todo?.todo_status === 'due' || loading"
              >
              </mat-checkbox>
            </div>
            <div class="w-full flex flex-col">
              <div
                [ngClass]="{
                  'line-through':
                    todo.todo_status === 'done' || todo.todo_status === 'due'
                }"
              >
                <span class="w-full break-words">{{ todo.todo_details }}</span>
              </div>
              <div class="w-full flex gap-[5px]">
                <span
                  class="font-semibold"
                  [ngClass]="
                    todo.todo_status === 'done'
                      ? 'done'
                      : todo.todo_status === 'due'
                        ? 'due'
                        : ''
                  "
                  >{{
                    todo.todo_status === "active"
                      ? "Due"
                      : todo.todo_status === "due"
                        ? "Overdue"
                        : "Done"
                  }}</span
                >
                <span>
                  on
                  {{
                    todo.todo_status === "done"
                      ? todo.formated_updated_date.slice(0, 10)
                      : todo.formated_date.slice(0, 10)
                  }}</span
                >
              </div>
            </div>
            <div class="flex justify-end">
              <button class="p-3" [matMenuTriggerFor]="menu">
                <i
                  class="fa-solid fa-ellipsis-vertical option-icon text-sm"
                ></i>
              </button>
              <mat-menu #menu="matMenu">
                <button
                  class="menu-item"
                  mat-menu-item
                  (click)="onTodoMenuClick(btn.id, i, todo.encrypted_id)"
                  [disabled]="
                    todo.todo_status === 'due' && btn.id === 'edit_todo'
                  "
                  *ngFor="let btn of settings"
                >
                  <i class="menu-item {{ btn.icon }}"></i>
                  <span class="ml-2 menu-item">{{ btn.name }}</span>
                </button>
              </mat-menu>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="ocw_modal_footer flex flex-col gap-3 mt-6">
    <div class="w-full gap-4 flex flex-row">
      <div
        class="single_input date-sec no_modal_btn w-1/2 rounded"
        [ngClass]="{ edit: editMode }"
      >
        <input
          class="input_style"
          [(ngModel)]="date"
          [ngModelOptions]="{ standalone: true }"
          matInput
          [min]="date"
          type="date"
          placeholder="due date"
        />
        <label class="floating_label_field">Due Date</label>
      </div>
      <div
        class="single_input date-sec no_modal_btn w-1/2 rounded"
        [ngClass]="{ edit: editMode }"
      >
        <input
          class="input_style"
          matInput
          type="time"
          placeholder="due time"
          [(ngModel)]="time"
          [ngModelOptions]="{ standalone: true }"
        />
        <label class="floating_label_field">Due Time</label>
      </div>
    </div>
    <div class="w-full rounded flex flex-col" [formGroup]="todoForm">
      <textarea
        name=""
        class="p-2.5 w-full text-sm rounded border border-input-border-color"
        formControlName="details"
        rows="4"
        maxlength="250"
        placeholder="Enter details here"
        [ngClass]="{ edit: editMode }"
      ></textarea>
      <span class="w-full text-xs">(Maximum 250 characters.)</span>
      <app-control-message
        [control]="todoForm.controls.details"
      ></app-control-message>
    </div>
    <div class="w-full flex justify-end items-end">
      <button
        class="ocw-btn ocw-btn-modal-bordered h-9 mr-3"
        *ngIf="editMode"
        (click)="clearFields()"
      >
        Discard
      </button>
      <button
        class="ocw-btn ocw-btn-modal-blue h-9 p-1"
        type="submit"
        (click)="submit()"
        [disabled]="loading"
      >
        <i
          class="{{
            editMode ? 'fa-thin fa-pen-to-square' : 'fa-sharp fa-light fa-plus'
          }}"
        ></i>
        {{ editMode ? "Update" : "Add" }}
      </button>
    </div>
  </div>
</div>
