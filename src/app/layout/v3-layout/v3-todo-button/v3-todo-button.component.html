<div
  class="bottom-28 right-0 fixed z-10 py-1 pl-1"
  cdkDragBoundary=".v3-body-wrapper"
  cdkDragLockAxis="y"
  cdkDrag
>
  <button
    class="shadow h-52 rounded-tl-2xl rounded-bl-2xl bg-blue-800 px-2 py-1 todo-btn text-sm font-semibold"
    (click)="openTodoComponent()"
    [disabled]="loading"
  >
    <i class="fa-solid fa-xmark text-white pr-5" *ngIf="todoOpened"></i>
    <span *ngIf="!todoOpened">To-Dos</span>
    <span
      class="rounded-full ml-2 count px-1"
      *ngIf="activeTodo && activeTodo.length > 0"
      >{{ activeTodo.length }}</span
    >
  </button>
</div>
