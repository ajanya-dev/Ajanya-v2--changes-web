<div class="whats-new-wrappper skelton">
  <!-- Close Button -->
  <div class="close_btn" [mat-dialog-close]="false">
    <svg
      aria-hidden="true"
      focusable="false"
      data-prefix="fal"
      data-icon="times"
      class="svg-inline--fa fa-times fa-w-10"
      role="img"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 320 512"
    >
      <path
        fill="currentColor"
        d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
      ></path>
    </svg>
  </div>

  <div class="cols-whats bg-white-100">
    <div class="ocw-btn w-new">Whats New</div>
    <div class="slider_wrapper" id="slider_wrapper">
      <ng-container *ngIf="currentItem as item">
        <div class="single_slide">
          <div class="group">
            <h3 class="ocw-btn feauture">{{ item.title }}</h3>
            <div class="ml-8 mt-2.5 font-bold">
              <span
                class="published-date"
                *ngIf="currentdate >= item.published_at"
                >Published on {{ item.published_at | date: "MM-dd-yyyy" }}</span
              >
              <span
                *ngIf="currentdate < item.published_at"
                class="publishing-date"
                >Will be Published on {{ item.published_at }}</span
              >
            </div>
            <div class="content_para">
              <p class="content">
                {{ item.summary }}
              </p>
            </div>
          </div>
        </div>
        <div class="slider-length-1">
          <button (click)="openWindow(item.url)" class="ocw-btn try-now">
            Try Now
          </button>
        </div>
      </ng-container>
      <div
        *ngIf="whatsnewslider?.length > 1"
        class="arrow slider_left_arrow"
        (click)="slidePrev()"
      >
        <span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512">
            <path
              d="M137.4 406.6l-128-127.1C3.125 272.4 0 264.2 0 255.1s3.125-16.38 9.375-22.63l128-127.1c9.156-9.156 22.91-11.9 34.88-6.943S192 115.1 192 128v255.1c0 12.94-7.781 24.62-19.75 29.58S146.5 415.8 137.4 406.6z"
            />
          </svg>
        </span>
      </div>
      <div
        *ngIf="whatsnewslider?.length > 1"
        class="arrow slider_right_arrow"
        (click)="slideNext()"
      >
        <span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 512">
            <path
              d="M118.6 105.4l128 127.1C252.9 239.6 256 247.8 256 255.1s-3.125 16.38-9.375 22.63l-128 127.1c-9.156 9.156-22.91 11.9-34.88 6.943S64 396.9 64 383.1V128c0-12.94 7.781-24.62 19.75-29.58S109.5 96.23 118.6 105.4z"
            />
          </svg>
        </span>
      </div>
    </div>
  </div>
  <div class="col-span-whats bg-white-600">
    <!-- whats-new inside image -->
    <div>
      <img
        class="whats-new"
        src="'../../../../../../assets/icon/app_characters/chrctr_with_new_label.svg"
        alt="whats-new-chrctr"
      />
    </div>
  </div>
</div>
