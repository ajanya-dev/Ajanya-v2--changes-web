@if ((isShowUseMobileApp$ | async) === false) {
  <router-outlet></router-outlet>
  <app-custom-double-side-modal-overlay />
  <div
    [ngClass]="{
      'fixed inset-0 flex items-center justify-center bg-[#000000] bg-opacity-50 z-[9999] ':
        gotThreeDSChallenge(),
      'h-0 overflow-hidden': !gotThreeDSChallenge()
    }"
  >
    <div
      [ngClass]="{ 'bg-[#ffffff]': gotThreeDSChallenge() }"
      class="flex p-5 rounded-lg h-[440px] w-[430px]"
    >
      <div id="threeDSMountPoint"></div>
    </div>
  </div>
}
@if (isShowUseMobileApp$ | async) {
  @if (isItWhiteLabel) {
    <app-use-mobile-app-page></app-use-mobile-app-page>
  } @else {
    <div>
      <div class="loader"></div>
    </div>
  }
}
@if (initiateIntroComponent) {
  <app-intro-box></app-intro-box>
}
