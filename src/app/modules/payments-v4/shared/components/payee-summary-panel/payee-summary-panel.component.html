@if (summary()) {
  <div class="flex flex-col">
    <!-- Header -->
    <div
      class="bg-v4-primary-brand-color text-white px-4 py-3 flex gap-3 items-center m-[1px] rounded-t-[12px]"
    >
      <div
        class="flex shrink-0 justify-center items-center rounded-full w-9 h-9 bg-white/20"
      >
        <i-lucide
          [img]="chartIcon"
          [size]="18"
          class="text-v4-secondary-brand-color"
        ></i-lucide>
      </div>
      <div class="flex flex-col">
        <span
          class="font-semibold text-sm text-white font-funnel leading-tight"
        >
          Payee Summary
        </span>
        @if (payee()?.name) {
          <span
            class="text-[0.6875rem] text-white/70 font-normal leading-tight font-peridot"
          >
            {{ payee()!.name }}
          </span>
        }
      </div>
    </div>

    <!-- Summary Rows -->
    <div class="px-4 py-2 bg-v4-badge-sky-bg-color">
      <div
        class="flex justify-between items-center py-2.5 border-b border-v4-border-color"
      >
        <span class="text-xs text-v4-tertiary-text-color font-peridot"
          >Paid this month</span
        >
        <span
          class="text-xs font-semibold text-v4-tertiary-text-color font-peridot"
        >
          ${{ summary()!.total_paid_in_month ?? "0.00" }}
        </span>
      </div>
      <div
        class="flex justify-between items-center py-2.5 border-b border-v4-border-color"
      >
        <span class="text-xs text-v4-tertiary-text-color font-peridot"
          >Paid this year</span
        >
        <span
          class="text-xs font-semibold text-v4-tertiary-text-color font-peridot"
        >
          ${{ summary()!.total_paid_in_year ?? "0.00" }}
        </span>
      </div>
      <div class="flex justify-between items-center py-2.5">
        <span class="text-xs text-v4-tertiary-text-color font-peridot"
          >Total paid (all time)</span
        >
        <span
          class="text-xs font-semibold text-v4-tertiary-text-color font-peridot"
        >
          ${{ summary()!.total_paid ?? "0.00" }}
        </span>
      </div>
    </div>
  </div>
}
