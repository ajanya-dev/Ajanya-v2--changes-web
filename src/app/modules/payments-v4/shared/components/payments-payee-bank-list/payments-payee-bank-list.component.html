<!-- The dropdown is the whole control: it shows the selection too. -->
<!-- "Add New Bank Account" opens the add-bank form in a modal (see addNewBankAccount()). -->
<app-v4-common-dropdown
  [config]="bankDropdownConfig()"
  [listData]="banksForDropdown()"
  [loading]="loading()"
  [ngModel]="selectedBankId()"
  [appendTo]="'body'"
  (ngModelChange)="onDropdownChange($event)"
  (buttonClick)="addNewBankAccount()"
/>

<!-- Wire payment whose selected bank has no beneficiary details saved against it. -->
@if (showWireDetailsPrompt()) {
  <button
    type="button"
    class="mt-2 inline-flex items-center gap-1.5 rounded-lg border border-v4-common-yellow-color bg-v4-badge-warning-bg-color px-3 py-1.5 text-xs font-medium text-v4-badge-warning-text-color transition-opacity hover:opacity-90"
    (click)="openWireDetails()"
  >
    <i-lucide [img]="TriangleAlertIcon" [size]="14" class="shrink-0"></i-lucide>
    Add Wire Details
  </button>
}
