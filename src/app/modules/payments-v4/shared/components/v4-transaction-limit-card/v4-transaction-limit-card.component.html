@if (transactionLimitMessage()) {
  <div class="mt-2 rounded-xl border border-v4-insight-card-border-blue bg-v4-insight-card-background-blue px-3 py-3">
    <div class="flex items-center gap-3">
      <p
        class="min-w-0 flex-1 whitespace-normal break-words text-xs leading-snug text-v4-main-text-color"
        [innerHTML]="transactionLimitMessage()"
      ></p>
      <app-common-button-v4
        class="shrink-0"
        [type]="{ style: 'outline', name: 'main' }"
        text="Edit amount"
        lucideIcon="pencil"
        [lucideIconSize]="12"
        customHeight="32px"
        (clickEvent)="editAmount()"
      />
    </div>
  </div>
}

@if (showEditAmount()) {
  <div class="mt-2 flex flex-col gap-3 rounded-xl border border-v4-insight-card-border-blue bg-v4-insight-card-background-blue p-4">
    <div class="flex flex-col gap-3 sm:flex-row">
      <div class="flex min-w-0 flex-1 flex-col gap-2">
        <p class="text-xs font-medium text-v4-main-text-color">Send Amount</p>
        <div class="relative">
          <input
            type="text"
            class="v4-input-style h-[46px] w-full rounded-lg px-3 text-base font-medium text-v4-main-text-color transition-colors disabled:cursor-not-allowed disabled:opacity-50"
            placeholder="0.00"
            maxlength="15"
            mask="separator.2"
            thousandSeparator=","
            name="editSendAmount"
            [ngModel]="editSendAmount"
            (ngModelChange)="onEditSendAmountChange($event)"
            (blur)="formatSendAmountOnBlur()"
            [ngModelOptions]="{ standalone: true }"
            (keypress)="utils.numberOnly($event, 'decimal')"
            [disabled]="isCalculatingSend()"
          />
          <span
            class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-v4-tertiary-text-color"
            >USD</span
          >
        </div>
      </div>
      <div class="flex min-w-0 flex-1 flex-col gap-2">
        <p class="text-xs font-medium text-v4-main-text-color">Receiving Amount</p>
        <div class="relative">
          <input
            type="text"
            class="v4-input-style h-[46px] w-full rounded-lg px-3 text-base font-medium text-v4-main-text-color transition-colors disabled:cursor-not-allowed disabled:opacity-50"
            placeholder="0.00"
            maxlength="15"
            mask="separator.2"
            thousandSeparator=","
            name="editReceivingAmount"
            [ngModel]="editReceivingAmount"
            (ngModelChange)="onEditReceivingAmountChange($event)"
            [ngModelOptions]="{ standalone: true }"
            (keypress)="utils.numberOnly($event, 'decimal')"
            [disabled]="isCalculatingReceived()"
          />
          <span
            class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-v4-tertiary-text-color"
            >{{ receivingCurrency() }}</span
          >
        </div>
      </div>
    </div>
    @if (sendAmountError()) {
      <!-- Limit error shown full-width below both fields, not tied to the Send column. -->
      <small class="block w-full whitespace-normal break-words text-xs text-v4-common-red-color">
        {{ sendAmountError() }}
      </small>
    }
    <div class="mt-1 flex justify-end gap-2">
      <app-common-button-v4
        [type]="{ style: 'outline', name: 'main' }"
        text="Cancel"
        customHeight="38px"
        [disabled]="isUpdatingAmount()"
        (clickEvent)="cancelEditAmount()"
      />
      <app-common-button-v4
        [type]="{ style: 'primary', name: 'main' }"
        text="Update Amount"
        customHeight="38px"
        [loading]="isUpdatingAmount()"
        [disabled]="isUpdatingAmount() || isCalculatingReceived() || isCalculatingSend()"
        (clickEvent)="updateAmount()"
      />
    </div>
  </div>
}
