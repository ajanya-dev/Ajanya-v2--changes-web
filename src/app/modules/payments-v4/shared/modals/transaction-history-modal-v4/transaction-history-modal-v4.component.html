<div class="flex flex-col bg-v4-popup-background-color rounded-xl overflow-hidden">
  <!-- Header -->
  <div
    class="flex items-center justify-between px-5 py-2 border-b border-v4-border-color bg-v4-popup-header-footer-color"
  >
    <h2 class="text-base font-semibold text-v4-main-text-color font-funnel">
      Payee Summary
    </h2>
    <button
      type="button"
      class="text-v4-tertiary-text-color hover:text-v4-main-text-color transition-colors"
      [mat-dialog-close]="false"
    >
      <i-lucide [img]="xIcon" [size]="20"></i-lucide>
    </button>
  </div>

  <!-- Table -->
  <div
    class="px-5 py-1 mb-3"
    style="height: min(670px, calc(100vh - 109px))"
  >
    <app-v4-data-table
      domLayout="normal"
      [columnDefs]="columnDefs"
      [tableId]="tableId"
      [defaultDisabledColumn]="['description']"
      [frameworkComponents]="frameworkComponents"
      [showActionButtonContainer]="false"
      [showFilterBar]="false"
      tableHeight="min(607px, calc(100vh - 161px))"
      [adjustHeightCondition]="true"
      [suppressRowClickSelection]="true"
    />
  </div>

  <!-- Footer -->
  <div
    class="flex justify-end px-5 py-2 border-t border-v4-border-color bg-v4-popup-header-footer-color"
  >
    <button
      type="button"
      class="rounded-lg bg-v4-primary-brand-color px-5 py-2 text-sm font-medium text-white hover:opacity-90 transition-opacity"
      [mat-dialog-close]="false"
    >
      Done
    </button>
  </div>
</div>
