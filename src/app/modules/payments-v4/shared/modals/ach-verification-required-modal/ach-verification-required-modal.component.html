<div class="">
  <!-- modal header -->
  <div class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color">
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Bank Verification Required
      </h1>
      <h2 class="text-xs text-v4-subtle-text-color">{{ bankLabel }}</h2>
    </div>
    <div
      [matDialogClose]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color text-center">
    <!-- Icon -->
    <div
      class="w-16 h-16 mx-auto mb-5 rounded-lg flex items-center justify-center bg-v4-badge-info-bg-color"
    >
      <lucide-icon [img]="AlertCircleIcon" [size]="32" class="text-v4-primary-brand-color" />
    </div>

    <!-- Description -->
    <p class="text-v4-subtle-text-color text-sm leading-relaxed m-0 max-w-[340px] mx-auto">
      Your bank account must be verified {{ methodDescription }}.
      Complete instant verification for faster verification, or verify manually using micro deposits.
    </p>
  </div>
  <!-- modal body end -->

  <!-- modal footer -->
  <div class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color">
    <app-common-button-v4
      [type]="{ style: 'outline', name: 'main' }"
      [text]="'Cancel'"
      width="120px"
      (clickEvent)="onCancel()"
    />
    <app-common-button-v4
      [type]="{ style: 'primary', name: 'main' }"
      [text]="'Verify Now'"
      width="120px"
      (clickEvent)="verifyNow()"
    />
  </div>
</div>
