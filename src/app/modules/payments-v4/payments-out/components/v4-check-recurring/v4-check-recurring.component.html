<div class="mt-3 mb-1 flex min-h-[28px] min-w-0 items-center overflow-x-auto">
  <app-common-tab-v4
    [tabs]="recurringTabs"
    [activeTab]="activeTab()"
    (tabChange)="onTabChange($event)"
    variant="pill"
    [noWrap]="true"
  />
</div>
@if (activeTab() === "mailed-checks") {
  <app-v4-check-recurring-list [isFromPaymentsV3]="isFromPaymentsV3()" [deepLinkRowId]="deepLinkRowId()" />
}
@if (activeTab() === "ach") {
  <app-v4-ach-recurring-list [isFromPaymentsV3]="isFromPaymentsV3()" [deepLinkRowId]="deepLinkRowId()" />
}
@if (activeTab() === "emailed-checks") {
  <app-v4-email-recurring-list [isFromPaymentsV3]="isFromPaymentsV3()" [deepLinkRowId]="deepLinkRowId()" />
}
@if (activeTab() === "gift-card") {
  <app-v4-gift-card-recurring-list [isFromPaymentsV3]="isFromPaymentsV3()" [deepLinkRowId]="deepLinkRowId()" />
}
