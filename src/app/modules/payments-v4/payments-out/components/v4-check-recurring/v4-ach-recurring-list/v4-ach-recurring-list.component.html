<div class="flex flex-col w-full h-full overflow-auto">
  <div class="data-table-wrapper flex-1">
    <div class="px-5" [ngClass]="{ '!px-0': isFromPaymentsV3() }">
      <app-v4-data-table
        [dynamicHeaderText]="isFromPaymentsV3() ? '' : 'Check Recurring'"
        [backButtonEnabled]="!isFromPaymentsV3()"
        prevoiusUrl="/manage/payments-table/check"
        [headerElements]="headerElements()"
        [columnDefs]="columnDefs"
        [defaultColumnFields]="columnFields"
        [tableId]="tableId"
        [compact]="true"
        [freeColumnResize]="true"
        (cellRendererIdEvent)="cellRendererActionClick($event)"
        (cellRendererViewEvent)="cellRendererActionView($event)"
        [frameworkComponents]="frameworkComponents"
        (headerButtonEvent)="headerButtonClick($event)"
        (rowSelected)="onRowSelected($event)"
        [additionalPayload]="{ ach_type }"
        [defaultDisabledColumn]="['end_date']"
        [isFromPaymentsV3]="isFromPaymentsV3()"
        (emptyStateActionClick)="onEmptyStateAction()"
        [useCustomEmptyState]="true"
        [emptyStateConfig]="{
          icon: 'send',
          title: 'No payments out yet',
          description: 'Recurring ACH payments you schedule will appear here with their next run date and status. Set up your first recurring ACH.',
          buttonText: 'New payment',
        }"
      >
      </app-v4-data-table>
    </div>
  </div>
</div>

@if (selectedRowId()) {
  <app-recurring-view-detail-panel-v4
    [rowId]="selectedRowId()"
    type="2"
    [isOpen]="isDetailPanelOpen()"
    [openRecurringByDefault]="isDeepLinkOpen()"
    (closed)="isDetailPanelOpen.set(false)"
  />
}
