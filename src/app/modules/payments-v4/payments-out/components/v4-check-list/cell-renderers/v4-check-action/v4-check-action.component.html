<div class="flex items-center gap-1 h-full">
  <button aria-label="Actions"
    class="action-icon-btn"
    [matMenuTriggerFor]="menu"
    (click)="$event.stopPropagation()"
    matTooltip="Actions"
  >
    <lucide-icon
      name="ellipsis-vertical"
      [size]="16"
      class="v4-action-icon"
    ></lucide-icon>
  </button>
  <button aria-label="View"
    class="action-icon-btn"
    (click)="onViewClick(); $event.stopPropagation()"
    matTooltip="View"
  >
    <lucide-icon name="eye" [size]="16" class="v4-action-icon"></lucide-icon>
  </button>
  <button
    class="action-icon-btn"
    (click)="cardButtonClick(); $event.stopPropagation()"
  >
    <lucide-icon name="credit-card" [size]="16" class="v4-action-icon" matTooltip="Pay by Credit Card"></lucide-icon>
  </button>

  <mat-menu #menu="matMenu" class="v4-action-menu">
    @for (group of groupedActions; track group.title) {
      <div class="v4-menu-group-label">{{ group.title }}</div>
      @for (item of group.items; track item.label) {
        <div class="v4-menu-item-row">
          <button
            mat-menu-item
            [class.v4-menu-item-danger]="item.label === 'Delete'"
            [disabled]="isActionDisabled(item)"
            (click)="onActionClick(item.label)"
          >
            <div class="v4-menu-item">
              <lucide-icon [name]="item.icon" [size]="16"></lucide-icon>
              <span>{{ item.label }}</span>
            </div>
          </button>
          @if (getActionTooltip(item.label)) {
            <lucide-icon
              name="info"
              [size]="14"
              class="v4-menu-item-tooltip-icon"
              [matTooltip]="getActionTooltip(item.label)"
              matTooltipPosition="above"
              matTooltipClass="v4-menu-item-tooltip"
            ></lucide-icon>
          }
        </div>
      }
    }
  </mat-menu>
</div>
