<div class="flex items-center justify-start w-full gap-1">
  <div class="flex items-center gap-2">
    <!-- New checks show only the Process action — the badge is redundant there. -->
    @if (isReprinted) {
      <span class="text-sm font-peridot">Re-printed</span>
    } @else if (!isNew) {
      <span
        role="presentation"
        type="button"
        class="status-badge"
        [class.status-badge--clickable]="hasTrackingCode"
        [disabled]="!hasTrackingCode"
        [style.background-color]="badgeBg"
        [style.color]="badgeTextColor"
        [matTooltip]="statusDescription"
        (click)="onStatusClick(); $event.stopPropagation()"
        [ngClass]="hasTrackingCode ? 'hover:shadow-common-button' : ''"
      >
        {{ statusName }}
      </span>
    }
    @if (isNew) {
      <button
        type="button"
        class="status-print-btn !font-medium hover:shadow-common-button"
        [matMenuTriggerFor]="paymentOptionsMenu"
        [disabled]="isOptionRunning"
        matTooltip="Process this check"
        (menuOpened)="onMenuToggle(true)"
        (menuClosed)="onMenuToggle(false)"
        (click)="$event.stopPropagation()"
      >
        <span class="!font-medium">Process</span>
        @if (isOptionRunning) {
          <lucide-angular
            name="loader-circle"
            [size]="14"
            class="shrink-0 animate-spin"
          />
        } @else {
          <lucide-angular
            [name]="isMenuOpen ? 'chevron-up' : 'chevron-down'"
            [size]="14"
            class="shrink-0"
          />
        }
      </button>
      <mat-menu #paymentOptionsMenu="matMenu" class="v4-action-menu">
        @for (opt of paymentOptions; track opt.id) {
          <button
            mat-menu-item
            [class.v4-menu-item-selected]="opt.id === selectedOptionId"
            (click)="onPaymentOption(opt.id)"
          >
            <div class="flex items-center gap-2">
              <lucide-angular [name]="opt.icon" [size]="14" class="shrink-0" />
              <span>{{ opt.name }}</span>
              @if (opt.id === selectedOptionId) {
                <lucide-angular
                  name="check"
                  [size]="14"
                  class="ml-auto shrink-0"
                />
              }
            </div>
          </button>
        }
      </mat-menu>
    }
    @if (areCommentsPresent) {
      <div class="dt-cell-edit-btn">
        <lucide-angular
          name="message-square"
          [size]="16"
          matTooltip="View Comments"
          (click)="onCommentClick(); $event.stopPropagation()"
        />
      </div>
    }
    @if (areAttachmentsPresent) {
      <div class="dt-cell-edit-btn">
        <lucide-angular
          name="paperclip"
          [size]="16"
          matTooltip="View Attachments"
          (click)="onAttachmentClick(); $event.stopPropagation()"
        />
      </div>
    }
  </div>
  @if (isFilterableStatus) {
    <app-common-filter-icon (filterEvent)="onFilterClicked()" />
  }
</div>
