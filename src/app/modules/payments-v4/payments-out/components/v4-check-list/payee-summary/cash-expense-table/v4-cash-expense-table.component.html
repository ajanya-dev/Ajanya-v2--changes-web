<div class="data-table-wrapper flex flex-1 flex-col min-h-0 w-full">
  <app-v4-data-table
    [columnDefs]="columnDefs"
    [defaultColumnFields]="columnFields"
    [tableId]="tableId"
    [useCustomEmptyState]="true"
    [emptyStateConfig]="{
      icon: 'wallet',
      title: 'No cash expenses for this payee',
      description: 'Cash expenses recorded against this payee will appear here',
      buttonText: ''
    }"
    [fieldsShownByDefault]="['action','transaction_date','memo','serial_no','name','amount','bank_account_account_name']"
    [frameworkComponents]="frameworkComponents"
    [showActionButtonContainer]="false"
    [additionalPayload]="{ payeeId, type }"
    [exportConfig]="exportConfig"
    (cashExpenseExportEvent)="onCashExpenseExport($event)"
    [filterAndExportLoadingInput]="exportLoading()"
    [suppressRowClickSelection]="true"
  />
</div>
