<div class="data-table-wrapper flex flex-1 flex-col min-h-0 w-full">
  <app-v4-data-table
    [columnDefs]="columnDefs"
    [defaultColumnFields]="columnFields"
    [tableId]="tableId"
    [useCustomEmptyState]="true"
    [emptyStateConfig]="{
      icon: 'file-text',
      title: 'No checks for this payee',
      description: 'Checks issued to this payee will appear here once you send one',
      buttonText: ''
    }"
    [fieldsShownByDefault]="['action','cheque_issue_date','cheque_memo','cheque_serial_number','cheque_created_by_name','cheque_amount','bank_accounts.bank_account_account_name']"
    [frameworkComponents]="frameworkComponents"
    [showActionButtonContainer]="false"
    [additionalPayload]="{ payeeId }"
    [exportConfig]="exportConfig"
    [suppressRowClickSelection]="true"
  />
</div>
