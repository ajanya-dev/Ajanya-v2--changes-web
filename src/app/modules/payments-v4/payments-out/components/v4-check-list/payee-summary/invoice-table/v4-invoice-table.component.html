<div class="data-table-wrapper flex flex-1 flex-col min-h-0 w-full">
  <app-v4-data-table
    [columnDefs]="columnDefs"
    [defaultColumnFields]="columnFields"
    [tableId]="tableId"
    [useCustomEmptyState]="true"
    [emptyStateConfig]="{
      icon: 'file-text',
      title: 'No invoices for this payee',
      description: 'Invoices linked to this payee will appear here once you create one',
      buttonText: ''
    }"
    [fieldsShownByDefault]="['action','invoice_date','memo','invoice_no','name','note','grand_total','bank_account_account_name']"
    [frameworkComponents]="frameworkComponents"
    [showActionButtonContainer]="false"
    [additionalPayload]="{ payeeId, type }"
    [exportConfig]="exportConfig"
    [suppressRowClickSelection]="true"
  />
</div>
