<div class="data-table-wrapper flex flex-1 flex-col min-h-0 w-full">
  <app-v4-data-table
    [columnDefs]="columnDefs"
    [defaultColumnFields]="columnFields"
    [tableId]="tableId"
    [useCustomEmptyState]="true"
    [emptyStateConfig]="{
      icon: 'wallet',
      title: 'No wallet transactions for this payee',
      description: 'Wallet payments sent to this payee will appear here',
      buttonText: ''
    }"
    [fieldsShownByDefault]="['action','zil_payments.created_at','description','amount','source_name']"
    [frameworkComponents]="frameworkComponents"
    [showActionButtonContainer]="false"
    [additionalPayload]="{ payeeId }"
    [exportConfig]="exportConfig"
    [suppressRowClickSelection]="true"
  />
</div>
