<div class="data-table-wrapper flex flex-1 flex-col min-h-0 w-full">
  <app-v4-data-table
    [columnDefs]="columnDefs"
    [defaultColumnFields]="columnFields"
    [tableId]="tableId"
    [useCustomEmptyState]="true"
    [emptyStateConfig]="{
      icon: 'receipt',
      title: 'No bills for this payee',
      description: 'Bills raised by this payee will appear here once you add one',
      buttonText: ''
    }"
    [fieldsShownByDefault]="['action','bills.created_at','memo','inv_no','name','bill_grand_total','bank_accounts.bank_account_account_name']"
    [frameworkComponents]="frameworkComponents"
    [showActionButtonContainer]="false"
    [additionalPayload]="{ payeeId, type }"
    [exportConfig]="exportConfig"
    [suppressRowClickSelection]="true"
  />
</div>
