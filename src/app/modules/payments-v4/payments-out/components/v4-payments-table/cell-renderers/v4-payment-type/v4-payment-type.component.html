<div class="flex h-full items-center gap-1">
  <div>
    <div
      role="presentation"
      class="payment-type-button"
      [class.editable]="!isFieldReadOnly"
      [style.color]="getColorScheme(dynamicColorScheme).text"
      #dynamicPaymentTypeDropdown="matMenuTrigger"
      [matMenuTriggerFor]="isFieldReadOnly ? null : paymentTypeDropdown"
      [matTooltip]="isFieldReadOnly ? '' : 'Change Payment Type'"
      (click)="$event.stopPropagation()"
    >
      <span class="payment-type-label">{{
        isAcronymPaymentType
          ? (currentPaymentType | uppercase)
          : (currentPaymentType | titlecase)
      }}</span>
    </div>
    <mat-menu #paymentTypeDropdown="matMenu" class="ocw-meterial-menu">
      <div class="payment-type-dropdown">
        <ul>
          @for (
            paymentOption of this.avaliablePaymentTypes;
            track $index
          ) {
            <li
              role="presentation"
              [style.background-color]="getColorScheme(paymentOption.id).bg"
              [style.color]="getColorScheme(paymentOption.id).text"
              (click)="changePaymentType(paymentOption)"
            >
              <h2>{{ paymentOption.label }}</h2>
            </li>
          }
        </ul>
      </div>
    </mat-menu>
  </div>
  @if (!isFieldReadOnly) {
    <button
      type="button"
      class="dt-cell-edit-btn"
      aria-label="Change payment type"
      matTooltip="Change Payment Type"
      (click)="$event.stopPropagation(); dynamicPaymentTypeDropdown.openMenu()"
    >
      <lucide-angular [img]="PencilIcon" [size]="12" />
    </button>
  }
  <app-common-filter-icon (filterEvent)="onFilterClicked()" />
</div>
