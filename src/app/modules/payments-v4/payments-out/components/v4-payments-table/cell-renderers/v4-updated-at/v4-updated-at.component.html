<div class="flex gap-1 items-center w-full">
  <div
    class="flex whitespace-nowrap"
    [ngClass]="{ 'flex-col': !inline, 'gap-1': inline, 'items-baseline': inline }"
  >
    <h2>{{ dateUpdatedAt }}</h2>
    <h3 class="!text-[12px]">{{ timeUpdatedAt }}</h3>
  </div>
  @if (!disableFilter) {
    <app-common-filter-icon (filterEvent)="onFilterClicked()" />
  }
</div>
