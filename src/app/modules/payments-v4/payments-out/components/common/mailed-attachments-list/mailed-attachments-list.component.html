<div
  class="mailed-attachments-list rounded-xl border border-v4-border-color bg-v4-secondary-background-color p-3"
  [style.max-height]="maxHeight()"
>
  <button
    type="button"
    class="pd-card-head"
    [class.mb-2]="!collapsed()"
    (click)="toggleFold()"
  >
    <span class="font-peridot text-xs font-bold text-v4-main-text-color">
      Mailed attachments
    </span>
    <lucide-icon
      [img]="collapsed() ? ChevronDownIcon : ChevronUpIcon"
      [size]="15"
      class="text-v4-tertiary-text-color"
    ></lucide-icon>
  </button>
  @if (!collapsed()) {
    @if (attachments()?.length) {
      <div class="overflow-x-auto border border-v4-border-color rounded-xl">
        <div class="max-h-[490px] overflow-y-auto">
          <table class="v4-ocw-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>User</th>
                <th>File</th>
                <th class="text-center">Action</th>
              </tr>
            </thead>
            <tbody>
              @for (entry of attachments(); track entry.id) {
                <tr>
                  <td><app-pd-date-time [value]="entry.date" /></td>
                  <td>{{ entry.user }}</td>
                  <td>{{ entry.fileName }}</td>
                  <td class="text-center">
                    <div class="flex items-center justify-center">
                      <button
                        class="p-1.5 rounded text-v4-primary-brand-bold-color hover:bg-v4-tertiary-background-color transition-colors inline-flex cursor-pointer"
                        (click)="viewAttachment.emit(entry.id)"
                        aria-label="View attachment"
                      >
                        <lucide-icon
                          [img]="externalLinkIcon"
                          [size]="14"
                        ></lucide-icon>
                      </button>
                    </div>
                  </td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      </div>
    } @else {
      <div class="pd-empty">
        <p class="text-v4-secondary-text-color text-sm text-center py-6 m-0">
          No mailed attachments found.
        </p>
      </div>
    }
  }
</div>
