<ng-template #groupMailingTable>
  <app-v4-data-table
    class="block bg-v4-main-background-color rounded-lg"
    [columnDefs]="columnDefs"
    [tableId]="tableId"
    [frameworkComponents]="frameworkComponents"
    [isRowSelectable]="isRowSelectable"
    [defaultColumnFields]="defaultColumnFields"
    [deselectedColumns]="deselectedColumns"
  ></app-v4-data-table>
</ng-template>

@if (embedded) {
  <!-- Rendered inside the payments-out check tab: host owns the header/tabs. -->
  <div class="w-full pb-4">
    <ng-container *ngTemplateOutlet="groupMailingTable"></ng-container>
  </div>
} @else {
  <div
    class="flex flex-col h-full w-full overflow-hidden bg-v4-main-background-color"
  >
    <!-- Page Header -->
    <div
      class="flex-shrink-0 bg-v4-main-background-color shadow-sm border-b border-v4-border-color"
    >
      <app-v4-page-header
        title="Group Mailing"
        subtitle="Send and track mailings sent to a group of recipients"
        [showBackButton]="true"
        [backButtonType]="'takeEvent'"
        (backEvent)="goBack()"
      />
    </div>

    <!-- Data Table -->
    <div class="flex-1 overflow-auto min-h-0">
      <ng-container *ngTemplateOutlet="groupMailingTable"></ng-container>
    </div>
  </div>
}

<app-v4-group-mailing-detail-panel />
