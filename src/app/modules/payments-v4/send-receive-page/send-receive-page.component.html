<div
  class="w-full max-w-[1190px] mx-auto px-4 pb-24 pt-4 sm:px-7"
  style="
    zoom: 0.85;
    --v4-input-background-color: var(--v4-secondary-background-color);"
>
  <!-- Header: back + Pay/Receive toggle + quick actions.
       Laid out on the same grid as the content below so the quick actions end
       where the form ends, not where the page does — the details panel is its
       own column and the header has no business reaching across it. -->
  <div class="grid-container mb-3 gap-3 items-start">
    <div class="flex items-center gap-3.5">
      <button
        type="button"
        class="grid h-9 w-9 place-items-center rounded-[11px] border border-v4-border-color bg-v4-secondary-background-color text-v4-tertiary-text-color hover:text-v4-main-text-color"
        matTooltip="Back"
        (click)="goBack()"
      >
        <lucide-icon [img]="ChevronLeftIcon" [size]="18"></lucide-icon>
      </button>

      <div
        class="inline-flex gap-1 rounded-[13px] border border-v4-border-color bg-v4-main-background-color p-1"
      >
        <a
          routerLink="/v4/manage/payments/pay"
          class="cursor-pointer rounded-[10px] px-[22px] py-2 font-semibold transition-all text-[14px]"
          [ngClass]="
            mode() === 'pay'
              ? 'bg-v4-secondary-background-color text-v4-brand-border-color shadow-[0_1px_2px_rgba(16,24,40,0.06)]'
              : 'text-v4-tertiary-text-color hover:text-v4-secondary-text-color'"
        >
          Pay
        </a>
        <a
          routerLink="/v4/manage/payments/receive"
          class="cursor-pointer rounded-[10px] px-[22px] py-2 font-semibold transition-all text-[14px]"
          [ngClass]="
            mode() === 'receive'
              ? 'bg-v4-secondary-background-color text-v4-brand-border-color shadow-[0_1px_2px_rgba(16,24,40,0.06)]'
              : 'text-v4-tertiary-text-color hover:text-v4-secondary-text-color'"
        >
          Receive
        </a>
      </div>

      <div
        class="ml-auto flex items-center gap-2.5 text-v4-tertiary-text-color"
      >
        <a
          routerLink="/v4/manage/bulk-payments/index"
          class="flex cursor-pointer items-center gap-2 rounded-[10px] border border-v4-border-color bg-v4-secondary-background-color px-3 py-2 font-medium hover:text-v4-main-text-color text-[12px]"
          matTooltip="Process multiple payments at once – manual entry, Excel import, or saved templates"
        >
          <lucide-icon [img]="LayersIcon" [size]="15"></lucide-icon>
          <span class="hidden sm:inline">Bulk Pay</span>
        </a>
        <button
          type="button"
          class="grid h-[34px] w-[34px] place-items-center rounded-[10px] border border-v4-border-color bg-v4-secondary-background-color hover:text-v4-main-text-color"
          matTooltip="Set default Payment"
          (click)="openDefaultPaymentModal()"
        >
          <lucide-icon [img]="SettingIcon" [size]="15"></lucide-icon>
        </button>
      </div>
    </div>
  </div>

  <div class="grid-container gap-3 items-start">
    <app-payments-section />
    <div class="lg:sticky lg:top-4">
      <app-payment-details-section />
    </div>
  </div>
</div>
