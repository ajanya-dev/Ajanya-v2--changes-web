<hr class="det-rule" />
<div class="det-foot">
  <div class="det-foot-l">
    <div
      class="recurring compact"
      data-field="recurring"
      [class.is-disabled]="scheduleDisabled()"
      [matTooltip]="scheduleBlockedReason()"
      [matTooltipDisabled]="!scheduleBlockedReason()"
      matTooltipPosition="above"
    >
      <button
        type="button"
        class="rec-toggle compact"
        [disabled]="scheduleDisabled()"
        (click)="toggleRecurring()"
      >
        <span class="rt-ic">
          <i-lucide [img]="RepeatIcon" [size]="18"></i-lucide>
        </span>
        <span class="rt-main">
          <span class="rt-nm">{{ scheduleTitle() }}</span>
          <span class="rt-sub">
            {{ scheduleSubtitle() }}
            @if (!scheduleDisabled() && isRecurring()) {
              <button
                type="button"
                class="ni-edit"
                matTooltip="View or edit the schedule"
                (click)="editRecurring(); $event.stopPropagation()"
              >
                <i-lucide [img]="PencilIcon" [size]="12"></i-lucide>
              </button>
            }
          </span>
        </span>
        <span class="switch" [class.on]="isRecurring()"><i></i></span>
      </button>
    </div>

    @if (showsNotify()) {
    <div
      class="recurring compact"
      data-field="notify"
      [class.is-disabled]="!notifyEnabled()"
      [matTooltip]="notifyHint()"
      [matTooltipDisabled]="!notifyHint()"
      matTooltipPosition="above"
    >
      <button
        type="button"
        class="rec-toggle compact"
        [disabled]="!notifyEnabled()"
        (click)="openNotifyModal()"
      >
        <span class="rt-ic">
          <i-lucide [img]="BellIcon" [size]="18"></i-lucide>
        </span>
        <span class="rt-main">
          <span class="rt-nm">Notify the payee</span>
          <span class="rt-sub">
            @if (notifySubtitle()) {
              {{ notifySubtitle() }}
            } @else {
              @for (channel of notifyChannels(); track channel.label) {
                <span class="ni-ch" [class.on]="channel.on">
                  <i-lucide [img]="channel.icon" [size]="11"></i-lucide>
                  {{ channel.label }}
                </span>
              }
            }
          </span>
        </span>
        <span class="switch" [class.on]="notifyMainOn()"><i></i></span>
      </button>
    </div>
    }

    <!-- Section-specific toggles join this row; collapses when nothing projects. -->
    <ng-content />
  </div>

  <!-- The rail's own chip (custom fields). A direct child of .det-foot, so
       space-between pushes it to the end of the row. -->
  <ng-content select="[footerEnd]"></ng-content>
</div>
