<div class="flex flex-col font-funnel rounded-2xl overflow-hidden w-[480px]">

  <!-- Header -->
  <div class="flex justify-between items-center px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color shrink-0">
    <div>
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel m-0">Set Default Payment</h1>
      <p class="text-xs text-v4-subtle-text-color mt-0.5 mb-0">Configure your preferred payment method</p>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center shrink-0"
    >
      <lucide-icon [img]="XIcon" [size]="18" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- Body -->
  <div class="px-6 py-5 bg-v4-tertiary-background-color space-y-4">

    <!-- Pay From + Pay As -->
    <div class="flex gap-3">

      <!-- Pay From -->
      <div class="flex-1">
        <label for="payFromDropdown" class="text-xs font-medium text-v4-main-text-color mb-1.5 block">
          Pay From <span class="text-v4-common-red-color">*</span>
        </label>
        <div [class.animate-pulse]="loading" [class.pointer-events-none]="loading">
          <app-v4-common-dropdown
            id="payFromDropdown"
            [listData]="filteredPayFromItems"
            [config]="payFromDropdownConfig"
            [clearable]="false"
            [isDisabled]="loading"
            [(ngModel)]="selectedPayFromId"
            (ngModelChange)="payFromSelect($event)"
            appendTo="body"
          />
        </div>
      </div>

      <!-- Pay As -->
      <div class="flex-1">
        <label for="payAsDropdown" class="text-xs font-medium text-v4-main-text-color mb-1.5 block">
          Pay As <span class="text-v4-common-red-color">*</span>
        </label>
        <div [class.animate-pulse]="loading" [class.pointer-events-none]="loading">
          <app-v4-common-dropdown
            id="payAsDropdown"
            [listData]="filteredPayAsItems"
            [config]="payAsDropdownConfig"
            [clearable]="false"
            [isDisabled]="loading"
            [(ngModel)]="selectedPayAsId"
            (ngModelChange)="payAsSelect($event)"
            appendTo="body"
          />
        </div>
      </div>

    </div>

    <!-- Account Dropdown -->
    <div [formGroup]="paymentForm">
      @if (loading) {
        <div class="h-10 rounded-lg bg-v4-border-color animate-pulse"></div>
      } @else if (selectedPayFromItem?.id === 'bankaccount') {
        <div>
          <label for="bankAccountDropdown" class="text-xs font-medium text-v4-main-text-color mb-1.5 block">
            Bank Account
          </label>
          <app-bank-ac-dropdown-v4
            id="bankAccountDropdown"
            (ready)="autoPopulateDropdown($event, paymentAc?.id)"
            formControlName="paymentAcControl"
            #dropDownBank
            permissionContext="forPayment"
            [labelIconNeeded]="false"
            append="body"
            [zIndex]="1001"
          />
        </div>
      } @else if (selectedPayFromItem?.id === 'wallet') {
        <div>
          <label for="walletDropdown" class="text-xs font-medium text-v4-main-text-color mb-1.5 block">
            Wallet
          </label>
          <app-wallet-dropdown-v4
            id="walletDropdown"
            #dropDownWallet
            (ready)="autoPopulateDropdown($event, paymentAc?.id)"
            formControlName="paymentAcControl"
            [showLogoUpdateModal]="false"
            [labelIconNeeded]="false"
            append="body"
          />
        </div>
      } @else if (selectedPayFromItem?.id === 'cloud') {
        <div>
          <label for="cloudDropdown" class="text-xs font-medium text-v4-main-text-color mb-1.5 block">
            Cloud Account
          </label>
          <app-cloud-account-dropdown-v35
            id="cloudDropdown"
            #dropDownCloud
            customHeight="2"
            (ready)="autoPopulateDropdown($event, paymentAc?.id)"
            (selectionEvent)="accSelect($event)"
          />
        </div>
      } @else if (selectedPayFromItem?.id === 'card') {
        <div>
          <label for="cardDropdown" class="text-xs font-medium text-v4-main-text-color mb-1.5 block">
            Card
          </label>
          <app-cards-dropdown-v4
            id="cardDropdown"
            #dropDownCard
            (ready)="autoPopulateDropdown($event, paymentAc?.cardId)"
            formControlName="paymentAcControl"
            [labelIconNeeded]="false"
            appendTo="body"
          />
        </div>
      }
    </div>

    <!-- Memo -->
    <div>
      <label for="memoInput" class="text-xs font-medium text-v4-main-text-color mb-1.5 block">Memo</label>
      <div class="relative" [class.animate-pulse]="loading">
        <input
          id="memoInput"
          type="text"
          [(ngModel)]="memo"
          class="w-full h-10 pl-3 pr-9 rounded-lg border border-v4-border-color bg-v4-secondary-background-color text-v4-main-text-color text-sm focus:outline-none focus:border-v4-primary-brand-color transition-colors placeholder:text-v4-subtle-text-color"
          placeholder="Enter default memo"
          maxlength="100"
          [disabled]="loading"
        />
        <fa-icon
          [icon]="faCircleQuestion"
          [matTooltip]="'• Brief note about this payment.\n• Example: \'Office rent\' or \'Supplies\'.'"
          [matTooltipPosition]="'right'"
          [matTooltipShowDelay]="300"
          matTooltipClass="dark-tooltip my-tooltip"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-v4-subtle-text-color text-sm cursor-default"
        />
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="flex justify-end gap-3 px-6 py-4 bg-v4-secondary-background-color border-t border-v4-border-color shrink-0">
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Reset"
      [disabled]="submitLoading || resetLoading"
      [loading]="resetLoading"
      (clickEvent)="reset()"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Save"
      [disabled]="submitLoading || resetLoading"
      [loading]="submitLoading"
      (clickEvent)="submit()"
    />
  </div>

</div>
