<div class="flex flex-col  rounded-2xl overflow-hidden">
  <form [formGroup]="blankCheckForm" (ngSubmit)="onSubmit()">

    <!-- Header -->
    <div class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color">
      <div class="flex flex-col">
        <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">Create Multiple Blank Checks</h1>
        <h2 class="text-xs text-v4-subtle-text-color font-peridot">Generate blank checks for your bank account</h2>
      </div>
      <div
        [mat-dialog-close]="false"
        class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
      >
        <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
      </div>
    </div>

    <!-- Body -->
    <div class="p-6 bg-v4-tertiary-background-color space-y-4">

      <!-- Bank Account -->
      <div>
        <label class="mb-1.5 block text-xs font-medium text-v4-main-text-color font-peridot" for="bank-account-select">
          Bank Account <span class="text-v4-common-red-color">*</span>
        </label>
        <app-bank-ac-dropdown-v4
          [formControl]="selectedBank"
          [enableAddNew]="true"
          append="body"
          [labelIconNeeded]="false"
          (clearEvent)="onRemoveBank()"
          [showVerificationBadge]="true"
          permissionContext="forPayment"
        />
        <app-control-message-v4 [control]="blankCheckForm.controls.accountId" />
      </div>

      <!-- Number of Checks -->
      <div>
        <app-common-input-v4
          fieldLabel="Number of Checks"
          isFieldRequired="true"
          formControlName="total"
          placeholder="Enter number of checks"
          [isNumberOnly]="true"
          [numberType]="'numeric'"
          [maxLength]="8"
          [control]="blankCheckForm.controls.total"
        />
      </div>

      <!-- Category -->
      <div>
        <label class="mb-1.5 block text-xs font-medium text-v4-main-text-color font-peridot" for="category-select">
          Category
        </label>
        <app-category-dropdown-v4
          [enableAddNew]="true"
          appendTo="body"
          [formControl]="selectedCategory"
          (clearEvent)="onRemoveCategory()"
        />
      </div>

      <!-- Include Signature -->
      <div>
        <label class="mb-1.5 block text-xs font-medium text-v4-main-text-color font-peridot" for="include-signature">
          Include Signature
        </label>
        <app-v4-common-dropdown
          [config]="includeSignatureConfig"
          [listData]="includeSignatureOptions"
          [clearable]="false"
          formControlName="includeSignature"
          appendTo="body"
        />
      </div>

    </div>

    <!-- Footer -->
    <div class="flex justify-end gap-3 px-6 py-4 bg-v4-secondary-background-color border-t border-v4-border-color">
      <app-common-button-v4
        mat-dialog-close=""
        width="120px"
        [type]="{ style: 'outline', name: 'main' }"
        text="Cancel"
      />
      <app-common-button-v4
        width="120px"
        [type]="{ style: 'primary', name: 'main' }"
        text="Submit"
        btnType="submit"
        [disabled]="submitting"
        [loading]="submitting"
      />
    </div>

  </form>
</div>
