<div [ngClass]="loading ? 'wrapper' : 'hidden'">
  <div class="logo">
    <h2>Loading...</h2>
  </div>
  <div class="progressbar"></div>
</div>
<div
  class="main w-full h-full flex justify-center items-center"
  [ngClass]="loading ? 'hidden' : ''"
>
  <app-create-bank-options-modal
    [componentConfigData]="{ mode: 'outside-verify' }"
    *ngIf="showPage == 'createOptions'"
    (optionSelected)="onCreateOptionSelected($event)"
  ></app-create-bank-options-modal>
  <app-choose-bank-option-modal
    [accountsDataInput]="accountsData"
    *ngIf="showPage == 'yodleeOptions'"
    (selected)="onYodleeOptionSelected($event)"
  ></app-choose-bank-option-modal>
  <app-yodlee-parent-modal
    [dialogueDataInput]="yodleeModalData"
    [config]="yodleeConfig"
    *ngIf="showPage == 'yodlee' && yodleeModalData"
    (outsideEvents)="postEvents($event)"
  ></app-yodlee-parent-modal>
  <app-new-bank-account-optomized-model
    *ngIf="showPage == 'manual-add'"
    [isComponent]="true"
    (success)="onSuccessManually($event)"
  ></app-new-bank-account-optomized-model>
</div>
