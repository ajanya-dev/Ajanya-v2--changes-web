<div class="ocw_man_modal_wrapper">
  <!-- Modal Header -->
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">Transfer Funds</div>
    <div class="close_btn" [mat-dialog-close]="false">
      <svg
        aria-hidden="true"
        focusable="false"
        data-prefix="fal"
        data-icon="times"
        class="svg-inline--fa fa-times fa-w-10"
        role="img"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 320 512"
      >
        <path
          fill="currentColor"
          d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
        ></path>
      </svg>
    </div>
  </div>

  <div class="block pt-6">
    <form [formGroup]="transferFundsForm">
      <div class="form-items">
        <!-- From Wallet -->
        <div class="form-group pb-4 lg:mr-3">
          <div class="control_wrap">
            <div class="single_input">
              <ng-select
                class="drop_style"
                [items]="walletList"
                bindLabel="displayName"
                formControlName="fromWallet"
                bindValue="uuId"
                placeholder="From Wallet Account"
              >
              </ng-select>
            </div>

            <app-control-message
              [control]="transferFundsForm.controls.fromWallet"
              labelName="Please select a From wallet"
            >
            </app-control-message>
          </div>
        </div>

        <!-- To Wallet -->
        <div class="form-group mb-2 lg:ml-3">
          <div class="control_wrap">
            <div class="single_input">
              <ng-select
                class="drop_style"
                [items]="walletList"
                bindLabel="displayName"
                formControlName="toWallet"
                bindValue="uuId"
                placeholder="To Wallet"
              >
              </ng-select>
            </div>

            <app-control-message
              [control]="transferFundsForm.controls.toWallet"
              labelName="Please select a Destination Wallet"
            >
            </app-control-message>
          </div>
        </div>
      </div>

      <div class="form-items">
        <!-- Select Amount -->
        <div class="form-group mb-2 lg:mr-3">
          <div class="flex">
            <input
              type="text"
              class="input_style"
              placeholder="Amount"
              formControlName="amount"
              maxlength="15"
              mask="separator.2"
              thousandSeparator=","
              (input)="totalAmountCal()"
            />
            <div class="add_modal_btn" (click)="openCalculator()">
              <svg
                aria-hidden="true"
                focusable="false"
                data-prefix="far"
                data-icon="calculator"
                class="svg-inline--fa fa-calculator fa-w-14"
                role="img"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 448 512"
              >
                <path
                  fill="currentColor"
                  d="M400 0H48C22.4 0 0 22.4 0 48v416c0 25.6 22.4 48 48 48h352c25.6 0 48-22.4 48-48V48c0-25.6-22.4-48-48-48zm0 464H48V208h352v256zm0-304H48V48h352v112zM108.8 320h38.4c6.4 0 12.8-6.4 12.8-12.8v-38.4c0-6.4-6.4-12.8-12.8-12.8h-38.4c-6.4 0-12.8 6.4-12.8 12.8v38.4c0 6.4 6.4 12.8 12.8 12.8zm192 96h38.4c6.4 0 12.8-6.4 12.8-12.8V268.8c0-6.4-6.4-12.8-12.8-12.8h-38.4c-6.4 0-12.8 6.4-12.8 12.8v134.4c0 6.4 6.4 12.8 12.8 12.8zm-192 0h38.4c6.4 0 12.8-6.4 12.8-12.8v-38.4c0-6.4-6.4-12.8-12.8-12.8h-38.4c-6.4 0-12.8 6.4-12.8 12.8v38.4c0 6.4 6.4 12.8 12.8 12.8zm96-96h38.4c6.4 0 12.8-6.4 12.8-12.8v-38.4c0-6.4-6.4-12.8-12.8-12.8h-38.4c-6.4 0-12.8 6.4-12.8 12.8v38.4c0 6.4 6.4 12.8 12.8 12.8zm0 96h38.4c6.4 0 12.8-6.4 12.8-12.8v-38.4c0-6.4-6.4-12.8-12.8-12.8h-38.4c-6.4 0-12.8 6.4-12.8 12.8v38.4c0 6.4 6.4 12.8 12.8 12.8z"
                ></path>
              </svg>
            </div>
          </div>

          <app-control-message
            [control]="transferFundsForm.controls.amount"
            labelName="Amount is Required"
          >
          </app-control-message>
        </div>

        <!-- Comments -->
        <div class="form-group mb-2 lg:ml-3">
          <div class="single_input no_modal_btn">
            <input
              type="text"
              class="input_style"
              placeholder="Comments"
              required
              formControlName="comment"
              maxlength="50"
            />
          </div>
          <div class="validation-part">
            <app-control-message
              [control]="transferFundsForm.controls.comment"
              labelName="Please enter comments"
            >
            </app-control-message>
          </div>
        </div>
      </div>

      <!-- Submit Button -->
      <div class="submit-button flex justify-center mt-10">
        <button
          type="submit"
          class="btn"
          (click)="onSubmit()"
          [disabled]="submitting"
        >
          <span *ngIf="!submitting">Submit</span>
          <span *ngIf="submitting" class="loadingSpinner"></span>
        </button>
      </div>
    </form>
  </div>
</div>
