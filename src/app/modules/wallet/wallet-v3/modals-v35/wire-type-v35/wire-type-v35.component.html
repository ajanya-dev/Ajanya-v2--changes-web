<div class="px-[6px] pb-[6px]">
  <!-- modal header -->
  <div class="flex justify-between pb-6">
    <div>
      <p class="font-inter font-semibold text-base text-main-text-color">
        Select Wire Type
      </p>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="['fas', 'xmark']"
      ></fa-icon>
    </div>
  </div>
  <!-- modal body start -->
  <div>
    <mat-radio-group
      aria-label="Select an option"
      class="lg:flex flex-col gap-7 v35-mat-radio"
      [(ngModel)]="selectedWireType"
      [ngModelOptions]="{ standalone: true }"
    >
      <div class="flex gap-1 mb-1">
        <mat-radio-button value="domestic" checked>
          <p class="font-roboto text-sm font-medium text-main-text-color">
            Domestic Wire
          </p>
        </mat-radio-button>
      </div>
      <div class="flex gap-1">
        <mat-radio-button value="international">
          <p class="font-roboto text-sm font-medium text-main-text-color">
            International Wire
          </p>
        </mat-radio-button>
      </div>
    </mat-radio-group>
  </div>
  <!-- modal body end -->
  <div class="flex justify-end gap-3 pt-8">
    <app-common-button-v35
      [type]="{ style: 'modal', name: 'main' }"
      text="Confirm"
      width="124px"
      (clickEvent)="onSubmit()"
    ></app-common-button-v35>
  </div>
</div>
