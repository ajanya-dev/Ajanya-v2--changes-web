<div class="px-[6px] pb-[6px]">
  <!-- modal header -->
  <div class="flex justify-between pb-6">
    <div>
      <p class="font-inter font-semibold text-base text-main-text-color">
        Settings
      </p>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="['fas', 'xmark']"
      ></fa-icon>
    </div>
  </div>
  <!-- modal body start -->
  <div>
    <form [formGroup]="walletSettingForm">
      <div class="flex justify-between pb-4 items-center">
        <div class="flex gap-3 items-center">
          <span class="font-roboto text-sm font-medium text-main-text-color"
            >Bypass Wallet for ACH Payout</span
          >
          <fa-icon
            [icon]="['fas', 'question-circle']"
            [matTooltip]="
              walletSettingForm.controls.isWalletBypassingEnabled?.value
                ? walletBypassOnTooltip
                : walletBypassOffTooltip
            "
            matTooltipPosition="below"
            class="text-secondary-text-color"
          ></fa-icon>
        </div>
        <div>
          <mat-slide-toggle
            formControlName="isWalletBypassingEnabled"
          ></mat-slide-toggle>
        </div>
      </div>
      <!-- <div class="flex justify-between pb-4 items-center">
        <div class="flex gap-3 items-center">
          <span class="font-roboto text-sm font-medium text-main-text-color"
            >Use Wallet Funds only for ACH Payouts</span
          >
          <fa-icon
            [icon]="['fas', 'question-circle']"
            [matTooltip]="walletSettingForm.controls.isAutoPullDisabled?.value ? autoPullOnTooltip : autoPullOffTooltip"
            matTooltipPosition="below"
            class="text-secondary-text-color"
          ></fa-icon>
        </div>
        <div>
          <mat-slide-toggle
            formControlName="isAutoPullDisabled"
          ></mat-slide-toggle>
        </div>
      </div> -->
      <div class="flex justify-between pb-4 items-center">
        <div class="flex gap-3 items-center">
          <span class="font-roboto text-sm font-medium text-main-text-color"
            >Auto-Transfer Received Funds to Your Bank</span
          >
          <fa-icon
            [icon]="['fas', 'question-circle']"
            [matTooltip]="
              walletSettingForm.controls.isAutoWithdrawalEnabled?.value
                ? autoWithdrawOnTooltip
                : autoWithdrawOffTooltip
            "
            matTooltipPosition="below"
            class="text-secondary-text-color"
          ></fa-icon>
        </div>
        <div>
          <mat-slide-toggle
            formControlName="isAutoWithdrawalEnabled"
          ></mat-slide-toggle>
        </div>
      </div>
      @if (walletSettingForm.value.isAutoWithdrawalEnabled) {
        <div>
          <p
            class="font-roboto text-sm font-medium text-secondary-text-color pb-2"
          >
            Auto Withdrawal Bank Account
          </p>
          <div>
            <app-bank-ac-dropdown-v3
              append="body"
              placeholder="Select Bank Account"
              [formControl]="selectedBankAccount"
              (ready)="showBank($event)"
              [enableAddNew]="false"
              #bankAcDropDown
            ></app-bank-ac-dropdown-v3>
            <app-control-message-v35
              [control]="selectedBankAccount"
            ></app-control-message-v35>
          </div>
        </div>
      }
    </form>
  </div>
  <!-- modal body end -->
  <div class="flex justify-end gap-3 pt-8">
    <app-common-button-v35
      [type]="{ style: 'modal', name: 'main' }"
      text="Save"
      width="124px"
      (clickEvent)="submit()"
      [loading]="isLoading"
    ></app-common-button-v35>
  </div>
</div>
