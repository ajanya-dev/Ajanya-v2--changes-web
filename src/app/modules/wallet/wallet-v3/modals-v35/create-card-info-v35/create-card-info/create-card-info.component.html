<div class="flex justify-end p-0">
  <button (click)="closeNow()">
    <fa-icon
      [icon]="faXmark"
      class="text-base text-secondary-text-color p-0"
    ></fa-icon>
  </button>
</div>
<div class="p-4 !rounded-lg">
  <div class="h-full flex flex-col !gap-2.5 justify-center">
    <div class="flex justify-center">
      <img
        src="../../../../../../../assets/images/cards/credit-card (1).svg"
        class="w-16 h-16 object-cover"
        alt=""
      />
    </div>
    <div class="text-center text-lg font-bold text-main-text-color">
      Card Creation
    </div>
    <div class="text-center text-xs font-semibold text-secondary-text-color">
      {{ cardInfoData.subTitle }}
    </div>
    <div class="flex flex-col justify-start !gap-2.5 mt-5">
      @for( data of cardInfoData.features; track data){
        <div class="flex gap-6">
          <fa-icon
          [icon]="iconsMap[data.icon]"
          class="text-lg text-common-dark-blue-color"
          ></fa-icon>
          <span class="!pt-1 text-sm text-main-text-color">
            {{data.text}}
          </span>
        </div>
      }
    </div>
    <div
      class="p-4 mt-5 font-semibold bg-common-secondary-blue-color rounded-lg text-xs text-common-dark-blue-color text-center mb-5"
    >
      {{ cardInfoData.message }}
    </div>
    <div
      class="text-sm rounded bg-common-dark-blue-color border border-common-dark-blue-color text-white text-center p-2"
    >
      <button class="w-full" (click)="done()">Contact Now</button>
    </div>
    <div
      class="text-sm rounded text-common-dark-blue-color text-center border border-input-border-color p-2"
    >
      <button (click)="closeNow()" class="w-full">Not Now</button>
    </div>
  </div>
</div>
