<div class="px-[6px] pb-[6px] test">
  <!-- modal header -->
  <div class="flex justify-between pb-6">
    <div>
      <p class="font-inter font-semibold text-base text-main-text-color">
        Recharge My Credits
      </p>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="['fas', 'xmark']"
      ></fa-icon>
    </div>
  </div>
  <!-- modal body start -->
  <form [formGroup]="rechargeMyCreditsForm">
    <div class="flex flex-col gap-5">
      <div>
        <app-wallet-dropdown-v3
          placeholder="From Wallet Account"
          [formControl]="selectedWallet"
          [showLogoUpdateModal]="false"
        ></app-wallet-dropdown-v3>
        <app-control-message-v35
          [control]="rechargeMyCreditsForm.controls.fromWallet"
        ></app-control-message-v35>
      </div>
      <div>
        <div class="flex">
          <app-amount-input
            class="w-full"
            customClass="!rounded-r-none !border-r-0"
            formControlName="amount"
            [maxLength]="15"
          ></app-amount-input>
          <button
            class="add_modal_btn !h-[38px] !rounded-l-none border border-input-border-color border-l-0"
            (click)="openCalculator()"
          >
            <fa-icon
              class="text-secondary-text-color"
              [icon]="['fas', 'calculator']"
            ></fa-icon>
          </button>
        </div>
        <app-control-message-v35
          [control]="rechargeMyCreditsForm.controls.amount"
        ></app-control-message-v35>
      </div>
      <div>
        <app-common-input-field
          placeholder="Comments"
          maxlength="50"
          formControlName="comment"
        ></app-common-input-field>
        <app-control-message-v35
          [control]="rechargeMyCreditsForm.controls.comment"
        ></app-control-message-v35>
      </div>
    </div>
  </form>
  <!-- modal body end -->
  <div class="flex justify-end gap-3 pt-8">
    <app-common-button-v35
      [type]="{ style: 'modal', name: 'main' }"
      text="Submit"
      width="124px"
      (clickEvent)="onSubmit()"
      [loading]="isLoading"
    ></app-common-button-v35>
  </div>
</div>
