<div>
  <!-- modal header -->
  <div class="flex justify-between pb-2 ocw_modal_header">
    <div class="pb-3 pl-1">
      <span
        class="w-full text-base text-main-text-color align-middle flex items-center"
      >
        <span class="pl-1 font-inter font-semibold text-base">
          Recharge the Card
        </span>
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXMark"
      ></fa-icon>
    </div>
  </div>
  <!-- modal body start -->

  <div class="w-full flex flex-col items-center justify-center">
    <app-amount-input
      [maxLength]="12"
      customClass="amount-input-v3 !border-b !border-semi-gray-color "
      [formControl]="amount"
    ></app-amount-input>
    <app-control-message-v35
      [control]="amount"
      [label]="controlMessage"
    ></app-control-message-v35>
  </div>

  <!-- modal body end -->
  <div class="flex justify-center gap-3 pt-8">
    <app-common-button-v35
      text="Recharge Now"
      (clickEvent)="addFund()"
      [type]="{ style: 'filled', name: 'main' }"
      [loading]="isLoading"
      customClasses="!px-8 !font-normal"
    ></app-common-button-v35>
  </div>
</div>
