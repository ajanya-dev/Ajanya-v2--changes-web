<div class="mb-2 relative -ml-2">
  <div
    class="absolute top-2 font left-3 font-semibold"
    [ngClass]="
      versionType() === 'v4'
        ? 'font-funnel !text-base text-v4-main-text-color'
        : 'font-inter !text-sm text-main-text-color'
    "
  >
    Transactions
  </div>
  <div class="transaction-table px-2">
    @if (versionType() === "v3") {
      <app-v3-data-table
        [columnDefs]="columnDefs"
        [tableId]="tableId"
        [frameworkComponents]="frameworkComponents"
      >
      </app-v3-data-table>
    } @else {
      <app-v4-data-table
        [columnDefs]="columnDefs"
        [tableId]="tableId"
        [frameworkComponents]="frameworkComponents"
        [showFloatingActionBar]="false"
      >
      </app-v4-data-table>
    }
  </div>
</div>
