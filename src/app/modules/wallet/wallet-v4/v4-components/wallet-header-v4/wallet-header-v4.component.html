<app-v4-page-header
  [title]="'Wallets'"
  subtitle="Manage your wallets and transactions"
  [actions]="headerActions"
  (actionClick)="onAction($event)"
>
  <span
    headerActions
    role="button"
    tabindex="0"
    class="text-xs whitespace-nowrap transition-colors font-semibold cursor-pointer text-v4-primary-brand-bold-color hover:underline"
    matTooltip="View ACH prenote verifications for your wallet bank accounts"
    (click)="openPrenoteAch()"
    (keydown.enter)="openPrenoteAch()"
    (keydown.space)="openPrenoteAch(); $event.preventDefault()"
  >
    ACH Prenote Transactions
  </span>
</app-v4-page-header>
