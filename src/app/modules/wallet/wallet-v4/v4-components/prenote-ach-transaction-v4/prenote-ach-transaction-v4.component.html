<div class="flex flex-col h-full w-full">
  <div class="flex flex-col h-full w-full">
    <!-- Title/subtitle go through the grid's own app-v4-page-header slot, so
         they sit in the standard header row above the action bar. -->
    <app-v4-data-table
      [columnDefs]="columnDefs"
      [tableId]="tableId"
      [frameworkComponents]="frameworkComponents"
      [defaultDisabledColumn]="fieldsShownByDefault"
      [showFloatingActionBar]="false"
      [useCustomEmptyState]="true"
      [emptyStateConfig]="{
        icon: 'shield-check',
        title: 'No prenote transactions yet',
        description:
          'Prenotes are sent automatically when a bank account is added to a wallet — their verification results will appear here',
        buttonText: 'Go to Wallets',
        buttonIcon: 'wallet'
      }"
      (emptyStateActionClick)="onEmptyStateGoToWallets()"
      [dynamicHeaderText]="'ACH Prenote Transactions'"
      [headerSubtitle]="
        'Track ACH prenote verifications and review their return reason codes'
      "
    />
  </div>
</div>
