@if ((walletDataService.walletAccountsSignal()?.data?.length ?? -1) !== 0) {
  <div class="mb-2 flex h-full flex-col">
    <!-- Transactions heading on the left of the grid toolbar row (saves a row), as on
         Bank Accounts. The toolbar stays rendered when the grid is empty. -->
    <ng-template #transactionsHeading>
      <h3 class="text-base font-semibold text-v4-main-text-color">
        Transactions
      </h3>
    </ng-template>
    <app-v4-data-table
      class="flex-1 min-h-0"
      [toolbarLeftTemplate]="transactionsHeading"
      [emptyStateKeepToolbar]="true"
      [columnDefs]="columnDefs"
      [tableId]="tableId"
      [frameworkComponents]="frameworkComponents"
      [showFloatingActionBar]="false"
      [useCustomEmptyState]="true"
      [emptyStateScopeKey]="selectedWalletData?.id"
      [emptyStateConfig]="{
        icon: 'arrow-left-right',
        title: 'No transactions yet',
        description: 'Money moving in and out of this wallet will appear here',
        buttonText: 'Send Money',
        buttonIcon: 'send',
        compact: true
      }"
      (emptyStateActionClick)="onEmptyStateSendMoney()"
    />
  </div>
}
