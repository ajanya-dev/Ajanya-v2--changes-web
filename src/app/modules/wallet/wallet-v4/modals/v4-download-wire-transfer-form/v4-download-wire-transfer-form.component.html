<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        {{ title }}
      </h1>
      <h2 class="text-xs text-v4-subtle-text-color">
        Download and print your transfer form
      </h2>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color flex flex-col gap-4">
    <!-- Description -->
    <p class="text-sm text-v4-secondary-text-color leading-relaxed">
      {{ description }}
    </p>

    <!-- Info Note -->
    <div class="flex gap-2.5 p-3 rounded-lg bg-v4-badge-info-bg-color">
      <lucide-icon
        [img]="InfoIcon"
        [size]="16"
        class="text-v4-badge-info-text-color flex-shrink-0 mt-0.5"
      />
      <p class="text-xs text-v4-badge-info-text-color leading-relaxed">
        {{ noteText }}
      </p>
    </div>

    <!-- Download Button -->
    <div class="flex justify-center">
      <app-common-button-v4
        [type]="{ style: 'primary', name: 'main' }"
        [text]="
          downloading()
            ? 'Downloading...'
            : 'Download Your Wire Instructions'
        "
        (clickEvent)="downloadWireForm()"
        [disabled]="downloading()"
        [loading]="downloading()"
        lucideIcon="download"
      />
    </div>
  </div>
  <!-- modal body end -->

  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      [mat-dialog-close]="false"
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Close"
    />
  </div>
</div>
