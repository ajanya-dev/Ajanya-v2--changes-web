<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Select Wire Type
      </h1>
      <h2 class="text-xs text-v4-subtle-text-color">
        Choose your wire transfer method
      </h2>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body -->
  <div class="p-6 bg-v4-tertiary-background-color flex flex-col gap-3">
    <!-- Domestic Wire -->
    <div
      class="flex items-center gap-3 p-4 rounded-lg border cursor-pointer transition-all"
      [ngClass]="
        selectedWireType === 'domestic'
          ? 'border-v4-primary-brand-color bg-v4-secondary-background-color'
          : 'border-v4-input-border-color bg-v4-input-background-color hover:bg-v4-secondary-background-color'
      "
      (click)="selectedWireType = 'domestic'"
      role="presentation"
    >
      <div
        class="w-4 h-4 rounded-full border-2 flex-shrink-0 flex items-center justify-center"
        [ngClass]="
          selectedWireType === 'domestic'
            ? 'border-v4-primary-brand-color'
            : 'border-v4-tertiary-text-color'
        "
      >
        @if (selectedWireType === "domestic") {
          <div class="w-2 h-2 rounded-full bg-v4-primary-brand-color"></div>
        }
      </div>
      <div>
        <p class="text-sm font-medium text-v4-main-text-color">Domestic Wire</p>
        <p class="text-xs text-v4-subtle-text-color">
          Transfer within the same country
        </p>
      </div>
    </div>

    <!-- International Wire -->
    <div
      class="flex items-center gap-3 p-4 rounded-lg border cursor-pointer transition-all"
      [ngClass]="
        selectedWireType === 'international'
          ? 'border-v4-primary-brand-color bg-v4-secondary-background-color'
          : 'border-v4-input-border-color bg-v4-input-background-color hover:bg-v4-secondary-background-color'
      "
      (click)="selectedWireType = 'international'"
      role="presentation"
    >
      <div
        class="w-4 h-4 rounded-full border-2 flex-shrink-0 flex items-center justify-center"
        [ngClass]="
          selectedWireType === 'international'
            ? 'border-v4-primary-brand-color'
            : 'border-v4-tertiary-text-color'
        "
      >
        @if (selectedWireType === "international") {
          <div class="w-2 h-2 rounded-full bg-v4-primary-brand-color"></div>
        }
      </div>
      <div>
        <p class="text-sm font-medium text-v4-main-text-color">
          International Wire
        </p>
        <p class="text-xs text-v4-subtle-text-color">
          Transfer across international borders
        </p>
      </div>
    </div>
  </div>

  <!-- modal footer -->
  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      [mat-dialog-close]="false"
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Confirm"
      (clickEvent)="onSubmit()"
    />
  </div>
</div>
