<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Recharge My Credits
      </h1>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <form [formGroup]="rechargeMyCreditsForm" class="flex flex-col gap-5">
      <!-- Amount -->
      <div class="flex flex-col items-center">
        <app-common-amount-input-v4
          formControlName="amount"
          [customClass]="'hero-input'"
          [maxLength]="15"
        />
        <app-control-message-v4
          [control]="rechargeMyCreditsForm.controls.amount"
          [customMessages]="{ min: 'This field is required' }"
        />
      </div>

      <!-- Memo -->
      <div>
        <app-common-input-v4
          formControlName="comment"
          [placeholder]="'Memo'"
          [maxLength]="50"
          [control]="rechargeMyCreditsForm.controls.comment"
          [fieldLabel]="'Memo'"
          [isFieldRequired]="true"
        />
      </div>

      <!-- From Wallet -->
      <div>
        <label class="block text-xs font-medium text-v4-secondary-text-color mb-1.5 font-peridot" for="fromWallet">From Wallet <span class="text-v4-common-red-color">*</span></label>
        <app-wallet-dropdown-v4
          placeholder="From Wallet Account"
          [formControl]="selectedWallet"
          [showLogoUpdateModal]="false"
          [labelIconNeeded]="true"
          [append]="'body'"
        />
        <app-control-message-v4
          [control]="rechargeMyCreditsForm.controls.fromWallet"
        />
      </div>
    </form>
  </div>
  <!-- modal body end -->

  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      [type]="{ style: 'primary', name: 'main' }"
      [text]="'Submit'"
      [width]="'124px'"
      [loading]="loading()"
      (clickEvent)="onSubmit()"
    />
  </div>
</div>
