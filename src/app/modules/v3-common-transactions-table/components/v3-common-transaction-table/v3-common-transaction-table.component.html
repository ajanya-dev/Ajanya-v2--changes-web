<div class="mb-2 relative">
  <div
    class="absolute top-2 text-main-text-color  font font-semibold"
    [ngClass]="versionType() === 'v4' ? 'font-funnel !text-base font-semibold text-v4-main-text-color' : 'font-inter !text-sm'"
  >
    Transactions
  </div>
  <div class="transaction-table">
    @if (versionType() === 'v3') {
    <app-v3-data-table
      [columnDefs]="columnDefs"
        [tableId]="tableId"
        [frameworkComponents]="frameworkComponents"
      >
      </app-v3-data-table>
    } @else {
      <app-v4-data-table
        [columnDefs]="columnDefs"
        [tableId]="tableId"
        [frameworkComponents]="frameworkComponents"
      >
      </app-v4-data-table>
    }
  </div>
</div>
