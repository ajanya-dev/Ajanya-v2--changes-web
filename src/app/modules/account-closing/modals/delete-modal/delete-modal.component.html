<div class="px-[6px] pb-[6px]">
  <!-- modal header -->
  <div class="flex justify-between pb-6">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
      @if(injectData?.enableBack){
        <fa-icon [mat-dialog-close]="false" class="!text-[20px] cursor-pointer" [icon]="faArrowLeft"></fa-icon>
        }
        <span class="pl-1 font-inter font-semibold text-base pb-0.5"
          >Confirm Password</span
        >
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      />
    </div>
  </div>
  <!-- modal body start -->
  <div>
    <div class="flex flex-col gap-2 pb-3">
      <h4 class="font-inter text-sm text-main-text-color font-normal">
        Please enter the password to confirm
      </h4>
      <span class="font-inter text-sm text-secondary-text-color font-medium">{{
        email ? email : userName
      }}</span>
    </div>
    <div [formGroup]="confirmAccount">
      <div>
        <app-common-input-field
          placeholder="Password"
          formControlName="password"
          type="password"
        />
        <app-control-message-v35 [control]="confirmAccount.controls.password" />
      </div>
    </div>
  </div>
  <!-- modal body end -->
  <div class="flex justify-end gap-3 pt-8">
    @if(injectData?.enableBack){
      <app-common-button-v35 [mat-dialog-close]="false" width="100px" [type]="{style:'bordered', name: 'main' }"
        text="Back"></app-common-button-v35>
      }
    <app-common-button-v35
      width="125px"
      [type]="{ style: 'modal', name: 'main' }"
      text="Continue"
      [loading]="isSubmit()"
      [disabled]="isSubmit()"
      (clickEvent)="submit()"
    />
  </div>
</div>
