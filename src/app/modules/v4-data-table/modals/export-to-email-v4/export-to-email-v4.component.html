<div class="font-peridot">
  <!-- Modal Header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-base font-semibold text-v4-main-text-color font-funnel">
        Export To Email
      </h1>
      <h2 class="text-xs text-v4-subtle-text-color">
        Send the exported table data to an email address
      </h2>
    </div>
    <div
      (click)="close()"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- Modal Body -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <form [formGroup]="emailForm" class="flex flex-col gap-4">
      <app-common-input-v4
        fieldLabel="Email ID"
        [placeholder]="'Email ID'"
        [control]="emailForm.controls.emailId"
        formControlName="emailId"
        [maxLength]="64"
      />

      <app-common-input-v4
        fieldLabel="Subject"
        [placeholder]="'Subject'"
        [control]="emailForm.controls.subject"
        formControlName="subject"
        [maxLength]="50"
      />

      <div>
        <label
          for="message"
          class="mb-1 block text-xs font-medium text-v4-subtle-text-color"
        >
          Message
        </label>
        <textarea
          class="v4-input-style w-full resize-none rounded-[10px] border border-input-border-color px-4 py-3 text-sm text-v4-main-text-color placeholder-v4-subtle-text-color outline-none transition-colors focus:ring-2 focus:ring-v4-brand-border-color focus:border-v4-brand-border-color shadow-sm"
          rows="4"
          placeholder="Message"
          id="message"
          formControlName="message"
          maxlength="50"
        ></textarea>
        <app-control-message-v4
          [control]="emailForm.controls.message"
          [isMarginTopEnabled]="false"
          [marginTopOverride]="'mt-1'"
        />
      </div>
    </form>
  </div>

  <!-- Modal Footer -->
  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      [text]="'Cancel'"
      (clickEvent)="close()"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      [text]="'Send Email'"
      (clickEvent)="sendEmail()"
    />
  </div>
</div>
