<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Export To Email
      </h1>
      <h2 class="text-xs text-v4-subtle-text-color">
        Send table data via email
      </h2>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <form [formGroup]="emailForm" class="flex flex-col gap-4">
      <app-common-input-v4
        fieldLabel="Email ID"
        placeholder="Enter email address"
        [isFieldRequired]="true"
        [control]="emailForm.controls.emailId"
        [formControl]="emailForm.controls.emailId"
      />
      <app-common-input-v4
        fieldLabel="Subject"
        placeholder="Enter subject"
        [isFieldRequired]="true"
        [control]="emailForm.controls.subject"
        [formControl]="emailForm.controls.subject"
      />
      <div class="flex flex-col gap-1.5">
        <label
          class="text-[13px] font-medium text-v4-main-text-color font-peridot"
        >
          Message
        </label>
        <textarea
          formControlName="message"
          placeholder="Enter message (optional)"
          rows="4"
          class="w-full rounded-lg border border-v4-border-color bg-v4-secondary-background-color px-3 py-2.5 text-sm text-v4-main-text-color placeholder:text-v4-subtle-text-color font-peridot focus:outline-none focus:ring-1 focus:ring-v4-primary-brand-color resize-y"
        ></textarea>
      </div>
    </form>
  </div>
  <!-- modal body end -->

  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Send Email"
      (clickEvent)="sendEmail()"
      [disabled]="isSubmitting()"
      [loading]="isSubmitting()"
    />
  </div>
</div>
