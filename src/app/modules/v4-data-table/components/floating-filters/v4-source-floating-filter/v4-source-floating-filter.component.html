<div class="flex items-center !w-full px-[1px] font-peridot">
  @if (!filterText) {
    <app-v4-select-dropdown
      class="w-full"
      [items]="sourceTypes"
      [placeholder]="'Filter source...'"
      [(ngModel)]="filterText"
      (selectionChange)="onFilterTextChange()"
    />
  }
  @if (filterText) {
    <div class="flex flex-row gap-1 w-full items-center">
      @if (filterText === "BANK") {
        <app-v4-common-dropdown
          class="flex-1"
          [config]="{
            placeholder: 'Select Bank',
            displayField: 'nickName',
            outputField: 'id',
            style: { size: 1 },
            extraStyles: 'v4-ff-source-dropdown'
          }"
          [listData]="bankSourceData()"
          [(ngModel)]="selectedBankSourceId"
          [searchable]="true"
          [searchFn]="searchFn"
          [loading]="bankSearchLoading()"
          [clearable]="true"
          [appendTo]="'body'"
          (ngModelChange)="onSourceSelectionChange('BANK')"
          (searchEvent)="onSearch($event, 'BANK')"
          (clearEvent)="onClearSearch('BANK')"
          (selectClose)="onDropdownClose('BANK')"
          (scrollToEnd)="onScrollToEnd()"
        />
        <div
          role="button"
          tabindex="0"
          class="flex items-center justify-center cursor-pointer p-0.5 hover:bg-v4-tertiary-background-color rounded"
          (click)="clearSubFilter()"
          (keydown.enter)="clearSubFilter()"
          (keydown.space)="clearSubFilter(); $event.preventDefault()"
        >
          <lucide-icon
            name="x"
            [size]="12"
            class="text-v4-subtle-text-color"
          ></lucide-icon>
        </div>
      }

      @if (filterText === "WALLET") {
        <app-v4-common-dropdown
          class="flex-1"
          [config]="{
            placeholder: 'Select Wallet',
            displayField: 'walletName',
            outputField: 'id',
            style: { size: 1 },
            extraStyles: 'v4-ff-source-dropdown'
          }"
          [listData]="walletSourceData()"
          [(ngModel)]="selectedWalletSourceId"
          [searchable]="true"
          [searchFn]="searchFn"
          [loading]="walletSearchLoading()"
          [clearable]="true"
          [appendTo]="'body'"
          (ngModelChange)="onSourceSelectionChange('WALLET')"
          (searchEvent)="onSearch($event, 'WALLET')"
          (clearEvent)="onClearSearch('WALLET')"
          (selectClose)="onDropdownClose('WALLET')"
          (scrollToEnd)="onScrollToEnd()"
          [isPermissionDenied]="!paymentsService.hasPermission.wallet"
        />
        <div
          role="button"
          tabindex="0"
          class="flex items-center justify-center cursor-pointer p-0.5 hover:bg-v4-tertiary-background-color rounded"
          (click)="clearSubFilter()"
          (keydown.enter)="clearSubFilter()"
          (keydown.space)="clearSubFilter(); $event.preventDefault()"
        >
          <lucide-icon
            name="x"
            [size]="12"
            class="text-v4-subtle-text-color hover:text-v4-tertiary-text-color"
          ></lucide-icon>
        </div>
      }

      @if (filterText === "CARD") {
        <app-v4-common-dropdown
          class="flex-1"
          [config]="{
            placeholder: 'Select Card',
            displayField: 'nickName',
            outputField: 'cardId',
            style: { size: 1 },
            extraStyles: 'v4-ff-source-dropdown'
          }"
          [listData]="cardSourceData()"
          [(ngModel)]="selectedCardSourceId"
          [searchable]="true"
          [searchFn]="searchFn"
          [loading]="cardSearchLoading()"
          [clearable]="true"
          [appendTo]="'body'"
          (ngModelChange)="onSourceSelectionChange('CARD')"
          (searchEvent)="onSearch($event, 'CARD')"
          (clearEvent)="onClearSearch('CARD')"
          (selectClose)="onDropdownClose('CARD')"
          (scrollToEnd)="onScrollToEnd()"
        />
        <div
          role="button"
          tabindex="0"
          class="flex items-center justify-center cursor-pointer p-0.5 hover:bg-v4-tertiary-background-color rounded"
          (click)="clearSubFilter()"
          (keydown.enter)="clearSubFilter()"
          (keydown.space)="clearSubFilter(); $event.preventDefault()"
        >
          <lucide-icon
            name="x"
            [size]="12"
            class="text-v4-subtle-text-color"
          ></lucide-icon>
        </div>
      }
    </div>
  }
</div>
