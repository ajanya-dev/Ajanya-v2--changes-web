<div class="v4-common-dropdown compact relative w-full font-peridot px-[1px]">
  <button
    type="button"
    cdkOverlayOrigin
    #trigger="cdkOverlayOrigin"
    (click)="toggleDropdown()"
    class="flex items-center w-full"
    [ngClass]="
      hasSelection
        ? 'border-v4-primary-brand-color text-v4-primary-brand-color'
        : ''
    "
  >
    <span
      class="flex-1 text-left truncate"
      [ngClass]="
        hasSelection ? 'text-v4-main-text-color' : 'text-v4-subtle-text-color'
      "
    >
      {{ displayText || "All Types" }}
    </span>
    @if (hasSelection) {
      <span
        role="button"
        tabindex="0"
        (click)="clear($event)"
        (keydown.enter)="clear($event)"
        (keydown.space)="clear($event); $event.preventDefault()"
        class="p-0.5 hover:bg-v4-tertiary-background-color rounded mr-1 cursor-pointer"
      >
        <lucide-icon
          name="x"
          [size]="10"
          class="text-v4-subtle-text-color"
        ></lucide-icon>
      </span>
    }
    <lucide-icon
      name="chevron-down"
      [size]="14"
      class="text-v4-subtle-text-color transition-transform"
      [ngClass]="isOpen ? 'rotate-180' : ''"
    ></lucide-icon>
  </button>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="trigger"
    [cdkConnectedOverlayOpen]="isOpen"
    [cdkConnectedOverlayHasBackdrop]="true"
    cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
    (backdropClick)="closeDropdown()"
    [cdkConnectedOverlayPositions]="overlayPositions"
    [cdkConnectedOverlayMinWidth]="160"
  >
    <div
      class="v4-common-dropdown-panel compact flex flex-col max-h-[200px]"
    >
      <div class="overflow-y-auto flex-1">
        <!-- All option -->
        <div
          role="button"
          tabindex="0"
          class="v4-dropdown-item gap-2"
          [class.selected]="!hasSelection"
          (click)="selectItem(null)"
          (keydown.enter)="selectItem(null)"
          (keydown.space)="selectItem(null); $event.preventDefault()"
        >
          <span class="truncate">All</span>
          @if (!hasSelection) {
            <lucide-icon
              name="check"
              [size]="12"
              class="ml-auto"
            ></lucide-icon>
          }
        </div>

        <!-- Type options -->
        @for (
          item of walletDataService.walletTransactionTypes;
          track item.subject_type
        ) {
          <div
            role="button"
            tabindex="0"
            class="v4-dropdown-item gap-2"
            [class.selected]="isSelected(item)"
            (click)="selectItem(item)"
            (keydown.enter)="selectItem(item)"
            (keydown.space)="selectItem(item); $event.preventDefault()"
          >
            <span class="truncate">{{ item.name }}</span>
            @if (isSelected(item)) {
              <lucide-icon
                name="check"
                [size]="12"
                class="ml-auto"
              ></lucide-icon>
            }
          </div>
        }

        @if (!walletDataService.walletTransactionTypes?.length) {
          <div
            class="px-2 py-3 text-xs text-v4-tertiary-text-color text-center"
          >
            No types found
          </div>
        }
      </div>
    </div>
  </ng-template>
</div>
