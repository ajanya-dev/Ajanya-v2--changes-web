<div class="relative w-full font-peridot px-[1px]">
  <!-- Trigger -->
  <div
    cdkOverlayOrigin
    #trigger="cdkOverlayOrigin"
    role="button"
    tabindex="0"
    (click)="isOpen = !isOpen"
    (keydown.enter)="isOpen = !isOpen"
    (keydown.space)="isOpen = !isOpen; $event.preventDefault()"
    class="w-full h-7 px-2 py-1 text-[12px] border border-v4-input-border-color rounded-md focus:outline-none focus:ring-1 focus:ring-v4-brand-focus-color focus:border-v4-brand-border-color bg-v4-secondary-background-color text-left flex items-center gap-1 cursor-pointer"
  >
    <lucide-icon
      name="calendar-days"
      [size]="12"
      class="text-v4-subtle-text-color flex-shrink-0"
    ></lucide-icon>
    <span
      class="flex-1 truncate"
      [ngClass]="
        selectedDateRangeName !== 'All Time'
          ? 'text-v4-main-text-color font-medium'
          : 'text-v4-tertiary-text-color'
      "
    >
      {{ selectedDateRangeName }}
    </span>
    @if (selectedDateRangeName !== "All Time") {
      <button
        type="button"
        (click)="resetFilter(); $event.stopPropagation()"
        class="p-0.5 hover:bg-v4-tertiary-background-color rounded"
        aria-label="Clear date filter"
      >
      <lucide-icon
        name="circle-x"
        [size]="12"
        class="text-v4-subtle-text-color hover:text-v4-tertiary-text-color"
      ></lucide-icon>
      </button>
    }
  </div>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="trigger"
    [cdkConnectedOverlayOpen]="isOpen"
    [cdkConnectedOverlayHasBackdrop]="true"
    cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
    (backdropClick)="isOpen = false"
    [cdkConnectedOverlayPositions]="overlayPositions"
  >
    <div
      class="bg-v4-popup-background-color border-2 border-v4-border-color rounded-lg shadow-lg min-w-[340px] font-peridot"
    >
      <div class="flex">
        <!-- Left side: Predefined date range options -->
        <div class="w-[140px] border-r border-v4-border-color py-1">
          @for (item of dateRanges; track item.id) {
            <button
              type="button"
              (click)="selectDateRange(item.id)"
              class="w-full px-3 py-1.5 text-xs text-left flex items-center justify-between hover:bg-v4-tertiary-background-color transition-colors"
              [ngClass]="
                item.name === selectedDateRangeName
                  ? 'bg-v4-badge-info-bg-color text-v4-primary-brand-color font-medium'
                  : 'text-v4-main-text-color'
              "
            >
              <span>{{ item.name }}</span>
              @if (item.name === selectedDateRangeName) {
                <lucide-icon
                  name="chevron-right"
                  [size]="12"
                  class="text-v4-primary-brand-color"
                ></lucide-icon>
              }
            </button>
          }
        </div>

        <!-- Right side: Date inputs -->
        <div class="flex-1 p-3">
          <div class="space-y-3">
            <div>
              <app-v4-date-picker
                placeholder="From"
                fieldLabel="From"
                [fieldHeight]="'32px'"
                [isFieldRequired]="false"
                [(ngModel)]="fromDateStr"
                (ngModelChange)="onFromDateChange($event)"
              />
            </div>

            <div>
              <app-v4-date-picker
                placeholder="To"
                fieldLabel="To"
                [fieldHeight]="'32px'"
                [isFieldRequired]="false"
                [(ngModel)]="toDateStr"
                (ngModelChange)="onToDateChange($event)"
              />
            </div>

            <div class="flex gap-2 pt-2">
              <app-common-button-v4
                class="flex-1"
                [type]="{ style: 'outline', name: 'compact' }"
                [text]="'Clear'"
                (clickEvent)="resetFilter()"
              />
              <app-common-button-v4
                class="flex-1"
                [type]="{ style: 'primary', name: 'compact' }"
                [text]="'Done'"
                (clickEvent)="applyCustomFilter()"
              />
            </div>
          </div>
        </div>
      </div>
    </div>
  </ng-template>
</div>
