<div class="relative w-full font-peridot px-[1px]">
  <input
    type="text"
    inputmode="decimal"
    [value]="currentValue ? '$' + currentValue : ''"
    [placeholder]="placeholder"
    (input)="onInput($event)"
    (keydown)="onKeyDown($event)"
    (paste)="onPaste($event)"
    (blur)="onBlur()"
    class="w-full h-7 px-2 pr-6 py-1 text-[12px] border border-v4-input-border-color rounded-md focus:outline-none focus:ring-1 focus:ring-v4-brand-focus-color focus:border-v4-brand-border-color bg-v4-secondary-background-color text-v4-main-text-color placeholder-v4-subtle-text-color"
  />
  @if (currentValue) {
    <button
      type="button"
      (click)="clearFilter()"
      class="absolute right-1 top-1/2 -translate-y-1/2 w-4 h-4 flex items-center justify-center text-v4-subtle-text-color hover:text-v4-tertiary-text-color focus:outline-none cursor-pointer"
      aria-label="Clear filter"
    >
      <fa-icon
        [icon]="faCircleXmark"
        class="text-v4-subtle-text-color hover:text-v4-tertiary-text-color text-sm"
      ></fa-icon>
    </button>
  }
</div>
