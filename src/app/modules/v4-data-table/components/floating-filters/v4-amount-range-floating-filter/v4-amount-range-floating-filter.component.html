<div class="relative w-full font-peridot">
  <button
    type="button"
    cdkOverlayOrigin
    #trigger="cdkOverlayOrigin"
    (click)="isOpen = !isOpen"
    class="w-full h-7 px-2 py-1 text-[12px] border rounded-md focus:outline-none focus:ring-1 focus:ring-v4-brand-focus-color focus:border-v4-brand-border-color bg-v4-secondary-background-color text-left truncate"
    [ngClass]="
      hasActiveFilter
        ? 'border-v4-primary-brand-color text-v4-main-text-color'
        : 'border-v4-input-border-color text-v4-subtle-text-color'
    "
  >
    {{ displayText }}
  </button>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="trigger"
    [cdkConnectedOverlayOpen]="isOpen"
    [cdkConnectedOverlayHasBackdrop]="true"
    cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
    (backdropClick)="isOpen = false"
    [cdkConnectedOverlayPositions]="overlayPositions"
  >
    <div
      class="bg-v4-popup-background-color border-2 border-v4-border-color rounded-lg shadow-lg p-4 w-52 font-peridot"
    >
      <div class="space-y-3">
        <!-- Min Amount -->
        <div>
          <label
            class="block text-xs font-medium text-v4-main-text-color mb-1"
            >{{ minLabel }}</label
          >
          <input
            type="text"
            inputmode="decimal"
            placeholder="0"
            [(ngModel)]="minValue"
            (keydown.enter)="applyRange()"
            (keydown.escape)="isOpen = false"
            (input)="validateInput($event, 'min')"
            class="w-full px-3 py-2 text-sm border border-v4-input-border-color rounded-md focus:outline-none focus:ring-1 focus:ring-v4-brand-focus-color focus:border-v4-brand-border-color bg-v4-secondary-background-color text-v4-main-text-color"
          />
        </div>

        <!-- Max Amount -->
        <div>
          <label
            class="block text-xs font-medium text-v4-main-text-color mb-1"
            >{{ maxLabel }}</label
          >
          <input
            type="text"
            inputmode="decimal"
            placeholder="999999"
            [(ngModel)]="maxValue"
            (keydown.enter)="applyRange()"
            (keydown.escape)="isOpen = false"
            (input)="validateInput($event, 'max')"
            class="w-full px-3 py-2 text-sm border border-v4-input-border-color rounded-md focus:outline-none focus:ring-1 focus:ring-v4-brand-focus-color focus:border-v4-brand-border-color bg-v4-secondary-background-color text-v4-main-text-color"
          />
        </div>

        <!-- Buttons -->
        <div class="flex gap-2 pt-1">
          <button
            type="button"
            (click)="clearRange()"
            class="flex-1 px-3 py-2 text-xs font-medium text-v4-main-text-color bg-v4-tertiary-background-color hover:bg-v4-input-background-color rounded-md transition-colors"
          >
            {{ clearLabel }}
          </button>
          <button
            type="button"
            (click)="applyRange()"
            class="flex-1 px-3 py-2 text-xs font-medium text-white bg-v4-primary-brand-color hover:bg-v4-primary-brand-bold-color rounded-md transition-colors"
          >
            {{ applyLabel }}
          </button>
        </div>
      </div>
    </div>
  </ng-template>
</div>
