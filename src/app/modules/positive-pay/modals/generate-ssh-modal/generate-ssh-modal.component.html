<div class="px-[6px] pb-[6px]">
  <!-- modal header -->
  <div class="flex justify-between pb-6">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
        <span class="pl-1 font-inter font-semibold text-base pb-0.5"
          >Generate SSH File</span
        >
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      ></fa-icon>
    </div>
  </div>
  <!-- modal body start -->
  <div [formGroup]="sshForm" class="flex flex-col gap-4">
    <div>
      <app-common-input-field
        placeholder="File Name"
        formControlName="fileName"
        maxlength="40"
      />
      <app-control-message-v35 [control]="sshForm.controls.fileName" />
    </div>
    <div class="single_input">
      <select
        name=""
        id=""
        class="input_style"
        formControlName="sshType"
        (change)="onChange($event?.target?.value)"
      >
        <option [selected]="' '" desabled>Auth type</option>
        <option value="1" selected>Create New</option>
        <option value="2">Create From Existing</option>
      </select>
      <span class="floating_label_field"
        >Auth type <span class="required">*</span></span
      >
      <app-control-message-v35 [control]="sshForm.controls.sshType" />
    </div>

    <div class="single_input">
      <select name="" id="" class="input_style" formControlName="rsaSize">
        <option value="1024" selected>1024</option>
        <option value="2048">2048</option>
        <option value="4096">4096</option>
      </select>
      <span class="floating_label_field"
        >RSA Key Size <span class="required">*</span></span
      >
      <app-control-message-v35 [control]="sshForm.controls.rsaSize" />
    </div>
    @if (showTextArea()) {
      <div class="single_input">
        <textarea
          style="height: 232px"
          type="textarea"
          formControlName="privateKey"
          class="input_style"
          id="categoryName"
          placeholder=" "
        ></textarea>
        <span class="floating_label_field"
          >Private Key <span class="required">*</span></span
        >
        <app-control-message-v35 [control]="sshForm.controls.privateKey" />
      </div>
    }
  </div>
  <!-- modal body end -->
  <div class="flex justify-end gap-3 pt-8">
    <app-common-button-v35
      width="120px"
      mat-dialog-close
      [type]="{ style: 'bordered', name: 'main' }"
      text="Cancel"
    ></app-common-button-v35>
    <app-common-button-v35
      width="120px"
      [type]="{ style: 'modal', name: 'main' }"
      text="Save"
      [loading]="isSubmit()"
      [disabled]="isSubmit()"
      (clickEvent)="submit()"
    ></app-common-button-v35>
  </div>
</div>
