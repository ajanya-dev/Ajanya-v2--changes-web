<div class="px-[6px] pb-[6px]">
  <div class="flex justify-between pb-6">
    <div>
      <span class="mt-18 w-full text-base text-main-text-color align-middle flex items-center">
        <span class="pl-1 font-inter font-semibold text-base pb-0.5">Export Positive Pay File</span>
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon class="text-secondary-text-color cursor-pointer" [icon]="faXmark"></fa-icon>
    </div>
  </div>
  <div>
    <form [formGroup]="exportForm">
      <div class="input_group">
        <app-date-range-selector-v35 (dateEmiter)="selectedRange($event)" selectDate="today" />
        <div class="single_input pt-6 flex gap-5">
          <span class="font-inter font-normal text-main-text-color text-base">Export As:</span>
          <mat-radio-group aria-label="Select an option" formControlName="fileType" class="flex gap-5">
            <mat-radio-button value="txt">
              <span class="font-inter font-normal text-secondary-text-color text-sm">TXT</span>
            </mat-radio-button>
            <mat-radio-button value="csv">
              <span class="font-inter font-normal text-secondary-text-color text-sm">CSV</span>
            </mat-radio-button>
            <mat-radio-button value="xlsx">
              <span class="font-inter font-normal text-secondary-text-color text-sm">EXCEL</span>
            </mat-radio-button>
          </mat-radio-group>
        </div>
      </div>
    </form>
  </div>
  <div class="flex justify-end gap-3 pt-8">
    <app-common-button-v35 [type]="{style:'modal', name: 'main' }" text="EXPORT" (clickEvent)="submit()"
      [loading]="loading" [disabled]="loading"></app-common-button-v35>
  </div>
</div>
