<div class="px-[6px] pb-[6px]">
  <!-- modal header -->
  <div class="flex justify-between pb-6">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
        <span class="pl-1 font-inter font-semibold text-base pb-0.5"
          >Set Positive Pay Details</span
        >
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      ></fa-icon>
    </div>
  </div>
  <!-- modal body start -->
  <div [formGroup]="settingsForm" class="flex flex-col gap-4">
    <div>
      <app-common-input-field
        placeholder="Bank Id"
        formControlName="bankId"
        maxlength="40"
        [isFieldRequired]="false"
      />
      <app-control-message-v35 [control]="settingsForm.controls.bankId" />
    </div>
    <div>
      <app-common-input-field
        placeholder="Upload folder path"
        formControlName="folderPath"
        maxlength="100"
        [isFieldRequired]="false"
      />
      <app-control-message-v35 [control]="settingsForm.controls.folderPath" />
    </div>
    <div>
      <app-common-input-field
        placeholder="File name"
        formControlName="fileName"
        maxlength="40"
        [isFieldRequired]="false"
      />
      <app-control-message-v35 [control]="settingsForm.controls.fileName" />
    </div>
  </div>
  <!-- modal body end -->
  <div class="flex justify-end gap-3 pt-8">
    <app-common-button-v35
      width="120px"
      mat-dialog-close
      [type]="{ style: 'bordered', name: 'main' }"
      text="Cancel"
    ></app-common-button-v35>
    <app-common-button-v35
      width="120px"
      [type]="{ style: 'modal', name: 'main' }"
      text="Save"
      (clickEvent)="submit()"
      [disabled]="btnDesable"
      [loading]="btnDesable"
    ></app-common-button-v35>
  </div>
</div>
