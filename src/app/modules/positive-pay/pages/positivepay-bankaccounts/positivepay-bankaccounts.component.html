<div class="ocw_man_modal_wrapper relative">
  <!-- modal header -->
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">
      Set Bank Accounts
      <i
        class="fa-regular fa-circle-info text-sm"
        matTooltip="Choose the bank accounts to set Positive Pay"
      ></i>
    </div>
    <div class="close_btn" [mat-dialog-close]="false">
      <i class="fa-solid fa-xmark"></i>
    </div>
  </div>
  <!-- modal body start -->
  <div class="ocw_modal_body">
    <ng-container>
      <div class="select-all">
        <input
          type="checkbox"
          [(ngModel)]="isSelectAll"
          (change)="selectAll($event)"
        />
        Select All
      </div>
      <div class="single_input">
        <app-drop-down-bank-multi-select
          [routingNumber]="routingNumber"
          [selectedBankAccounts]="bankAccounts"
          [selectAll]="isChecked"
          [placeholder]="'All Bank Accounts'"
          (selectionEvent)="bankSlectionEvent($event)"
          appendTo="body"
        ></app-drop-down-bank-multi-select>
        <span></span>
      </div>
    </ng-container>
  </div>
  <!-- modal body end -->
  <div class="footer flex justify-end">
    <mat-dialog-actions class="buttons">
      <button
        (click)="savePostivePayBankAccounts()"
        type="submit"
        class="ocw-btn ocw-btn-modal-blue add_btn download_btn positve-btn"
      >
        <span>Save</span>
        <span
          [ngStyle]="{ display: loading ? 'block' : 'none' }"
          class="loadingSpinner"
        ></span>
      </button>
    </mat-dialog-actions>
  </div>
</div>
