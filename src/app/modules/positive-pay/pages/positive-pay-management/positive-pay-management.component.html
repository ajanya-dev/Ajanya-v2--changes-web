<div class="bg-secondary-background-color">
  <div
    class="common-transaction-table-container relative pt-3 px-5 bg-main-background-color"
  >
    <div class="transaction-table">
      <app-v3-data-table
        [columnDefs]="columnDefs"
        [tableId]="tableId"
        [frameworkComponents]="frameworkComponents"
        [defaultColumnFields]="columnFields"
        dynamicHeaderText="Positive Pay Management"
        selectedPanelButton="id_all"
        [headerElements]="headerElements()"
        (headerButtonEvent)="headerButtonClick($event)"
        [backButtonEnabled]="true"
        (rowSelected)="onRowSelected($event)"
        [exportConfig]="exportConfig"
      >
      </app-v3-data-table>
    </div>
  </div>
</div>
