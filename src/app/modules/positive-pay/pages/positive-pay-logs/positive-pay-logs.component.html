<div class="data-table-wrapper">
  <div class="data-table-wrapper bg-main-background-color flex-1 rounded">
    <div class="px-5 pt-3">
      <app-v3-data-table
        dynamicHeaderText="Positive Pay Logs"
        class="overflow-auto"
        domLayout="autoHeight"
        [backButtonEnabled]="true"
        [columnDefs]="columnDefs"
        [defaultColumnFields]="columnFields"
        [tableId]="tableId"
        [headerElements]="headerElements"
        [frameworkComponents]="frameworkComponents"
        (rowClicked)="rowClicked($event)"
        [deselectedColumns]="deselectedColumns"
      >
      </app-v3-data-table>
    </div>
  </div>
</div>
