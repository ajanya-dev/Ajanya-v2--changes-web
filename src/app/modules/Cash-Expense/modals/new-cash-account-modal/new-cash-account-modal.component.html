<div class="ocw_man_modal_wrapper add_cash_modal">

    <form [formGroup]="cashForm" (ngSubmit)='submit()'>
      <div class="ocw_modal_header">
        <div class="ocw_modal_title">
          Add New Cash Account
        </div>
        <div class="close_btn" [mat-dialog-close]="false">
          <svg aria-hidden="true" focusable="false" data-prefix="fal" data-icon="times"
            class="svg-inline--fa fa-times fa-w-10" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512">
            <path fill="currentColor"
              d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z">
            </path>
          </svg>
        </div>
      </div>

      <!-- modal body start -->
      <div class="ocw_modal_body">
        <div class="input_group cash_credential">
          <div class="single_input">
            <input type="text" formControlName="cashAccountName" class="input_style " id="AccName" maxlength="60"
              placeholder=" ">
            <label class="floating_label_field">Cash Account Name <span class="required">*</span></label>
            <app-control-message [control]="cashForm.controls.cashAccountName"></app-control-message>
          </div>
        </div>
        <div class="input_group cash_detail">
          <div class="single_input">
            <input type="text" formControlName="cashAccountNickName" class="input_style require_fields" id="nickName"
              maxlength="30" placeholder=" ">
            <label class="floating_label_field">Nick Name <span class="required">*</span></label>
            <app-control-message [control]="cashForm.controls.cashAccountNickName"></app-control-message>
          </div>
        </div>
        <div class="input_group cash_credential">
          <div class="single_input">
            <input type="text" formControlName="cashAccountStartingBalance" maxlength="9" class="input_style" (keypress)="utils.numberOnly($event,'numeric');"
              id="cashAccountStartingBalance" placeholder=" ">
            <label class="floating_label_field">Starting Balance<span class="required">*</span></label>
            <app-control-message [control]="cashForm.controls.cashAccountStartingBalance"></app-control-message>
          </div>
        </div>
       </div>
      <!-- modal body end -->

      <div class="ocw_modal_footer">
        <mat-dialog-actions align="end">
          <button mat-dialog-close class="ocw-btn ocw-btn-modal-bordered">Close</button>
          <button type="submit" class="ocw-btn ocw-btn-modal-blue add_btn" [disabled]="loading">
            @if (!loading) {
              <svg aria-hidden="true" focusable="false" data-prefix="fas" data-icon="plus"
                class="svg-inline--fa fa-plus fa-w-14" role="img" xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 448 512">
                <path fill="currentColor"
                  d="M416 208H272V64c0-17.67-14.33-32-32-32h-32c-17.67 0-32 14.33-32 32v144H32c-17.67 0-32 14.33-32 32v32c0 17.67 14.33 32 32 32h144v144c0 17.67 14.33 32 32 32h32c17.67 0 32-14.33 32-32V304h144c17.67 0 32-14.33 32-32v-32c0-17.67-14.33-32-32-32z">
                </path>
              </svg>
              <span>Save</span>
            }
            @if (loading) {
              <span class="loadingSpinner"></span>
            }
          </button>
        </mat-dialog-actions>
      </div>
    </form>

  </div>
