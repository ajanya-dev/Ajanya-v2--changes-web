<div
  class="ocw_man_modal_wrapper transition-all duration-500 overflow-hidden"
>
  <!-- modal header -->
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">Request payee to sign on receipt</div>
    <div class="close_btn" [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      ></fa-icon>
    </div>
  </div>
  <!-- modal body start -->
  <div class="ocw_modal_body getRecieptBody">
    <div class="justify-content-center">
      <mat-radio-group
        (change)="setReceiptType($event)"
        aria-label="Select an option"
        class="flex flex-col w-full justify-evenly input-text-color radios"
      >
        <div class="flex gap-4 items-center justify-start">
          <div>
            <mat-radio-button value="2" checked="checked">SMS</mat-radio-button>
          </div>
          <div>
            <form [formGroup]="frmGetReceiptSMS">
              <div class="form_group__wrapper">
                <div class="single_input no_modal_btn mt-4">
                  <div class="form_groups">
                    <div class="single_input">
                      <app-new-phone-input
                        formControlName="payee_phone"
                        placeholder="Payee Mobile Number"
                        (countryDropdown)="countryChanges($event)"
                      >
                      </app-new-phone-input>
                      @if (receiptType === "2") {
                        <app-control-message
                          [control]="frmGetReceiptSMS.controls.payee_phone"
                        >
                        </app-control-message>
                      }
                    </div>

                    <button
                      [disabled]="loader.smsReceipt"
                      class="ocw-btn-modal-blue flex items-center sent font-inter"
                      (click)="submit2()"
                    >
                      Send <span>SMS</span>
                      @if (loader.smsReceipt) {
                        <span
                          class="loadingSpinner after:border-x-transparent after:border-y-white"
                        ></span>
                      } @else {
                        <fa-icon [icon]="['fas', 'paper-plane']"></fa-icon>
                      }
                    </button>
                  </div>
                  <p class="text-sm font-semibold font-inter">
                    Cost:
                    <span class="text-common-green-color">
                      ${{
                        frmGetReceiptSMS.controls.payee_phone.value &&
                        receiptType === "2"
                          ? "0.50"
                          : "0.00"
                      }}
                    </span>
                  </p>
                </div>
              </div>
            </form>
          </div>
        </div>
        <div class="flex gap-2 mt-5 items-center justify-start">
          <div>
            <mat-radio-button value="1">E-Mail</mat-radio-button>
          </div>
          <div>
            <form [formGroup]="frmGetReceiptEmail">
              <div class="form_group__wrapper">
                <div class="form_groups">
                  <div class="single_input no_modal_btn">
                    <input
                      id="payeeEmail"
                      type="text"
                      class="input_style !w-[229px]"
                      formControlName="payeeEmail"
                      placeholder=" "
                    />
                    <label
                      class="floating_label_field font-inter !text-main-text-color"
                      >Payee Email<span class="required">*</span></label
                    >
                    @if (receiptType !== "2") {
                      <app-control-message
                        [control]="frmGetReceiptEmail.controls.payeeEmail"
                      ></app-control-message>
                    }
                  </div>
                  <button
                    [disabled]="loader.emailReceipt"
                    class="ocw-btn-modal-blue flex items-center sent"
                    (click)="submit1()"
                  >
                    Send <span>Email</span>
                    @if (loader.emailReceipt) {
                      <span
                        class="loadingSpinner after:border-x-transparent after:border-y-white"
                      ></span>
                    } @else {
                      <fa-icon [icon]="['fas', 'paper-plane']"></fa-icon>
                    }
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </mat-radio-group>
    </div>
  </div>
</div>
