<div class="data-table-wrapper bg-main-background-color">
  <div class="px-5 pt-3 relative">
    @if(selectedPanelButton === 'transaction_list'){
      <div class="absolute top-[48px] right-[200px] max-xl:top-[10px]">
        <div class="flex items-center gap-2 font-inter">
          <div class="flex items-center gap-1 bg-secondary-background-color rounded-md p-2" [ngClass]="{'skelton': isSummaryLoading()}">
            <div class="w-5 h-5 rounded-full bg-main-background-color flex items-center justify-center">
              <fa-icon [icon]="faDollarSign" class="text-common-green-color text-sm" />
            </div>
            <span class="text-sm font-medium text-secondary-text-color">Total Income</span>
            <span class="text-xs text-secondary-text-color">:</span>
            <span class="text-sm font-medium text-main-text-color">${{cashExpenseSummary().income}}</span>
          </div>
          <div class="flex items-center gap-1 bg-secondary-background-color rounded-md p-2" [ngClass]="{'skelton': isSummaryLoading()}">
            <div class="w-5 h-5 rounded-full bg-main-background-color flex items-center justify-center">
              <fa-icon [icon]="faDollarSign" class="text-common-red-color text-sm" />
            </div>
            <span class="text-sm font-medium text-secondary-text-color">Total Expense</span>
            <span class="text-xs text-secondary-text-color">:</span>
            <span class="text-sm font-medium text-main-text-color">${{cashExpenseSummary().expense}}</span>
          </div>
          <div class="flex items-center gap-1 bg-secondary-background-color rounded-md p-2" [ngClass]="{'skelton': isSummaryLoading()}">
            <div class="w-5 h-5 rounded-full bg-main-background-color flex items-center justify-center">
              <fa-icon [icon]="faDollarSign" class="text-common-blue-color text-sm" />
            </div>
            <span class="text-sm font-medium text-secondary-text-color">Net</span>
            <span class="text-xs text-secondary-text-color">:</span>
            <span class="text-sm font-medium" [ngClass]="cashExpenseSummary().net.startsWith('-') ? 'text-common-red-color' : 'text-main-text-color'">${{cashExpenseSummary().net}}</span>
          </div>
        </div>
      </div>
      <app-v3-data-table
        dynamicHeaderText="Cash Expense List"
        [columnDefs]="columnDefs"
        [tableId]="tableId"
        (rowSelected)="onRowSelected($event)"
        [headerElements]="headerElements()"
        [frameworkComponents]="frameworkComponents"
        (headerButtonEvent)="headerButtonClick($event)"
        (cellRendererViewEvent)="cellRendererActionView($event)"
        (cellRendererIdEvent)="cellRendererActionClick($event)"
        [exportConfig]="exportConfig"
        (cashExpenseExportEvent)="onCashExpenseExport($event)"
        [filterAndExportLoadingInput]="exportLoading()"
        [(selectedPanelButton)]="selectedPanelButton"
        [responseMap]="isCashExpenseBalanceEnabled() ? mapper : null"
      >
      </app-v3-data-table>
    }@else {
      <app-cash-expense-bank-table (showCashExpenseTransaction)="showCashExpenseTransaction($event)" />
    }
  </div>
</div>
