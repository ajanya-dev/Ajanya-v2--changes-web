<div class="single-page-style" id="cash_expense_sign2">
  <div class="ma-content">
    <div class="m-content">
      <div class="row">
        <div class="col-md-12">
          <div
            class="m-portlet m-portlet--success m-portlet--head-solid-bg m-portlet--rounded"
          >
            <div class="m-portlet__head">
              <div class="m-portlet__head-caption">
                <div class="m-portlet__head-title">
                  <span class="m-portlet__head-icon"> </span>
                  <h3 class="m-portlet__head-text">Cash Receipt</h3>
                </div>
              </div>
              <div class="m-portlet__head-tools">
                <ul class="m-portlet__nav">
                  <li class="m-portlet__nav-item">
                    <label for="ce_serial_number">No. </label>
                    @if (cashExpenseData?.serialNo) {
                      <input
                        type="text"
                        name="ce_serial_number"
                        id="ce_serial_number"
                        placeholder="Cash Expense No."
                        class="form-control form-control-sm m-input"
                        maxlength="10"
                        readonly
                        value="{{ cashExpenseData?.serialNo }}"
                      />
                    }
                  </li>
                  <li class="m-portlet__nav-item">
                    <label for="transaction_date">Date: </label>
                    @if (cashExpenseData?.transactionDate) {
                      <input
                        type="text"
                        class="form-control form-control-sm m-input"
                        placeholder="Cash Expense Date"
                        name="transaction_date"
                        tabindex="2"
                        readonly
                        value="{{ cashExpenseData?.transactionDate }}"
                      />
                    }
                  </li>
                </ul>
              </div>

              <div
                class="m-portlet__body"
                style="padding-bottom: 20px !important"
              >
                <input type="hidden" name="payee_id" id="payee_id" value="" />
                <input
                  type="hidden"
                  name="cashaccount_id"
                  id="cashaccount_id"
                  value=""
                />

                <ul class="ul-item-box">
                  <li>
                    <label for="ce_account">Bank Account</label>
                    @if (cashExpenseData?.bankAccountName) {
                      <input
                        type="text"
                        class="form-control"
                        name="ce_amount"
                        id="ce_account"
                        maxlength="13"
                        tabindex="2"
                        readonly
                        value="{{ cashExpenseData?.bankAccountName }}"
                      />
                    }
                  </li>
                  <li>
                    <label for="ce_name">Payee Name</label>
                    @if (cashExpenseData?.payeeName) {
                      <input
                        type="text"
                        class="form-control form-control-sm m-input"
                        name="ce_amount"
                        id="ce_name"
                        maxlength="13"
                        tabindex="2"
                        readonly
                        value="{{ cashExpenseData?.payeeName }}"
                      />
                    }
                  </li>
                  <li>
                    <label for="ce_amount">Amount</label>
                    @if (cashExpenseData?.grandTotal) {
                      <input
                        type="text"
                        class="form-control form-control-sm m-input"
                        name="ce_amount"
                        id="ce_amount"
                        maxlength="13"
                        tabindex="2"
                        readonly
                        value="${{ cashExpenseData?.grandTotal }}"
                      />
                    }
                  </li>
                  <li>
                    <label for="ce_category">Category</label>
                    <input
                      type="text"
                      class="form-control form-control-sm m-input"
                      name="ce_category"
                      id="ce_category"
                      maxlength="13"
                      tabindex="2"
                      readonly
                      value="{{ cashExpenseData?.catogryName }}"
                    />
                  </li>
                  <li>
                    <label for="ce_account">Ac#</label>
                    <input
                      type="text"
                      class="form-control form-control-sm m-input"
                      name="cashexp_account_number"
                      id="ce_account"
                      tabindex="4"
                      maxlength="25"
                      readonly
                      value="{{ cashExpenseData?.cashExpAccountNo }}"
                    />
                  </li>
                  <li>
                    <label for="ce_invoice_no">Inv#</label>
                    <input
                      type="text"
                      name="cashexp_invoice_no"
                      class="form-control form-control-sm m-input"
                      id="ce_invoice_no"
                      tabindex="5"
                      maxlength="30"
                      readonly
                      value="{{ cashExpenseData?.cashExpInvoiceNo }}"
                    />
                  </li>
                  <li>
                    <label for="ce_type">Expense Type</label>
                    <input
                      type="text"
                      class="form-control form-control-sm m-input"
                      name="ce_type"
                      id="ce_type"
                      maxlength="13"
                      tabindex="2"
                      readonly
                      value="{{
                        cashExpenseData?.transactionType == 1
                          ? 'Expense'
                          : cashExpenseData?.transactionType == 2
                            ? 'Income'
                            : ''
                      }}"
                    />
                  </li>
                  <li>
                    <label for="ce_memo">Memo</label>
                    <input
                      type="text"
                      name="ce_memo"
                      id="ce_memo"
                      class="form-control form-control-sm m-input"
                      maxlength="155"
                      tabindex="7"
                      value="{{ cashExpenseData?.memo }}"
                      readonly
                    />
                  </li>
                </ul>
              </div>
              <div class="row" data-select2-id="26">
                <div class="form-group col-lg-12">
                  <div class="col-lg-6">
                    <label for="exampleInputEmail1">E-Signature</label>
                    <div class="form-group m-form__group">
                      <div>
                        <img
                          [ngClass]="{ skelton: isSignLoading }"
                           alt="(Signature Image)"
                          [ngSrc]="imgUrlData"
                          id="signimg"
                          width="170"
                          height="62"
                          class="max-w-[502px] max-h-[62px]"
                        />
                      </div>
                    </div>
                  </div>
                </div>

                <ul class="ul-item-box">
                  <li>
                    <label for="signedIpAddess">Signed IP</label>
                    <input
                      type="text"
                      class="form-control"
                      id="signedIpAddess"
                      readonly
                      value="{{ cashExpenseData?.signed_ip_address }}"
                    />
                  </li>
                  <li>
                    <label for="ce_amount">Signed Date</label>
                    <input
                      type="text"
                      class="form-control form-control-sm m-input"
                      placeholder="Payee"
                      name="ce_amount"
                      id="ce_amount"
                      maxlength="13"
                      tabindex="2"
                      readonly
                      value="{{ cashExpenseData?.signed_date }}"
                    />
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
