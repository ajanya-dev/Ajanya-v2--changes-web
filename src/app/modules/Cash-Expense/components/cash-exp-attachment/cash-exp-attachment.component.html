<div
  class="{{
    fromModal != false
      ? 'activity_table ocw_table_wrapper height'
      : 'activity_table ocw_table_wrapper'
  }}"
>
  <table
    class="{{
      fromModal != false
        ? 'ocw-table ocw-table-bordered mt-4'
        : 'ocw-table ocw-table-striped'
    }}"
    *ngIf="cashExpenseAttachmentData != undefined; else notFoundBody"
  >
    <thead>
      <tr>
        <th class="tabs-inner-h4">Date</th>
        <th>By</th>
        <th>File</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr
        class="bg-tr"
        *ngFor="
          let item of cashExpenseAttachmentData;
          let i = index;
          trackBy: identify
        "
      >
        <td width="20%">{{ item.formated_date }}</td>
        <td width="30%">{{ item.user_name }}</td>
        <td width="40%" class="file">
          <a (click)="openAttachment(item.encrypted_id, true)">
            {{ item.file_name }}
          </a>
          <i
            class="fa fa-external-link"
            aria-hidden="true"
            (click)="openAttachment(item.encrypted_id, false)"
          ></i>
        </td>
        <td width="10%">
          <a class="deleteButton" data-id="">
            <i
              class="fa fa-trash trash"
              aria-hidden="true"
              title="Delete"
              (click)="onDeleteAttachment(item.encrypted_id)"
            ></i>
            <span class="sr-only">Delete</span>
          </a>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<ng-template #notFoundBody>
  <div class="noData_wrapper"></div>
  <p>No Attachment Found.</p>
</ng-template>
