<div
  class="{{
    fromModal != false
      ? 'activity_table ocw_table_wrapper height'
      : 'activity_table ocw_table_wrapper'
  }}"
>
  <table
    class="{{
      fromModal != false
        ? 'ocw-table ocw-table-bordered mt-4'
        : 'ocw-table ocw-table-striped'
    }}"
    *ngIf="activityData != undefined; else notFoundBody"
  >
    <thead>
      <tr *ngIf="fromModal != true">
        <th class="tabs-inner-h4 fontsize-small">Date</th>
        <th class="fontsize-small">Status</th>
        <th class="fontsize-small">By</th>
        <th class="fontsize-small">Device</th>
        <th class="fontsize-small">Notes</th>
      </tr>
      <tr *ngIf="fromModal != false">
        <th>Date</th>
        <th width="15%">Status</th>
        <th width="15%">By</th>
        <th width="15%">Device</th>
        <th width="35%">Notes</th>
      </tr>
    </thead>
    <tbody>
      <tr
        *ngFor="let item of activityData"
        class="{{ fromModal != undefined ? '' : 'fontsize-small' }}"
      >
        <td class="fontsize-small">{{ item.formattedCreatedAt }}</td>
        <td class="fontsize-small">{{ item.status }}</td>
        <td class="fontsize-small">{{ item.userName }}</td>
        <td class="for-icon-after fontsize-small">
          {{
            item.deviceName != undefined &&
            item.deviceName !== "" &&
            item.deviceName != null
              ? item.deviceName
              : item.ipAddress
          }}
        </td>

        <td class="fontsize-small">
          <span>{{ item.note }}</span>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<ng-template #notFoundBody>
  <div class="noData_wrapper fontsize-small"></div>
  <p>No Activity Found.</p>
</ng-template>
