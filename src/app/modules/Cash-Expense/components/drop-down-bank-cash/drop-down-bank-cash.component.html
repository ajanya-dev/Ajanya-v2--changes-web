<div class="angular-ocw-v35-ng-select-dropdown relative">
  <ng-select
    class="ng-dropdown-panel-v35"
    style="width: 200px"
    [(ngModel)]="selectedItem"
    (scrollToEnd)="onScrollToEnd()"
    (keyup)="search($event)"
    [loading]="loading"
    (change)="getChange($event)"
    placeholder="{{ placeholder }}"
  >
    @if (enableAddNew) {
      <ng-option [value]="'add-new'">
        <div
          class="add-new-btn-ng-option p-2 flex justify-center items-center text-center text-sm bg-common-secondary-blue-color rounded-lg text-common-blue-color"
        >
          <fa-icon class="mr-1" [icon]="['fas', 'plus']"></fa-icon>
          <span class="add-new-text-ng-option">New</span>
        </div>
      </ng-option>
    }
    @for (item of bankAndCashAccounts; track item.id) {
      <ng-option [value]="item"
        >{{ item.nickName ?? item.name
        }}{{
          addTag === true && item.verified === 1 ? "[MANUAL ACH ]" : ""
        }}</ng-option
      >
    }
  </ng-select>
</div>
