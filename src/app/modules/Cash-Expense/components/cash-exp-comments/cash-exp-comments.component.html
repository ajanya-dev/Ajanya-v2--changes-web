<span *ngIf="fromModal != true" class="heading-h4 padng-top-main"
  >Comments</span
>
<form [formGroup]="commentForm" *ngIf="fromModal != true" class="example-form">
  <textarea
    placeholder="Write your comments.."
    formControlName="comment"
    class="input_style mb-4"
    rows="3"
  ></textarea>
  <div class="righ-tside-buton mb-4 for-single-line-btn">
    <button class="ocw-btn-light-blue for-weight-font" (click)="onAddComment()">
      Add message
    </button>
    <app-control-message
      [control]="commentForm.controls.comment"
      labelName="Comment is required"
    >
    </app-control-message>
  </div>
</form>
<div
  class="{{
    fromModal != false
      ? 'activity_table ocw_table_wrapper height'
      : 'activity_table ocw_table_wrapper'
  }}"
>
  <table
    class="{{
      fromModal != false
        ? 'ocw-table ocw-table-bordered mt-4'
        : 'ocw-table ocw-table-striped'
    }}"
  >
    <thead>
      <tr class="border-under">
        <th>Date</th>
        <th>User</th>
        <th>Comment</th>
      </tr>
    </thead>
    <tbody>
      <tr class="bg-tr" *ngFor="let item of commentsData">
        <td>{{ item.formated_date }}</td>
        <td>{{ item.user === "" ? item.user_name : item.user }}</td>
        <td>
          <span>{{ item.comments }}</span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
