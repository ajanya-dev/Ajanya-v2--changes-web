<div class="ocw_table_wrapper">
  <table class="ocw-table ocw-table-striped">
    <thead>
      <tr>
        <th class="tabs-inner-h4" width="20%">From</th>
        <th width="20%">To</th>
        <th width="30%">A/c</th>
        <th width="15%">Type</th>
        <th width="15%">Amount</th>
      </tr>
    </thead>
    <tbody>
      <tr class="bg-tr">
        <td>{{ fromUser }}</td>
        <td>{{ cashExpenseData?.payee.payeeName }}</td>
        <td>{{ cashExpenseData?.bankAccount.bankAccountName }}</td>
        <td>{{ cashExpenseType }}</td>
        <td>{{ cashExpenseData?.grandTotal | currency }}</td>
      </tr>
    </tbody>
  </table>
</div>

<div>Serial No:{{ cashExpenseData?.serialNo }}</div>
