<div class="ocw_table_wrapper">
  <table
    class="{{
      fromModal != false
        ? 'ocw-table ocw-table-bordered mt-4'
        : 'ocw-table ocw-table-striped'
    }}"
    *ngIf="payeeTransactionData != undefined; else notFoundBody"
  >
    <thead>
      <tr>
        <th class="tabs-inner-h4" width="15%">Date</th>
        <th width="55%">Memo</th>
        <th width="10%">Amount</th>
        <th width="20%">A/C</th>
      </tr>
    </thead>
    <tbody>
      <tr
        class="bg-tr"
        *ngFor="let item of payeeTransactionData | slice: 0 : 10"
      >
        <td>{{ item.date }}</td>
        <td>{{ item.memo }}</td>
        <td (click)="onCashExpenseView(item?.id)" class="td-amt-right-side">
          ${{ item.amount }}
        </td>
        <td>{{ item.account }}</td>
      </tr>
    </tbody>
  </table>
</div>

<ng-template #notFoundBody>
  <div class="noData_wrapper"></div>
  <p>No transactions found.</p>
</ng-template>
