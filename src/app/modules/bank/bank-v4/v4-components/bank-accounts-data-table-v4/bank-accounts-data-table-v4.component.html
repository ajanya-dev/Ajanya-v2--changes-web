<div class="flex h-full w-full flex-col">
  <app-v4-data-table
    class="flex-1 min-h-0"
    [showActionButtonContainer]="false"
    [columnDefs]="columnDefs"
    [tableId]="tableId"
    [defaultDisabledColumn]="['bank_name']"
    (bankAccountsOrPayeeExportEvent)="onExportData($event)"
    [filterAndExportLoadingInput]="exportLoading"
    [exportConfig]="exportConfig"
    [frameworkComponents]="frameworkComponents"
    [headerElements]="headerElements"
    (headerButtonEvent)="onHeaderButtonEvent($event)"
    [paginationCurrentPageNumber]="v3DataTableService.CurrentPage ?? 1"
    [useCustomEmptyState]="true"
    [emptyStateConfig]="{
      icon: 'landmark',
      title: 'No bank accounts yet',
      description:
        'Connect your first bank account to start sending and receiving payments',
      buttonText: 'New Bank Account',
      buttonIcon: 'plus',
      compact: true
    }"
    (emptyStateActionClick)="onNew()"
  >
  </app-v4-data-table>
</div>
