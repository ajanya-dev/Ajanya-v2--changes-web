<div class="flex h-full items-center gap-1">
  <button aria-label="Actions"
    class="action-icon-btn"
    [matMenuTriggerFor]="menu"
    matTooltip="Actions"
    (click)="$event.stopPropagation()"
  >
    <lucide-icon name="ellipsis-vertical" [size]="16"></lucide-icon>
  </button>

  <button aria-label="View"
    class="action-icon-btn"
    matTooltip="View"
    (click)="onViewClick(); $event.stopPropagation()"
  >
    <lucide-icon name="eye" [size]="16"></lucide-icon>
  </button>
</div>

<mat-menu #menu="matMenu" class="v4-action-menu">
  <div class="v4-menu-group-label">Actions</div>
  <button mat-menu-item (click)="onEditRow()">
    <div class="v4-menu-item">
      <lucide-icon name="square-pen" [size]="14"></lucide-icon>
      <span>Edit</span>
    </div>
  </button>
  @if (!bankData?.is_neo_bank) {
    <button mat-menu-item (click)="goToCheckDesign()">
      <div class="v4-menu-item">
        <lucide-icon name="pencil-line" [size]="14"></lucide-icon>
        <span>Edit Design</span>
      </div>
    </button>
  }
  <button mat-menu-item (click)="changeStartingNo()">
    <div class="v4-menu-item">
      <lucide-icon name="arrow-left-right" [size]="14"></lucide-icon>
      <span>Change Starting Number</span>
    </div>
  </button>
  <button mat-menu-item (click)="onCloneDesignRow()">
    <div class="v4-menu-item">
      <lucide-icon name="copy" [size]="14"></lucide-icon>
      <span>Clone Design</span>
    </div>
  </button>
  <button mat-menu-item class="v4-menu-item-danger" (click)="onDeleteRow()">
    <div class="v4-menu-item">
      <lucide-icon name="trash-2" [size]="14"></lucide-icon>
      <span>Delete</span>
    </div>
  </button>

  <div class="v4-menu-group-label">Documents</div>
  <button mat-menu-item (click)="achAuthorizationForm()">
    <div class="v4-menu-item">
      <lucide-icon name="clipboard-check" [size]="14"></lucide-icon>
      <span>ACH Authorization Form</span>
    </div>
  </button>
</mat-menu>
