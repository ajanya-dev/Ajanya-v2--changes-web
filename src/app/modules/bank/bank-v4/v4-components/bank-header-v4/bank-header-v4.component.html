<app-v4-page-header
  [title]="'Bank Accounts'"
  subtitle="Manage your connected bank accounts and view transaction history"
  [actions]="headerActions()"
  (actionClick)="onAction($event)"
>
  <div
    headerActions
    class="flex items-center gap-0.5 border border-v4-input-border-color rounded-md p-1 bg-v4-secondary-background-color h-[34px]"
  >
    <button aria-label="Grid view"
      class="p-1.5 rounded transition-colors"
      [ngClass]="
        isGridView()
          ? 'bg-v4-primary-brand-color text-white'
          : 'bg-transparent text-v4-primary-brand-bold-color'
      "
      matTooltip="Grid view"
      (click)="viewToggle(true)"
    >
      <lucide-icon name="layout-grid" [size]="15" />
    </button>
    <button aria-label="List view"
      class="p-1.5 rounded transition-colors"
      [ngClass]="
        !isGridView()
          ? 'bg-v4-primary-brand-color text-white'
          : 'bg-transparent text-v4-primary-brand-bold-color'
      "
      matTooltip="List view"
      (click)="viewToggle(false)"
    >
      <lucide-icon name="list" [size]="15" />
    </button>
  </div>
</app-v4-page-header>
