<div
  class="h-full flex flex-col rounded-xl overflow-hidden border border-v4-border-color font-peridot"
>
  <!-- Header: Instructions (dark blue) -->
  <div
    class="flex-shrink-0 flex items-center gap-2 px-5 py-4 bg-v4-primary-brand-color text-white"
  >
    <span
      class="flex h-8 w-8 items-center justify-center rounded-full bg-white/20"
    >
      <lucide-icon [img]="HelpCircleIcon" [size]="18"></lucide-icon>
    </span>
    <h2 class="text-base font-semibold">Instructions</h2>
  </div>

  <!-- Body -->
  <div
    class="flex-1 min-h-0 overflow-auto px-5 py-4 bg-v4-tertiary-background-color text-v4-main-text-color flex flex-col gap-4"
  >
    <!-- Canadian Instructions Section -->
    @if (isCanada) {
      <div class="rounded-lg border border-v4-border-color bg-v4-secondary-background-color p-3">
        <p class="text-sm text-v4-secondary-text-color mb-1">
          For Canadian bank accounts
        </p>
        <a
          class="text-sm font-medium text-v4-primary-brand-color hover:underline"
          target="_blank"
          [href]="instructionUrl"
        >Click here for instructions</a>
      </div>
    }

    <!-- FAQ Section -->
    <div>
      <div class="flex items-center gap-2 mb-3">
        <lucide-icon
          [img]="ShieldQuestionIcon"
          [size]="18"
          class="text-v4-main-text-color"
        ></lucide-icon>
        <h3 class="text-sm font-semibold text-v4-main-text-color">FAQ</h3>
      </div>
      <div class="space-y-2">
        @for (item of faqItems; track $index) {
          <div
            class="rounded-lg border border-v4-border-color bg-v4-secondary-background-color overflow-hidden"
          >
            <button
              type="button"
              class="w-full flex items-center justify-between gap-2 py-3 px-3 text-left text-sm font-medium text-v4-main-text-color hover:bg-v4-tertiary-background-color transition-colors"
              (click)="toggleFaq($index)"
            >
              <span class="flex-1 text-left">{{ item.question }}</span>
              <lucide-icon
                [img]="
                  expandedFaq() === $index ? ChevronUpIcon : ChevronDownIcon
                "
                [size]="16"
                class="flex-shrink-0 text-v4-tertiary-text-color"
              ></lucide-icon>
            </button>
            @if (expandedFaq() === $index) {
              <div
                class="px-3 pb-3 pt-0 text-sm text-v4-secondary-text-color leading-relaxed"
              >
                {{ item.answer }}
              </div>
            }
          </div>
        }
      </div>
    </div>
  </div>
</div>
