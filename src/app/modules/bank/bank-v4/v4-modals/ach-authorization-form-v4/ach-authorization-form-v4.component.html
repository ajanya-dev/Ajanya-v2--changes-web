<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        ACH Authorization Form
      </h1>
      <h2 class="text-xs text-v4-secondary-text-color">
        Complete the form to authorize ACH
      </h2>
    </div>
    <div
      (click)="close()"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color font-peridot">
    <form [formGroup]="achForm">
      <div class="mb-4">
        <label
          class="block text-sm font-medium text-v4-secondary-text-color mb-1.5"
        >
          Bank Account <span class="text-v4-common-red-color">*</span>
        </label>
        <app-bank-ac-dropdown-v4
          [append]="'body'"
          class="w-full"
          [enableAddNew]="false"
          [isInvalid]="
            achForm.controls.bankAccount.invalid &&
            achForm.controls.bankAccount.touched
          "
          (ready)="onDropdownReady($event)"
          (changeEvent)="onBankSelect($event)"
        />
        <app-control-message-v4
          [control]="achForm.controls.bankAccount"
          [customMessages]="{ required: 'Bank Account is required' }"
        />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
        <app-common-input-v4
          [fieldLabel]="'Whom you authorize'"
          [placeholder]="'Enter name'"
          [control]="achForm.controls.to"
          formControlName="to"
        />
        <app-common-input-v4
          [fieldLabel]="'Your Full Name'"
          [placeholder]="'Enter your full name'"
          [control]="achForm.controls.fullName"
          formControlName="fullName"
        />
      </div>

      <div class="mb-4">
        <app-common-input-v4
          [fieldLabel]="'Title'"
          [placeholder]="'Enter your title'"
          [control]="achForm.controls.title"
          formControlName="title"
        />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <app-common-input-v4
          [fieldLabel]="'Enter Your Name / Digital Sign'"
          [placeholder]="'Type your name'"
          [control]="achForm.controls.digitalSign"
          formControlName="digitalSign"
          (inputEvent)="onDigitalSignKeyUp()"
        />
        <div>
          <label
            class="block text-sm font-medium text-v4-secondary-text-color mb-1.5"
          >
            Signature Preview
          </label>
          <div
            class="signature-preview flex items-center justify-center min-h-[44px] px-4 py-2 border border-v4-border-color rounded-[10px] bg-v4-input-background-color text-v4-main-text-color overflow-hidden"
          >
            <span class="truncate min-w-0 max-w-full text-center" [title]="digitalSignPreview">{{ digitalSignPreview }}</span>
          </div>
        </div>
      </div>
    </form>
  </div>
  <!-- modal body end -->

  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      [text]="'Save & Preview'"
      [disabled]="savingPreview() || savingEmail()"
      [loading]="savingPreview()"
      (clickEvent)="saveAndPreview()"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      [text]="'Save & Email'"
      [disabled]="savingEmail() || savingPreview()"
      [loading]="savingEmail()"
      (clickEvent)="saveAndEmail()"
    />
  </div>
</div>
