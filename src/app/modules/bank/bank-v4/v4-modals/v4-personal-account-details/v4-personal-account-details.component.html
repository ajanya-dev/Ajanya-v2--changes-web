<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Upload Documents
      </h1>
      <h2 class="text-xs text-v4-subtle-text-color">
        Personal cloud bank account
      </h2>
    </div>
    <div
      (click)="close()"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color">
    @if (addressForm) {
      <form [formGroup]="addressForm">
        <div class="grid grid-cols-1 gap-4">
          <!-- Occupation Dropdown -->
          <div>
            <label
              class="block text-xs font-medium text-v4-secondary-text-color mb-1"
              >Occupation <span class="text-v4-common-red-color">*</span></label
            >
            <app-v4-common-dropdown
              [config]="occupationDropdownConfig"
              [listData]="occupation"
              [loading]="false"
              [formControl]="occupationControl"
              appendTo="body"
            />
            <app-v4-control-message
              [control]="addressForm.controls['occupation']"
            />
          </div>

          <!-- File Uploads -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Passport -->
            <div>
              <label
                class="block text-xs font-medium text-v4-secondary-text-color mb-1"
                >Passport <span class="text-v4-common-red-color">*</span></label
              >
              <div
                class="relative flex items-center gap-2 border border-v4-input-border-color rounded-lg bg-v4-secondary-background-color px-3 py-2 cursor-pointer hover:border-v4-primary-brand-color transition-colors"
                (click)="passportFileInput.click()"
              >
                <lucide-icon
                  [img]="UploadIcon"
                  [size]="16"
                  class="text-v4-tertiary-text-color shrink-0"
                />
                <span
                  class="text-sm truncate"
                  [class]="
                    file1Input
                      ? 'text-v4-main-text-color'
                      : 'text-v4-tertiary-text-color'
                  "
                >
                  {{ file1Input ? file1Input.name : "Choose file" }}
                </span>
                <input
                  #passportFileInput
                  type="file"
                  class="hidden"
                  accept=".pdf,.jpg,.jpeg,.png"
                  (change)="onFile1Selected($event)"
                />
              </div>
              <app-v4-control-message
                [control]="addressForm.controls['document1']"
              />
            </div>

            <!-- Visa -->
            <div>
              <label
                class="block text-xs font-medium text-v4-secondary-text-color mb-1"
                >Visa <span class="text-v4-common-red-color">*</span></label
              >
              <div
                class="relative flex items-center gap-2 border border-v4-input-border-color rounded-lg bg-v4-secondary-background-color px-3 py-2 cursor-pointer hover:border-v4-primary-brand-color transition-colors"
                (click)="visaFileInput.click()"
              >
                <lucide-icon
                  [img]="UploadIcon"
                  [size]="16"
                  class="text-v4-tertiary-text-color shrink-0"
                />
                <span
                  class="text-sm truncate"
                  [class]="
                    file2Input
                      ? 'text-v4-main-text-color'
                      : 'text-v4-tertiary-text-color'
                  "
                >
                  {{ file2Input ? file2Input.name : "Choose file" }}
                </span>
                <input
                  #visaFileInput
                  type="file"
                  class="hidden"
                  accept=".pdf,.jpg,.jpeg,.png"
                  (change)="onFile2Selected($event)"
                />
              </div>
              <app-v4-control-message
                [control]="addressForm.controls['document2']"
              />
            </div>
          </div>
        </div>
      </form>
    }
  </div>
  <!-- modal body end -->

  <!-- modal footer -->
  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
      (clickEvent)="close()"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Submit"
      (clickEvent)="addAddress()"
      [disabled]="loading"
      [loading]="loading"
    />
  </div>
</div>
