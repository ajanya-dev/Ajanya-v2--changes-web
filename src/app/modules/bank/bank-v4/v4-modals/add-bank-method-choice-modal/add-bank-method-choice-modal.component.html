<div class="font-peridot">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Add Bank Account
      </h1>
      <h2 class="text-xs text-v4-subtle-text-color">
        Select your preferred way to connect your bank account
      </h2>
    </div>
    <div
      (click)="onClose()"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <div class="flex flex-col items-center text-center mb-6">
      <div
        class="w-12 h-12 rounded-full bg-v4-secondary-brand-color flex items-center justify-center mb-3"
      >
        <lucide-icon
          [img]="ShieldCheckIcon"
          [size]="24"
          class="text-v4-primary-brand-color"
        />
      </div>
      <p class="text-sm text-v4-secondary-text-color max-w-sm">
       Connect your existing bank account instantly or add your account manually.
      </p>
    </div>

    <div class="flex flex-col gap-3">
      <app-common-button-v4
        [type]="{ style: 'primary', name: 'main' }"
        [text]="'Connect Instantly'"
        [width]="'100%'"
        (clickEvent)="onPlaid()"
      />
      <app-common-button-v4
        [type]="{ style: 'outline', name: 'main' }"
        [text]="'Add Manually'"
        [width]="'100%'"
        (clickEvent)="onManual()"
      />
    </div>

    <div
      class="mt-4 p-3 bg-v4-badge-success-bg-color border border-v4-common-green-color/20 rounded-lg"
    >
      <p class="text-xs text-v4-badge-success-text-color">
        <span class="font-semibold">Recommended:</span> Instantly connect and verify your bank account in seconds without entering your account details manually.
      </p>
    </div>
  </div>
  <!-- modal body end -->
</div>
