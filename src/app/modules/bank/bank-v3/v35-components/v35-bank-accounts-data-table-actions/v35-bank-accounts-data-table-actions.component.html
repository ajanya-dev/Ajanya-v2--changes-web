<div class="action_btn center flex justify-center items-center">
  <fa-icon
    [icon]="['fas', 'eye']"
    class="pl-2 cursor-pointer text-common-dark-blue-color view-icon-action"
    role="presentation"
    (click)="onViewButtonClick()"
  ></fa-icon>
  <button mat-icon-button [matMenuTriggerFor]="menu" class="!-mt-3">
    <fa-icon
      [icon]="['fas', 'ellipsis-vertical']"
      class="option-icon ellipsis-icon-action"
    ></fa-icon>
  </button>
</div>
<mat-menu #menu="matMenu">
  <button
    mat-menu-item
    *ngFor="let btn of actions; let i = index; trackBy: trackByIndex"
    (click)="onCellActionClick(btn.id)"
  >
    <fa-icon [icon]="btn.faIcon" class="common-font-color"></fa-icon>
    <span class="ml-2">{{ btn.name }}</span>
  </button>
</mat-menu>
