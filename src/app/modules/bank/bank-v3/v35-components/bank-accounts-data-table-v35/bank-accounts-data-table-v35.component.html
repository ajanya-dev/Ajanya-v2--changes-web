<div class="!h-full text-main-text-color flex absolute top-5 left-36"></div>
<div class="absolute top-[53px] left-[100px]">
  <app-common-button-v35
    width="72px"
    type="list"
    backGroundInput="var(--common-red-color)"
    text="Delete"
    [isAddIcon]="true"
    [icon]="['fas', 'trash']"
    (clickEvent)="onDelete()"
    [ngClass]="{ 'pointer-events-none opacity-40': !isRowSelected }"
  ></app-common-button-v35>
</div>
<div
  class="absolute top-5 right-6 text-base flex items-center justify-end gap-5"
  appWhiteLabel hiddenIf="isCSNHCRequirement"
>
  <div class="w-full flex justify-end items-end gap-5 h-full">
    <div
      matTooltip="Positive Pay is a fraud prevention service that, through our platform, automatically informs your bank about the checks or ACH payments you issue. When your customer submits a payment, your bank cross-verifies the details against what you provided. If they don't match, the bank will not process the payment, preventing unauthorized transactions (e.g., altered or forged checks, or unapproved ACH pulls). To use Positive Pay, ask your bank to activate it. Once set up, our system automatically coordinates with your bank. There may be a small fee associated with this service, but it secures your transactions."
      tabindex="0"
      role="presentation"
      (click)="positivePay()"
      class="postive-pay text-sm font-inter font-semibold cursor-pointer hover:shadow-common-button ocw-btn"
    >
      <span>Positive Pay</span>
    </div>
    <div
      tabindex="0"
      role="presentation"
      (click)="importFromExel()"
      class="cursor-pointer text-sm font-semibold flex justify-center items-center"
    >
      <fa-icon
        [icon]="['fas', 'arrow-down-to-line']"
        class="text-common-green-color mr-1"
      ></fa-icon
      >Import
    </div>
    @if(env.env_id === 'compass'){
      <div
      tabindex="0"
      role="presentation"
    (click)="updateBankAccount()"
    class="h-full cursor-pointer flex text-sm justify-center pt-1 items-start"
    matTooltip="Import an Excel or CSV file to quickly update the latest bank account address."
  >
    <div class="flex justify-center items-center">
      <fa-icon
        [icon]="['fas', 'arrow-up-to-line']"
        class="text-common-blue-color mr-1"
      ></fa-icon>
      <div>Update</div>
    </div>
  </div>
  }
  </div>
</div>
<div class="h-full w-full py-4 px-5 overflow-hidden">
  <app-v3-data-table
    class="overflow-auto"
    dynamicHeaderText="Bank Accounts"
    dynamicHeaderButtonColor="blue"
    [buttonForModal]="true"
    (modalOpenClick)="goToNew()"
    dynamicHeaderButtonText="New"
    iconClass="plus"
    [columnDefs]="columnDefs"
    [tableId]="tableId"
    (bankAccountsOrPayeeExportEvent)="onExportData($event)"
    [filterAndExportLoadingInput]="exportLoading"
    [exportConfig]="exportConfig"
    [frameworkComponents]="frameworkComponents"
    [paginationCurrentPageNumber]="v3DataTableService.CurrentPage ?? 1"
  >
  </app-v3-data-table>
</div>
