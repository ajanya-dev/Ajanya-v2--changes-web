<div class="ocw_man_modal_wrapper add_bank_modal">
  <form [formGroup]="cloneForm">
    <div class="flex justify-between pb-6">
      <div>
        <span
          class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
        >
          <span class="pl-1 font-inter font-semibold text-base pb-0.5">
            CLONE DESIGN</span
          >
        </span>
      </div>
      <div [mat-dialog-close]="false">
        <fa-icon
          class="text-secondary-text-color cursor-pointer"
          [icon]="['fas', 'xmark']"
        ></fa-icon>
      </div>
    </div>
    <!-- modal body start -->
    <div class="flex flex-col gap-5">
      <div class="flex flex-col gap-5 py-4">
        <div class="v35-button-switch">
          <div
            role="presentation"
            (click)="onTapChange(1)"
            [ngClass]="{ selected: countryType === 1 }"
          >
            <h1>USA</h1>
          </div>
          <div
            role="presentation"
            (click)="onTapChange(2)"
            [ngClass]="{ selected: countryType === 2 }"
          >
            <h1>Canada</h1>
          </div>
        </div>
      </div>
    </div>
    <div class="ocw_modal_body">
      @if (countryType === 2) {
        <div class="country_selected_field mb-3 gap-x-3 gap-y-3.5">
          <div class="single_input">
            <input
              type="text"
              class="input_style"
              placeholder=" "
              formControlName="transitNumber"
              (keypress)="utils.numberOnly($event, 'numeric')"
              maxlength="5"
            />
            <span class="floating_label_field"
              >Transit Number <span class="required">*</span></span
            >
            <app-control-message
              [control]="cloneForm.controls.transitNumber"
            ></app-control-message>
          </div>

          <div class="single_input">
            <input
              type="text"
              class="input_style require_fields"
              placeholder=" "
              formControlName="finantialInstNumber"
              (keypress)="utils.numberOnly($event, 'numeric')"
              maxlength="3"
            />
            <label for="finantialInstNumber" class="floating_label_field"
              >Financial Institute No. <span class="required">*</span></label
            >
            <app-control-message
              [control]="cloneForm.controls.finantialInstNumber"
            ></app-control-message>
          </div>

          <div class="single_input">
            <input
              type="text"
              formControlName="bankAccountNumber"
              class="input_style require_fields"
              id="AccNumber"
              maxlength="21"
              placeholder=" "
              (keypress)="utils.numberOnly($event, 'numeric')"
            />
            <label for="AccNumber" class="floating_label_field"
              >Account Number <span class="required">*</span></label
            >
            <app-control-message
              [control]="cloneForm.controls.bankAccountNumber"
              for=""
            ></app-control-message>
          </div>
        </div>
      }
      @if (countryType === 1) {
        <div class="country_selected_field mb-3 gap-x-3 gap-y-3.5">
          <div class="single_input">
            <input
              type="text"
              formControlName="bankRoutingNumber"
              onKeyPress="if(this.value.length==9) return false;"
              (keyup)="lookupRoutingNumber($event)"
              (keypress)="utils.numberOnly($event, 'numeric')"
              class="input_style"
              placeholder=" "
            />
            <span class="floating_label_field"
              >Routing Number <span class="required">*</span></span
            >
            <app-control-message
              [control]="cloneForm.controls.bankRoutingNumber"
            ></app-control-message>
          </div>

          <div class="single_input">
            <input
              type="text"
              formControlName="bankAccountNumber"
              class="input_style require_fields"
              id="AccNumber"
              maxlength="21"
              placeholder=" "
              (keypress)="utils.numberOnly($event, 'numeric')"
            />
            <label for="AccNumber" class="floating_label_field"
              >Account Number <span class="required">*</span></label
            >
            <app-control-message
              [control]="cloneForm.controls.bankAccountNumber"
              for=""
            ></app-control-message>
          </div>
        </div>
      }
      <div class="input_group bank_credential">
        <div class="single_input">
          <select formControlName="bankAccountType" class="input_style">
            <option value="" disabled selected>Select Account Type</option>
            <option value="5">Personal Checking</option>
            <option value="6">Business Checking</option>
            <option value="7">Personal Savings</option>
            <option value="8">Business Savings</option>
          </select>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="bankAccountName"
            class="input_style"
            id="AccName"
            maxlength="60"
            placeholder=" "
          />
          <label for="AccName" class="floating_label_field"
            >Account Name <span class="required">*</span></label
          >
          <app-control-message
            [control]="cloneForm.controls.bankAccountName"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="bankAccountNickName"
            class="input_style require_fields"
            id="nickName"
            maxlength="30"
            placeholder=" "
          />
          <label for="nickName" class="floating_label_field"
            >Nick Name <span class="required">*</span></label
          >
          <app-control-message
            [control]="cloneForm.controls.bankAccountNickName"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="AddressLine1"
            class="input_style require_fields"
            id="AccAddress"
            maxlength="150"
            placeholder=" "
            #search
            (focus)="loadGoogleAddress(search)"
          />
          <label for="AccAddress" class="floating_label_field"
            >Address Line 1 <span class="required">*</span></label
          >
          <app-control-message
            [control]="cloneForm.controls.AddressLine1"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="AddressLine2"
            class="input_style require_fields"
            id="AccAddress"
            maxlength="150"
            placeholder=" "
          />
          <label for="AccAddress" class="floating_label_field"
            >Address Line 2</label
          >
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="city"
            class="input_style require_fields"
            id="AccCity"
            maxlength="50"
            placeholder=" "
          />
          <label for="AccCity" class="floating_label_field">City </label>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="state"
            class="input_style require_fields"
            id="AccState"
            maxlength="100"
            placeholder=" "
          />
          <label for="AccState" class="floating_label_field">State </label>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="zip"
            class="input_style require_fields"
            id="AccZip"
            placeholder=" "
          />
          <label for="AccZip" class="floating_label_field">Zip </label>
          <app-control-message
            [control]="cloneForm.controls.zip"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="phone"
            mask="(000) 000-0000"
            class="input_style require_fields"
            id="Accphone"
            (keypress)="utils.numberOnly($event, 'numeric')"
            placeholder=" "
          />
          <label for="Accphone" class="floating_label_field">Phone </label>
          <app-control-message
            [control]="cloneForm.controls.phone"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="email"
            class="input_style require_fields"
            id="AccZip"
            placeholder=" "
          />
          <label for="AccZip" class="floating_label_field">Email </label>
          <app-control-message
            [control]="cloneForm.controls.email"
          ></app-control-message>
        </div>
      </div>
      <div class="mt-3 mb-3">
        <span
          class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
        >
          <span class="pl-1 font-inter font-semibold text-base pb-0.5">
            Bank Details</span
          >
        </span>
      </div>
      <div class="input_group bank_detail">
        <div class="single_input">
          <input
            type="text"
            formControlName="bankName"
            class="input_style require_fields"
            id="bankName"
            placeholder=" "
          />
          <label for="bankName" class="floating_label_field"
            >Bank Name <span class="required">*</span></label
          >
          <app-control-message
            [control]="cloneForm.controls.bankName"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="bankAddress"
            class="input_style"
            id="bankAddress"
            placeholder=" "
            #search2
            (focus)="loadBankGoogleAddress(search2, 0)"
          />
          <label for="bankAddress" class="floating_label_field"
            >Street Address<span class="required">*</span></label
          >
          <app-control-message
            [control]="cloneForm.controls.bankAddress"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="bankCity"
            class="input_style"
            id="bankCity"
            placeholder=" "
          />
          <label for="bankCity" class="floating_label_field"
            >City<span class="required">*</span></label
          >
          <app-control-message
            [control]="cloneForm.controls.bankCity"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="bankState"
            class="input_style"
            id="bankState"
            placeholder=" "
          />
          <label for="bankState" class="floating_label_field"
            >State<span class="required">*</span></label
          >
          <app-control-message
            [control]="cloneForm.controls.bankState"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="bankZip"
            class="input_style"
            id="bankZip"
            placeholder=" "
          />
          <label for="bankZip" class="floating_label_field"
            >Zip<span class="required">*</span></label
          >
          <app-control-message
            [control]="cloneForm.controls.bankZip"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="startSerialNo"
            maxlength="12"
            class="input_style"
            (keypress)="utils.numberOnly($event, 'numeric')"
            id="startSerialNo"
            placeholder=" "
          />
          <label for="startSerialNo" class="floating_label_field"
            >Starting Check Number</label
          >
          <app-control-message
            [control]="cloneForm.controls.startSerialNo"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            formControlName="fractionalNo"
            class="input_style"
            id="fractionalNo"
            placeholder=" "
          />
          <label for="fractionalNo" class="floating_label_field"
            >Fractional Number</label
          >
        </div>
      </div>
    </div>
    <!-- modal body end -->
    <div class="flex justify-end gap-3 pt-8">
      <app-common-button-v35
        width="80px"
        [type]="{ style: 'modal', name: 'main' }"
        text="Add"
        [isAddIcon]="true"
        [disabled]="btnDesable"
        [icon]="['fas', 'plus']"
        [loading]="btnDesable"
        (clickEvent)="submit()"
      ></app-common-button-v35>
    </div>
  </form>
</div>
