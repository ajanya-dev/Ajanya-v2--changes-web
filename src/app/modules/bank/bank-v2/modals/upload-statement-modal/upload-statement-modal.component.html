<div class="ocw-modal">
  <!-- modal header -->
  <div class="flex justify-between items-center mb-5">
    <div class="flex items-center gap-2">
      <span class="flex items-center gap-2">
        <span class="text-xl font-semibold text-main-text-color">Account Verification Failed</span>
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon class="cursor-pointer text-secondary-text-color text-xl" [icon]="faXmark"></fa-icon>
    </div>
  </div>

  <!-- modal body -->
  <div>
    <div class="bg-common-secondary-yellow-color p-4 rounded-lg mb-5">
      <p class="text-sm text-main-text-color break-words mb-3 last:mb-0">We couldn't verify your original bank account number. It looks like the number you entered may be incorrect. If you believe the AC number is correct, you can click below to upload the first page of your bank statement for manual verification.</p>
    </div>

    <div >
      <form [formGroup]="uploadForm">
        <div class="single_input" [ngClass]="{ skelton: isLoading() }">
          <app-common-upload-button-v35
            buttonText="Upload Banking Statement"
            [acceptedFileTypes]="[
              '.pdf',
              '.csv',
              '.xlsx',
              '.xls',
              '.docx',
              '.doc',
              '.rtf',
              '.txt',
              '.jpg',
              '.png'
            ]"
            inputId="bankingStatement"
            (selectedFileEvent)="fileInput($event)"
            (removingFileName)="removeFileName($event)"
            [selectedFileNames]="selectedFileNames"
          ></app-common-upload-button-v35>
          <app-control-message-v35
            [control]="uploadForm.controls.bankStatement"
          ></app-control-message-v35>
        </div>
      </form>
    </div>
  </div>

  <!-- modal footer -->
  <div class="flex justify-end gap-3 mt-6">
    <app-common-button-v35
      [type]="{ style: 'bordered', name: 'main' }"
      text="Cancel"
      (clickEvent)="cancel()"
    ></app-common-button-v35>
    <app-common-button-v35
      [type]="{ style: 'filled', name: 'main' }"
      text="Upload"
      [disabled]="!uploadForm.valid || isLoading()"
      [loading]="isLoading()"
      (clickEvent)="continue()"
    ></app-common-button-v35>
  </div>
</div>
