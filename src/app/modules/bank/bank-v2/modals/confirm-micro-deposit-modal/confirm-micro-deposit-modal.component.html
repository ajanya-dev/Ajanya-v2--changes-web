<div class="ocw_man_modal_wrapper category_modal">
  <form [formGroup]="confirmForm" (ngSubmit)="submit()">
    <div class="ocw_modal_header">
      <div class="ocw_modal_title">Confirm Micro Deposit</div>
      <div class="close_btn" [mat-dialog-close]="false">
        <svg
          aria-hidden="true"
          focusable="false"
          data-prefix="fal"
          data-icon="times"
          class="svg-inline--fa fa-times fa-w-10"
          role="img"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 320 512"
        >
          <path
            fill="currentColor"
            d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
          ></path>
        </svg>
      </div>
    </div>

    <!-- MODAL BODY START -->

    <div class="ocw_modal_body">
      <span class="error_msg common_err"></span>
      <div class="input_group">
        <div class="single_input">
          <input
            type="text"
            class="input_style"
            id="host"
            readonly
            placeholder=""
            formControlName="bankAccNumber"
            maxlength="40"
          />
          <span class="floating_label_field"
            >Bank Account Number: <span class="error_msg">*</span></span
          >
        </div>

        <div class="single_input">
          <input
            type="number"
            class="input_style"
            id="host"
            placeholder=" "
            formControlName="amount1"
            maxlength="40"
          />
          <span class="floating_label_field"
            >Amount 1 <span class="error_msg">*</span></span
          >
          <app-control-message
            [control]="confirmForm.controls.amount1"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="number"
            class="input_style"
            id="host"
            placeholder=" "
            formControlName="amount2"
            maxlength="40"
          />
          <span class="floating_label_field"
            >Amount 2: <span class="error_msg">*</span></span
          >
          <app-control-message
            [control]="confirmForm.controls.amount2"
          ></app-control-message>
        </div>

        <p class="note">Enter two amounts received in your Bank Account</p>

        <p class="alttempt">You have {{ attemptLeft }} Attempt left.</p>
      </div>
    </div>
    <!-- MODAL BODY END -->

    <div class="ocw_modal_footer">
      <mat-dialog-actions align="end">
        <button
          type="submit"
          class="ocw-btn ocw-btn-modal-blue add_btn"
          [disabled]="btnDesable"
        >
          SUBMIT
          <span *ngIf="btnDesable" class="loadingSpinner"></span>
        </button>
      </mat-dialog-actions>
    </div>
  </form>
</div>
