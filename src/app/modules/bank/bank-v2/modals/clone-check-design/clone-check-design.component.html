<div class="px-[6px] pb-[6px]">
  <!-- modal header -->
  <div class="flex justify-between pb-6">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
        <span class="pl-1 font-inter font-semibold text-base pb-0.5">
          Clone {{ bankNickName }}</span
        >
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="['fas', 'xmark']"
      ></fa-icon>
    </div>
  </div>
  <!-- modal body start -->
  <div
    class="check-canvas w-full h-40 relative border border-input-border-color rounded shadow-common-button overflow-hidden"
    [ngClass]="{ skelton: isLoading }"
    matTooltip="Check Design"
  >
    <canvas
      class="pointer-events-none translate-x-[-21.5%] translate-y-[-23%] scale-x-[0.57] scale-y-[0.54]"
      id="checkDesign"
      width="950"
      height="285"
    >
    </canvas>
  </div>
  <div class="mt-3.5">
    <p class="text-secondary-text-color text-center text-sm">
      Please select the accounts you want to <br />
      clone with the design
    </p>
  </div>

  <div class="mt-3.5">
    <label class="cursor-pointer flex items-center">
      <input
        type="checkbox"
        class="cursor-pointer"
        (change)="selectAll($event)"
        [(ngModel)]="isSelectedAllCheckBox"
      />
      <span class="ml-2 text-sm text-main-text-color"
        >Select All Accounts
        <fa-icon
          [icon]="faQuestionCircle"
          class="ml-1"
          matTooltip="All bank accounts will be cloned with the selected design"
      /></span>
    </label>
  </div>

  <form>
    <div class="custom-input-v3-wrapper flex grow shadow w-full mt-3">
      <div class="w-full" [hidden]="isSelectedAllCheckBox">
        <app-drop-down-bank-multi-select
          appendTo="body"
          class="w-full h-full"
          [isFromCloneCheck]="true"
          [enableAddNew]="true"
          [disableSelectionId]="cloningBankId"
          (selectionEvent)="getSelectedBank($event)"
          [isSliceNeed]="true"
          [removedId]="removedBankId"
        />
      </div>
      <div
        [hidden]="!isSelectedAllCheckBox"
        class="text-sm w-full px-2.5 py-[7px]"
      >
        All Bank accounts selected
      </div>
    </div>
  </form>
  @if (bankAccounts.length !== 0 && !isSelectedAllCheckBox) {
    <div
      class="w-full flex justify-between items-baseline flex-wrap mt-2 gap-2 overflow-auto max-h-80"
      [ngClass]="{ 'px-1': bankAccounts.length > 14 }"
    >
      @for (bank of bankAccounts; track bank) {
        <div
          class="w-[191px] bg-secondary-background-color min-h-7 rounded-sm flex justify-between px-1 items-center"
          [ngClass]="{ '!w-[180px]': bankAccounts.length > 14 }"
        >
          <div>
            <p
              class="text-main-text-color text-[13px]"
              [matTooltip]="bank.nickName.length > 15 ? bank.nickName : ''"
            >
              {{ bank.nickName | truncate: 15 }} {{ bank.accountNumber }}
            </p>
          </div>
          <div>
            <fa-icon
              class="text-secondary-text-color cursor-pointer text-[13px]"
              (click)="onRemoveBank(bank.id)"
              [icon]="['fas', 'xmark']"
            ></fa-icon>
          </div>
        </div>
      }
    </div>
  }
  <!-- modal body end -->
  <div class="flex justify-end gap-3 pt-8">
    <app-common-button-v35
      [type]="{ style: 'modal', name: 'main' }"
      text="Clone"
      [disabled]="cloning"
      [loading]="cloning"
      (clickEvent)="clone()"
    ></app-common-button-v35>
  </div>
</div>
