<div class="main_modal">
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">
      {{
        accountDetailsStep1
          ? "Upload documents"
          : "Physical card shipping address"
      }}
    </div>
    <div class="close_btn" [mat-dialog-close]="false">
      <i class="fa-duotone fa-x"></i>
    </div>
  </div>

  <div class="ocw_modal_body">
    <form *ngIf="addressForm" [formGroup]="addressForm">
      <div class="input_group">

        <div class="w-full pb-5" *ngIf="accountDetailsStep1 && addressForm">
          <select
            name="occupation"
            id="occupation"
            class="input_style"
            placeholder="Select"
            formControlName="occupation"
          >
            <option value disabled selected>Select Occupation</option>
            <option *ngFor="let type of occupation" [value]="type.key">
              {{ type.value }}
            </option>
          </select>
          <app-control-message
            [control]="addressForm.controls.occupation"
          ></app-control-message>
        </div>
        <!-- Shipping address details (For future use) -->
        <!-- <div class="single_input" *ngIf="!accountDetailsStep1">
                    <app-new-phone-input formControlName="phone"></app-new-phone-input>
                    <app-control-message [control]="addressForm.controls.phone"></app-control-message>
                </div>

                <div class="single_input" *ngIf="!accountDetailsStep1">
                    <input type="text" class="input_style" placeholder=" " formControlName="address1" #address1
                        (focus)="loadGoogleAddress(address1)" />
                    <span class="floating_label_field">Address line 1<span class="required">*</span></span>
                    <app-control-message [control]="addressForm.controls.address1"></app-control-message>
                </div>

                <div class="single_input" *ngIf="!accountDetailsStep1">
                    <input type="text" class="input_style" placeholder=" " formControlName="address2" />
                    <span class="floating_label_field">Address line 2</span>
                </div>

                <div class="single_input" *ngIf="!accountDetailsStep1">
                    <input type="text" class="input_style" placeholder=" " formControlName="city" />
                    <span class="floating_label_field">City<span class="required">*</span></span>
                    <app-control-message [control]="addressForm.controls.city"></app-control-message>
                </div>

                <div class="single_input" *ngIf="!accountDetailsStep1">
                    <input type="text" class="input_style" placeholder=" " formControlName="state" />
                    <span class="floating_label_field">State<span class="required">*</span></span>
                    <app-control-message [control]="addressForm.controls.state"></app-control-message>
                </div>

                <div class="single_input" *ngIf="!accountDetailsStep1">
                    <input type="text" class="input_style" placeholder=" " formControlName="country" />
                    <span class="floating_label_field">Country<span class="required">*</span></span>
                    <app-control-message [control]="addressForm.controls.country"></app-control-message>
                </div>

                <div class="single_input" *ngIf="!accountDetailsStep1">
                    <input type="text" class="input_style" placeholder=" " formControlName="zip" />

        <div class="single_input" *ngIf="accountDetailsStep1">
          <input
            type="file"
            (change)="onFile1Selected($event)"
            class="input_style"
            formControlName="document1"
          />
          <span class="floating_label_field"
            >Passport<span class="required">*</span></span
          >
          <app-control-message
            [control]="addressForm.controls.document1"
          ></app-control-message>
        </div>

        <div class="single_input" *ngIf="accountDetailsStep1">
          <input
            type="file"
            (change)="onFile2Selected($event)"
            class="input_style"
            formControlName="document2"
          />
          <span class="floating_label_field"
            >Visa<span class="required">*</span></span
          >
          <app-control-message
            [control]="addressForm.controls.document2"
          ></app-control-message>
        </div>
      </div>
    </form>
    <div *ngIf="!addressForm">
      <div class="input_group">
        <div
          class="w-full pb-5 skelton"
          *ngIf="accountDetailsStep1 && !addressForm"
        >
          <select
            name="occupation"
            id="occupation"
            placeholder="Select"
          ></select>
        </div>
        <div class="single_input skelton" *ngIf="accountDetailsStep1">
          <input type="file" class="input_style" />
        </div>
        <div class="single_input skelton" *ngIf="accountDetailsStep1">
          <input type="file" class="input_style" />
        </div>
      </div>
    </div>
  </div>

  <div class="ocw_modal_footer">
    <div class="action_buttons">
      <button class="back" mat-dialog-close>Cancel</button>
      <!-- <button class="next" *ngIf="accountDetailsStep1" (click)="accountDetailsStepChange()">
                Next
            </button> -->
      <!-- <button class="next" *ngIf="!accountDetailsStep1" (click)="addAddress()">
                Submit
            </button> -->
      <button class="next" *ngIf="accountDetailsStep1" (click)="addAddress()">
        Submit
      </button>
    </div>
  </div>
</div>
