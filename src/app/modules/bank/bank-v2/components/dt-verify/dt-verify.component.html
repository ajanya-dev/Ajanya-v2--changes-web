<div
  class="flex gap-1 items-center w-full"
  (mouseenter)="showFilterIconForRow(true)"
  (mouseleave)="showFilterIconForRow()"
>
  <div>
    <i [class]="iconClassL"></i>
    <a title="{{ title }}" [class]="class" (click)="doProcess(type)"
      >{{ label }}
      <span title="{{ spanTitle }}" [class]="spanClass">{{ spanLabel }}</span>
    </a>
    <i [class]="iconClassR" (click)="verifyInstantly()"></i>
  </div>
  @if (showFilterIcon) {
    <app-common-filter-icon (filterEvent)="onFilterClicked()" />
  }
</div>
