<div class="w-full flex justify-center mt-6">
  <div class="w-[750px] !bg-main-background-color rounded-md p-6">
    <div class="flex justify-start pb-5">
      <h3 class="text-main-text-color font-inter font-semibold">
        Import Bank Account
      </h3>
    </div>
    <div class="mt-5 flex justify-between">
      <div
        class="flex-1 !text-main-text-color font-inter text-sm font-medium mt-2"
      >
        Select File: <span class="required">*</span>
      </div>
      <div class="flex-1">
        <app-common-upload-button-v35
          buttonText="BROWSE"
          [acceptedFileTypes]="[
            '.pdf',
            '.csv',
            '.xlsx',
            '.xls',
            '.docx',
            '.doc',
            '.rtf',
            '.txt',
            '.jpg',
            '.png'
          ]"
          (selectedFileEvent)="onUploadFile($event)"
        ></app-common-upload-button-v35>
      </div>
    </div>
    <div class="flex justify-between">
      <div class="text-sm flex flex-col mt-6">
        <span class="mt-3 flex items-center gap-1 font-inter">
          <fa-icon
            class="text-common-blue-color"
            [icon]="faAngleRight"
          ></fa-icon>
          We expect you to have a header row on your Excel/CSV file.
        </span>
        <span class="mt-3 flex items-center gap-1 font-inter">
          <fa-icon
            class="text-common-blue-color"
            [icon]="faAngleRight"
          ></fa-icon>
          First row content will be removed
        </span>
        <span class="mt-3 flex items-center gap-1 font-inter">
          <fa-icon
            class="text-common-blue-color"
            [icon]="faAngleRight"
          ></fa-icon>
          We only support csv/xlsx file
        </span>
        <app-common-button-v35
          class="whitespace-nowrap mt-2"
          text="Download Sample File"
          [type]="{ name: 'list', style: 'blue' }"
          [disableHoverEffect]="false"
          customClasses="font-extralight p-0"
          backGroundInput="transparent"
          [isAddIcon]="true"
          [icon]="['fas', 'arrow-down-to-line']"
          (clickEvent)="downloadClick()"
        ></app-common-button-v35>
      </div>
      <div class="flex justify-end mt-7" [ngClass]="{ 'mr-4': isSubmitting }">
        <app-common-button-v35
          text="Submit"
          [disabled]="isSubmitting"
          [loading]="isSubmitting"
          [type]="{ style: 'filled', name: 'main' }"
          backGroundInput="var(--common-green-color)"
          customClasses="!w-[80px]"
          (clickEvent)="submit()"
        ></app-common-button-v35>
      </div>
    </div>
  </div>
</div>
