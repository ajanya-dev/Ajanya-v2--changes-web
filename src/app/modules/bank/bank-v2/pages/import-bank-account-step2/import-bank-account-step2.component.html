<div class="table-container bg-main-background-color pb-2">
  <div class="main_wrapper !w-auto">
    <div class="module_main_header">
      <div class="title">
        <h3 class="!text-main-text-color font-inter p-2 font-semibold text-xl">
          <app-common-back-button-v35></app-common-back-button-v35>
          Map Your Data
        </h3>
      </div>
    </div>

    <div class="!max-w-11/12 !max-h-[680px] flex flex-shrink !overflow-auto">
      <form [formGroup]="form">
        <table class="ocw-table ocw-table-bordered">
          <thead>
            @for (item of header; let i = $index; track item) {
              <td>
                <select
                  class="border border-input-border-color rounded-md w-[180px] h-[25px]"
                  [formControlName]="i"
                  (change)="onChange()"
                >
                  <option value="">--Match--</option>
                  @for (item of header; let j = $index; track item) {
                    <option [value]="j" [disabled]="arrs[j]">
                      {{ item }}
                    </option>
                  }
                </select>
              </td>
            }
          </thead>
          <tbody>
            @for (item of rows; let i = $index; track i) {
              <tr>
                @for (key of item; track key) {
                  <ng-container>
                    @if (i !== 0) {
                      <td>
                        {{ key }}
                      </td>
                    }
                  </ng-container>
                }
              </tr>
            }
          </tbody>
        </table>
      </form>
    </div>

    <div class="flex justify-end m-4" [ngClass]="{ 'mr-4': btnDisable }">
      <app-common-button-v35
        text="Submit"
        [disabled]="btnDisable"
        [loading]="btnDisable"
        [type]="{ style: 'filled', name: 'main' }"
        backGroundInput="var(--common-green-color)"
        customClasses="!w-[80px]"
        (clickEvent)="onSubmit()"
      ></app-common-button-v35>
    </div>
  </div>
</div>
