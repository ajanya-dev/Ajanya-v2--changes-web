  <span class="mt-20 w-full pl-[10%] text-2xl -mb-8"
    ><a class="cursor-pointer" (click)="onBackClick()"
      ><i class="fa-regular fa-arrow-left black-text"></i></a
  ></span>
  <div class="text-[28px] font-semibold">Select Your payment source</div>

    <div *ngFor="let item of cardsData">
      <div
        class="relative w-52 cursor-pointer rounded-md shadow flex flex-col items-center justify-between hover:shadow-xl hover:border card-border min-w-min"
        (click)="onCardClick(item?.onClickUrl)"
      >
        <div
          class="fdic rounded-t-md w-full h-7 items-center justify-center text-center my-auto text-[14px]"
          *ngIf="item?.fdic"
        >
          <span class="text-center">FDIC Insured</span>
        </div>
        <div
          class="flex justify-center"
          [ngClass]="item?.fdic ? 'my-3 pt-3' : 'my-8'"
        >
          <img
            src="../../../../../assets/icon/zil-wing.png"
            alt=""
            *ngIf="item?.fdic"
          />
          <i
            class="fa-thin {{ item?.icon }}"
            [ngClass]="
              item?.fdic
                ? 'cloud-bank'
                : item?.content === 'Add Bank Account'
                  ? 'text-[50px] bank-account'
                  : item?.content === 'Add Credit Card'
                    ? 'text-[50px] credit-card'
                    : ''
            "
          ></i>
        </div>
        <div class="h-full align-baseline mb-6">
          <p>{{ item?.content }}</p>
        </div>
      </div>
    </div>

</div>
