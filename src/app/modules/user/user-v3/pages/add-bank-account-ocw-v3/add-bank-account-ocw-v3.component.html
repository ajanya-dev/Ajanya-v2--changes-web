<div
  class="h-full w-full flex flex-col items-center text-main-text-color bg-main-background-color"
>
  <span class="mt-20 w-full pl-[7%] text-2xl -mb-8"
    ><a class="cursor-pointer" (click)="onBackClick()" role="presentation">
      <fa-icon [icon]="['fas', 'arrow-left']"></fa-icon> </a
  ></span>
  <div class="text-[28px] font-semibold">
    Choose a method to connect bank account
  </div>
  <div>
    Connect your existing bank account instantly or add your account manually.
  </div>
  <div class="mt-28 flex gap-5" style="flex-wrap: wrap">
    <div
      *ngFor="let item of cardsData"
      [ngClass]="{ skelton: isLoading }"
      style="flex: 1 1 0; min-width: 0"
    >
      <div
        class="w-52 h-full cursor-pointer rounded-md shadow flex flex-col items-center justify-between hover:shadow-xl hover:border card-border"
        [matTooltip]="(item?.id === 1 && !enablePlaid) ? 'Currently not available' : ''"
        [ngClass]="{'opacity-50 !cursor-default hover:shadow-none hover:border-none':item.id === 1 && !enablePlaid}"
        appOcwPreventMultiClick
        [throttleTime]="1000"
        (throttledClick)="
          onCardClick(
            item?.onClickUrl ? item?.onClickUrl : 'function',
            item.fdic ? true : false
          )
        "
      >
        <img
          src="../../../../../assets/icon/zil-wing.png"
          class="mt-4 mb-6"
          *ngIf="item?.fdic"
        />
        <div class="flex my-8 justify-center" *ngIf="!item.svg && !item.fdic">
          <i class="fa-thin {{ item?.icon }} text-[50px] icon-color"></i>
        </div>
        <div class="flex my-7 justify-center" *ngIf="item.svg">
          <img
            src="../../../../../assets/icon/connect-instantly.png"
            (load)="isLoading = false"
          />
        </div>
        <div class="h-full w-full flex flex-col items-center mb-5">
          <h3 class="font-semibold mb-5">{{ item?.title }}</h3>
          <div class="h-full flex w-[75%]">
            <p class="flex-1 font-light">{{ item.content }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
