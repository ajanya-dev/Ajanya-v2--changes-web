<div class="flex flex-col font-inter">
  <div
    class="p-5 font-medium text-sm text-main-text-color border-b border-b-input-border-color"
  >
    General Settings
  </div>
  <form [formGroup]="generalSettingsForm" class="grid grid-cols-2 p-5 gap-2.5">
    <div class="w-full flex flex-col gap-1.5 text-sm">
      <span class="text-secondary-text-color"
        >Time Zone <span class="text-common-red-color">*</span></span
      >
      <app-v35-common-dropdown
        [config]="{
          placeholder: 'Time Zone',
          displayField: 'name',
          style: {
            size: 0
          }
        }"
        [formControl]="getFormControl('systemTimezone')"
        [loading]="timeZoneLoading()"
        [listData]="timeZone"
        appendTo="body"
      />
      <app-control-message-v35
        [control]="getFormControl('systemTimezone')"
      >
      </app-control-message-v35>
    </div>

    <div class="w-full flex flex-col gap-1.5 text-sm">
      <span class="text-secondary-text-color"
        >Serial Number Format <span class="text-common-red-color">*</span></span
      >
      <app-v35-common-dropdown
        [config]="{
          placeholder: 'Serial Number Format',
          displayField: 'name',
          style: {
            size: 0
          }
        }"
        [listData]="serialNumberFormatting"
        [formControl]="getFormControl('serialFormatting')"
        appendTo="body"
      />
      <app-control-message-v35
        [control]="getFormControl('serialFormatting')"
      >
      </app-control-message-v35>
    </div>

    <div class="w-full flex flex-col gap-1.5 text-sm">
      <span class="text-secondary-text-color"
        >Amount Format <span class="text-common-red-color">*</span></span
      >
      <app-v35-common-dropdown
        [config]="{
          placeholder: 'Amount Format',
          displayField: 'name',
          style: {
            size: 0
          }
        }"
        [listData]="amountFormat"
        [formControl]="getFormControl('amountFormatting')"
        appendTo="body"
      />
      <app-control-message-v35
        [control]="getFormControl('amountFormatting')"
      >
      </app-control-message-v35>
    </div>

    <div class="w-full flex flex-col gap-1.5 text-sm">
      <span class="text-secondary-text-color"
        >Payee Name Format <span class="text-common-red-color">*</span></span
      >
      <app-v35-common-dropdown
        [config]="{
          placeholder: 'Payee Name Format',
          displayField: 'name',
          style: {
            size: 0
          }
        }"
        [listData]="payeeFormat"
        [formControl]="getFormControl('payeeFormatting')"
        appendTo="body"
      />
      <app-control-message-v35
        [control]="getFormControl('payeeFormatting')"
      >
      </app-control-message-v35>
    </div>

    <div class="w-full flex flex-col gap-1.5 text-sm">
      <span class="text-secondary-text-color"
        >Amounts in Words <span class="text-common-red-color">*</span></span
      >
      <app-v35-common-dropdown
        [config]="{
          placeholder: 'Amounts in Words',
          displayField: 'name',
          style: {
            size: 0
          }
        }"
        [listData]="amountWordingFormat"
        [formControl]="getFormControl('amountWordingFormatting')"
        appendTo="body"
      />
      <app-control-message-v35
        [control]="getFormControl('amountWordingFormatting')"
      >
      </app-control-message-v35>
    </div>

    <div class="w-full flex flex-col gap-1.5 text-sm">
      <span class="text-secondary-text-color"
        >Date Format <span class="text-common-red-color">*</span></span
      >
      <app-v35-common-dropdown
        [config]="{
          placeholder: 'Date Format',
          displayField: 'name',
          style: {
            size: 0
          }
        }"
        [listData]="dateFormate"
        [formControl]="getFormControl('systemDateFormat')"
        appendTo="body"
      />
      <app-control-message-v35
        [control]="getFormControl('systemDateFormat')"
      >
      </app-control-message-v35>
    </div>

    <div class="w-full flex flex-col gap-1.5 text-sm">
      <span class="text-secondary-text-color"
        >Currency Format <span class="text-common-red-color">*</span></span
      >
      <app-v35-common-dropdown
        [config]="{
          placeholder: 'Currency',
          displayField: 'name',
          style: {
            size: 0
          }
        }"
        [listData]="currencyFormat"
        [formControl]="getFormControl('userCurrency')"
        appendTo="body"
      />
      <app-control-message-v35
        [control]="getFormControl('userCurrency')"
      >
      </app-control-message-v35>
    </div>

    <div class="w-full flex flex-col gap-1.5 text-sm">
      <span class="text-secondary-text-color"
        >Language <span class="text-common-red-color">*</span></span
      >
      <app-v35-common-dropdown
        [config]="{
          placeholder: 'Language',
          displayField: 'name',
          style: {
            size: 0
          }
        }"
        [formControl]="getFormControl('userLanguage')"
        [listData]="languages"
        appendTo="body"
      />
      <app-control-message-v35
        [control]="getFormControl('userLanguage')"
      >
      </app-control-message-v35>
    </div>
  </form>
  <div class="flex justify-end px-5 pb-5">
    <button
      type="button"
      class="rounded-md bg-common-green-color text-white text-sm font-medium px-5 py-2 ocw-btn w-28 flex items-center justify-center gap-2"
      (click)="updateGeneralSettings()"
    >
      <span>Update</span>
      @if (loading()) {
        <span class="loadingSpinner"></span>
      }
    </button>
  </div>
</div>
