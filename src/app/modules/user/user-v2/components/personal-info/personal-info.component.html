<form [formGroup]="userForm">
  <div class="border-b border-input-border-color">
    <div class="flex p-7">
      <h3
        class="font-medium text-main-text-color text-sm items-center capitalize font-inter"
      >
        Personal Info
      </h3>
    </div>
  </div>
  <div class="p-7">
    <div class="flex items-center gap-8">
      <label class="cursor-pointer block relative">
        <figure>
          <img
            [ngSrc]="
              profilePic
                ? profilePic
                : 'assets/images/blank-profile-picture.png'
            "
            class="object-cover rounded-full border-2 border-input-border-color"
            id="item-img-output"
            alt="profile"
            width="80"
            height="80"
          />
          <figcaption
            class="absolute bottom-[1px] right-[3px] text-main-text-color bg-main-background-color w-6 h-6 rounded-full text-center"
          >
            <fa-icon [icon]="faCamera" />
          </figcaption>
        </figure>
        <input
          type="file"
          onclick="this.value=null"
          class="absolute hidden opacity-0"
          name=""
          (change)="openDialog($event)"
          accept="image/png, image/jpeg"
        />
        @if (userService.isLoadingUserDetailsSignal() || loading()) {
          <div
            class="absolute bg-secondary-background-color w-20 h-20 opacity-50 top-0 flex justify-center items-center"
          >
            <fa-icon [icon]="faSpinner" animation="spin" />
          </div>
        }
      </label>
      <div class="flex flex-col gap-1 min-w-0">
        <h3
          class="text-main-text-color text-[13px] font-roboto font-semibold cursor-pointer"
          [ngClass]="{
            'skelton h-6 w-28': userService.isLoadingUserDetailsSignal(),
            truncate: !isNameExpanded,
            'break-words': isNameExpanded
          }"
          role="button"
          tabindex="0"
          (click)="isNameExpanded = !isNameExpanded"
          (keydown.enter)="isNameExpanded = !isNameExpanded"
          (keydown.space)="isNameExpanded = !isNameExpanded"
        >
          {{ userForm.controls.firstName.value }}
        </h3>
        <span
          class="font-roboto font-normal text-secondary-text-color text-xs truncate"
          [ngClass]="{
            'skelton h-5 w-28': userService.isLoadingUserDetailsSignal()
          }"
          >{{ userForm.controls.email.value }}</span
        >
      </div>
    </div>
  </div>
  <div class="flex flex-col gap-5 p-7">
    <div class="grid grid-cols-4 gap-5">
      <div [ngClass]="{ skelton: userService.isLoadingUserDetailsSignal() }">
        <app-common-input-field
          placeholder="First Name"
          formControlName="firstName"
          [maxLength]="100"
        />
        <app-control-message-v35 [control]="userForm.controls.firstName" />
      </div>
      <div [ngClass]="{ skelton: userService.isLoadingUserDetailsSignal() }">
        <app-common-input-field
          placeholder="Last Name"
          formControlName="lastName"
          [isFieldRequired]="false"
          [maxLength]="50"
        />
        <app-control-message-v35 [control]="userForm.controls.lastName" />
      </div>
      <div
        class="col-span-2"
        [ngClass]="{ skelton: userService.isLoadingUserDetailsSignal() }"
      >
        <app-common-input-field
          placeholder="Display Name"
          formControlName="displayName"
          [isFieldRequired]="false"
          [maxLength]="30"
        />
        <app-control-message-v35 [control]="userForm.controls.displayName" />
      </div>
    </div>

    <div class="grid grid-cols-4 gap-5">
      <div
        class="max-xl:col-span-2"
        [ngClass]="{ skelton: userService.isLoadingUserDetailsSignal() }"
      >
        <app-common-input-field
          placeholder="Email"
          formControlName="email"
          [readOnly]="isEmailVerified"
          [isFieldRequired]="false"
        />
        <app-control-message-v35 [control]="userForm.controls.email" />
      </div>
      <div
        class="single_input profile-phone-input w-full max-xl:col-span-2"
        [ngClass]="{ skelton: userService.isLoadingUserDetailsSignal() }"
      >
        <app-new-phone-input
          formControlName="phone"
          [isReadOnly]="isPhoneVerified"
          (countryDropdown)="countryChange($event)"
          (countryCodeEmit)="countryCodeChange($event)"
        ></app-new-phone-input>
        <app-control-message
          [control]="userForm.controls.phone"
        ></app-control-message>
      </div>
      <div
        class="single_input w-full max-xl:col-span-2"
        [ngClass]="{ skelton: userService.isLoadingUserDetailsSignal() }"
      >
        <input
          type="text"
          class="input_style !bg-main-background-color pr-8"
          maxlength="18"
          placeholder=" "
          formControlName="ssn"
          [mask]="mask"
          [patterns]="customPattern"
          [hiddenInput]="true"
          (copy)="(false)"
          (cut)="(false)"
        />
        <label
          for="ssn"
          class="floating_label_field !bg-main-background-color !text-sm !text-secondary-text-color"
          >SSN</label
        >
        @if (userForm.controls.ssn.value) {
          <fa-icon
            [icon]="ssnRevealed ? faEyeSlash : faEye"
            (click)="toggleSsnReveal()"
            class="text-secondary-text-color eye-btn"
          ></fa-icon>
        }
        <app-control-message-v35
          [control]="userForm.controls.ssn"
        ></app-control-message-v35>
      </div>
      <div
        class="max-xl:col-span-2"
        [ngClass]="{ skelton: userService.isLoadingUserDetailsSignal() }"
      >
        <app-v3-date-picker
          placeholder="Date of Birth"
          formControlName="date"
          [maxDate]="maxDobDate"
          [minDate]="minDobDate"
          [hideTodayShortcut]="true"
          [isFieldRequired]="false"
          [control]="userForm.controls.date"
          [maskDisplay]="true"
        />
      </div>
    </div>
    <div class="grid grid-cols-4 gap-5">
      <div
        class="col-span-2"
        [ngClass]="{ skelton: userService.isLoadingUserDetailsSignal() }"
      >
        <app-common-input-field
          placeholder="Address Line 1"
          formControlName="address1"
          [isFieldRequired]="false"
          [maxLength]="50"
          (inputFocusEvent)="loadGoogleAddress($event)"
        />
        <app-control-message-v35 [control]="userForm.controls.address1" />
      </div>
      <div
        class="col-span-2"
        [ngClass]="{ skelton: userService.isLoadingUserDetailsSignal() }"
      >
        <app-common-input-field
          placeholder="Address Line 2"
          formControlName="address2"
          [isFieldRequired]="false"
          [maxLength]="50"
        />
        <app-control-message-v35 [control]="userForm.controls.address2" />
      </div>
    </div>
    <div class="grid grid-cols-4 gap-5">
      <div [ngClass]="{ skelton: userService.isLoadingUserDetailsSignal() }">
        <app-common-input-field
          placeholder="City"
          formControlName="city"
          [isFieldRequired]="false"
          [maxLength]="50"
        />
        <app-control-message-v35 [control]="userForm.controls.city" />
      </div>
      <div [ngClass]="{ skelton: userService.isLoadingUserDetailsSignal() }">
        <app-common-input-field
          placeholder="State"
          formControlName="state"
          [isFieldRequired]="false"
          [maxLength]="50"
        />
        <app-control-message-v35 [control]="userForm.controls.state" />
      </div>
      <div [ngClass]="{ skelton: userService.isLoadingUserDetailsSignal() }">
        <app-common-input-field
          [placeholder]="
            userForm.get('country')?.value === 'US' ||
            userForm.get('country')?.value === ''
              ? 'Zip'
              : 'Postal Code'
          "
          formControlName="zip"
          maxLength="10"
          [isFieldRequired]="false"
        />
        <app-control-message-v35 [control]="userForm.controls.zip" />
      </div>
      <div
        class="single_input profile-country-input w-full"
        [ngClass]="{ skelton: userService.isLoadingUserDetailsSignal() }"
      >
        <app-common-country-drop-down
          formControlName="country"
          [isV3Component]="false"
        ></app-common-country-drop-down>
      </div>
    </div>

    <div class="flex justify-end">
      <app-common-button-v35
        [ngClass]="{ skelton: userService.isLoadingUserDetailsSignal() }"
        [type]="{ style: 'filled', name: 'main' }"
        backGroundInput="var(--common-green-color)"
        textColorInput="white"
        text="Update"
        (clickEvent)="onSubmit()"
        width="125px"
        [disabled]="btnDesable"
        [loading]="btnDesable"
      />
    </div>
  </div>
</form>
