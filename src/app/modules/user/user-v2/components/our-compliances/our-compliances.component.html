<div class="flex flex-col font-inter">
  <div
    class="p-5 font-medium text-sm text-main-text-color border-b border-b-input-border-color"
  >
    Our Compliance
  </div>
  <div class="w-full p-6 flex justify-center">
    <div class="grid grid-cols-4 gap-5">
    @for (item of certificates; track item) {
        <div
          class="flex flex-col gap-2 items-center cursor-pointer border border-input-border-color bg-main-background-color hover:bg-secondary-background-color rounded-lg p-2.5 shadow-md"
          (click)="showCertificationDetailsModal(item)"
          tabindex="0"
          (keypress)="onKeyPress($event, item)"
        >
          <div class="w-16 h-16 mb-2 flex items-center justify-center">
            <img [src]="item.image" [alt]="item.name" class="w-full h-full object-contain" />
          </div>
          <h3 class="text-sm text-main-text-color font-medium text-center">
            {{ item.name }}
          </h3>
          <p class="flex justify-start text-center text-xs text-secondary-text-color mt-1">
            {{ item.description }}
          </p>
          <div class="mt-2 flex items-center">
            <span
              class="px-3.5 py-1 text-common-green-color bg-common-secondary-green-color text-xs rounded-full"
            >
              {{ item.status }}
            </span>
          </div>
        </div>
      }
    </div>
  </div>
</div>
