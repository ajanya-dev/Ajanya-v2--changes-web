<div class="rounded border border-input-border-color p-3.5">
  <h4
    [id]="labelId"
    class="mb-2.5 text-[12px] font-semibold uppercase tracking-wide text-secondary-text-color"
  >
    {{ tabOrderText.previewLabel }}
  </h4>

  @if (!isEmpty) {
    <ul
      class="preview-tabs flex flex-wrap gap-5 p-0 m-0 list-none"
      [attr.aria-labelledby]="labelId"
    >
      @for (tab of tabs; track tab.number) {
        <li
          class="preview-tab relative pb-1.5 text-[13px]"
          [class.preview-tab--default]="isDefault(tab)"
        >
          {{ tab.name }}
          @if (isDefault(tab)) {
            <span class="sr-only">(default tab)</span>
          }
        </li>
      }
    </ul>
  } @else {
    <p class="m-0 text-[12px] text-secondary-text-color">
      {{ tabOrderText.emptySelected }}
    </p>
  }

  @if (isDefaultMissing) {
    <p class="mt-2.5 mb-0 text-[12px] text-common-yellow-color">
      {{ tabOrderText.defaultTabMissing }}
    </p>
  }
</div>
