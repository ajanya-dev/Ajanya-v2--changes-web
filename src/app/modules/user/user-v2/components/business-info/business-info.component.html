<form [formGroup]="businessForm" (ngSubmit)="submit()" novalidate>
  <div class="form-account-info p-5 mt-6 !bg-tertiary-background-color">
    <div class="flex frc">
      <div class="single_input w-full">
        <input
          formControlName="businessLegalName"
          maxlength="60"
          type="text"
          class="input_style"
          value=""
          placeholder=" "
        />
        <label class="floating_label_field"
          >Business Legal Name<span class="req_star">*</span>
        </label>
        <app-control-message
          [control]="businessForm.controls.businessLegalName"
        ></app-control-message>
      </div>
    </div>

    <div class="flex frc">
      <div class="single_input w-full">
        <input
          formControlName="businessAddress1"
          type="text"
          class="input_style"
          id="names"
          value=""
          placeholder=" "
          #searchAddress
          (focus)="loadGoogleAddress(searchAddress)"
        />
        <label class="floating_label_field">Address Line 1</label>
      </div>

      <div class="single_input w-full">
        <input
          formControlName="businessAddress2"
          type="text"
          class="input_style"
          value=""
          placeholder=" "
        />
        <label class="floating_label_field">Address Line 2</label>
      </div>
    </div>

    <div class="flex frc">
      <div class="single_input w-full">
        <input
          formControlName="city"
          type="text"
          class="input_style"
          value=""
          placeholder=" "
          maxlength="50"
        />
        <label class="floating_label_field">City</label>
      </div>
      <div class="single_input w-full">
        <input
          formControlName="state"
          type="text"
          class="input_style"
          value=""
          placeholder=" "
        />
        <label class="floating_label_field">State</label>
      </div>
      <div class="single_input w-full">
        <input
          formControlName="zip"
          type="text"
          class="input_style"
          value=""
          placeholder=" "
        />
        @if (
          businessForm.get("country")?.value === "US" ||
          businessForm.get("country")?.value === ""
        ) {
          <label class="floating_label_field">Zip</label>
        } @else {
          <label class="floating_label_field">Postal Code</label>
        }
        <app-control-message
          [control]="businessForm.controls.zip"
        ></app-control-message>
      </div>
      <div class="single_input profile-country-input w-full">
        <app-common-country-drop-down
          formControlName="country"
          [isV3Component]="false"
        ></app-common-country-drop-down>
      </div>
    </div>

    <div class="flex frc">
      <div class="single_input w-full">
        <select
          class="form-select input_style"
          value="null"
          formControlName="entityType"
        >
          <option selected disabled value="">Entity Type</option>
          @for (item of enityType; track item) {
            <option [value]="item.value">
              {{ item.name }}
            </option>
          }
        </select>
      </div>
      <div class="single_input w-full">
        <input
          formControlName="dba"
          type="text"
          class="input_style"
          value=""
          placeholder=" "
        />
        <label class="floating_label_field">DBA</label>
      </div>
    </div>

    <div class="flex frc">
      <div class="single_input w-full">
        <select class="form-select input_style" formControlName="industryType">
          <option selected disabled value="">Primary Industry Type</option>
          @for (item of industryType; track item) {
            <option [value]="item.value">
              {{ item.name }}
            </option>
          }
        </select>
      </div>
      <div class="single_input w-full">
        <select
          class="form-select input_style"
          formControlName="secondaryIndustryType"
        >
          <option selected disabled value="">Secondary Industry Type</option>
          @for (item of secondaryIndustryType; track item) {
            <option [value]="item.id">
              {{ item.name }}
            </option>
          }
        </select>
      </div>
    </div>

    <div class="flex frc">
      <div class="single_input date-range-picker m-0 w-full">
        <input
          type="date"
          formControlName="date"
          class="input_style"
          [max]="nowDate"
        />
        <label class="floating_label_field">Formation Date</label>
        <app-control-message
          [control]="businessForm.controls.date"
        ></app-control-message>
      </div>
      <div class="single_input w-full">
        <input
          formControlName="ein"
          type=""
          mask="00-0000000"
          class="input_style"
          value=""
          placeholder="xx-xxxxxxx"
        />
        <label class="floating_label_field">EIN</label>
        <app-control-message
          [control]="businessForm.controls.ein"
        ></app-control-message>
      </div>
    </div>
    <div class="flex frc company_id">
      <p>Company ID: {{ companyId }}</p>
    </div>

    <div class="grid justify-items-end mt-6">
      <button
        type="submit"
        class="ocw-btn-dark-green ocw-btn"
        [disabled]="btnDesable"
      >
        @if (!btnDesable) {
          <ng-container>
            <span>{{ btnDesable ? "" : "UPDATE" }}</span>
          </ng-container>
        }
        @if (btnDesable) {
          <span class="loadingSpinner"></span>
        }
      </button>
    </div>
  </div>
</form>
