<div class="flex flex-col font-inter">
  <div
    class="p-5 font-medium text-sm text-main-text-color border-b border-b-input-border-color"
  >
    Advanced Settings
  </div>

  <div class="p-6 grid grid-cols-2 gap-5">
    @for (item of adVanceSettings(); track item) {
      @if (item.en_id !== 12 && item.en_id !== '12') {
        <div
          class="bg-tertiary-background-color rounded-md flex flex-col gap-4 p-4"
        >
          <div class="flex items-center gap-4">
            <div class="flex flex-col gap-1 h-full justify-start w-full">
              <p class="text-main-text-color font-medium text-base">
                {{ item.name }}
              </p>
              <p class="text-secondary-text-color font-normal text-sm">
                {{ item.description }}
              </p>
            </div>
            <div>
              <label class="switch">
                <input
                  #checked
                  type="checkbox"
                  [value]="item.en_id"
                  [checked]="item.status === 1 || item.status === '1'"
                  (change)="onChange(checked.value, item.status)"
                />
                <span class="slider"></span>
              </label>
            </div>
          </div>
          @if (showBanksList() && (item.en_id === 5 || item.en_id === '5')) {
            <div class="flex flex-col gap-3"
            [ngClass]="{'hidden':(item.status === 0 || item.status === '0') && !loading()}"
            >
              <app-drop-down-bank-multi-select
                [ngClass]="{'skelton':(item.status === 0 || item.status === '0') && loading()}"
                placeholder="Select Bank Accounts"
                (selectionEvent)="onBankSelection($event)"
                [selectedBankAccountIds]="getBankAccounts()"
              ></app-drop-down-bank-multi-select>
              <div class="flex justify-end">
                <app-common-button-v35
                  [ngClass]="{'skelton':(item.status === 0 || item.status === '0') && loading()}"
                  text="Apply"
                  [type]="{ style: 'filled', name: 'main' }"
                  (clickEvent)="applyWithBanks()"
                  [loading]="loading()"
                  [disabled]="loading()"
                ></app-common-button-v35>
              </div>
            </div>
          }
        </div>
      }
    }
  </div>
</div>
