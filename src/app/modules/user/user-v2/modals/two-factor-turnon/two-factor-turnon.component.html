<div class="px-[6px] pb-[6px]">
  <div class="flex justify-end pb-4">
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      ></fa-icon>
    </div>
  </div>
  <div class="flex flex-col items-center">
    <fa-icon [icon]="faCircleCheck" class="text-common-green-color text-6xl" />
    <h3 class="font-inter font-bold text-main-text-color py-4 flex gap-1">
      Two factor Authentication is
      <p class="text-common-blue-color font-inter font-bold">Activated</p>
    </h3>
    <div
      class="flex justify-center items-center p-2 w-full rounded bg-secondary-background-color"
    >
      <input
        class="cursor-pointer rounded-xl w-4 h-4"
        type="checkbox"
        id="backupCode"
        name="backupCode"
        (click)="Backup($event)"
      />
      <label
        for="backupCode"
        class="ml-4 text-main-text-color font-inter font-semibold cursor-pointer text-sm"
        >Activate backup code</label
      >
    </div>
    @if (backupCpdes) {
      <div>
        <p
          class="font-inter text-main-text-color font-normal text-sm py-4 text-justify"
        >
        If two-factor authentication fails, you can use these recovery codes to log in. Keep these codes safe and private. The codes will be downloaded automatically.
        </p>

        <div class="grid grid-cols-2 gap-1 justify-center bg-secondary-background-color rounded-md p-2">
          @for (code of backupCodesGroup; track $index) {
            <h5
              class="font-inter text-main-text-color text-center font-normal text-sm px-1 py-[6px]"
            >
              {{ code }}
            </h5>
          }
        </div>

        <div class="flex justify-center pt-4">
          <app-common-button-v35
            download="backup-codes.txt"
            class="!w-full"
            customClasses="!w-full"
            [type]="{ style: 'modal', name: 'main' }"
            text="Done"
            (clickEvent)="activateBackupCode()"
            [disabled]="btnDidsabled"
            [loading]="btnDidsabled"
            backGroundInput="var(--common-blue-color)"
          ></app-common-button-v35>
        </div>
      </div>
    }
  </div>
</div>
