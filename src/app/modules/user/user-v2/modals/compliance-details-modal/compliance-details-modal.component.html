<div class="w-full p-3 rounded-xl space-y-6">
  <div class="flex justify-between border-b border-b-input-border-color pb-6">
    <div class="flex items-center space-x-3">
      <img [src]="data.image" alt="Certificate Logo" class="w-12 h-12 object-contain" />
      <h2 class="text-xl font-semibold text-main-text-color">{{ data.name }}</h2>
    </div>
    <div class="flex flex-col justify-start">
      <button (click)="dialogRef.close()" class="text-main-text-color text-xl">&times;</button>
    </div>
  </div>

  <div>
    <h3 class="font-semibold text-main-text-color mb-1.5">Description</h3>
    <p class="text-sm text-secondary-text-color">
      {{ certificateDescription }}
    </p>
  </div>

  <div class="mb-6">
    <h3 class="font-semibold text-main-text-color mb-1.5">Applicable to</h3>
    <p class="text-sm text-secondary-text-color">
      {{ certificateApplicableTo }}
    </p>
  </div>
