<div class="px-[6px] pb-[6px]">
  <div class="flex justify-between pb-2">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
        <span class="font-inter font-semibold text-base pb-0.5">{{
          data?.mode === "advancedtwofactor"
            ? "Disable Advanced Two-Factor Authentication"
            : "Disable Two-Factor Authentication"
        }}</span>
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      ></fa-icon>
    </div>
  </div>
  <div class="flex flex-col items-left">
    <h5
      class="font-inter font-normal text-secondary-text-color text-sm py-4 text-left"
    >
    An OTP has been sent to your verified email address and phone number.
    </h5>

    <!-- OTP Sent Notification -->
    <div class="bg-common-secondary-blue-color border border-input-border-color rounded p-3 mb-4">
      <div class="flex items-left">
        <div>
          <div class="flex">
            <fa-icon [icon]="faEnvelopeCircleCheck" class="text-common-blue-color mr-2"></fa-icon>
            <div class="text-sm font-semibold text-common-dark-blue-color">OTP Sent</div>
          </div>
          <div class="text-xs text-common-blue-color ml-6">Please check your verified email address and phone number.</div>
        </div>
      </div>
    </div>

    <div class="mb-2">
      <label class="block text-sm font-medium mb-2 text-left" for="otp0">Enter OTP</label>
      <div class="otp-box !text-left">
        <input
          class="otp w-10 h-10 px-3 py-1.5 mx-0.5 text-base font-normal leading-normal bg-secondary-background-color border border-input-border-color rounded text-center shadow-xs"
          type="number"
          id="otp0"
          #box1
          (paste)="sharedService.onPaste($event)"
          (keypress)="utils.numberOnly($event, 'numeric')"
          (click)="clickVal(box1)"
          (keyup)="tabChange($event, box2, box1, 0)"
          oninput="javascript: if (this.value.length > this.maxLength) this.value = this.value.slice(0, this.maxLength);"
          maxlength="1"
        />
        <input
          (paste)="sharedService.onPaste($event)"
          class="otp w-10 h-10 px-3 py-1.5 mx-0.5 text-base font-normal leading-normal bg-secondary-background-color border border-input-border-color rounded text-center shadow-xs"
          type="number"
          id="otp1"
          #box2
          (keypress)="utils.numberOnly($event, 'numeric')"
          (click)="clickVal(box2)"
          (keyup)="tabChange($event, box3, box1, 1)"
          oninput="javascript: if (this.value.length > this.maxLength) this.value = this.value.slice(0, this.maxLength);"
          maxlength="1"
        />
        <input
          (paste)="sharedService.onPaste($event)"
          class="otp w-10 h-10 px-3 py-1.5 mx-0.5 text-base font-normal leading-normal bg-secondary-background-color border border-input-border-color rounded text-center shadow-xs"
          type="number"
          id="otp2"
          #box3
          (keypress)="utils.numberOnly($event, 'numeric')"
          (click)="clickVal(box3)"
          (keyup)="tabChange($event, box4, box2, 2)"
          oninput="javascript: if (this.value.length > this.maxLength) this.value = this.value.slice(0, this.maxLength);"
          maxlength="1"
        />
        <input
          (paste)="sharedService.onPaste($event)"
          class="otp w-10 h-10 px-3 py-1.5 mx-0.5 text-base font-normal leading-normal bg-secondary-background-color border border-input-border-color rounded text-center shadow-xs"
          type="number"
          id="otp3"
          #box4
          (keypress)="utils.numberOnly($event, 'numeric')"
          (click)="clickVal(box4)"
          (keyup)="tabChange($event, box5, box3, 3)"
          oninput="javascript: if (this.value.length > this.maxLength) this.value = this.value.slice(0, this.maxLength);"
          maxlength="1"
        />
        <input
          (paste)="sharedService.onPaste($event)"
          class="otp w-10 h-10 px-3 py-1.5 mx-0.5 text-base font-normal leading-normal bg-secondary-background-color border border-input-border-color rounded text-center shadow-xs"
          type="number"
          id="otp4"
          #box5
          (keypress)="utils.numberOnly($event, 'numeric')"
          (click)="clickVal(box5)"
          (keyup)="tabChange($event, box6, box4, 4)"
          oninput="javascript: if (this.value.length > this.maxLength) this.value = this.value.slice(0, this.maxLength);"
          maxlength="1"
        />
        <input
          (paste)="sharedService.onPaste($event)"
          class="otp w-10 h-10 px-3 py-1.5 mx-0.5 text-base font-normal leading-normal bg-secondary-background-color border border-input-border-color rounded text-center shadow-xs"
          type="number"
          id="otp5"
          #box6
          (keypress)="utils.numberOnly($event, 'numeric')"
          (click)="clickVal(box6)"
          (keyup)="tabChange($event, box6, box5, 5)"
          oninput="javascript: if (this.value.length > this.maxLength) this.value = this.value.slice(0, this.maxLength);"
          maxlength="1"
        />
      </div>
    </div>
  </div>
  <div class="flex justify-center gap-3 pt-4">
    <app-common-button-v35
      width="192px"
      mat-dialog-close
      [type]="{ style: 'bordered', name: 'main' }"
      text="Cancel"
    ></app-common-button-v35>
    <app-common-button-v35
      width="192px"
      [type]="{ style: 'modal', name: 'main' }"
      text="Disable"
      (clickEvent)="submit()"
      [disabled]="submitBtnDisable"
      [loading]="submitBtnDisable"
      backGroundInput="var(--common-blue-color)"
    ></app-common-button-v35>
  </div>
</div>
