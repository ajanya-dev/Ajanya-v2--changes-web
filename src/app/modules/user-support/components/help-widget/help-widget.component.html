<div class="help-section">
  <h1>HELP</h1>

  <div class="help_options">
    <a>
      <fa-icon
        (click)="goToLiveChat()"
        class="!text-[22px] !text-common-blue-color"
        [icon]="['fas', 'message']"
      ></fa-icon>

      <div>Live Chat</div>
    </a>

    <a [href]="'mailto:' + staticWhiteLabelConditions.customerSupportEmail">
      <fa-icon
        class="!text-[22px] !text-common-blue-color"
        [icon]="['fas', 'envelope']"
      ></fa-icon>

      <div>
        {{ staticWhiteLabelConditions.customerSupportEmail }}
      </div>
    </a>
    @if (staticWhiteLabelConditions.customerSupportNo) {
      <ng-container>
        <a [href]="'tel:' + staticWhiteLabelConditions.customerSupportNo">
          <fa-icon
            class="!text-[22px] !text-common-blue-color"
            [icon]="['fas', 'headset']"
          ></fa-icon>
          <div>Call at {{ staticWhiteLabelConditions.customerSupportNo }}</div>
        </a>
      </ng-container>
    } @else {
      <ng-container>
        <a [href]="staticWhiteLabelConditions.helpWebsite">
          <fa-icon
            class="!text-[22px] !text-common-blue-color"
            [icon]="['fas', 'headset']"
          ></fa-icon>
          <div>Contact Us {{ staticWhiteLabelConditions.helpWebsite }}</div>
        </a>
      </ng-container>
    }
  </div>
</div>
