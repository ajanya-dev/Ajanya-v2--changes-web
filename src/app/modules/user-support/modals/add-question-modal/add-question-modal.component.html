<div class="ocw_man_modal_wrapper category_modal">
  <form [formGroup]="questionForm" (ngSubmit)="onSubmit()">
    <div class="flex justify-between pb-6">
      <div>
        <span
          class="mt-18 w-full text-base text-main-text-color align-middle flex items-center\"
        >
          <span class="pl-1 font-inter font-semibold text-base pb-0.5\">
            Ask a question
          </span>
        </span>
      </div>
      <div [mat-dialog-close]="false">
        <fa-icon
          class="text-secondary-text-color cursor-pointer"
          [icon]="faXmark"
        ></fa-icon>
      </div>
    </div>

    <!-- MODAL BODY START -->
    <div class="ocw_modal_body">
      <div class="input_group">
        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="categoryName"
            maxlength="40"
          />
          <span class="floating_label_field"
            >Subject <span class="required">*</span></span
          >
          <app-control-message
            [control]="questionForm.controls.categoryName"
            labelName="Subject is Required"
          ></app-control-message>
        </div>
        <div class="single_input">
          <select
            name=""
            id=""
            class="input_style"
            formControlName="categoryType"
          >
            <option value="" selected disabled>Severity</option>
            <option value="1">Low</option>
            <option value="2">Medium</option>
            <option value="3">High</option>
          </select>
          <span></span>
          <app-control-message
            [control]="questionForm.controls.categoryType"
            labelName="Select Severity Type"
          ></app-control-message>
        </div>
        <div class="single_input">
          <textarea
            type="text"
            class="input_style"
            id="categoryMessege"
            placeholder=" "
            formControlName="categoryMessege"
            maxlength="240"
          ></textarea>
          <span class="floating_label_field"
            >Message <span class="required">*</span></span
          >
          <app-control-message
            [control]="questionForm.controls.categoryMessege"
            labelName="Message is Required"
          ></app-control-message>
        </div>

        <div class="ocw-browse-file mt-3">
          <input type="hidden" class="" value="" name="" maxlength="30" />
          <input
            type="file"
            (change)="uploadInput($event)"
            class="custom-file-input"
            #input1
            name="quesAttachment"
            accept=".pdf,.csv,.xlsx,.xls,.docx,.doc,.rtf,.txt,.jpg,.png"
          />
          <label class="doc-name">
            <span>{{
              fileNameOne !== "" ? fileNameOne : "Upload Document"
            }}</span>
          </label>
        </div>
      </div>
    </div>
    <!-- MODAL BODY END -->

    <div class="ocw_modal_footer">
      <mat-dialog-actions align="end">
        <button mat-dialog-close class="ocw-btn ocw-btn-modal-bordered">
          Close
        </button>
        <button
          type="submit"
          class="ocw-btn ocw-btn-modal-blue add_btn"
          [disabled]="loading || btnDisable"
        >
          @if (!loading) {
            <ng-container>
              <span> Send </span>
            </ng-container>
          }
          @if (loading) {
            <span class="loadingSpinner"></span>
          }
        </button>
      </mat-dialog-actions>
    </div>
  </form>
</div>
