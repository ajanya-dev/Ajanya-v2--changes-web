<div class="px-[6px] pb-[6px] font-inter">
  <!-- Modal Header -->
  <div class="flex justify-between items-center mb-5">
    <h2 class="font-semibold text-lg text-main-text-color">How can we help?</h2>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      />
    </div>
  </div>

  <!-- Modal Body -->
  <div>
    <div class="grid grid-cols-2 gap-4">
      @for (option of requestOptions; track option.value) {
        <div
          role="presentation"
          class="flex flex-col items-center justify-center border border-input-border-color rounded-lg cursor-pointer transition-all duration-200 pb-3 pt-[14px] group hover:shadow-common-box-shadow option-card"
          tabindex="0"
          [ngClass]="{
            '!border-common-blue-color !shadow-common-box-shadow':
              selectedOption === option.value
          }"
          (click)="selectOption(option.value)"
        >
          <div
            class="w-12 h-12 rounded-lg flex items-center justify-center mb-1"
            [style.background-color]="option.backgroundColor"
            [ngClass]="{
              '!shadow-common-box-shadow': selectedOption === option.value
            }"
          >
            <fa-icon
              [icon]="option.icon"
              [style.color]="option.color"
              class="text-xl"
            />
          </div>
          <span class="text-sm font-medium text-main-text-color text-center">{{
            option.label
          }}</span>
        </div>
      }
    </div>
  </div>
</div>
