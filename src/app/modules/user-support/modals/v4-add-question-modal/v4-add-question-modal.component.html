<div class="flex flex-col font-funnel rounded-2xl overflow-hidden">
  <form [formGroup]="questionForm" (ngSubmit)="onSubmit()">
    <!-- modal header -->
    <div
      class="flex justify-between items-start px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
    >
      <div class="flex items-start gap-2.5">
        <lucide-icon
          [img]="infoIcon"
          [size]="22"
          class="text-v4-primary-brand-bold-color mt-0.5 shrink-0"
        />
        <div class="flex flex-col">
          <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel leading-tight">
            Create Support Ticket
          </h1>
          <p class="text-xs text-v4-subtle-text-color mt-0.5 font-peridot">
            We'll get back to you as soon as possible
          </p>
        </div>
      </div>
      <button
        type="button"
        [mat-dialog-close]="false"
        class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
      >
        <lucide-icon [img]="closeIcon" class="text-v4-subtle-text-color" />
      </button>
    </div>

    <!-- modal body start -->
    <div class="p-6 bg-v4-tertiary-background-color max-h-[70vh] overflow-y-auto">
      <div class="flex flex-col gap-4">
        <!-- Subject -->
        <app-common-input-v4
          [fieldLabel]="'Subject'"
          [placeholder]="'Brief description of your issue'"
          [isFieldRequired]="true"
          [maxLength]="40"
          [control]="questionForm.controls.subject"
          [fieldHeight]="'44px'"
          formControlName="subject"
        />

        <!-- Severity -->
        <div class="flex flex-col gap-1.5">
          <label
            class="block text-xs font-medium text-v4-secondary-text-color font-peridot tracking-wide"
          >
            Severity <span class="text-v4-common-red-color">*</span>
          </label>
          <app-v4-common-dropdown
            [config]="severityConfig"
            [listData]="severityOptions"
            [isRequired]="false"
            [clearable]="false"
            [searchable]="false"
            appendTo="body"
            [(ngModel)]="selectedSeverity"
            [ngModelOptions]="{ standalone: true }"
            (ngModelChange)="onSeverityChange($event)"
          />
          @if (selectedSeverityMeta(); as meta) {
            <span
              class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium font-peridot w-fit mt-1"
              [style.background-color]="meta.bgColor"
              [style.color]="meta.textColor"
            >
              <span
                class="w-1.5 h-1.5 rounded-full"
                [style.background-color]="meta.textColor"
              ></span>
              {{ meta.label }}
            </span>
          }
          <app-control-message-v4
            [control]="questionForm.controls.severity"
            [customMessages]="{ required: 'Select Severity Type' }"
            [isMarginTopEnabled]="false"
            [marginTopOverride]="'mt-1'"
          />
        </div>

        <!-- Message -->
        <div class="flex flex-col gap-1.5">
          <label
            for="message"
            class="block text-xs font-medium text-v4-secondary-text-color font-peridot tracking-wide"
          >
            Message <span class="text-v4-common-red-color">*</span>
          </label>
          <textarea
            id="message"
            formControlName="message"
            placeholder="Please describe your issue in detail..."
            class="w-full px-4 py-3 min-h-[140px] border border-v4-input-border-color text-v4-main-text-color text-sm focus:outline-none focus:ring-2 focus:ring-v4-brand-border-color focus:border-v4-brand-border-color resize-none rounded-[10px] font-peridot"
            style="background-color: var(--v4-secondary-background-color)"
            rows="5"
            [maxlength]="1000"
          ></textarea>
          <div class="flex justify-end items-center">
            <span class="text-xs text-v4-tertiary-text-color font-peridot">
              {{ messageLength() }} characters
            </span>
          </div>
          <app-control-message-v4
            [control]="questionForm.controls.message"
            [customMessages]="{
              required: 'Message is required',
              maxlength: 'Message cannot exceed 1000 characters'
            }"
            [isMarginTopEnabled]="false"
          />
        </div>

        <!-- Attachments -->
        <div class="flex flex-col gap-1.5">
          <label
            class="block text-xs font-medium text-v4-secondary-text-color font-peridot tracking-wide"
          >
            Attachments (Optional)
          </label>
          <label
            class="relative flex flex-col items-center justify-center gap-2 py-6 px-4 rounded-[10px] border-2 border-dashed cursor-pointer transition-colors"
            [class.border-v4-primary-brand-bold-color]="isDragging"
            [class.bg-v4-secondary-background-color]="!isDragging"
            [class.bg-v4-input-background-color]="isDragging"
            [style.border-color]="isDragging ? 'var(--v4-primary-brand-bold-color)' : 'var(--v4-input-border-color)'"
            (dragover)="onDragOver($event)"
            (dragleave)="onDragLeave($event)"
            (drop)="onFileDrop($event)"
          >
            <input
              type="file"
              class="hidden"
              (change)="uploadFile($event)"
              accept=".pdf,.png,.jpg,.jpeg"
            />
            <lucide-icon
              [img]="uploadIcon"
              [size]="28"
              class="text-v4-tertiary-text-color"
            />
            <p class="text-sm text-v4-secondary-text-color font-peridot text-center">
              Drag and drop files here, or click to browse
            </p>
            <p class="text-xs text-v4-tertiary-text-color font-peridot text-center">
              PDF, PNG, JPG, JPEG (Max 10MB each)
            </p>
            @if (fileName) {
              <div
                class="flex items-center gap-2 mt-2 px-3 py-1.5 rounded-md bg-v4-tertiary-background-color text-sm text-v4-main-text-color font-peridot"
                role="presentation"
                (click)="$event.preventDefault(); $event.stopPropagation()"
              >
                <lucide-icon [img]="paperclipIcon" [size]="14" />
                <span class="truncate max-w-[260px]">{{ fileName }}</span>
                <button
                  type="button"
                  class="text-v4-common-red-color hover:opacity-80"
                  (click)="clearAttachment($event)"
                >
                  <lucide-icon [img]="closeIcon" [size]="14" />
                </button>
              </div>
            }
          </label>
        </div>
      </div>
    </div>
    <!-- modal body end -->

    <!-- modal footer -->
    <div
      class="flex justify-end gap-3 px-6 py-4 bg-v4-secondary-background-color border-t border-v4-border-color"
    >
      <app-common-button-v4
        mat-dialog-close=""
        width="120px"
        [type]="{ style: 'outline', name: 'main' }"
        text="Cancel"
      />
      <app-common-button-v4
        width="150px"
        [type]="{ style: 'primary', name: 'main' }"
        text="Submit Ticket"
        [loading]="loading"
        [btnType]="'submit'"
        (clickEvent)="onSubmit()"
      />
    </div>
  </form>
</div>
