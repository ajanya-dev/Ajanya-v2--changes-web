<div class="bg-main-background-color rounded-[20px] shadow-common-box-shadow max-w-[450px] w-full overflow-hidden mx-4 sm:mx-0 relative font-roboto">
  
  <!-- Header -->
  <div class="px-5 py-4 border-b border-input-border-color bg-common-blue-color relative">
    <div class="flex justify-between items-start">
      <div class="flex gap-2">
        <fa-icon [icon]="faGlobe" class="text-[24px] text-white flex-shrink-0"></fa-icon>
        <div class="flex flex-col">
          <h2 class="text-xl font-semibold text-white m-0">International Payments</h2>
          <div class="flex items-center gap-1 text-xs w-fit font-medium bg-main-background-color rounded-full px-2 py-1">
            <span class="w-2 h-2 bg-common-green-color rounded-full"></span>
            <span class=" text-common-green-color">Live now</span>
          </div>
        </div>
      </div>
      <button 
        class="bg-transparent border-none cursor-pointer rounded-md text-white"
        (click)="closeModal()">
        <fa-icon [icon]="faXmark" class="text-lg"></fa-icon>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="pb-4 pt-4 px-7">
    <div class="mb-6">
      <p class="text-lg font-bold text-main-text-color leading-tight mb-1 text-center">Save big on international transfers</p>
      <p class="text-lg font-bold text-main-text-color leading-tight m-0 text-center">Our fees are the lowest</p>
    </div>

    <!-- Statistics Cards -->
    <div class="flex gap-3 mb-6 justify-center">
      <div class="bg-secondary-background-color border rounded-[15px] p-3 text-center flex-1 shadow-sm border-common-blue-color">
        <div class="text-xl font-semibold text-common-blue-color">6+</div>
        <div class="text-xs text-secondary-text-color font-medium">Countries</div>
      </div>
      <div class="bg-secondary-background-color border rounded-[15px] p-3 text-center flex-1 shadow-sm border-common-blue-color">
        <div class="text-xl font-semibold text-common-blue-color">1M+</div>
        <div class="text-xs text-secondary-text-color font-medium">Happy Users</div>
      </div>
    </div>

    <!-- Features List -->
    <div class="mb-6">
      <div class="flex items-center gap-3 mb-3 text-sm text-main-text-color bg-secondary-background-color rounded-[15px] px-3 py-2">
        <span class="w-1.5 h-1.5 bg-common-green-color rounded-full"></span>
        <span class="font-medium">Best exchange rates guaranteed</span>
      </div>
      <div class="flex items-center gap-3 mb-3 text-sm text-main-text-color bg-secondary-background-color rounded-[15px] px-3 py-2">
        <span class="w-1.5 h-1.5 bg-common-blue-color rounded-full"></span>
        <span class="font-medium">Transfer money in minutes globally</span>
      </div>
      <div class="flex items-center gap-3 text-sm text-main-text-color bg-secondary-background-color rounded-[15px] px-3 py-2">
        <span class="w-1.5 h-1.5 bg-common-blue-color rounded-full"></span>
        <span class="font-medium">Payment options for both personal and business use</span>
      </div>
    </div>

    <!-- Call to Action -->
    <div class="text-center w-full flex flex-col gap-2">
      <app-common-button-v35
        [text]="'Start Sending Now'"
        [type]="{ style: 'filled', name: 'main' }"
        [suffix]="true"
        [suffixIcon]="faArrowRight"
        (clickEvent)="startSendingNow()"
        width="100%"
        customClasses="!h-[44px] !rounded-[10px]"
        ></app-common-button-v35>
      
      <app-common-button-v35
        [text]="'Maybe Later'"
        [type]="{ style: 'borderless', name: 'main' }"
        (clickEvent)="closeModal()"
        width="100%"
        backGroundInput="var(--main-background-color)"
        textColorInput="var(--main-text-color)"
        customClasses="!h-[44px] !rounded-[10px]"
        >
      </app-common-button-v35>
    </div>
  </div>
</div>
