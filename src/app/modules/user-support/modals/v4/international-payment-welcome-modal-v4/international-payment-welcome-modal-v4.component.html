<div class="v4-ip-modal flex flex-col max-h-[90vh] overflow-y-auto">
  <!-- ── Hero band ── -->
  <div
    class="relative pt-6 px-7 pb-[22px] text-v4-secondary-background-color bg-v4-primary-brand-bold-color"
  >
    <button
      type="button"
      class="v4-ip-close absolute top-[14px] right-[14px] w-[34px] h-[34px] rounded-[10px] border-0 cursor-pointer inline-flex items-center justify-center z-[2] text-v4-secondary-background-color hover:text-v4-main-text-color"
      aria-label="Close"
      (click)="closeModal()"
    >
      <lucide-icon [img]="XIcon" [size]="16" [strokeWidth]="2.4"></lucide-icon>
    </button>

    <div class="v4-ip-hero-dots"></div>

    <div class="relative flex items-center gap-3">
      <span
        class="w-[38px] h-[38px] rounded-[11px] inline-flex items-center justify-center flex-shrink-0 border text-v4-secondary-background-color"
        [style.background]="
          'color-mix(in srgb, var(--v4-secondary-background-color) 14%, transparent)'
        "
        [style.borderColor]="
          'color-mix(in srgb, var(--v4-secondary-background-color) 20%, transparent)'
        "
      >
        <lucide-icon
          [img]="GlobeIcon"
          [size]="18"
          [strokeWidth]="1.8"
        ></lucide-icon>
      </span>
      <div class="flex-1 min-w-0">
        <div
          class="text-[15px] font-bold tracking-[-0.005em] leading-[1.2] text-v4-secondary-background-color"
        >
          International Payments
        </div>
        <div
          class="text-xs mt-0.5"
          [style.color]="
            'color-mix(in srgb, var(--v4-secondary-background-color) 70%, transparent)'
          "
        >
          Fast, low-cost global transfers
        </div>
      </div>
      <!-- mr-10 clears the close X (top:14 right:14, 34px wide) so the badge
           isn't visually clipped at 450px modal width. -->
      <span
        class="ml-auto mr-10 inline-flex items-center gap-1.5 py-1 pr-2.5 pl-2 rounded-full border text-[12px] font-bold tracking-[0.04em] whitespace-nowrap text-v4-common-green-color"
        [style.background]="
          'color-mix(in srgb, var(--v4-common-green-color) 14%, transparent)'
        "
        [style.borderColor]="
          'color-mix(in srgb, var(--v4-common-green-color) 30%, transparent)'
        "
      >
        <span aria-hidden="true"
          class="v4-ip-live-dot w-1.5 h-1.5 rounded-full bg-v4-common-green-color"
        ></span>
        Live now
      </span>
    </div>
  </div>

  <!-- ── Heading ── -->
  <div class="px-7 pt-6">
    <h2
      class="m-0 mb-1.5 text-[23px] font-extrabold tracking-[-0.02em] leading-[1.15] text-v4-main-text-color"
    >
      Save big on international transfers
    </h2>
    <p class="m-0 text-[13.5px] text-v4-secondary-text-color">
      Our fees are the lowest
    </p>
  </div>

  <!-- ── Stats ── -->
  <div class="grid grid-cols-2 gap-3 px-7 pt-[18px]">
    <div
      class="py-[18px] px-4 rounded-[14px] text-center bg-v4-insight-card-background-blue border border-v4-input-border-color"
    >
      <p
        class="m-0 text-[30px] font-extrabold tracking-[-0.025em] leading-none text-v4-primary-brand-bold-color"
      >
        9+
      </p>
      <p class="mt-1.5 text-xs font-semibold text-v4-secondary-text-color">
        Countries
      </p>
    </div>
    <div
      class="py-[18px] px-4 rounded-[14px] text-center bg-v4-insight-card-background-blue border border-v4-input-border-color"
    >
      <p
        class="m-0 text-[30px] font-extrabold tracking-[-0.025em] leading-none text-v4-primary-brand-bold-color"
      >
        1M+
      </p>
      <p class="mt-1.5 text-xs font-semibold text-v4-secondary-text-color">
        Happy Users
      </p>
    </div>
  </div>

  <!-- ── Bullets ── -->
  <ul class="pt-5 px-7 list-none m-0 flex flex-col gap-2.5">
    @for (feature of features; track $index) {
      <li
        class="flex items-center gap-3 text-sm font-medium leading-[1.4] text-v4-secondary-text-color"
      >
        <span
          class="w-[22px] h-[22px] rounded-full bg-v4-primary-brand-color text-white inline-flex items-center justify-center flex-shrink-0"
          [style.boxShadow]="
            '0 4px 10px -4px color-mix(in srgb, var(--v4-primary-brand-color) 45%, transparent)'
          "
        >
          <lucide-icon
            [img]="CheckIcon"
            [size]="12"
            [strokeWidth]="3"
          ></lucide-icon>
        </span>
        <span>{{ feature }}</span>
      </li>
    }
  </ul>

  <!-- ── Actions ── -->
  <div class="px-7 pt-[22px] pb-[26px] flex flex-col gap-1.5">
    <app-common-button-v4
      [type]="{ style: 'primary', name: 'main' }"
      text="Start Sending Now"
      width="100%"
      [suffix]="true"
      [suffixIcon]="faArrowRight"
      [backGroundInput]="'var(--v4-primary-brand-color)'"
      [textColorInput]="'white'"
      (clickEvent)="startSendingNow()"
    />
    <app-common-button-v4
      class="self-center"
      [type]="'borderless'"
      text="Maybe Later"
      [customHeight]="'auto'"
      [customPadding]="'4px 8px'"
      [textColorInput]="'var(--v4-subtle-text-color)'"
      [hoverStyle]="{
        bgColor: 'transparent',
        textColor: 'var(--v4-main-text-color)'
      }"
      (clickEvent)="closeModal()"
    />
  </div>
</div>
