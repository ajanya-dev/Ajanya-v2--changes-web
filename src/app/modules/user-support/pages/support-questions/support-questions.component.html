<div class="data-table-wrapper bg-main-background-color">
  <div class="px-5 pt-3">
    <app-v3-data-table
      dynamicHeaderText="Tickets"
      [columnDefs]="columnDefs"
      [tableId]="tableId"
      [headerElements]="headerElements()"
      (headerButtonEvent)="headerButtonClick($event)"
      [frameworkComponents]="frameworkComponents"
      (rowClicked)="rowClicked($event)"
      (cellRendererViewEvent)="cellRendererViewEvent($event)"
      [defaultColumnFields]="defaultColumnFields"
    >
    </app-v3-data-table>
  </div>
</div>
