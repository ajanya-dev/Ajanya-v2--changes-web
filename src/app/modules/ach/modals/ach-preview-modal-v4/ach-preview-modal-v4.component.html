<div class="flex flex-col h-full">
  <!-- modal header -->
  <div class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color flex-shrink-0">
    <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
      ACH Authorization Preview
    </h1>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body -->
  <div class="flex-1 min-h-0 overflow-hidden bg-v4-tertiary-background-color">
    <iframe
      width="100%"
      height="100%"
      class="iframe"
      frameBorder="0"
      [src]="urlSafe"
    ></iframe>
  </div>

  <!-- modal footer -->
  <div class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color flex-shrink-0">
    <app-common-button-v4
      mat-dialog-close=""
      [type]="{ style: 'outline', name: 'main' }"
      text="Close"
    />
  </div>
</div>
