<div class="ocw_man_modal_wrapper category_modal">
  <form [formGroup]="achEmailForm" (ngSubmit)="onSubmit()">
    <div class="ocw_modal_header">
      <div class="ocw_modal_title">Email Authorization Form</div>
      <div class="close_btn" [mat-dialog-close]="false">
        <svg
          aria-hidden="true"
          focusable="false"
          data-prefix="fal"
          data-icon="times"
          class="svg-inline--fa fa-times fa-w-10"
          role="img"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 320 512"
        >
          <path
            fill="currentColor"
            d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
          ></path>
        </svg>
      </div>
    </div>

    <!-- MODAL BODY START -->
    <div class="ocw_modal_body">
      <div class="single_input">
        <input
          type="text"
          class="input_style !pt-3"
          placeholder=" "
          formControlName="email"
        />
        <label class="floating_label_field"
          >Enter Email Address<span class="error_msg">*</span></label
        >
        <app-control-message
          [control]="achEmailForm.controls.email"
        ></app-control-message>
      </div>
    </div>
    <!-- MODAL BODY END -->

    <div class="ocw_modal_footer">
      <mat-dialog-actions align="end">
        <button
          type="submit"
          class="ocw-btn ocw-btn-modal-blue"
          [disabled]="loading"
        >
          SEND

          <span *ngIf="loading" class="loadingSpinner"></span>
        </button>
      </mat-dialog-actions>
    </div>
  </form>
</div>
