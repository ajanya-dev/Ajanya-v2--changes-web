<div class="ocw_one_side_body">
  <div class="ocw_header">
    <div class="title">
      <h3>ACH Authorization Form</h3>
    </div>
    <div class="video_button"></div>
  </div>
  <hr class="header_border" />

  <!-- main body -->
  <form [formGroup]="achForm">
    <div class="ocw_body">
      <div class="module_main_body">
        <div class="input_group">
          <div class="flex flex-col w-full no_modal_btn">
            <app-drop-down-bank
              (selectionEvent)="onSelect($event)"
              class="drop_style"
            ></app-drop-down-bank>
            <app-control-message
              [control]="achForm.controls.bankAccount"
            ></app-control-message>
          </div>

          <div class="single_input">
            <input
              type="text"
              class="input_style !pt-3"
              placeholder=" "
              formControlName="to"
            />
            <label class="floating_label_field"
              >Whom you authorize<span class="error_msg">*</span></label
            >
            <app-control-message
              [control]="achForm.controls.to"
            ></app-control-message>
          </div>
          <div class="single_input no_modal_btn">
            <input
              type="text"
              class="input_style !pt-3"
              placeholder=" "
              formControlName="fullName"
            />
            <label class="floating_label_field"
              >Your Full Name<span class="error_msg">*</span></label
            >
            <app-control-message
              [control]="achForm.controls.fullName"
            ></app-control-message>
          </div>
          <div class="single_input">
            <input
              type="text"
              class="input_style !pt-3"
              placeholder=" "
              formControlName="title"
            />
            <label class="floating_label_field"
              >Title<span class="error_msg">*</span></label
            >
            <app-control-message
              [control]="achForm.controls.title"
            ></app-control-message>
          </div>
          <div class="single_input">
            <input
              type="text"
              class="input_style !pt-3"
              placeholder=" "
              (keyup)="onKeyUp($event)"
              formControlName="digitalSign"
            />
            <label class="floating_label_field"
              >Enter Your Name/ Digital sign<span class="error_msg"
                >*</span
              ></label
            >
            <app-control-message
              [control]="achForm.controls.digitalSign"
            ></app-control-message>
          </div>
          <div class="single_input">
            <input
              type="text"
              [(ngModel)]="digitalSign"
              [ngModelOptions]="{ standalone: true }"
              class="input_style digital_sign"
              placeholder=" "
              readonly
            />
          </div>
        </div>
      </div>

      <div class="flex justify-end mt-5">
        <mat-dialog-actions align="end">
          <button
            type="submit"
            class="ocw-btn ocw-btn-light-green add_btn mr-2"
            [disabled]="disableSaveAndPreviewBtn"
            appOcwPreventMultiClick
            [throttleTime]="3000"
            (throttledClick)="saveAndPreview()"
          >
            <span>Save & Preview</span>
            <span *ngIf="disableSaveAndEmailBtn" class="loadingSpinner"></span>
          </button>
        </mat-dialog-actions>

        <mat-dialog-actions align="end">
          <button
            type="submit"
            class="ocw-btn ocw-btn-danger add_btn"
            [disabled]="disableSaveAndEmailBtn"
            appOcwPreventMultiClick
            [throttleTime]="3000"
            (throttledClick)="saveAndEmail()"
          >
            <span>Save & Email</span>
            <span
              *ngIf="disableSaveAndPreviewBtn"
              class="loadingSpinner"
            ></span>
          </button>
        </mat-dialog-actions>
      </div>
    </div>
  </form>
</div>
