<div class="data-table-wrapper">
  @if (table === 1) {
    <app-check-recurring-list
      (tableChange)="onTableChange($event)"
      [isFromPaymentsV3]="isFromPaymentsV3()"
    ></app-check-recurring-list>
  }
  @if (table === 2) {
    <app-ach-recurring-list
      (tableChange)="onTableChange($event)"
      [isFromPaymentsV3]="isFromPaymentsV3()"
    ></app-ach-recurring-list>
  }
  @if (table === 3) {
    <app-email-recurring-list
    (tableChange)="onTableChange($event)"
    [isFromPaymentsV3]="isFromPaymentsV3()"
  ></app-email-recurring-list>
  }
  @if (table === 4) {
    <app-gift-card-recurring-list
      (tableChange)="onTableChange($event)"
      [isFromPaymentsV3]="isFromPaymentsV3()"
    ></app-gift-card-recurring-list>
  }
</div>
