<div class="table_wrapper">
  <table class="ocw-table ocw-table-striped">
    <thead>
      <tr>
        <td>Date</td>
        <td>Status</td>
        <td>Device</td>
        <td>Note</td>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of auditTrail">
        <td>{{ item.date }}</td>
        <td>{{ item.status }}</td>
        <td>{{ item.ipOrLocation || item.ip }}</td>
        <td>{{ item.note }}</td>
      </tr>
    </tbody>
  </table>
</div>
