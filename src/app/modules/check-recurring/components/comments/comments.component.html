<div class="table_wrapper">
  <table class="ocw-table ocw-table-striped">
    <thead>
      <tr>
        <td>Date</td>
        <td>Comments</td>
        <td>By</td>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let comment of comments">
        <td>{{ comment.formated_date }}</td>
        <td>{{ comment.comments }}</td>
        <td>{{ comment.user_name }}</td>
      </tr>
    </tbody>
  </table>
  <div class="flex justify-end">
    <button
      type="button"
      name="add-comment"
      id="add-comment"
      class="ocw-btn-light-blue"
      (click)="addCommentModal()"
    >
      Add Comments
    </button>
  </div>
</div>
