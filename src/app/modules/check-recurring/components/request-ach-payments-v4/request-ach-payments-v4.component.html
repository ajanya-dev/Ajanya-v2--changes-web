<app-v4-data-table
  [(selectedPanelButton)]="selectedPanelButton"
  [columnDefs]="columnDefs"
  [tableId]="tableId"
  (cellRendererViewEvent)="cellRendererActionView($event)"
  [frameworkComponents]="frameworkComponents"
  (headerButtonEvent)="headerButtonClick($event)"
  (rowSelected)="onRowSelected($event)"
  [additionalPayload]="{ ach_type }"
  [defaultDisabledColumn]="['end_date']"
  [isFromPaymentsV3]="isFromPaymentsV3()"
  (emptyStateActionClick)="onEmptyStateAction()"
  [useCustomEmptyState]="true"
  [emptyStateConfig]="{
    icon: 'repeat',
    title: 'No recurring payment requests yet',
    description: 'Payments you receive from customers will appear here.',
    buttonText: 'Request Payment',
  }"
>
</app-v4-data-table>

@if (panelSelectedRow()) {
  <app-request-ach-detail-panel-v4
    [rowId]="panelSelectedRow()?.id ?? ''"
    [row]="panelSelectedRow()"
    [isOpen]="isPanelOpen()"
    (closed)="closePanelAndReset()"
    (actionButtonClicked)="onPanelAction($event)"
  />
}
