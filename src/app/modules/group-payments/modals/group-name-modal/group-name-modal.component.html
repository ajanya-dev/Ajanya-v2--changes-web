<div class="ocw_man_modal_wrapper add_bank_modal">
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">
      {{ matDialogData?.groupName ? "Update" : "Provide" }} Group Name
    </div>
    <div class="close_btn" [mat-dialog-close]="false">
      <img
        src="./../../../../../assets/icon/close-icon.svg"
        type="image/svg+xml"
        alt="Close Icon"
      />
    </div>
  </div>

  <!-- modal body start -->
  <div class="ocw_modal_body">
    <div class="note mb-2">
      <p>
        <i [matTooltip]="'info'" class="fas fa-info-circle"></i> Payments will
        be grouped according to the name you provide, and you can access and
        view them in the Payment Groups table.
      </p>
    </div>
    <div class="grid grid-cols-1 gap-2">
      <div class="single_input">
        <input
          type="text"
          [formControl]="groupName"
          class="input_style"
          placeholder=" "
          autofocus="off"
          maxlength="15"
        />
        <span class="floating_label_field"
          >Group Name <span class="required">*</span></span
        >
        <app-control-message [control]="groupName"></app-control-message>
      </div>
    </div>
  </div>
  <!-- modal body end -->
  <div class="ocw_modal_footer">
    <mat-dialog-actions align="end">
      <button mat-dialog-close class="ocw-btn ocw-btn-modal-bordered">
        Cancel
      </button>
      <button
        type="submit"
        class="ocw-btn ocw-btn-modal-blue add_btn"
        (click)="submit()"
      >
        Submit
      </button>
    </mat-dialog-actions>
  </div>
</div>
