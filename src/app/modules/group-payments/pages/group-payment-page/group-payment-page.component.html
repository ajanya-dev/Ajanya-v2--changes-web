<div class="w-full h-full bg-secondary-background-color px-[10px]">
  <div
    class="flex flex-col h-full w-full rounded main-container bg-main-background-color"
  >
    <div class="header-bar flex items-end justify-between">
      <div class="flex items-center">
        <div class="cursor-pointer flex items-center" (click)="goBack()">
          <i class="fa-solid fa-arrow-left text-main-text-color"></i>
        </div>
        <div class="flex items-center header-1 ml-4">
          <span *ngIf="groupPaymentsState.mode == 'CREATE'">
            {{ paymentType === 'check' ? 'Group Mail' : 'Bulk Payment' }}
          </span>
          <span *ngIf="groupPaymentsState.mode == 'UPDATE'" class="">
            <span>Group - </span
            ><span
              [ngClass]="
                !groupPaymentsState.groupDetails.groupData?.groupName
                  ? 'skelton px-11 ml-2'
                  : ''
              "
              >{{
                (selectGroupPaymentsState$ | async).groupDetails.groupData
                  ?.groupName ?? ""
              }}</span
            >
          </span>
          <i
            class="fa-solid fa-pen-to-square cursor-pointer ml-3"
            *ngIf="
              groupPaymentsState.mode == 'UPDATE' &&
              groupPaymentsState.groupDetails.groupData?.groupName
            "
            [matTooltip]="'Edit Group Name'"
            (click)="editGroupName()"
          ></i>
        </div>
      </div>
    </div>
    <app-group-payments
      [groupId$]="groupId$"
      payFrom="bank"
      [billBulkData]="billBulkData()">
    </app-group-payments>
  </div>
</div>
