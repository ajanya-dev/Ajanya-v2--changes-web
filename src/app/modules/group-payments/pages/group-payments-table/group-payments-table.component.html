<div
  [ngClass]="{ '!p-0': asComponent() }"
  class="w-full h-full bg-secondary-background-color px-[10px]"
>
  <div
    [ngClass]="{ '!p-0': asComponent() }"
    class="flex flex-col h-full w-full rounded main-container !bg-main-background-color overflow-y-hidden"
  >
    <div class="header-bar flex items-center">
      @if (!asComponent()) {
        <div class="cursor-pointer flex items-center" (click)="goBack()">
          <i class="fa-solid fa-arrow-left text-main-text-color"></i>
        </div>
      }
      <div [ngClass]="{ '!m-0': asComponent() }" class="header-1 ml-4">
        <span> Payment Groups </span>
      </div>
    </div>
    <div [ngClass]="{ '!p-0 !m-0': asComponent() }" class="table-div">
      <div
        [ngClass]="{ '!p-0': asComponent() }"
        class="btn-container flex gap-3"
      >
        <app-common-button-v35
          [isAddIcon]="true"
          type="list"
          text="New Group"
          (clickEvent)="createPaymentGroup()"
        ></app-common-button-v35>

        <app-common-button-v35
          type="list"
          backGroundInput="var(--common-violet-color)"
          [isAddIcon]="true"
          [icon]="['fas', 'money-check-dollar']"
          text="Make a Payment"
          width="110px"
          (clickEvent)="saveChecks()"
          [disabled]="selectedRowCount === 0 || selectedRowCount > 1"
          [ngClass]="{
            'pointer-events-none opacity-40':
              selectedRowCount === 0 || selectedRowCount > 1
          }"
        ></app-common-button-v35>
      </div>
      <app-v3-data-table
        [columnDefs]="columnDefs"
        [tableId]="tableId"
        [frameworkComponents]="frameworkComponents"
        [isRowSelectable]="isRowSelectable"
        [fieldsShownByDefault]="fieldsShownByDefault"
      >
      </app-v3-data-table>
    </div>
  </div>
</div>
