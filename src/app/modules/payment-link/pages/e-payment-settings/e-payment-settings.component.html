<div class="bg-main-background-color rounded p-3">
  <div class="p-1">
    <app-v3-data-table
      [columnDefs]="columnDefs"
      [fieldsShownByDefault]="fieldsShownByDefault"
      [defaultColumnFields]="columnFields"
      [tableId]="tableId"
      [backButtonEnabled]="true"
      [headerElements]="headerElements()"
      [frameworkComponents]="frameworkComponents"
      (headerButtonEvent)="headerButtonNavigation($event)"
      dynamicHeaderText="Payment Settings"
    />
  </div>
</div>
