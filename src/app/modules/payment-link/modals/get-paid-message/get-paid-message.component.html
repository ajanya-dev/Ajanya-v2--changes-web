<div class="px-[6px] pb-[6px]">
  <!-- modal header -->
  <div class="flex justify-between pb-6">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
        <span class="pl-1 font-inter font-semibold text-base pb-0.5"
          >Customize Your Payment Notification</span
        >
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      ></fa-icon>
    </div>
  </div>
  <!-- modal body start -->
  <div>
    <div class="flex gap-5">
      <div class="max-w-[60%] p-5 rounded-md shadow-common-box-shadow">
        <app-text-editor
          [style]="{ height: '310px' }"
          (textChange)="setEmailMessage($event)"
          [content]="content()"
        >
        </app-text-editor>
      </div>
      <div class="max-w-[40%] p-5 rounded-md shadow-common-box-shadow">
        <p class="text-main-text-color text-sm font-inter font-medium">
          Add dynamic elements to your payment notifications for greater
          flexibility and user engagement.
        </p>
        <br />
        <p class="text-main-text-color text-sm font-inter font-medium">
          Ref Id : #ref_id
        </p>
        <br />
        <ul>
          <li class="pb-4 text-main-text-color text-sm font-inter font-medium">
            #ref_id
          </li>
          <br />
          <li class="pb-4 text-main-text-color text-sm font-inter font-medium">
            #name
          </li>
          <br />
          <li class="pb-4 text-main-text-color text-sm font-inter font-medium">
            #amount
          </li>
          <br />
          <li class="pb-4 text-main-text-color text-sm font-inter font-medium">
            #sender_name
          </li>
        </ul>
      </div>
    </div>
  </div>
  <!-- modal body end -->
  <div class="flex justify-end gap-3 pt-8">
    <app-common-button-v35
      mat-dialog-close
      width="120px"
      [type]="{ style: 'bordered', name: 'main' }"
      text="Close"
    ></app-common-button-v35>
    <app-common-button-v35
      width="120px"
      [type]="{ style: 'modal', name: 'main' }"
      text="Save"
      (clickEvent)="save()"
      [loading]="isSubmit()"
      [disabled]="isSubmit()"
    ></app-common-button-v35>
  </div>
</div>
