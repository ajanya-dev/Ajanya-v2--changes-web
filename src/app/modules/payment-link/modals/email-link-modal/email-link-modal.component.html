<div class="px-[6px] pb-[6px]">
  <!-- modal header -->
  <div class="flex justify-between pb-6">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
        <span class="pl-1 font-inter font-semibold text-base pb-0.5">{{
          injectedData.type === "email" ? "Email Link" : "SMS Link"
        }}</span>
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      ></fa-icon>
    </div>
  </div>
  <!-- modal body start -->
  <div [formGroup]="emailLinkForm" class="flex flex-col gap-5">
    @if (injectedData.type === "email") {
      <div>
        <app-common-input-field placeholder="Email" formControlName="email" />
        <app-control-message-v35 [control]="emailLinkForm.controls.email" />
      </div>
      <div class="single_input no_modal_btn">
        <textarea
          type="text"
          class="input_style"
          placeholder=" "
          formControlName="message"
        ></textarea>
        <label
          for="msg"
          class="floating_label_field !text-secondary-text-color !font-inter"
          >Message
        </label>
      </div>
      <div class="flex gap-3">
        <app-common-button-v35
          [type]="{ style: 'green', name: 'money-action' }"
          text="Bank Name"
          (clickEvent)="addMessage('bank')"
        />
        <app-common-button-v35
          [type]="{ style: 'green', name: 'money-action' }"
          text="Amount"
          (clickEvent)="addMessage('amount')"
        />
      </div>
    } @else {
      <div>
        <app-common-input-field
          placeholder="Phone"
          formControlName="phone"
          customMask="(000) 000-0000"
        />
        <app-control-message-v35 [control]="emailLinkForm.controls.phone" />
      </div>
    }
    <div class="single_input no_modal_btn">
      <p class="input_style !h-auto">{{ injectedData.link }}</p>
    </div>
  </div>
  <!-- modal body end -->
  <div class="flex justify-end gap-3 pt-8">
    <app-common-button-v35
      width="120px"
      mat-dialog-close=""
      [type]="{ style: 'bordered', name: 'main' }"
      text="Close"
    ></app-common-button-v35>
    <app-common-button-v35
      width="120px"
      [type]="{ style: 'modal', name: 'main' }"
      text="Send"
      (clickEvent)="submit()"
      [disabled]="isSubmit()"
      [loading]="isSubmit()"
    ></app-common-button-v35>
  </div>
</div>
