    <div class="content_wrapper">
      <!-- header start -->
      <div class="module_main_header">
        <div class="flex gap-2">
          <select
            class="input_style primary_border"
            (change)="templateChange($event.target.value)"
            [(ngModel)]="selectedTemplate"
          >
            <option value="" selected disabled>Go to default template</option>
            <option
              *ngFor="let template of templates | keyvalue"
              [value]="template.key"
            >
              {{ template.value }}
            </option>
          </select>
          <div>
            <button
              role="presentation"
              (click)="openCheckTemplateModal()"
              class="block bg-tertiary-background-color rounded text-common-blue-color font-roboto text-sm font-semibold h-[34px] px-[10px] cursor-pointer hover:shadow-common-button"
            >
              <div class="flex justify-center items-center gap-2">
                <img
                  class="w-[22px]"
                  ngSrc="assets/icon/crown.svg"
                  alt="crown"
                  width="20"
                  height="20"
                />
                <span class="leading-[9px]">Premium Templates</span>
              </div>
            </button>
          </div>
        </div>

        <div class="flex">
          <div class="flex gap-6 items-center">
            <app-demo-video slug="checkdesign"></app-demo-video>
            <button
              (click)="resetDesign()"
              matTooltip="Reset current changes"
              class="ocw-btn ocw-btn-white text_danger lite_shadow"
            >
              Reset Design
            </button>
          </div>
        </div>
      </div>
      <!-- header end -->

        </section>
        <!-- TEXT MENU END-->

        </section>
        <!-- LOGOS MENU END-->

        <!-- SIGNATURE MENU START-->
        <section [hidden]="activeMenu.name !== 'menu-signature'">

        </section>
        <!-- SIGNATURE MENU END-->

        <!-- ICONS MENU START -->

        <!-- ICONS MENU END -->

        <!-- IMAGES MENU START -->

        <!-- IMAGES MENU END -->

        <!-- BACKGROUND MENU START -->

        <!-- BACKGROUND MENU END -->

        <!-- BANKLOGO MENU START -->

        </section>
        <!-- BANKLOGO MENU END -->

        <!-- SHAPES MENU START-->
        <section [hidden]="activeMenu.name !== 'menu-shapes'">
          <app-shapes-menu></app-shapes-menu>
        </section>
        <!-- SHAPES MENU END-->

        <!-- EDIT MENU START -->
        <section [hidden]="activeMenu.name !== 'edit-image'">
          <app-edit-image></app-edit-image>
        </section>
        <!-- EDIT MENU END -->

        <!-- Canvas container start -->
        <div id="canvas_wrapper" class="ml-7">
          <app-checkdesign-canvas></app-checkdesign-canvas>
        </div>
        <!-- Canvas container end -->

          <button
            class="action_item ocw-btn"
            (click)="canvasService.undoAction()"
            [disabled]="!(canvasService.canvasHistory.undoList.length > 1)"
          >
            <fa-icon
              [icon]="['fas', 'rotate-left']"
              class="text-xl"
              [ngClass]="{
                'opacity-30': !(canvasService.canvasHistory.undoList.length > 1)
              }"
            ></fa-icon>
            <span class="item_name">Undo</span>
          </button>

          <button
            class="action_item ocw-btn"
            (click)="canvasService.redoAction()"
            [disabled]="!canvasService.canvasHistory.redoList.length"
          >
            <fa-icon
              [icon]="['fas', 'rotate-right']"
              class="text-xl"
              [ngClass]="{
                'opacity-30': !canvasService.canvasHistory.redoList.length
              }"
            ></fa-icon>
            <span class="item_name">Redo</span>
          </button>

          <button
            class="action_item ocw-btn"
            (click)="canvasService.rotateObject()"
            [disabled]="!canvasService.selectionIsActive || isMICRCode()"
          >
            <fa-icon
              [icon]="['fas', 'rotate']"
              class="text-xl"
              [ngClass]="{ 'opacity-30': !canvasService.selectionIsActive || isMICRCode() }"
            ></fa-icon>
            <span class="item_name">Rotate</span>
          </button>

          <div class="divider"></div>

          <button
            class="action_item ocw-btn"
            (click)="cutObject()"
            [disabled]="!canvasService.selectionIsActive || isMICRCode()"
          >
            <fa-icon
              [icon]="['fas', 'scissors']"
              class="text-xl"
              [ngClass]="{ 'opacity-30': !canvasService.selectionIsActive || isMICRCode() }"
            ></fa-icon>
            <span class="item_name">Cut</span>
          </button>

          <button
            class="action_item ocw-btn"
            (click)="copyObject()"
            [disabled]="!canvasService.selectionIsActive || isMICRCode()"
          >
            <fa-icon
              [icon]="['fas', 'copy']"
              class="text-xl"
              [ngClass]="{ 'opacity-30': !canvasService.selectionIsActive || isMICRCode() }"
            ></fa-icon>
            <span class="item_name">Copy</span>
          </button>

          <button
            class="action_item ocw-btn"
            (click)="pasteObject()"
            [disabled]="!clipboardHasObject || isMICRCode()"
          >
            <fa-icon
              [icon]="['fas', 'paste']"
              class="text-xl"
              [ngClass]="{ 'opacity-30': !clipboardHasObject || isMICRCode() }"
            ></fa-icon>
            <span class="item_name">Paste</span>
          </button>

</section>

<div [hidden]="!showPreview" class="check_preview_container">
  <img id="check_preview_image" src="" alt="" />
  <div id="close_btn" role="presentation" (click)="closePreview()">+</div>
</div>

<div class="overlay" *ngIf="loading">
  <div class="data_spinner"></div>
</div>
