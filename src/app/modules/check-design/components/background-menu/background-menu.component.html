<div class="menu_content" id="menu-background">
  <div class="my-2 font-medium tracking-wide">Background Manager</div>

  <!-- TAB GROUP START -->
  <mat-tab-group class="mt-3">
    <mat-tab label="Uploads">
      <div class="mt-3">
        <div class="flex justify-center mb-2">
          <input
            type="file"
            accept="image/*"
            class="invisible absolute"
            id="upload_background_logo"
            (input)="uploadImage(4, $event?.target.files)"
          />
          <button class="ocw-btn ocw-btn-light-dark" (click)="openFilePicker()">
            Upload New Image
          </button>
        </div>

        <!-- BG SETTINGS START -->
        <div class="flex gap-2 mt-4">
          <div class="flex flex-col gap-1">
            <div class="text-sm">Opacity</div>

            <mat-slider [max]="100" [min]="0" [step]="1"
              ><input
                matSliderThumb
                [(ngModel)]="opacity"
                (ngModelChange)="setBackground()"
              />
            </mat-slider>
          </div>

          <div class="flex flex-col gap-1">
            <div class="invisible">Opacity</div>

            <input
              type="number"
              class="input_style"
              [(ngModel)]="opacity"
              (ngModelChange)="setBackground()"
            />
          </div>
        </div>

        <div class="flex justify-between items-center gap-3 mt-3 mb-4">
          <div class="inc_dec_input">
            <div class="text-sm text-primary font-medium">Width</div>
            <div class="flex mt-2">
              <span
                class="font_size_icon_left"
                (click)="changeSize('-', 'width')"
                >-</span
              >
              <input
                type="text"
                class="input_style"
                (keypress)="canvasService.isNumber($event)"
                [(ngModel)]="width.value"
                (ngModelChange)="bgSizeChange('width')"
                maxlength="3"
              />
              <span
                class="font_size_icon_right"
                (click)="changeSize('+', 'width')"
                >+</span
              >
            </div>
          </div>

          <div class="inc_dec_input">
            <div class="text-sm text-primary font-medium">Height</div>
            <div class="flex mt-2">
              <span
                class="font_size_icon_left"
                (click)="changeSize('-', 'height')"
                >-</span
              >
              <input
                type="text"
                class="input_style"
                (keypress)="canvasService.isNumber($event)"
                [(ngModel)]="height.value"
                (ngModelChange)="bgSizeChange('height')"
                maxlength="3"
              />
              <span
                class="font_size_icon_right"
                (click)="changeSize('+', 'height')"
                >+</span
              >
            </div>
          </div>

          <div class="flex flex-col gap-2">
            <label for="Stretch">Stretch</label>

            <div class="flex items-center gap-2">
              <div
                class="box_rounded"
                (click)="width.stretch = !width.stretch; setBackground()"
              >
                <svg
                  [ngClass]="{ active_select: width.stretch }"
                  aria-hidden="true"
                  focusable="false"
                  data-prefix="fas"
                  data-icon="arrows-h"
                  class="svg-inline--fa fa-arrows-h fa-w-16"
                  role="img"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 512 512"
                >
                  <path
                    fill="currentColor"
                    d="M105.815 288h300.371l-46.208 43.728c-9.815 9.289-10.03 24.846-.474 34.402l10.84 10.84c9.373 9.373 24.569 9.373 33.941 0l98.343-98.343c12.497-12.497 12.497-32.758 0-45.255l-98.343-98.343c-9.373-9.373-24.569-9.373-33.941 0l-10.84 10.84c-9.556 9.556-9.341 25.113.474 34.402L406.186 224H105.815l46.208-43.728c9.815-9.289 10.03-24.846.474-34.402l-10.84-10.84c-9.373-9.373-24.569-9.373-33.941 0L9.373 233.372c-12.497 12.497-12.497 32.758 0 45.255l98.343 98.343c9.373 9.373 24.569 9.373 33.941 0l10.84-10.84c9.556-9.556 9.341-25.113-.474-34.402L105.815 288z"
                  ></path>
                </svg>
              </div>

              <div
                class="box_rounded"
                (click)="height.stretch = !height.stretch; setBackground()"
              >
                <svg
                  [ngClass]="{ active_select: height.stretch }"
                  aria-hidden="true"
                  focusable="false"
                  data-prefix="fas"
                  data-icon="arrows-v"
                  class="svg-inline--fa fa-arrows-v fa-w-8"
                  role="img"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 256 512"
                >
                  <path
                    fill="currentColor"
                    d="M160 406.186V105.815l43.728 46.208c9.289 9.815 24.846 10.03 34.402.474l10.84-10.84c9.373-9.373 9.373-24.569 0-33.941L150.627 9.373c-12.497-12.497-32.758-12.497-45.255 0L7.029 107.715c-9.373 9.373-9.373 24.569 0 33.941l10.84 10.84c9.556 9.556 25.113 9.341 34.402-.474L96 105.815v300.371l-43.728-46.208c-9.289-9.815-24.846-10.03-34.402-.474l-10.84 10.84c-9.373 9.373-9.373 24.569 0 33.941l98.343 98.343c12.497 12.497 32.758 12.497 45.255 0l98.343-98.343c9.373-9.373 9.373-24.569 0-33.941l-10.84-10.84c-9.556-9.556-25.113-9.341-34.402.474L160 406.186z"
                  ></path>
                </svg>
              </div>
            </div>
          </div>
        </div>

        <div class="flex justify-center gap-2">
          <button
            (click)="deleteBackground()"
            class="ocw-btn ocw-btn-warning w-max"
          >
            Remove background
          </button>
        </div>

        <div class="divider mt-2"></div>
        <!-- BG SETTINGS END -->

        <!-- IMAGE CONTAINER START-->

        <div class="image_view_container mt-4 cursor-pointer">
          <div
            class="image_thumb"
            *ngFor="
              let image of imageUploads;
              let i = index;
              trackBy: trackByFnImageUploads
            "
            (click)="setBackground(image?.imageUrlNoAuth, $event.target)"
          >
            <img
              crossorigin="anonymous"
              [src]="image?.imageUrlNoAuth"
              alt="{{ image?.fileName }}"
            />
            <span
              class="close_btn"
              (click)="deleteLogo(image.id); $event.stopPropagation()"
            >
              <i class="fa-regular fa-circle-xmark"></i>
            </span>
          </div>
        </div>

        <div
          class="switch-pages"
          *ngIf="!(uploadState.disablePrevBtn && uploadState.disableNextBtn)"
        >
          <button
            title="previous page"
            class="ocw-btn ocw-btn-light-dark"
            [ngClass]="uploadState.disablePrevBtn ? 'disable-btn' : ''"
            [disabled]="uploadState.disablePrevBtn"
            appOcwPreventMultiClick
            [throttleTime]="2000"
            (throttledClick)="getUploadedImages('prev')"
          >
            <i class="fa-solid fa-arrow-left"></i>
          </button>
          <button
            title="next page"
            class="ocw-btn ocw-btn-light-dark"
            [ngClass]="uploadState.disableNextBtn ? 'disable-btn' : ''"
            [disabled]="uploadState.disableNextBtn"
            appOcwPreventMultiClick
            [throttleTime]="2000"
            (throttledClick)="getUploadedImages('next')"
          >
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>

        <!-- IMAGE CONTAINER END -->
      </div>
    </mat-tab>

    <mat-tab label="Clipboard">
      <div class="mt-3 flex flex-col gap-2">
        <!-- COLORED PHOTOS START -->
        <label for="Color">Color</label>
        <select
          class="input_style"
          (change)="changeCategory('color', $event?.target?.value)"
        >
          <option value="0" selected>All</option>
          <option *ngFor="let category of categories" [value]="category.id">
            {{ category.name }}
          </option>
        </select>

        <div class="flex gap-2 mt-4">
          <div class="flex flex-col gap-1">
            <div class="text-sm">Opacity</div>
            <mat-slider [max]="100" [min]="0" [step]="1"
              ><input matSliderThumb /><input
                matSliderThumb
                [(ngModel)]="opacity"
                (ngModelChange)="setBackground()"
              />
            </mat-slider>
          </div>
          <div class="flex flex-col gap-1">
            <div class="invisible">Opacity</div>
            <input
              type="number"
              class="input_style"
              [(ngModel)]="opacity"
              (ngModelChange)="setBackground()"
            />
          </div>
        </div>

        <!-- IMAGE CONTAINER START-->

        <div class="image_view_container mt-4 mb-4 cursor-pointer">
          <div
            class="image_thumb"
            *ngFor="let image of clipboardImages"
            (click)="setBackground(image?.imageUrlNoAuth, $event.target)"
          >
            <img
              [src]="image?.imageUrlNoAuth"
              alt="{{ image?.fileName }}"
              (error)="canvasService.updateUrl($event)"
            />
          </div>
        </div>

        <div
          class="switch-pages"
          *ngIf="
            !(clipBoardState.disablePrevBtn && clipBoardState.disableNextBtn)
          "
        >
          <button
            title="previous page"
            class="ocw-btn ocw-btn-light-dark"
            [ngClass]="clipBoardState.disablePrevBtn ? 'disable-btn' : ''"
            [disabled]="clipBoardState.disablePrevBtn"
            appOcwPreventMultiClick
            [throttleTime]="2000"
            (throttledClick)="getClipboardImages(category, 'prev')"
          >
            <i class="fa-solid fa-arrow-left"></i>
          </button>
          <button
            title="next page"
            class="ocw-btn ocw-btn-light-dark"
            [ngClass]="clipBoardState.disableNextBtn ? 'disable-btn' : ''"
            [disabled]="clipBoardState.disableNextBtn"
            appOcwPreventMultiClick
            [throttleTime]="2000"
            (throttledClick)="getClipboardImages(category, 'next')"
          >
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>

        <!-- IMAGE CONTAINER END -->
        <!-- COLORED PHOTOS END -->

        <!-- MONOGRAMS START -->
        <!-----Hide Monograms (if we need it in the future we can reopen )-->
        <div *ngIf="isShowMonogram">
          <label for="Monograms">Monograms</label>
          <select
            class="input_style"
            (change)="changeCategory('monograms', $event?.target?.value)"
          >
            <option value="0" selected>All</option>
            <option *ngFor="let category of categories" [value]="category.id">
              {{ category.name }}
            </option>
          </select>

          <!-- IMAGE CONTAINER START-->

          <div class="image_view_container mt-4 cursor-pointer">
            <div class="image_thumb" *ngFor="let image of monograms">
              <img
                [src]="image?.imageUrlNoAuth"
                alt="{{ image?.fileName }}"
                (error)="canvasService.updateUrl($event)"
              />
            </div>
          </div>
        </div>

        <!-- IMAGE CONTAINER END -->
        <!-- MONOGRAMS END -->
      </div>
    </mat-tab>
  </mat-tab-group>
  <!-- TAB GROUP END -->
</div>
