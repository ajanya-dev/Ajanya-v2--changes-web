<div class="menu_content" id="menu-edit-image">
  <div class="my-2 font-medium tracking-wide">Edit</div>

  <div class="flex gap-2 mt-3">
    <div class="flex flex-col gap-1">
      <div class="text-sm">Opacity</div>

      <mat-slider [max]="100" [min]="0" [step]="1" [(ngModel)]="opacity">
        <input
          matSliderThumb
          [(ngModel)]="opacity"
          (ngModelChange)="canvasService.changeOpacity(activeObject, opacity)"
        />
      </mat-slider>
    </div>

    <div class="flex flex-col gap-1">
      <div class="invisible">Opacity</div>

      <input
        type="number"
        class="input_style"
        [(ngModel)]="opacity"
        (ngModelChange)="canvasService.changeOpacity(activeObject, opacity)"
      />
    </div>
  </div>
</div>
