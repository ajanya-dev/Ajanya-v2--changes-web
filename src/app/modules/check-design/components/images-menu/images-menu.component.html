<div class="menu_content" id="menu-images">
  <div class="my-2 font-medium tracking-wide">Images</div>

  <!-- TAB GROUP START -->
  <mat-tab-group class="mt-3">
    <mat-tab label="Uploads">
      <div class="mt-3">
        <div class="flex justify-center mb-2">
          <input
            type="file"
            accept="image/*"
            class="invisible absolute"
            id="upload_image"
            (input)="uploadImage(1, $event?.target.files)"
          />
          <button class="ocw-btn ocw-btn-light-dark" (click)="openFilePicker()">
            Upload New Image
          </button>
        </div>

        <!-- IMAGE CONTAINER START-->

        <div class="image_view_container mt-4 cursor-pointer">
          <div
            class="image_thumb"
            *ngFor="let image of imageUploads"
            (click)="addImageToCanvas(image?.imageUrlNoAuth)"
          >
            <img
              crossorigin="anonymous"
              [src]="image?.imageUrlNoAuth"
              alt="{{ image?.fileName }}"
            />
            <span
              class="close_btn"
              (click)="deleteLogo(image.id); $event.stopPropagation()"
            >
              <i class="fa-regular fa-circle-xmark"></i>
            </span>
          </div>
        </div>

        <div
          class="switch-pages"
          *ngIf="!(uploadState.disablePrevBtn && uploadState.disableNextBtn)"
        >
          <button
            title="previous page"
            class="ocw-btn ocw-btn-light-dark"
            [ngClass]="uploadState.disablePrevBtn ? 'disable-btn' : ''"
            [disabled]="uploadState.disablePrevBtn"
            appOcwPreventMultiClick
            [throttleTime]="2000"
            (throttledClick)="getUploadedImages('prev')"
          >
            <i class="fa-solid fa-arrow-left"></i>
          </button>
          <button
            title="next page"
            class="ocw-btn ocw-btn-light-dark"
            [ngClass]="uploadState.disableNextBtn ? 'disable-btn' : ''"
            [disabled]="uploadState.disableNextBtn"
            appOcwPreventMultiClick
            [throttleTime]="2000"
            (throttledClick)="getUploadedImages('next')"
          >
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
        <!-- IMAGE CONTAINER END -->
      </div>
    </mat-tab>

    <mat-tab label="Clipboard">
      <div class="mt-3 flex flex-col gap-2">
        <!-- COLORED PHOTOS START -->
        <label for="Color">Color</label>
        <select
          class="input_style"
          (change)="changeCategory('color', $event?.target?.value)"
        >
          <option value="0" selected>All</option>
          <option *ngFor="let category of categories" [value]="category.id">
            {{ category.name }}
          </option>
        </select>

        <!-- IMAGE CONTAINER START-->

        <div class="image_view_container mt-4 mb-4 cursor-pointer">
          <div
            class="image_thumb"
            *ngFor="let image of clipboardImages"
            (click)="addImageToCanvas(image?.imageUrlNoAuth)"
          >
            <img
              [src]="image?.imageUrlNoAuth"
              alt="{{ image?.fileName }}"
              (error)="canvasService.updateUrl($event)"
            />
          </div>
        </div>

        <div
          class="switch-pages"
          *ngIf="
            !(clipBoardState.disablePrevBtn && clipBoardState.disableNextBtn)
          "
        >
          <button
            title="previous page"
            class="ocw-btn ocw-btn-light-dark"
            [ngClass]="clipBoardState.disablePrevBtn ? 'disable-btn' : ''"
            [disabled]="clipBoardState.disablePrevBtn"
            appOcwPreventMultiClick
            [throttleTime]="2000"
            (throttledClick)="getClipboardImages(category, 'prev')"
          >
            <i class="fa-solid fa-arrow-left"></i>
          </button>
          <button
            title="next page"
            class="ocw-btn ocw-btn-light-dark"
            [ngClass]="clipBoardState.disableNextBtn ? 'disable-btn' : ''"
            [disabled]="clipBoardState.disableNextBtn"
            appOcwPreventMultiClick
            [throttleTime]="2000"
            (throttledClick)="getClipboardImages(category, 'next')"
          >
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>

        <!-- IMAGE CONTAINER END -->
        <!-- COLORED PHOTOS END -->

        <!-- MONOGRAMS START -->
        <!-----Hide Monograms (if we need it in the future we can reopen )-->
        <div *ngIf="isShowMonogram">
          <label for="Monograms">Monograms</label>
          <select
            class="input_style"
            (change)="changeCategory('monograms', $event?.target?.value)"
          >
            <option value="0" selected>All</option>
            <option *ngFor="let category of categories" [value]="category.id">
              {{ category.name }}
            </option>
          </select>

          <!-- IMAGE CONTAINER START-->

          <div class="image_view_container mt-4 cursor-pointer">
            <div
              class="image_thumb"
              *ngFor="let image of monograms"
              (click)="addImageToCanvas(image?.imageUrlNoAuth)"
            >
              <img
                [src]="image?.imageUrlNoAuth"
                alt="{{ image?.fileName }}"
                (error)="canvasService.updateUrl($event)"
              />
            </div>
          </div>

          <!-- IMAGE CONTAINER END -->
          <!-- MONOGRAMS END -->
        </div>
      </div>
    </mat-tab>
  </mat-tab-group>
  <!-- TAB GROUP END -->
</div>
