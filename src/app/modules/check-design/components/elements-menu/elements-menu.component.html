<div class="menu_content" id="menu-elements">
  <div class="header shadow-md">STATIC ELEMENTS</div>
  <ul class="mt-5 mb-3 ml-1">
    <!-- static items start-->
    <li class="m-1" *ngFor="let ele of elements?.static">
      <div class="flex items-center gap-2">
        <input
          type="checkbox"
          id="{{ ele.id }}"
          [checked]="ele.checked"
          (change)="
            toggleElement(ele.id, $event.target.checked, ele.type);
            ele.checked = !ele.checked
          "
        />

        <label class="cursor-pointer" (click)="toggleSubItem(ele)">
          {{ ele.name }}
        </label>
      </div>

      <!-- static sub items start-->
      <ul [hidden]="!ele.showSubItem" class="mt-1 ml-3">
        <li *ngFor="let item of ele?.sub_items">
          <label class="cursor-pointer">
            <ng-container
              *ngIf="
                ele.id === 'static[\'void_after\']' && item.name === 'Days';
                else defaultSubItem
              "
            >
              <div class="flex gap-2">
                <input
                  type="text"
                  class="w-12"
                  (keypress)="isNumber()"
                  [value]="item.days"
                  (input)="voidDaysChange($event, item)"
                />
                Days
              </div>
            </ng-container>

            <ng-template #defaultSubItem>
              <ng-container
                *ngIf="
                  ele.id !== 'static[\'amount_box_sign\']';
                  else boxSubItem
                "
              >
                <input
                  type="checkbox"
                  [checked]="item.checked"
                  (change)="
                    toggleElement(
                      ele.id,
                      $event.target.checked,
                      item.type,
                      item.wLine,
                      item.woLine
                    );
                    item.checked = !item.checked
                  "
                />
                {{ item.name }}
              </ng-container>
            </ng-template>

            <ng-template #boxSubItem>
              <input
                type="checkbox"
                id="{{ item.id }}"
                [(ngModel)]="item.checked"
                [checked]="item.checked"
                (change)="
                  toggleElement(item.id, $event.target.checked, item.type)
                "
              />
              {{ item.name }}
            </ng-template>
          </label>
        </li>
      </ul>
      <!-- static sub items end -->
    </li>
    <!-- static items end-->
  </ul>

  <div class="header shadow-md">DYNAMIC ELEMENTS</div>
  <ul class="mt-5 mb-3 ml-1">
    <li class="m-1" *ngFor="let ele of elements?.dynamic; let i = index">
      <ng-container *ngIf="i === 0; else arrowBlock">
        <label class="flex items-center gap-2 cursor-pointer">
          <input
            type="checkbox"
            [checked]="ele.checked"
            (change)="
              toggleElement(ele.id, $event.target.checked, ele.type);
              ele.checked = !ele.checked
            "
          />
          {{ ele.name }}
        </label>
      </ng-container>

      <ng-template #arrowBlock>
        <div
          class="flex items-baseline gap-2 cursor-pointer"
          (click)="addDynamic(ele.type, ele.txt)"
        >
          <svg
            aria-hidden="true"
            focusable="false"
            data-prefix="fas"
            data-icon="arrow-right"
            class="svg-inline--fa fa-arrow-right fa-w-14"
            role="img"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 448 512"
          >
            <path
              fill="currentColor"
              d="M190.5 66.9l22.2-22.2c9.4-9.4 24.6-9.4 33.9 0L441 239c9.4 9.4 9.4 24.6 0 33.9L246.6 467.3c-9.4 9.4-24.6 9.4-33.9 0l-22.2-22.2c-9.5-9.5-9.3-25 .4-34.3L311.4 296H24c-13.3 0-24-10.7-24-24v-32c0-13.3 10.7-24 24-24h287.4L190.9 101.2c-9.8-9.3-10-24.8-.4-34.3z"
            ></path>
          </svg>
          {{ ele.name }}
        </div>
      </ng-template>
    </li>

    <li>
      <div class="flex flex-col gap-2 cursor-pointer">
        <div class="flex items-baseline gap-2 cursor-pointer">
          <i
            (click)="addDynamic('remittance_stub', '')"
            class="fa-solid fa-plus"
          ></i>
          <span
            (click)="elements.remittanceExpanded = !elements.remittanceExpanded"
          >
            Dynamic Remittance <small>(click plus to add all)</small>
          </span>
        </div>

        <ul
          class="ml-3 overflow-hidden"
          [ngStyle]="!elements.remittanceExpanded && { height: 0 }"
        >
          <li
            class="m-1"
            *ngFor="let ele of elements?.dynamicRemittance; let i = index"
          >
            <div
              class="flex items-baseline gap-2 cursor-pointer"
              (click)="addDynamic(ele.type, ele.txt)"
            >
              <svg
                aria-hidden="true"
                focusable="false"
                data-prefix="fas"
                data-icon="arrow-right"
                class="svg-inline--fa fa-arrow-right fa-w-14"
                role="img"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 448 512"
              >
                <path
                  fill="currentColor"
                  d="M190.5 66.9l22.2-22.2c9.4-9.4 24.6-9.4 33.9 0L441 239c9.4 9.4 9.4 24.6 0 33.9L246.6 467.3c-9.4 9.4-24.6 9.4-33.9 0l-22.2-22.2c-9.5-9.5-9.3-25 .4-34.3L311.4 296H24c-13.3 0-24-10.7-24-24v-32c0-13.3 10.7-24 24-24h287.4L190.9 101.2c-9.8-9.3-10-24.8-.4-34.3z"
                ></path>
              </svg>
              {{ ele.name }}
            </div>
          </li>
        </ul>
      </div>
    </li>
  </ul>
  <div class="header shadow-md">CUSTOM ELEMENTS</div>
  <div
    (click)="addCustomElement()"
    class="flex items-baseline gap-2 cursor-pointer"
  >
    <i class="fa-solid fa-plus"></i>
    <span> Add custom element </span>
  </div>
  <!-- custom items start-->
  <ul>
    <!-- <div *ngIf="customElementRestriction.enable_custom_elements"> -->
    <li class="m-1" *ngFor="let ele of elements?.custom">
      <div class="custom_element">
        <div>
          <input
            type="checkbox"
            id="{{ ele.id }}"
            [checked]="ele.checked"
            (change)="
              toggleCustomElement(ele.element, $event.target.checked);
              ele.checked = !ele.checked
            "
          />
          <label class="cursor-pointer">
            {{ ele.element }}
          </label>
        </div>
        <div>
          <i
            aria-hidden="true"
            (click)="editCustomElement(ele)"
            class="fa fa-pencil-square-o"
            id="id_btnEdit"
          ></i>
          <i
            aria-hidden="true"
            (click)="deleteCustomElement(ele)"
            class="fa fa-trash-o"
            id="id_btnTrash"
          ></i>
        </div>
      </div>
    </li>
    <!-- </div> -->
  </ul>
</div>
