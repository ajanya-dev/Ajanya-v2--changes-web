<div class="menu_content" id="menu-signature">
  <div class="my-2 font-medium tracking-wide">Signature Manager</div>

  <mat-accordion>
    <mat-expansion-panel hideToggle>
      <mat-expansion-panel-header>
        <mat-panel-title>
          <svg
            aria-hidden="true"
            focusable="false"
            data-prefix="fal"
            data-icon="mobile-android"
            class="svg-inline--fa fa-mobile-android fa-w-10"
            role="img"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 320 512"
          >
            <path
              fill="currentColor"
              d="M196 448h-72c-6.6 0-12-5.4-12-12v-8c0-6.6 5.4-12 12-12h72c6.6 0 12 5.4 12 12v8c0 6.6-5.4 12-12 12zM320 48v416c0 26.5-21.5 48-48 48H48c-26.5 0-48-21.5-48-48V48C0 21.5 21.5 0 48 0h224c26.5 0 48 21.5 48 48zm-32 0c0-8.8-7.2-16-16-16H48c-8.8 0-16 7.2-16 16v416c0 8.8 7.2 16 16 16h224c8.8 0 16-7.2 16-16V48z"
            ></path>
          </svg>
          Sign from Phone
        </mat-panel-title>
      </mat-expansion-panel-header>
      <div class="flex flex-col gap-1">
        <span>Enter your Phone Number <span class="required">*</span></span>
        <input
          type="text"
          class="input_style"
          [formControl]="phoneNumber"
          (keypress)="canvasService.isNumber($event)"
          mask="(000) 000-0000"
        />
        <app-control-message [control]="phoneNumber"></app-control-message>

        <button
          (click)="sendSms()"
          class="ocw-btn ocw-btn-light-blue flex justify-center items-center gap-2"
          [ngClass]="{ disableBtn: !phoneNumber.valid || loadingBtn.text }"
        >
          <ng-container *ngIf="loadingBtn.text">
            <span class="loadingSpinner"></span>
          </ng-container>
          <span>Text Me</span>
        </button>
      </div>
    </mat-expansion-panel>

    <mat-expansion-panel hideToggle>
      <mat-expansion-panel-header>
        <mat-panel-title>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <path
              d="M0 128C0 92.65 28.65 64 64 64H448C483.3 64 512 92.65 512 128V384C512 419.3 483.3 448 448 448H64C28.65 448 0 419.3 0 384V128zM48 128V150.1L220.5 291.7C241.1 308.7 270.9 308.7 291.5 291.7L464 150.1V127.1C464 119.2 456.8 111.1 448 111.1H64C55.16 111.1 48 119.2 48 127.1L48 128zM48 212.2V384C48 392.8 55.16 400 64 400H448C456.8 400 464 392.8 464 384V212.2L322 328.8C283.6 360.3 228.4 360.3 189.1 328.8L48 212.2z"
            />
          </svg>
          Sign from Email
        </mat-panel-title>
      </mat-expansion-panel-header>
      <div class="flex flex-col gap-1">
        <span>Enter your Email Address <span class="required">*</span></span>
        <input type="text" class="input_style" [formControl]="emailId" />
        <app-control-message [control]="emailId"></app-control-message>

        <button
          (click)="sendEmail()"
          class="ocw-btn ocw-btn-light-blue flex justify-center items-center gap-2"
          [ngClass]="{ disableBtn: !emailId.valid || loadingBtn.email }"
        >
          <ng-container *ngIf="loadingBtn.email">
            <span class="loadingSpinner"></span>
          </ng-container>
          Email Me
        </button>
      </div>
    </mat-expansion-panel>

    <mat-expansion-panel hideToggle>
      <mat-expansion-panel-header>
        <mat-panel-title>
          <svg
            aria-hidden="true"
            focusable="false"
            data-prefix="fas"
            data-icon="upload"
            class="svg-inline--fa fa-upload fa-w-16"
            role="img"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 512 512"
          >
            <path
              fill="currentColor"
              d="M296 384h-80c-13.3 0-24-10.7-24-24V192h-87.7c-17.8 0-26.7-21.5-14.1-34.1L242.3 5.7c7.5-7.5 19.8-7.5 27.3 0l152.2 152.2c12.6 12.6 3.7 34.1-14.1 34.1H320v168c0 13.3-10.7 24-24 24zm216-8v112c0 13.3-10.7 24-24 24H24c-13.3 0-24-10.7-24-24V376c0-13.3 10.7-24 24-24h136v8c0 30.9 25.1 56 56 56h80c30.9 0 56-25.1 56-56v-8h136c13.3 0 24 10.7 24 24zm-124 88c0-11-9-20-20-20s-20 9-20 20 9 20 20 20 20-9 20-20zm64 0c0-11-9-20-20-20s-20 9-20 20 9 20 20 20 20-9 20-20z"
            ></path>
          </svg>
          Upload Signature
        </mat-panel-title>
      </mat-expansion-panel-header>
      <div class="flex flex-col gap-1">
        <div class="ocw-browse-file">
          <input type="hidden" maxlength="30" />
          <input
            type="file"
            class="custom-file-input"
            name="busi-for-doc"
            accept="image/*"
            (change)="uploadEvent($event?.target.files)"
          />

          <label class="doc-name">
            <span>{{ selectedFile?.name }} </span>
          </label>
        </div>

        <input
          type="text"
          class="input_style"
          placeholder="Nick name"
          #signatureNickName
          maxlength="8"
        />

        <button
          (click)="uploadSignature(signatureNickName)"
          class="ocw-btn ocw-btn-light-blue flex justify-center items-center gap-2"
          [ngClass]="{
            disableBtn:
              !selectedFile ||
              !signatureNickName.value?.length ||
              loadingBtn.uploadImg
          }"
        >
          <ng-container *ngIf="loadingBtn.uploadImg">
            <span class="loadingSpinner"></span>
          </ng-container>
          Save
        </button>
      </div>
    </mat-expansion-panel>

    <mat-expansion-panel hideToggle>
      <mat-expansion-panel-header>
        <mat-panel-title>
          <svg
            aria-hidden="true"
            focusable="false"
            data-prefix="fas"
            data-icon="qrcode"
            class="svg-inline--fa fa-qrcode fa-w-14"
            role="img"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 448 512"
          >
            <path
              fill="currentColor"
              d="M0 224h192V32H0v192zM64 96h64v64H64V96zm192-64v192h192V32H256zm128 128h-64V96h64v64zM0 480h192V288H0v192zm64-128h64v64H64v-64zm352-64h32v128h-96v-32h-32v96h-64V288h96v32h64v-32zm0 160h32v32h-32v-32zm-64 0h32v32h-32v-32z"
            ></path>
          </svg>
          Sign from QR Code
        </mat-panel-title>
      </mat-expansion-panel-header>
      <div class="flex flex-col gap-1">
        <img *ngIf="qrImage" [src]="qrImage" alt="qr_image" />
        <p>Scan above QR code using your phone to sign</p>
      </div>
    </mat-expansion-panel>

    <mat-expansion-panel hideToggle>
      <mat-expansion-panel-header>
        <mat-panel-title>
          <svg
            aria-hidden="true"
            focusable="false"
            data-prefix="fas"
            data-icon="edit"
            class="svg-inline--fa fa-edit fa-w-18"
            role="img"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 576 512"
          >
            <path
              fill="currentColor"
              d="M402.6 83.2l90.2 90.2c3.8 3.8 3.8 10 0 13.8L274.4 405.6l-92.8 10.3c-12.4 1.4-22.9-9.1-21.5-21.5l10.3-92.8L388.8 83.2c3.8-3.8 10-3.8 13.8 0zm162-22.9l-48.8-48.8c-15.2-15.2-39.9-15.2-55.2 0l-35.4 35.4c-3.8 3.8-3.8 10 0 13.8l90.2 90.2c3.8 3.8 10 3.8 13.8 0l35.4-35.4c15.2-15.3 15.2-40 0-55.2zM384 346.2V448H64V128h229.8c3.2 0 6.2-1.3 8.5-3.5l40-40c7.6-7.6 2.2-20.5-8.5-20.5H48C21.5 64 0 85.5 0 112v352c0 26.5 21.5 48 48 48h352c26.5 0 48-21.5 48-48V306.2c0-10.7-12.9-16-20.5-8.5l-40 40c-2.2 2.3-3.5 5.3-3.5 8.5z"
            ></path>
          </svg>
          Sign on Screen
        </mat-panel-title>
      </mat-expansion-panel-header>
      <div class="flex flex-col gap-1 relative">
        <canvas #signPad> </canvas>
        <div id="s_line">Sign Here</div>

        <input
          type="text"
          class="input_style"
          placeholder="Nick Name"
          #signOnScreenNickName
          maxlength="16"
        />

        <div class="flex justify-center gap-2">
          <button
            (click)="clearSignaturePad()"
            class="ocw-btn ocw-btn-light-blue"
          >
            Clear
          </button>

          <button
            (click)="saveSignOnScreen(signOnScreenNickName)"
            class="ocw-btn ocw-btn-light-blue flex justify-center items-center gap-2"
            [ngClass]="{
              disableBtn:
                signaturePad?.isEmpty() ||
                !signOnScreenNickName.value?.length ||
                loadingBtn.signOnScreen
            }"
          >
            <ng-container *ngIf="loadingBtn.signOnScreen">
              <span class="loadingSpinner"></span>
            </ng-container>
            Save
          </button>
        </div>
      </div>
    </mat-expansion-panel>

    <mat-expansion-panel hideToggle>
      <mat-expansion-panel-header>
        <mat-panel-title>
          <svg
            aria-hidden="true"
            focusable="false"
            data-prefix="fal"
            data-icon="tv-alt"
            class="svg-inline--fa fa-tv-alt fa-w-20"
            role="img"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 640 512"
          >
            <path
              fill="currentColor"
              d="M536 480H104a8 8 0 0 0-8 8v16a8 8 0 0 0 8 8h432a8 8 0 0 0 8-8v-16a8 8 0 0 0-8-8zM608 0H32A32 32 0 0 0 0 32v352a32 32 0 0 0 32 32h576a32 32 0 0 0 32-32V32a32 32 0 0 0-32-32zm0 384H32V32h576z"
            ></path>
          </svg>
          Digital Signature
        </mat-panel-title>
      </mat-expansion-panel-header>

      <div class="flex flex-col gap-1">
        <input
          (input)="textToCanvas(digitalSignatureText, digitalSignatureCanvas)"
          type="text"
          class="input_style"
          id="digital_sig_text"
          placeholder="Type your Name"
          maxlength="20"
          #digitalSignatureText
        />
        <canvas
          id="digital_sig_canvas"
          width="220"
          height="100"
          #digitalSignatureCanvas
        >
        </canvas>
        <input
          type="text"
          class="input_style"
          placeholder="Nick Name"
          #digitalSigNickname
          maxlength="8"
        />

        <button
          (click)="
            saveDigitalSignature(
              digitalSignatureText,
              digitalSignatureCanvas,
              digitalSigNickname
            )
          "
          class="ocw-btn ocw-btn-light-blue flex justify-center items-center gap-2"
          [ngClass]="{
            disableBtn:
              !digitalSigNickname.value?.length ||
              !digitalSignatureText.value?.length ||
              loadingBtn.digitalSig
          }"
        >
          <ng-container *ngIf="loadingBtn.digitalSig">
            <span class="loadingSpinner"></span>
          </ng-container>
          Save
        </button>
      </div>
    </mat-expansion-panel>

    <mat-expansion-panel hideToggle>
      <mat-expansion-panel-header>
        <mat-panel-title>
          <svg
            aria-hidden="true"
            focusable="false"
            data-prefix="fal"
            data-icon="box-open"
            class="svg-inline--fa fa-box-open fa-w-19"
            role="img"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 608 512"
          >
            <path
              fill="currentColor"
              d="M606.4 143.8L557.5 41c-2.7-5.6-8.1-9-13.9-9C543 32 304 64 304 64S65 32 64.4 32c-5.8 0-11.2 3.5-13.9 9L1.6 143.8c-4.4 9.2.3 20.2 9.6 23l49.5 14.9V393c0 14.7 9.5 27.5 23 31l205.4 54.1c13 3.4 23.7 1.5 29.5 0L524.2 424c13.5-3.6 23-16.4 23-31V181.7l49.5-14.9c9.4-2.8 14-13.8 9.7-23zM73 65.3l180.9 24.3-57.1 99.8-159.9-48.1 36.1-76zm18.2 125.6C208.3 226.1 200.5 224 203.6 224c5.4 0 10.5-2.9 13.3-7.9l71.9-125.5V445L91.2 393V190.9zM516.8 393l-197.6 52V90.5L391.1 216c2.9 5 8 7.9 13.3 7.9 3.1 0-5 2.1 112.4-33.1V393zM411.3 189.3l-57.1-99.8L535 65.3l36.1 76-159.8 48z"
            ></path>
          </svg>
          Existing Signature
        </mat-panel-title>
      </mat-expansion-panel-header>
      <div class="image_view_container mt-4">
        <div
          class="image_thumb"
          *ngFor="let image of existingSignatures"
          (click)="addSignature(image)"
        >
          <img
            crossorigin="anonymous"
            [src]="image?.imageUrlNoAuth"
            (error)="canvasService.updateUrl($event)"
          />

          <span
            class="close_btn"
            (click)="deleteSignature(image.id); $event.stopPropagation()"
          >
            <i class="fa-regular fa-circle-xmark"></i>
          </span>

          <span
            class="edit_btn"
            (click)="editSignature(image); $event.stopPropagation()"
          >
            <svg
              aria-hidden="true"
              focusable="false"
              data-prefix="fas"
              data-icon="edit"
              class="svg-inline--fa fa-edit fa-w-18"
              role="img"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 576 512"
            >
              <path
                fill="currentColor"
                d="M402.6 83.2l90.2 90.2c3.8 3.8 3.8 10 0 13.8L274.4 405.6l-92.8 10.3c-12.4 1.4-22.9-9.1-21.5-21.5l10.3-92.8L388.8 83.2c3.8-3.8 10-3.8 13.8 0zm162-22.9l-48.8-48.8c-15.2-15.2-39.9-15.2-55.2 0l-35.4 35.4c-3.8 3.8-3.8 10 0 13.8l90.2 90.2c3.8 3.8 10 3.8 13.8 0l35.4-35.4c15.2-15.3 15.2-40 0-55.2zM384 346.2V448H64V128h229.8c3.2 0 6.2-1.3 8.5-3.5l40-40c7.6-7.6 2.2-20.5-8.5-20.5H48C21.5 64 0 85.5 0 112v352c0 26.5 21.5 48 48 48h352c26.5 0 48-21.5 48-48V306.2c0-10.7-12.9-16-20.5-8.5l-40 40c-2.2 2.3-3.5 5.3-3.5 8.5z"
              ></path>
            </svg>
          </span>

          <span class="nick_name" [hidden]="!image?.nickName?.length">
            {{ image?.nickName }}
          </span>
        </div>
      </div>

      <div
        class="switch-pages"
        *ngIf="
          !(signatureState.disablePrevBtn && signatureState.disableNextBtn)
        "
      >
        <button
          title="previous page"
          class="ocw-btn ocw-btn-light-dark"
          [ngClass]="signatureState.disablePrevBtn ? 'disable-btn' : ''"
          [disabled]="signatureState.disablePrevBtn"
          appOcwPreventMultiClick
          [throttleTime]="2000"
          (throttledClick)="getSignatures(undefined, 'prev')"
        >
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <button
          title="next page"
          class="ocw-btn ocw-btn-light-dark"
          [ngClass]="signatureState.disableNextBtn ? 'disable-btn' : ''"
          [disabled]="signatureState.disableNextBtn"
          appOcwPreventMultiClick
          [throttleTime]="2000"
          (throttledClick)="getSignatures(undefined, 'next')"
        >
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </mat-expansion-panel>
  </mat-accordion>
</div>
