<div class="menu_content" id="menu-shapes">
  <!----------------------------------------- NEW MODE ----------------------------------------->
  <ng-container *ngIf="mode === 'new'">
    <div class="my-2 font-medium tracking-wide">Add New Shape</div>

    <div class="grid grid-cols-2 gap-y-4 cursor-pointer">
      <div
        class="flex justify-center items-center"
        (click)="addShape('square')"
      >
        <svg
          aria-hidden="true"
          focusable="false"
          data-prefix="fas"
          data-icon="square"
          class="svg-inline--fa fa-square fa-w-14"
          role="img"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 448 512"
        >
          <path
            fill="currentColor"
            d="M400 32H48C21.5 32 0 53.5 0 80v352c0 26.5 21.5 48 48 48h352c26.5 0 48-21.5 48-48V80c0-26.5-21.5-48-48-48z"
          ></path>
        </svg>
      </div>

      <div
        class="flex justify-center items-center"
        (click)="addShape('circle')"
      >
        <svg
          aria-hidden="true"
          focusable="false"
          data-prefix="fas"
          data-icon="circle"
          class="svg-inline--fa fa-circle fa-w-16"
          role="img"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 512 512"
        >
          <path
            fill="currentColor"
            d="M256 8C119 8 8 119 8 256s111 248 248 248 248-111 248-248S393 8 256 8z"
          ></path>
        </svg>
      </div>

      <div
        class="flex justify-center items-center"
        (click)="addShape('triangle')"
      >
        <svg
          aria-hidden="true"
          focusable="false"
          data-prefix="fas"
          data-icon="triangle"
          class="svg-inline--fa fa-triangle fa-w-18"
          role="img"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 576 512"
        >
          <path
            fill="currentColor"
            d="M329.6 24c-18.4-32-64.7-32-83.2 0L6.5 440c-18.4 31.9 4.6 72 41.6 72H528c36.9 0 60-40 41.6-72l-240-416z"
          ></path>
        </svg>
      </div>

      <div class="flex justify-center items-center" (click)="addShape('star')">
        <svg
          aria-hidden="true"
          focusable="false"
          data-prefix="fas"
          data-icon="star"
          class="svg-inline--fa fa-star fa-w-18"
          role="img"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 576 512"
        >
          <path
            fill="currentColor"
            d="M259.3 17.8L194 150.2 47.9 171.5c-26.2 3.8-36.7 36.1-17.7 54.6l105.7 103-25 145.5c-4.5 26.3 23.2 46 46.4 33.7L288 439.6l130.7 68.7c23.2 12.2 50.9-7.4 46.4-33.7l-25-145.5 105.7-103c19-18.5 8.5-50.8-17.7-54.6L382 150.2 316.7 17.8c-11.7-23.6-45.6-23.9-57.4 0z"
          ></path>
        </svg>
      </div>

      <div class="flex justify-center items-center" (click)="addShape('line')">
        <svg
          aria-hidden="true"
          focusable="false"
          data-prefix="fas"
          data-icon="horizontal-rule"
          class="svg-inline--fa fa-horizontal-rule fa-w-20"
          role="img"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 640 512"
          style="transform: rotate(45deg)"
        >
          <path
            fill="currentColor"
            d="M640 239.87v31.26A15.88 15.88 0 0 1 624.14 287H15.87A15.88 15.88 0 0 1 0 271.13v-31.26A15.88 15.88 0 0 1 15.87 224h608.27A15.88 15.88 0 0 1 640 239.87z"
          ></path>
        </svg>
      </div>

      <div class="flex justify-center items-center" (click)="addShape('heart')">
        <svg
          aria-hidden="true"
          focusable="false"
          data-prefix="fas"
          data-icon="heart"
          class="svg-inline--fa fa-heart fa-w-16"
          role="img"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 512 512"
        >
          <path
            fill="currentColor"
            d="M462.3 62.6C407.5 15.9 326 24.3 275.7 76.2L256 96.5l-19.7-20.3C186.1 24.3 104.5 15.9 49.7 62.6c-62.8 53.6-66.1 149.8-9.9 207.9l193.5 199.8c12.5 12.9 32.8 12.9 45.3 0l193.5-199.8c56.3-58.1 53-154.3-9.8-207.9z"
          ></path>
        </svg>
      </div>
    </div>
  </ng-container>

  <!----------------------------------------- EDIT MODE ----------------------------------------->
  <ng-container *ngIf="mode === 'edit'">
    <div class="flex justify-between mt-5">
      <div class="flex flex-col gap-1">
        <div class="text-sm">Border Color</div>
        <input
          class="color_block"
          [(colorPicker)]="borderColor"
          [style.background]="borderColor"
          [cpPosition]="'bottom-left'"
          (colorPickerChange)="changeBorderColor(borderColor)"
        />
      </div>

      <div class="flex flex-col gap-1">
        <div class="text-sm">Fill Color</div>
        <input
          class="color_block"
          [(colorPicker)]="fillColor"
          [style.background]="fillColor"
          [cpPosition]="'bottom-left'"
          (colorPickerChange)="changeFillColor(fillColor)"
        />
      </div>

      <div class="flex flex-col gap-1">
        <div class="text-sm">Border Width</div>
        <input
          type="number"
          class="input_style"
          [(ngModel)]="borderWidth"
          (ngModelChange)="changeBorderWidth(borderWidth)"
        />
      </div>
    </div>

    <div class="flex gap-2 mt-4">
      <div class="flex flex-col gap-1">
        <div class="text-sm">Opacity</div>

        <mat-slider [max]="100" [min]="0" [step]="1"
          ><input matSliderThumb /><input
            matSliderThumb
            [formControl]="opacity"
          />
        </mat-slider>
      </div>

      <div class="flex flex-col gap-1">
        <div class="invisible">Opacity</div>

        <input type="number" class="input_style" [formControl]="opacity" />
      </div>
    </div>
  </ng-container>
</div>
