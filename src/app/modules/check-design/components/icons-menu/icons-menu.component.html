<div class="menu_content" id="menu-icons">
  <div class="my-2 font-medium tracking-wide">Icons</div>

  <!-- BODY START -->
  <div class="mt-3 flex flex-col gap-2">
    <label>Color</label>
    <select
      class="input_style"
      (change)="changeCategory('color', $event?.target?.value)"
    >
      <option value="0" selected>All</option>
      <option *ngFor="let category of categories" [value]="category.id">
        {{ category.name }}
      </option>
    </select>

    <!-- IMAGE CONTAINER START-->

    <div class="image_view_container mt-4 cursor-pointer">
      <div
        class="image_thumb"
        *ngFor="let image of colorIcons"
        (click)="addImageToCanvas(image?.imageUrlNoAuth)"
      >
        <img
          crossorigin="anonymous"
          [src]="image?.imageUrlNoAuth"
          alt="{{ image?.fileName }}"
        />
        <span
          class="close_btn"
          (click)="deleteLogo(image.id); $event.stopPropagation()"
        >
          <i class="fa-regular fa-circle-xmark"></i>
        </span>
      </div>
    </div>

    <div
      class="switch-pages"
      *ngIf="!(colorIconState.disablePrevBtn && colorIconState.disableNextBtn)"
    >
      <button
        title="previous page"
        class="ocw-btn ocw-btn-light-dark"
        [ngClass]="colorIconState.disablePrevBtn ? 'disable-btn' : ''"
        [disabled]="colorIconState.disablePrevBtn"
        appOcwPreventMultiClick
        [throttleTime]="2000"
        (throttledClick)="getColorIcons(category, 'prev')"
      >
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <button
        title="next page"
        class="ocw-btn ocw-btn-light-dark"
        [ngClass]="colorIconState.disableNextBtn ? 'disable-btn' : ''"
        [disabled]="colorIconState.disableNextBtn"
        appOcwPreventMultiClick
        [throttleTime]="2000"
        (throttledClick)="getColorIcons(category, 'next')"
      >
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>
    <!-- IMAGE CONTAINER END -->

    <!-- MONOGRAMS START -->
    <!-----Hide Monograms (if we need it in the future we can reopen )-->
    <div *ngIf="isShowMonogram">
      <label for="Monograms">Monograms</label>
      <select
        class="input_style"
        (change)="changeCategory('monograms', $event?.target?.value)"
      >
        <option value="0" selected>All</option>
        <option *ngFor="let category of categories" [value]="category.id">
          {{ category.name }}
        </option>
      </select>

      <!-- IMAGE CONTAINER START-->

      <div class="image_view_container mt-4 cursor-pointer">
        <div
          class="image_thumb"
          *ngFor="let image of monograms"
          (click)="addImageToCanvas(image?.imageUrlNoAuth)"
        >
          <img [src]="image?.imageUrlNoAuth" alt="{{ image?.fileName }}" />
          <span
            class="close_btn"
            (click)="deleteLogo(image.id); $event.stopPropagation()"
          >
            <i class="fa-solid fa-circle-xmark text-sm"></i>
          </span>
        </div>
      </div>
    </div>

    <!-- IMAGE CONTAINER END -->
    <!-- MONOGRAMS END -->
  </div>
  <!-- BODY END -->
</div>
