<div class="ocw_man_modal_wrapper">
  <!-- modal header -->
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">Create a custom field</div>
    <div class="close_btn" (click)="close()">
      <i class="fa-duotone fa-x"></i>
    </div>
  </div>
  <!-- modal body start -->
  <div class="ocw_modal_body">
    <div class="single_input">
      <input
        type="text"
        required
        maxlength="30"
        class="input_style"
        [(ngModel)]="customElement"
        #customField="ngModel"
      />
      <span class="floating_label_field"
        >Custom field<span class="required">*</span></span
      >
      <div
        *ngIf="
          customField.invalid && (customField.dirty || customField.touched)
        "
      >
        <div *ngIf="customField.errors?.['required']">
          <small class="required">Custom field is required.</small>
        </div>
      </div>
    </div>
  </div>
  <!-- modal body end -->
  <div class="ocw_modal_footer">
    <div mat-dialog-actions>
      <button
        [disabled]="submitting"
        type="submit"
        (click)="addElement()"
        class="ocw-btn ocw-btn-modal-blue add_btn"
      >
        <span>{{ data.edit.element === "" ? "Add" : "Update" }}</span>
      </button>
    </div>
  </div>
</div>
