<div class="px-[6px] pb-[6px]">
  <!-- modal header -->
  <div class="flex justify-between pb-6">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
        <span class="pl-1 font-inter font-semibold text-base pb-0.5">
          Preview
        </span>
      </span>
    </div>
    <div class="flex">
      <div class="flex justify-between pr-5 gap-3 w-full items-center">
        @if (templateData.price) {
          <h1
            class="font-inter font-medium text-main-text-color text-sm bg-common-secondary-blue-color px-1 rounded"
          >
            ${{ templateData.price
            }}<span class="text-xs font-inter font-normal">/Txn</span>
          </h1>
        }
        @if (templateData.premium) {
          <img
            class="w-4"
            ngSrc="../../../../assets/icon/crown.svg"
            width="20"
            height="20"
            alt="crown"
          />
        }
      </div>
      <div [mat-dialog-close]="false">
        <fa-icon
          class="text-secondary-text-color cursor-pointer"
          [icon]="['fas', 'xmark']"
        ></fa-icon>
      </div>
    </div>
  </div>
  <!-- modal body start -->
  <div class="h-[740px]">
    <img
      [ngSrc]="template"
      class="template"
      alt="template"
      width="300"
      height="740"
    />
  </div>
</div>
