<div class="ocw_one_side_body">
  <div class="ocw_header">
    <div class="title flex items-center gap-2">
      <app-ocw-back-button backUrl="manage/refill-credit">
      </app-ocw-back-button>

      <h3>Update Card</h3>
    </div>
  </div>
  <hr class="header_border" />

  <div class="ocw_body">
    <div class="single_form_wrapper">
      <div [ngClass]="{ skelton: loading }">
        <iframe
          *ngIf="cardLink"
          [src]="cardLink"
          width="100%"
          height="650px"
        ></iframe>
      </div>
    </div>
  </div>
</div>
