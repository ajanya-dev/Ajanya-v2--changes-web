<div>
  <app-v4-page-header
    [title]="'Central Report'"
    subtitle="Track every check, deposit slip, and cash expense in one ledger"
    [showBackButton]="true"
    backButtonType="takeEvent"
    (backEvent)="goBack()"
  />

  <app-v4-data-table
    class="block mt-4"
    [columnDefs]="columnDefs"
    [tableId]="tableId"
    [frameworkComponents]="frameworkComponents"
    [defaultColumnFields]="columnFields"
    [headerElements]="headerElements"
    [showActionButtonContainer]="false"
    [useCustomEmptyState]="true"
    [emptyStateConfig]="{
      icon: 'receipt',
      title: 'No transactions yet',
      description:
        'Every check, deposit slip, and cash expense you record lands here in a single ledger.',
      buttonText: ''
    }"
    [filterBarInline]="true"
    [paginationCurrentPageNumber]="v3DataTableService.CurrentPage ?? 1"
  />

  <!-- Deposit Slip Side Panel -->
  <app-detail-side-panel
    [isOpen]="isDepositPanelOpen()"
    [title]="'Deposit Slip Details'"
    [subtitle]="'Ref ID: ' + depositSlipRefId()"
    icon="file-text"
    iconBgColor="var(--v4-primary-brand-color)"
    [statusBadge]="depositSlipStatusBadge()"
    [contentTemplate]="depositSlipContent"
    (closed)="isDepositPanelOpen.set(false)"
  />
  <ng-template #depositSlipContent>
    <app-deposit-slip-detail-panel-v4
      [slipId]="depositSlipId()"
      [slipData]="depositSlipData()"
      [loading]="depositSlipLoading()"
      [hideDelete]="true"
    />
  </ng-template>

  <!-- Cash Expense Side Panel -->
  <app-cash-expense-detail-panel-v4
    [cashExpenseId]="cashExpenseId()"
    [isOpen]="isCashExpensePanelOpen()"
    (closed)="isCashExpensePanelOpen.set(false)"
  />
</div>
