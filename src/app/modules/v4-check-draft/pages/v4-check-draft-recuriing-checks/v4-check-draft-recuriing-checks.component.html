<div class="flex flex-col flex-1">
  <app-v4-data-table
    [defaultColumnFields]="defaultColumnFields"
    [columnDefs]="columnDefs"
    [tableId]="tableId"
    [fieldsShownByDefault]="fieldsShownByDefault"
    [frameworkComponents]="frameworkComponents"
    [headerElements]="headerElements()"
    (headerButtonEvent)="headerButtonNavigation($event)"
    (cellRendererIdEvent)="getActionComp($event)"
    (cellRendererViewEvent)="getViewAction($event)"
    (rowSelected)="onRowSelected($event)"
    [exportConfig]="exportConfig"
  >
  </app-v4-data-table>

  <app-v4-check-draft-recurring-detail-panel
    [rowId]="panelSelectedRow()?.check_id ?? ''"
    [row]="panelSelectedRow()"
    [isOpen]="isPanelOpen()"
    (closed)="closePanelAndReset()"
    (actionButtonClicked)="onPanelAction($event)"
  />
</div>
