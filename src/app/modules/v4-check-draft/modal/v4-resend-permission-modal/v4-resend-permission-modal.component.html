<div
  class="font-funnel bg-v4-secondary-background-color rounded-2xl flex flex-col max-h-[90vh]"
>
  <!-- Header -->
  <div
    class="flex items-center justify-between px-4 sm:px-5 py-3 sm:py-4 border-b border-v4-border-color"
  >
    <div class="flex items-center gap-2.5">
      <div
        class="w-9 h-9 rounded-lg bg-v4-brand-tint flex items-center justify-center flex-shrink-0"
      >
        <lucide-icon
          name="send"
          [size]="16"
          class="text-v4-primary-brand-color"
        ></lucide-icon>
      </div>
      <div>
        <h2
          class="font-peridot text-sm sm:text-base font-bold text-v4-main-text-color leading-tight"
        >
          Resend Permission
        </h2>
        <p class="text-xs text-v4-subtle-text-color m-0">
          Resend check draft permission via email or SMS
        </p>
      </div>
    </div>
    <div
      [matDialogClose]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon
        name="x"
        [size]="18"
        class="text-v4-subtle-text-color"
      ></lucide-icon>
    </div>
  </div>

  <!-- Body -->
  <div class="flex-1 px-4 sm:px-5 py-3 sm:py-4">
    <form
      [formGroup]="resendPermissionForm"
      class="flex flex-col gap-3 sm:gap-3.5"
    >
      <app-common-input-v4
        placeholder="Email"
        [fieldLabel]="'Email'"
        formControlName="email"
        [type]="'email'"
        [control]="resendPermissionForm.controls.email"
      />
      <app-phone-input-v4
        placeholder="Phone Number"
        formControlName="sms"
        [control]="resendPermissionForm.controls.sms"
        [showCountryDropdown]="false"
      />
    </form>
  </div>

  <!-- Footer -->
  <div
    class="flex justify-end gap-2.5 px-4 sm:px-5 py-3 sm:py-3.5 border-t border-v4-border-color"
  >
    <app-common-button-v4
      mat-dialog-close
      [type]="{ style: 'outline', name: 'main' }"
      [text]="'Cancel'"
      width="100px"
    />
    <app-common-button-v4
      [type]="{ style: 'primary', name: 'main' }"
      [text]="'Send'"
      width="100px"
      lucideIcon="send"
      [disabled]="btnDisable()"
      [loading]="btnDisable()"
      (clickEvent)="resendCheckDraftPermission()"
    />
  </div>
</div>
