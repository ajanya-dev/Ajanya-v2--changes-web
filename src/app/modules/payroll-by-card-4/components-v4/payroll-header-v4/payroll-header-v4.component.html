<app-v4-page-header
  [title]="'Payroll by Credit Card'"
  subtitle="Process payroll for multiple companies using credit cards and earn rewards"
>
  <div headerActions class="flex items-center gap-3">
    <span
      class="text-xs font-semibold text-v4-secondary-text-color font-funnel tracking-wide"
      >HELP</span
    >
    <button aria-label="Live Chat"
      class="w-9 h-9 rounded-lg border border-v4-border-color bg-v4-secondary-background-color flex items-center justify-center hover:bg-v4-tertiary-background-color transition-colors cursor-pointer"
      matTooltip="Live Chat"
      (click)="goToLiveChat()"
    >
      <lucide-icon
        name="message-circle"
        [size]="16"
        class="text-v4-secondary-text-color"
      ></lucide-icon>
    </button>
    <a
      class="w-9 h-9 rounded-lg border border-v4-border-color bg-v4-secondary-background-color flex items-center justify-center hover:bg-v4-tertiary-background-color transition-colors"
      [href]="'mailto:' + staticWhiteLabelConditions.customerSupportEmail"
      matTooltip="{{ staticWhiteLabelConditions.customerSupportEmail }}"
    >
      <lucide-icon
        name="mail"
        [size]="16"
        class="text-v4-secondary-text-color"
      ></lucide-icon>
    </a>
    @if (staticWhiteLabelConditions.customerSupportNo) {
      <a
        class="w-9 h-9 rounded-lg border border-v4-border-color bg-v4-secondary-background-color flex items-center justify-center hover:bg-v4-tertiary-background-color transition-colors"
        [href]="'tel:' + staticWhiteLabelConditions.customerSupportNo"
        matTooltip="{{ staticWhiteLabelConditions.customerSupportNo }}"
      >
        <lucide-icon
          name="phone"
          [size]="16"
          class="text-v4-secondary-text-color"
        ></lucide-icon>
      </a>
    }
  </div>
</app-v4-page-header>
