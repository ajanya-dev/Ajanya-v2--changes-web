<div class="transaction-table">
  <div class="common-transaction-table-container">
    <app-v4-data-table
      [columnDefs]="columnDefs"
      [tableId]="tableId"
      [frameworkComponents]="frameworkComponents"
      [dynamicHeaderText]="dynamicHeaderText"
      [freeColumnResize]="false"
      [showActionButtonContainer]="false"
      [useCustomEmptyState]="true"
      [emptyStateScopeKey]="selectedApp()?.id"
      [emptyStateConfig]="{
        icon: 'receipt',
        title: 'No transactions yet',
        description:
          'Payroll payments you process will appear here once the first one is paid',
        buttonText: ''
      }"
    >
    </app-v4-data-table>
  </div>
</div>
