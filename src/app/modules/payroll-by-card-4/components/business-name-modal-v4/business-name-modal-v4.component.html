<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Enter Business Name
      </h1>
    </div>
    <div
      (click)="close()"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <div [formGroup]="businessForm" class="flex flex-col gap-4">
      <div>
        <app-common-input-v4
          [fieldLabel]="'Business Name'"
          [placeholder]="'Enter Your Business Name'"
          [control]="businessForm.controls.buisnessName"
          formControlName="buisnessName"
          [errorLabel]="'Business Name'"
        />
      </div>
      @if (dialogData?.appTitle === "manual") {
        <div>
          <app-common-input-v4
            [fieldLabel]="'Provider Name'"
            [placeholder]="'Enter Your Provider Name'"
            [control]="businessForm.controls.providerName"
            formControlName="providerName"
          />
        </div>
      } @else {
        <div class="flex gap-5 items-center">
          <p
            class="text-sm text-v4-secondary-text-color font-peridot tracking-[-0.011em]"
          >
            Provider name :
          </p>
          <p
            class="text-sm text-v4-main-text-color font-semibold font-peridot tracking-[-0.011em]"
          >
            {{ dialogData?.appTitle }}
          </p>
        </div>
      }
    </div>
  </div>
  <!-- modal body end -->

  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      mat-dialog-close
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Confirm"
      [disabled]="isLoading"
      [loading]="isLoading"
      (clickEvent)="runKybBypass()"
    />
  </div>
</div>
