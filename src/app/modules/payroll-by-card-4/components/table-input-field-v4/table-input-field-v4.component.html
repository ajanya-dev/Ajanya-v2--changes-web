<div>
  @if ((status === 0 || status === 3) && !editMode) {
    <div class="v4-cell-editor">
      <input
        class="v4-input-style v4-cell-editor__input"
        placeholder=" "
        maxlength="15"
        mask="separator.2"
        thousandSeparator=","
        [(ngModel)]="amount"
        (input)="updateAmount()"
        (blur)="updateFee()"
      />
      @if (filedName && (status === 0 || status === 3)) {
        <button aria-label="Save payroll amount"
          type="button"
          class="action-icon-btn v4-cell-editor__action"
          matTooltip="Save payroll amount"
          (click)="onUpdate()"
        >
          <lucide-icon name="check" [size]="12"></lucide-icon>
        </button>
      }
    </div>
  } @else {
    <div class="flex items-center gap-1 whitespace-nowrap">
      <span>{{ amount | currency }}</span>
      @if (filedName && (status === 0 || status === 3) && isManual) {
        <button aria-label="Edit payroll amount"
          type="button"
          class="action-icon-btn"
          matTooltip="Edit payroll amount"
          [ngClass]="{ 'cursor-default': isLoading }"
          (click)="onEdit()"
        >
          <lucide-icon name="pencil" [size]="12"></lucide-icon>
        </button>
      }
    </div>
  }
</div>
