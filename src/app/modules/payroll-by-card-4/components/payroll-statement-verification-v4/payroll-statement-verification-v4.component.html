<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Statement Verification
      </h1>
    </div>
    <div
      (click)="dialogRef.close({ success: false })"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <p
      class="text-sm text-v4-secondary-text-color text-center font-peridot tracking-[-0.011em] mb-6"
    >
      Please upload your bank statement that shows you have run payroll from
      this account
    </p>

    <!-- File Upload -->
    <div
      class="flex items-center border border-v4-input-border-color rounded-lg overflow-hidden bg-v4-input-background-color"
    >
      <span
        class="flex-1 px-4 py-2.5 text-sm font-peridot truncate"
        [class.text-v4-subtle-text-color]="statementFile.invalid"
        [class.text-v4-main-text-color]="statementFile.valid"
      >
        {{
          statementFile.invalid ? "Choose a File" : statementFile.value?.name
        }}
      </span>
      <label
        class="shrink-0 px-4 py-2.5 text-xs font-semibold font-peridot text-v4-primary-brand-color bg-v4-secondary-background-color border-l border-v4-input-border-color cursor-pointer hover:bg-v4-border-color transition-colors uppercase tracking-wide"
      >
        Browse
        <input
          type="file"
          class="hidden"
          (change)="fileInputChange($event)"
          accept=".pdf,.csv,.xlsx,.xls,.docx,.doc,.rtf,.txt,.jpg,.png"
        />
      </label>
    </div>
    @if (statementFile.invalid && statementFile.touched) {
      <span class="text-xs text-common-red-color font-peridot mt-1 block">
        Statement file is required
      </span>
    }
  </div>
  <!-- modal body end -->

  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Submit"
      [disabled]="loading"
      [loading]="loading"
      (clickEvent)="submit()"
    />
  </div>
</div>
