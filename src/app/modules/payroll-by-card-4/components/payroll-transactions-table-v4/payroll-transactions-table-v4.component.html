<div class="main-component-container transaction-table">
  <div class="common-transaction-table-container">
    <app-v4-data-table
      [columnDefs]="columnDefs"
      [tableId]="tableId"
      [defaultDisabledColumn]="lockedColumns"
      [fieldsShownByDefault]="lockedColumns"
      [frameworkComponents]="frameworkComponents"
      [exportConfig]="exportConfig"
      [dynamicHeaderText]="dynamicHeaderText"
      [toolbarRightTemplate]="toolbarRightTemplate()"
      [toolbarAlertTemplate]="toolbarLeftTemplate()"
      [showActionButtonContainer]="false"
      [suppressRowClickSelection]="true"
      [useCustomEmptyState]="true"
      [emptyStateKeepToolbar]="true"
      [emptyStateScopeKey]="selectedApp()?.id"
      [deferInitialLoad]="true"
      [emptyStateConfig]="{
        icon: 'banknote',
        title: 'No payroll entries yet',
        description:
          'Add a payroll or sync your payroll app to see entries listed here',
        buttonText: manualApp ? 'New payroll' : ''
      }"
      (emptyStateActionClick)="newPayrollClick.emit()"
      (gridReadyOutput)="onGridReady($event)"
    >
    </app-v4-data-table>
  </div>
</div>
