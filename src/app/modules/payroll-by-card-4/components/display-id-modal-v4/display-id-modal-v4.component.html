<div class="font-peridot">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
      Connect Paychex
    </h1>
    <button
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
      [disabled]="isLoading()"
      (click)="close()"
    >
      <lucide-icon [img]="XIcon" [size]="18" class="text-v4-subtle-text-color" />
    </button>
  </div>

  <!-- modal body -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <app-common-input-v4
      [fieldLabel]="'Client ID'"
      [placeholder]="'Client ID'"
      [inputId]="'paychexClientId'"
      [formControl]="displayID"
      [control]="displayID"
      [maxLength]="22"
    />

    <div class="mt-2">
      <span
        (click)="getClientId()"
        class="text-xs font-medium text-v4-primary-brand-color underline cursor-pointer"
      >
        How to get Client ID?
      </span>
    </div>
  </div>

  <!-- modal footer -->
  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      [type]="{ style: 'outline', name: 'main' }"
      [text]="'Cancel'"
      [width]="'100px'"
      [disabled]="isLoading()"
      (clickEvent)="close()"
    />
    <app-common-button-v4
      [type]="{ style: 'primary', name: 'main' }"
      [text]="'Confirm'"
      [width]="'100px'"
      [loading]="isLoading()"
      [disabled]="isLoading()"
      (clickEvent)="connectToPaychex()"
    />
  </div>
</div>
