<div>
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Add Wire Routing Number
      </h1>
    </div>
    <div
      (click)="dialogRef.close(false)"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon
        [img]="XIcon"
        class="text-v4-subtle-text-color"
      ></lucide-icon>
    </div>
  </div>

  <!-- modal body -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <!-- Info Banner -->
    <div
      class="flex items-start gap-2 p-3 mb-5 bg-v4-secondary-background-color rounded-xl border border-v4-border-color"
    >
      <lucide-icon
        [img]="InfoIcon"
        [size]="16"
        class="text-v4-primary-brand-color mt-0.5 flex-shrink-0"
      ></lucide-icon>
      <span class="text-xs text-v4-main-text-color">
        The routing number you provided{{
          bankAc ? " for " + bankAc.name + " - " + bankAc.accountNumber : ""
        }}
        is not valid for wire transfers. Please provide your wire routing
        number, we will use this routing number to transfer money to your
        account.
      </span>
    </div>

    <!-- Input -->
    <app-common-input-v4
      [placeholder]="'Wire Routing Number'"
      [control]="wireRoutingNumber"
      [isNumberOnly]="true"
      [maxLength]="9"
    />
    <app-control-message-v4
      [control]="wireRoutingNumber"
    ></app-control-message-v4>
  </div>

  <!-- modal footer -->
  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      [type]="{ style: 'outline', name: 'main' }"
      [text]="'Cancel'"
      [width]="'100px'"
      (clickEvent)="dialogRef.close(false)"
    />
    <app-common-button-v4
      [type]="{ style: 'primary', name: 'main' }"
      [text]="'Save'"
      [width]="'100px'"
      [loading]="isWireUpdating()"
      [disabled]="isWireUpdating()"
      (clickEvent)="addWireRouting()"
    />
  </div>
</div>
