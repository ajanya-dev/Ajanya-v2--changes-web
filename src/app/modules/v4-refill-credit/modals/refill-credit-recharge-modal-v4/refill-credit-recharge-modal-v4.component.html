<div class="">
  <!-- modal header -->
  <div class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color">
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Recharge Credits
      </h1>
      <h2 class="text-xs text-v4-subtle-text-color">Top up your credit balance</h2>
    </div>
    <div [mat-dialog-close]="false" class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center">
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="flex-1 overflow-y-auto p-6 space-y-6 bg-v4-tertiary-background-color">
    <!-- Select Amount -->
    <div class="space-y-3">
      <label class="text-sm font-semibold text-v4-secondary-text-color" for="amount">Select Amount</label>
      <div class="grid grid-cols-3 gap-3">
        @for (preset of presetAmounts; track preset) {
          <button
            type="button"
            class="p-3 rounded-xl border-2 text-left transition-all"
            [ngClass]="selectedPreset === preset
              ? 'border-v4-primary-brand-color preset-btn-selected'
              : 'border-v4-border-color hover:border-v4-input-border-color bg-v4-secondary-background-color'"
            (click)="selectPreset(preset)"
          >
            <div class="text-base font-bold text-v4-main-text-color">
              {{ preset | currency }}
            </div>
          </button>
        }
      </div>

      <!-- Custom Amount Toggle -->
      <button
        type="button"
        class="w-full p-3 rounded-xl border-2 text-left transition-all"
        [ngClass]="isCustomAmount
          ? 'border-v4-primary-brand-color preset-btn-selected'
          : 'border-v4-border-color hover:border-v4-input-border-color bg-v4-secondary-background-color'"
        (click)="selectCustom()"
      >
        <div class="text-sm font-semibold text-v4-secondary-text-color">Custom Amount</div>
        <div class="text-[12px] text-v4-subtle-text-color mt-0.5">Enter any amount you need</div>
      </button>
    </div>

    <!-- Custom Amount Input -->
    @if (isCustomAmount) {
      <div>
        <label class="text-sm font-semibold text-v4-secondary-text-color block mb-2" for="amount">Enter Amount</label>
        <app-common-amount-input-v4
          [maxLength]="6"
          [formControl]="amount"
          [isRequired]="false"
        ></app-common-amount-input-v4>
        <app-control-message-v4
          [control]="amount"
          [label]="controlMessage"
        ></app-control-message-v4>
      </div>
    }
  </div>
  <!-- modal body end -->

  <div class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color">
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Recharge Now"
      (clickEvent)="addFund()"
      [disabled]="isFunding()"
      [loading]="isFunding()"
    />
  </div>
</div>
