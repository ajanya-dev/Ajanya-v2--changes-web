@if (isPathTrue) {
  <div class="lds-ellipsis">
    <div></div>
    <div></div>
    <div></div>
    <div></div>
  </div>
} @else {
  <div>
    @if (pageId === "pricing_table") {
      <div>
        @if(!creditCardPlan){
          @if (isV4LayoutEnabled) {
            <app-subscription-plans-v4
              [planFeaturesInput]="planFeatureAddonList"
              [currentPlanInput]="currentPlan"
              (selectPlan)="onSelectedPlan($event)"
            />
          } @else {
            <app-subscription-plans-new
              [planFeaturesInput]="planFeatureAddonList"
              [currentPlanInput]="currentPlan"
              (selectPlan)="onSelectedPlan($event)"
            />
          }
        }@else{
          @if (isV4LayoutEnabled) {
            <app-subscription-plans-v4
              [planFeaturesInput]="planFeatureAddonList"
              [currentPlanInput]="currentPlan"
              (selectPlan)="onSelectedPlan($event)"
            />
          } @else {
            <app-credit-card-pricing
              [planFeaturesInput]="planFeatureAddonList"
              [currentPlanInput]="currentPlan"
              (selectPlan)="onSelectedPlan($event)"
              (showAllPricingEvent)="showAllPricingEvent($event)"
            />
          }
        }
      </div>
    }
    @if (pageId === "addOns") {
      <div>
        <app-sub-addon-list
          [selected_plan_details]="selected_plan_details"
          (onChoosePlan)="onSelectedPlan($event)"
        >
        </app-sub-addon-list>
      </div>
    }
    @if (pageId === "billingAddress") {
      <div>
        <app-sub-billing-address
          [selected_plan_details]="selected_plan_details"
          [plan_feature_addon_list$]="planFeatureAddonList.asObservable()"
          (onChoosePlan)="onSelectedPlan($event)"
        >
        </app-sub-billing-address>
      </div>
    }
    @if (pageId === "payment") {
      <div>
        <app-subscription-payment
          [selected_plan_details]="selected_plan_details"
          [isFromTrial]="isFromTrial"
          (onChoosePlan)="onSelectedPlan($event)"
        >
        </app-subscription-payment>
      </div>
    }
  </div>
}
