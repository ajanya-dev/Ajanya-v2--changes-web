<div class="px-[6px] pb-[6px]">
  <!-- modal header -->
  <div class="flex justify-between pb-6">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
        <span class="pl-1 font-inter font-semibold text-base pb-0.5">
          Complete Payment
        </span>
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      ></fa-icon>
    </div>
  </div>
  <!-- modal body start -->
  <div
    class="relative border border-input-border-color rounded-lg overflow-hidden"
  >
    <div class="w-full min-h-[500px]">
      <iframe
        [src]="safePaymentUrl"
        class="w-full h-full border-none bg-main-background-color min-h-[500px]"
        frameborder="0"
        allowtransparency="true"
        referrerpolicy="no-referrer"
        loading="lazy"
        style="border: none"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation"
      ></iframe>
    </div>
  </div>
</div>
