<div class="comparison_table_container">
  <div class="comparison_head">
    <p>Compare all the plans</p>
  </div>

  <div class="comparison_table_wrapper">
    <table class="comaparison_table">
      <thead>
        <td class="feature_text">Features</td>
        <ng-container *ngFor="let plan of planslist">
          <td>{{ plan.planName }}</td>
        </ng-container>
      </thead>

      <tbody>
        <ng-container *ngFor="let feature of featureslist">
          <tr>
            <td>
              <span>{{ feature?.featureName }}</span>
            </td>

            <ng-container *ngFor="let plan of planslist">
              <td *ngIf="featureDetails[plan?.planCode]; else notExist">
                <span
                  *ngIf="
                    featureDetails[plan.planCode][feature.featureCode] !== 'yes'
                  "
                  >{{
                    featureDetails[plan.planCode][feature.featureCode]
                  }}</span
                >
                <span
                  *ngIf="
                    !featureDetails[plan.planCode][feature.featureCode] ||
                    featureDetails[plan.planCode][feature.featureCode] === 'yes'
                  "
                >
                  <i
                    [ngClass]="
                      featureDetails[plan.planCode][feature.featureCode] ===
                      'yes'
                        ? 'fa fa-check'
                        : 'fa fa-times'
                    "
                  ></i>
                </span>
              </td>

              <ng-template #notExist>
                <td><i class="fas fa-times"></i></td>
              </ng-template>
            </ng-container>
          </tr>
        </ng-container>

        <tr>
          <td></td>
          <td *ngFor="let plan of planslist">
            <button
              class="comparison_choose_btn"
              #currentPlan
              (click)="
                gtagScript(plan.planCode);
                chooseComparisonPlan(plan.planCode, plan, currentPlan)
              "
            >
              {{
                plan?.planCategoryType != 4 ? "Choose Plan" : "Talk to Sales"
              }}
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
