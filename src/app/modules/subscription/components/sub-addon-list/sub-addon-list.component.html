<section class="addon_main_wrapper">
  <div class="addon_container">
    <div class="action_area">
      <div class="flex items-center gap-5 absolute top-[29px] right-[42px]">
        <app-common-help-button [helpIcon]="true"></app-common-help-button>
        <div class="close_btn action_btn !static" matTooltip="Close">
          <button (click)="onClose()" class="text-2xl">
            <fa-icon [icon]="['fas', 'xmark']"></fa-icon>
          </button>
        </div>
      </div>
      <div class="back_btn action_btn" matTooltip="Go Back" (click)="goBack()" role="presentation">
        <fa-icon class="text-2xl" [icon]="['fas', 'arrow-left']"></fa-icon>
      </div>
    </div>

    <!--==================================================
			            MAIN HEAD START
===================================================-->
    <div class="addon_main_header">
      <h2>Now, Choose the Add-ons That You Need</h2>
    </div>
    <!--==================================================
              MAIN HEAD END
===================================================-->

    <!--==================================================
              ADDON BODY START
===================================================-->
    <div class="addon_box_wrapper">
      <div class="left_section">
        <div class="addon_box_container">
          <!-- Add one Card start -->
          <ng-container *ngFor="let addOn of addOnsList">
            <div
              class="single_addon"
              #singleCard
              id="singleBox_{{ addOn.addonCode }}"
            >
              <h3 class="addon_head">{{ addOn.addonDisplayText }}</h3>
              <h4 class="amount">
                <span class="doll">{{ addOn.monthlyPrice | currency }}</span>
                <span class="dur">/month</span>
              </h4>
              <p class="addon_feature">{{ addOn.description }}</p>

              <div class="addon_actions">
                <div class="count" *ngIf="addOn.addonQuantityType === 2">
                  <select
                    class="input_style"
                    id="quantity_{{ addOn.addonCode }}"
                    (change)="onChangeDropDown(addOn.addonCode)"
                  >
                    <option [value]="num" *ngFor="let num of dropDownList">
                      {{ num }}
                    </option>
                  </select>
                </div>

                <div class="add_btn_wrapper">
                  <button
                    class="add_btn"
                    #addBtn
                    [id]="addOn.addonCode"
                    (click)="activeAddon(singleCard, addBtn, $event, addOn)"
                  >
                    Add
                  </button>
                </div>

                <div
                  class="clear_item" role="presentation"
                  (click)="removeAddOn(singleCard, addBtn, $event, addOn)"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                    <path
                      d="M135.2 17.69C140.6 6.848 151.7 0 163.8 0H284.2C296.3 0 307.4 6.848 312.8 17.69L320 32H416C433.7 32 448 46.33 448 64C448 81.67 433.7 96 416 96H32C14.33 96 0 81.67 0 64C0 46.33 14.33 32 32 32H128L135.2 17.69zM31.1 128H416V448C416 483.3 387.3 512 352 512H95.1C60.65 512 31.1 483.3 31.1 448V128zM111.1 208V432C111.1 440.8 119.2 448 127.1 448C136.8 448 143.1 440.8 143.1 432V208C143.1 199.2 136.8 192 127.1 192C119.2 192 111.1 199.2 111.1 208zM207.1 208V432C207.1 440.8 215.2 448 223.1 448C232.8 448 240 440.8 240 432V208C240 199.2 232.8 192 223.1 192C215.2 192 207.1 199.2 207.1 208zM304 208V432C304 440.8 311.2 448 320 448C328.8 448 336 440.8 336 432V208C336 199.2 328.8 192 320 192C311.2 192 304 199.2 304 208z"
                    />
                  </svg>
                </div>
              </div>
            </div>
            <!-- Add one Card end -->
          </ng-container>
        </div>
      </div>

      <div class="right_section">
        <app-sub-biiling-calculation
          (onProceed)="onClickProceedBtn($event)"
          [selectedPlanCode]="selectedPlanCode"
          [data_for_billing$]="data_for_billing$.asObservable()"
        ></app-sub-biiling-calculation>
      </div>
    </div>
    <!--==================================================
              ADDON BODY END
===================================================-->
  </div>
</section>
