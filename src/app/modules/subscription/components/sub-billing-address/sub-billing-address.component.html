<section class="billingInfo_main_wrapper">
  <div class="billing_container">
    <!-- action button -->
    <div class="action_area">
      <div class="flex items-center gap-5 absolute top-[29px] right-[42px]">
        <app-common-help-button [helpIcon]="true"></app-common-help-button>
        <div class="close_btn action_btn !static" matTooltip="Close">
          <button (click)="onClose()" class="text-2xl">
            <fa-icon [icon]="['fas', 'xmark']"></fa-icon>
          </button>
        </div>
      </div>
      <div class="back_btn action_btn" matTooltip="Go Back" (click)="goBack()">
        <fa-icon class="text-2xl" [icon]="['fas', 'arrow-left']"></fa-icon>
      </div>
    </div>

    <!--==================================================
			            MAIN HEAD START
===================================================-->
    <div class="billInfo_main_header">
      <h2>Great! Provide the Billing Information</h2>
      <p>
        Your invoice for the subscription will be created on this billing
        address
      </p>
    </div>
    <!--==================================================
          MAIN HEAD END
===================================================-->

    <!--==================================================
              BILLING BODY START
===================================================-->

    <div class="billingInfo_box_wrapper">
      <div class="left_section">
        <div class="formGroup_wrapper">
          <form class="form_group" [formGroup]="billingForm">
            <!-- single field -->
            <div class="single_input">
              <input
                type="text"
                class="input_style"
                placeholder=" "
                formControlName="billingFirstName"
                maxlength="30"
              />
              <span class="floating_label_field"
                >First Name <span class="required">*</span></span
              >
              <app-control-message
                [control]="billingForm.controls.billingFirstName"
              ></app-control-message>
            </div>
            <!-- single field -->
            <div class="single_input">
              <input
                type="text"
                class="input_style"
                placeholder=" "
                formControlName="billingLastName"
                maxlength="30"
              />
              <span class="floating_label_field"
                >Last Name <span class="required">*</span></span
              >
              <app-control-message
                [control]="billingForm.controls.billingLastName"
              ></app-control-message>
            </div>

            <!-- single field -->
            <div class="single_input">
              <input
                type="text"
                class="input_style"
                placeholder=" "
                formControlName="billingCompanyName"
                maxlength="50"
              />
              <span class="floating_label_field"
                >Company Name <span class="required">*</span></span
              >
              <app-control-message
                [control]="billingForm.controls.billingCompanyName"
              ></app-control-message>
            </div>
            <!-- single field -->
            <div class="single_input">
              <input
                type="text"
                class="input_style"
                placeholder=" "
                mask="(000) 000-0000"
                (keypress)="utils.numberOnly($event, 'numeric')"
                formControlName="billingPhoneNumber"
              />
              <span class="floating_label_field"
                >Phone <span class="required">*</span></span
              >
              <app-control-message
                [control]="billingForm.controls.billingPhoneNumber"
              ></app-control-message>
            </div>

            <!-- single field -->
            <div class="single_input">
              <input
                type="text"
                class="input_style"
                placeholder=" "
                formControlName="billingAddress"
                #billingAddress
                (focus)="loadGoogleAddress(billingAddress)"
              />
              <span class="floating_label_field"
                >Address <span class="required">*</span></span
              >
              <app-control-message
                [control]="billingForm.controls.billingAddress"
              ></app-control-message>
            </div>
            <!-- single field -->
            <div class="single_input">
              <input
                type="text"
                class="input_style"
                placeholder=" "
                formControlName="billingCity"
              />
              <span class="floating_label_field"
                >City <span class="required">*</span></span
              >
              <app-control-message
                [control]="billingForm.controls.billingCity"
              ></app-control-message>
            </div>
            <!-- single field -->
            <div class="single_input">
              <input
                type="text"
                class="input_style"
                placeholder=" "
                formControlName="billingState"
              />
              <span class="floating_label_field"
                >State <span class="required">*</span></span
              >
              <app-control-message
                [control]="billingForm.controls.billingState"
              ></app-control-message>
            </div>
            <!-- single field -->
            <div class="single_input">
              <input
                type="text"
                class="input_style"
                placeholder=" "
                (keypress)="utils.numberOnly($event, 'numeric')"
                formControlName="billingZip"
                maxlength="11"
              />
              <span class="floating_label_field"
                >Zip <span class="required">*</span></span
              >
              <app-control-message
                [control]="billingForm.controls.billingZip"
              ></app-control-message>
            </div>
            <!-- single field -->
            <div class="single_input">
              <small class="small_floating_label" #country
                >Country<span class="required">*</span></small
              >
              <select
                class="input_style"
                formControlName="billingCountry"
                (change)="selectCountry($event)"
              >
                <option value="" disabled selected>Country</option>
                <option
                  [value]="item.key"
                  *ngFor="let item of allowedcountries | keyvalue"
                >
                  {{ item.value }}
                </option>
              </select>
              <app-control-message
                [control]="billingForm.controls.billingCountry"
              ></app-control-message>
            </div>
          </form>
        </div>

        <div class="multi_slide_btn_wrapper">
          <!-- next button -->
          <button
            type="button"
            class="next_btn ocw-btn ocw-btn-dark-green"
            (click)="onProceed()"
          >
            <span>Proceed to payment</span>
            <!-- <ng-template #loadingTemp>
                <div class="loading_msg">
                  <span class="loadingSpinner"></span>
                  <span>Loading..</span>
                </div>
              </ng-template> -->
          </button>
        </div>
      </div>

      <div class="right_section">
        <app-sub-biiling-calculation
          [selectedPlanCode]="selectedPlanCode"
          [data_for_billing$]="data_for_billing$.asObservable()"
        ></app-sub-biiling-calculation>
      </div>
    </div>

    <!--==================================================
              BILLING BODY END
===================================================-->
  </div>
</section>
