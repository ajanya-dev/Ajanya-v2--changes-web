<div class="min-h-screen bg-v4-main-background-color flex flex-col items-center justify-center p-4">

  <!-- Logo -->
  <div class="mb-8">
    <img
      [ngSrc]="logoPath"
      [alt]="authV3Service.appConfig?.websiteTitle"
      [title]="authV3Service.appConfig?.websiteTitle"
      width="180"
      height="48"
    />
  </div>

  <!-- Card -->
  <div class="w-full max-w-md bg-v4-popup-header-footer-color rounded-2xl shadow-lg p-8">

    <h1 class="text-2xl font-bold text-v4-main-text-color text-center mb-6 font-funnel">
      Reset Your Password
    </h1>

    <!-- Info box -->
    <div class="flex items-start gap-4 p-4 bg-v4-insight-card-background-blue border border-v4-insight-card-border-blue rounded-xl mb-6">
      <div class="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0"
           style="background-color: color-mix(in srgb, var(--v4-primary-brand-bold-color) 15%, transparent);">
        <lucide-icon [img]="MailIcon" [size]="18" class="text-v4-primary-brand-bold-color"></lucide-icon>
      </div>
      <div>
        <p class="font-semibold text-v4-main-text-color text-sm">Enter your registered email address</p>
        <p class="text-v4-secondary-text-color text-sm mt-0.5">We'll send you a secure link to reset your password</p>
      </div>
    </div>

    <!-- Form -->
    <form [formGroup]="forgotForm" class="space-y-4">
      <div class="w-full">
        <app-common-input-v4
          formControlName="username"
          placeholder="Enter your email address"
          type="email"
          [isFieldRequired]="false"
          (inputEvent)="onEmailInput($event)"
        />
      </div>
      <div class="w-full">
        <app-common-button-v4
          class="block w-full"
          [type]="{ style: 'neon', name: 'main' }"
          text="Send Reset Link"
          width="100%"
          [loading]="isResetLinkLoading()"
          [disabled]="isDisable"
          (clickEvent)="sendEmailtoForgotPassword()"
        />
      </div>
    </form>

    <!-- Timer -->
    @if (totalTimer && totalTimer !== '00:00') {
      <p class="text-center text-sm text-v4-secondary-text-color mt-3">
        {{ totalTimer }}
      </p>
    }

    <!-- Back to Login -->
    <a [routerLink]="['/login']"
       class="flex items-center justify-center gap-2 mt-6 text-v4-secondary-text-color hover:text-v4-primary-brand-color transition-colors font-medium cursor-pointer">
      <lucide-icon [img]="ArrowLeftIcon" [size]="18"></lucide-icon>
      Back to Login
    </a>

    <!-- Powered by -->
    @if (staticWhiteLabelConditions.zilMoneyLogoVisible) {
      <div class="mt-8 pt-6 border-t border-v4-border-color flex items-center justify-center gap-2">
        <span class="text-v4-secondary-text-color text-sm">Powered by</span>
        <img
          [ngSrc]="appConfig?.zilMoneyLogo || 'assets/main/zil_Money_logo.svg'"
          alt="Zil Money"
          width="100"
          height="26"
          loading="lazy"
        />
      </div>
    }

  </div>
</div>
