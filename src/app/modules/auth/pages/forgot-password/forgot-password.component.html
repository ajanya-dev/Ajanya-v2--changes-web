<section class="ocw-wrapper-body">
  <div class="logo-with-body">
    <div class="logo">
      <img
        [ngSrc]="logoPath"
        [alt]="authV3Service.appConfig?.websiteTitle"
        [title]="authV3Service.appConfig?.websiteTitle"
        width="130"
        height="85"
        class="mx-auto"
      />
    </div>
    <div class="ocw_form_bg h-auto mx-auto">
      <div class="main_column">
        <div class="left__forget_section w-full">
          <div class="forget_heading">
            <span>Forget Your Password ?</span>
          </div>

          <div class="alert__section">
            <div *ngIf="isEmailed" class="success__alert common-alert">
              <div class="alert_icon"><i class="fa fa-check"></i></div>
              <p><span>Success</span>We e-mailed your password reset link!</p>
            </div>
            <div *ngIf="!isEmailed" class="info__alert common-alert">
              <div class="alert_icon"><i class="fa fa-envelope"></i></div>
              <p>
                <span>Enter your Email Address.</span>We will send you a link to
                reset your password
              </p>
            </div>
          </div>

          <div class="flex justify-center items-center">
            <svg
              version="1.1"
              id="freepik_stories-forgot-password"
              class="line__svg"
              xmlns:svgjs="http://svgjs.com/svgjs"
              xmlns="http://www.w3.org/2000/svg"
              xmlns:xlink="http://www.w3.org/1999/xlink"
              x="0px"
              y="0px"
              viewBox="0 0 21 24.4"
              style="enable-background: new 0 0 21 24.4"
              xml:space="preserve"
            >
              <path class="st0" d="M10.7,0.9c0,7.8,0,15.6,0,23.3" />
            </svg>
          </div>
          <!-- form start -->
          <form [formGroup]="forgotForm" class="form-wrapper">
            <input type="hidden" name="" value="" />
            <!-- <div class="">
              <input
                class="shadow border rounded w-full py-2 px-3 focus:outline-none focus:shadow-outline"
                id="username"
                type="text"
                autocomplete="off"
                formControlName="username"
                value=""
                required="required"
                placeholder="Username or Email"
                (keyup)="getValue($event)"
              />
            </div> -->
            <div class="single_input">
              <input
                id="username"
                type="email"
                class="input_style"
                placeholder=" "
                formControlName="username"
                (keyup)="getValue($event)"
              />
              <span class="floating_label_field">Email</span>

              <div class="error_msg">{{ authV3Service.emailError }}</div>
            </div>
            <div class="btn-sec mt-5">
              <app-common-button-v35
                [type]="{ style: 'green', name: 'money-action' }"
                (click)="sendEmailtoForgotPassword()"
                text="Send Reset Link "
                [disabled]="isDisable"
                [loading]="isResetLinkLoading()"
                [ngClass]="{ 'disable-btn': isDisable }"
                [width]="'350px'"
              >
              </app-common-button-v35>

              <p *ngIf="totalTimer !== '00:00'" class="timer">
                {{ totalTimer === "00:00" ? "00:30" : totalTimer }}
              </p>
              <p
                [routerLink]="['/login']"
                routerLinkActive="router-link-active"
                class="back-to-login text-xs pt-3"
                style="cursor: pointer"
              >
                <i class="fa fa-arrow-left mr-2"></i> Back to Login
              </p>
            </div>
          </form>
        </div>
      </div>

      <!-- end row -->
      <div
        class="powered_text flex justify-center items-center pb-5"
        *ngIf="staticWhiteLabelConditions.zilMoneyLogoVisible"
      >
        <p class="ml-2 p-0">Powered by</p>
        <p class="pl-2">
          <a href="https://www.zilmoney.com/" target="_blank" rel="noopener">
            <img
              class="img-fluid"
              [src]="
                appConfig?.zilMoneyLogo ||
                '../../../../assets/main/zil_Money_logo.svg'
              "
              alt=""
            />
          </a>
        </p>
      </div>
    </div>
  </div>
</section>
