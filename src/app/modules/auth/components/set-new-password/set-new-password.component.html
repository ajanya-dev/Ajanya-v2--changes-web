<section class="ocw-wrapper-body">
  <div class="main-container">
    <div class="lock-icon">
      <embed src="assets/icon/lock-icon.svg" type="" />
    </div>
    <div class="header-text">Set a New Password to Continue</div>
    <form [formGroup]="authV3Service.setNewPasswordForm">
      <div class="relative-div">
        <div class="input-div">
          <div class="mr-1.5">Current Password:</div>
          <div class="input-group">
            <input
              placeholder=""
              type="password"
              formControlName="currentPassword"
              id="currentpassword"
            />
            <app-control-message
              [control]="
                authV3Service.setNewPasswordForm.controls.currentPassword
              "
            ></app-control-message>
            <br />
          </div>
        </div>
      </div>
      <div class="relative-div">
        <div class="input-div">
          <div class="mr-8">New Password:</div>
          <div class="input-group">
            <input
              placeholder=""
              type="password"
              formControlName="password"
              id="password"
              (keyup)="authV3Service.onPasswordValidation($event)"
            />
            <app-control-message
              [control]="authV3Service.setNewPasswordForm.controls.password"
            ></app-control-message>
          </div>
          <div
            id="pswd_info"
            [ngClass]="authV3Service.isPasswordAssistanceShown ? '' : 'active'"
          >
            <ul id="validationList">
              <li id="letter" class="invalid">At least one lower case</li>
              <li id="capital" class="invalid">At least one capital letter</li>
              <li id="number" class="invalid">At least one number</li>
              <li id="specialCharacter" class="invalid">
                At least one special character
              </li>
              <li id="length" class="invalid">Be at least 8 characters</li>
            </ul>
          </div>
        </div>
      </div>
      <div class="relative-div">
        <div class="input-div">
          <div class="mr-[5px]">Confirm Password:</div>
          <div class="input-group">
            <input
              placeholder=""
              type="password"
              formControlName="passwordConfirmation"
              id="cpassword"
              (keyup)="authV3Service.checkConfirmPassword($event)"
            />
            <app-control-message
              [control]="
                authV3Service.setNewPasswordForm.controls.passwordConfirmation
              "
            ></app-control-message>
            <span class="error-text" *ngIf="authV3Service.isConfirmPassword"
              >Confirm password is mismatched!</span
            >
            <br />
          </div>
        </div>
      </div>

      <div class="save-btn">
        <app-common-button-v35
        [type]="{ style: 'blue', name: 'money-action' }"
        (clickEvent)=" authV3Service.isPasswordSubmit
        ? ''
        : authV3Service.onPasswordSubmit()"
        text="Save & Continue"
        [width]="authV3Service.isPasswordSubmit ? '160px' : '145px'"
        [loading]="authV3Service.isPasswordSubmit"
      >
      </app-common-button-v35>
      </div>
    </form>

    <div class="footer-logo">
      <embed src="assets/images/ocw_powered_by_zilmoney_logo.svg" type="" />
    </div>
  </div>
</section>
