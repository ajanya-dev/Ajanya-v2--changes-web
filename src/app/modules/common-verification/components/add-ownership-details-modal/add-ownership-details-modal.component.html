<div class="ocw_man_modal_wrapper">
  <!-- modal header -->
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">Add Ownership Details</div>
    <div class="close_btn" [mat-dialog-close]="false">
      <svg
        aria-hidden="true"
        focusable="false"
        data-prefix="fal"
        data-icon="times"
        class="svg-inline--fa fa-times fa-w-10"
        role="img"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 320 512"
      >
        <path
          fill="currentColor"
          d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
        ></path>
      </svg>
    </div>
  </div>
  <!-- modal body start -->
  <div class="ocw_modal_body">
    <form [formGroup]="businessForm">
      <div class="input_group">
        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            maxlength="30"
            formControlName="firstName"
          />
          <span class="floating_label_field"
            >First Name<span class="required">*</span></span
          >
          <app-control-message [control]="businessForm.controls.firstName">
          </app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            maxlength="30"
            formControlName="lastName"
          />
          <span class="floating_label_field"
            >Last Name<span class="required">*</span></span
          >
          <app-control-message [control]="businessForm.controls.lastName">
          </app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            maxlength="50"
            formControlName="title"
          />
          <span class="floating_label_field"
            >Title<span class="required">*</span></span
          >
          <app-control-message [control]="businessForm.controls.title">
          </app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            maxlength="50"
            formControlName="email"
          />
          <span class="floating_label_field"
            >Email<span class="required">*</span></span
          >
          <app-control-message [control]="businessForm.controls.email">
          </app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="fullSsn"
            (focus)="onFocus()"
            (blur)="onBlur()"
            [mask]="mask"
            [patterns]="customPattern"
            [hiddenInput]="true"
            (copy)="(false)"
            (cut)="(false)"
          />
          <span class="floating_label_field"
            >Enter SSN number<span class="required">*</span></span
          >
          <app-control-message [control]="businessForm.controls.fullSsn">
          </app-control-message>
        </div>

        <div class="single_input">
          <input
            type="date"
            class="input_style"
            placeholder=" "
            formControlName="birthDate"
          />
          <span class="floating_label_field"
            >Birth Date<span class="required">*</span></span
          >
          <app-control-message [control]="businessForm.controls.birthDate">
          </app-control-message>
        </div>
        <div class="single_input">
          <app-new-phone-input
            formControlName="phoneNumber"
            [isRequiredField]="true"
          ></app-new-phone-input>
          <app-control-message [control]="businessForm.controls.phoneNumber">
          </app-control-message>
        </div>
        <div class="single_input percentage">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            mask="000"
            formControlName="ownershipPercentage"
          />
          <span class="floating_label_field"
            >Ownership Percentage<span class="required">*</span></span
          >
          <div class="add_modal_btn">
            <svg
              width="15"
              height="17"
              viewBox="0 0 15 17"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M0.449219 4.85695V4.03477C0.449219 3.44394 0.577351 2.9065 0.833614 2.42245C1.08988 1.93839 1.45648 1.55044 1.93341 1.25858C2.41035 0.966729 2.97626 0.820801 3.63116 0.820801C4.30029 0.820801 4.86976 0.966729 5.33958 1.25858C5.81652 1.55044 6.18312 1.93839 6.43938 2.42245C6.69564 2.9065 6.82377 3.44394 6.82377 4.03477V4.85695C6.82377 5.43354 6.69564 5.96387 6.43938 6.44792C6.19023 6.93197 5.82719 7.31993 5.35026 7.61178C4.88044 7.90364 4.31453 8.04957 3.65251 8.04957C2.9905 8.04957 2.41747 7.90364 1.93341 7.61178C1.45648 7.31993 1.08988 6.93197 0.833614 6.44792C0.577351 5.96387 0.449219 5.43354 0.449219 4.85695ZM1.93341 4.03477V4.85695C1.93341 5.1844 1.99392 5.49405 2.11493 5.78591C2.24306 6.07776 2.43526 6.31623 2.69152 6.50131C2.94779 6.67927 3.26812 6.76825 3.65251 6.76825C4.03691 6.76825 4.35368 6.67927 4.60282 6.50131C4.85197 6.31623 5.03705 6.07776 5.15806 5.78591C5.27907 5.49405 5.33958 5.1844 5.33958 4.85695V4.03477C5.33958 3.70021 5.27552 3.387 5.14738 3.09514C5.02637 2.79617 4.83773 2.5577 4.58147 2.37974C4.33232 2.19466 4.01555 2.10212 3.63116 2.10212C3.25388 2.10212 2.93711 2.19466 2.68085 2.37974C2.4317 2.5577 2.24306 2.79617 2.11493 3.09514C1.99392 3.387 1.93341 3.70021 1.93341 4.03477ZM8.01967 13.6126V12.7798C8.01967 12.1961 8.1478 11.6622 8.40407 11.1781C8.66033 10.6941 9.02693 10.3061 9.50386 10.0143C9.9808 9.7224 10.5467 9.57647 11.2016 9.57647C11.8707 9.57647 12.4402 9.7224 12.91 10.0143C13.387 10.3061 13.7536 10.6941 14.0098 11.1781C14.2661 11.6622 14.3942 12.1961 14.3942 12.7798V13.6126C14.3942 14.1963 14.2661 14.7302 14.0098 15.2143C13.7607 15.6983 13.3976 16.0863 12.9207 16.3781C12.4509 16.67 11.885 16.8159 11.223 16.8159C10.561 16.8159 9.99148 16.67 9.51454 16.3781C9.03761 16.0863 8.66745 15.6983 8.40407 15.2143C8.1478 14.7302 8.01967 14.1963 8.01967 13.6126ZM9.50386 12.7798V13.6126C9.50386 13.9401 9.56437 14.2533 9.68538 14.5523C9.81352 14.8441 10.0057 15.0826 10.262 15.2677C10.5182 15.4456 10.8386 15.5346 11.223 15.5346C11.6074 15.5346 11.9241 15.4456 12.1733 15.2677C12.4295 15.0826 12.6182 14.8441 12.7392 14.5523C12.8602 14.2604 12.9207 13.9472 12.9207 13.6126V12.7798C12.9207 12.4452 12.8566 12.132 12.7285 11.8401C12.6075 11.5483 12.4189 11.3134 12.1626 11.1354C11.9135 10.9503 11.5931 10.8578 11.2016 10.8578C10.8243 10.8578 10.5076 10.9503 10.2513 11.1354C10.0022 11.3134 9.81352 11.5483 9.68538 11.8401C9.56437 12.132 9.50386 12.4452 9.50386 12.7798ZM11.6928 3.2553L4.10097 15.4065L2.9905 14.7017L10.5823 2.55058L11.6928 3.2553Z"
              />
            </svg>
          </div>
          <app-control-message
            [control]="businessForm.controls.ownershipPercentage"
          >
          </app-control-message>
          <span
            class="error_msg"
            *ngIf="
              businessForm.controls.ownershipPercentage.errors!?.isInvalid &&
              !businessForm.controls.ownershipPercentage.errors!?.required &&
              businessForm.controls.ownershipPercentage.touched
            "
          >
            Percentage should be between 25 to 100
          </span>
        </div>
        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            #searchGoogleAddess
            (focus)="loadGoogleAddress(searchGoogleAddess)"
            formControlName="address"
          />
          <span class="floating_label_field"
            >Address<span class="required">*</span></span
          >
          <app-control-message [control]="businessForm.controls.address">
          </app-control-message>
        </div>

        <ng-container *ngIf="businessForm.controls.address.touched || editMode">
          <div class="single_input">
            <input
              type="text"
              class="input_style"
              placeholder=" "
              formControlName="city"
            />
            <span class="floating_label_field"
              >City<span class="required">*</span></span
            >
            <app-control-message [control]="businessForm.controls.city">
            </app-control-message>
          </div>
          <div class="single_input">
            <input
              type="text"
              class="input_style"
              placeholder=" "
              formControlName="state"
            />
            <span class="floating_label_field"
              >State<span class="required">*</span></span
            >
            <app-control-message [control]="businessForm.controls.state">
            </app-control-message>
          </div>
          <div class="single_input">
            <input
              type="text"
              class="input_style"
              placeholder=" "
              formControlName="zip"
            />
            <span class="floating_label_field"
              >Zip<span class="required">*</span></span
            >
            <app-control-message [control]="businessForm.controls.zip">
            </app-control-message>
          </div>
          <div class="single_input">
            <small class="small_floating_label" #country
              >Country<span class="required">*</span></small
            >
            <select
              name=""
              id=""
              class="input_style"
              formControlName="country"
              (change)="selectBenfCountry(country)"
            >
              <option value="" disabled selected>Country</option>
              <option
                [value]="item.key"
                *ngFor="let item of allowedcountries | keyvalue"
              >
                {{ item.value }}
              </option>
            </select>
            <app-control-message [control]="businessForm.controls.country">
            </app-control-message>
          </div>
        </ng-container>
      </div>
    </form>
  </div>
  <!-- modal body end -->
  <div class="ocw_modal_footer">
    <mat-dialog-actions align="end">
      <button mat-dialog-close class="ocw-btn ocw-btn-modal-bordered">
        Cancel
      </button>
      <button
        type="submit"
        class="ocw-btn ocw-btn-modal-blue add_btn"
        (click)="submit()"
      >
        <span>{{ editMode ? "Update" : "Submit" }}</span>
      </button>
    </mat-dialog-actions>
  </div>
</div>
