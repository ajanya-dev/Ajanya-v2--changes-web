<app-v4-main-page-layout
  [config]="config"
  (ctaClick)="onCtaClick()"
  (cardClick)="onCardClick($event)"
>
  <!-- Powerful Integrations Section -->
  <div
    afterBenefits
    class="rounded-2xl border border-v4-border-color bg-v4-secondary-background-color p-8"
  >
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <!-- Left Content -->
      <div class="flex flex-col justify-center">
        <h2 class="text-xl font-bold text-v4-main-text-color font-funnel mb-2">
          Powerful Integrations Available Now
        </h2>
        <p class="text-sm text-v4-secondary-text-color font-peridot m-0 mb-4">
          Connect Zil Money with QuickBooks, Xero, and other popular accounting
          platforms. Automate your workflows and sync your financial data in
          real-time.
        </p>
        <div class="flex flex-col gap-2 mb-4">
          <div class="flex items-center gap-2">
            <lucide-icon
              [img]="CircleCheckIcon"
              [size]="18"
              class="text-v4-text-success shrink-0"
            />
            <span class="text-sm text-v4-main-text-color font-peridot">
              Two-way data sync
            </span>
          </div>
          <div class="flex items-center gap-2">
            <lucide-icon
              [img]="CircleCheckIcon"
              [size]="18"
              class="text-v4-text-success shrink-0"
            />
            <span class="text-sm text-v4-main-text-color font-peridot">
              Automated reconciliation
            </span>
          </div>
          <div class="flex items-center gap-2">
            <lucide-icon
              [img]="CircleCheckIcon"
              [size]="18"
              class="text-v4-text-success shrink-0"
            />
            <span class="text-sm text-v4-main-text-color font-peridot">
              Real-time transaction updates
            </span>
          </div>
        </div>
        <div>
          <app-common-button-v4
            text="Browse Integrations"
            [type]="{ style: 'primary', name: 'main' }"
            lucideIcon="arrow-right"
            [lucideIconSize]="16"
            iconPosition="end"
            customPadding="0px 28px"
            (clickEvent)="onCardClick(config.featureSections[0].cards[0])"
          />
        </div>
      </div>

      <!-- Right Logo Grid -->
      <div class="grid grid-cols-2 gap-4">
        <div
          class="bg-v4-secondary-background-color rounded-2xl p-6 flex items-center justify-center border border-v4-border-color"
        >
          <img
            src="assets/icon/intuit.svg"
            alt="Intuit"
            class="h-10 w-auto max-w-full object-contain"
          />
        </div>
        <div
          class="bg-v4-secondary-background-color rounded-2xl p-6 flex items-center justify-center border border-v4-border-color"
        >
          <img
            src="assets/images/integration/xero.png"
            alt="Xero"
            class="h-10 w-auto max-w-full object-contain"
          />
        </div>
        <div
          class="bg-v4-secondary-background-color rounded-2xl p-6 flex items-center justify-center border border-v4-border-color"
        >
          <img
            src="assets/images/integration/Sage_logo.svg"
            alt="Sage"
            class="h-10 w-auto max-w-full object-contain"
          />
        </div>
        <button
          type="button"
          class="bg-v4-secondary-background-color rounded-2xl p-6 flex items-center justify-center border border-v4-border-color cursor-pointer hover:shadow-md transition-shadow w-full font-inherit text-center"
          (click)="goToIntegrations()"
        >
          <span
            class="text-lg font-bold text-v4-secondary-text-color font-funnel"
          >
          More
          </span>
        </button>
      </div>
    </div>
  </div>

  <!-- Get Notified Section -->
  <!-- <div
    footer
    class="rounded-2xl bg-v4-secondary-brand-color p-8 text-center"
  >
    <h2 class="text-xl font-bold text-black font-funnel mb-2">
      Get Notified When Services Launch
    </h2>
    <p class="text-sm text-black/80 font-peridot m-0 mb-4">
      Be the first to know when these powerful services become available. Join
      our waitlist today!
    </p>
    <div class="flex justify-center">
      <app-common-button-v4
        text="Join Waitlist"
        [type]="{ style: 'primary', name: 'main' }"
        lucideIcon="arrow-right"
        [lucideIconSize]="16"
        (clickEvent)="(null)"
      />
    </div>
  </div> -->
</app-v4-main-page-layout>
