<div class="behalf_of_section">
  <div class="on_behalf_of_label flex text-sm gap-1 flex-col">
    <div class="flex gap-1">
      <div class="flex items-center">
        <mat-checkbox
          #checkBoxElem
          (change)="getCheckBoxChange($event)"
        ></mat-checkbox>
      </div>
      <div class="w-full flex items-center">
        <div
          *ngIf="!isBehalfOf"
          (click)="toggleCheckBox(checkBoxElem)"
          class="cursor-pointer"
        >
          <span class="behalf-span">This transaction is on behalf of</span>
        </div>
        <div *ngIf="isBehalfOf" class="w-full">
          <div class="flex w-full">
            <ng-select
              [(ngModel)]="selectedItem"
              [ngModelOptions]="{ standalone: true }"
              (change)="getChangeItem($event)"
              placeholder="Select Name"
              appendTo="ng-select"
            >
              <ng-option *ngFor="let item of data" [value]="item?.id">{{
                item?.text
              }}</ng-option>
            </ng-select>
            <div class="add_modal_btn" (click)="openModal()">
              <fa-icon [icon]="['fas', 'plus']"></fa-icon>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="pl-[23px] flex gap-1" *ngIf="selectedItem && isBehalfOf">
      <div>
        <span
          (click)="editOnBehalfOf()"
          class="text-sky-400 text-[13px] font-medium cursor-pointer"
          >Edit</span
        >
      </div>
      <div>
        <span
          (click)="deleteItem()"
          class="text-red-500 text-[13px] font-medium cursor-pointer"
          >Delete</span
        >
      </div>
    </div>
  </div>
</div>
