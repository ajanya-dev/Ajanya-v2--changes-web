<div
  (click)="click()"
  role="presentation"
  class="bg-main-background-color h-11 w-fit border-input-border-color border rounded-[3px] shadow-common-box-shadow cursor-pointer"
>
  <div
    [ngClass]="{
      'flex-row-reverse pr-4 pl-1.5': reverse(),
      'p-1.5 pl-4 ': !reverse()
    }"
    class="h-full w-full text-common-blue-color gap-2 flex items-center relative"
  >
    <fa-icon class="text-common-blue-color" [icon]="faCreditCard" />
    <p class="font-roboto text-sm font-semibold text-nowrap">
      Click here <br />
      to pay by credit card
    </p>
    <div (click)="close()" role="presentation">
      <fa-icon
        class="text-input-border-color hover:text-main-text-color"
        [icon]="faXmark"
      />
    </div>
    <div
      [ngClass]="{
        'border-r border-t -right-[6.5px] ': reverse(),
        'border-l border-b -left-[6.5px] ': !reverse()
      }"
      class="absolute h-3 w-3 rotate-45 border-input-border-color bg-main-background-color"
    ></div>
  </div>
</div>
