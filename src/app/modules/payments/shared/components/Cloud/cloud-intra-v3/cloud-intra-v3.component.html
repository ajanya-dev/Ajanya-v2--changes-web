<div class="main-container" [formGroup]="quickPayForm">
  <div class="w-full flex items-center flex-col">
    <app-amount-input
      formControlName="amount"
      [maxLength]="15"
      customClass="amount-input-v3"
    ></app-amount-input>
    @if (
      quickPayForm?.controls?.amount?.value &&
      (quickPayForm?.controls?.amount?.value ?? 0) < 10
    ) {
      <div>
        <small class="text-common-red-color text-xs font-medium font-roboto"
          >Minimum transaction amount should be $10.00</small
        >
      </div>
    }
  </div>
  <div class="w-full flex justify-center">
    <app-control-message-v35
      [control]="quickPayForm.controls.amount"
      label="Amount is required"
    ></app-control-message-v35>
  </div>
  <div class="w-full flex flex-col justify-center items-center mt-8">
    @if (payeeDataService.payeeDataSignal()) {
      <div class="w-full flex justify-end items-end mb-1 text-main-text-color">
        <button
          matTooltip="View Payee Summary"
          (click)="payeeDataService.openTransactionHistoryModal()"
        >
          <fa-icon [icon]="faHistory"></fa-icon>
        </button>
      </div>
    }
    <div class="w-full flex justify-center items-center">
      <div class="custom-input-v3-wrapper max-w-[340px]">
        <app-cloud-account-dropdown-v35
          (selectionEvent)="cloudDropDownChange($event)"
          (clearEvent)="clearCloudAccount()"
          [setSelectDropdownItem]="this.paymentConfig?.paymentFormValue?.cloud"
        ></app-cloud-account-dropdown-v35>
      </div>
      <div class="arrow-wrapper flex justify-center items-center">
        <div class="arrow flex justify-center items-center">
          <fa-icon [icon]="['fas', 'arrow-right-long']"></fa-icon>
        </div>
      </div>
      <div class="custom-input-v3-wrapper flex grow shadow max-w-[340px]">
        <app-payee-dropdown-v3
          class="w-full"
          customHeight="3"
          (ngModelChange)="payeeSelect($event, true)"
          formControlName="payee"
          appendTo="body"
          (ready)="
            autoPopulateDropdown(
              $event,
              paymentConfig?.paymentFormValue?.payee?.encryptedId
            )
          "
          (clearEvent)="clearPayee()"
        ></app-payee-dropdown-v3>
      </div>
    </div>
  </div>
  <div class="flex">
    <app-control-message-v35
      [control]="quickPayForm.controls.cloud"
      class="w-full"
    ></app-control-message-v35>
    <app-control-message-v35
      [control]="quickPayForm.controls.payee"
      class="w-full pl-7"
    ></app-control-message-v35>
  </div>
  <div class="gap-5 mt-5">
    <div class="flex gap-6">
      <div class="single_input w-1/2">
        <div class="flex w-full drop-down-app">
          <app-drop-down-payee-bank
            #payeeBankDropDown
            class="w-full"
            [payeeDetails]="payeeBankDetails"
            [data]="payeeBankDetails"
            (clearEvent)="clearBankAccount($event)"
            [selectedPayeeName]="editBankName ?? selectedPayeeBankData"
            placeholder="Payee Bank Account"
            (selectionChange)="changeBankAccount($event)"
            (addPayeeEvent)="addPayeeBankAc()"
          ></app-drop-down-payee-bank>
        </div>
        <app-control-message-v35
          [control]="quickPayForm.controls.payeeBankAc"
        ></app-control-message-v35>
      </div>
      <div class="single_input w-1/2">
        <input
          type="text"
          class="input_style"
          id="payeeIdNumber"
          formControlName="payeeIdNumber"
          maxlength="30"
          placeholder=" "
        />
        <label for="payeeIdNumber" class="floating_label_field"
          >Payee ID/Acc Number</label
        >
      </div>
    </div>
    <div class="single_input col-span-2 mt-6">
      <input
        type="text"
        class="input_style"
        placeholder=" "
        id="payeeEmail"
        formControlName="payeeEmail"
      />
      <label for="payeeEmail" class="floating_label_field">Payee Email</label>
      <app-control-message-v35
        [control]="quickPayForm.controls.payeeEmail"
      ></app-control-message-v35>
    </div>
    <div class="single_input col-span-2 mb-2 mt-6">
      <input
        type="text"
        class="input_style memo-input-with-icon"
        placeholder=" "
        id="memo"
        formControlName="memo"
        maxlength="100"
      />
      <label for="memo" class="floating_label_field"
        >Memo<span class="error_msg">*</span></label
      >
      <app-control-message-v35
        [control]="quickPayForm.controls.memo"
        label="Please enter the memo"
      ></app-control-message-v35>
    </div>
  </div>

      [matBadgeHidden]="attachmentCount<1?true:false" matTooltip=""
      (click)="openAddAttachment()">
      <fa-icon [icon]="['fas', 'paperclip']"></fa-icon>
    </button>
    <button class="add-comment h-10 w-10 border rounded-full flex items-center justify-center hover:shadow-md"

      matTooltip="Add comments to the payment" (click)="openAddComment()">
      <fa-icon [icon]="['fas', 'comment-plus']"></fa-icon>
    </button>
  </div> -->
  <div class="pt-6 flex gap-2 justify-end flex-1 w-full">
    <app-common-button-v35
      class="w-1/2"
      [type]="{ style: 'filled', name: 'main' }"
      text="Pay Now"
      width="100%"
      (clickEvent)="onSubmit()"
      [loading]="submitting"
      [disabled]="submitting"
    ></app-common-button-v35>
  </div>
</div>
