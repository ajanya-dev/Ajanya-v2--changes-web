<div class="main-container" [formGroup]="walletForm">
  <div class="w-full flex flex-col items-center justify-center">
    <app-amount-input
      [isDisabled]="walletForm.controls.amount.disabled || amountInputDisabled"
      [ngClass]="
        walletForm.controls.amount.disabled || amountInputDisabled
          ? 'disable_field_amt cursor-no-drop bg-check-input-disabled-color'
          : ''
      "
      formControlName="amount"
      [maxLength]="15"
      customClass="amount-input-v3"
    ></app-amount-input>
    <app-control-message-v35
      [control]="walletForm.controls.amount"
      label="Amount is required"
    ></app-control-message-v35>

    @if (walletForm.value?.amount < 10 && walletForm.value.amount !== null) {
      <div>
        <small class="text-common-red-color text-xs font-medium font-roboto"
          >Minimum transaction amount should be $10.00</small
        >
      </div>
    }
  </div>
  <div class="w-full flex flex-col justify-center items-center mt-8">
    @if (payeeDataService.payeeDataSignal()) {
      <div class="w-full flex justify-end items-end mb-1 text-main-text-color">
        <button
          matTooltip="View Payee Summary"
          (click)="payeeDataService.openTransactionHistoryModal()"
        >
          <fa-icon [icon]="faHistory"></fa-icon>
        </button>
      </div>
    }
    <div class="w-full flex justify-center items-center">
      <div class="custom-input-v3-wrapper flex grow shadow max-w-[340px]">
        <app-wallet-dropdown-v3
          class="w-full"
          formControlName="wallet"
          (ready)="
            populateOnEdit($event, paymentConfig?.paymentFormValue?.wallet?.id)
          "
          append="ng-select"
          customHeight="3"
        ></app-wallet-dropdown-v3>
      </div>
      <div class="arrow-wrapper flex justify-center items-center">
        <div class="arrow flex justify-center items-center">
          <fa-icon [icon]="['fas', 'arrow-right-long']"></fa-icon>
        </div>
      </div>
      <div class="custom-input-v3-wrapper flex grow shadow max-w-[340px]">
        <app-payee-dropdown-v3
          [blockFrozenPayee]="true"
          class="w-full"
          customHeight="3"
          [enableAddNew]="true"
          formControlName="payee"
          (ready)="
            populateOnEdit(
              $event,
              paymentConfig?.paymentFormValue?.payee?.encryptedId
            )
          "
          (clearEvent)="clearPayeeSelect()"
          (ngModelChange)="payeeSelect($event, true)"
          (newPayeeAdded)="newPayeeAdd($event)"
        ></app-payee-dropdown-v3>
      </div>
    </div>
  </div>
  <div class="flex">
    <app-control-message-v35
      [control]="walletForm.controls.wallet"
      class="w-full"
    ></app-control-message-v35>
    <app-control-message-v35
      [control]="walletForm.controls.payee"
      class="w-full pl-7"
    ></app-control-message-v35>
  </div>
  <div class="grid grid-cols-2 gap-6 mt-5">
    <div class="single_input">
      <input
        id="payeeEmail"
        type="text"
        class="input_style"
        placeholder=" "
        formControlName="payeeEmail"
      />
      <label for="payeeEmail" class="floating_label_field"
        >Payee Email<span class="error_msg">*</span></label
      >
      <app-control-message-v35
        [control]="walletForm.controls.payeeEmail"
      ></app-control-message-v35>
    </div>

    <!-- Industry Type -->
    <!-- <div class="single_input">
      <app-industry-types-dropdown
        class="w-full"
        (selectionChange)="selectionChange($event)"
        [selectedItem]="walletForm.controls.industryType.value"
        [payeeId]="walletForm.controls.payee.value?.id"
      />
      <app-control-message-v35 [control]="walletForm.controls.industryType">
      </app-control-message-v35>
    </div> -->

    <div class="single_input">
      <div class="flex w-full drop-down-app">
        <app-category-dropdown-v3
          class="w-full"
          formControlName="category"
          (ready)="
          setDropDownAPIAndBindId(
            $event,
            this.categoryId()
          )
        "
        ></app-category-dropdown-v3>
      </div>
      <app-control-message-v35 [control]="walletForm.controls.category">
      </app-control-message-v35>
    </div>

    <div class="single_input">
      <input
        id="invoiceNo"
        type="text"
        class="input_style"
        placeholder=" "
        formControlName="invoiceNumber"
      />
      <label for="invoiceNo" class="floating_label_field">Invoice Number</label>
      <app-control-message-v35 [control]=""></app-control-message-v35>
    </div>
    <div class="single_input col-span-2 mb-2">
      <input
        id="payeeId"
        type="text"
        class="input_style"
        placeholder=" "
        formControlName="payeeIdNumber"
        maxlength="30"
      />
      <label for="payeeId" class="floating_label_field"
        >Payee ID/Account Number</label
      >
      <app-control-message-v35
        [control]="walletForm.controls.payeeIdNumber"
      />
    </div>

    <div class="single_input col-span-2 mb-2">
      <input
        id="memo"
        type="text"
        class="input_style memo-input-with-icon"
        placeholder=" "
        formControlName="memo"
        maxlength="100"
      />
      <label for="memo" class="floating_label_field"
        >Memo<span class="error_msg">*</span></label
      >
      <app-control-message-v35
        [control]="walletForm.controls.memo"
        label="Please enter the memo"
      ></app-control-message-v35>
    </div>
  </div>
  <div class="flex gap-2 mt-3">
    <button
      class="add-attachment h-10 w-10 border rounded-full flex items-center justify-center hover:shadow-md"
      [matBadge]="attachmentCount"
      matBadgeSize="small"
      [matBadgeHidden]="attachmentCount < 1 ? true : false"
      matTooltip="Add attachments to the payment"
      (click)="openAddAttachment()"
    >
      <fa-icon [icon]="['fas', 'paperclip']"></fa-icon>
    </button>
    <button
      class="add-comment h-10 w-10 border rounded-full flex items-center justify-center hover:shadow-md"
      [matBadge]="commentsCount"
      matBadgeSize="small"
      [matBadgeHidden]="commentsCount < 1 ? true : false"
      matTooltip="Add comments to the payment"
      (click)="openAddComment()"
    >
      <fa-icon [icon]="['fas', 'comment-plus']" class="w-full"></fa-icon>
    </button>

    <button
      class="add-remittance h-10 w-10 border rounded-full flex items-center justify-center hover:shadow-md"
      [matBadge]="hasRemitance ? '✔' : ''"
      matBadgeSize="small"
      matTooltip="Add remittance to the payment"
      (click)="openAddRemitance()"
    >
      <fa-icon [icon]="['fas', 'square-list']"></fa-icon>
    </button>
  </div>
  <div class="pt-6 flex gap-2 justify-between">
    @if (paymentConfig.mode === "EDIT") {
      <app-common-button-v35
        class="flex-1"
        [type]="{ style: 'bordered', name: 'main' }"
        text="Update"
        width="100%"
        (clickEvent)="submitPayment('update')"
        [loading]="loading && paymentProcessingContext === 'update'"
        [disabled]="loading"
      ></app-common-button-v35>
    }
    @if (paymentConfig.mode === "CREATE") {
      <app-common-button-v35
        class="flex-1"
        [type]="{ style: 'bordered', name: 'main' }"
        text="Save"
        width="100%"
        (clickEvent)="submitPayment('save')"
        [loading]="loading && paymentProcessingContext === 'save'"
        [disabled]="loading"
      ></app-common-button-v35>
    }
    <app-common-button-v35
      class="flex-1"
      [type]="{ style: 'filled', name: 'main' }"
      text="Send Card"
      width="100%"
      (clickEvent)="
        submitPayment(paymentConfig?.mode === 'CREATE' ? 'pay' : 'updateAndPay')
      "
      [loading]="
        loading &&
        (paymentProcessingContext === 'pay' ||
          paymentProcessingContext === 'updateAndPay')
      "
      [disabled]="loading"
    ></app-common-button-v35>
  </div>
</div>
