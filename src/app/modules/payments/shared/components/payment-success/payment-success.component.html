<div
  class="main-container w-full h-full flex flex-col items-center justify-center pt-20"
>
  <div class="flex flex-col icon-animation items-center justify-center pb-10">
    <div class="icon-wrapper">
      <img
        src="./../../../../../../assets/images/plexe/Checked.svg"
        alt="Success"
      />
    </div>
    <div class="header1">
      {{ displayTitle }}
    </div>
    <div class="header2">
      {{ displayContent }}
    </div>
  </div>
  <div class="buttons flex gap-[1rem]">
    <button class="ocw-btn ocw-btn-modal-bordered" (click)="newPayment()">
      New Payment
    </button>
    <button class="ocw-btn ocw-btn-modal-bordered" (click)="viewPayment()">
      View Payment
    </button>
  </div>
</div>
