<div class="webcam-modal-wrapper p-4 flex flex-col">
  <!-- Header -->
  <div class="flex justify-between items-center mb-4">
    <h2 class="font-inter font-semibold text-base text-main-text-color">
      {{ dialogData.title }}
    </h2>
    <fa-icon
      [icon]="faXmark"
      class="cursor-pointer text-main-text-color"
      (click)="closeModal()"
    ></fa-icon>
  </div>

  <!-- Error Message -->
  @if (error) {
    <div
      class="error-message bg-common-secondary-red-color text-common-red-color p-3 rounded mb-4 text-sm"
    >
      {{ error }}
    </div>
  }

  <!-- Video/Canvas Container -->
  <div
    class="video-container relative w-full aspect-video bg-black rounded overflow-hidden mb-4"
  >
    @if (!isCapturing) {
      <video
        #videoElement
        autoplay
        playsinline
        muted
        class="w-full h-full object-cover"
      ></video>
      <!-- Switch Camera Button -->
      <button
        class="absolute top-2 right-2 bg-white/80 rounded-full p-2"
        (click)="switchCamera()"
        title="Switch Camera"
      >
        <fa-icon [icon]="faRotate" class="text-main-text-color"></fa-icon>
      </button>
    } @else {
      <img
        [src]="capturedImage"
        alt="Captured Image"
        class="w-full h-full object-cover"
      />
    }
  </div>

  <!-- Hidden Canvas for Capture -->
  <canvas #canvasElement class="hidden"></canvas>

  <!-- Action Buttons -->
  <div class="flex gap-3 justify-center">
    @if (!isCapturing) {
      <app-common-button-v35
        [type]="{ style: 'filled', name: 'main' }"
        text="Capture"
        (clickEvent)="captureImage()"
        [isAddIcon]="true"
        [icon]="faCamera"
        width="140px"
        [disabled]="!!error"
      />
    } @else {
      <app-common-button-v35
        [type]="{ style: 'bordered', name: 'main' }"
        text="Retake"
        (clickEvent)="retake()"
        [isAddIcon]="true"
        [icon]="faRotate"
        width="120px"
      />
      <app-common-button-v35
        [type]="{ style: 'filled', name: 'main' }"
        text="Use Photo"
        (clickEvent)="confirmCapture()"
        [isAddIcon]="true"
        [icon]="faCheck"
        width="140px"
      />
    }
  </div>
</div>
