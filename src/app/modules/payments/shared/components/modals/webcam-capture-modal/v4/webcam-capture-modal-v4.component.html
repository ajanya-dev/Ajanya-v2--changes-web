<div class="">
  <!-- modal header -->
  <div class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color">
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        {{ dialogData.title }}
      </h1>
    </div>
    <div  class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center" (click)="closeModal()">
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color">
        <!-- Error Message -->
        @if (error) {
          <div class="bg-v4-badge-error-bg-color text-v4-common-red-color px-4 py-3 rounded-lg text-sm font-funnel">
            {{ error }}
          </div>
        }
    
        <!-- Video / Captured Image Container -->
        <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden border border-v4-border-color">
          @if (!isCapturing) {
            <video
              #videoElement
              autoplay
              playsinline
              muted
              class="w-full h-full object-cover"
            ></video>
            <!-- Switch Camera Button -->
            <button aria-label="Switch Camera"
              class="absolute top-2 right-2 w-9 h-9 rounded-lg bg-v4-secondary-background-color/80 flex justify-center items-center cursor-pointer hover:bg-v4-secondary-background-color"
              (click)="switchCamera()"
              matTooltip="Switch Camera"
            >
              <lucide-icon [img]="RotateCcwIcon" class="text-v4-main-text-color" [size]="16" />
            </button>
          } @else {
            <img
              [src]="capturedImage"
              alt="Captured Image"
              class="w-full h-full object-cover"
            />
          }
        </div>
    
        <!-- Hidden Canvas for Capture -->
        <canvas #canvasElement class="hidden"></canvas>
    
  </div>
  <!-- modal body end -->

  <div class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color">
    @if (!isCapturing) {
      <app-common-button-v4
        [type]="{ style: 'primary', name: 'main' }"
        text="Capture"
        (clickEvent)="captureImage()"
        [isAddIcon]="true"
        [lucideIcon]="'camera'"
        [lucideIconSize]="16"
        width="140px"
        [disabled]="!!error"
      />
    } @else {
      <app-common-button-v4
        [type]="{ style: 'outline', name: 'main' }"
        text="Retake"
        (clickEvent)="retake()"
        [isAddIcon]="true"
        [lucideIcon]="'rotate-ccw'"
        [lucideIconSize]="16"
        width="120px"
      />
      <app-common-button-v4
        [type]="{ style: 'primary', name: 'main' }"
        text="Use Photo"
        (clickEvent)="confirmCapture()"
        [isAddIcon]="true"
        [lucideIcon]="'check'"
        [lucideIconSize]="16"
        width="140px"
      />
    }
  </div>
</div>
