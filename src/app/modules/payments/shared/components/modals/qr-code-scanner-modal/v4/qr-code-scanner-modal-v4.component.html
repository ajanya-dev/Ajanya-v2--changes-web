<div class="">
  <!-- modal header -->
  <div class="flex justify-between items-center px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color">
    <h1 class="text-base font-semibold text-v4-main-text-color font-funnel">QR Code</h1>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" [size]="18" />
    </div>
  </div>

  <!-- modal body -->
  <div class="p-6 bg-v4-tertiary-background-color flex flex-col items-center gap-4">
    <div class="rounded-xl overflow-hidden border border-v4-border-color w-[300px] h-[300px] bg-v4-secondary-background-color flex items-center justify-center">
      <img [src]="qrCodeLink" alt="QR Code" width="300" height="300" class="block" />
    </div>
    <p class="text-sm font-medium text-v4-main-text-color text-center">
      Scan this QR code to get link
    </p>
    @if (dialogData.address) {
      <div class="max-w-[280px] text-center break-words">
        <p class="text-sm text-v4-subtle-text-color">{{ dialogData.address }}</p>
      </div>
    }
  </div>

  <!-- modal footer -->
  <div class="flex justify-end px-6 py-4 bg-v4-secondary-background-color border-t border-v4-border-color">
    <app-common-button-v4
      width="100px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Close"
      (clickEvent)="closeModal()"
    />
  </div>
</div>
