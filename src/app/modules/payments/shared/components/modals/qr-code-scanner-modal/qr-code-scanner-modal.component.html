<div class="flex flex-col items-center font-inter text-sm font-medium">
  <img [src]="qrCodeLink" alt="QR Code" />
  <p class="text-center">Scan this QR code to get link</p>
  @if(dialogData.address){
    <div class="mt-4 max-w-[280px] text-center break-words">
      <p class="text-center">
        {{ dialogData.address }}
      </p>
    </div>
  }
  <button
    class="mt-12 h-9 w-28 rounded border border-solid border-input-border-color"
    (click)="closeModal()"
  >
    Close
  </button>
</div>
