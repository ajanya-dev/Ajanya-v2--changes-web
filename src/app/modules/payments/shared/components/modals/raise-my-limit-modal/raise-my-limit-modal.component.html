<div
  class="main-container p-[0.75rem] flex flex-col items-center justify-between h-full"
>
  <fa-icon
    [icon]="['fas', 'circle-info']"
    class="text-5xl text-common-dark-blue-color mt-3"
  ></fa-icon>
  <p class="text-center font-inter font-normal text-sm">
    To increase your card payment limit, you must add Business Details.
    Otherwise, we will determine the limit adjustment based on your card
    payments history.
  </p>
  <div class="buttons-div flex flex-col gap-3 w-full">
    <button class="add-btn ocw-btn" (click)="add()">
      Add My Business Details
    </button>
    <button class="close-btn" (click)="close()">Close</button>
  </div>
</div>
