<div class="mb-2 relative flex flex-col">
  <div>
    <div
      class="absolute top-2 text-main-text-color !text-sm font font-inter font-semibold"
    >
      Payee Summary
    </div>
    <div class="close_btn w-full flex justify-end" [mat-dialog-close]="false">
      <div class="cursor-pointer p-1"><fa-icon [icon]="faClose"></fa-icon></div>
    </div>
  </div>
  
  <div class="transaction-table overflow-hidden">
    <app-v3-data-table
      domLayout="normal"
      [columnDefs]="columnDefs"
      [tableId]="tableId"
      [frameworkComponents]="frameworkComponents"
      [showActionButtonContainer]="false"
      tableHeight="650px"
      [adjustHeightCondition]="true"
    >
    </app-v3-data-table>
  </div>
  <div class="flex justify-end p-2">
    <app-common-button-v35
        [type]="{style: 'filled', name:'main'}"
        text="Done"
        [mat-dialog-close]="false"
    ></app-common-button-v35>
  </div>
</div>
