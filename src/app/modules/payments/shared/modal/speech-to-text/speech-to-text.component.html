<div class="px-[6px] pb-[6px]">
  <!-- modal header -->
  <div class="flex justify-between pb-6">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
        <!-- back button ends -->
        <span class="pl-1 font-roboto font-semibold text-base pb-0.5">
          Voice Recognition
        </span>
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      ></fa-icon>
    </div>
  </div>
  <!-- modal body start -->
  <div>
    @if (!hasResult()) {
      <!-- listening section starts -->
      <div class="flex flex-col items-center justify-center">
        <div class="w-full h-full bg-main-background-color rounded-md p-6">
          <div class="flex flex-col items-center justify-center space-y-4">
            <div
              class="w-16 h-16 bg-common-secondary-violet-color rounded-full flex items-center justify-center"
            >
              @if (isProcessing()) {
                <div
                  class="w-8 h-8 border-2 border-common-violet-color border-t-transparent rounded-full animate-spin"
                ></div>
              } @else {
                <button
                  class="w-12 h-12 flex items-center justify-center rounded-full cursor-pointer"
                  (click)="isListening() ? stopListening() : startListening()"
                >
                  <fa-icon
                    class="text-common-violet-color cursor-pointer"
                    [icon]="isListening() ? faStop : faMicrophone"
                  ></fa-icon>
                </button>
              }
            </div>
            <div class="w-full flex flex-col items-center justify-center space-y-3">
              <span
                class="font-roboto font-medium text-base text-center text-secondary-text-color"
                >{{ listeningText() }}</span
              >
              <!-- Animated listening bars -->
              @if (isListening()) {
                <div class="listening-bars">
                  <div class="bar"></div>
                  <div class="bar"></div>
                  <div class="bar"></div>
                  <div class="bar"></div>
                  <div class="bar"></div>
                  <div class="bar"></div>
                  <div class="bar"></div>
                </div>
              }
            </div>
          </div>
        </div>
      </div>
    }

    <!-- listening section ends -->

    @if (hasResult()) {
      <!-- result scenario start -->
      <div class="flex flex-col items-center justify-center">
        <div
          class="w-full h-full bg-secondary-background-color p-6  rounded-md resize-none"
        >
          <div class="flex flex-col space-y-4">
            <div class="flex items-center justify-between">
              <span
                class="text-secondary-text-color font-roboto font-medium text-base"
                >Recognized Text</span
              >
              @if (isResultTextDisabled()) {
                <button
                  class="text-common-blue-color hover:text-common-secondary-blue-color bg-common-secondary-blue-color border border-common-secondary-blue-color px-2 py-1 transition-colors flex items-center gap-2 cursor-pointer rounded-full"
                  (click)="enableTextEditing()"
                >
                  <fa-icon [icon]="faEdit" class="text-sm"></fa-icon>
                  <span class="text-common-blue-color font-roboto font-medium text-sm">Edit</span>
                </button>
              }
            </div>
            <textarea
              class="w-full h-32 p-3"
              [value]="resultText()"
              [disabled]="isResultTextDisabled()"
              (input)="onResultTextChange($event)"
              placeholder="Your recognized text will appear here..."
            >
            </textarea>
          </div>
        </div>
      </div>
    }
    <!-- result scenario ends -->
  </div>
  <!-- modal body end -->
  <div class="flex justify-end gap-3 pt-8">
    @if (hasResult()) {
      <app-common-button-v35
        [type]="{ style: 'bordered', name: 'main' }"
        text="Try Again"
        (click)="tryAgain()"
      >
      </app-common-button-v35>
      <app-common-button-v35
        [type]="{ style: 'filled', name: 'main' }"
        text="Apply"
        [loading]="loading()"
        (clickEvent)="apply()"
      >
      </app-common-button-v35>
    }
  </div>
</div>
