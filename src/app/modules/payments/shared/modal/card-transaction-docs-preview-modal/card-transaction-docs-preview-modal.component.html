<div class="px-[6px] max-h-screen overflow-auto">
  <!-- modal header -->
  <div class="flex justify-between pb-6">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
        <span class="pl-1 font-inter font-semibold text-base pb-0.5">
          Transaction Documents Preview</span
        >
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      ></fa-icon>
    </div>
  </div>
  <!-- modal body start -->
  <div>
    @if (isLoading) {
      <div class="flex flex-col items-center justify-center w-full h-full min-h-[360px]">
        <!-- Skeleton loader instead of spinner -->
        <div class="w-full max-w-[600px] mx-auto">
          <!-- Document header skeleton -->
          <div class="h-8 bg-[#E5E7EB] rounded-md w-3/4 mb-4 animate-pulse"></div>
          
          <!-- Document content skeleton -->
          <div class="space-y-3">
            <div class="h-4 bg-[#E5E7EB] rounded-md w-full animate-pulse"></div>
            <div class="h-4 bg-[#E5E7EB] rounded-md w-11/12 animate-pulse"></div>
            <div class="h-4 bg-[#E5E7EB] rounded-md w-4/5 animate-pulse"></div>
            <div class="h-4 bg-[#E5E7EB] rounded-md w-full animate-pulse"></div>
            <div class="h-4 bg-[#E5E7EB] rounded-md w-3/4 animate-pulse"></div>
          </div>
          
          <!-- Document signature area skeleton -->
          <div class="mt-8 border-t pt-4 border-input-border-color">
            <div class="h-6 bg-[#E5E7EB] rounded-md w-1/2 mb-3 animate-pulse"></div>
            <div class="h-10 bg-[#E5E7EB] rounded-md w-1/3 animate-pulse"></div>
          </div>
        </div>
      </div>
    }

    <!-- Error message -->
    @if (!isLoading && hasError) {
      <div class="flex items-center justify-center w-full h-full">
        <p class="text-base text-common-red-color text-center">
          Failed to load document preview. Please try again later.
        </p>
      </div>
    }

    <!-- Document preview -->
    @if (!isLoading && !hasError && documentSafeUrl) {
      <div class="w-full h-full min-h-[500px]">
        <iframe
          [src]="documentSafeUrl"
          class="w-full h-[70vh] min-h-[300px] max-h-[80vh]"
          sandbox="allow-same-origin allow-scripts"
        ></iframe>

        <!-- Agreement checkbox section -->
        <div class="mt-4 flex items-center">
          <input
            type="checkbox"
            id="agreeTerms"
            class="mr-2 h-4 w-4 cursor-pointer"
            [(ngModel)]="isAgreed"
          />
          <label
            for="agreeTerms"
            class="text-sm text-main-text-color font-inter font-normal cursor-pointer italic"
            >I agree to the terms outlined in the displayed transaction and dispute documents. </label
          >
        </div>
      </div>
    }
  </div>
  <!-- modal body end -->
  <div class="flex justify-end gap-3 pt-8">
    <app-common-button-v35
      [mat-dialog-close]="false"
      width="125px"
      [type]="{ style: 'bordered', name: 'main' }"
      text="Cancel"
    ></app-common-button-v35>
    <app-common-button-v35
      [ngClass]="{ 'opacity-50': !isAgreed }"
      [mat-dialog-close]="true"
      width="125px"
      [type]="{ style: 'modal', name: 'main' }"
      [disabled]="!isAgreed"
      [mat-dialog-close]="true"
      text="Submit"
    ></app-common-button-v35>
  </div>
</div>
