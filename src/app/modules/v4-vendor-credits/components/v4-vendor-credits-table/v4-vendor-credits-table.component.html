<div class="flex flex-col w-full h-full overflow-auto">
  <div class="data-table-wrapper flex-1 rounded">
    <app-v4-data-table
      class="overflow-auto"
      [showActionButtonContainer]="false"
      [deselectedColumns]="deselectedColumns"
      [headerElements]="headerElements()"
      [columnDefs]="columnDefs"
      [defaultColumnFields]="defaultColumnFields"
      [tableId]="tableId"
      [fieldsShownByDefault]="fieldsShownByDefault"
      [useCustomEmptyState]="true"
      [emptyStateConfig]="{
        icon: 'wallet',
        title: 'No vendor credits yet',
        description: 'Record your first vendor credit to apply against future bills',
        buttonText: 'New Vendor Credit'
      }"
      (emptyStateActionClick)="onNew()"
      (cellRendererIdEvent)="cellRendererActionClick($event)"
      (cellRendererViewEvent)="cellRendererViewEvent($event)"
      [frameworkComponents]="frameworkComponents"
      (headerButtonEvent)="headerButtonClick($event)"
      (rowSelected)="onRowSelected($event)"
      (tableExportEvent)="onExportData($event)"
    >
    </app-v4-data-table>
  </div>
</div>

@if (stateService.selectedCreditId()) {
  <app-v4-vendor-credits-detail-panel
    [creditId]="stateService.selectedCreditId()"
    [isOpen]="stateService.isDetailPanelOpen()"
    (closed)="stateService.closeDetail()"
    (creditUpdated)="refreshDataTable()"
  />
}
