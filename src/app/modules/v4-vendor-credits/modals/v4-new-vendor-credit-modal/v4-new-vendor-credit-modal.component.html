<div class="v4-modal-container">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        {{ data?.mode === "edit" ? "Edit Vendor Credit" : "New Vendor Credit" }}
      </h1>
    </div>
    <button
      type="button"
      (click)="dailogRef.close(false)"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center border-0 bg-transparent p-0"
      aria-label="Close"
    >
      <lucide-icon name="x" [size]="18" class="text-v4-subtle-text-color" />
    </button>
  </div>

  <!-- Body -->
  <div
    class="p-6 overflow-y-auto max-h-[calc(90vh-140px)] bg-v4-tertiary-background-color"
  >
    <!-- Credit For Toggle -->
    <app-common-tab-v4
      [tabs]="creditTabs"
      [(activeTab)]="creditType"
      [variant]="'toggle'"
      (tabChange)="onCreditTypeChange($event)"
    />

    <form
      [formGroup]="vendorForm"
      (ngSubmit)="save()"
      class="flex flex-col gap-6 mt-6"
    >
      <!-- Bill (conditional) -->
      @if (isBill()) {
        <div>
          <span
            class="block text-sm font-medium text-v4-main-text-color mb-1.5"
          >
            Bill <span class="text-v4-common-red-color">*</span>
          </span>
          <app-v4-common-dropdown
            [config]="{ placeholder: 'Select Bill', displayField: 'invNo', outputField: 'billId' }"
            [listData]="bills"
            [loading]="loadingBills()"
            [clearable]="true"
            [searchable]="true"
            [appendTo]="'body'"
            formControlName="bill"
            (scrollToEnd)="onScrollToEnd()"
            (searchEvent)="onSearchTerm($event)"
          />
          <app-control-message-v4
            [control]="vendorForm.controls.bill"
            label="Bill"
            [customMessages]="{ required: 'Bill is required' }"
          />
        </div>
      }

      <!-- Payee (conditional) -->
      @if (!isBill()) {
        <div>
          <span
            class="block text-sm font-medium text-v4-main-text-color mb-1.5"
          >
            Payee <span class="text-v4-common-red-color">*</span>
          </span>
          <app-payee-dropdown-v4
            appendTo="body"
            [enableAddNew]="false"
            (ready)="onPayeeReady($event)"
            (changeEvent)="onPayeeChange($event)"
            (clearEvent)="onPayeeChange(null)"
          />
          <app-control-message-v4
            [control]="vendorForm.controls.payee"
            label="Payee"
            [customMessages]="{ required: 'Payee is required' }"
          />
        </div>
      }

      <!-- Bank Account -->
      <div>
        <span class="block text-sm font-medium text-v4-main-text-color mb-1.5"
          >Bank Account</span
        >
        <app-bank-ac-dropdown-v4
          appendTo="body"
          (ready)="onBankReady($event)"
          (changeEvent)="onBankAccountChange($event)"
        />
      </div>

      <!-- Credit Number & Amount (2-col) -->
      <div class="grid grid-cols-2 gap-4">
        <app-common-input-v4
          fieldLabel="Credit No"
          placeholder="Enter credit number"
          [maxLength]="50"
          [control]="vendorForm.controls.creditNo"
          [errorLabel]="'Credit No is required'"
          formControlName="creditNo"
        />
        <app-common-amount-input-v4
          fieldLabel="Amount"
          formControlName="amount"
          [control]="vendorForm.controls.amount"
          [errorLabel]="'Amount is required'"
        />
      </div>

      <!-- Credit Date & Account Number (2-col) -->
      <div class="grid grid-cols-2 gap-4">
        <app-v4-date-picker
          fieldLabel="Credit Date"
          placeholder="Credit Date"
          [control]="vendorForm.controls.creditDate"
          [errorLabel]="'Credit Date is required'"
          formControlName="creditDate"
        />
        <app-common-input-v4
          fieldLabel="Account Number"
          placeholder="Enter account number"
          [isFieldRequired]="false"
          [maxLength]="20"
          formControlName="accNo"
        />
      </div>

      <!-- Category & Memo (2-col) -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <span class="block text-xs font-medium mb-1.5 text-v4-secondary-text-color"
            >Category</span
          >
          <app-category-dropdown-v4
            appendTo="body"
            dropdownPosition="top"
            [selectedId]="editCategoryId()"
            (selectionEvent)="changeCat($event)"
          />
        </div>
        <app-common-input-v4
          fieldLabel="Memo"
          placeholder="Add a memo (optional)"
          [isFieldRequired]="false"
          [maxLength]="150"
          formControlName="memo"
        />
      </div>
    </form>
  </div>

  <!-- Footer -->
  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
      (clickEvent)="dailogRef.close(false)"
      width="120px"
    />
    <app-common-button-v4
      [type]="{ style: 'primary', name: 'main' }"
      [text]="data?.mode === 'edit' ? 'Update' : 'Add '"
      [loading]="submitting"
      (clickEvent)="save()"
      width="120px"
    />
  </div>
</div>
