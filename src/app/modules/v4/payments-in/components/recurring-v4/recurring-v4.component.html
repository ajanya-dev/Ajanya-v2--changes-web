<div class="w-full mt-3">
  <app-common-tab-v4
    class="mb-1 flex min-h-[28px] items-center"
    [tabs]="recurringTabs"
    [activeTab]="activeTabValue"
    (tabChange)="onTabChange($event)"
    variant="pill"
  />

  <!-- Content -->
  <div class="w-full pb-4 overflow-hidden">
    @if (activeFilterIndex === 0) {
      <app-gpbf-recurring-v4 />
    }
    @if (activeFilterIndex === 1) {
      <app-ach-recurring-v4 />
    }
    @if (activeFilterIndex === 2) {
      <app-request-ach-payments-v4 />
    }
  </div>
</div>
