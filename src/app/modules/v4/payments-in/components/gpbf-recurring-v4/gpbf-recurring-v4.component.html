<app-v4-data-table
  [columnDefs]="columnDefs"
  [tableId]="tableId"
  [headerElements]="headerElements()"
  [frameworkComponents]="frameworkComponents"
  (headerButtonEvent)="headerButtonNavigation($event)"
  (cellRendererViewEvent)="getViewAction($event)"
  (cellRendererIdEvent)="getActionComp($event)"
  [exportConfig]="exportConfig"
  [defaultColumnFields]="columnFields"
  [additionalPayload]="postData"
  (emptyStateActionClick)="onEmptyStateAction()"
  [useCustomEmptyState]="true"
  [emptyStateConfig]="{
    icon: 'repeat',
    title: 'No recurring form payments yet',
    description: 'Payments you receive from customers will appear here.',
    buttonText: 'Request Payment',
  }"
/>

@if (panelSelectedRow()) {
  <app-gpbf-recurring-detail-panel-v4
    [checkId]="panelSelectedRow()?.check_id ?? ''"
    [row]="panelSelectedRow()"
    [isOpen]="isPanelOpen()"
    (closed)="closePanelAndReset()"
    (actionButtonClicked)="onPanelAction($event)"
  />
}
