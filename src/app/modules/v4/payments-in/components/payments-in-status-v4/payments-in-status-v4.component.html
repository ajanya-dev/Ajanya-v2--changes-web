<div
  class="flex items-center justify-start w-full gap-1"
  (mouseenter)="showFilterIcon = true"
  (mouseleave)="showFilterIcon = false"
>
  <div class="flex items-center gap-2">
    <span
      class="status-badge"
      [style.background-color]="badgeBg"
      [style.color]="badgeTextColor"
      [matTooltip]="statusName?.statusFullDescription ?? ''"
    >
      {{ statusLabel }}
    </span>

    @if (statusIcon()?.attachment === 1) {
      <div class="dt-cell-edit-btn">
        <lucide-angular
          name="paperclip"
          [size]="16"
          matTooltip="View Attachments"
          (click)="addAttachment($event)"
        />
      </div>
    }

    @if (statusIcon()?.comment === 1) {
      <div class="dt-cell-edit-btn">
        <lucide-angular
          name="message-square"
          [size]="16"
          matTooltip="View Comments"
          (click)="addComment($event)"
        />
      </div>
    }
  </div>

  @if (showFilterIcon) {
    <app-common-filter-icon (filterEvent)="onFilterClicked()" />
  }
</div>
