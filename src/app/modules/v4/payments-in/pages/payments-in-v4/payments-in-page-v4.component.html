<!-- Removed min-h-[calc(100vh-10vh)]: taller than the v4 page area, it forced a page scroll. -->
<div class="flex flex-col h-full w-full">
  <div class="flex flex-col h-full w-full rounded">
    <app-payments-in-header-v4 />
    <app-common-tab-v4
      class="block mt-5 mb-1 border-b border-v4-border-color"
      [tabs]="mainTabs"
      [activeTab]="activeMainTab()"
      (tabChange)="onMainTabChange($event)"
      variant="underline"
      size="xs"
      [borderNone]="true"
    />
    <div class="flex flex-1 flex-col min-h-0">
      <router-outlet />
    </div>
  </div>
</div>
