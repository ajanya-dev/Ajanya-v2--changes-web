<div class="w-full mt-3">
  <app-common-tab-v4
    class="mb-1 flex min-h-[28px] items-center"
    [tabs]="epaymentTabs"
    [activeTab]="activeSubTab()"
    (tabChange)="onSubTabChange($event)"
    variant="pill"
  />

  @if (activeSubTab() === "all") {
    <app-v4-data-table
      [columnDefs]="columnDefs"
      [tableId]="tableId"
      [frameworkComponents]="frameworkComponents"
      [defaultColumnFields]="columnFields"
      [backButtonEnabled]="false"
      (emptyStateActionClick)="onEmptyStateAction()"
      [useCustomEmptyState]="true"
      [emptyStateConfig]="{
        icon: 'credit-card',
        title: 'No ePayments yet',
        description: 'Payments you receive from customers will appear here.',
        buttonText: 'Request Payment',
      }"
    />
  } @else {
    <app-epayments-recurring-v4 />
  }
</div>
