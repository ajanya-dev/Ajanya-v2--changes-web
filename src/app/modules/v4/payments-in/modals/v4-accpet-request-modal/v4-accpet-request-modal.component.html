<div>
  <!-- Close Button -->
  <div class="flex justify-end px-4 pt-4">
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- Success Icon -->
  <div class="flex justify-center">
    <div
      class="success-icon-wrapper w-16 h-16 rounded-full border-4 border-v4-common-green-color flex items-center justify-center"
    >
      <lucide-icon
        [img]="CircleCheckBigIcon"
        [size]="36"
        class="text-v4-common-green-color"
      />
    </div>
  </div>

  <!-- Title -->
  <div class="text-center py-5 px-6">
    <h2 class="font-peridot text-v4-common-green-color font-semibold text-base">
      {{ title }}
    </h2>
  </div>

  <!-- Options -->
  <div class="px-6 pb-6 flex flex-col gap-4">
    @for (item of optionList; track item.id; let i = $index) {
      <div class="flex justify-between items-center gap-4">
        <span class="font-peridot text-v4-main-text-color text-sm">
          {{ i + 1 }}. {{ item.title }}
        </span>
        <app-common-button-v4
          [type]="item.btnType"
          [text]="item.name"
          (clickEvent)="onClick(item.id)"
          [lucideIcon]="item.icon"
          [backGroundInput]="item.bgColor"
          [textColorInput]="item.textColor"
          width="120px"
        />
      </div>
    }
  </div>
</div>
