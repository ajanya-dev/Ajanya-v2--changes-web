<form
  [formGroup]="dynamicForm"
  class="main-container p-3"
  *ngIf="
    getFormControl()['controls'].length !== 0 &&
    v3BulkPaymentService.isCheckPrintProcessing
  "
>
  <div class="payment-type-tab">
    <h2>Check Print</h2>
  </div>
  <div
    class="bulk-payment-container"
    [ngClass]="{
      'pointer-events-none':
        v3BulkPaymentService?.getIsBulkPaymentProcessing() | async
    }"
    formArrayName="checkPrintFormArray"
  >
    <table class="check-email-table">
      <thead>
        <tr>
          <th class="w-12">
            <h2></h2>
          </th>
          <th>
            <h2>Payee</h2>
          </th>
          <th>
            <h2>Amount</h2>
          </th>
          <th>
            <h2>Memo</h2>
          </th>
          <th>
            <h2>Invoice No</h2>
          </th>
          <th>
            <h2>Check Paper Type</h2>
          </th>
        </tr>
      </thead>
      <tbody>
        <ng-container
          class="bulk-payment-item"
          *ngFor="let data of getFormControl()['controls']; let i = index"
          [formGroupName]="i"
        >
          <tr>
            <td>
              <i
                class="fa-sharp fa-solid fa-building-columns bank-icon"
                [matTooltip]="data?.value?.source?.bankName"
              ></i>
            </td>
            <td>
              <input
                class="disabled-field w-full truncate"
                formControlName="payee"
                title="Payee name"
                type="text"
                [readonly]="true"
              />
            </td>
            <td>
              <input
                class="disabled-field"
                formControlName="amount"
                title="Amount"
                type="text"
                [readonly]="true"
              />
            </td>
            <td>
              <input
                class="disabled-field"
                formControlName="memo"
                title="Memo"
                type="text"
                [readonly]="true"
              />
            </td>
            <td>
              <input
                class="disabled-field"
                formControlName="invoiceNo"
                title="Invoice No"
                type="text"
                [readonly]="true"
              />
            </td>
            <td>
              <div class="dropdown">
                <ng-select
                  class="w-full"
                  [clearable]="false"
                  formControlName="paperType"
                  title="Check Paper"
                  name="check-paper-type"
                  id="check-paper-type"
                >
                  <ng-option value="4"> Print-Check Paper </ng-option>
                  <ng-option value="6"> Print-White Paper </ng-option>
                </ng-select>
              </div>
            </td>
          </tr>
        </ng-container>
      </tbody>
    </table>
  </div>
</form>
