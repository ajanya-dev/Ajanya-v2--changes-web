<form
  [formGroup]="dynamicForm"
  class="main-container p-3"
  *ngIf="getFormControl()['controls'].length !== 0"
>
  <div class="payment-type-tab">
    <h2>Check Email</h2>
  </div>
  <div
    class="bulk-payment-container"
    [ngClass]="{
      'pointer-events-none':
        v3BulkPaymentService?.getIsBulkPaymentProcessing() | async
    }"
    formArrayName="walletCheckEmailFormArray"
  >
    <table class="check-email-table">
      <thead>
        <tr>
          <th class="w-12"></th>
          <th>
            <h2>Payee</h2>
          </th>
          <th>
            <h2>Email</h2>
          </th>
          <th>
            <h2>Amount</h2>
          </th>
          <th>
            <h2>Memo</h2>
          </th>
          <th>
            <h2>Invoice No</h2>
          </th>
        </tr>
      </thead>
      <tbody>
        @for (data of getFormControl().controls; track data; let i = $index) {
          <tr [formGroupName]="i">
            <td>
              <fa-icon
                class="wallet-icon"
                [icon]="faWallet"
                matTooltip="Wallet"
              ></fa-icon>
            </td>
            <td>
              <input
                class="disabled-field w-full truncate"
                formControlName="payee"
                title="Payee name"
                type="text"
                [readonly]="true"
              />
            </td>
            <td>
              <div class="flex">
                <input
                  class="email-input"
                  [ngClass]="{
                    invalid:
                      data?.get('email')?.invalid && data?.get('email')?.touched
                  }"
                  formControlName="email"
                  placeholder="Email Address"
                  title="Payee email"
                  type="text"
                />
              </div>
            </td>
            <td>
              <input
                class="disabled-field"
                formControlName="amount"
                title="Amount"
                type="text"
                [readonly]="true"
              />
            </td>
            <td>
              <input
                class="disabled-field"
                formControlName="memo"
                title="Memo"
                type="text"
                [readonly]="true"
              />
            </td>
            <td>
              <input
                class="disabled-field"
                formControlName="invoiceNo"
                title="Invoice No"
                type="text"
                [readonly]="true"
              />
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</form>
