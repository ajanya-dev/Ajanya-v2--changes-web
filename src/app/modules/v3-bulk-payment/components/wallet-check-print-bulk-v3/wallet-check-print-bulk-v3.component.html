<form
  [formGroup]="dynamicForm"
  class="main-container p-3"
  *ngIf="getFormControl()['controls'].length !== 0"
>
  <div class="payment-type-tab">
    <h2>Wallet Print</h2>
  </div>
  <div
    class="bulk-payment-container"
    [ngClass]="{
      'pointer-events-none':
        v3BulkPaymentService?.getIsBulkPaymentProcessing() | async
    }"
    formArrayName="walletCheckPrintFormArray"
  >
    <div class="paper-type-dropdown-container">
      <div class="dropdown paper-type-dropdown">
        <ng-select
          class="w-full"
          [clearable]="false"
          [(ngModel)]="selectedPaperType"
          [ngModelOptions]="{ standalone: true }"
          (change)="onPaperTypeChange()"
          title="Check Paper Type"
          name="wallet-check-paper-type"
          id="wallet-check-paper-type"
        >
          <ng-option value="1">Print-Check Paper</ng-option>
          <ng-option value="6">Print-White Paper</ng-option>
        </ng-select>
      </div>
    </div>
    <table class="check-email-table">
      <thead>
        <tr>
          <th class="w-12">
            <h2></h2>
          </th>
          <th>
            <h2>Payee</h2>
          </th>
          <th>
            <h2>Amount</h2>
          </th>
          <th>
            <h2>Memo</h2>
          </th>
          <th>
            <h2>Invoice No</h2>
          </th>
        </tr>
      </thead>
      <tbody>
        <ng-container
          class="bulk-payment-item"
          *ngFor="let data of getFormControl()['controls']; let i = index"
          [formGroupName]="i"
        >
          <tr>
            <td>
              <fa-icon
                class="wallet-icon"
                [icon]="faWallet"
                matTooltip="Wallet"
              ></fa-icon>
            </td>
            <td>
              <input
                class="disabled-field w-full truncate"
                formControlName="payee"
                title="Payee name"
                type="text"
                [readonly]="true"
              />
            </td>
            <td>
              <input
                class="disabled-field"
                formControlName="amount"
                title="Amount"
                type="text"
                [readonly]="true"
              />
            </td>
            <td>
              <input
                class="disabled-field"
                formControlName="memo"
                title="Memo"
                type="text"
                [readonly]="true"
              />
            </td>
            <td>
              <input
                class="disabled-field"
                formControlName="invoiceNo"
                title="Invoice No"
                type="text"
                [readonly]="true"
              />
            </td>
          </tr>
        </ng-container>
      </tbody>
    </table>
  </div>
</form>
