<div class="getting-started-container">
  <div class="back-button-wrapper" *ngIf="slide > 1">
    <i class="fa-solid fa-arrow-left" (click)="slide = slide - 1"></i>
  </div>
  <div
    class="slide-container flex flex-col py-4 justify-between items-center"
    [formGroup]="bussinessDetailsForm"
  >
    <div class="slider-progress flex justify-center">
      <div class="slider-bar slider-bar-completed"></div>
      <div
        class="slider-bar"
        [ngClass]="slide > 1 ? 'slider-bar-completed' : ''"
      ></div>
    </div>
    <div
      class="slide form-slide fade-in flex flex-col items-center"
      *ngIf="slide == 1"
    >
      <div class="upper-container flex justify-between items-end w-full">
        <div class="grow pl-1">
          <div class="hello">Hello,</div>
          <div class="name">
            {{ this.bussinessDetailsForm.value.companyName }}
          </div>
          <div class="detail mb-2">
            <div>Share some data about your business,</div>
            <div>This will help us to find the best tool for you</div>
          </div>
        </div>
        <div>
          <img
            class="doodle-image-form-slide"
            src="../../../../assets/images/getting_started/onboarding-doodle6.svg"
            alt=""
          />
        </div>
      </div>
      <div class="lower-container flex w-full h-full">
        <div class="grow pl-1">
          <div class="logo-image-container">
            <input
              class="hidden"
              (input)="onUploadLogo($event)"
              #Fileinput
              type="file"
              accept="image/png, image/gif, image/jpeg"
            />
            <div
              class="logo-image-add flex flex-col"
              [ngClass]="
                imageUrl
                  ? 'justify-between items-end logo-image-add-added'
                  : 'justify-center items-center'
              "
              (click)="Fileinput.click()"
            >
              <div class="logo-image-wrapper" *ngIf="imageUrl">
                <img [src]="imageUrl" alt="" />
              </div>

              <i class="fa-thin fa-plus"></i>
            </div>
            <div class="add-logo-label mt-3" *ngIf="imageUrl">
              Change your Logo
            </div>
            <div class="add-logo-label mt-3" *ngIf="!imageUrl">
              Add your Logo
            </div>
          </div>
        </div>
        <div class="lower-right-container flex flex-col">
          <div
            class="form-container-div grid grid-cols-1 gap-4"
            formGroupName="slide3Fields"
          >
            <div>
              <select
                class="form-select input_style"
                #industry
                formControlName="entityType"
              >
                <option disabled value="">Entity Type</option>
                <option
                  *ngFor="let item of entityType"
                  value="{{ item.value }}"
                >
                  {{ item.name }}
                </option>
              </select>
              <app-control-message
                [control]="slide3Fields.controls.entityType"
              ></app-control-message>
            </div>
            <div>
              <div class="single_input date-sec no_modal_btn" id="disable_date">
                <input
                  type="date"
                  class="input_style"
                  formControlName="formationDate"
                  [max]="todayDate"
                  (blur)="checkDate()"
                />
                <label class="floating_label_field">Formation Date</label>
              </div>
              <app-control-message
                [control]="slide3Fields.controls.formationDate"
              ></app-control-message>
            </div>
            <div>
              <input
                type="text"
                mask="00-0000000"
                class="input_style"
                formControlName="ein"
                placeholder="EIN"
              />
              <app-control-message [control]="slide3Fields.controls.ein">
              </app-control-message>
            </div>
            <div>
              <input
                type="text"
                class="input_style"
                formControlName="dba"
                maxlength="15"
                placeholder="DBA"
                (input)="checkForPattern($event)"
              />
              <app-control-message [control]="slide3Fields.controls.dba">
              </app-control-message>
            </div>
          </div>
          <div class="buttons-container flex justify-center">
            <button
              class="skip-button mx-2"
              [disabled]="loading"
              (click)="onSkipClicked()"
            >
              <span
                *ngIf="loading && lastTriggeredButton === 'skip'"
                class="loadingSpinner"
              ></span
              >Skip
            </button>
            <button class="next-button mx-2" (click)="onSlide1NextClicked()">
              Next
            </button>
          </div>
        </div>
      </div>
    </div>
    <div
      class="slide form-slide fade-in flex flex-col items-center"
      *ngIf="slide == 2"
    >
      <div class="upper-container flex justify-between items-end w-full">
        <div class="grow pl-1">
          <div class="hello">Good,</div>
          <div class="name">You are almost done</div>
          <div class="detail mb-2">
            <div>Add your Business Address too</div>
          </div>
        </div>
        <div>
          <img
            class="doodle-image-form-slide-2"
            src="../../../../assets/images/getting_started/onboarding-doodle7.svg"
            alt=""
          />
        </div>
      </div>
      <div class="grow lower-container flex w-full">
        <div class="grow pl-1">
          <div class="logo-image-container">
            <input
              class="hidden"
              (input)="onUploadLogo($event)"
              #Fileinput
              type="file"
              accept="image/png, image/gif, image/jpeg"
            />
            <div
              class="logo-image-add flex flex-col"
              [ngClass]="
                imageUrl
                  ? 'justify-between items-end logo-image-add-added'
                  : 'justify-center items-center'
              "
              (click)="Fileinput.click()"
            >
              <div class="logo-image-wrapper" *ngIf="imageUrl">
                <img [src]="imageUrl" alt="" />
              </div>

              <i class="fa-thin fa-plus"></i>
            </div>
            <div class="add-logo-label mt-3" *ngIf="imageUrl">
              Change your Logo
            </div>
            <div class="add-logo-label mt-3" *ngIf="!imageUrl">
              Add your Logo
            </div>
          </div>
        </div>
        <div class="lower-right-container flex flex-col h-full">
          <div
            class="form-container-div grid grid-cols-2 gap-4"
            formGroupName="slide4Fields"
          >
            <div class="col-span-2">
              <input
                type="text"
                class="input_style"
                placeholder="Address Line1"
                #AddressSearch
                (focus)="loadGoogleAddress(AddressSearch)"
                formControlName="companyAddressLine_1"
              />
              <app-control-message
                [control]="slide4Fields.controls.companyAddressLine_1"
              >
              </app-control-message>
            </div>
            <div class="col-span-2">
              <input
                type="text"
                class="input_style col-span-2"
                placeholder="Address Line2"
                formControlName="companyAddressLine_2"
              />
            </div>
            <div>
              <input
                type="text"
                class="input_style"
                formControlName="companyCity"
                placeholder="City"
              />
              <app-control-message
                [control]="slide4Fields.controls.companyCity"
              ></app-control-message>
            </div>
            <div>
              <input
                type="text"
                class="input_style"
                formControlName="companyState"
                placeholder="State"
              />
              <app-control-message
                [control]="slide4Fields.controls.companyState"
              ></app-control-message>
            </div>
            <div>
              <input
                type="text"
                class="input_style"
                formControlName="companyZip"
                placeholder="Zip"
                maxlength="10"
              />
              <app-control-message
                [control]="slide4Fields.controls.companyZip"
              ></app-control-message>
            </div>
            <div>
              <input
                type="text"
                class="input_style"
                formControlName="companyCountry"
                placeholder="Country"
              />
              <app-control-message
                [control]="slide4Fields.controls.companyCountry"
              ></app-control-message>
            </div>
          </div>
          <div class="buttons-container flex justify-center">
            <button
              class="skip-button mx-2"
              type="button"
              (click)="onSkipClicked()"
            >
              <span
                *ngIf="loading && lastTriggeredButton === 'skip'"
                class="loadingSpinner"
              ></span
              >Skip
            </button>
            <button
              class="finish-button mx-2"
              type="button"
              (click)="onSaveClicked()"
            >
              <span
                *ngIf="loading && lastTriggeredButton === 'finish'"
                class="loadingSpinner"
              ></span
              >Finish
            </button>
          </div>
        </div>
      </div>
    </div>
    <div></div>
  </div>
</div>
