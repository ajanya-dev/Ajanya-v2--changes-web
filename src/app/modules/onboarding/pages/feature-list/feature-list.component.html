<div
  class="w-full h-full m-auto bg-main-background-color flex justify-center items-center"
>
  <div
    class="flex flex-col justify-between items-center h-full max-h-[765px] w-[550px] p-[10px]"
  >
    <div class="pb-4 text-main-text-color text-2xl font-inter font-medium">
      What features are you looking for?
    </div>
    <div
      class="overflow-auto my-4 grow flex flex-col gap-2 items-center w-full"
    >
      @if (isLoading()) {
        @for (_ of [].constructor(12); track $index) {
          <div
            class="skelton min-h-11 max-h-11 rounded-[5px] w-[95%] flex items-center px-2 font-inter font-medium text-sm mr-3 cursor-pointer hover:shadow-common-box-shadow"
          ></div>
        }
      } @else {
        @for (item of featureList(); track item; let i = $index) {
          <div
            role="presentation"
            class="parent_div min-h-11 max-h-11 rounded-[5px] w-[95%] flex items-center px-2 font-inter font-medium text-sm mr-3 cursor-pointer hover:shadow-common-box-shadow"
            (click)="toggleCheckbox(item, i)"
            [ngClass]="
              item.isChecked
                ? 'text-main-background-color bg-common-dark-blue-color'
                : 'text-main-text-color bg-main-background-color border border-input-border-color'
            "
          >
            <div
              role="presentation"
              class="mr-2 w-6 h-6 rounded-[5px] flex justify-center items-center border border-input-border-color checkbox-container cursor-pointer"
              (click)="$event.stopPropagation()"
            >
              <input
                #checkbox
                [attr.id]="item.id"
                (change)="check($event, i)"
                [checked]="item.isChecked"
                type="checkbox"
              />
              <label
                [attr.for]="item.id"
                class="flex items-center justify-center"
              >
                <i class="fa-solid fa-check check-icon"></i>
              </label>
            </div>
            <label
              [attr.for]="item.id"
              (click)="$event.stopPropagation()"
              role="presentation"
              class="cursor-pointer"
            >
              {{ item.name }}
            </label>
          </div>
        }
      }
    </div>

    <div class="w-full flex justify-end pt-2 mr-[34px]">
      @if (isLoading()) {
        <div class="skelton w-[125px] h-[38px] rounded-[5px]"></div>
        <div class="skelton w-[125px] h-[38px] rounded-[5px] ml-4"></div>
      } @else {
        <app-common-button-v35
          width="125px"
          [type]="{ style: 'bordered', name: 'main' }"
          text="Skip"
          (clickEvent)="goToVerificationPage()"
        />
        <app-common-button-v35
          width="125px"
          [type]="{ style: 'filled', name: 'main' }"
          text="Next"
          class="pl-4"
          (clickEvent)="submit()"
          [loading]="isSubmit()"
          [disabled]="isSubmit()"
        />
      }
    </div>
  </div>
</div>
