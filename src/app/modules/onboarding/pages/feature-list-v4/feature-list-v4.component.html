<div
  class="w-full h-full m-auto bg-v4-main-background-color flex justify-center items-center"
>
  <div
    class="flex flex-col justify-between items-center h-full max-h-[825px] w-[550px] p-[10px]"
  >
    <div class="pb-4 text-v4-main-text-color text-2xl font-semibold font-funnel">
      What features are you looking for?
    </div>
    <div
      class="overflow-auto my-4 grow flex flex-col gap-2 items-center w-full"
    >
      @if (isLoading()) {
        @for (_ of [].constructor(12); track $index) {
          <div
            class="skelton min-h-12 max-h-12 rounded-[8px] w-[95%] flex items-center px-3 text-sm mr-3 cursor-pointer"
          ></div>
        }
      } @else {
        @for (item of featureList(); track item; let i = $index) {
          <div
            [matTooltip]="item?.shortdescriptions"
            role="presentation"
            class="feature-list-item min-h-12 max-h-12 rounded-[8px] w-[95%] flex items-center gap-3 px-3 text-sm mr-3 cursor-pointer transition-colors bg-v4-secondary-background-color text-v4-main-text-color border border-v4-input-border-color"
            (click)="toggleCheckbox(item, i)"
          >
            <input
              #checkbox
              [attr.id]="'feature-v4-' + item.id"
              (change)="check($event, i)"
              [checked]="item.isChecked"
              (click)="$event.stopPropagation()"
              type="checkbox"
              class="v4-checkbox-md"
            />
            <label
              [attr.for]="'feature-v4-' + item.id"
              (click)="$event.stopPropagation()"
              role="presentation"
              class="cursor-pointer flex-1 font-medium"
            >
              {{ item.name }}
            </label>
          </div>
        }
      }
    </div>

    <div class="w-full flex justify-end gap-3 pt-2 mr-[34px]">
      @if (isLoading()) {
        <div class="skelton w-[125px] h-[44px] rounded-[10px]"></div>
        <div class="skelton w-[125px] h-[44px] rounded-[10px]"></div>
      } @else {
        <app-common-button-v4
          width="125px"
          [type]="{ style: 'outline', name: 'main' }"
          text="Skip"
          (clickEvent)="goToVerificationPage()"
        />
        <app-common-button-v4
          width="125px"
          [type]="{ style: 'primary', name: 'main' }"
          text="Next"
          (clickEvent)="submit()"
          [loading]="isSubmit()"
          [disabled]="isSubmit()"
        />
      }
    </div>
  </div>
</div>
