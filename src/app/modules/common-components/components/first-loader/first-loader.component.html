<div [ngClass]="env.env_id === 'staging' ? 'zil_main_wrapper' : 'loader_main_wrapper'">
  <div [ngClass]="env.env_id === 'staging' ? 'zil_page' : 'loader_page'">
    @if (env.env_id === 'staging') {
      <div class="logo-container zil-container">
        <div class="logo-outline zil-outline">
          <img [ngSrc]="mainLogoUrl()" width="284" height="150" alt="" />
        </div>
        <div class="logo-fill zil-fill">
          <img [ngSrc]="mainLogoUrl()" width="284" height="150" alt="" />
        </div>
      </div>
    } @else {
      <div class="loader-gray"></div>
      <div class="loader-color">
        <img [ngSrc]="mainLogoOldUrl()" width="284" height="150" alt="" />
      </div>
    }
  </div>

  <div class="zill_money__first_load">
    <p>Powered by</p>
    <div>
      <img [ngSrc]="brandLogoUrl()"
           alt="img" width="100" height="100" />
    </div>
  </div>
</div>
