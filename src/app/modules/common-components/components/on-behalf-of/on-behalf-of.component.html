<div class="behalf_of_section">
  <div class="on_behalf_of_label">
    <mat-checkbox class="example-margin" (change)="getCheckBoxChange($event)"
      >This transaction is on behalf of</mat-checkbox
    >
    <div class="icons" *ngIf="selectedItem">
      <i class="fa-light fa-pen" (click)="editOnBehalfOf()"></i>
      <i class="fa-solid fa-trash trash" (click)="deleteItem()"></i>
    </div>
  </div>
  <div style="display: flex" [ngClass]="{ disabled_input: !isBehalfOf }">
    <ng-select
      [(ngModel)]="selectedItem"
      [ngModelOptions]="{ standalone: true }"
      (change)="getChangeItem($event)"
      placeholder="Select Name"
      appendTo="ng-select"
    >
      <ng-option *ngFor="let item of data" [value]="item.id">{{
        item.text
      }}</ng-option>
    </ng-select>

    <div class="add_modal_btn" style="padding: 10px 10px" (click)="openModal()">
      <svg
        aria-hidden="true"
        focusable="false"
        data-prefix="far"
        data-icon="plus"
        class="svg-inline--fa fa-plus fa-w-12"
        role="img"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 384 512"
      >
        <path
          fill="currentColor"
          d="M368 224H224V80c0-8.84-7.16-16-16-16h-32c-8.84 0-16 7.16-16 16v144H16c-8.84 0-16 7.16-16 16v32c0 8.84 7.16 16 16 16h144v144c0 8.84 7.16 16 16 16h32c8.84 0 16-7.16 16-16V288h144c8.84 0 16-7.16 16-16v-32c0-8.84-7.16-16-16-16z"
        ></path>
      </svg>
    </div>
  </div>
</div>
