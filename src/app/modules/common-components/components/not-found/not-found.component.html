<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Dongle:wght@300&family=Open+Sans:ital,wght@0,300;1,300&family=Varela+Round&display=swap"
      rel="stylesheet"
    />

    <style></style>
  </head>

  <body>
    <div>
      <img
        [src]="appConfig?.websiteLogo || '../../../../assets/main/app_logo.svg'"
        class="logo"
        [alt]="appConfig?.websiteTitle"
        [title]="appConfig?.websiteTitle"
      />
    </div>

    <div>
      <img
        class="image404"
        src="../../../../assets/images/404.svg"
        alt="Not Found Image"
      />
    </div>

    <div>
      <p class="text">Page Not Found!</p>
    </div>
    <div>
      <p class="text2">
        We’re sorry, the page you requested could not be found.<br />
        Please go back to the home page.
      </p>
    </div>
    <div class="button_div">
      <div>
        <button class="contact_btn btn" (click)="openChat()">Contact Us</button>
      </div>
      <div>
        <button class="home_btn btn" (click)="goHome()">Go Home</button>
      </div>
    </div>
  </body>
</html>
