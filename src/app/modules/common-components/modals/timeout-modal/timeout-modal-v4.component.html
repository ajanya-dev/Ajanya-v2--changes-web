<div class="text-center font-funnel p-6">
  <div class="flex justify-center mb-4">
    <div
      class="w-16 h-16 rounded-full flex items-center justify-center"
      style="
        background-color: var(--v4-badge-error-bg-color);
        color: var(--v4-badge-error-text-color);
      "
    >
      <lucide-icon [img]="ClockIcon" [size]="32"></lucide-icon>
    </div>
  </div>

  <div class="text-center">
    <h2 class="text-lg font-semibold font-funnel text-v4-main-text-color mb-2">
      Session Timeout!
    </h2>
    <p class="text-sm font-peridot text-v4-tertiary-text-color max-w-[40ch] mx-auto">
      Your session is about to expire. You will be logged out in
      <span class="font-semibold text-v4-common-red-color">{{ timer }}</span>
    </p>
  </div>

  <div mat-dialog-actions class="flex gap-3 justify-center mt-5">
    <app-common-button-v4
      class="flex-1"
      [type]="{ style: 'outline', name: 'main' }"
      [text]="'Logout'"
      [width]="'100%'"
      (clickEvent)="close(false)"
    />
    <app-common-button-v4
      class="flex-1"
      [type]="{ style: 'primary', name: 'main' }"
      [text]="'Stay connected'"
      [width]="'100%'"
      (clickEvent)="close(true)"
    />
  </div>
</div>
