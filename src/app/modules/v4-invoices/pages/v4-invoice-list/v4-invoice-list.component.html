<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
  @for (card of cards(); track card.title) {
    <app-overview-cards-v4 [card]="card" [loading]="summaryLoading()" />
  }
</div>

<app-v4-data-table
  [defaultColumnFields]="columnFields"
  [tableId]="tableId"
  [fieldsShownByDefault]="fieldsShownByDefault"
  [headerElements]="headerElements()"
  [selectedPanelButton]="selectedpanel"
  [HeaderButtonLoadingProp]="HeaderButtonLoadingProp"
  [buttonForModal]="true"
  [exportConfig]="exportConfig"
  [frameworkComponents]="frameworkComponents"
  [useCustomEmptyState]="true"
  [emptyStateConfig]="{
    icon: 'file-text',
    title: 'No invoices yet',
    description: 'Create your first invoice to start billing customers',
    buttonText: 'New Invoice'
  }"
  (emptyStateActionClick)="addNewInvoice()"
  (headerButtonEvent)="headerButtonClick($event)"
  (cellRendererViewEvent)="cellRendererViewClick($event)"
  (tableExportEvent)="onExportData($event)"
  (rowSelected)="onRowSelected($event)"
  (cellRendererDangerEvent)="cellRendererDangerClick($event)"
/>

<app-v4-invoice-detail-panel
  [row]="selectedInvoiceRow()"
  [isOpen]="isPanelOpen()"
  [initialTab]="panelInitialTab()"
  (closed)="onInvoicePanelClosed()"
  (actionButtonClicked)="onInvoicePanelAction($event)"
/>
