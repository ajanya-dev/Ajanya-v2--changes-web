<div class="flex items-center gap-1 h-full">
  <button aria-label="Options"
    class="action-icon-btn"
    [matMenuTriggerFor]="menu"
    (click)="$event.stopPropagation()"
    matTooltip="Options"
  >
    <lucide-icon
      name="ellipsis-vertical"
      [size]="16"
      class="v4-action-icon"
    ></lucide-icon>
  </button>

  @if (showMapButton) {
    <button
      class="flex items-center gap-1 px-1 h-6 rounded-md hover:bg-v4-badge-warning-bg-color transition-colors duration-150 text-xs font-medium"
      style="color: var(--v4-badge-warning-text-color)"
      (click)="onMapClick(); $event.stopPropagation()"
      matTooltip="Bank Account Not Mapped"
    >
      <lucide-icon name="triangle-alert" [size]="16"></lucide-icon>
      <span>Map</span>
    </button>
  } @else {
    <button aria-label="View"
      class="action-icon-btn"
      (click)="onViewClick(); $event.stopPropagation()"
      matTooltip="View"
    >
      <lucide-icon name="eye" [size]="16" class="v4-action-icon"></lucide-icon>
    </button>
  }

  <mat-menu #menu="matMenu" class="v4-action-menu">
    @for (group of menuGroups; track group.title; let groupCount = $count) {
      @if (groupCount > 1) {
        <div class="v4-menu-group-label">{{ group.title }}</div>
      }
      @for (item of group.items; track item.label) {
        <button
          mat-menu-item
          [class.v4-menu-item-danger]="item.label === 'Delete'"
          (click)="onActionClick(item.label)"
        >
          <div class="v4-menu-item">
            <lucide-icon
              [name]="item.icon"
              [size]="16"
              class="text-[color:var(--v4-primary-brand-bold-color)]"
            ></lucide-icon>
            <span>{{ item.label }}</span>
          </div>
        </button>
      }
    }
  </mat-menu>
</div>
