<div class="flex flex-col gap-4">
  @if (isLoading()) {
    <!-- Section 1: Summary cards skeleton -->
    <div class="grid grid-cols-2 gap-2 md:grid-cols-3 md:gap-3 lg:grid-cols-5">
      @for (i of [1, 2, 3, 4, 5]; track i) {
        <div
          class="flex flex-col gap-2 rounded-lg border border-v4-border-color bg-v4-secondary-background-color p-5 shadow-sm"
        >
          <div class="shimmer h-3 w-24"></div>
          <div class="shimmer h-8 w-16"></div>
          <div class="shimmer h-4 w-28"></div>
        </div>
      }
    </div>

    <!-- Section 2: Charts row skeleton -->
    <div class="grid grid-cols-1 gap-6 xl:grid-cols-2">
      @for (i of [1, 2]; track i) {
        <div
          class="flex flex-col gap-3 rounded-lg border border-v4-border-color bg-v4-secondary-background-color p-4 shadow-sm"
        >
          <div class="flex items-start justify-between">
            <div class="flex flex-col gap-2">
              <div class="shimmer h-4 w-36"></div>
              <div class="shimmer h-3 w-52"></div>
            </div>
            <div class="shimmer h-7 w-24 rounded-lg"></div>
          </div>
          <div class="shimmer min-h-[250px] flex-1 rounded-lg"></div>
          <div class="flex justify-center gap-6 pt-1">
            <div class="shimmer h-4 w-12 rounded-full"></div>
            <div class="shimmer h-4 w-16 rounded-full"></div>
            <div class="shimmer h-4 w-12 rounded-full"></div>
          </div>
        </div>
      }
    </div>

    <!-- Section 3: Invoice Insights skeleton -->
    <div
      class="rounded-lg border border-v4-border-color bg-v4-secondary-background-color p-6 shadow-sm"
    >
      <div class="mb-4 flex flex-col gap-1">
        <div class="shimmer h-4 w-36"></div>
        <div class="shimmer h-3 w-52"></div>
      </div>
      <div
        class="grid grid-cols-2 gap-2 md:grid-cols-3 md:gap-4 lg:grid-cols-5"
      >
        @for (i of [1, 2, 3, 4, 5]; track i) {
          <div class="rounded-lg bg-v4-tertiary-background-color p-4">
            <div class="mb-3 flex items-center gap-2">
              <div class="shimmer h-8 w-8 rounded-lg"></div>
            </div>
            <div class="shimmer mb-1 h-3 w-20"></div>
            <div class="shimmer mb-2 h-8 w-10"></div>
            <div class="shimmer h-3 w-16"></div>
          </div>
        }
      </div>
    </div>
  } @else {
    <!-- Stats Cards: 5-column grid -->
    <div class="grid grid-cols-2 gap-2 md:grid-cols-3 md:gap-3 lg:grid-cols-5">
      @for (card of statsCards(); track card.title) {
        <app-overview-cards-v4 [card]="card" />
      }
    </div>

    <!-- Charts: 2-column grid -->
    <div class="grid grid-cols-1 gap-6 xl:grid-cols-2">
      <app-revenue-chart-line-graph-v4
        [data]="revenueData()"
        title="Revenue Timeline"
        subtitle="Paid vs Pending invoices over time"
        [isLoading]="isLoading()"
      />
      <app-vendor-status-chart-v4
        [data]="clientData()"
        title="Top 5 Clients by Revenue"
        subtitle="Payment status breakdown per client"
        [hideOverdue]="true"
        [isLoading]="isLoading()"
      />
    </div>

    <!-- Invoice Insights -->
    @if (riskCards().length > 0) {
      <div
        class="rounded-lg border border-v4-border-color bg-v4-secondary-background-color p-6 shadow-sm"
      >
        <div class="mb-4">
          <h3 class="text-sm font-bold text-foreground">Invoice Insights</h3>
        </div>
        <div
          class="grid grid-cols-2 gap-2 md:grid-cols-3 md:gap-4 lg:grid-cols-5"
        >
          @for (card of riskCards(); track card.label) {
            <app-risk-card-v4 [card]="card" />
          }
        </div>
      </div>
    }
  }
</div>
