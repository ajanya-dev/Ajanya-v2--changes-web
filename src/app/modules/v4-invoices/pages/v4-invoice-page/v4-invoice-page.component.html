<!-- Removed min-h-[calc(100vh-10vh)]: taller than the v4 page area, it forced a page scroll. -->
<div
  class="flex flex-col h-full w-full"
>
  <div class="main-container flex flex-col h-full w-full rounded">
  <app-v4-page-header
    [title]="'Invoices'"
    subtitle="Create and manage customer invoices"
    [actions]="headerActions"
    (actionClick)="onHeaderAction($event)"
  >
    <!-- Three-dot menu -->
    <div headerActions class="relative">
      <button aria-label="More options"
        class="flex items-center justify-center w-10 h-10 rounded-lg border border-v4-border-color bg-v4-secondary-background-color hover:bg-v4-input-background-color transition-colors"
        (click)="menuTrigger.openMenu()"
        matTooltip="More options"
      >
        <span
          #menuTrigger="matMenuTrigger"
          [matMenuTriggerFor]="moreMenu"
          class="absolute -bottom-2 right-0 w-full h-0 block"
        ></span>
        <lucide-icon
          name="ellipsis-vertical"
          [size]="18"
          class="text-v4-secondary-text-color"
        ></lucide-icon>
      </button>

      <mat-menu
        #moreMenu="matMenu"
        class="v4-action-menu"
        xPosition="before"
        [overlapTrigger]="false"
      >
        <button mat-menu-item (click)="goToItems()">
          <div class="flex items-center gap-3 py-2.5 w-[192px]">
            <lucide-icon
              name="package"
              [size]="18"
              class="text-[color:var(--v4-primary-brand-bold-color)] shrink-0"
            ></lucide-icon>
            <div class="flex flex-col gap-0.5">
              <span class="text-sm font-semibold">Invoice Items</span>
              <span class="text-xs text-v4-subtle-text-color"
                >Manage products and services</span
              >
            </div>
          </div>
        </button>
        <div class="h-px bg-v4-border-color mx-0 my-1"></div>
        <button mat-menu-item (click)="goToTaxes()">
          <div class="flex items-center gap-3 py-2.5 w-[192px]">
            <lucide-icon
              name="receipt"
              [size]="18"
              class="text-[color:var(--v4-primary-brand-bold-color)] shrink-0"
            ></lucide-icon>
            <div class="flex flex-col gap-0.5">
              <span class="text-sm font-semibold">Invoice Tax</span>
              <span class="text-xs text-v4-subtle-text-color"
                >Manage tax rates</span
              >
            </div>
          </div>
        </button>
      </mat-menu>
    </div>
  </app-v4-page-header>

    <div class="flex flex-1 flex-col min-h-0 mt-5">
      @if (activeTab() === "overview") {
        <app-v4-invoice-overview
          (switchToDetailedView)="activeTab.set('detailed')"
        />
      } @else {
        <app-v4-invoice-list />
      }
    </div>
  </div>
</div>
