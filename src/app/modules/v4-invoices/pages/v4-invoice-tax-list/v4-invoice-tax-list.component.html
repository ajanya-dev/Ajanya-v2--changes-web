<!-- Removed min-h-[calc(100vh-10vh)]: taller than the v4 page area, it forced a page scroll. -->
<div class="flex flex-col h-full w-full">
  <div class="main-container flex flex-col h-full w-full rounded">
    <app-v4-page-header
      [title]="'Invoice Tax'"
      subtitle="Manage tax rates for invoices"
      [actions]="headerActions"
      [showBackButton]="true"
      backButtonType="takeEvent"
      (backEvent)="navigateBack()"
      (actionClick)="onHeaderAction($event)"
    />

    <div class="flex flex-1 flex-col min-h-0 mt-5">
      <app-v4-data-table
        [defaultColumnFields]="columnFields"
        [tableId]="tableId"
        [useCustomEmptyState]="true"
        [emptyStateConfig]="{
          icon: 'receipt',
          title: 'No tax rates yet',
          description: 'Add the tax rates you apply so they are ready to select on invoices',
          buttonText: 'New Invoice Tax'
        }"
        (emptyStateActionClick)="openInvoiceTax()"
        [frameworkComponents]="frameworkComponents"
        (cellRendererIdEvent)="cellRendererActionClick($event)"
      />
    </div>
  </div>
</div>
