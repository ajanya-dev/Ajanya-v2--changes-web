<!-- Removed min-h-[calc(100vh-10vh)]: taller than the v4 page area, it forced a page scroll. -->
<div class="flex flex-col h-full w-full">
  <div class="main-container flex flex-col h-full w-full rounded">
    <app-v4-page-header
      [title]="'Credit Memo'"
      subtitle="Manage credit memos and apply them to invoices"
      [actions]="headerActions"
      [showBackButton]="true"
      backButtonType="takeEvent"
      (backEvent)="headerButtonClick({ id: 'id_invoices', selectedRows: [] })"
      (actionClick)="onHeaderAction($event)"
    />

    <div class="flex flex-1 flex-col min-h-0">
      <app-v4-data-table
        [defaultColumnFields]="columnFields"
        [tableId]="tableId"
        [fieldsShownByDefault]="fieldsShownByDefault"
        [headerElements]="headerElements()"
        [selectedPanelButton]="selectedpanel"
        [frameworkComponents]="frameworkComponents"
        [useCustomEmptyState]="true"
        [emptyStateConfig]="{
          icon: 'credit-card',
          title: 'No credit memos yet',
          description:
            'Issue your first credit memo to apply credits against invoices',
          buttonText: 'New Credit Memo'
        }"
        (emptyStateActionClick)="openAddCreditMemo()"
        (headerButtonEvent)="headerButtonClick($event)"
        (cellRendererIdEvent)="cellRendererActionClick($event)"
        (cellRendererViewEvent)="cellRendererViewClick($event)"
      />
    </div>
  </div>
</div>

<app-v4-credit-memo-detail-panel
  [row]="selectedCreditMemoRow()"
  [isOpen]="isPanelOpen()"
  [initialSection]="panelInitialSection()"
  (closed)="onPanelClosed()"
  (actionButtonClicked)="onPanelActionClick($event, selectedCreditMemoRow())"
/>
