<div class="flex flex-col font-funnel rounded-2xl overflow-hidden">
  <!-- modal header -->
  <div
    class="flex justify-between items-start px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        {{ editMode ? "Edit Tax" : "Add Tax" }}
      </h1>
      <p class="text-xs text-v4-subtle-text-color mt-0.5">
        Fill in the tax details below
      </p>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body -->
  <div class="p-6 bg-v4-tertiary-background-color" [formGroup]="taxForm">
    <div class="flex flex-col gap-4">
      <!-- Tax Name -->
      <div class="flex flex-col gap-1.5">
        <label
          class="text-xs font-semibold text-v4-secondary-text-color uppercase tracking-wider"
        >
          Tax Name <span class="text-v4-common-red-color">*</span>
        </label>
        <app-common-input-v4
          placeholder="Enter tax name"
          formControlName="tax_name"
          [control]="taxForm.controls['tax_name']"
          [isFieldRequired]="true"
          [fieldHeight]="'44px'"
        />
      </div>

      <!-- Tax in % -->
      <div class="flex flex-col gap-1.5">
        <label
          class="text-xs font-semibold text-v4-secondary-text-color uppercase tracking-wider"
        >
          Tax Rate <span class="text-v4-common-red-color">*</span>
        </label>
        <div class="relative">
          <app-common-input-v4
            placeholder="0.00"
            formControlName="tax_in"
            [control]="taxForm.controls['tax_in']"
            [isFieldRequired]="true"
            [isNumberOnly]="true"
            [numberType]="'decimal'"
            [maxLength]="5"
            [fieldHeight]="'44px'"
            (inputFocusOutEvent)="onTaxInKeyup()"
          />
          <span
            class="absolute right-4 top-1/2 -translate-y-1/2 text-sm font-medium text-v4-main-text-color pointer-events-none"
            >%</span
          >
        </div>
      </div>

      <!-- Note -->
      <div class="flex flex-col gap-1.5">
        <label
          class="text-xs font-semibold text-v4-secondary-text-color uppercase tracking-wider"
        >
          Note
        </label>
        <app-common-input-v4
          placeholder="Enter note (optional)"
          formControlName="note"
          [isFieldRequired]="false"
          [fieldHeight]="'44px'"
        />
      </div>
    </div>
  </div>

  <!-- modal footer -->
  <div
    class="flex justify-end gap-3 px-6 py-4 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    @if (editMode) {
      <app-common-button-v4
        width="120px"
        [type]="{ style: 'primary', name: 'main' }"
        text="Update"
        (clickEvent)="update()"
        [disabled]="isSubmitting"
        [loading]="isSubmitting"
      />
    } @else {
      <app-common-button-v4
        width="120px"
        [type]="{ style: 'primary', name: 'main' }"
        text="Add"
        (clickEvent)="submit()"
        [disabled]="isSubmitting"
        [loading]="isSubmitting"
      />
    }
  </div>
</div>
