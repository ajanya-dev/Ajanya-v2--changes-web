<div class="flex flex-col font-funnel rounded-2xl overflow-hidden">
  <!-- modal header -->
  <div
    class="flex justify-between items-start px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        {{ editMode ? "Edit Item" : "Add Item" }}
      </h1>
      <p class="text-xs text-v4-subtle-text-color mt-0.5">
        Fill in the item details below
      </p>
    </div>
    <button
      type="button"
      (click)="close()"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </button>
  </div>

  <!-- modal body -->
  <div class="p-6 bg-v4-tertiary-background-color" [formGroup]="itemForm">
    <div class="flex flex-col gap-4">
      <!-- Product Name -->
      <div class="flex flex-col gap-1.5">
        <label for="product"
          class="text-xs font-semibold text-v4-secondary-text-color uppercase tracking-wider"
        >
          Product Name <span class="text-v4-common-red-color">*</span>
        </label>
        <app-common-input-v4
          placeholder="Enter product name"
          formControlName="product_name"
          [control]="itemForm.controls['product_name']"
          [isFieldRequired]="true"
          [fieldHeight]="'44px'"
        />
      </div>

      <!-- Unit Price -->
      <div class="flex flex-col gap-1.5">
        <label for="price"
          class="text-xs font-semibold text-v4-secondary-text-color uppercase tracking-wider"
        >
          Unit Price <span class="text-v4-common-red-color">*</span>
        </label>
        <app-common-amount-input-v4
          formControlName="unit_price"
          [height]="'44px'"
          [isRequired]="true"
        />
        <app-control-message-v4
          [control]="itemForm.controls.unit_price"
        />
      </div>

      <!-- Description & Private Note side by side -->
      <div class="grid grid-cols-2 gap-3">
        <div class="flex flex-col gap-1.5">
          <label for="description"
            class="text-xs font-semibold text-v4-secondary-text-color uppercase tracking-wider"
          >
            Description
          </label>
          <app-common-input-v4
            placeholder="Optional"
            formControlName="description"
            [isFieldRequired]="false"
            [fieldHeight]="'44px'"
          />
        </div>

        <div class="flex flex-col gap-1.5">
          <label for="note"
            class="text-xs font-semibold text-v4-secondary-text-color uppercase tracking-wider"
          >
            Private Note
          </label>
          <app-common-input-v4
            placeholder="Optional"
            formControlName="private_note"
            [isFieldRequired]="false"
            [fieldHeight]="'44px'"
          />
        </div>
      </div>

      <!-- Track Product -->
      <label
        class="flex items-center gap-2.5 cursor-pointer w-fit p-3 rounded-xl bg-v4-secondary-background-color border border-v4-border-color hover:border-v4-primary-brand-color transition-colors"
      >
        <input
          type="checkbox"
          formControlName="track"
          (change)="onTrackChange($event)"
          class="w-4 h-4 rounded border-v4-input-border-color accent-v4-primary-brand-color cursor-pointer"
        />
        <span class="text-sm font-medium text-v4-main-text-color"
          >Track Product</span
        >
      </label>

      <!-- Stock Quantity (conditional) -->
      @if (instock) {
        <div class="flex flex-col gap-1.5">
          <label for="stock"
            class="text-xs font-semibold text-v4-secondary-text-color uppercase tracking-wider"
          >
            Stock Quantity <span class="text-v4-common-red-color">*</span>
          </label>
          <app-common-input-v4
            placeholder="Enter stock quantity"
            formControlName="instock"
            [isFieldRequired]="true"
            [isNumberOnly]="true"
            [numberType]="'numeric'"
            [fieldHeight]="'44px'"
          />
          <app-control-message-v4
            [control]="itemForm.controls.instock"
          />
        </div>
      }
    </div>
  </div>

  <!-- modal footer -->
  <div
    class="flex justify-end gap-3 px-6 py-4 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Close"
      (clickEvent)="close()"
    />
    @if (editMode) {
      <app-common-button-v4
        width="120px"
        [type]="{ style: 'primary', name: 'main' }"
        text="Update"
        (clickEvent)="update()"
        [disabled]="isSubmitting"
        [loading]="isSubmitting"
      />
    } @else {
      <app-common-button-v4
        width="120px"
        [type]="{ style: 'primary', name: 'main' }"
        text="Add"
        (clickEvent)="submit()"
        [disabled]="isSubmitting"
        [loading]="isSubmitting"
      />
    }
  </div>
</div>
