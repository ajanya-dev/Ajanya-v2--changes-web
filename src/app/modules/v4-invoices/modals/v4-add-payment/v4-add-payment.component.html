<div class="flex flex-col font-funnel rounded-2xl overflow-hidden">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Add Payment
      </h1>
      <h2 class="text-xs text-v4-subtle-text-color">
        Record a payment for this invoice
      </h2>
    </div>
    <button
      type="button"
      (click)="close()"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </button>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color" [formGroup]="form">
    <div class="flex flex-col gap-4">
      <!-- Invoice Info Card -->
      <div
        class="bg-v4-secondary-background-color border border-v4-border-color rounded-xl px-4 py-3"
      >
        <p class="text-xs text-v4-subtle-text-color mb-1">Invoice</p>
        <p class="text-sm font-semibold text-v4-main-text-color">
          {{ dialogData.invoiceNo
          }}{{ dialogData.payeeName ? " – " + dialogData.payeeName : "" }}
        </p>
        <p class="text-xs text-v4-subtle-text-color mt-1">
          Balance Due:
          <span class="font-bold text-v4-badge-warning-text-color">{{
            dialogData.balance | currency
          }}</span>
        </p>
      </div>
      <!-- Amount -->
      <app-common-input-v4
        [fieldLabel]="'Amount'"
        placeholder="Enter Amount"
        formControlName="Amount"
        [control]="form.controls['Amount']"
        [customMask]="'separator.2'"
        [maxLength]="17"
        [isFieldRequired]="true"
        errorLabel="Amount is required"
      />

      <!-- Payment Type -->
      <div class="flex flex-col gap-1.5">
        <label
          class="block text-xs font-medium text-v4-secondary-text-color mb-1.5 tracking-wide"
        >
          Payment Type <span class="text-v4-common-red-color">*</span>
        </label>
        <app-v4-common-dropdown
          formControlName="type"
          [config]="{
            placeholder: 'Select Payment Type',
            displayField: 'name',
            outputField: 'id'
          }"
          [listData]="paymentTypes"
          appendTo="body"
        />
        <app-control-message-v4
          [control]="form.controls['type']"
          label="Payment type is required"
        />
      </div>

      <!-- Payment Date -->
      <app-v4-date-picker
        fieldLabel="Payment Date"
        placeholder="Payment Date"
        formControlName="paymentDate"
        [control]="form.controls['paymentDate']"
        [isFieldRequired]="false"
      />

      <!-- Reference -->
      <app-common-input-v4
        [fieldLabel]="'Reference (optional)'"
        placeholder="Reference"
        formControlName="Reference"
        [isFieldRequired]="false"
      />
    </div>
  </div>
  <!-- modal body end -->

  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
      (clickEvent)="close()"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Add"
      (clickEvent)="submit()"
      [disabled]="isSubmitting"
      [loading]="isSubmitting"
    />
  </div>
</div>
