<div class="">
  <!-- modal header -->
  <div class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color">
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Preview
      </h1>
    </div>
    <div [mat-dialog-close]="false" class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center">
      <lucide-icon [img]="closeIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color min-h-[300px] flex items-center justify-center">
    @if (!imageLoaded) {
      <lucide-icon name="loader-circle" [size]="32" class="animate-spin text-v4-subtle-text-color" />
    }
    <img
      [src]="data"
      alt="attachment preview"
      class="w-full rounded-lg"
      [class.hidden]="!imageLoaded"
      (load)="onImageLoad()"
    />
  </div>
  <!-- modal body end -->

  <div class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color">
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
  </div>
</div>
