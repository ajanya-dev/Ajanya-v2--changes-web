<div class="bg-v4-main-background-color">
  <div>
    <app-v4-page-header
      [title]="'Support Tickets'"
      subtitle="Manage and track your support requests"
      [actions]="headerActions"
      (actionClick)="onHeaderAction($event)"
    />

    <!-- Status filter tabs. min-h pairs with the async counts in the labels:
         without it the row grows once the totals land and the table jumps. -->
    <div
      class="flex flex-col xl:flex-row xl:items-end xl:justify-between gap-2 mt-5 mb-1 min-h-[35px] border-b border-v4-border-color"
    >
      <app-common-tab-v4
        class="flex-1"
        [tabs]="filterTabs()"
        [(activeTab)]="activeFilterTab"
        variant="underline"
        size="xs"
        [borderNone]="true"
        (tabChange)="onFilterTabChange($event)"
      />
    </div>

    <!-- V4 Data Table -->
    <app-v4-data-table
      [showActionButtonContainer]="false"
      [columnDefs]="gridColumnDefs"
      [defaultColumnFields]="defaultColumnFields"
      [tableId]="tableId"
      [frameworkComponents]="frameworkComponents"
      [isRowSelectable]="isRowSelectable"
      [useCustomEmptyState]="true"
      [emptyStateConfig]="{
        icon: 'circle-alert',
        title: 'No support tickets yet',
        description:
          'Raise a ticket and our support team picks it up here. Every reply and status change stays in one place.',
        buttonText: 'Create Ticket',
        buttonIcon: 'plus'
      }"
      (emptyStateActionClick)="onCreateTicket()"
      (cellRendererViewEvent)="onViewEvent($event)"
      (rowClicked)="onRowClick($event)"
    />
  </div>
</div>

<!-- Detail Side Panel -->
<app-detail-side-panel
  [isOpen]="drawerOpen()"
  [width]="'clamp(460px, 34vw, 640px)'"
  [expandable]="true"
  [expandedWidth]="'min(1150px, 94vw)'"
  [panelId]="'support-ticket-detail'"
  (expandedChange)="isPanelExpanded.set($event)"
  [title]="panelTitle()"
  [iconTemplate]="panelIcon"
  [statusBadge]="panelStatusBadge()"
  [extraBadges]="panelSeverityBadges()"
  [actionButtons]="panelActionButtons()"
  [contentTemplate]="drawerContent"
  (closed)="closeDrawer()"
  (actionButtonClicked)="onActionClick($event)"
/>

<!-- Header icon: navy circle -->
<ng-template #panelIcon>
  <div
    class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-v4-primary-brand-color"
  >
    <lucide-icon name="circle-alert" [size]="18" color="white"></lucide-icon>
  </div>
</ng-template>

<!-- Drawer Content Template -->
<ng-template #drawerContent>
  <app-support-ticket-drawer-v4
    [row]="selectedRow()"
    [expanded]="isPanelExpanded()"
    (closeDrawer)="closeDrawer()"
    (statusChanged)="onStatusChanged($event)"
    (processingChange)="onProcessingChange($event)"
  />
</ng-template>
