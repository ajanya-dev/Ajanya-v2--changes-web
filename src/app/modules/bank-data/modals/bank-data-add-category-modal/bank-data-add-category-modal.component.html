<div class="ocw_man_modal_wrapper add_bank_modal">
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">
      {{ mode === "new" ? "Add New" : "Edit" }} Category
    </div>

    <div class="close_btn" [mat-dialog-close]="false">
      <svg
        aria-hidden="true"
        focusable="false"
        data-prefix="fal"
        data-icon="times"
        class="svg-inline--fa fa-times fa-w-10"
        role="img"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 320 512"
      >
        <path
          fill="currentColor"
          d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
        ></path>
      </svg>
    </div>
  </div>

  <!-- modal body start -->
  <div class="ocw_modal_body">
    <div class="flex flex-col gap-3">
      <div class="single_input no_modal_btn">
        <input
          type="text"
          class="input_style"
          placeholder=" "
          [formControl]="categoryName"
          maxlength="50"
        />
        <label class="floating_label_field">
          {{ mode === "new" ? "New Category" : "Category Name" }}
          <span class="text-danger">*</span>
        </label>

        <app-control-message [control]="categoryName"></app-control-message>
      </div>

      <div *ngIf="mode === 'new'" class="single_input no_modal_btn">
        <ng-select
          appendTo="ng-select"
          placeholder="Parent Category"
          [formControl]="parentCategoryId"
          [clearable]="true"
        >
          <ng-option *ngFor="let item of categories" [value]="item.id">
            <span [innerHTML]="item.name"></span>
          </ng-option>
        </ng-select>

        <!-- <label class="floating_label_field">Parent Category <span class="text-danger">*</span></label> -->
      </div>
    </div>

    <p class="mt-3 p-1 text-sm">
      You can create an unlimited number of categories and set rules to
      automatically categorize transactions.
    </p>
  </div>
  <!-- modal body end  -->

  <div class="ocw_modal_footer">
    <mat-dialog-actions>
      <!-- <button mat-dialog-close class="ocw-btn ocw-btn-gray">Close</button> -->
      <button
        (click)="submit()"
        type="button"
        class="ocw-btn ocw-btn-modal-blue add_btn"
        [ngClass]="{ disableBtn: loading }"
      >
        <span>{{ mode === "new" ? "Add" : "Update" }}</span>
        <span *ngIf="loading" class="loadingSpinner"></span>
        <!-- <svg aria-hidden="true" focusable="false" data-prefix="fas" data-icon="plus"
          class="svg-inline--fa fa-plus fa-w-14" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
          <path fill="currentColor"
            d="M416 208H272V64c0-17.67-14.33-32-32-32h-32c-17.67 0-32 14.33-32 32v144H32c-17.67 0-32 14.33-32 32v32c0 17.67 14.33 32 32 32h144v144c0 17.67 14.33 32 32 32h32c17.67 0 32-14.33 32-32V304h144c17.67 0 32-14.33 32-32v-32c0-17.67-14.33-32-32-32z">
          </path>
        </svg> -->
      </button>
    </mat-dialog-actions>
  </div>
</div>
