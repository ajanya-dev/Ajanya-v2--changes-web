<div class="ocw_man_modal_wrapper add_bank_modal">
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">Add New Rule</div>

    <div class="close_btn" [mat-dialog-close]="false">
      <svg
        aria-hidden="true"
        focusable="false"
        data-prefix="fal"
        data-icon="times"
        class="svg-inline--fa fa-times fa-w-10"
        role="img"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 320 512"
      >
        <path
          fill="currentColor"
          d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
        ></path>
      </svg>
    </div>
  </div>

  <!-- modal body start -->
  <div class="ocw_modal_body">
    <div *ngIf="data?.description" class="desc_title">
      {{ data?.description }}
    </div>

    <div class="flex flex-col gap-2">
      <!-------------------- IF CONDITIONS -------------------->
      <ng-container *ngFor="let row of ifs; let i = index">
        <div class="flex justify-start items-center gap-2">
          <span class="text-sm font-medium whitespace-nowrap">{{
            i === 0 ? "If" : "And if"
          }}</span>
          <div class="single_input no_modal_btn w-full">
            <select class="input_style" [(ngModel)]="ifs[i][0]">
              <option value="1">Description</option>
              <option value="2">Amount</option>
              <option value="3">Date</option>
              <option value="4">Account</option>
            </select>
          </div>

          <div class="single_input no_modal_btn w-full">
            <select
              class="input_style"
              [(ngModel)]="ifs[i][1]"
              (change)="midIfChange(i)"
            >
              <option
                *ngFor="let option of optionsForIf[ifs[i][0]]"
                [value]="option.value"
              >
                {{ option.name }}
              </option>
            </select>
          </div>

          <ng-container [ngSwitch]="ifs[i][0]">
            <!-- DESCRIPTION -->
            <div *ngSwitchCase="'1'" class="w-full">
              <input
                type="text"
                class="input_style"
                (input)="addIfs(i)"
                [(ngModel)]="ifs[i][2]"
                maxlength="100"
              />
            </div>

            <!-- AMOUNT -->
            <div *ngSwitchCase="'2'" class="w-full">
              <ng-container *ngIf="ifs[i][1] !== '4'">
                <input
                  type="text"
                  class="input_style"
                  (input)="addIfs(i)"
                  [(ngModel)]="ifs[i][2]"
                  (keypress)="utils.numberOnly($event, 'decimal')"
                  maxlength="10"
                />
              </ng-container>

              <ng-container *ngIf="ifs[i][1] === '4'">
                <div class="flex gap-1">
                  <input
                    type="text"
                    class="input_style"
                    (input)="addIfs(i)"
                    [(ngModel)]="ifs[i][3]"
                    (keypress)="utils.numberOnly($event, 'decimal')"
                    maxlength="10"
                    placeholder="From"
                  />
                  <input
                    type="text"
                    class="input_style"
                    (input)="addIfs(i)"
                    [(ngModel)]="ifs[i][4]"
                    (keypress)="utils.numberOnly($event, 'decimal')"
                    maxlength="10"
                    placeholder="To"
                  />
                </div>
              </ng-container>
            </div>

            <!-- DATE -->
            <div *ngSwitchCase="'3'" class="w-full">
              <ng-container *ngIf="ifs[i][1] !== '4'">
                <input
                  type="date"
                  class="input_style"
                  (input)="addIfs(i)"
                  [(ngModel)]="ifs[i][2]"
                />
              </ng-container>

              <ng-container *ngIf="ifs[i][1] === '4'">
                <div class="flex gap-1">
                  <input
                    type="date"
                    class="input_style"
                    (input)="addIfs(i)"
                    [(ngModel)]="ifs[i][3]"
                  />
                  <input
                    type="date"
                    class="input_style"
                    (input)="addIfs(i)"
                    [(ngModel)]="ifs[i][4]"
                  />
                </div>
              </ng-container>
            </div>

            <!-- ACCOUNT -->
            <div *ngSwitchCase="'4'" class="w-full">
              <select
                class="input_style"
                [(ngModel)]="ifs[i][2]"
                (change)="addIfs(i)"
              >
                <option
                  *ngFor="let acc of accounts | keyvalue"
                  [value]="acc.key"
                >
                  {{ acc.value.name }}
                </option>
              </select>
            </div>
          </ng-container>
        </div>
      </ng-container>
      <!-------------------- IF CONDITIONS END -------------------->

      <div class="mt-4 flex flex-col gap-1">
        <div
          *ngFor="let row of ruleBody.name.thens | keyvalue"
          class="flex justify-start items-center gap-2"
        >
          <span class="text-sm font-medium whitespace-nowrap">{{
            row.key === 0 ? "Then" : "And / Or"
          }}</span>
          <div class="single_input no_modal_btn w-full">
            <select
              class="input_style"
              [(ngModel)]="ruleBody.name.thens[row.key][0]"
            >
              <option value="1">Rename Description</option>
              <option value="2">Set Category</option>
            </select>
          </div>

          <ng-container [ngSwitch]="ruleBody.name.thens[row.key][0]">
            <div *ngSwitchCase="'1'" class="w-full">
              <input
                type="text"
                class="input_style"
                [(ngModel)]="ruleBody.name.thens[row.key][1]"
              />
            </div>

            <div *ngSwitchCase="'2'" class="w-full">
              <select
                class="input_style"
                [(ngModel)]="ruleBody.name.thens[row.key][1]"
              >
                <option value="">All</option>
                <option *ngFor="let item of categoryOptions" [value]="item.id">
                  <span [innerHTML]="item.name"></span>
                </option>
              </select>
            </div>
          </ng-container>
        </div>
      </div>
    </div>
  </div>
  <!-- modal body end  -->

  <div class="ocw_modal_footer">
    <mat-dialog-actions>
      <button mat-dialog-close class="ocw-btn ocw-btn-modal-bordered">
        Close
      </button>
      <button
        (click)="save()"
        [ngClass]="{ disableBtn: saving }"
        type="button"
        class="ocw-btn ocw-btn-modal-blue add_btn"
      >
        <span>Add</span>
        <svg
          *ngIf="!saving"
          aria-hidden="true"
          focusable="false"
          data-prefix="fas"
          data-icon="plus"
          class="svg-inline--fa fa-plus fa-w-14"
          role="img"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 448 512"
        >
          <path
            fill="currentColor"
            d="M416 208H272V64c0-17.67-14.33-32-32-32h-32c-17.67 0-32 14.33-32 32v144H32c-17.67 0-32 14.33-32 32v32c0 17.67 14.33 32 32 32h144v144c0 17.67 14.33 32 32 32h32c17.67 0 32-14.33 32-32V304h144c17.67 0 32-14.33 32-32v-32c0-17.67-14.33-32-32-32z"
          ></path>
        </svg>

        <span *ngIf="saving" class="loadingSpinner"></span>
      </button>
    </mat-dialog-actions>
  </div>
</div>
