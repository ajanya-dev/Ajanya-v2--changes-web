<div class="ocw_one_side_body">
  <div class="ocw_header">
    <div class="title">
      <h3>Bank Data - Rules</h3>
      <span class="sub_head">Add, Edit or Delete your Bank Data Rules</span>
    </div>

    <button (click)="reapplyRules()" class="ocw-btn ocw-btn-dark-blue">
      Re Apply All Rules
    </button>
  </div>
  <hr class="header_border" />

  <!-- main body -->
  <div class="ocw_body">
    <!-- TABLE START -->
    <table class="ocw-table ocw-table-base">
      <thead>
        <tr>
          <th class="text-left font-medium w-16">#</th>
          <th class="text-left font-medium">Rule</th>
          <th class="text-left font-medium w-20">Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let item of rules; let i = index">
          <td>{{ i + 1 }}.</td>
          <td>
            <div class="flex flex-col text-sm">
              <div *ngIf="item?.length > 0" [innerHTML]="item[1]"></div>
              <div *ngIf="item?.length > 1" [innerHTML]="item[2]"></div>
            </div>
          </td>

          <td class="flex_center">
            <svg
              (click)="deleteRule(item[0], i)"
              aria-hidden="true"
              focusable="false"
              data-prefix="fas"
              data-icon="trash"
              class="svg-inline--fa fa-trash fa-w-14 text-danger-lite"
              role="img"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 448 512"
            >
              <path
                fill="currentColor"
                d="M432 32H312l-9.4-18.7A24 24 0 0 0 281.1 0H166.8a23.72 23.72 0 0 0-21.4 13.3L136 32H16A16 16 0 0 0 0 48v32a16 16 0 0 0 16 16h416a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16zM53.2 467a48 48 0 0 0 47.9 45h245.8a48 48 0 0 0 47.9-45L416 128H32z"
              ></path>
            </svg>
          </td>
        </tr>
      </tbody>
    </table>
    <!-- TABLE END -->
  </div>

  <div class="data_spinner" [ngClass]="{ data_fetched: !loading }"></div>
</div>
