<section class="main_common_module">
  <div class="main_module_wrapper">
    <div class="module_main_header">
      <div class="header_title">
        <h3>Bank Data - Categories</h3>
        <span class="sub_head"> Add, Edit or Delete your Categories </span>
      </div>

      <button
        (click)="openCategoryModal('new')"
        class="ocw-btn ocw-btn-dark-blue"
      >
        <div class="flex justify-center items-center gap-1">
          <svg
            aria-hidden="true"
            focusable="false"
            data-prefix="fas"
            data-icon="plus"
            class="svg-inline--fa fa-plus fa-w-14"
            role="img"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 448 512"
          >
            <path
              fill="currentColor"
              d="M416 208H272V64c0-17.67-14.33-32-32-32h-32c-17.67 0-32 14.33-32 32v144H32c-17.67 0-32 14.33-32 32v32c0 17.67 14.33 32 32 32h144v144c0 17.67 14.33 32 32 32h32c17.67 0 32-14.33 32-32V304h144c17.67 0 32-14.33 32-32v-32c0-17.67-14.33-32-32-32z"
            ></path>
          </svg>
          <span>Add New</span>
        </div>
      </button>
    </div>

    <!-- MAIN BODY START -->
    <div class="module_main_body">
      <!-- TABLE 1 START -->
      <table class="ocw-table ocw-table-base">
        <thead>
          <tr>
            <th class="text-left font-medium w-16">#</th>
            <th class="text-left font-medium">Name</th>
            <th class="text-left font-medium w-20">Action</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let item of displayCategories; let i = index">
            <td class="text-sm">{{ i + 1 }}.</td>
            <td class="text-sm">
              <span
                class="font-medium"
                [style.padding-left.px]="(item.level || 0) * 16"
                [innerHTML]="item.name"
              ></span>
            </td>
            <td>
              <div class="flex justify-between items-center">
                <svg
                  (click)="deleteCategory(item.id)"
                  aria-hidden="true"
                  focusable="false"
                  data-prefix="fas"
                  data-icon="trash"
                  class="svg-inline--fa fa-trash fa-w-14 text-danger"
                  role="img"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 448 512"
                >
                  <path
                    fill="currentColor"
                    d="M432 32H312l-9.4-18.7A24 24 0 0 0 281.1 0H166.8a23.72 23.72 0 0 0-21.4 13.3L136 32H16A16 16 0 0 0 0 48v32a16 16 0 0 0 16 16h416a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16zM53.2 467a48 48 0 0 0 47.9 45h245.8a48 48 0 0 0 47.9-45L416 128H32z"
                  ></path>
                </svg>

                <svg
                  (click)="openCategoryModal('edit', item)"
                  aria-hidden="true"
                  focusable="false"
                  data-prefix="fas"
                  data-icon="edit"
                  class="svg-inline--fa fa-edit fa-w-18"
                  role="img"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 576 512"
                >
                  <path
                    fill="currentColor"
                    d="M402.6 83.2l90.2 90.2c3.8 3.8 3.8 10 0 13.8L274.4 405.6l-92.8 10.3c-12.4 1.4-22.9-9.1-21.5-21.5l10.3-92.8L388.8 83.2c3.8-3.8 10-3.8 13.8 0zm162-22.9l-48.8-48.8c-15.2-15.2-39.9-15.2-55.2 0l-35.4 35.4c-3.8 3.8-3.8 10 0 13.8l90.2 90.2c3.8 3.8 10 3.8 13.8 0l35.4-35.4c15.2-15.3 15.2-40 0-55.2zM384 346.2V448H64V128h229.8c3.2 0 6.2-1.3 8.5-3.5l40-40c7.6-7.6 2.2-20.5-8.5-20.5H48C21.5 64 0 85.5 0 112v352c0 26.5 21.5 48 48 48h352c26.5 0 48-21.5 48-48V306.2c0-10.7-12.9-16-20.5-8.5l-40 40c-2.2 2.3-3.5 5.3-3.5 8.5z"
                  ></path>
                </svg>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <!-- TABLE END 1 -->
