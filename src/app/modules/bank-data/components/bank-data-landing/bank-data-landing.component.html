<div
  class="main-container main-component-container p-[10px] card-main-container h-full rounded overflow-hidden relative"
>
  <iframe #bankDataIframe class="h-[1000px] w-full" [src]="src"></iframe>
  
  <!-- Loading Overlay -->
  <div 
    *ngIf="loading()" 
    class="absolute inset-0 bg-white bg-opacity-90 flex items-center justify-center z-10"
  >
    <div class="text-center">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-common-blue-color mx-auto mb-4"></div>
      <p class="text-main-text-color font-inter font-medium">Loading bank data...</p>
    </div>
  </div>
</div>
