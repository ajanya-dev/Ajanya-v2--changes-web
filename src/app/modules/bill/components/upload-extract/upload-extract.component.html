<div class="main_wrapper">
  <div>
    <label class="text-sm font-medium">
      Select a document<span class="required">*</span>
    </label>
    <div class="single_input no_modal_btn">
      <input
        type="file"
        class="input_style file_input"
        id="file_select"
        (change)="uploadEvent($event.target.files)"
      />
      <span class="file_input_selector" (click)="choose()">Choose</span>
      <label class="file_input_label">{{ file?.name }}</label>
    </div>
    <div class="pt-2">
      <button
        class="ocw-btn ocw-btn-light-green"
        (click)="extractInvoiceImage()"
      >
        Extract
      </button>
    </div>
  </div>

  <div>
    <h5>Instructions</h5>
    <p>
      Extract bill information from images. Choose image of bill and click
      Extract.
    </p>
  </div>
</div>
