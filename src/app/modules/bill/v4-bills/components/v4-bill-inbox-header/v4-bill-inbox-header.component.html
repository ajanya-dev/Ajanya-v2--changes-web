<app-v4-page-header [title]="'Bill Inbox'">
  <div headerActions class="flex items-center gap-3 flex-wrap">
    <span
      class="text-[12px] font-peridot text-v4-secondary-text-color font-semibold tracking-wider uppercase"
    >
      Connected Mail ID
    </span>

    @if (mappedEmail()) {
      <div
        class="flex items-center gap-2 px-3 py-2 bg-v4-badge-sky-bg-color rounded-md border border-v4-input-border-color shadow-md"
      >
        <lucide-icon
          name="mail"
          [size]="14"
          class="text-v4-primary-brand-color"
        />
        <span
          class="text-xs font-bold font-peridot text-v4-primary-brand-color"
          >{{ mappedEmail() }}</span
        >
        <lucide-icon
          name="copy"
          [size]="12"
          class="text-v4-primary-brand-color cursor-pointer hover:text-v4-primary-brand-color/70 transition-colors"
          (click)="copyEmail()"
          [matTooltip]="tooltip()"
        />
      </div>
    }

    <button aria-label="Setup Bill Inbox"
      (click)="openSettings()"
      matTooltip="Setup Bill Inbox"
      class="p-1.5 rounded-md text-v4-tertiary-text-color hover:text-v4-main-text-color hover:bg-v4-tertiary-background-color transition-colors cursor-pointer"
    >
      <lucide-icon name="settings" [size]="20" />
    </button>
  </div>
</app-v4-page-header>
