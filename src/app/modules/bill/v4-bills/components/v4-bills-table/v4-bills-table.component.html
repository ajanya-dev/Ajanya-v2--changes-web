<div class="flex flex-col w-full h-full overflow-auto">
  <div class="data-table-wrapper flex-1 rounded">
    <app-v4-data-table
      class="overflow-auto"
      [showActionButtonContainer]="false"
      [(selectedPanelButton)]="selectedPanelButton"
      [deselectedColumns]="deselectedColumns"
      [headerElements]="headerElements()"
      [columnDefs]="columnDefs"
      [defaultColumnFields]="defaultColumnFields"
      [tableId]="tableId"
      [fieldsShownByDefault]="fieldsShownByDefault"
      [useCustomEmptyState]="true"
      [emptyStateConfig]="{
        icon: 'file-text',
        title: 'No bills yet',
        description: 'Create your first bill to start tracking and paying your vendors',
        buttonText: 'New Bill'
      }"
      (emptyStateActionClick)="onNew()"
      (cellRendererIdEvent)="cellRendererActionClick($event)"
      (cellRendererViewEvent)="cellRendererViewEvent($event)"
      [frameworkComponents]="frameworkComponents"
      (headerButtonEvent)="headerButtonClick($event)"
      (tableExportEvent)="onExportData($event)"
    >
    </app-v4-data-table>
  </div>
</div>

@if (selectedBillId()) {
  <app-v4-bills-details-panel
    [billId]="selectedBillId()"
    [isOpen]="isDetailPanelOpen()"
    (closed)="isDetailPanelOpen.set(false); selectedBillId.set('')"
    (billUpdated)="refreshDataTable()"
  />
}
