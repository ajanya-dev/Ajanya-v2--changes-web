<div class="flex flex-1 flex-col gap-4 py-4 md:gap-6 md:py-6">
  @if (isLoading()) {
    <!-- Section 1: Summary cards skeleton -->
    <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 xl:grid-cols-5">
      @for (i of [1, 2, 3, 4, 5]; track i) {
        <div
          class="flex flex-col gap-2 rounded-lg bg-v4-secondary-background-color p-5 shadow-sm"
        >
          <div class="shimmer h-3 w-24"></div>
          <div class="shimmer h-8 w-16"></div>
          <div class="shimmer h-4 w-28"></div>
        </div>
      }
    </div>

    <!-- Section 2: Charts row skeleton -->
    <div class="grid grid-cols-1 gap-4 xl:grid-cols-2">
      @for (i of [1, 2]; track i) {
        <div
          class="flex flex-col gap-3 rounded-lg bg-v4-secondary-background-color p-4 shadow-sm"
        >
          <div class="flex items-start justify-between">
            <div class="flex flex-col gap-2">
              <div class="shimmer h-4 w-36"></div>
              <div class="shimmer h-3 w-52"></div>
            </div>
            <div class="shimmer h-7 w-24 rounded-lg"></div>
          </div>
          <div class="shimmer min-h-[250px] flex-1 rounded-lg"></div>
          <div class="flex justify-center gap-6 pt-1">
            <div class="shimmer h-4 w-12 rounded-full"></div>
            <div class="shimmer h-4 w-16 rounded-full"></div>
            <div class="shimmer h-4 w-12 rounded-full"></div>
          </div>
        </div>
      }
    </div>

    <!-- Section 3: Risk indicators skeleton -->
    <div class="rounded-lg bg-v4-secondary-background-color p-6 shadow-sm">
      <div class="mb-4 flex flex-col gap-1">
        <div class="shimmer h-4 w-36"></div>
        <div class="shimmer h-3 w-52"></div>
      </div>
      <div class="grid grid-cols-2 gap-3 md:grid-cols-3 xl:grid-cols-5">
        @for (i of [1, 2, 3, 4, 5]; track i) {
          <div class="rounded-lg bg-v4-tertiary-background-color p-4">
            <div class="mb-3 flex items-center gap-2">
              <div class="shimmer h-8 w-8 rounded-lg"></div>
            </div>
            <div class="shimmer mb-1 h-3 w-20"></div>
            <div class="shimmer mb-2 h-8 w-10"></div>
            <div class="shimmer h-3 w-16"></div>
          </div>
        }
      </div>
    </div>
  } @else {
    <!-- Section 1: Summary cards -->
    <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 xl:grid-cols-5">
      @for (card of summaryCards(); track card.title) {
        <app-overview-cards-v4 [card]="card" />
      }
    </div>

    <!-- Section 2: Charts row -->
    <div class="grid grid-cols-1 gap-4 xl:grid-cols-2">
      <app-payment-receipt-timeline-v4
        [title]="'Payment Timeline'"
        description="When bills are paid relative to due dates"
        [data]="timelineData()"
      />
      <app-vendor-status-chart-v4
        [title]="'Top 5 Vendors by Amount'"
        subtitle="Bill payment status breakdown per vendor"
        [data]="vendorData()"
        [isLoading]="isLoadingVendors()"
      />
    </div>

    <!-- Section 3: Risk Indicators -->
    <app-v4-bill-risk-indicators
      [indicators]="riskIndicators()"
      [isLoading]="isLoadingRisk()"
    />
  }
</div>
