@if (
  isBillAutomationCallDone() &&
  billAutomationEnabled() &&
  !isEmailToBillMapped()
) {
  <div class="mt-4">
    <app-v4-bill-inbox-banner (setupBillInbox)="onBillInbox()" />
  </div>
}

<div class="flex flex-1 flex-col min-h-0 mt-5">
  <div
    class="flex flex-col xl:flex-row xl:items-end xl:justify-between mb-1 gap-2 min-h-[35px] border-b border-v4-border-color"
  >
    <app-common-tab-v4
      class="flex-1"
      [tabs]="statusTabs"
      [activeTab]="activeStatus()"
      (tabChange)="selectStatus($event)"
      variant="underline"
      size="xs"
      [borderNone]="true"
    />

    @if (
      isBillAutomationCallDone() &&
      billAutomationEnabled() &&
      isEmailToBillMapped()
    ) {
      <div class="flex flex-wrap items-center justify-end gap-2 pb-1">
        <app-common-button-v4
          class="whitespace-nowrap"
          [text]="'Bill Inbox'"
          [type]="{ name: 'list', style: 'green' }"
          [textColorInput]="'var(--v4-primary-brand-bold-color)'"
          [disableHoverEffect]="true"
          customClasses="font-semibold px-2.5 py-1.5 border border-v4-primary-brand-bold-color rounded-xl"
          backGroundInput="transparent"
          [isAddIcon]="true"
          [lucideIcon]="'mail'"
          toolTip="Open Bill Inbox"
          (clickEvent)="navigateToBillInbox()"
        />
      </div>
    }
  </div>

  <app-v4-bills-table [(selectedPanelButton)]="activeStatus" />
</div>
