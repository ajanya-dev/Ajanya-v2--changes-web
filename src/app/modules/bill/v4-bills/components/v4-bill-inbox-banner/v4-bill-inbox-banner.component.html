<div class="banner-container">
  <div class="banner-content">
    <div class="icon-circle">
      <lucide-angular
        [img]="Mail"
        [size]="28"
        class="text-white"
      ></lucide-angular>
    </div>
    <div class="text-content">
      <span class="badge">NEW FEATURE</span>
      <h3 class="banner-title">Introducing Bill Inbox</h3>
      <p class="banner-description">
        Forward bills via email and let AI automatically extract all the
        details. Save time, reduce errors, and never miss a payment.
      </p>
    </div>
  </div>
  <div class="banner-cta">
    <app-common-button-v4
      [type]="{ style: 'outline', name: 'main' }"
      [text]="'Setup Bill Inbox'"
      [lucideIcon]="'mail'"
      [isAddIcon]="true"
      [backGroundInput]="'var(--v4-secondary-background-color)'"
      [textColorInput]="'var(--v4-accent-violet-color)'"
      [customClasses]="'banner-setup-btn'"
      (clickEvent)="onSetupBillInbox()"
    />
  </div>
  <div class="decorative-arc"></div>
  <div class="decorative-arc-2"></div>
</div>
