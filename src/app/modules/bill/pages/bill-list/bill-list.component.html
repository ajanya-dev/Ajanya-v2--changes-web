<div class="flex flex-col w-full h-full overflow-auto">
  <div class="data-table-wrapper bg-main-background-color flex-1 rounded">
    <div class="px-5 pt-3">
      <app-v3-data-table
        dynamicHeaderText="Bill Summary"
        [(selectedPanelButton)]="selectedPanelButton"
        [deselectedColumns]="deselectedColumns"
        [headerElements]="headerElements()"
        [columnDefs]="columnDefs"
        [defaultColumnFields]="defaultColumnFields"
        [tableId]="tableId"
        [fieldsShownByDefault]="fieldsShownByDefault"
        (cellRendererIdEvent)="cellRendererActionClick($event)"
        (cellRendererViewEvent)="cellRendererViewEvent($event)"
        [frameworkComponents]="frameworkComponents"
        (headerButtonEvent)="headerButtonClick($event)"
        (tableExportEvent)="onExportData($event)"
      >
      </app-v3-data-table>
    </div>
  </div>
</div>
