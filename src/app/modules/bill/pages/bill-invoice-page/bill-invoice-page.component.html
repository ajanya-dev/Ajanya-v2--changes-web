<div class=" flex bg-main-background-color ">
  <!-- Left Section - Email Bills List -->
  <div 
    class="w-1/4 min-w-80 border-r border-input-border-color h-[800px] overflow-hidden flex flex-col"
    [ngClass]="{ 'hidden': !isEmailInboxVisible() }"
  >
    <app-email-bill-list
      [selectedItem]="selectedEmailBill()"
      (itemSelected)="onEmailBillSelected($event)"
    ></app-email-bill-list>
  </div>

  <!-- Right Section - Invoice View -->
  <div class="flex-1 relative">
    @if (isItemsLoading()) {
      <div class="absolute inset-0 bg-main-background-color bg-opacity-95 flex items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-main-background-color p-6 mx-4 rounded-lg">
          <div class="text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-common-blue-color mx-auto mb-4"></div>
            <h3 class="text-main-text-color font-semibold text-lg mb-2">Processing Invoice Items</h3>
            <div class="flex items-center justify-center space-x-1">
              <div class="w-2 h-2 bg-common-blue-color rounded-full animate-bounce"></div>
              <div class="w-2 h-2 bg-common-blue-color rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
              <div class="w-2 h-2 bg-common-blue-color rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
            </div>
          </div>
        </div>
      </div>
    }
    
    <app-invoice-view 
      [invoiceData]="invoiceDetails()"
      (formOpened)="onFormOpened($event)"
      (formClosed)="onFormClosed()"
      (billSaved)="onBillSaved($event)"
      (billUpdated)="onBillUpdated($event)">
    </app-invoice-view>
  </div>
</div>
