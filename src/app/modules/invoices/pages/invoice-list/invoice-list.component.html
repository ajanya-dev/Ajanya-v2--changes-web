<div class="bg-main-background-color rounded p-3">
  <div class="p-1 relative">
    <!-- <div class="absolute top-[45px] right-[166px]">
      <app-common-button-v35
        [type]="{ style: 'blue', name: 'money-action' }"
         text="Set Rule"
        (clickEvent)="buttonClickEvent()"
      />
    </div> -->
    <div class="absolute top-[44px] right-[200px] max-xl:top-[6px]">
      <div class="flex items-center gap-2 font-inter">
        <div
          class="flex items-center gap-1 bg-secondary-background-color rounded-md px-2.5 py-1.5"
          [ngClass]="{ skelton: summaryLoading() }"
        >
          <div
            class="w-5 h-5 rounded-full bg-main-background-color flex items-center justify-center"
          >
            <fa-icon
              [icon]="faDollarSign"
              class="text-common-blue-color text-sm"
            />
          </div>
          <span class="text-sm font-medium text-secondary-text-color"
            >Total Amount</span
          >
          <span class="text-xs text-secondary-text-color">:</span>
          <span class="text-sm font-medium text-main-text-color">{{
            summary()?.grand_total | currency
          }}</span>
        </div>
        <div
          class="flex items-center gap-1 bg-secondary-background-color rounded-md px-2.5 py-1.5"
          [ngClass]="{ skelton: summaryLoading() }"
        >
          <div
            class="w-5 h-5 rounded-full bg-main-background-color flex items-center justify-center"
          >
            <fa-icon
              [icon]="faDollarSign"
              class="text-common-green-color text-sm"
            />
          </div>
          <span class="text-sm font-medium text-secondary-text-color"
            >Total Paid</span
          >
          <span class="text-xs text-secondary-text-color">:</span>
          <span class="text-sm font-medium text-main-text-color">{{
            summary()?.paid | currency
          }}</span>
        </div>
        <div
          class="flex items-center gap-1 bg-secondary-background-color rounded-md px-2.5 py-1.5"
          [ngClass]="{ skelton: summaryLoading() }"
        >
          <div
            class="w-5 h-5 rounded-full bg-main-background-color flex items-center justify-center"
          >
            <fa-icon
              [icon]="faDollarSign"
              class="text-common-red-color text-sm"
            />
          </div>
          <span class="text-sm font-medium text-secondary-text-color"
            >Total Unpaid</span
          >
          <span class="text-xs text-secondary-text-color">:</span>
          <span class="text-sm font-medium text-main-text-color">{{
            summary()?.balance | currency
          }}</span>
        </div>
      </div>
    </div>
    <app-v3-data-table
      [defaultColumnFields]="columnFields"
      [tableId]="tableId"
      [fieldsShownByDefault]="fieldsShownByDefault"
      [headerElements]="headerElements()"
      [selectedPanelButton]="selectedpanel"
      [HeaderButtonLoadingProp]="HeaderButtonLoadingProp"
      class="overflow-auto"
      dynamicHeaderText="Invoice List"
      [buttonForModal]="true"
      [columnDefs]="columnDefs"
      [exportConfig]="exportConfig"
      [frameworkComponents]="frameworkComponents"
      (headerButtonEvent)="headerButtonClick($event)"
      (cellRendererIdEvent)="cellRendererActionClick($event)"
      (cellRendererViewEvent)="cellRendererViewClick($event)"
      (tableExportEvent)="onExportData($event)"
      (rowSelected)="onRowSelected($event)"
    >
    </app-v3-data-table>
  </div>
</div>
