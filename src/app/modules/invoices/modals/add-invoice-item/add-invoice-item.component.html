<div class="ocw_man_modal_wrapper add_bank_modal">
  <form method="POST">
    <div class="ocw_modal_header">
      <div class="ocw_modal_title">Add item</div>
    </div>

    <!-- modal body start -->
    <div class="ocw_modal_body">
      <form [formGroup]="itemForm">
        <div class="input_group bank_credential">
          <div class="single_input">
            <input
              type="text"
              class="input_style"
              formControlName="product_name"
              placeholder=" "
            />
            <span class="floating_label_field"
              >Product Name <span class="required">*</span></span
            >
          </div>

          <div class="single_input">
            <input
              type="text"
              class="input_style"
              formControlName="unit_price"
              placeholder=" "
              (keypress)="utils.numberOnly($event)"
              maxlength="13"
              mask="separator.2"
              thousandSeparator=","
            />
            <span class="floating_label_field"
              >Unit Price <span class="required">*</span></span
            >
          </div>

          <div class="single_input">
            <input
              type="text"
              class="input_style"
              formControlName="description"
              placeholder=" "
            />
            <span class="floating_label_field">Description </span>
          </div>

          <div class="single_input">
            <input
              type="text"
              class="input_style"
              formControlName="private_note"
              placeholder=" "
            />
            <span class="floating_label_field">Private Note </span>
          </div>

          <div class="single_input">
            <input
              type="checkbox"
              formControlName="track"
              (click)="checked($event)"
              placeholder=" "
            />
            <label class="track">Track Product</label>
          </div>

          <div *ngIf="Instock" class="single_input">
            <input
              type="text"
              class="input_style"
              (keypress)="numberOnly($event)"
              formControlName="instock"
              placeholder=" "
            />
            <span class="floating_label_field"
              >Stock Quantity <span class="required">*</span></span
            >
          </div>
        </div>
      </form>
    </div>
    <!-- modal body end -->

    <div class="ocw_modal_footer">
      <mat-dialog-actions align="end">
        <button mat-dialog-close class="ocw-btn ocw-btn-modal-bordered">
          Close
        </button>
        <button
          type="button"
          (click)="submit()"
          class="ocw-btn ocw-btn-modal-blue add_btn"
        >
          <svg
            aria-hidden="true"
            focusable="false"
            data-prefix="fas"
            data-icon="plus"
            class="svg-inline--fa fa-plus fa-w-14"
            role="img"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 448 512"
          >
            <path
              fill="currentColor"
              d="M416 208H272V64c0-17.67-14.33-32-32-32h-32c-17.67 0-32 14.33-32 32v144H32c-17.67 0-32 14.33-32 32v32c0 17.67 14.33 32 32 32h144v144c0 17.67 14.33 32 32 32h32c17.67 0 32-14.33 32-32V304h144c17.67 0 32-14.33 32-32v-32c0-17.67-14.33-32-32-32z"
            ></path>
          </svg>
          <span>Add</span>
        </button>
      </mat-dialog-actions>
    </div>
  </form>
</div>
