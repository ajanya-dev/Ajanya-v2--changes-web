<div class="px-[6px] pb-[6px]">
  <!-- modal header -->
  <div class="flex justify-between pb-6">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
        <span class="pl-1 font-inter font-semibold text-base pb-0.5"
          >Import {{ injectData | titlecase }}</span
        >
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="['fas', 'xmark']"
      ></fa-icon>
    </div>
  </div>
  <!-- modal body start -->
  <div>
    <div class="mt-5 flex justify-between">
      <div
        class="flex-1 !text-main-text-color font-inter text-sm font-medium mt-2"
      >
        Select File: <span class="required">*</span>
      </div>
      <div
        class="flex-1"
        [ngClass]="{ 'border border-common-red-color rounded': showError() }"
      >
        <app-common-upload-button-v35
          buttonText="BROWSE"
          [acceptedFileTypes]="['.csv', '.xlsx']"
          (selectedFileEvent)="uploadEvent($event)"
        ></app-common-upload-button-v35>
      </div>
    </div>
    <div class="">
      <div class="text-sm flex flex-col mt-6">
        <div class="flex justify-between">
          <div>
            <span class="mt-3 flex items-center gap-1 font-inter">
              <fa-icon
                class="text-common-blue-color"
                [icon]="faAngleRight"
              ></fa-icon>
              Please make sure date format is (mm/dd/yyyy or mm/dd/yy)
            </span>
          </div>
        </div>
        <span class="mt-3 flex items-center gap-1 font-inter">
          <fa-icon
            class="text-common-blue-color"
            [icon]="faAngleRight"
          ></fa-icon>
          We only support csv/xlsx file
        </span>
        <app-common-button-v35
          class="whitespace-nowrap mt-2"
          text="Download Sample File"
          [type]="{ name: 'list', style: 'blue' }"
          [disableHoverEffect]="false"
          customClasses="font-extralight p-0"
          backGroundInput="transparent"
          [isAddIcon]="true"
          [icon]="['fas', 'arrow-down-to-line']"
          (clickEvent)="downloadClick()"
          [disabled]="isSampleFileLoading()"
        ></app-common-button-v35>
      </div>
    </div>
  </div>
  <!-- modal body end -->
  <div class="flex justify-end gap-3 pt-8">
    <app-common-button-v35
      width="125px"
      mat-dialog-close
      [type]="{ style: 'bordered', name: 'main' }"
      text="Cancel"
    ></app-common-button-v35>
    <app-common-button-v35
      width="125px"
      [type]="{ style: 'modal', name: 'main' }"
      text="Import"
      (clickEvent)="submit()"
      [disabled]="isSubmit()"
      [loading]="isSubmit()"
    ></app-common-button-v35>
  </div>
</div>
