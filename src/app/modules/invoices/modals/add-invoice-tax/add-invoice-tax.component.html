<div class="ocw_man_modal_wrapper add_bank_modal">
  <form method="POST">
    <div class="ocw_modal_header flex justify-between items-start">
      <div class="ocw_modal_title">
        {{ !editMode ? "Add Tax" : "Edit Tax" }}
      </div>
      <div [mat-dialog-close]="false">
        <fa-icon
          class="text-secondary-text-color cursor-pointer"
          [icon]="['fas', 'xmark']"
        ></fa-icon>
      </div>
    </div>

    <!-- modal body start -->
    <div class="ocw_modal_body">
      <form [formGroup]="taxForm">
        <div class="input_group bank_credential">
          <div class="single_input">
            <input
              type="text"
              class="input_style"
              formControlName="tax_name"
              placeholder=" "
            />
            <span class="floating_label_field"
              >Tax Name <span class="required">*</span></span
            >
            <app-control-message-v35
              [control]="taxForm.controls.tax_name"
            ></app-control-message-v35>
          </div>

          <div class="single_input">
            <input
              type="text"
              class="input_style"
              formControlName="tax_in"
              (keyup)="validation($event)"
              (keypress)="utils.numberOnly($event, 'decimal')"
              maxlength="5"
              placeholder=" "
            />
            <span class="floating_label_field"
              >Tax in % <span class="required">*</span></span
            >
            <app-control-message-v35
              [control]="taxForm.controls.tax_in"
              [customMessages]="{ invalidDecimal: 'Invalid tax percentage.' }"
            ></app-control-message-v35>
          </div>

          <div class="single_input">
            <input
              type="text"
              class="input_style"
              formControlName="note"
              placeholder=" "
            />
            <span class="floating_label_field">Note </span>
          </div>
        </div>
      </form>
    </div>
    <!-- modal body end -->

    <div class="ocw_modal_footer">
      <mat-dialog-actions align="end">
        <app-common-button-v35
          [type]="{ style: 'bordered', name: 'main' }"
          text="Close"
          (clickEvent)="close()"
        ></app-common-button-v35>
        <app-common-button-v35
          *ngIf="!editMode"
          [type]="{ style: 'modal', name: 'main' }"
          [text]="savingLoading ? 'Saving...' : 'Add'"
          [disabled]="savingLoading"
          [isAddIcon]="!savingLoading"
          (clickEvent)="submit()"
          [loading]="savingLoading"
        ></app-common-button-v35>
        <app-common-button-v35
          *ngIf="editMode"
          [type]="{ style: 'modal', name: 'main' }"
          [text]="savingLoading ? 'Saving...' : 'Update'"
          [disabled]="savingLoading"
          (clickEvent)="update()"
          [loading]="savingLoading"
        ></app-common-button-v35>
      </mat-dialog-actions>
    </div>
  </form>
</div>
