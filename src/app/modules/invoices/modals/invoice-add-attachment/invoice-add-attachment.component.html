<div
  class="ocw_man_modal_wrapper category_modal"
  data-backdrop="static"
  data-keyboard="false"
>
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">Add Attachments</div>
  </div>

  <div class="ocw_modal_body">
    <app-drop-zone
      previewHeight="100px"
      accept="*"
      previewWidth="100px"
      (changeEvent)="onSelect($event)"
      [removeSubject]="removeSubject"
      [clearable]="true"
    />
    @if (invalid) {
      <span class="error_msg"> Please select at least one document! </span>
    }
  </div>

  <div class="table_container">
    <table class="ocw-table ocw-table-striped">
      <thead>
        <tr>
          <th>
            <input
              type="checkbox"
              name="sms"
              id="sms"
              (change)="checkAll($event)"
            />
          </th>
          <td>Date</td>
          <td>File</td>
          <td>Action</td>
        </tr>
      </thead>
      <tbody>
        @for (item of attachments; track item; let i = $index) {
          <tr>
            <td>
              <input
                type="checkbox"
                (click)="singlecheck($event, item)"
                id="attachId_{{ item.encrypted_id }}"
                [checked]="item.page_count"
                [(ngModel)]="item.checked"
              />
            </td>
            <td>{{ item.formated_date }}</td>
            <td>
              <a (click)="openAttachment(item.encrypted_id)">
                {{ item.file_name }}
              </a>
            </td>
            <td>
              <img
                class="delete"
                src="../../../../../assets/icon/delete.svg"
                (click)="deleteAttachment(item.encrypted_id)"
                [ngClass]="{ disable: disabled }"
              />
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <div class="ocw_modal_footer">
    <div></div>
    <mat-dialog-actions align="end">
      <button
        (click)="close()"
        type="submit"
        class="ocw-btn ocw-btn-modal-blue add_btn"
      >
        <span>Done</span>
      </button>
    </mat-dialog-actions>
  </div>
</div>
