<div class="px-[6px] pb-[6px]">
  <!-- modal header -->
  <div class="flex justify-between pb-6">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
        <span class="pl-1 font-inter font-semibold text-base pb-0.5"
          >{{injectData ? 'Edit Rules' : 'Add Rules'}}</span
        >
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      ></fa-icon>
    </div>
  </div>
  <!-- modal body start -->
  <div class="flex flex-col gap-5" [formGroup]="rulesForm">
    <div>
      <app-common-input-field placeholder="Rule Name" formControlName="name" />
      <app-control-message-v35 [control]="rulesForm.controls.name" />
    </div>
    <div>
      <app-common-input-field
        placeholder="Description"
        formControlName="description"
      />
      <app-control-message-v35 [control]="rulesForm.controls.description" />
    </div>
    <div>
      <app-drop-down-payee-multi-select
        [placeholder]="'Select Payees'"
        appendTo="body"
        (selectionEvent)="payeeSelectionEvent($event)"
        [selectedPayeeIds]="editedPayeeIds"
      />
      <app-control-message-v35 [control]="rulesForm.controls.payeeIds" />
    </div>
    <div>
      <div
        class="angular-ocw-v35-ng-select-dropdown angular-ocw-v35-multi-select-dropdown"
      >
        <ng-select
          style="width: 200px"
          [items]="invoiceitemList()"
          [multiple]="true"
          [closeOnSelect]="false"
          placeholder="Select Items"
          appendTo="body"
          bindLabel="name"
          bindValue="id"
          formControlName="itemIds"
          (keyup)="search($event)"
          (scrollToEnd)="onScrollToEnd()"
          class="ng-dropdown-panel-v35 text-sm height-5"
        >
          <ng-template
            ng-option-tmp
            let-item="item"
            let-item$="item$"
            let-index="index"
          >
            <input
              id="item-{{ index }}"
              type="checkbox"
              [ngModel]="item$.selected"
              [ngModelOptions]="{ standalone: true }"
            />
            <span class="pl-2">{{ item.name }}</span>
          </ng-template>
        </ng-select>
      </div>
      <app-control-message-v35 [control]="rulesForm.controls.itemIds" />
    </div>
    <div>
      <app-common-input-field
        placeholder="Amount"
        formControlName="unitPrice"
        [isNumberOnly]="true"
        customMask="separator.2"
        [numberType]="'decimal'"
      />
      <app-control-message-v35 [control]="rulesForm.controls.unitPrice" />
    </div>
  </div>
  <!-- modal body end -->
  <div class="flex justify-end gap-3 pt-8">
    <app-common-button-v35
      width="125px"
      mat-dialog-close
      [type]="{ style: 'bordered', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v35
      width="125px"
      [type]="{ style: 'modal', name: 'main' }"
      [text]="injectData ? 'Update' : ' Submit' "
      [disabled]="isSubmit()"
      [loading]="isSubmit()"
      (clickEvent)="submit()"
    />
  </div>
</div>
