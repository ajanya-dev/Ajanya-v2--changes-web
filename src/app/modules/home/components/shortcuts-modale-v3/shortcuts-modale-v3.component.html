<div class="ocw_man_modal_wrapper">
  <!-- modal header -->
  <div class="ocw_modal_header !border-0">
    <div class="ocw_modal_title">Add Shortcuts</div>
    <div class="close_btn" [mat-dialog-close]="false">
      <img
        src="./../../../../assets/icon/close-icon.svg"
        type="image/svg+xml"
        alt="Close Icon"
      />
    </div>
  </div>
  <!-- modal body start -->
  <div class="ocw_modal_body grid grid-cols-3 gap-y-6">
    <div
      class="sub-item flex flex-col items-center justify-evenly w-full"
      *ngFor="let item of shortCutItems; let i = index"
    >
      <div
        class="flex flex-col items-center cursor-pointer"
        (click)="selectOrUnselectItem(i)"
      >
        <div class="icon-btn flex justify-center items-center">
          <i [ngClass]="item.fontawsomeIcon ?? ''" matRipple></i>
        </div>
        <i
          class="sub-icon z-10 rounded-sm"
          [ngClass]="item.enabled ? fontAwesomeCheckBox : fontAwesomeSquare"
        ></i>
      </div>
      <div class="label1">{{ item.label }}</div>
    </div>
  </div>
  <!-- modal body end -->
  <div class="ocw_modal_footer !w-full !border-0">
    <mat-dialog-actions class="!w-full">
      <button
        (click)="add()"
        type="submit"
        [disabled]="loading"
        class="ocw-btn ocw-btn-modal-blue add_btn justify-center items-center gap-2 !w-full"
      >
        <span>Add</span> <span *ngIf="loading" class="loadingSpinner"></span>
      </button>
    </mat-dialog-actions>
  </div>
</div>
