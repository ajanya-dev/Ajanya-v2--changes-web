<div class="flex flex-col">
  <div class="relative top-1 w-80 z-10">
    <app-common-button-v35
      type="list"
      text="New"
      textColorInput="white"
      [isAddIcon]="true"
      (clickEvent)="newBankAccount()"
    ></app-common-button-v35>
  </div>
  <div class="h-[calc(87vh_-_148px)] relative bottom-6">
    <app-v3-data-table
      class="w-full"
      [columnDefs]="columnDefs"
      [tableId]="tableId"
      [frameworkComponents]="frameworkComponents"
      [defaultColumnFields]="columnFields"
    >
    </app-v3-data-table>
  </div>
</div>
@if (payeeDataService.isSyncBank()) {
  <div class="absolute left-0 top-0 h-full w-full overflow-hidden z-10">
    <div class="data_spinner"></div>
  </div>
}
