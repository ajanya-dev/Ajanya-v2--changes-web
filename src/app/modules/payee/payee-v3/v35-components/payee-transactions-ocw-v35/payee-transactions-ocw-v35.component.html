<div class="mb-2 relative">
  <div
    class="absolute top-2 text-main-text-color !text-sm font font-inter font-semibold"
  >
  <div class="v35-small-tabs w-[200px] flex justify-start !pl-0">
    <div
      tabindex="0"
      [ngClass]="{ selected: activeTab === 'send' }"
      role="presentation"
      (click)="toggleAccTab('send')"
      class="h-full cursor-pointer outline-none flex justify-center items-center"
    >
      <div>Send</div>
    </div>
    <div
      role="presentation"
      (click)="toggleAccTab('received')"
      tabindex="0"
      [ngClass]="{
        selected: activeTab === 'received'
      }"
      class="h-full cursor-pointer flex justify-center items-center"
    >
      <div>Received</div>
    </div>
  </div>
  </div>
  @if(activeTab === 'send'){
    <div class="transaction-table">
      <app-v3-data-table
        [columnDefs]="columnDefs"
        [tableId]="tableId"
        [frameworkComponents]="frameworkComponents"
        (bankAccountsOrPayeeExportEvent)="onExportData($event)"
        [filterAndExportLoadingInput]="loading"
      >
      </app-v3-data-table>
    </div>
  }@else {
    <app-payee-received-transactions [payeeEmail]="payeeEmail" />
  }
</div>
