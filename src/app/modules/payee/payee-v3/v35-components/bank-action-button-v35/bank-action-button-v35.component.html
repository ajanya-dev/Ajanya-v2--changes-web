<div
  class="action_btn center flex justify-center items-center"
  [ngClass]="{ '!justify-start': mode() === 'table' }"
>
  <button mat-icon-button [matMenuTriggerFor]="menu" class="!-mt-3">
    <fa-icon
      [icon]="['fas', 'ellipsis-vertical']"
      class="option-icon ellipsis-icon-action"
    ></fa-icon>
  </button>
</div>
<mat-menu #menu="matMenu">
  @for (btn of action; track btn; let i = $index) {
    <button
      mat-menu-item
      (click)="onCellActionClick(btn.id)"
      [matTooltip]="
        btn.id === 'id_sync' ? 'Sync Bank Account with NetSuite' : ''
      "
    >
      @if (btn.icon) {
        <fa-icon [icon]="btn.icon"></fa-icon>
      }
      <span class="ml-2">{{ btn.name }}</span>
    </button>
  }
</mat-menu>
