<div>
  <div class="pt-5 text-base relative min-w-max">
    <div class="absolute top-[57px] left-[100px] flex gap-2">
      <app-common-button-v35
        width="72px"
        type="list"
        backGroundInput="var(--common-red-color)"
        text="Edit"
        [isAddIcon]="true"
        [icon]="['fas', 'edit']"
        (clickEvent)="onEdit()"
        [ngClass]="{
          'pointer-events-none opacity-40': !isRowSelected || isMutliRowSelected
        }"
      ></app-common-button-v35>
      <app-common-button-v35
        width="72px"
        type="list"
        backGroundInput="var(--common-red-color)"
        text="Delete"
        [isAddIcon]="true"
        [icon]="['fas', 'trash']"
        (clickEvent)="onDelete()"
        [ngClass]="{ 'pointer-events-none opacity-40': !isRowSelected }"
      ></app-common-button-v35>
      <app-common-button-v35
        appWhiteLabel
        shownIf="isCompassRequirement"
        type="list"
        width="130px"
        text="ACH Invite Email"
        [ngClass]="{
          'pointer-events-none opacity-40': !isRowSelected
        }"
        (clickEvent)="openAchInviteModal()"
      >
      </app-common-button-v35>
    </div>
    <div class="absolute top-5 right-7 flex justify-end items-end" appWhiteLabel hiddenIf="isCSNHCRequirement">
      <div
        class="h-full flex-1 flex justify-end items-center gap-4 text-sm text-main-text-color font-semibold font-roboto"
      >
        <div
          tabindex="0"
          role="presentation"
          (click)="openNecFormModal()"
          class="text-common-green-color cursor-pointer flex justify-center items-center p-1 px-2 hover:shadow-common-button ocw-btn"
        >
          <fa-icon [icon]="['fas', 'file']" class="mr-2 text-md"></fa-icon>
          Generate Form 1099
        </div>
        <div
          tabindex="0"
          role="presentation"
          (click)="onMerge()"
          class="text-common-green-color cursor-pointer flex justify-center items-center p-1 px-2 hover:shadow-common-button ocw-btn"
        >
          <fa-icon
            [icon]="['fas', 'code-merge']"
            class="mr-2 text-md"
          ></fa-icon>
          Merge
        </div>
        <div
          tabindex="0"
          role="presentation"
          (click)="import()"
          class="text-common-green-color cursor-pointer flex justify-center items-center p-1 px-2 hover:shadow-common-button ocw-btn"
          appWhiteLabel
          shownIf="isThirdPartyImportEnabled"
        >
          <fa-icon
            [icon]="['fas', 'arrow-down-to-line']"
            class="mr-1 text-common-green-color"
          ></fa-icon
          >Import
        </div>
        <div
          class="import-dropdown"
          appWhiteLabel
          hiddenIf="isThirdPartyImportEnabled"
        >
          <div
            class="check-option-container text-common-green-color p-1 px-2 hover:shadow-common-button ocw-btn"
            matTooltip="Import {{ whiteLabelName }} {{
              !isWhiteLabel ? 'either' : ''
            }} from an Excel/CSV file{{
              !isWhiteLabel ? ' or from third-party applications.' : '.'
            }}"
          >
            <button
              class="ocw-btn flex justify-center items-center gap-[5px]"
              [matMenuTriggerFor]="printBtnMenu"
              (click)="importDropDown = true"
            >
              <fa-icon
                [icon]="['fas', 'arrow-down-to-line']"
                class="text-common-green-color"
              ></fa-icon
              >Import
              <fa-icon
                [icon]="['fas', importDropDown ? 'caret-up' : 'caret-down']"
              ></fa-icon>
            </button>
          </div>
          <mat-menu #printBtnMenu="matMenu" (closed)="onMatMenuClosed()">
            <button
              class="ocw-btn ocw-btn-light-blue"
              mat-menu-item
              (click)="import()"
            >
              <fa-icon
                [icon]="['fas', 'table']"
                class="mr-2 text-lg common-font-color"
              ></fa-icon>
              <span class="common-font-color whitespace-nowrap">
                From Excel or CSV
              </span>
            </button>
            @if (env.env_id === "compass") {
              <button
                class="ocw-btn ocw-btn-light-blue text-sm"
                mat-menu-item
                (click)="importFromNetSuite()"
              >
                <fa-icon
                  [icon]="['fas', 'grid-2']"
                  class="mr-3 text-lg common-font-color"
                ></fa-icon>
                <span class="common-font-color whitespace-nowrap"
                  >From NetSuite</span
                >
              </button>
            }
          </mat-menu>
        </div>
      </div>
    </div>
    <div class="table-div w-full px-5 h-full overflow-hidden">
      <app-v3-data-table
        class="overflow-hidden"
        [dynamicHeaderText]="whiteLabelName"
        [dynamicHeaderButtonColor]="'blue'"
        [dynamicHeaderButtonRoute]="'newPayee'"
        [dynamicHeaderButtonText]="'New'"
        [buttonForModal]="true"
        [iconClass]="newButtonIcon"
        (modalOpenClick)="openAddPayee()"
        [columnDefs]="columnDefs"
        [tableId]="tableId"
        [frameworkComponents]="frameworkComponents"
      >
      </app-v3-data-table>
    </div>
  </div>
</div>
@if (payeeDataService.isImportPayee()) {
  <div class="absolute left-0 top-0 h-full w-full overflow-hidden z-10">
    @if (payeeDataService.importProgress() !== null) {
      <div
        class="absolute left-1/2 top-1/2 w-[280px] max-w-[80%] -translate-x-1/2 -translate-y-1/2 rounded-lg bg-[var(--main-background-color)] p-4 shadow-lg"
      >
        <div class="mb-2 flex items-center justify-between text-sm common-font-color">
          <span>Importing from NetSuite</span>
          <span class="font-semibold">{{ payeeDataService.importProgress() }}%</span>
        </div>
        <mat-progress-bar
          mode="determinate"
          [value]="payeeDataService.importProgress()!"
        ></mat-progress-bar>
      </div>
    } @else {
      <div class="data_spinner"></div>
    }
  </div>
}
