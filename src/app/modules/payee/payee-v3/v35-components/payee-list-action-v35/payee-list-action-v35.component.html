<div class="action_btn center flex justify-center items-center">
  <fa-icon
    [icon]="['fas', 'eye']"
    class="pl-2 cursor-pointer text-common-dark-blue-color view-icon-action"
    role="presentation"
    (click)="onViewClick()"
  ></fa-icon>
  <button mat-icon-button [matMenuTriggerFor]="menu" class="!-mt-3">
    <fa-icon
      [icon]="['fas', 'ellipsis-vertical']"
      class="option-icon ellipsis-icon-action"
    ></fa-icon>
  </button>
</div>
<mat-menu #menu="matMenu">
  @for (btn of actions; track btn) {
  <button mat-menu-item (click)="onCellActionClick(btn.id)" [matTooltip]="btn?.tooltip"
    [disabled]="payeeDataService.updateSinglePayee() && btn.name === 'Update'">
    <fa-icon [icon]="btn.icon"
      [animation]="payeeDataService.updateSinglePayee() && btn.name === 'Update' ? 'spin' : undefined" />
    <span class="ml-2">{{ btn.name }}</span>
  </button>
  }
</mat-menu>
