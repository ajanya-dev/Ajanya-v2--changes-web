<div class="flex items-center h-full">
  <button
    mat-icon-button
    [matMenuTriggerFor]="menu"
    class="!p-0 flex items-center"
  >
    <fa-icon [icon]="['fas', 'ellipsis-vertical']" class="text-sm"></fa-icon>
  </button>
</div>
<mat-menu #menu="matMenu">
  @for (btn of buttons; track btn) {
    <button mat-menu-item (click)="onCellActionClick(btn.id)">
      @if (btn.icon) {
        <i [class]="btn.icon"></i>
      }
      <span class="ml-2">{{ btn.name }}</span>
    </button>
  }
</mat-menu>
