<!-- No overflow-x-scroll here: the grid scrolls its columns internally, and a
     forced scroll container lets the O17 empty state overflow the page width
     with a stray horizontal scrollbar under it. -->
<div class="flex h-full w-full flex-col">
  <app-v4-data-table
    class="flex-1 min-h-0"
    [showActionButtonContainer]="false"
    [columnDefs]="activeColumnDefs"
    [tableId]="tableId"
    [defaultDisabledColumn]="['payee_email']"
    [frameworkComponents]="frameworkComponents"
    [headerElements]="headerElements"
    [defaultVisibleColumns]="defaultVisibleFields"
    [paginationCurrentPageNumber]="v3DataTableService.CurrentPage ?? 1"
    [useCustomEmptyState]="true"
    [emptyStateConfig]="emptyStateConfig()"
    (emptyStateActionClick)="onEmptyStateAdd()"
    (headerButtonEvent)="onHeaderButtonEvent($event)"
    (rowClicked)="onRowClick($event)"
  >
  </app-v4-data-table>
</div>
