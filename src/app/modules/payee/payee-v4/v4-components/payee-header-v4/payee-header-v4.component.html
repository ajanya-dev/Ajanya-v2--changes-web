<app-v4-page-header
  [title]="payeeV4State.pageTitle()"
  [subtitle]="payeeV4State.pageSubtitle()"
>
  <div headerActions class="relative import-btn" #importDropdownRef>
    <app-common-button-v4
      [type]="{ name: 'v2-1', size: 'md', style: 'navy' }"
      [text]="'Import'"
      [isAddIcon]="true"
      [lucideIcon]="'download'"
      [lucideIconSize]="15"
      [toolTip]="payeeV4State.importButtonTooltip()"
      (clickEvent)="toggleImportDropdown()"
    />

    @if (showImportDropdown) {
      <div
        class="absolute right-0 top-full mt-1 bg-v4-popup-background-color border border-v4-border-color rounded-lg shadow-lg py-1 z-50 min-w-[160px]"
      >
        <!-- Upload CSV -->
        <button
          class="w-full flex items-center gap-2 px-3 py-2 text-xs text-v4-main-text-color hover:bg-v4-hover-color transition-colors"
          (click)="openImportModal()"
        >
          <lucide-icon name="upload" [size]="14" />
          Upload CSV
        </button>
        <!-- From Hubspot (only shown when HubSpot is connected) -->
        @if (isHubSpotImportEnabled()) {
          <button
            class="w-full flex items-center gap-2 px-3 py-2 text-xs text-v4-main-text-color hover:bg-v4-hover-color transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
            [disabled]="isImportingHubSpot()"
            (click)="importFromHubSpot()"
          >
            <img
              src="https://cdn.brandfetch.io/hubspot.com/icon"
              alt="Hubspot"
              class="w-3.5 h-3.5 rounded-sm object-contain"
            />
            {{ isImportingHubSpot() ? "Importing..." : "From Hubspot" }}
          </button>
        }
        <!-- From Clio (only shown when Clio is connected) -->
        @if (isClioImportEnabled()) {
          <button
            class="w-full flex items-center gap-2 px-3 py-2 text-xs text-v4-main-text-color hover:bg-v4-hover-color transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
            [disabled]="isImportingClio()"
            (click)="importFromClio()"
          >
            <img
              src="https://cdn.brandfetch.io/clio.com/icon"
              alt="Clio"
              class="w-3.5 h-3.5 rounded-sm object-contain"
            />
            {{ isImportingClio() ? "Importing..." : "From Clio" }}
          </button>
        }
      </div>
    }
  </div>
  <app-common-button-v4
    headerActions
    [type]="{ name: 'v2-1', size: 'md', style: 'primary' }"
    [text]="payeeV4State.addButtonLabel()"
    [isAddIcon]="true"
    [lucideIcon]="'plus'"
    [lucideIconSize]="15"
    [toolTip]="payeeV4State.addButtonTooltip()"
    (clickEvent)="openAddPayee()"
  />
</app-v4-page-header>
