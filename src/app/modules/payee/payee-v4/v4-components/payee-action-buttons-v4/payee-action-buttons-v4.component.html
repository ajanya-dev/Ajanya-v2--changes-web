<div class="payee-cta-cell" (click)="$event.stopPropagation()">
  <app-common-button-v4
    [type]="sendType"
    [text]="'Send'"
    [lucideIcon]="'send'"
    [lucideIconSize]="14"
    [toolTip]="'Send a payment to this payee'"
    [disableHoverEffect]="false"
    (clickEvent)="onSend()"
  />
  <app-common-button-v4
    [type]="receiveType"
    [text]="'Receive'"
    [lucideIcon]="'download'"
    [lucideIconSize]="14"
    [toolTip]="'Request a payment from this payee'"
    [disableHoverEffect]="false"
    (clickEvent)="onReceive()"
  />
</div>
