<div class="request-modal-wrapper">
  <!-- Header -->
  <div
    class="flex justify-between items-center px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color rounded-t-[20px]"
  >
    <div class="flex flex-col">
      <h2 class="text-lg font-semibold text-v4-main-text-color font-funnel m-0">
        Send Request To Add
      </h2>
      <p class="text-xs text-v4-subtle-text-color font-peridot mt-0.5">
        Request vendor to add bank account details
      </p>
    </div>
    <div
      role="button"
      tabindex="0"
      (click)="close()"
      (keydown.enter)="close()"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon name="x" [size]="20" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- Body -->
  <div class="p-6 bg-v4-popup-background-color">
    <div class="flex flex-col gap-4" [formGroup]="form">
      <!-- Email -->
      <label
        class="flex items-start gap-3 p-4 rounded-xl border cursor-pointer transition-colors"
        [class]="
          form.controls.emailCheck.value
            ? 'border-v4-primary-brand-color bg-v4-main-background-color'
            : 'border-v4-border-color bg-v4-popup-background-color hover:border-v4-tertiary-text-color'
        "
      >
        <input
          type="checkbox"
          formControlName="emailCheck"
          class="mt-1 w-[18px] h-[18px] min-w-[18px] rounded accent-v4-primary-brand-color cursor-pointer"
        />
        <div class="flex-1 min-w-0">
          <div class="mt-2">
            <app-common-input-v4
              [fieldLabel]="'Email Address'"
              [placeholder]="'Email Address'"
              [type]="'email'"
              [isFieldRequired]="false"
              [fieldHeight]="'44px'"
              formControlName="payeeEmail"
              [control]="form.controls.payeeEmail"
            />
          </div>
        </div>
      </label>

      <!-- Phone -->
      <label
        class="flex items-start gap-3 p-4 rounded-xl border cursor-pointer transition-colors"
        [class]="
          form.controls.phoneCheck.value
            ? 'border-v4-primary-brand-color bg-v4-main-background-color'
            : 'border-v4-border-color bg-v4-popup-background-color hover:border-v4-tertiary-text-color'
        "
      >
        <input
          type="checkbox"
          formControlName="phoneCheck"
          class="mt-1 w-[18px] h-[18px] min-w-[18px] rounded accent-v4-primary-brand-color cursor-pointer"
        />
        <div class="flex-1 min-w-0">
          <span
            class="text-xs font-semibold text-v4-secondary-text-color font-peridot uppercase tracking-wider"
          >
            Phone Number
          </span>
          <div class="mt-2">
            <app-phone-input-v4
              formControlName="payeePhone"
              [control]="form.controls.payeePhone"
              [isFieldRequired]="false"
              [fieldHeight]="'44px'"
            ></app-phone-input-v4>
          </div>
        </div>
      </label>
    </div>
  </div>

  <!-- Footer -->
  <div
    class="flex justify-end gap-3 px-6 py-4 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      [type]="{ style: 'outline', name: 'main' }"
      [text]="'Cancel'"
      [minWidth]="'90px'"
      (clickEvent)="close()"
    />
    <app-common-button-v4
      [type]="{ style: 'primary', name: 'main' }"
      [text]="'Send Request'"
      [minWidth]="'120px'"
      [loading]="loading()"
      [disabled]="loading()"
      [lucideIcon]="'send'"
      (clickEvent)="onSubmit()"
    />
  </div>
</div>
