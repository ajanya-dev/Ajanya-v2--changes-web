<div>
  <!-- modal header -->
  <div
    class="flex justify-between items-center px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <h1 class="text-lg font-bold text-v4-main-text-color font-funnel">
      {{ title }}
    </h1>
    <div
      role="button"
      tabindex="0"
      (click)="close()"
      (keydown.enter)="close()"
      (keydown.space)="close(); $event.preventDefault()"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon name="x" [size]="20" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body -->
  <div class="px-6 py-5 bg-v4-tertiary-background-color">
    <!-- File Select -->
    <p class="text-sm font-semibold text-v4-secondary-text-color mb-2">
      Select File: <span class="text-v4-common-red-color">*</span>
    </p>
    <div class="flex items-center gap-3">
      <div
        class="flex-1 px-3 py-2 bg-v4-secondary-background-color border border-v4-input-border-color rounded-lg text-sm text-v4-tertiary-text-color truncate"
      >
        {{ fileName() }}
      </div>
      <label
        class="inline-flex items-center gap-1.5 px-6 py-2 text-sm font-semibold text-v4-main-text-color bg-v4-secondary-background-color border border-v4-input-border-color rounded-lg cursor-pointer hover:bg-v4-tertiary-background-color transition-colors whitespace-nowrap"
      >
        <lucide-icon name="upload" [size]="16" />
        BROWSE
        <input
          type="file"
          accept=".csv,.xlsx,.xls"
          class="hidden"
          (change)="onFileSelected($event)"
        />
      </label>
    </div>

    <!-- Info Notes -->
    <div class="flex flex-col gap-2 mt-4 mb-4">
      <div
        class="flex items-center gap-1.5 text-sm text-v4-secondary-text-color"
      >
        <lucide-icon
          name="chevron-right"
          [size]="16"
          class="text-v4-primary-brand-bold-color"
        />
        Please make sure date format is
        <span class="font-semibold">(mm/dd/yyyy or mm/dd/yy)</span>
      </div>
      <div
        class="flex items-center gap-1.5 text-sm text-v4-secondary-text-color"
      >
        <lucide-icon
          name="chevron-right"
          [size]="16"
          class="text-v4-primary-brand-bold-color"
        />
        We only support <span class="font-semibold">csv/xlsx</span> file
      </div>
    </div>

    <!-- Download Sample -->
    <button
      class="flex items-center gap-1.5 text-sm font-semibold text-v4-primary-brand-bold-color hover:opacity-80 disabled:opacity-40 disabled:cursor-not-allowed mb-2"
      (click)="downloadSampleFile()"
      [disabled]="isSampleFileLoading()"
    >
      <lucide-icon name="download" [size]="16" />
      Download Sample File
    </button>
  </div>

  <!-- modal footer -->
  <div
    class="flex justify-end items-center gap-3 px-6 py-4 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
      (clickEvent)="close()"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Import"
      [loading]="isLoading()"
      (clickEvent)="import()"
    />
  </div>
</div>
