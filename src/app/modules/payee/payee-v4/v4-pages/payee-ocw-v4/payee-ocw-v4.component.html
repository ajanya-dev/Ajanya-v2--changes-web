<div class="payee-v4-page">
  <div class="w-full mb-3">
    <app-payee-header-v4 />
  </div>
  <!--
    Recreate the data table whenever the page type changes. The v4 data table
    resolves its columns once on init and does not react to runtime columnDefs
    changes, so the per-type column set (e.g. the "Type" column is hidden on the
    Customers page) is applied correctly only on a fresh instance.
  -->
  @for (type of [payeeV4State.pageType()]; track type) {
    <app-payee-data-table-v4 />
  }
  <app-payee-details-v4 />
</div>
