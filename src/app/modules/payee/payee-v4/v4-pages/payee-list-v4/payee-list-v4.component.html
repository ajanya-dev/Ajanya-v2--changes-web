<div class="payee-v4-page">
  <div class="w-full">
    <app-payee-header-v4 />
  </div>
  <!--
    Same tab row as Payments Out: the strip suppresses its own border with
    [borderNone] and the rule goes on this wrapper instead, so it spans the
    full row rather than stopping at the last tab. `items-end` keeps the active
    tab's 2px indicator sitting on that rule.
    min-h keeps the row from jumping while the tab strip resolves.
  -->
  <div
    class="mt-5 mb-3 flex items-end min-h-[35px] border-b border-v4-border-color"
  >
    <app-common-tab-v4
      class="flex-1"
      [tabs]="tabs"
      [activeTab]="activeTab()"
      variant="underline"
      size="xs"
      [borderNone]="true"
      (tabChange)="onTabChange($event)"
    />
  </div>
  <!--
    Recreate the data table whenever the active tab changes. The v4 data table
    resolves its columns once on init and does not react to runtime columnDefs
    changes, so the per-tab column set (e.g. the "Type" column appears only on
    the "All" tab) is applied correctly only on a fresh instance.
  -->
  @for (tab of [activeTab()]; track tab) {
    <app-payee-data-table-v4 />
  }
  <app-payee-details-v4 />
</div>
