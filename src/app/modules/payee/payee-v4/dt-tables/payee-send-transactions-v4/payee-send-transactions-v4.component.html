@if (hasPayeeScope()) {
  <div class="flex h-full w-full flex-col">
    <app-v4-data-table
      class="flex-1 min-h-0"
      [showActionButtonContainer]="false"
      [columnDefs]="columnDefs"
      [tableId]="tableId"
      [defaultDisabledColumn]="['description']"
      [frameworkComponents]="frameworkComponents"
      [paginationPageSize]="50"
      [rowSelection]="'single'"
      [useCustomEmptyState]="true"
      [emptyStateScopeKey]="payeeId"
      [emptyStateConfig]="{
        icon: 'send',
        title: 'No transactions yet',
        description: 'Payments you send to this payee will appear here',
        buttonText: '',
        compact: true
      }"
      (bankAccountsOrPayeeExportEvent)="onExportData($event)"
      [filterAndExportLoadingInput]="loading"
    />
  </div>
} @else {
  <!--
    Without a payee to scope by there is no filter payload, and the grid's
    getTableData() bails before requesting — a blank body under the stale
    default row count. Render the empty state directly instead.
  -->
  <app-v4-data-table-empty-state
    icon="send"
    title="No transactions yet"
    description="Payments you send to this payee will appear here"
    [compact]="true"
  />
}
