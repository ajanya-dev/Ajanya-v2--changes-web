<!-- No forced overflow container: the grid scrolls its own columns, and a
     scroll wrapper lets the O17 empty state push a stray scrollbar under it. -->
<div class="flex h-full w-full flex-col">
  <app-v4-data-table
    class="flex-1 min-h-0"
    [showActionButtonContainer]="false"
    [showFilterBar]="false"
    [columnDefs]="columnDefs"
    [tableId]="43"
    [defaultDisabledColumn]="['bank_name']"
    [frameworkComponents]="frameworkComponents"
    [additionalPayload]="additionalPayload()"
    [paginationPageSize]="50"
    [rowSelection]="'single'"
    [domLayout]="'autoHeight'"
    [useCustomEmptyState]="true"
    [emptyStateConfig]="emptyStateConfig"
    [emptyStateScopeKey]="payeeId()"
    (emptyStateActionClick)="onEmptyStateAdd()"
  />
</div>
