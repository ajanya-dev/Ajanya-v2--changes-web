<div class="flex flex-col w-full h-full overflow-auto">
  <div class="data-table-wrapper bg-main-background-color flex-1 rounded">
    <div class="px-5 pt-3">
      <app-v3-data-table
        dynamicHeaderText="Invoice"
        [(selectedPanelButton)]="selectedPanelButton"
        [headerElements]="headerElements()"
        [columnDefs]="columnDefs"
        [defaultColumnFields]="columnFields"
        [tableId]="tableId"
        [frameworkComponents]="frameworkComponents"
        (headerButtonEvent)="headerButtonClick($event)"
        [additionalPayload]="{ payeeId, type }"
        [exportConfig]="exportConfig"
      >
      </app-v3-data-table>
    </div>
  </div>
</div>
