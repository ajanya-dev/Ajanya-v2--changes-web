<div class="px-[6px] pb-[6px]">
  <div class="flex justify-between pb-6">
    <div>
      <span class="mt-18 w-full text-base text-main-text-color align-middle flex items-center">
        <span class="pl-1 font-inter font-semibold text-base pb-0.5">ACH Invite Email</span>
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon class="text-secondary-text-color cursor-pointer" [icon]="faXmark"></fa-icon>
    </div>
  </div>
  <div>
    <form [formGroup]="achInviteForm">
      @if(modalData.id?.length === 1){
        <div>
          <app-common-input-field class="opacity-50" placeholder="Email" formControlName="email" [readOnly]="true" />
          <app-control-message-v35 [control]="achInviteForm.controls.email" />
        </div>
      }@else{
        <div class="flex gap-3 items-center">
          <div class="w-7 h-7 rounded-full bg-common-dark-blue-color flex justify-center items-center">
            <fa-icon class="text-main-background-color text-xs" [icon]="faUser" />
          </div>
          <span class="font-inter font-medium text-main-text-color text-sm">Selected {{modalData.id?.length}} payees</span>
        </div>
      }
      <div class="mt-4" [ngClass]="{'skelton':loadingSignal()}">
        <select class="form-select input_style" formControlName="template">
          <option selected disabled value="">Select Template</option>
          @for(item of emailTemplates; track item){
          <option [value]="item.id">{{item.name}}</option>
          }
        </select>
        <app-control-message-v35 [control]="achInviteForm.controls.template" />
      </div>
    </form>
  </div>
  <div class="flex justify-end gap-3 pt-8">
    <app-common-button-v35 [mat-dialog-close]="false" [type]="{style:'bordered', name: 'main' }" text="Cancel"
      width="75px"></app-common-button-v35>
    <app-common-button-v35 [type]="{style:'modal', name: 'main' }" text="Send" width="75px" [loading]="isSubmitSignal()"
      [disabled]="isSubmitSignal() || loadingSignal()" (clickEvent)="submit()"></app-common-button-v35>
  </div>
</div>
