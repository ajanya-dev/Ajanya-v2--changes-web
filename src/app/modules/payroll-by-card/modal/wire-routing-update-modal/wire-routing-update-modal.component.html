<div class="px-[6px] pb-[6px]">
  <!-- modal header -->
  <div class="flex justify-between pb-6">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
        <span class="pl-1 font-inter font-semibold text-base pb-0.5">
          Add Wire Routing Number</span
        >
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      ></fa-icon>
    </div>
  </div>
  <!-- modal body start -->
  <div>
    <div class="mb-4 bg-common-secondary-blue-color p-2 rounded-sm">
      <p>
        <fa-icon
          [icon]="faInfoCircle"
          class="text-common-blue-color mt-1"
        ></fa-icon>
        <span class="text-[13px] font-inter text-main-text-color">
          The routing number you provided{{
            bankAc ? " for " + bankAc.name + " - " + bankAc.accountNumber : ""
          }}
          is not valid for wire transfers. Please provide your wire routing
          number, we will use this routing number to transfer money to your
          account.
        </span>
      </p>
    </div>
    <div class="grid grid-cols-1 gap-2">
      <div class="single_input">
        <input
          type="text"
          [formControl]="wireRoutingNumber"
          (keypress)="utils.numberOnly($event, 'numeric')"
          class="input_style"
          placeholder=" "
          autofocus="off"
          maxlength="9"
        />
        <span class="floating_label_field"
          >Wire Routing Number <span class="required">*</span></span
        >
        <app-control-message
          [control]="wireRoutingNumber"
        ></app-control-message>
      </div>
    </div>
  </div>
  <!-- modal body end -->
  <div class="flex justify-end gap-3 pt-8">
    <app-common-button-v35
      [mat-dialog-close]="false"
      width="65px"
      textColorInput="var(--common-dark-blue-color)"
      [type]="{ style: 'bordered', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v35
      [type]="{ style: 'modal', name: 'main' }"
      text="Save"
      width="65px"
      [loading]="isWireUpdating()"
      (clickEvent)="addWireRouting()"
    ></app-common-button-v35>
  </div>
</div>
