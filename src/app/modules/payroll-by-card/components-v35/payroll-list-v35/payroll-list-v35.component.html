<div class="main-container h-full p-0">
  <div class="block laptop:hidden w-full p-5">
    <div class="cards-list flex-1 flex flex-col h-full">
      <!-- shown only screen size less than laptop -->
      <div class="laptop:hidden">
        <app-v35-common-dropdown
          [loading]="loading"
          [config]="{
            placeholder: loading
              ? 'Loading..'
              : (selectedAccount?.name | truncate: 20) ??
                'Select Payroll Account',
            enableAddNew: true,
            displayField: 'name',
            style: {
              size: 3,
              enableLabelIcon: true,
              labelIconData: {
                icon_fa: ['fas', 'users'],
                color: 'secondary-text-color'
              }
            },
            iconField: 'icon',
            commons: {
              iconColor: {
                background: 'secondary-background-color',
                text: 'secondary-text-color'
              },
              iconData: ['fas', 'users']
            }
          }"
          [listData]="payrollAppData ?? []"
          (buttonClick)="openModal()"
          (selectClose)="selectPayrollAccount(jsonParse($event))"
        ></app-v35-common-dropdown>
      </div>
    </div>
  </div>

  <div
    class="w-full min-w-[230px] hidden laptop:flex laptop:flex-col text-base h-full"
  >
    <app-list-header-v35
      buttonText="Connect New"
      [isAddButton]="true"
      header="Payroll Apps"
      [isSwitchOption]="false"
      [isTabChangeOption]="false"
      (searchEvent)="searchPayroll($event)"
      (addButtonClickEvent)="openModal()"
      addButtonTextColor="white"
    ></app-list-header-v35>
    <div class="cards-list flex-1 flex flex-col h-full mb-3 overflow-y-auto">
      <div class="h-full">
        <!-- shown only screen size larger than than laptop -->
        <div
          class="h-full hidden laptop:flex laptop:flex-col border-t border-input-border-color"
        >
          <div class="flex flex-col h-full overflow-y-auto thin-scroll">
            <ng-container *ngIf="payrollAppData.length > 0">
              <button
                class="border-b hover:bg-secondary-background-color"
                *ngFor="
                  let app of payrollAppData | searchFilter: payrollSearchInput;
                  trackBy: payrollAppDataTrackByFn
                "
                [ngClass]="
                  app?.id === selectedAccount?.id
                    ? 'selected-card text-secondary-background-color border border-common-blue-color rounded'
                    : 'border-input-border-color'
                "
                (click)="selectPayrollAccount(app)"
              >
                <div class="pl-4 pr-3 py-2 flex gap-3 items-center">
                  <div class="flex items-center justify-center">
                    <div
                      class="flex justify-center items-center h-7 w-7 bg-secondary-background-color rounded-full"
                    >
                      <fa-icon
                        *ngIf="app.manual"
                        class="text-secondary-text-color text-xs"
                        [icon]="['fas', 'users']"
                      ></fa-icon>
                      <div>
                        <img
                          class="h-7 w-7 object-contain"
                          [src]="app.icon"
                          alt=""
                          *ngIf="!app.manual"
                        />
                      </div>
                    </div>
                  </div>
                  <div class="w-full">
                    <h1
                      class="font-roboto text-xs font-medium text-main-text-color text-left"
                    >
                      {{ (app.name | truncate: 15) ?? "_" }}
                    </h1>
                  </div>
                  <div class="flex justify-center">
                    <button
                      class="w-4"
                      matTooltip="Actions"
                      [matMenuTriggerFor]="menu"
                      aria-label="Example icon-button with a menu"
                    >
                      <fa-icon
                        class="text-secondary-text-color text-base"
                        [icon]="['fas', 'ellipsis-vertical']"
                      ></fa-icon>
                    </button>
                    <mat-menu #menu="matMenu" class="mat-menu-card-edit">
                      <button mat-menu-item (click)="disconnect(app)">
                        <span class="common-font-color">Disconnect</span>
                      </button>
                      <button
                        (click)="addGustoCompany()"
                        mat-menu-item
                        *ngIf="app.name.match(gustoRegex)"
                      >
                        Add Company
                      </button>
                    </mat-menu>
                  </div>
                </div>
              </button>
              <div
                class="h-full w-full flex items-center justify-center"
                *ngIf="
                  (payrollAppData | searchFilter: payrollSearchInput | json) ===
                  '[]'
                "
              >
                Sorry! no results found.
              </div>
            </ng-container>
            <ng-container *ngIf="payrollAppData.length === 0">
              <app-common-list-skelton
                [items]="14"
                *ngIf="loading"
              ></app-common-list-skelton>
              <div
                *ngIf="loading === false"
                class="h-full w-full flex items-center justify-center"
              >
                Sorry! No Items Found.
              </div>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
