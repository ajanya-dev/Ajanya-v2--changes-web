<div class="ocw_man_modal_wrapper">
  <!-- modal header -->
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">Enter Client ID</div>
  </div>
  <!-- modal body start -->
  <div class="ocw_modal_body relative">
    <div class="single_input">
      <input
        type="text"
        class="input_style"
        placeholder=" "
        maxlength="22"
        [formControl]="displayID"
      />
      <span class="floating_label_field"
        >Client ID<span class="required">*</span></span
      >
      <app-control-message [control]="displayID"></app-control-message>
    </div>
    <div class="flex justify-end ">
      <span (click)="getClientId()" class="font-inter text-common-blue-color !text-[12px] mt-1 underline cursor-pointer">How to get Client ID</span>
    </div>
  </div>
  <!-- modal body end -->
  <div class="ocw_modal_footer">
    <mat-dialog-actions align="end">
      <button
        mat-dialog-close
        class="ocw-btn ocw-btn-modal-bordered"
        (click)="close()"
      >
        Cancel
      </button>
      <button
        type="submit"
        class="ocw-btn ocw-btn-modal-blue add_btn"
        [disabled]="isLoading()"
        (click)="connectToPaychex()"
      >
        @if (isLoading()) {
          <span class="loadingSpinner"></span>
        }
        <span>Confirm</span>
      </button>
    </mat-dialog-actions>
  </div>
</div>
