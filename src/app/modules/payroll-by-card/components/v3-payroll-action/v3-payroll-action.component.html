<div class="mr-1">
  @if (status === 0 || status === 3) {
    <button
      class="px-3 py-1 text-sm payroll-button ml-4"
      (click)="runPayroll()"
    >
      Confirm Payment
    </button>
  } @else {
    <span
      [ngClass]="statusText?.toLowerCase()"
      class="px-3 py-1 rounded-md font-medium ml-4"
      >{{ statusText }}</span
    >
  }
  <fa-icon
    [icon]="faEye"
    [matTooltip]="'View Statement'"
    class="ml-4 cursor-pointer"
    (click)="openConfirmationModal('View')"
  ></fa-icon>
  @if (isManual) {
    @if (isDeleted && selectedPayrollId === commonTransactionTableRowData.id) {
      <fa-icon
        [icon]="faSpinner"
        [animation]="'spin'"
        class="text-common-red-color pl-2"
      />
    } @else {
      <fa-icon
        [ngClass]="{
          '!cursor-pointer !opacity-100': status === 0 || status === 3
        }"
        [icon]="faTrash"
        class="cursor-default opacity-50 text-common-red-color pl-2"
        (click)="deletePayroll(commonTransactionTableRowData.id)"
      />
    }
  }
</div>
