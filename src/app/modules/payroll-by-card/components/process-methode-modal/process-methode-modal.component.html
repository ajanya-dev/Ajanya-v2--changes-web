<div class="ocw_man_modal_wrapper category_modal">
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">Payroll Settings</div>
    <div>
      <button class="close_btn" (click)="close()">
        <img
          class="w-3"
          src="../../../../../assets/icon/close-icon.svg"
          type="image/svg+xml"
          alt="Close Icon"
        />
      </button>
    </div>
  </div>
  <div class="">
    <div class="py-3 mt-2">
      <mat-radio-group
        [(ngModel)]="accountRefill"
        (change)="showErrorMsg = false"
      >
        <div class="pb-2">
          <mat-radio-button class="my-1 header-1" [value]="0">
            Auto Process
          </mat-radio-button>
        </div>
        <div class="pb-2">
          <mat-radio-button class="my-1 header-1" [value]="1">
            Partially Charge
          </mat-radio-button>
          <form [formGroup]="amountForm">
            <div class="single_input mt-2" *ngIf="accountRefill === 1">
              <input
                class="input_style"
                placeholder=" "
                formControlName="presetAmount"
                maxlength="7"
                mask="separator.2"
                thousandSeparator=","
                (keypress)="utils.numberOnly($event, 'decimal')"
              />
              <span class="floating_label_field"
                >Preset Amount($)<span class="required">*</span></span
              >
            </div>
            <p class="amount-error" *ngIf="showErrorMsg && accountRefill === 1">
              Please enter a valid amount
            </p>
          </form>
        </div>
        <div class="pb-2">
          <mat-radio-button class="my-1 header-1" [value]="2">
            Each time, I decide
          </mat-radio-button>
        </div>
      </mat-radio-group>
    </div>
    <div class="flex justify-center">
      <button
        type="submit"
        class="ocw-btn ocw-btn-modal-blue mt-2"
        (click)="setProcessMethod()"
      >
        Save
      </button>
    </div>
  </div>
</div>
