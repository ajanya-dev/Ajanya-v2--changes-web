 <div>
 <ng-container
      *ngIf="
        (status === 0 || status === 3) && !editMode;
        else disbaledAmountField
      "
    >
      <div class="flex gap-2">
        <input
          class="input_style"
          placeholder=" "
          maxlength="15"
          mask="separator.2"
          thousandSeparator=","
          [(ngModel)]="amount"
          (input)="updateAmount()"
          (ngModelChange)="updateFee($event)"
        />
        <div class="flex items-center">
          <fa-icon
            class="text-common-green-color cursor-pointer"
            *ngIf="filedName && (status === 0 || status === 3)"
            [icon]="['fas', 'check']"
            (click)="onUpdate()"
          ></fa-icon>
        </div>
      </div>
    </ng-container>
    <ng-template #disbaledAmountField>
      <div class="flex gap-1">
        <span>{{ amount | currency}}</span>
        <fa-icon
          *ngIf="filedName && (status === 0 || status === 3) && isManual"
          class="text-common-blue-color cursor-pointer"
          [ngClass]="{ 'cursor-default': isLoading }"
          [icon]="['fas', 'pen-to-square']"
          (click)="onEdit()"
        ></fa-icon>
      </div>
    </ng-template>
  </div>
