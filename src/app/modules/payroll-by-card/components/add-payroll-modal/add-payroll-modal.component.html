<div class="ocw_man_modal_wrapper add_bank_modal">
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">Enter Payroll details</div>
    <div>
      <button class="close_btn" (click)="close()">
        <img
          class="w-3"
          src="../../../../../assets/icon/close-icon.svg"
          type="image/svg+xml"
          alt="Close Icon"
        />
      </button>
    </div>
  </div>
  <form [formGroup]="payrollForm" (ngSubmit)="submit()">
    <div class="ocw_modal_body">
      <div class="payroll-details">
        <div class="single_input mb-5">
          <input
            type="text"
            formControlName="grossPay"
            class="input_style require_fields"
            id="grossPay"
            maxlength="15"
            mask="separator.2"
            thousandSeparator=","
            placeholder=" "
          />
          <label class="floating_label_field" for="grossPay"
            >Payroll Amount<span class="required">*</span></label
          >
          <app-control-message
            [control]="payrollForm.controls.grossPay"
            labelName="This field is required"
          ></app-control-message>
        </div>
        <div class="single_input">
          <input
            type="date"
            formControlName="checkDate"
            class="input_style require_fields"
            id="checkDate"
            maxlength="60"
            placeholder=" "
            [min]="minDate"
          />
          <label class="floating_label_field" for="checkDate"
            >Payroll Check Date <span class="required">*</span></label
          >
          <app-control-message
            [control]="payrollForm.controls.checkDate"
            labelName="This field is required"
          ></app-control-message>
        </div>
        <div class="upload-document-wrapper">
          <div class="upload-card">
            <div class="file_input_div">
              <app-common-upload-button-v35
                buttonText="Upload your payroll summary"
                buttonHeader="Payroll Statement"
                [acceptedFileTypes]="[
                  '.pdf',
                  '.xls',
                  '.xlsx',
                  '.rtf',
                  '.doc',
                  '.docx',
                  '.txt',
                  '.jpg',
                  '.png'
                ]"
                (selectedFileEvent)="filePicked($event)"
              >
              </app-common-upload-button-v35>
              <span class="error_msg pb-2" *ngIf="showError">
                Payroll Statement is Required
              </span>
            </div>
          </div>
        </div>
        <div class="pt-4">
          <div class="flex justify-center p-2.5">
            <p class="text-xs font-semibold text-secondary-text-color">
              Payroll summary sample files
            </p>
          </div>
          <div class="flex items-center justify-center gap-8">
            <div class="m-1 flex" *ngFor="let sample of samplePayrollDetails">
              <img [ngClass]="sample.width" [src]="sample.logo" alt="logo" />
              <div class="flex items-center">
                <a
                  *ngIf="!loading; else loadingContent"
                  [href]="sample.samplePdf"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  <fa-icon
                    class="text-common-blue-color cursor-pointer px-1"
                    [icon]="['fas', 'arrow-down-to-line']"
                  ></fa-icon>
                </a>
                <ng-template #loadingContent>
                  <fa-icon
                    *ngIf="loading"
                    class="text-common-blue-color cursor-pointer px-1"
                    [icon]="['fas', 'spinner-third']"
                    [spin]="true"
                  ></fa-icon>
                </ng-template>
                <a
                  [href]="sample.helpVideo"
                  *ngIf="sample.helpVideo"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  <img
                    class="cursor-pointer h-[18px]"
                    src="/assets/images/youtube.svg"
                    alt="youtube"
                  />
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="ocw_modal_footer">
      <mat-dialog-actions align="end">
        <button
          type="submit"
          class="ocw-btn ocw-btn-modal-blue add_btn"
          [disabled]="btnDisable"
        >
          <span>{{ !btnDisable ? "Add" : "Adding" }}</span>
          <span *ngIf="btnDisable" class="loadingSpinner"></span>
        </button>
      </mat-dialog-actions>
    </div>
  </form>
</div>
