<div class="px-[6px] pb-[6px]">
  <!-- modal header -->
  <div class="flex justify-between pb-6">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
        <span class="pl-1 font-inter font-semibold text-base pb-0.5"
          >Enter Business Name</span
        >
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      ></fa-icon>
    </div>
  </div>
  <!-- modal body start -->
  <div [formGroup]="businessForm" class="flex flex-col gap-4">
    <div>
      <app-common-input-field
        placeholder="Business name"
        formControlName="buisnessName"
      />
      <app-control-message-v35 [control]="businessForm.controls.buisnessName" />
    </div>
    @if (dialogData?.appTitle === "manual") {
      <div>
        <app-common-input-field
          placeholder="Provider name"
          formControlName="providerName"
        />
        <app-control-message-v35
          [control]="businessForm.controls.providerName"
        />
      </div>
    } @else {
      <div class="flex gap-5 items-center">
        <p class="font-inter text-sm text-main-text-color font-normal">
          Provider name &nbsp;:
        </p>
        <p class="font-inter text-sm text-main-text-color font-semibold">
          {{ dialogData?.appTitle }}
        </p>
      </div>
    }
  </div>
  <!-- modal body end -->
  <div class="flex justify-end gap-3 pt-8">
    <app-common-button-v35
      mat-dialog-close
      width="120px"
      [type]="{ style: 'bordered', name: 'main' }"
      text="Cancel"
    ></app-common-button-v35>
    <app-common-button-v35
      width="120px"
      [type]="{ style: 'modal', name: 'main' }"
      text="Confirm"
      [disabled]="isLoading"
      [loading]="isLoading"
      (clickEvent)="runKybBypass()"
    ></app-common-button-v35>
  </div>
</div>
