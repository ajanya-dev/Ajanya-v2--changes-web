<div class="ocw_man_modal_wrapper">
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">Statement Verification</div>
    <div class="close_btn" [mat-dialog-close]="false">
      <img
        src="./../../../../assets/icon/close-icon.svg"
        type="image/svg+xml"
        alt="Close Icon"
      />
    </div>
  </div>
  <div class="ocw_modal_body">
    <div style="font-family: var(--inter)" class="text-center p-4">
      Please upload your bank statement that shows you have run payroll from
      this account
    </div>
    <div class="h-7"></div>
    <form class="w-full" action="">
      <div class="ocw-browse-file !max-w-full">
        <input
          type="file"
          class="custom-file-input"
          name="gov-id"
          (change)="fileInputChange($event)"
          accept=".pdf,.csv,.xlsx,.xls,.docx,.doc,.rtf,.txt,.jpg,.png"
        />
        <label class="doc-name whitespace-nowrap">
          {{
            statementFile.invalid ? "Choose a File" : statementFile.value?.name
          }}
          <span *ngIf="false" class="error_msg">*</span>
        </label>
      </div>
      <span
        *ngIf="statementFile.invalid && statementFile.touched"
        class="error_msg"
        >Statement file is required</span
      >
    </form>
  </div>
  <div class="ocw_modal_footer !p-0 !pt-2.5">
    <button
      type="submit"
      class="ocw-btn ocw-btn-modal-blue add_btn w-full flex justify-center"
      [disabled]="false"
      (click)="submit()"
    >
      <span>Submit</span>
      <span *ngIf="loading" class="loadingSpinner"></span>
    </button>
  </div>
</div>
