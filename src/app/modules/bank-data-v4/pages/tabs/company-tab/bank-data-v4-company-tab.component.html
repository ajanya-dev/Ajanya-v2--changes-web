<section class="space-y-4">
  <div
    class="p-4 lg:p-6 border border-v4-border-color bg-v4-secondary-background-color rounded-xl"
  >
    <div class="flex items-center justify-between mb-4">
      <h3
        class="text-base lg:text-lg font-semibold text-v4-main-text-color m-0"
      >
        My Companies
      </h3>

      <app-common-button-v4
        [type]="{ style: 'primary', name: 'main' }"
        text="Add Company"
        [lucideIcon]="'plus'"
        [lucideIconSize]="16"
        (clickEvent)="openCompanyModal('new')"
      />
    </div>

    @if (!companiesLoaded()) {
      <div
        class="flex items-center justify-center gap-2 py-8 text-v4-secondary-text-color"
      >
        <lucide-icon name="loader-circle" [size]="18" class="animate-spin" />
        Loading companies…
      </div>
    } @else if (companies().length === 0) {
      <app-v4-data-table-empty-state
        [icon]="'briefcase'"
        [title]="'No companies created yet'"
        [description]="'Add a company to start mapping bank transactions to it'"
        [buttonText]="'Add Company'"
        [buttonIcon]="'plus'"
        [compact]="true"
        (actionClick)="openCompanyModal('new')"
      />
    } @else {
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
        @for (company of companies(); track company.id) {
          <div
            class="flex items-center justify-between gap-3 p-4 border border-v4-border-color bg-v4-main-background-color rounded-xl transition-colors hover:border-v4-tertiary-text-color/50"
          >
            <div class="flex items-center gap-3 min-w-0">
              <div
                class="w-9 h-9 rounded-lg flex items-center justify-center bg-v4-primary-brand-color flex-shrink-0"
              >
                <lucide-icon
                  name="briefcase"
                  [size]="16"
                  class="text-v4-secondary-brand-color"
                />
              </div>
              <p
                class="text-sm font-medium text-v4-main-text-color m-0 truncate"
                [matTooltip]="company.name"
              >
                {{ company.name }}
              </p>
            </div>

            <div class="flex items-center gap-1 flex-shrink-0">
              <button
                type="button"
                class="p-1.5 rounded-lg hover:bg-v4-secondary-background-color transition-colors text-v4-tertiary-text-color"
                (click)="openCompanyModal('edit', company)"
                aria-label="Edit company"
              >
                <lucide-icon name="edit" [size]="14" />
              </button>
              <button
                type="button"
                class="p-1.5 rounded-lg hover:bg-v4-secondary-background-color transition-colors text-v4-tertiary-text-color hover:text-v4-common-red-color"
                (click)="deleteCompany(company)"
                aria-label="Delete company"
              >
                <lucide-icon name="trash-2" [size]="14" />
              </button>
            </div>
          </div>
        }
      </div>
    }
  </div>
</section>
