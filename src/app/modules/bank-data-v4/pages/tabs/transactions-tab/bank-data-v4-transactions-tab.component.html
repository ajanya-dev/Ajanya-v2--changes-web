<section class="space-y-4 lg:space-y-6">
  <h2 class="text-lg font-bold text-v4-main-text-color m-0 pb-3">
    Transaction History
  </h2>

  <app-bank-data-v4-transactions-stats
    [totals]="state.totals()"
    [totalRowCount]="state.totalRowCount()"
    [loading]="state.isLoading()"
  />

  <!-- Company filter -->
  <div class="flex flex-wrap items-center gap-4">
    <div class="w-full sm:w-64">
      <app-v4-select-dropdown
        [items]="companyFilterItems()"
        [selectedValue]="selectedCompanyId"
        [compact]="false"
        [clearable]="true"
        placeholder="Select Company"
        (selectionChange)="onCompanyFilter($event)"
      />
    </div>
  </div>

  <app-v4-data-table
    [tableId]="tableId"
    [columnDefs]="columnDefs"
    [defaultColumnFields]="columnFields"
    [frameworkComponents]="frameworkComponents"
    [additionalPayload]="postData"
    [rowSelection]="'single'"
    [suppressRowClickSelection]="true"
    [exportConfig]="{ heading: 'Bank Transactions', name: 'bank-transactions' }"
    [useCustomEmptyState]="true"
    [emptyStateConfig]="{
      icon: 'landmark',
      title: 'No bank transactions yet',
      description:
        'Connect a bank account to pull its transactions in automatically',
      buttonText: 'Connect Bank Account',
      buttonIcon: 'landmark',
      compact: true
    }"
    (emptyStateActionClick)="onEmptyStateConnectBank()"
  />
</section>
