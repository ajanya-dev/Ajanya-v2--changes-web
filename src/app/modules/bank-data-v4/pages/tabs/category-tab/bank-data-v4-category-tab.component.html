<section class="space-y-4">
  <!-- User Categories -->
  <div
    class="p-4 lg:p-6 border border-v4-border-color bg-v4-secondary-background-color rounded-xl"
  >
    <div class="flex items-center justify-between mb-4">
      <h3
        class="text-base lg:text-lg font-semibold text-v4-main-text-color m-0"
      >
        Categories
      </h3>
      <app-common-button-v4
        [type]="{ style: 'primary', name: 'main' }"
        text="Add Category"
        [lucideIcon]="'plus'"
        [lucideIconSize]="14"
        (clickEvent)="onAddCategory()"
      />
    </div>

    @if (!state.categoriesLoaded()) {
      <div
        class="flex items-center justify-center gap-2 py-8 text-v4-secondary-text-color"
      >
        <lucide-icon name="loader-circle" [size]="18" class="animate-spin" />
        Loading categories…
      </div>
    } @else if (userCategories().length === 0) {
      <app-v4-data-table-empty-state
        [icon]="'tag'"
        [title]="'No categories created yet'"
        [description]="'Add a category to start organizing your bank transactions'"
        [buttonText]="'Add Category'"
        [buttonIcon]="'plus'"
        [compact]="true"
        (actionClick)="onAddCategory()"
      />
    } @else {
      <div class="flex flex-col gap-2">
        @for (cat of parsedCategories(); track cat.id) {
          <div
            class="flex items-center justify-between gap-3 p-4 border border-v4-border-color bg-v4-main-background-color rounded-xl transition-colors hover:border-v4-tertiary-text-color/50"
            [style.margin-left.px]="(cat.level || 0) * 24"
          >
            <div class="flex items-center gap-3 min-w-0">
              <div
                class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0"
                [ngClass]="
                  cat.level
                    ? 'bg-v4-tertiary-background-color'
                    : 'bg-v4-primary-brand-color'
                "
              >
                <lucide-icon
                  name="tag"
                  [size]="16"
                  [ngClass]="
                    cat.level
                      ? 'text-v4-tertiary-text-color'
                      : 'text-v4-secondary-brand-color'
                  "
                />
              </div>
              <p
                class="text-sm font-medium text-v4-main-text-color m-0 truncate"
                [matTooltip]="cat.cleanName"
              >
                {{ cat.cleanName }}
              </p>
            </div>

            <div class="flex items-center gap-1 flex-shrink-0">
              <button
                type="button"
                class="p-1.5 rounded-lg hover:bg-v4-secondary-background-color transition-colors text-v4-tertiary-text-color"
                (click)="onEditCategory(cat)"
                aria-label="Edit category"
              >
                <lucide-icon name="edit" [size]="14" />
              </button>
              <button
                type="button"
                class="p-1.5 rounded-lg hover:bg-v4-secondary-background-color transition-colors text-v4-tertiary-text-color hover:text-v4-common-red-color"
                (click)="onDeleteCategory(cat)"
                [disabled]="deletingId() === cat.id"
                aria-label="Delete category"
              >
                <lucide-icon
                  [name]="deletingId() === cat.id ? 'loader-circle' : 'trash-2'"
                  [size]="14"
                  [ngClass]="deletingId() === cat.id ? 'animate-spin' : ''"
                />
              </button>
            </div>
          </div>
        }
      </div>
    }
  </div>
</section>
