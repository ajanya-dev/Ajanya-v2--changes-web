<section class="flex flex-col gap-4 lg:gap-6">
  <!-- ═══ Metric Cards ═══ -->
  @if (cardsLoading()) {
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 lg:gap-6">
      @for (i of [1, 2]; track i) {
        <div
          class="animate-pulse rounded-xl border border-v4-border-color bg-v4-secondary-background-color p-3 md:p-4"
        >
          <div class="h-3 w-24 rounded bg-v4-border-color mb-4"></div>
          <div class="h-7 w-32 rounded bg-v4-border-color mb-2"></div>
          <div class="h-3 w-20 rounded bg-v4-border-color"></div>
        </div>
      }
    </div>
  } @else {
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 lg:gap-6">
      @for (card of metricCards(); track card.title) {
        <app-overview-cards-v4 [card]="card" />
      }
    </div>
  }

  <!-- ═══ Cash Flow Forecast ═══ -->
  <app-cash-flow-forecast
    [data]="cashFlowData()"
    [isLoading]="cashFlowLoading()"
  />

  <!-- ═══ Spending Trends by Category ═══ -->
  <app-spending-trends
    [data]="spendingTrendsData()"
    [isLoading]="spendingLoading()"
  />
</section>
