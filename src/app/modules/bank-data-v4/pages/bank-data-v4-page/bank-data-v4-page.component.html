<div
  class="bank-data-v4-page space-y-4 lg:space-y-6"
> 
  <app-v4-page-header
    class="block mb-5"
    title="Bank Data"
    subtitle="Manage your bank accounts and payment routing"
  />

  <div class="overflow-x-auto -mx-4 px-4 lg:mx-0 lg:px-0">
    <div class="inline-block w-auto">
      <app-common-tab-v4
        [tabs]="tabs"
        [(activeTab)]="activeTab"
        [variant]="'underline'"
        (tabChange)="onTabChange($event)"
      />
    </div>
  </div>

  <div>
    <router-outlet />
  </div>
</div>
