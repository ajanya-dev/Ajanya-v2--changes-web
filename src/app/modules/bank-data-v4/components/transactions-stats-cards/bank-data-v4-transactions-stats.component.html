<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
  @for (card of cards(); track card.label) {
    <div
      class="p-4 lg:p-6 border border-v4-border-color bg-v4-secondary-background-color rounded-xl"
    >
      @if (loading()) {
        <div class="flex items-center justify-between mb-3">
          <div class="skeleton-line h-4 w-28 rounded-md"></div>
          <div class="skeleton-line h-5 w-5 rounded-md"></div>
        </div>
        <div class="skeleton-line h-8 w-24 rounded-md mb-2"></div>
        <div class="skeleton-line h-3 w-20 rounded-md"></div>
      } @else {
        <div class="flex items-center justify-between mb-3">
          <p class="text-xs md:text-sm text-v4-secondary-text-color font-medium m-0">
            {{ card.label }}
          </p>
          <lucide-icon [name]="card.icon" [size]="18" [class]="card.iconColor" />
        </div>
        <p class="text-2xl lg:text-3xl font-bold m-0" [class]="card.valueColor">
          {{ card.value }}
        </p>
        <p class="text-xs text-v4-secondary-text-color mt-2 m-0">{{ card.subtitle }}</p>
      }
    </div>
  }
</div>
