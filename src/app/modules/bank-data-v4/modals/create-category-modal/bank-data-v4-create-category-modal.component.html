<div>
  <!-- Header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-tertiary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        {{ isEditMode ? "Edit Category" : "Add Category" }}
      </h1>
      <h2 class="text-xs text-v4-subtle-text-color">
        {{
          isEditMode
            ? "Update the category name"
            : "Create a new payment category"
        }}
      </h2>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="p-6 bg-v4-tertiary-background-color space-y-4"
  >
    <div>
      <label
        class="block text-xs font-medium text-v4-main-text-color mb-1.5"
        for="name"
      >
        Category Name <span class="text-v4-common-red-color">*</span>
      </label>
      <app-common-input-v4
        formControlName="name"
        [placeholder]="'e.g., Office Supplies'"
        [isFieldRequired]="false"
        [maxLength]="50"
        [errorLabel]="'Category Name'"
      />
    </div>

    @if (!isEditMode) {
      <div>
        <label
          class="block text-xs font-medium text-v4-main-text-color mb-1.5"
          for="parent"
        >
          Parent Category
        </label>
        <app-v4-common-dropdown
          [config]="parentCategoryConfig"
          [listData]="parentCategoryOptions"
          formControlName="parent"
          [clearable]="true"
          [searchable]="true"
          [loading]="parentCategoriesLoading()"
          appendTo="body"
        />
      </div>
    }

    <p class="mt-3 p-1 text-sm">
      You can create an unlimited number of categories and set rules to
      automatically categorize transactions.
    </p>
  </form>

  <!-- Footer -->
  <div
    class="flex justify-end gap-3 p-6 bg-v4-tertiary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
      [disabled]="isSaving()"
      (clickEvent)="close()"
    />
    <app-common-button-v4
      [type]="{ style: 'primary', name: 'main' }"
      [text]="isEditMode ? 'Update Category' : 'Add Category'"
      [lucideIcon]="isEditMode ? 'check' : 'plus'"
      [lucideIconSize]="14"
      [loading]="isSaving()"
      [disabled]="isSaving() || form.invalid"
      (clickEvent)="submit()"
    />
  </div>
</div>
