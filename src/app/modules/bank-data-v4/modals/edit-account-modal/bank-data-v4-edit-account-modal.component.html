<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-popup-header-footer-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Edit Account
      </h1>
      <h2 class="text-xs text-v4-subtle-text-color">{{ providerName }}</h2>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  @if (isLoading()) {
    <div
      class="flex items-center justify-center gap-2 py-12 bg-v4-tertiary-background-color text-v4-secondary-text-color"
    >
      <lucide-icon name="loader-circle" [size]="20" class="animate-spin" />
      Loading account data…
    </div>
  } @else {
    <!-- modal body start -->
    <div class="p-6 bg-v4-tertiary-background-color">
      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
        @if (originalAccountName()) {
          <div class="py-2 px-3 bg-v4-secondary-background-color rounded-lg">
            <p class="text-xs text-v4-tertiary-text-color m-0">
              Original Account Name
            </p>
            <p class="text-sm font-medium text-v4-main-text-color m-0">
              {{ originalAccountName() }}
            </p>
          </div>
        }

        <div>
          <span
            class="block text-xs font-medium text-v4-main-text-color mb-1.5"
          >
            Account Nick Name <span class="text-v4-common-red-color">*</span>
          </span>
          <app-common-input-v4
            formControlName="nick_name"
            [placeholder]="'e.g., Business Checking'"
            [isFieldRequired]="false"
            [maxLength]="30"
            [errorLabel]="'Account Nick Name'"
          />
        </div>

        @if (companyOptions.length > 0) {
          <div>
            <span
              class="block text-xs font-medium text-v4-main-text-color mb-1.5"
            >
              Company
            </span>
            <app-v4-select-dropdown
              [items]="companyOptions"
              [selectedValue]="selectedCompanyId()"
              [compact]="false"
              [placeholder]="'Select Company'"
              (selectionChange)="selectedCompanyId.set($event)"
            />
          </div>
        }
      </form>
    </div>
    <!-- modal body end -->

    <div
      class="flex justify-end gap-3 p-6 bg-v4-popup-header-footer-color border-t border-v4-border-color"
    >
      <app-common-button-v4
        mat-dialog-close=""
        width="120px"
        [type]="{ style: 'outline', name: 'main' }"
        text="Cancel"
      />
      <app-common-button-v4
        width="120px"
        [type]="{ style: 'primary', name: 'main' }"
        text="Update"
        (clickEvent)="submit()"
        [disabled]="isSaving() || form.invalid"
        [loading]="isSaving()"
      />
    </div>
  }
</div>
