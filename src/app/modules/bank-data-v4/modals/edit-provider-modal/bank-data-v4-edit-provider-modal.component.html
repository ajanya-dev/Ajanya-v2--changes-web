<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-popup-header-footer-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Edit Bank Name
      </h1>
      <h2 class="text-xs text-v4-subtle-text-color">
        Update the financial institution name
      </h2>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div>
        <label
          class="block text-xs font-medium text-v4-main-text-color mb-1.5"
          for="name"
        >
          Bank Name <span class="text-v4-common-red-color">*</span>
        </label>
        <app-common-input-v4
          formControlName="name"
          [placeholder]="'e.g., Chase Bank'"
          [isFieldRequired]="false"
          [maxLength]="100"
          [errorLabel]="'Bank Name'"
        />
      </div>
    </form>
  </div>
  <!-- modal body end -->

  <div
    class="flex justify-end gap-3 p-6 bg-v4-popup-header-footer-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Update"
      (clickEvent)="submit()"
      [disabled]="isSaving() || form.invalid"
      [loading]="isSaving()"
    />
  </div>
</div>
