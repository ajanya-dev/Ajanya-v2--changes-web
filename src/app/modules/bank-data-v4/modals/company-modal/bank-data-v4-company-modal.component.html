<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-tertiary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        {{ isEditMode ? "Edit Company" : "Add Company" }}
      </h1>
      <h2 class="text-xs text-v4-subtle-text-color">
        {{
          isEditMode
            ? "Update the company name"
            : "Create a new company for reporting"
        }}
      </h2>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <span class="block text-xs font-medium text-v4-main-text-color mb-1.5">
          Company Name <span class="text-v4-common-red-color">*</span>
        </span>
        <app-common-input-v4
          formControlName="name"
          [placeholder]="'e.g., Acme Corporation'"
          [isFieldRequired]="false"
          [maxLength]="50"
          [errorLabel]="'Company Name'"
        />
      </div>
      <p class="text-xs text-v4-tertiary-text-color m-0">
        You may create a group, company or corporation and add any account to that for a specific company reporting purpose.
      </p>
    </form>
  </div>
  <!-- modal body end -->

  <div
    class="flex justify-end gap-3 p-6 bg-v4-tertiary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      [text]="isEditMode ? 'Update' : 'Add Company'"
      (clickEvent)="submit()"
      [disabled]="isSaving() || form.invalid"
      [loading]="isSaving()"
    />
  </div>
</div>
