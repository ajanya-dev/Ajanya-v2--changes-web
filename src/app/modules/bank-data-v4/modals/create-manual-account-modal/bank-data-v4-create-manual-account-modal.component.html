<div>
  <!-- Header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-popup-header-footer-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Create Manual Account
      </h1>
      <h2 class="text-xs text-v4-subtle-text-color">
        Add a bank account by entering its details
      </h2>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- Body (scrollable) -->
  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="p-6 bg-v4-tertiary-background-color"
  >
    <div class="space-y-5">
      <div>
        <label
          class="block text-xs font-medium text-v4-main-text-color mb-1.5"
          for="account_name"
        >
          Account Name <span class="text-v4-common-red-color">*</span>
        </label>
        <app-common-input-v4
          formControlName="account_name"
          [placeholder]="'e.g., My Wallet, Vacation Savings'"
          [isFieldRequired]="false"
          [maxLength]="100"
          [errorLabel]="'Account Name'"
        />
      </div>

      <div>
        <label
          class="block text-xs font-medium text-v4-main-text-color mb-1.5"
          for="account_type"
        >
          Account Type <span class="text-v4-common-red-color">*</span>
        </label>
        <app-v4-select-dropdown
          [items]="accountTypeOptions"
          [selectedValue]="form.controls.account_type.value"
          [compact]="false"
          [placeholder]="'Select an account type'"
          (selectionChange)="onAccountTypeChange($event)"
        />
        @if (
          form.controls.account_type.touched &&
          form.controls.account_type.invalid
        ) {
          <p class="text-xs text-v4-common-red-color mt-1">
            Account Type is required
          </p>
        }
      </div>

      <div>
        <label
          class="block text-xs font-medium text-v4-main-text-color mb-1.5"
          for="balance"
        >
          Current Balance <span class="text-v4-common-red-color">*</span>
        </label>
        <app-common-input-v4
          formControlName="balance"
          [placeholder]="'0.00'"
          [isFieldRequired]="false"
          [isNumberOnly]="true"
          [numberType]="'decimal'"
          [customMask]="'separator.2'"
          [errorLabel]="'Balance'"
        />
      </div>

      <div>
        <label
          class="block text-xs font-medium text-v4-main-text-color mb-1.5"
          for="institution_name"
        >
          Institution
          <span class="text-v4-tertiary-text-color font-normal"
            >(Optional)</span
          >
        </label>
        <app-common-input-v4
          formControlName="institution_name"
          [placeholder]="'e.g., Bank of America'"
          [isFieldRequired]="false"
          [maxLength]="100"
        />
      </div>
    </div>
  </form>

  <!-- Footer -->
  <div
    class="flex justify-end gap-3 p-6 bg-v4-popup-header-footer-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
      [disabled]="isSaving()"
      (clickEvent)="close()"
    />
    <app-common-button-v4
      [type]="{ style: 'primary', name: 'main' }"
      text="Create Account"
      [lucideIcon]="'check-circle-2'"
      [lucideIconSize]="14"
      [loading]="isSaving()"
      [disabled]="isSaving() || form.invalid"
      (clickEvent)="submit()"
    />
  </div>
</div>
