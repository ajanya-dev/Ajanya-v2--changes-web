<div class="user-management">
  <div class="user-management__container">
    <!-------------------------  User management list start ------------------------->
    <section class="user-list">
      <div class="user-list__container">
        <div class="top">
          <div class="list-header">
            <div class="w-full flex">
              <div class="w-full">
                <div class="float-left main-heading">
                  <p>User Management</p>
                </div>
                <div class="float-right">
                  <button
                    class="ocw-btn ocw-btn-violet !h-8 user_activity-button"
                    (click)="goToApprovalPolicy()"
                    *ngIf="isHamaspik && companyType === 'owncmp'"
                  >
                    Approval Policy
                  </button>
                </div>
              </div>
            </div>
            <div class="actions">
              <div class="search-input">
                <input
                  type="text"
                  [(ngModel)]="usersSearchTerm"
                  (keyup)="onSearchUser()"
                  placeholder="Search user name"
                />
                <span>
                  <ng-container *ngIf="usersSearchTerm === ''; else closeIcon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                  </ng-container>
                  <ng-template #closeIcon>
                    <i
                      class="fa-solid fa-xmark cursor-pointer"
                      (click)="usersSearchTerm = ''; onSearchUser(10)"
                      role="presentation"
                    ></i>
                  </ng-template>
                </span>
              </div>

              <div class="filter-box box" [matMenuTriggerFor]="typeFilter">
                <ng-container *ngIf="userTypeFilter === 0; else filtered">
                  <i class="fa-regular fa-filter"></i>
                </ng-container>
                <ng-template #filtered>
                  <i class="fa-solid fa-filter"></i>
                </ng-template>
              </div>
            </div>
          </div>

          <div class="list-content text-center">
            <!---------  Single User start ---------->
            <ng-container *ngIf="!loading.default; else skeleton">
              <ng-container *ngFor="let item of usersDetails; let i = index">
                <div
                  class="single_card"
                  id="singleCard"
                  #singleUser
                  (click)="onSingleUser(singleUser, item, i)"
                  role="presentation"
                >
                  <div class="col-1">
                    <img
                      [src]="
                        item.profile_pic || '../../../../assets/images/user.svg'
                      "
                      alt="User info"
                    />
                  </div>

                  <div class="col-2">
                    <h6>
                      {{ item.client_name }} &nbsp;<span
                        >({{ clientType[item.client_type] }})</span
                      >
                    </h6>
                    <p>{{ item.client_email }}</p>

                    <div *ngIf="item.company_name !== null" class="company-name">
                      <i class="fas fa-briefcase"></i>
                      <span>{{ item.company_name | titlecase }}</span>
                      <p></p>
                    </div>
                  </div>

                  <div class="col-3">
                    <ng-container [ngSwitch]="item.status">
                      <ng-container *ngSwitchCase="0">
                        <!-- Resend Start -->
                        <button
                          class="resent"
                          (click)="onResend(item, i); $event.stopPropagation()"
                          [ngClass]="{ disable_btn: loading.sending === i }"
                        >
                          <span
                            class="loadingSpinner"
                            style="--i: &quot;#3d72f9&quot;"
                            *ngIf="loading.sending === i; else resend"
                          ></span>
                          <ng-template #resend>
                            <span>Resend</span></ng-template
                          >
                        </button>
                        <!-- Resend End -->
                        <button class="pending">Pending</button>
                      </ng-container>

                      <ng-container *ngSwitchCase="1">
                        <button class="active">Active</button>
                      </ng-container>

                      <ng-container *ngSwitchCase="2">
                        <button class="rejected">Rejected</button>
                      </ng-container>

                      <ng-container *ngSwitchDefault>
                        <!-- Approve Start -->
                        <button
                          class="approve"
                          matTooltip="Approve and & Set permission"
                          matTooltipPosition="above"
                          (click)="onApprove(item, i); $event.stopPropagation()"
                          [ngClass]="{ disable_btn: loading.accepting === i }"
                        >
                          <span
                            class="loadingSpinner"
                            style="--i: &quot;#1b9671&quot;"
                            *ngIf="loading.accepting === i; else accept"
                          ></span>
                          <ng-template #accept>
                            <span>Approve</span></ng-template
                          >
                        </button>
                        <!-- Approve End -->

                        <!-- Delete Start -->
                        <button
                          class="delete"
                          (click)="onDelete(item, i); $event.stopPropagation()"
                          [ngClass]="{ disable_btn: loading.deleting === i }"
                        >
                          <span
                            class="loadingSpinner"
                            style="--i: &quot;#db5858&quot;"
                            *ngIf="loading.deleting === i; else deleted"
                          ></span>
                          <ng-template #deleted>
                            <span>Delete</span></ng-template
                          >
                        </button>
                        <!-- Delete End -->
                      </ng-container>
                      <mat-menu #moreMenu="matMenu" xPosition="before">
                        <button
                          *ngFor="let menu of listMenu"
                          (click)="onActionMenu(menu, item, i)"
                          mat-menu-item
                        >
                          <i [class]="menu.icon"></i>
                          <span class="text-sm ml-1"> {{ menu.title }}</span>
                        </button>
                      </mat-menu>
                    </ng-container>
                  </div>

                  <div class="col-4">
                    <span>
                      <i
                        role="presentation"
                        [matMenuTriggerFor]="moreMenu"
                        (click)="$event.stopPropagation()"
                        class="fa-solid fa-ellipsis-vertical option-icon"
                      ></i>
                    </span>
                  </div>
                </div>
              </ng-container>
            </ng-container>

            <ng-template class="skel" #skeleton>
              <table class="ocw-skeleton-table">
                <tbody>
                  <tr *ngFor="let i of [1, 2, 3, 4, 5, 6]">
                    <td></td>
                  </tr>
                </tbody>
              </table>
            </ng-template>

              </div>
              <p class="text-sm">No user found!</p>
            </ng-container>

            <!---------  Single User end ---------->
          </div>
        </div>
        <div class="list-footer">
          <div class="add_new">
            <button (click)="openNewUserModal()">
              <i class="fa-solid fa-plus"></i>
              <span>Add New</span>
            </button>
          </div>
        </div>
      </div>
    </section>
    <!-------------------------  User management list end ------------------------->

    <!-------------------------  User activity list start ------------------------->
    <section class="user-activity">
      <app-users-activity
        [selectedUser]="selectedUser"
        [loading]="loading"
        (statusAction)="activityStatusAction($event)"
        [notFoundUser]="notFoundUser"
      ></app-users-activity>
    </section>
    <!-------------------------  User activity list end ------------------------->

    <!-------------------------  Menus------------------------->
    <mat-menu #typeFilter="matMenu" xPosition="before">
      <button
        *ngFor="let item of userTypes"
        mat-menu-item
        (click)="onFilterType(item)"
        [ngClass]="{ filterSelected: item.value === userTypeFilter }"
      >
        <span class="text-sm"> {{ item.name }}</span>
      </button>
    </mat-menu>

    <!-------------------------  Menus------------------------->
  </div>
</div>
