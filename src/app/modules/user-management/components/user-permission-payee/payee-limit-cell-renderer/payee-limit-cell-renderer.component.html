<div class="flex flex-row gap-1 p-1 items-center max-w-[100px] w-full">
<span class="text-sm mr-2">$</span>
<app-common-input-field
  placeholder="Limit"
  required="false"
  [formControl]="limitFormControl"
  [maxLength]="15"
  customMask="separator.2"
  (click)="$event.stopPropagation()"
  (inputFocusEvent)="onLimitFocus()"
  (inputFocusOutEvent)="onLimitBlur($event)"
  class="w-[100px] flex-shrink-0"
  [disabled]="disableInput()"
/>
  <div class="cursor-pointer  w-[100px] flex-shrink-0">
    <ng-select
      #limitDropdown
      appendTo=".ag-center-cols-container"
      class="ng-dropdown-panel-v35 text-sm payment-source cursor-pointer w-full"
      [(ngModel)]="selectedLimit"
      (ngModelChange)="onLimitChange($event)"
      [clearable]="false"
      (click)="$event.stopPropagation()"
      placeholder="Select"
    >
      @for(limit of limitsToList; track trackByLimit($index, limit)) {
        <ng-option [value]="limit.id">
          {{ limit.name }}
        </ng-option>
      }
    </ng-select>
  </div>
</div>
