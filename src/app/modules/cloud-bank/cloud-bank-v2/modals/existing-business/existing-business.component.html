<section
  cdkDragRootElement=".cdk-overlay-pane"
  class="add_account_modal_wrapper"
>
  <!--==================================================
			            MAIN HEAD START
===================================================-->
  <div class="head_icon">
    <img
      src="../../../../../../../assets/images/cloud-bank/mobile-banking-1.svg"
      alt=""
    />
  </div>
  <!-- modal head -->
  <div class="modal-subhead">
    <h5>
      Would you like to add an account to existing verified business/entity?
    </h5>
    <p>Select existing business</p>
  </div>
  <!-- header close icon -->
  <div class="close_btn" [mat-dialog-close]="false">
    <fa-icon [icon]="['fas', 'x']"></fa-icon>
  </div>
  <!--==================================================
			            MAIN HEAD END
===================================================-->

  <!--==================================================
			          BUSINESS LIST START
===================================================-->
  <div class="business_name_lists">
    <!-- Business List Start -->
    @for (item of businessDetails; track $index) {
      <a
        role="presentation"
        class="business_name"
        (click)="selectAccount(item)"
        >{{ item.businessName }}</a
      >
    }
    <!-- Business List End -->
  </div>

  <h3 class="__or">OR</h3>
  <!--==================================================
			          BUSINESS LIST END
===================================================-->

  <!--==================================================
			          ADD BUSS BTN START
===================================================-->
  <p class="hint_text_mod">Would you like to add a new entity/business ?</p>

  <div class="bus_modal_btn_wrapper">
    <button
      class="ocw-btn ocw-btn-modal-blue flex gap-2"
      (click)="addNewBusiness()"
    >
      <span>Add New Business</span>
      @if (loading) {
        <span class="loadingSpinner"></span>
      }
    </button>
  </div>
  <!--==================================================
			          ADD BUSS BTN START
===================================================-->
</section>
