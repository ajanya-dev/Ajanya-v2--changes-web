<div class="px-2 pb-2 test">
  <div class="flex justify-between pb-6">
    <div>
      <p class="font-inter font-semibold text-base text-main-text-color">
        Transaction Statement
      </p>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="['fas', 'xmark']"
      ></fa-icon>
    </div>
  </div>
  <div>
    @for (item of Object.entries(transactionDetails); track item[0]) {
      <div
        class="flex justify-between gap-7 text-sm items-center px-2.5 py-4 font-inter"
      >
      <div class="flex items-center justify-between text-secondary-text-color font-medium font-inter">
        @if (item[0] === "fed_trace") {
          <span class="w-36">Fed Trace Number</span>
        } @else {
          <span class="w-36">
            {{

              item[0] === "imad"
                ? item[0].toUpperCase()
                : (item[0].replace("_", " ") | titlecase)
            }}
          </span>
        }
        <span>:</span>
      </div>
        <span
          class="font-normal font-inter text-main-text-color"
          [ngClass]="{
            '!text-common-green-color':
              (item[0] === 'transaction_type' && item[1] === 'credit') ||
              (item[0] === 'status' && item[1] === 'settled'),
            '!text-common-red-color':
              (item[0] === 'transaction_type' && item[1] === 'debit') ||
              (item[0] === 'status' && item[1] === 'failed') ||
              (item[0] === 'status' && item[1] === 'canceled'),
            '!text-common-blue-color':
              item[0] === 'status' && item[1] === 'processing',
            '!text-common-yellow-color':
              item[0] === 'status' && item[1] === 'pending'
          }"
          >{{ item[1] | titlecase }}</span
        >
      </div>
    }
  </div>
  <div class="flex justify-center gap-3 pt-8">
    <app-common-button-v35
      [mat-dialog-close]="false"
      [type]="{ style: 'modal', name: 'main' }"
      text="OK"
      width="80px"
    ></app-common-button-v35>
  </div>
</div>
