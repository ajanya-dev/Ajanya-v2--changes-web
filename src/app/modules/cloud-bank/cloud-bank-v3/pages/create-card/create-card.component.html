<div class="flex w-full h-full justify-center items-center">
  <div class="flex gap-10">
    <div class="w-10 px-10 text-main-text-color">
      <app-common-back-button-v35></app-common-back-button-v35>
    </div>
    <div
      class="flex-1 max-w-xl h-full flex flex-col gap-4"
      [formGroup]="cardForm"
    >
      <div class="flex flex-col pb-8">
        <div class="font-semibold text-xl text-main-text-color">
          {{ !cardId ? "New Card" : "Edit Card" }}
        </div>
        <div class="text-secondary-text-color text-sm">
          Ensure that the information you provide is accurate
        </div>
      </div>
      <div class="v35-button-switch pb-7">
        @for (item of typeOfCard; track $index) {
          <div
            role="presentation"
            [ngClass]="[
              item.value !== 'virtual' ? '!cursor-not-allowed' : 'selected'
            ]"
            [matTooltip]="item.value !== 'virtual' ? 'Coming soon...' : ''"
          >
            <h1>
              {{ item.name }}
            </h1>
          </div>
        }
      </div>
      <div>
        <app-common-input-field
          placeholder="Card label/Nickname"
          formControlName="cardLabel"
          [maxLength]="30"
        ></app-common-input-field>
        <app-control-message
          [control]="cardForm.controls.cardLabel"
        ></app-control-message>
      </div>
      <div>
        <app-common-input-field
          customMask="separator.2"
          numberType="decimal"
          placeholder="Spending limit"
          formControlName="spendingLimit"
          type="text"
        ></app-common-input-field>
        <app-control-message
          [control]="cardForm.controls.spendingLimit"
        ></app-control-message>
      </div>
      <mat-radio-group
        aria-labelledby="example-radio-group-label"
        class="example-radio-group"
        formControlName="cardLimitPeriod"
      >
        <div class="flex flex-wrap gap-x-20 gap-y-8 pt-3 pb-20">
          @for (item of timePeriod; track $index) {
            <div>
              <mat-radio-button
                class="example-radio-button"
                [value]="item.value"
                >{{ item.name }}</mat-radio-button
              >
            </div>
          }
        </div>
        <app-control-message
          [control]="cardForm.controls.cardLimitPeriod"
        ></app-control-message>
      </mat-radio-group>
      <div class="flex justify-center">
        <app-common-button-v35
          [type]="{ style: 'filled', name: 'main' }"
          text="Submit"
          width="200px"
          (clickEvent)="submit()"
          [loading]="loading"
        ></app-common-button-v35>
      </div>
    </div>
  </div>
</div>
