<div
  class="h-full flex px-3 money-transfer-container bg-secondary-background-color text-main-text-color"
>
  <div
    class="flex flex-1 justify-center !bg-main-background-color rounded items-center"
  >
    <div class="max-w-2xl w-full relative">
      <div class="p-4 md:p-0 flex justify-center absolute md:-left-16 left-0">
        <button class="h-6" [disabled]="submitting" (click)="onBackButton()">
          <i class="fa-regular fa-arrow-left text-2xl h-6"></i>
        </button>
      </div>
      <form [formGroup]="transferFundsForm">
        <table class="w-full">
          <tr>
            <td colspan="5">
              <div class="flex justify-center text-2xl font-semibold">
                Add Fund
              </div>
            </td>
          </tr>
          <tr>
            <td colspan="5">
              <div class="flex flex-col items-center">
                <input
                  class="transfer-amount border-b border-dotted text-4xl font-semibold text-center w-72 mt-24 !text-main-text-color"
                  type="text"
                  [prefix]="transferFundsForm.controls.amount.value ? '$' : ''"
                  placeholder="$0.00"
                  formControlName="amount"
                  maxlength="14"
                  mask="separator.2"
                  thousandSeparator=","
                  (input)="totalAmountCal()"
                />
                <app-control-message
                  [control]="transferFundsForm?.controls.amount"
                  labelName="Amount is Required"
                >
                </app-control-message>
              </div>
            </td>
          </tr>
          <tr>
            <td colspan="5">
              <div class="flex flex-col items-center">
                <table class="w-full">
                  <tr>
                    <td colspan="3">
                      <textarea
                        cdkTextareaAutosize
                        class="memo-input-line text-center w-full mt-2 text-sm"
                        type="text"
                        placeholder="Memo"
                        formControlName="comment"
                        maxlength="50"
                      ></textarea>
                    </td>
                  </tr>
                  <tr>
                    <td></td>
                    <td class="border-t-2 border-input-border-color"></td>
                    <td></td>
                  </tr>
                </table>
                @if (
                  transferFundsForm.controls.comment.touched &&
                  transferFundsForm.controls.comment.invalid
                ) {
                  <span class="error_msg"> Please enter the memo </span>
                }
              </div>
            </td>
          </tr>
          <tr>
            <td colspan="5">
              <div class="font-semibold pt-5">From</div>
              <div class="flex flex-col">
                <div class="v35-button-switch">
                  <div
                    role="presentation"
                    tabindex="0"
                    class="hover:shadow-md whitespace-nowrap flex justify-center items-center gap-1 rounded cursor-pointer bg-secondary-background-color"
                    *ngFor="let item of transferToItems"
                    (click)="transferTo(item)"
                    [ngClass]="{ selected: isTo === item.transferComponent }"
                  >
                    <div class="">
                      @if (item.fontawsomeIconClass) {
                        <i [ngClass]="item.fontawsomeIconClass"></i>
                      }
                      @if (item.img) {
                        <img [src]="item.img" [alt]="item.label" />
                      }
                    </div>
                    <div class="item-label">
                      <span class="text-sm">{{ item.label }}</span>
                    </div>
                  </div>
                </div>
                <div class="w-full mt-5 mb-6">
                  <!-- Select from account -->
                  <div class="custom-input-v3-wrapper flex grow shadow">
                    <div class="select-container grow">
                      @if (isTo === 2) {
                        <div>
                          <app-wallet-dropdown-v3
                            formControlName="wallet"
                            (ngModelChange)="walletSelect($event, 2)"
                            customHeight="3"
                            class="drop_style"
                            [showLogoUpdateModal]="false"
                          ></app-wallet-dropdown-v3>
                        </div>
                      }
                      @if (isTo === 1) {
                        <div>
                          <app-bank-ac-dropdown-v3
                            class="w-full"
                            customHeight="3"
                            formControlName="bank"
                            (ready)="autoPopulateDropdown($event, selectedBank)"
                            [placeholder]="'Select Bank Account'"
                            (ngModelChange)="bankSelect($event, 3)"
                            class="drop_style"
                            append="body"
                            permissionContext="forPayment"
                          >
                          </app-bank-ac-dropdown-v3>
                        </div>
                      }
                      @if (isTo === 3) {
                        <div>
                          <app-cloud-account-dropdown-v35
                            (clear)="clearToAccount()"
                            (selectionEvent)="cloudBankSelect($event, 1)"
                            class="w-full"
                            customHeight="3"
                          ></app-cloud-account-dropdown-v35>
                        </div>
                      }
                    </div>
                  </div>
                  <app-control-message
                    [control]="transferFundsForm?.controls.transferFrom"
                    labelName="Please select an account"
                  >
                  </app-control-message>
                </div>
              </div>
            </td>
          </tr>
          <tr>
            <td colspan="5">
              <div class="flex justify-center">
                <i class="fa-solid fa-circle-arrow-down text-2xl mt-1"></i>
              </div>
            </td>
          </tr>
          <tr>
            <td colspan="5">
              <div class="font-semibold pt-5">To</div>
              <div class="flex flex-col">
                <div class="w-full">
                  <!-- Select to account -->
                  <div class="custom-input-v3-wrapper flex grow shadow">
                    <app-cloud-account-dropdown-v35
                      (selectionEvent)="toCloudBankSelect($event)"
                      [setSelectDropdownItem]="transferToId"
                      (ready)="autoPopulateDropdown($event, transferToId)"
                      class="w-full"
                      customHeight="3"
                    ></app-cloud-account-dropdown-v35>
                  </div>
                </div>
                <app-control-message
                  [control]="transferFundsForm?.controls.transferTo"
                  labelName="Please select an account"
                >
                </app-control-message>
              </div>
            </td>
          </tr>
          <tr>
            <td colspan="5">
              <div class="flex justify-center gap-3 mt-24">
                <app-common-button-v35
                  text="Cancel"
                  width="100%"
                  style="flex: 1"
                  [type]="{ style: 'bordered', name: 'main' }"
                  [disabled]="submitting"
                  (clickEvent)="onBackButton()"
                ></app-common-button-v35>
                <app-common-button-v35
                  text="Add Fund"
                  width="100%"
                  style="flex: 1"
                  [type]="{ style: 'filled', name: 'main' }"
                  [loading]="submitting"
                  (clickEvent)="onSubmit()"
                ></app-common-button-v35>
              </div>
            </td>
          </tr>
        </table>
      </form>
    </div>
  </div>
</div>
