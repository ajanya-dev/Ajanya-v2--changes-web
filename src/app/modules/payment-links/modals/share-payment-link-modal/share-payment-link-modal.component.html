<div class="px-[6px] pb-[6px]">
  <!-- modal header -->
  <div class="flex justify-between pb-6">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
        <span class="pl-1 font-inter font-semibold text-base pb-0.5">
          Share Payment Link
        </span>
      </span>
    </div>
    <div (click)="close()" role="presentation">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      ></fa-icon>
    </div>
  </div>
  <!-- Modal Body -->
  <div>
    <!-- QR Code Preview -->
    <div class="flex flex-col items-center mb-6">
      <div
        class="bg-white p-4 rounded-lg shadow-sm border border-input-border-color"
      >
        <img [src]="data.qrCodeUrl" alt="QR Code" class="w-[150px] h-[150px]" />
      </div>
      <p class="text-sm text-secondary-text-color mt-3 text-center">
        {{ data.name }}
      </p>
    </div>

    <!-- Link Display -->
    <div class="flex gap-2 items-center mb-6">
      <div
        class="flex-1 flex items-center gap-2 border border-input-border-color rounded bg-secondary-background-color px-3 py-2"
      >
        <fa-icon
          [icon]="faLink"
          class="text-common-blue-color flex-shrink-0"
        ></fa-icon>
        <input
          type="text"
          [value]="data.link"
          readonly
          class="text-main-text-color text-sm font-normal w-full bg-transparent border-none outline-none focus:outline-none cursor-text"
          (click)="$event.target.select()"
        />
      </div>
      <app-common-button-v35
        [type]="{ style: 'filled', name: 'main' }"
        [text]="linkCopied() ? 'Copied!' : 'Copy'"
        [isAddIcon]="true"
        [icon]="linkCopied() ? faCircleCheck : faCopy"
        (click)="copyLink()"
        [customClasses]="'!h-[38px]'"
        width="100px"
      ></app-common-button-v35>
    </div>

    <!-- Share Options -->
    <div class="mb-4">
      <p class="text-sm font-medium text-secondary-text-color mb-3">
        Share via
      </p>
      <div class="grid grid-cols-4 gap-3">
        <!-- WhatsApp -->
        <button
          (click)="shareViaWhatsApp()"
          class="flex flex-col items-center gap-2 p-3 rounded-lg bg-secondary-background-color hover:bg-tertiary-background-color transition-colors"
        >
          <fa-icon
            [icon]="faWhatsapp"
            class="text-2xl text-[#25D366]"
          ></fa-icon>
          <span class="text-xs text-main-text-color">WhatsApp</span>
        </button>

        <!-- Facebook -->
        <button
          (click)="shareViaFacebook()"
          class="flex flex-col items-center gap-2 p-3 rounded-lg bg-secondary-background-color hover:bg-tertiary-background-color transition-colors"
        >
          <fa-icon
            [icon]="faFacebook"
            class="text-2xl text-[#1877F2]"
          ></fa-icon>
          <span class="text-xs text-main-text-color">Facebook</span>
        </button>

        <!-- Twitter/X -->
        <button
          (click)="shareViaTwitter()"
          class="flex flex-col items-center gap-2 p-3 rounded-lg bg-secondary-background-color hover:bg-tertiary-background-color transition-colors"
        >
          <fa-icon
            [icon]="faXTwitter"
            class="text-2xl text-main-text-color"
          ></fa-icon>
          <span class="text-xs text-main-text-color">X</span>
        </button>

        <!-- Email -->
        <button
          (click)="shareViaEmail()"
          class="flex flex-col items-center gap-2 p-3 rounded-lg bg-secondary-background-color hover:bg-tertiary-background-color transition-colors"
        >
          <fa-icon
            [icon]="faEnvelope"
            class="text-2xl text-common-blue-color"
          ></fa-icon>
          <span class="text-xs text-main-text-color">Email</span>
        </button>
      </div>
    </div>
  </div>
  <!-- modal body end -->
  <div class="flex justify-end gap-3 pt-8">
    <app-common-button-v35
      [type]="{ style: 'bordered', name: 'main' }"
      text="Close"
      (click)="close()"
      width="100px"
    ></app-common-button-v35>
    <app-common-button-v35
      [type]="{ style: 'filled', name: 'main' }"
      text="Download QR"
      [isAddIcon]="true"
      [icon]="faDownload"
      [loading]="isDownloading()"
      [disabled]="isDownloading()"
      (click)="downloadQrCode()"
      width="140px"
    ></app-common-button-v35>
  </div>
</div>
