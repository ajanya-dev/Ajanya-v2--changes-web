<div
  class="flex flex-col rounded-md border border-input-border-color shadow-common-button p-3"
>
  @if (cosmeticButtons()) {
    <div class="flex gap-2">
      @for (button of buttons; track button) {
        <span class="size-3 rounded-full" [ngClass]="button"></span>
      }
    </div>
    <div class="h-2.5"></div>
  }
  <div class="relative p-2 rounded-[3px] bg-tertiary-background-color min-h-14">
    <button
      [disabled]="copied()"
      (click)="copy()"
      matTooltip="Copy"
      class="absolute right-2.5 top-2.5 size-9 flex justify-center items-center rounded-[3px] border-2 border-input-border-color text-main-text-color font-roboto"
    >
      <fa-icon [icon]="copied() ? faCheck : faCopy" />
    </button>
    <pre class="text-sm">{{ code() }}</pre>
  </div>
</div>
