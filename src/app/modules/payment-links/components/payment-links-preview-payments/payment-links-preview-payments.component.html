<div class="main-div h-full flex flex-col">
  <div class="flex justify-center py-[0.5em]">
    <div class="custom-switch1">
      <div class="slider-container">
        <div class="slider shadow-sm slider-state2"></div>
      </div>
      <div class="switch-container flex justify-between">
        <div
          class="items-center cursor-pointer flex justify-center switch-item"
        >
          <span class="text-main-text-color">One Time</span>
        </div>
        <div
          class="switch-item flex justify-center items-center cursor-pointer"
        >
          <span class="font-black">Recurring</span>
        </div>
      </div>
    </div>
  </div>
  <div class="flex-auto">
    <div [formGroup]="form">
      <div class="single_input_pl mt-[1em]">
        <input
          placeholder=" "
          formControlName="amount"
          type="number"
          class="input_style_pl"
          maxlength="10"
        />
        <label class="floating_label_field">
          Amount<span class="required">*</span>
        </label>
      </div>
      <div class="single_input_pl mt-[1em]">
        <input
          placeholder=" "
          type="text"
          formControlName="email"
          class="input_style_pl"
          maxlength="320"
        />
        <label class="floating_label_field">
          Email<span class="required">*</span>
        </label>
      </div>
      @if (config().companyNameNeeded) {
        <div class="single_input_pl mt-[1em]">
          <input
            placeholder=" "
            formControlName="companyName"
            type="text"
            class="input_style_pl"
            maxlength="50"
          />
          <label class="floating_label_field">
            Company Name<span class="required">*</span>
          </label>
        </div>
      }
    </div>
    <div
      class="font-roboto text-main-text-color font-semibold text-[0.75em] mt-[1em] ml-[0.25em]"
    >
      Choose Payment Method
    </div>
    <div class="m-[0.25em] payment-options-wrapper">
      <button
        class="w-full payment-option flex items-center shadow-sm"
        (click)="changePayByCheckVisibility()"
      >
        <fa-icon
          class="text-[1.0625em] text-common-green-color"
          [icon]="faMoneyCheck"
        />
        PAY BY BANK
      </button>

      @if (config().creditCard) {
        <button
          class="payment-option credit-card flex items-center shadow-sm w-full"
        >
          <fa-icon
            class="text-common-yellow-color text-[1.0625em]"
            [icon]="faCreditCard"
          />
          CREDIT CARD
        </button>
      }

      @if (config().card) {
        <button class="payment-option card flex items-center shadow-sm">
          <fa-icon
            class="text-common-violet-color text-[1.0625em]"
            [icon]="faCcVisa"
          />
          DEBIT CARD
        </button>
      }

      @if (config().paypal) {
        <button class="payent-option-wrapper-paypal overflow-hidden">
          <div class="payment-option paypal flex items-center shadow-sm">
            <img
              width="1.25em"
              height="1em"
              ngSrc="assets/images/payment-links/paypal.svg"
            />
            PAYPAL
          </div>
        </button>
      }

      @if (config().bitpay) {
        <button class="payent-option-wrapper-paypal">
          <div class="payment-option paypal flex items-center shadow-sm">
            <img
              width="1.25em"
              height="1em"
              ngSrc="assets/images/payment-links/bitpay.svg"
            />
            BITPAY
          </div>
        </button>
      }

      @if (config().stripe) {
        <button
          class="payment-option stripe-checkout flex items-center shadow-sm"
        >
          <fa-icon [icon]="faStripeS" />
          STRIPE CHECKOUT
        </button>
      }
    </div>
  </div>
</div>
