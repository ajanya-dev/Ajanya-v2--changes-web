<div
  [ngStyle]="{ fontSize: baseSize() }"
  class="modal-container bg-main-background-color rounded-[0.4375em] max-w-full w-[50em] h-[34.375em] flex p-[0.625em] border border-input-border-color"
>
  <div class="details-banner min-w-[50%] h-full">
    <app-payment-links-preview-banner [bannerData]="bannerData()" />
  </div>
  <div class="right-section flex flex-col overflow-hidden h-full min-w-[50%] my-auto">
    <div class="right-child flex flex-col h-full">
      <div class="px-[1.25em] pt-[1.25em] flex justify-between items-center">
        <button
          class="gap-[0.3125em] items-center inline-flex whitespace-nowrap cursor-pointer rounded-md border border-input-border-color font-roboto font-medium text-[0.8125em] px-[0.625em]"
        >
          <fa-icon [icon]="faAngleLeft"></fa-icon>
        </button>
        <button
          class="gap-[0.3125em] items-center inline-flex whitespace-nowrap cursor-pointer rounded-md border border-input-border-color font-roboto font-medium text-[0.8125em] px-[0.625em]"
        >
          <fa-icon [icon]="faXmark"></fa-icon>
        </button>
      </div>
      <div class="flex-auto h-full">
        <app-payment-links-preview-payments
          (updateAmount)="updateAmount($event)"
          [config]="paymentsConfig()"
        />
      </div>
    </div>
  </div>
</div>
