<div class="px-[6px] pb-[6px]">
  <div class="flex justify-between pb-6">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
        <span class="pl-1 font-inter font-semibold text-base pb-0.5">
          Payments
        </span>
      </span>
    </div>
    <div mat-dialog-close>
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      />
    </div>
  </div>
  <div>
    <app-v3-data-table
      [columnDefs]="columnDefs"
      [defaultColumnFields]="columnFields"
      [tableId]="tableId"
      [frameworkComponents]="frameworkComponents"
      [additionalPayload]="{
        linkId: dialogData.row.id
      }"
    />
  </div>
</div>
