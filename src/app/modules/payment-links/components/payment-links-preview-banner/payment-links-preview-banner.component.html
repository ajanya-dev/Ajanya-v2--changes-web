<div class="text-main-text-color h-full flex flex-col relative">
  <span class="text-sm font-medium text-secondary-text-color mb-2">
    Link Preview
  </span>
  <div class="p-[0.625em] flex-1 flex flex-col justify-center items-center">
    <div class="items-center flex flex-col">
      <div
        class="shadow-common-box-shadow w-[4.375em] h-[4.375em] rounded-full overflow-hidden flex-shrink-0 relative"
      >
        <img
          class="h-full w-full max-h-full aspect-auto object-cover"
          [ngSrc]="imageSrc() || 'assets/images/payment-links/company.svg'"
          fill
          alt="Company Logo"
        />
      </div>
      <div
        class="text-[1.5em] font-medium font-roboto ml-[0.5em] text-nowrap overflow-hidden text-ellipsis"
      >
        {{ bannerData()?.companyName ?? "" }}
      </div>
    </div>
    <div class="text-secondary-text-color font-roboto font-normal mt-[1em]">
      <span>Paying Once </span>
    </div>
    <div
      class="text-[2.25em] font-medium font-roboto text-secondary-text-color mt-[0.5em]"
    >
      {{ bannerData()?.amount || 0 | currency }}
    </div>
  </div>
  <div class="absolute bottom-[1em] left-0 right-0 flex justify-center items-center gap-2">
    <p class="text-sm font-semibold text-main-text-color">Powered by</p>
    <img
      src="assets/main/zil_Money_logo.svg"
      alt="Powered by Zil Money"
      class="h-[1.5em]"
    />
  </div>
</div>
