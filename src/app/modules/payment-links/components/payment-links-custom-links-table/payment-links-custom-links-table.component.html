<div class="relative">
  <app-v3-data-table
    [columnDefs]="columnDefs"
    [defaultColumnFields]="columnFields"
    [tableId]="tableId"
    [additionalPayload]="{
      linkId: link()?.id
    }"
    [headerElements]="headerElements"
    [frameworkComponents]="frameworkComponents"
    (headerButtonEvent)="headerButtonNavigation($event)"
    (cellRendererIdEvent)="getActionComp($event)"
  />
  <div class="absolute top-0 right-[168px]">
    <app-common-button-v35
    class="whitespace-nowrap"
    text="Import CSV"
    [type]="{ name: 'list', style: 'green' }"
    [disableHoverEffect]="false"
    customClasses="font-extralight p-0"
    backGroundInput="transparent"
    [isAddIcon]="true"
    toolTip="Upload a CSV file to import your custom links."
    [icon]="['fas', 'arrow-down-to-line']"
    (clickEvent)="openImportModal()"
  />
  </div>
</div>
