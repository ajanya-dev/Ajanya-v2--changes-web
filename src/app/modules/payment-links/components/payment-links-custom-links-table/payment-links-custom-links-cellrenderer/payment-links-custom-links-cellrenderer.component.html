<div class="flex items-center justify-start">
  <fa-icon
    [matMenuTriggerFor]="menu"
    class="text-common-blue-color cursor-pointer px-1.5"
    size="lg"
    [icon]="faEllipsisVertical"
  />
  <button class="h-fit w-fit relative">
    <fa-icon
      class="text-common-blue-color cursor-pointer"
      matTooltip="See Transactions"
      size="lg"
      (click)="onClick('Rid_view')"
      [icon]="faEye"
    />
  </button>
</div>
<mat-menu #menu="matMenu">
  @if (params) {
    <div class="flex flex-col gap-0.5 px-1.5">
      @for (item of params.buttons; track item.id) {
        <button
          class="flex items-center justify-start gap-2 p-1.5 hover:bg-secondary-background-color rounded"
          (click)="onClick(item.id)"
          [disabled]="item.id === 'RId_edit' && paymentsCount > 0"
          [ngClass]="{
            'text-secondary-text-color opacity-50':
              item.id === 'RId_edit' && paymentsCount > 0
          }"
        >
          <fa-icon [icon]="item.icon" />
          <span class="text-sm">{{ item.name }}</span>
        </button>
      }
    </div>
  }
</mat-menu>
