<section class="main_common_module relative !max-w-[1550px] !mx-auto">

  <!-------- left section start -------->
  <div class="main_left_wrapper relative">
    <!-- top section start -->
    <div class="module_top_section">
      <!-- main body -->
      <div class="module_main_body pt-3">
        <app-v3-data-table
        class="mx-5"
        [columnDefs]="columnDefs"
        [tableId]="tableId"
        [backButtonEnabled]="true"
        (rowClicked)="rowClicked($event)"
        [defaultColumnFields]="columnFields"
        [frameworkComponents]="frameworkComponents"
        dynamicHeaderText="Webhook Events"
      >
      </app-v3-data-table>
      </div>
    </div>
    <!-- Global Search - Top Right -->
    <div class="absolute top-[44px] right-[190px] z-10">
      <div
        class="flex items-center gap-2 px-3 py-2 bg-main-background-color rounded-lg shadow-sm border border-input-border-color hover:border-common-blue-color transition-all duration-200"
        [ngClass]="{ '!border-common-blue-color ring-1 ring-common-blue-color/20': globalSearchValue }"
      >
        <fa-icon
          class="text-main-text-color text-sm"
          [icon]="faSearch"
        ></fa-icon>
        <input
          type="text"
          [(ngModel)]="globalSearchValue"
          placeholder="Global Search..."
          (keyup)="onGlobalSearch($event)"
          class="w-[180px] bg-transparent border-none outline-none text-sm text-common-font-color placeholder:text-secondary-text-color"
        />
        @if (globalSearchValue) {
          <fa-icon
            (click)="resetGlobalSearch()"
            class="text-secondary-text-color hover:text-common-red-color cursor-pointer text-sm transition-colors duration-200"
            [icon]="faXmark"
          ></fa-icon>
        }
      </div>
    </div>
    <!-- top section end -->
  </div>
  <!--------left section end -------->

  <!-------- right section start -------->
  <div class="main_right_section">
    <!-- top section start -->
    <div class="module_top_section">
      <div class="main__header">
        <div class="left"></div>
        <div class="copied_to_clicp">
          <button (click)="copyThisLink(copyText)">
            <fa-icon
              class="!text-[20px] w-5 h-5 !text-common-blue-color cursor-pointer"
              [icon]="['fas', 'copy']"
            ></fa-icon>
          </button>
          <span class="copiedtext" [ngClass]="{ copied: copyCLass }" #copied
            >Copied to clipboard</span
          >
        </div>
      </div>
      <!-- main body -->
      <div class="module_body">
        <div class="max-w-[700px]">
          <pre
            class="dark-mode json_viewer"
            #copyText
          >{{ jsonArry | json }}</pre>
        </div>
      </div>
    </div>
    <!-- top section end -->
  </div>
  <!-------- right section end -------->
</section>
