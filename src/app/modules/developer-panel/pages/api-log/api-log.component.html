<div class="bg-secondary-background-color">
  <div
    class="common-transaction-table-container relative pt-3 px-5 bg-main-background-color"
  >

    <div class="transaction-table">
        <form [formGroup]="searchForm" (ngSubmit)="searchByEventId()"
          class="mb-4 w-full max-w-xl rounded-lg border border-input-border-color bg-main-background-color p-4 shadow-sm">
          <div class="flex items-center gap-2">
            <fa-icon [icon]="faMagnifyingGlass" class="text-primary text-sm"></fa-icon>
            <h3 class="m-0 text-base font-semibold text-main-text-color">Quick search</h3>
          </div>
          <p class="m-0 mt-0.5 text-sm font-thin text-secondary-text-color">
            Look up a single log instantly by its Event Id.
          </p>
          <div class="mt-3 flex items-start gap-2">
            <div class="flex-1">
              <app-common-input-field
                [placeholder]="'Enter Event Id'"
                formControlName="eventId"
                [control]="searchForm.controls.eventId"
                [isFieldRequired]="true"
                [maxLength]="30"
                [isNumberOnly]="true"
                ></app-common-input-field>
            </div>
            <app-common-button-v35 text="Search" 
              [type]="{ style: 'filled', name: 'main' }"
              [btnType]="'submit'" 
              [loading]="searchLoading()"
              [disabled]="searchDisabled"
              [toolTip]="searchDisabled?'Enter Valid Event Id':''"
              ></app-common-button-v35>
          </div>
        </form>

      <app-v3-data-table
        [columnDefs]="columnDefs"
        [tableId]="tableId"
        [frameworkComponents]="frameworkComponents"
        [backButtonEnabled]="true"
        dynamicHeaderText="API Settings : Log"
      >
      </app-v3-data-table>
    </div>
  </div>
</div>
