<div
  class="relative overflow-hidden p-6 bg-v4-secondary-background-color border-2 border-v4-border-color rounded-xl"
  style="box-shadow: rgba(0, 0, 0, 0.05) 0px 1px 2px 0px"
>
  <div class="relative z-10">

    <!-- Header row -->
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-4">
        <h2 class="text-sm font-bold text-v4-main-text-color">Webhook Settings</h2>
        <!-- NEW / OLD pill tabs -->
        <div class="flex gap-2">
          <button
            type="button"
            (click)="activeTab.set('new')"
            [class]="activeTab() === 'new'
              ? 'px-4 py-1.5 rounded-lg text-xs font-semibold bg-v4-primary-brand-color text-white transition-all'
              : 'px-4 py-1.5 rounded-lg text-xs font-semibold text-v4-secondary-text-color hover:bg-v4-tertiary-background-color transition-all'"
          >NEW</button>
          <button
            type="button"
            (click)="activeTab.set('old')"
            [class]="activeTab() === 'old'
              ? 'px-4 py-1.5 rounded-lg text-xs font-semibold bg-v4-primary-brand-color text-white transition-all'
              : 'px-4 py-1.5 rounded-lg text-xs font-semibold text-v4-secondary-text-color hover:bg-v4-tertiary-background-color transition-all'"
          >OLD</button>
        </div>
      </div>
      <!-- Collapse toggle -->
      <button
        type="button"
        (click)="collapsed.set(!collapsed())"
        class="p-2 hover:bg-v4-tertiary-background-color rounded transition-colors"
        [title]="collapsed() ? 'Expand' : 'Collapse'"
      >
        <lucide-icon
          [name]="collapsed() ? 'chevron-down' : 'chevron-up'"
          [size]="20"
          class="text-v4-secondary-text-color"
        />
      </button>
    </div>

    <!-- Form body -->
    @if (!collapsed()) {
      <div
        [class.opacity-60]="loading()"
        [class.pointer-events-none]="loading()"
      >

        <!-- ===== NEW tab ===== -->
        @if (activeTab() === 'new') {
          <form [formGroup]="getpaidWebhookForm" class="space-y-5">

            <!-- Webhook URL -->
            <div>
              <app-common-input-v4
                [fieldLabel]="'Webhook URL'"
                [placeholder]="'https://your-webhook-url.com'"
                [control]="getpaidWebhookForm.controls['getPaidWebhookurl']"
                formControlName="getPaidWebhookurl"
                [type]="'url'"
                [autocomplete]="'off'"
                [showInfoIcon]="true"
                [tooltip]="'Webhook URL is the place where we will send status'"
              />
            </div>

            <!-- Secret Key -->
            <div>
              <app-common-input-v4
                [fieldLabel]="'Secret Key'"
                [placeholder]="'Enter a secret key to verify webhook signatures'"
                [isFieldRequired]="false"
                [control]="getpaidWebhookForm.controls['getPaidSecret']"
                formControlName="getPaidSecret"
                [type]="'password'"
                [autocomplete]="'new-password'"
                [showInfoIcon]="true"
                [tooltip]="'You can set any key to verify it is going from Zil Money'"
              />
            </div>

            <!-- Status -->
            <div>
              <label class="block text-xs font-medium text-v4-secondary-text-color mb-1.5 tracking-wide" for="getPaidStatus">Status</label>
              <div class="flex gap-4">
                <label class="flex items-center gap-2 cursor-pointer">
                  <input
                    type="radio"
                    formControlName="getPaidStatus"
                    value="1"
                    class="v4-radio-md"
                  />
                  <span class="text-xs text-v4-main-text-color">Enabled</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                  <input
                    type="radio"
                    formControlName="getPaidStatus"
                    value="0"
                    class="v4-radio-md"
                  />
                  <span class="text-xs text-v4-main-text-color">Disabled</span>
                </label>
              </div>
            </div>

            <!-- Events Subscription -->
            <div>
              <div class="flex items-center justify-between mb-1.5">
                <label class="flex items-center gap-1 text-xs font-medium text-v4-secondary-text-color tracking-wide" for="eventsSubscription">
                  Events Subscription
                  <lucide-icon
                    name="info"
                    [size]="13"
                    class="text-v4-secondary-text-color cursor-pointer shrink-0"
                    matTooltip="You can set the events you want to receive"
                  />
                </label>
                <span class="text-xs text-v4-secondary-text-color">
                  {{ selectedEvents.length }} events selected
                </span>
              </div>
              <div
                class="events-subscription-container grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-64 overflow-y-auto rounded-lg p-3"
              >
                @for (event of webhookEvents; track event) {
                  <label class="flex items-start gap-2 cursor-pointer">
                    <input
                      type="checkbox"
                      class="mt-0.5 shrink-0 v4-checkbox-md"
                      [checked]="isEventSelected(event)"
                      (change)="onCheckedGpbf($any($event.target).checked, event)"
                    />
                    <span class="text-xs text-v4-secondary-text-color break-all">{{ event }}</span>
                  </label>
                }
              </div>
            </div>

            <!-- Update button -->
            <div class="pt-2">
              <app-common-button-v4
                [type]="{ style: 'primary', name: 'main' }"
                text="Update"
                customHeight="44px"
                [loading]="saveLoading()"
                [disabled]="selectedEvents.length === 0"
                (clickEvent)="saveWebhook()"
              />
            </div>

          </form>
        }

        <!-- ===== OLD tab ===== -->
        @if (activeTab() === 'old') {
          <form [formGroup]="webhookForm" class="space-y-5">

            <!-- Webhook URL -->
            <div>
              <app-common-input-v4
                [fieldLabel]="'Webhook URL'"
                [placeholder]="'https://your-webhook-url.com'"
                [control]="webhookForm.controls['webhookUrl']"
                formControlName="webhookUrl"
                [type]="'url'"
                [autocomplete]="'off'"
              />
            </div>

            <!-- Secret Key -->
            <div>
              <app-common-input-v4
                [fieldLabel]="'Secret Key'"
                [placeholder]="'Enter a secret key to verify webhook signatures'"
                [isFieldRequired]="false"
                [control]="webhookForm.controls['secrectKey']"
                formControlName="secrectKey"
                [type]="'password'"
                [autocomplete]="'new-password'"
              />
            </div>

            <!-- Status -->
            <div>
              <label class="block text-xs font-medium text-v4-secondary-text-color mb-1.5 tracking-wide" for="webhookStatus">Status</label>
              <div class="flex gap-4">
                <label class="flex items-center gap-2 cursor-pointer">
                  <input
                    type="radio"
                    formControlName="webhookStatus"
                    value="1"
                    class="v4-radio-md"
                  />
                  <span class="text-xs text-v4-main-text-color">Enabled</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                  <input
                    type="radio"
                    formControlName="webhookStatus"
                    value="0"
                    class="v4-radio-md"
                  />
                  <span class="text-xs text-v4-main-text-color">Disabled</span>
                </label>
              </div>
            </div>

            <!-- Event checkboxes -->
            <div class="space-y-2">
              <label class="block text-xs font-medium text-v4-secondary-text-color mb-2 tracking-wide" for="selectEvent">
                Select an event Update
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input
                  type="checkbox"
                  class="v4-checkbox-md"
                  [checked]="mailTrackChecked"
                  (change)="onCheckedOld($any($event.target).checked, 1)"
                />
                <span class="text-xs text-v4-secondary-text-color">Mail Tracking Status</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input
                  type="checkbox"
                  class="v4-checkbox-md"
                  [checked]="checkStatusChecked"
                  (change)="onCheckedOld($any($event.target).checked, 2)"
                />
                <span class="text-xs text-v4-secondary-text-color">Send Check Status Update</span>
              </label>
            </div>

            <!-- Update button -->
            <div class="pt-2">
              <app-common-button-v4
                [type]="{ style: 'primary', name: 'main' }"
                text="Update"
                customHeight="44px"
                [loading]="saveLoading()"
                [disabled]="webhookForm.controls['mailTrack'].value === '' && webhookForm.controls['sendCheckUpdate'].value === ''"
                (clickEvent)="saveWebhook()"
              />
            </div>

          </form>
        }

      </div>
    }

  </div>
</div>
