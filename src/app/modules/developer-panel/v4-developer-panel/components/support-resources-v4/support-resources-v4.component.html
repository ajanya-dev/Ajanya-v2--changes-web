<div
  class="overflow-hidden p-6 bg-v4-secondary-background-color border-2 border-v4-border-color rounded-xl sticky top-6"
  style="box-shadow: rgba(0, 0, 0, 0.05) 0px 1px 2px 0px"
>
  <h2 class="text-sm font-bold text-v4-main-text-color mb-4">
    Support &amp; Resources
  </h2>

  <div class="space-y-3">
    <!-- Documentation -->
    <div appWhiteLabel shownIf="isDocumentationShown">
      <p class="text-xs text-v4-secondary-text-color mb-1">Documentation</p>
      <a
        [href]="wl.apiDocumentation"
        target="_blank"
        rel="noopener"
        class="text-xs text-v4-primary-brand-bold-color hover:underline flex items-center gap-1"
      >
        API Documentation
        <lucide-icon name="external-link" [size]="10" />
      </a>
    </div>
    <!-- Webhook Documentation -->
    <div appWhiteLabel shownIf="isWebhookDocumentationShown">
      <p class="text-xs text-v4-secondary-text-color mb-1">
        Webhook Documentation
      </p>
      <a
        [href]="webhookDocsUrl"
        target="_blank"
        rel="noopener"
        class="text-xs text-v4-primary-brand-bold-color hover:underline flex items-center gap-1"
      >
        Click here to see
        <lucide-icon name="external-link" [size]="10" />
      </a>
    </div>

    <!-- API Log -->
    <div>
      <p class="text-xs text-v4-secondary-text-color mb-1">API Log</p>
      <a
        routerLink="../api-logs"
        class="text-xs text-v4-primary-brand-bold-color hover:underline flex items-center gap-1"
      >
        See API Logs
        <lucide-icon name="external-link" [size]="10" />
      </a>
    </div>

    <!-- Webhook logs -->
    <div>
      <p class="text-xs text-v4-secondary-text-color mb-1">Webhook logs</p>
      <a
        routerLink="../webhook-logs"
        class="text-xs text-v4-primary-brand-bold-color hover:underline flex items-center gap-1"
      >
        See Webhook History
        <lucide-icon name="external-link" [size]="10" />
      </a>
    </div>
  </div>

  <!-- Action buttons -->
  <div class="mt-6 pt-6 border-t border-v4-border-color space-y-2">
    <!-- HELP: hidden if hideLiveChat flag is set -->
    <div appWhiteLabel hiddenIf="hideLiveChat">
      <app-common-button-v4
        [type]="{ style: 'outline', name: 'main' }"
        text="HELP"
        lucideIcon="message-circle"
        [lucideIconSize]="14"
        width="100%"
        (clickEvent)="goToLiveChat()"
      />
    </div>

    <!-- Email -->
    <a [href]="'mailto:' + wl.customerSupportEmail" class="block">
      <app-common-button-v4
        [type]="{ style: 'outline', name: 'main' }"
        text="Email"
        lucideIcon="mail"
        [lucideIconSize]="14"
        width="100%"
      />
    </a>

    <!-- Support: tel if customerSupportNo exists, else helpWebsite -->
    @if (wl.customerSupportNo) {
      <a [href]="'tel:' + wl.customerSupportNo" class="block">
        <app-common-button-v4
          [type]="{ style: 'outline', name: 'main' }"
          text="Support"
          lucideIcon="headphones"
          [lucideIconSize]="14"
          width="100%"
        />
      </a>
    } @else {
      <a [href]="wl.helpWebsite" target="_blank" rel="noopener noreferrer" class="block">
        <app-common-button-v4
          [type]="{ style: 'outline', name: 'main' }"
          text="Contact Us"
          lucideIcon="headphones"
          [lucideIconSize]="14"
          width="100%"
        />
      </a>
    }
  </div>
</div>
