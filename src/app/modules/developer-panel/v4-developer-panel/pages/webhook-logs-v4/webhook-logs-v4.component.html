<div>
  <app-v4-page-header
    [title]="'Webhook Logs'"
    subtitle="View all outgoing webhook events and their responses"
    [showBackButton]="true"
    backButtonType="takeEvent"
    (backEvent)="goBack()"
  />

  <!-- Data table -->
  <app-v4-data-table
    class="block mt-4"
    [columnDefs]="gridColumnDefs"
    [defaultDisabledColumn]="disabledColumns"
    [tableId]="tableId"
    [frameworkComponents]="frameworkComponents"
    [suppressRowClickSelection]="true"
    [useCustomEmptyState]="true"
    [emptyStateConfig]="{
      icon: 'webhook',
      title: 'No webhook events yet',
      description:
        'Outgoing deliveries and the responses your endpoints return will appear here once events start firing.',
      buttonText: ''
    }"
    [toolbarRightTemplate]="globalSearchTmpl"
    (cellRendererViewEvent)="onViewLog($event)"
    (rowClicked)="onRowClicked($event)"
  />
</div>

<!-- Detail side panel -->
<app-webhook-log-drawer-v4
  [isOpen]="isPanelOpen()"
  [row]="selectedRow()"
  [payload]="selectedPayload()"
  (closed)="closePanel()"
/>

<!-- Global search template injected into the v4 data-table toolbar -->
<ng-template #globalSearchTmpl>
  <div
    class="flex items-center gap-2 h-8 px-3 rounded-md border border-v4-input-border-color bg-v4-secondary-background-color hover:border-v4-brand-focus-color focus-within:border-v4-brand-focus-color focus-within:ring-1 focus-within:ring-v4-brand-focus-color transition-colors"
  >
    <lucide-icon
      name="search"
      [size]="14"
      class="text-v4-secondary-text-color"
    />
    <input
      type="text"
      [(ngModel)]="globalSearchValue"
      (keyup)="onGlobalSearch($event)"
      placeholder="Global Search"
      class="w-[180px] bg-transparent border-0 outline-none text-xs text-v4-main-text-color placeholder:text-v4-subtle-text-color"
    />
    @if (globalSearchValue) {
      <lucide-icon
        name="x"
        [size]="14"
        role="button"
        aria-label="Clear global search"
        class="cursor-pointer text-v4-secondary-text-color hover:text-v4-common-red-color transition-colors"
        (click)="resetGlobalSearch()"
      />
    }
  </div>
</ng-template>
