<app-detail-side-panel
  [isOpen]="isOpen()"
  [width]="'clamp(460px, 34vw, 640px)'"
  [expandable]="true"
  [expandedWidth]="'min(1150px, 94vw)'"
  [panelId]="'webhook-log-detail'"
  (expandedChange)="isPanelExpanded.set($event)"
  [title]="panelTitle()"
  [subtitle]="panelSubtitle()"
  [iconTemplate]="panelIcon"
  [statusBadge]="panelStatusBadge()"
  [contentTemplate]="bodyContent"
  (closed)="closed.emit()"
/>

<ng-template #panelIcon>
  <div
    class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-v4-primary-brand-color"
  >
    <lucide-icon name="zap" [size]="18" color="white"></lucide-icon>
  </div>
</ng-template>

<ng-template #bodyContent>
  <div
    class="panel-body panel-body--surface panel-body--capped"
    [class.panel-body--expanded]="isPanelExpanded()"
  >
    @if (row()) {
      <!-- Event details -->
      <div class="pd-card pd-full">
        <button
          type="button"
          class="pd-card-head"
          (click)="toggleCard('event')"
        >
          <span class="pd-card-title">Event details</span>
          <lucide-icon
            [name]="isCardCollapsed('event') ? 'chevron-down' : 'chevron-up'"
            [size]="15"
            class="text-v4-tertiary-text-color"
          ></lucide-icon>
        </button>
        @if (!isCardCollapsed("event")) {
          <div class="pd-card-body">
            <div class="pd-row">
              <span class="pd-row-label">Status</span>
              <span
                class="pd-row-value uppercase"
                [style.color]="panelStatusBadge()?.color"
                >{{ status() || "—" }}</span
              >
            </div>
            <div class="pd-row">
              <span class="pd-row-label">Event ID</span>
              <span class="pd-row-value break-all text-right">{{
                eventId() || "—"
              }}</span>
            </div>
            <div class="pd-row">
              <span class="pd-row-label">Event type</span>
              <span class="pd-row-value break-all text-right">{{
                eventType() || "—"
              }}</span>
            </div>
            <div class="pd-row">
              <span class="pd-row-label">Created at</span>
              <app-pd-date-time
                class="pd-row-value text-right"
                [value]="createdAt()"
              />
            </div>
          </div>
        }
      </div>

      <!-- Payload -->
      <div class="pd-card pd-full">
        <button
          type="button"
          class="pd-card-head"
          (click)="toggleCard('payload')"
        >
          <span class="pd-card-title">Payload</span>
          <lucide-icon
            [name]="isCardCollapsed('payload') ? 'chevron-down' : 'chevron-up'"
            [size]="15"
            class="text-v4-tertiary-text-color"
          ></lucide-icon>
        </button>
        @if (!isCardCollapsed("payload")) {
          <div class="pd-card-body">
            <app-log-code-block-v4 [content]="payloadJson()" />
          </div>
        }
      </div>
    } @else {
      <div class="pd-empty">
        <p class="m-0 py-8 text-center text-sm text-v4-tertiary-text-color">
          No event details available.
        </p>
      </div>
    }
  </div>
</ng-template>
