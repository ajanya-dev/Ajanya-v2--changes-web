<div class="space-y-4 lg:space-y-6">
  <!-- Page header (back button sits inline, same as every other v4 sub-page) -->
  <app-v4-page-header
    [title]="'Developer Panel'"
    subtitle="Manage your API keys, accounts, and webhook settings"
    [showBackButton]="true"
  />

  <!-- Tabs -->
  <div>
    <app-common-tab-v4
      [tabs]="tabs"
      [activeTab]="activeTab()"
      variant="toggle"
      (tabChange)="onTabChange($event)"
    />
  </div>

  <!-- 2-column grid -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Left: tab content (2/3 width) -->
    <div class="lg:col-span-2 space-y-6">
      @if (activeTab() === "api-settings") {
        <app-api-settings-v4 />
      }
      @if (activeTab() === "webhooks") {
        <app-webhooks-v4 />
      }
      @if (activeTab() === "bank-accounts") {
        <app-bank-accounts-v4 />
      }
    </div>

    <!-- Right: sidebar (1/3 width) -->
    <div>
      <app-support-resources-v4 />
    </div>
  </div>
</div>
