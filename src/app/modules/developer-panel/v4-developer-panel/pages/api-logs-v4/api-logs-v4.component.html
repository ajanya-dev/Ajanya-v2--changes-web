<div class="flex flex-col w-full space-y-4">
  <!-- Page header -->
  <app-v4-page-header
    title="API Logs"
    subtitle="View all incoming API requests and their responses"
    [showBackButton]="true"
    [backButtonType]="'takeEvent'"
    (backEvent)="goBack()"
  />

  <!-- Quick search by event id -->
  <form
    [formGroup]="searchForm"
    (ngSubmit)="searchByEventId()"
    class="bg-v4-secondary-background-color border border-v4-border-color rounded-xl p-5 w-full max-w-xl"
  >
    <div class="flex items-center gap-2">
      <lucide-icon
        name="search"
        [size]="18"
        class="text-v4-primary-brand-bold-color"
      />
      <h2 class="text-base font-bold text-v4-main-text-color">Quick search</h2>
    </div>
    <p class="text-[13px] text-v4-secondary-text-color mt-1">
      Look up a single log instantly by its Event ID.
    </p>
    <div class="flex items-start gap-3 mt-3">
      <div class="flex-1">
        <app-common-input-v4
          [placeholder]="'Enter Event ID'"
          formControlName="eventId"
          [control]="searchForm.controls.eventId"
          [isFieldRequired]="true"
          [isNumberOnly]="true"
          [maxLength]="30"
        />
      </div>
      <app-common-button-v4
        [type]="{ style: 'primary', name: 'main' }"
        [text]="'Search'"
        [btnType]="'submit'"
        [toolTip]="searchDisabled ? 'Enter a valid event id' : ''"
        [loading]="searchLoading()"
        [disabled]="searchDisabled"
      />
    </div>
  </form>

  <!-- Data table -->
  <app-v4-data-table
    [columnDefs]="columnDefs"
    [tableId]="tableId"
    [frameworkComponents]="frameworkComponents"
    [freeColumnResize]="false"
    [suppressRowClickSelection]="true"
    [useCustomEmptyState]="true"
    [emptyStateConfig]="{
      icon: 'code',
      title: 'No API logs yet',
      description:
        'Requests made against your API keys will appear here with their responses',
      buttonText: ''
    }"
    (cellRendererViewEvent)="onViewLog($event)"
  />
</div>

<!-- Detail side panel -->
<app-api-log-detail-panel-v4
  [isOpen]="isPanelOpen()"
  [loading]="detailLoading()"
  [log]="selectedLog()"
  (closed)="closePanel()"
/>
