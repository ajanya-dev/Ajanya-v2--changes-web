<div class="main_body">
  <div class="main_section">
    <div class="heading">
      <h3>Existing Address</h3>
    </div>

    <div class="address_box">
      <ng-container>
        <div class="data_spinner" *ngIf="spinnerloading"></div>
      </ng-container>
      <div class="address_card" *ngIf="!spinnerloading">
        <div
          class="card"
          *ngFor="let address of addressList; let i = index"
          id="parentElement_{{ i }}"
          [ngClass]="{ active_address: i == 0 }"
          (click)="selectAddress(i, address)"

          <div class="edit_btn" (click)="editAddress(address)">

              width="17"
              height="17"
              viewBox="0 0 17 17"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <g clip-path="url(#clip0_113_693)">

              height="16"

                />
              </g>

                <clipPath id="clip0_111_644">
                  <rect width="16" height="16" fill="white" />
                </clipPath>
              </defs>
            </svg>
          </div>
          <div class="flex flex-col gap-1 address_label">
            <span class="title"
              >{{ address.name }} ({{ address.nickName }})</span
            >
            <span class="address">{{ address.company }}</span>
            <span class="address"
              >{{ address.address1 }}, {{ address.address2 }},
              {{ address.city }}, {{ address.state }}, {{ address.country }},
              {{ address.zip }}</span
            >
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="!spinnerloading">
      <div [hidden]="!showNoResult">
        <div class="not_found_image">Sorry! No result found :(</div>
      </div>
    </div>

    <div class="action_buttons" *ngIf="!spinnerloading">
      <button class="back" (click)="backstep()">Back</button>
      <button class="next" (click)="nextstep()">Next</button>
    </div>
  </div>
</div>
