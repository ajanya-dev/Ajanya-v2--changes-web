<div class="main_body">
  <div class="main_section">
    <div class="flex flex-wrap header">
      <div class="heading">
        <h3>From Address</h3>
      </div>

      <div class="address_btn">
        <button class="addr_btn" (click)="openExistingAddress()">
          Existing Address
        </button>
      </div>
    </div>

    <form [formGroup]="fromAddrForm">
      <div class="input_group">
        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            maxlength="35"
            formControlName="name"
          />
          <span class="floating_label_field"
            >Full Name <span class="required">*</span></span
          >
          <app-control-message
            [control]="fromAddrForm.controls.name"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="nickName"
          />
          <span class="floating_label_field"
            >Nick Name<span class="required">*</span></span
          >
          <app-control-message
            [control]="fromAddrForm.controls.nickName"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            maxlength="35"
            formControlName="company"
          />
          <span class="floating_label_field">Company Name</span>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            mask="(000) 000-0000"
            placeholder=" "
            formControlName="phone"
          />
          <span class="floating_label_field"
            >Phone number<span class="required">*</span></span
          >
          <app-control-message
            [control]="fromAddrForm.controls.phone"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="email"
          />
          <span class="floating_label_field">Email Address</span>
          <app-control-message
            [control]="fromAddrForm.controls.email"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="address1"
            #address1
            (focus)="loadGoogleAddress(address1)"
          />
          <span class="floating_label_field"
            >Address line 1<span class="required">*</span></span
          >
          <app-control-message
            [control]="fromAddrForm.controls.address1"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="address2"
          />
          <span class="floating_label_field">Address line 2</span>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="city"
          />
          <span class="floating_label_field"
            >City<span class="required">*</span></span
          >
          <app-control-message
            [control]="fromAddrForm.controls.city"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="state"
          />
          <span class="floating_label_field"
            >State<span class="required">*</span></span
          >
          <app-control-message
            [control]="fromAddrForm.controls.state"
          ></app-control-message>
        </div>

        <div class="single_input">
          <app-common-country-drop-down
            formControlName="country"
            [isFieldRequired]="true"
            [allowedCountry]="['US']"
            [isV3Component]="false"
          ></app-common-country-drop-down>
          <app-control-message
            [control]="fromAddrForm.controls.country"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="zip"
          />
          <span class="floating_label_field"
            >Zip<span class="required">*</span></span
          >
          <app-control-message
            [control]="fromAddrForm.controls.zip"
          ></app-control-message>
        </div>
      </div>

      <div class="check_box" *ngIf="!isViewReturn">
        <mat-checkbox
          (change)="onChecked($event)"
          formControlName="isReturnAddressSame"
        ></mat-checkbox>
        <p>
          Return address is the same
          <label
            >or
            <p (click)="addAddress()" class="label">
              Enter new Address ?
            </p></label
          >
        </p>
      </div>
      <div class="view" *ngIf="isViewReturn">
        <p class="label" (click)="editAddress()">
          View or Edit the Return Address
        </p>
        <i class="fa-solid fa-circle-check"></i>
      </div>
    </form>
  </div>
</div>

<footer>
  <div class="main_footer">
    <div class="action_buttons">
      <div class="container">
        <button class="back" (click)="backstep()">Back</button>
        <button
          class="next"
          (click)="nextstep()"
          [disabled]="loading"
          [ngClass]="{ btnDisabled: loading }"
        >
          Next
          <ng-container *ngIf="loading" class="loading_spinner">
            <span class="loadingSpinner"></span>
          </ng-container>
        </button>
      </div>
    </div>
  </div>
</footer>
