<div class="main_body">
  <div class="main_section">
    <div class="heading">
      <h3>What you want to ship</h3>
      <p class="sub_heading">
        Select the option you want to ship
        <span
          mat-raised-button
          matTooltipPosition="right"
          matTooltip="By default, card and letter dimensions are set. For the card, dimensions are length ({{
            cardDimension?.length
          }}), width({{ cardDimension?.width }}), height({{
            cardDimension?.height
          }}), and weight({{ cardDimension?.weight }});
         for the letter, dimensions are length({{
            letterDimension?.length
          }}), width({{ letterDimension?.width }}), height({{
            letterDimension?.height
          }}), and weight({{ letterDimension?.weight }}).
        For soft packages and boxes, you can customize the dimensions."
          class="example-button ml-2 toolTip"
        >
          <svg
            width="15"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
            focusable="false"
            data-prefix="fas"
            data-icon="question-circle"
            class="svg-inline--fa fa-question-circle fa-w-16"
            role="img"
            viewBox="0 0 512 512"
          >
            <path
              fill="currentColor"
              d="M504 256c0 136.997-111.043 248-248 248S8 392.997 8 256C8 119.083 119.043 8 256 8s248 111.083 248 248zM262.655 90c-54.497 0-89.255 22.957-116.549 63.758-3.536 5.286-2.353 12.415 2.715 16.258l34.699 26.31c5.205 3.947 12.621 3.008 16.665-2.122 17.864-22.658 30.113-35.797 57.303-35.797 20.429 0 45.698 13.148 45.698 32.958 0 14.976-12.363 22.667-32.534 33.976C247.128 238.528 216 254.941 216 296v4c0 6.627 5.373 12 12 12h56c6.627 0 12-5.373 12-12v-1.333c0-28.462 83.186-29.647 83.186-106.667 0-58.002-60.165-102-116.531-102zM256 338c-25.365 0-46 20.635-46 46 0 25.364 20.635 46 46 46s46-20.636 46-46c0-25.365-20.635-46-46-46z"
            />
          </svg>
        </span>
      </p>
    </div>

    <div class="package">
      <div
        class="package_item"
        *ngFor="let item of shipOptions; let i = index"
        id="parentindexElement_{{ i }}"
        [ngClass]="{ active_package: i == 0 }"
        (click)="selectPackage(i, item)"
      >
        <div class="items">
          <img class="icon" src="{{ item.icon }}" />
          <p class="label">{{ item.name }}</p>
        </div>
      </div>
    </div>

    <div class="line"></div>

    <div class="address_section">
      <div class="form_section">
        <div class="flex flex-wrap header">
          <h3 class="heading">Delivery Address</h3>
          <div class="address_btn">
            <button class="addr_btn" (click)="openExistingAddress()">
              Existing Address
            </button>
          </div>
        </div>
      </div>

      <form [formGroup]="deliverAddrForm">
        <div class="input_group">
          <div class="single_input">
            <input
              type="text"
              class="input_style"
              placeholder=" "
              maxlength="35"
              formControlName="name"
            />
            <span class="floating_label_field"
              >Full Name <span class="required">*</span></span
            >
            <app-control-message
              [control]="deliverAddrForm.controls.name"
            ></app-control-message>
          </div>

          <div class="single_input">
            <input
              type="text"
              class="input_style"
              placeholder=" "
              formControlName="nickName"
            />
            <span class="floating_label_field"
              >Nick Name<span class="required">*</span></span
            >
            <app-control-message
              [control]="deliverAddrForm.controls.nickName"
            ></app-control-message>
          </div>

          <div class="single_input">
            <input
              type="text"
              class="input_style"
              placeholder=" "
              maxlength="35"
              formControlName="company"
            />
            <span class="floating_label_field">Company Name</span>
          </div>

          <div class="single_input">
            <input
              type="text"
              class="input_style"
              mask="(000) 000-0000"
              placeholder=" "
              formControlName="phone"
            />
            <span class="floating_label_field"
              >Phone number<span class="required">*</span></span
            >
            <app-control-message
              [control]="deliverAddrForm.controls.phone"
            ></app-control-message>
          </div>

          <div class="single_input">
            <input
              type="text"
              class="input_style"
              placeholder=" "
              formControlName="email"
            />
            <span class="floating_label_field">Email Address</span>
            <app-control-message
              [control]="deliverAddrForm.controls.email"
            ></app-control-message>
          </div>

          <div class="single_input">
            <input
              type="text"
              class="input_style"
              placeholder=" "
              formControlName="address1"
              #address1
              (focus)="loadGoogleAddress(address1)"
            />
            <span class="floating_label_field"
              >Address line 1<span class="required">*</span></span
            >
            <app-control-message
              [control]="deliverAddrForm.controls.address1"
            ></app-control-message>
          </div>

          <div class="single_input">
            <input
              type="text"
              class="input_style"
              placeholder=" "
              formControlName="address2"
            />
            <span class="floating_label_field">Address line 2</span>
          </div>

          <div class="single_input">
            <input
              type="text"
              class="input_style"
              placeholder=" "
              formControlName="city"
            />
            <span class="floating_label_field"
              >City<span class="required">*</span></span
            >
            <app-control-message
              [control]="deliverAddrForm.controls.city"
            ></app-control-message>
          </div>

          <div class="single_input">
            <input
              type="text"
              class="input_style"
              placeholder=" "
              formControlName="state"
            />
            <span class="floating_label_field"
              >State<span class="required">*</span></span
            >
            <app-control-message
              [control]="deliverAddrForm.controls.state"
            ></app-control-message>
          </div>

          <div class="single_input">
            <app-common-country-drop-down
              formControlName="country"
              [isFieldRequired]="true"
              [allowedCountry]="['US']"
              [isV3Component]="false"
            ></app-common-country-drop-down>
            <app-control-message
              [control]="deliverAddrForm.controls.country"
            ></app-control-message>
          </div>

          <div class="single_input">
            <input
              type="text"
              class="input_style"
              placeholder=" "
              formControlName="zip"
            />
            <span class="floating_label_field"
              >Zip<span class="required">*</span></span
            >
            <app-control-message
              [control]="deliverAddrForm.controls.zip"
            ></app-control-message>
          </div>
        </div>
      </form>

      <div class="action_buttons">
        <button
          class="next"
          (click)="nextstep()"
          [disabled]="loading"
          [ngClass]="{ btnDisabled: loading }"
        >
          Next
          <ng-container *ngIf="loading" class="loading_spinner">
            <span class="loadingSpinner"></span>
          </ng-container>
        </button>
      </div>
    </div>
  </div>
</div>
