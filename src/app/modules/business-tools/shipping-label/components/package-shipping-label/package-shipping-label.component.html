<div class="main_body">
  <div class="main_section">
    <div class="heading">
      <h3>Package Type</h3>
    </div>

    <div class="input_group">
      <div class="input_box">
        <input
          [attr.disabled]="true"
          type="text"
          class="input_style disable"
          placeholder=" "
          maxlength="15"
          value="{{ this.packageType }}"
        />
      </div>
    </div>

    <div class="line"></div>

    <div class="dimension">
      <div class="heading">
        <h3>Dimensions</h3>
      </div>

      <form class="package_box" [formGroup]="packageForm">
        <div class="input_group">
          <div class="single_input">
            <input
              type="text"
              class="input_style"
              placeholder=" "
              maxlength="5"
              formControlName="length"
              mask="separator.2"
              (keypress)="utils.numberOnly($event, 'decimal')"
            />
            <span class="floating_label_field">Length(in)</span>
            <app-control-message
              [control]="packageForm.controls.length"
            ></app-control-message>
          </div>

          <div class="single_input">
            <input
              type="text"
              class="input_style"
              placeholder=" "
              maxlength="5"
              formControlName="width"
              mask="separator.2"
              (keypress)="utils.numberOnly($event, 'decimal')"
            />
            <span class="floating_label_field">Width(in)</span>
            <app-control-message
              [control]="packageForm.controls.width"
            ></app-control-message>
          </div>

          <div class="single_input">
            <input
              type="text"
              class="input_style"
              placeholder=" "
              maxlength="5"
              formControlName="height"
              mask="separator.2"
              (keypress)="utils.numberOnly($event, 'decimal')"
            />
            <span class="floating_label_field">Height(in)</span>
            <app-control-message
              [control]="packageForm.controls.height"
            ></app-control-message>
          </div>

          <div class="single_input weight">
            <input
              type="text"
              class="input_style"
              placeholder=" "
              maxlength="5"
              formControlName="weight"
              mask="separator.2"
              (keypress)="utils.numberOnly($event, 'decimal')"
            />
            <span class="floating_label_field">Weight</span>
            <select name="weight-unit" id="weight-unit" formControlName="unit">
              <option value="lb">lb</option>
              <option value="oz">oz</option>
              <option value="kg">kg</option>
              <option value="g">gm</option>
            </select>
            <app-control-message
              [control]="packageForm.controls.weight"
            ></app-control-message>
          </div>
        </div>

        <div class="image">
          <img
            class="box"
            src="../../../../../../assets/images/shipping-label/box-size.png"
          />
        </div>
      </form>
    </div>
  </div>
</div>

<footer>
  <div class="main_footer">
    <div class="action_buttons">
      <div class="container">
        <button class="back" (click)="backstep()">Back</button>
        <button
          class="next"
          (click)="nextstep()"
          [disabled]="loading"
          [ngClass]="{ btnDisabled: loading }"
        >
          Next
          <ng-container *ngIf="loading" class="loading_spinner">
            <span class="loadingSpinner"></span>
          </ng-container>
        </button>
      </div>
    </div>
  </div>
</footer>
