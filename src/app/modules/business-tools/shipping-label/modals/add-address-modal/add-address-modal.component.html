<div class="main_modal">
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">{{ _data?.mode }} Address</div>
    <div class="close_btn" [mat-dialog-close]="false">
      <svg
        aria-hidden="true"
        focusable="false"
        data-prefix="fal"
        data-icon="times"
        class="svg-inline--fa fa-times fa-w-10"
        role="img"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 320 512"
      >
        <path
          fill="currentColor"
          d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
        ></path>
      </svg>
    </div>
  </div>

  <div class="ocw_modal_body">
    <form [formGroup]="addressForm">
      <div class="input_group">
        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            maxlength="35"
            formControlName="name"
          />
          <span class="floating_label_field"
            >Full Name <span class="required">*</span></span
          >
          <app-control-message
            [control]="addressForm.controls.name"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            maxlength="35"
            minlength="3"
            formControlName="nickName"
          />
          <span class="floating_label_field"
            >Nick Name <span class="required">*</span></span
          >
          <app-control-message
            [control]="addressForm.controls.nickName"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            maxlength="35"
            formControlName="company"
          />
          <span class="floating_label_field">Company Name</span>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            mask="(000) 000-0000"
            placeholder=" "
            formControlName="phone"
          />
          <span class="floating_label_field"
            >Phone number<span class="required">*</span></span
          >
          <app-control-message
            [control]="addressForm.controls.phone"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="email"
          />
          <span class="floating_label_field">Email Address</span>
          <app-control-message
            [control]="addressForm.controls.email"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="address1"
            #address1
            (focus)="loadGoogleAddress(address1)"
          />
          <span class="floating_label_field"
            >Address line 1<span class="required">*</span></span
          >
          <app-control-message
            [control]="addressForm.controls.address1"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="address2"
          />
          <span class="floating_label_field">Address line 2</span>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="city"
          />
          <span class="floating_label_field"
            >City<span class="required">*</span></span
          >
          <app-control-message
            [control]="addressForm.controls.city"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="state"
          />
          <span class="floating_label_field"
            >State<span class="required">*</span></span
          >
          <app-control-message
            [control]="addressForm.controls.state"
          ></app-control-message>
        </div>

        <div class="single_input">
          <app-common-country-drop-down
            formControlName="country"
            [isFieldRequired]="true"
            [allowedCountry]="['US']"
            [isV3Component]="false"
          ></app-common-country-drop-down>
          <app-control-message
            [control]="addressForm.controls.country"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="zip"
          />
          <span class="floating_label_field"
            >Zip<span class="required">*</span></span
          >
          <app-control-message
            [control]="addressForm.controls.zip"
          ></app-control-message>
        </div>
      </div>
    </form>
  </div>

  <div class="ocw_modal_footer">
    <div class="action_buttons">
      <button class="back" [mat-dialog-close]="false">Cancel</button>
      <button class="next" (click)="addAddress()" [disabled]="loading">
        {{ _data?.mode == "Add" ? "Save" : "Update" }}
      </button>
    </div>
  </div>
</div>
