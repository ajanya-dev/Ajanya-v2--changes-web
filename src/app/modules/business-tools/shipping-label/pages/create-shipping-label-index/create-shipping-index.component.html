<div class="main_common_module">
  <div class="main_section">
    <div class="module_top_section">
      <div class="heading flex items-center gap-2">
        <app-ocw-back-button backUrl="manage/business-tools/shipping-label">
        </app-ocw-back-button>
        <h3>Create Shipping Label</h3>
      </div>
      <div class="module_main_body">
        <div class="left_section">
          <div
            class="label_step_section"
            *ngFor="let item of steps; let i = index"
            [ngClass]="{
              active: pageSteps[item.step]?.includes(pageId),
              done: item.step < currentStep
            }"
          >
            <div>
              <i class="fa-solid fa-circle-check"></i>
            </div>
            <p class="label">{{ item.name }}</p>
          </div>

          <!----iphoneView---->
          <div class="psb_progress_bar">
            <div class="psb_progress_wrapper">
              <ng-container *ngFor="let item of steps">
                <div class="single">
                  <div
                    class="rounded"
                    [ngClass]="{
                      active: pageSteps[item.step]?.includes(pageId),
                      completed: item.step < currentStep
                    }"
                  ></div>
                  <p class="label">{{ item.name }}</p>
                </div>
              </ng-container>
            </div>
          </div>
        </div>

        <div class="right_section">
          <div [hidden]="pageId !== 'delivery_address'">
            <app-delivery-address-label
              (emitData)="getEmitedData($event)"
              [shipping_data]="shipping_data"
            >
            </app-delivery-address-label>
          </div>

          <div [hidden]="pageId !== 'from_address'">
            <app-from-address-label
              (emitData)="getEmitedData($event)"
              [shipping_data]="shipping_data"
            >
            </app-from-address-label>
          </div>

          <div [hidden]="pageId !== 'package_page'">
            <app-package-shipping-label
              (emitData)="getEmitedData($event)"
              [shipping_data]="shipping_data"
            >
            </app-package-shipping-label>
          </div>

          <div [hidden]="pageId !== 'rate_page'">
            <app-shipping-label-services
              (emitData)="getEmitedData($event)"
              [shipping_data]="shipping_data"
            >
            </app-shipping-label-services>
          </div>

          <div [hidden]="pageId !== 'existing_addr'">
            <app-existing-shipping-address
              (emitData)="getEmitedData($event)"
              [shipping_data]="shipping_data"
            >
            </app-existing-shipping-address>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
