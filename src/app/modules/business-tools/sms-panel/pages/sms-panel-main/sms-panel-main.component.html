<div class="ocw-td-head">
  <div class="ocw-td-title">
    <h4 class="heading">SMS Panel</h4>
    <div class="ocw-table-head-alert"></div>
  </div>
</div>
<div class="flex" *ngIf="isEnabled == 1">
  <div class="grow sms-main-container data-table-wrapper">
    <div class="tabs-wrapper flex">
      <div
        *ngFor="let tab of tabs"
        [ngClass]="selectedTab.id == tab.id ? 'tab-selected' : ''"
        class="tab flex justify-center items-center mr-5"
        (click)="selectTab(tab)"
      >
        <span
          class="tab-label"
          [ngClass]="selectedTab.id == tab.id ? 'tab-label-selected' : ''"
          >{{ tab.name }}</span
        >
      </div>
    </div>
    <app-sms-table *ngIf="selectedTab.id == 52"></app-sms-table>
    <app-group-table *ngIf="selectedTab.id == 51"></app-group-table>
    <app-contacts *ngIf="selectedTab.id == 4"></app-contacts>
    <app-send-sms
      *ngIf="selectedTab.id == 0"
      (changeTab)="changeTab($event)"
    ></app-send-sms>
    <app-default-message-settings
      *ngIf="selectedTab.id == 1"
    ></app-default-message-settings>
    <app-more-settings
      *ngIf="selectedTab.id == 2"
      [settings]="
        this.selectedTab?.selectedSubTab
          ? this.selectedTab.selectedSubTab
          : false
      "
    ></app-more-settings>
    <app-inbox *ngIf="selectedTab.id == 3"></app-inbox>
    <app-all-sms-log *ngIf="selectedTab.id == 6"></app-all-sms-log>
  </div>
</div>
