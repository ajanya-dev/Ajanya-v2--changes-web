<div class="ocw_modal_header">
  <div class="ocw_modal_title">
    Imported Contacts From Excel/Csv : Match Your Data
  </div>
  <div class="close_btn" [mat-dialog-close]="true">
    <svg
      aria-hidden="true"
      focusable="false"
      data-prefix="fal"
      data-icon="times"
      class="svg-inline--fa fa-times fa-w-10"
      role="img"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 320 512"
    >
      <path
        fill="currentColor"
        d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
      ></path>
    </svg>
  </div>
</div>
<!-- main body -->
<section
  class="main_common_module"
  *ngIf="files.length"
  style="overflow: auto; max-height: 450px; min-height: 250px"
>
  <div class="main_wrapper" style="min-width: 900px">
    <!-- MAIN BODY START -->
    <div class="module_main_body">
      <!-- TABLE WRAPPER -->
      <div class="table">
        <!-- TABLE START -->
        <table class="ocw-table ocw-table-striped">
          <tbody>
            <tr>
              <td>S.No</td>

              <td
                *ngFor="let item of headerColumns; let i = index"
                style="min-width: 150px"
              >
                <div class="single_input no_modal_btn">
                  <select
                    placeholder="Base Account"
                    class="input_style"
                    (ngModelChange)="beforeMappingChange(item)"
                    (change)="mappingChange()"
                    [(ngModel)]="item.selectedIndex"
                  >
                    <option value="" selected disabled>-- Match --</option>
                    <option
                      *ngFor="let option of headerOptions"
                      [value]="option.key"
                      [disabled]="disableMapping[option.key]"
                    >
                      {{ option.value }}
                    </option>
                  </select>
                </div>
              </td>
            </tr>
            <tr *ngIf="data?.fileHeader?.length">
              <td>1</td>
              <td *ngFor="let item of data?.fileHeader">{{ item }}</td>
            </tr>
            <ng-container *ngFor="let row of excelArrayData; let i = index">
              <tr>
                <td>{{ data?.file_headers?.length ? i + 2 : i + 1 }}</td>
                <ng-container *ngFor="let val of row?.rowValue">
                  <td
                    [ngStyle]="
                      val.invalid
                        ? { 'background-color': 'var(--icon-bg-red)' }
                        : ''
                    "
                  >
                    {{ val.value }}
                  </td>
                </ng-container>
              </tr>
            </ng-container>
          </tbody>
        </table>
        <!-- TABLE END -->
      </div>
      <!-- TABLE WRAPPER END -->

      <!-- BOTTOM ROW START -->

      <!-- BOTTOM ROW END -->
    </div>
    <!-- MAIN BODY END -->
  </div>
</section>
<div class="flex justify-end flex-wrap gap-2 mt-4">
  <button
    (click)="submit()"
    class="ocw-btn ocw-btn-modal-blue sm_w_full self-baseline"
  >
    Import
  </button>
</div>
