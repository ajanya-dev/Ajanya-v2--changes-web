<div class="ocw_man_modal_wrapper">
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">Add Contact</div>
    <div class="close_btn" [mat-dialog-close]="false">
      <svg
        aria-hidden="true"
        focusable="false"
        data-prefix="fal"
        data-icon="times"
        class="svg-inline--fa fa-times fa-w-10"
        role="img"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 320 512"
      >
        <path
          fill="currentColor"
          d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
        ></path>
      </svg>
    </div>
  </div>
  <div class="group-form-grid grid grid-cols-2 gap-5" [formGroup]="contactForm">
    <div class="single_input">
      <input
        type="text"
        class="input_style"
        formControlName="name"
        placeholder=""
        maxlength="50"
      />
      <label class="floating_label_field"
        >Name<span class="required">*</span></label
      >
      <app-control-message
        [control]="contactForm.controls.name"
      ></app-control-message>
    </div>

    <div class="single_input">
      <input
        type="tel"
        class="input_style"
        formControlName="phone"
        id="phone"
        mask="(000) 000-0000"
        placeholder="(xxx) xxx-xxxx"
        maxlength="50"
      />

      <label class="floating_label_field"
        >Phone<span class="required">*</span></label
      >
      <app-control-message
        [control]="contactForm.controls.phone"
      ></app-control-message>
    </div>
    <div class="single_input">
      <input
        type="text"
        class="input_style"
        formControlName="email"
        placeholder=""
        maxlength="320"
      />
      <label class="floating_label_field">E-mail</label>
      <app-control-message
        [control]="contactForm.controls.email"
      ></app-control-message>
    </div>
    <div class="single_input">
      <input
        type="text"
        class="input_style"
        formControlName="company"
        placeholder=""
        maxlength="50"
      />
      <label class="floating_label_field">Company</label>
      <app-control-message
        [control]="contactForm.controls.company"
      ></app-control-message>
    </div>
    <div class="single_input">
      <input
        type="text"
        class="input_style"
        formControlName="address1"
        placeholder=""
        maxlength="320"
        #AddressSearch
        (focus)="loadGoogleAddress(AddressSearch)"
      />
      <label class="floating_label_field">Address 1</label>
      <app-control-message
        [control]="contactForm.controls.address1"
      ></app-control-message>
    </div>
    <div class="single_input">
      <input
        type="text"
        class="input_style"
        formControlName="address2"
        placeholder=""
        maxlength="50"
      />
      <label class="floating_label_field">Address 2</label>
      <app-control-message
        [control]="contactForm.controls.address2"
      ></app-control-message>
    </div>
    <div class="single_input">
      <input
        type="text"
        class="input_style"
        formControlName="city"
        placeholder=""
        maxlength="320"
      />
      <label class="floating_label_field">City</label>
      <app-control-message
        [control]="contactForm.controls.city"
      ></app-control-message>
    </div>
    <div class="single_input">
      <input
        type="text"
        class="input_style"
        formControlName="state"
        placeholder=""
        maxlength="50"
      />
      <label class="floating_label_field">State</label>
      <app-control-message
        [control]="contactForm.controls.state"
      ></app-control-message>
    </div>
    <div class="single_input">
      <input
        type="text"
        class="input_style"
        formControlName="zip"
        placeholder=""
        maxlength="320"
      />
      <label class="floating_label_field">Zip</label>
      <app-control-message
        [control]="contactForm.controls.zip"
      ></app-control-message>
    </div>
    <div class="single_input">
      <input
        type="text"
        class="input_style"
        formControlName="other"
        placeholder=""
        maxlength="50"
      />
      <label class="floating_label_field">Others</label>
      <app-control-message
        [control]="contactForm.controls.other"
      ></app-control-message>
    </div>
    <div></div>
    <div class="flex justify-end">
      <button
        type="submit"
        class="ocw-btn-modal-blue ocw-btn send-btn"
        (click)="save()"
        *ngIf="this.mode === 'create'"
      >
        Save
      </button>
      <button
        type="submit"
        class="ocw-btn-modal-blue ocw-btn send-btn"
        (click)="update()"
        *ngIf="this.mode === 'edit'"
      >
        Update
      </button>
    </div>
  </div>
</div>
