<ng-container
  *ngIf="colDef?.field === 'groupName' && getCurrentColumn?.groupName"
>
  {{ getCurrentColumn.groupName
  }}<span class="view-details ml-2 cursor-pointer" (click)="openGroupDetails()"
    >View details</span
  >
</ng-container>

<ng-container *ngIf="colDef?.field === 'delivered'">
  {{ getCurrentColumn.delivered ? "Delivered" : "Not Delivered" }}
</ng-container>
<ng-container *ngIf="colDef?.field === 'status'">
  {{ getCurrentColumn.status ? "Delivered" : "Not Delivered" }}
</ng-container>
