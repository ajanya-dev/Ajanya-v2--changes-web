<div class="main-container">
  <div class="search_head ocw_modal_header flex justify-between">
    <div class="ocw_modal_title">Default SMS Reply Service Details</div>

    <div class="close_btn" role="presentation" (click)="close()">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      ></fa-icon>
    </div>
  </div>
  <div class="flex">
    <div class="details-container flex flex-col mr-4">
      <div class="details-header mt-3">Details</div>
      <div class="details-content px-4 py-4 grow flex flex-col">
        <div class="details-pair py-3 flex">
          <div class="detail-item pr-2">
            <div class="detail-name">Service Id</div>
            <div class="detail-value">{{ defaultSMSDetails?.serviceId }}</div>
          </div>
          <div class="detail-item pl-2">
            <div class="detail-name">From Phone Number</div>
            <div class="detail-value">{{ defaultSMSDetails?.fromNumber }}</div>
          </div>
        </div>
        <div class="details-pair py-3 flex">
          <div class="detail-item pr-2">
            <div class="detail-name">Group Name</div>
            <div class="detail-value">{{ defaultSMSDetails?.groupName }}</div>
          </div>
          <div class="detail-item pl-2">
            <div class="detail-name">Date</div>
            <div class="detail-value">{{ defaultSMSDetails?.createdAt }}</div>
          </div>
        </div>
        <div class="detail-item-messaage grow py-3">
          <div class="single_input message-text-area-wrapper">
            <textarea
              class="input_style"
              [formControl]="message"
              placeholder=""
              maxlength="160"
            ></textarea>
            <label class="floating_label_field"
              >Message<span class="required">*</span></label
            >
            <app-control-message [control]="message"></app-control-message>
          </div>
        </div>
        <div class="flex justify-end">
          <button
            type="submit"
            class="ocw-btn-modal-blue ocw-btn send-btn px-4"
            (click)="updateMessage()"
            [disabled]="isLoading"
          >
            Update
          </button>
        </div>
      </div>
    </div>

    <div class="grow ml-2">
      <div class="flex justify-between align-end mt-3">
        <div class="sub-header">Log</div>
        <div class="flex"></div>
      </div>
      <div class="dt-container">
        <div class="mt-3 h-[661px]">
          <app-v3-data-table
            [columnDefs]="columnDefs"
            [tableId]="tableId"
            [frameworkComponents]="frameworkComponents"
            [additionalPayload]="{ campaignId: defaultSMSDetails.id }"
          >
          </app-v3-data-table>
        </div>
      </div>
    </div>
  </div>
</div>
