<div class="ocw_man_modal_wrapper add_bank_modal">
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">
      {{ mode === "create" ? "Create Group" : "Group Details" }}
    </div>
    <div class="close_btn" [mat-dialog-close]="refreshGroupTable">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      ></fa-icon>
    </div>
  </div>
  <div class="">
    <div class="group-form-grid grid grid-cols-2 gap-5" [formGroup]="groupForm">
      <div class="single_input">
        <input
          type="text"
          class="input_style"
          formControlName="name"
          placeholder=""
          maxlength="50"
        />
        <label for="name" class="floating_label_field"
          >Group Name<span class="required">*</span></label
        >
        <app-control-message
          [control]="groupForm.controls.name"
        ></app-control-message>
      </div>
      <div class="single_input">
        <input
          type="text"
          class="input_style"
          formControlName="nickName"
          placeholder=""
          maxlength="50"
        />
        <label for="nickName" class="floating_label_field">Nick Name</label>
        <app-control-message
          [control]="groupForm.controls.nickName"
        ></app-control-message>
      </div>
      <div class="info"></div>
      <div class="flex justify-end">
        <button
          *ngIf="mode === 'details' || (mode === 'create' && isGroupCreated)"
          type="submit"
          class="ocw-btn-dark-green ocw-btn create-btn"
          [disabled]="isLoading"
          (click)="updateGroup()"
        >
          Update
        </button>
        <button
          *ngIf="mode === 'create' && !isGroupCreated"
          type="submit"
          class="ocw-btn-dark-green ocw-btn create-btn"
          [disabled]="isLoading"
          (click)="createGroup()"
        >
          Create Group
        </button>
      </div>
    </div>
    <div class="flex contact-buttons">
      <input
        type="file"
        #fileIn
        class="absolute hidden opacity-0"
        name=""
        [(ngModel)]="importFileInput"
        [ngClass]="
          isLoading || (mode === 'create' && !isGroupCreated)
            ? 'click-disable'
            : ''
        "
        (change)="contactImport($event.target.files)"
        accept=".xlsx, .xlx, .csv"
      />
    </div>
    <div class="pt-6">
      <div class="mt-3 h-[600px]">
        <app-v3-data-table
          dynamicHeaderText="Contacts"
          [headerElements]="headerElements()"
          [columnDefs]="columnDefs"
          [tableId]="tableId"
          [frameworkComponents]="frameworkComponents"
          (headerButtonEvent)="onHeaderBtn($event)"
          [additionalPayload]="{ groupId: groupId }"
          (cellRendererDangerEvent)="onCellDeleteActionbtn($event)"
        >
        </app-v3-data-table>
      </div>
    </div>
  </div>
</div>
