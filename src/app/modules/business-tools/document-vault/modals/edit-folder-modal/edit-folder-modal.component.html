<div class="px-[6px] pb-[6px]">
  <div class="flex justify-between pb-6">
    <div>
      <span class="mt-18 w-full text-base text-main-text-color align-middle flex items-center\">
        <fa-icon class="!text-sm pt-1" [icon]="faPen"></fa-icon>
        <span class="pl-1 font-inter font-semibold text-base pb-0.5"> {{ isFile ? 'Edit Item' : 'Rename Item' }} </span>
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon class="text-secondary-text-color cursor-pointer" [icon]="faXmark"></fa-icon>
    </div>
  </div>

  <div>
    <form [formGroup]="renameForm" class="space-y-4">
      <!-- New Name Input -->
      <div class="w-full">
        <app-common-input-field
          [placeholder]="'New Name'"
          formControlName="name"
          [isFieldRequired]="true"
          class="w-full"
        ></app-common-input-field>
        <app-control-message-v35 
          [control]="renameForm.controls.name"
          [customMessages]="{'pattern': 'Folder name must contain only alphanumeric characters'}"
        ></app-control-message-v35>
      </div>
      @if (isFile) {
        <div class="w-full">
          <app-common-input-field
            [placeholder]="'Serial Number'"
            formControlName="serial_number"
            [isFieldRequired]="false"
            class="w-full"
          ></app-common-input-field>
        </div>
      }
    </form>
  </div>

  <div class="flex justify-end gap-3 pt-8">
    <app-common-button-v35
      [type]="{style:'bordered', name: 'main' }"
      [text]="'Cancel'"
      [disabled]="loading"
      [mat-dialog-close]="false"
      width="125px"
    ></app-common-button-v35>
    
    <app-common-button-v35
      [type]="{style:'modal', name: 'main' }"
      [text]="loading ? (isFile ? 'Updating...' : 'Renaming...') : (isFile ? 'Update' : 'Rename')"
      [disabled]="loading"
      [loading]="loading"
      (click)="onRename()"
      width="125px"
    ></app-common-button-v35>
  </div>
</div>
