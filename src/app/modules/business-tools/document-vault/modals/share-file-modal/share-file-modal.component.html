<div class="px-[6px] pb-[6px]">
  <div class="flex justify-between pb-6">
    <div>
      <span class="mt-18 w-full text-base text-main-text-color align-middle flex items-center\">
        <fa-icon class="!text-sm pt-1" [icon]="faShareNodes"></fa-icon>
        <span class="pl-1 font-inter font-semibold text-base pb-0.5"> Share File </span>
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon class="text-secondary-text-color cursor-pointer" [icon]="faXmark"></fa-icon>
    </div>
  </div>

  <div>
    <form [formGroup]="shareForm" class="space-y-4">
      <!-- Email Address Input -->
      <div class="w-full">
        <app-common-input-field
          [placeholder]="'Email address'"
          formControlName="email"
          [isFieldRequired]="true"
          class="w-full"
        ></app-common-input-field>
        <app-control-message-v35 
          [control]="shareForm.controls.email"
        ></app-control-message-v35>
      </div>

      <!-- Expires After and Maximum Downloads Row -->
      <div class="flex gap-4">
        <!-- Expires After (Days) -->
        <div class="flex-1">
          <app-common-input-field
            [placeholder]="'Expires After (Days)'"
            formControlName="expires_days"
            [isFieldRequired]="true"
            [type]="'number'"
            class="w-full"
          ></app-common-input-field>
          <app-control-message-v35 
            [control]="shareForm.controls.expires_days"
          ></app-control-message-v35>
        </div>

        <!-- Maximum Downloads -->
        <div class="flex-1">
          <app-common-input-field
            [placeholder]="'Maximum Downloads'"
            formControlName="max_downloads"
            [isFieldRequired]="true"
            [type]="'number'"
            class="w-full"
          ></app-common-input-field>
          <app-control-message-v35 
            [control]="shareForm.controls.max_downloads"
          ></app-control-message-v35>
        </div>
      </div>
    </form>
  </div>

  <div class="flex justify-end gap-3 pt-8">
    <app-common-button-v35
      [mat-dialog-close]="false"
      [type]="{style:'bordered', name: 'main' }"
      [text]="'Cancel'"
      [disabled]="loading"
      width="125px"
    ></app-common-button-v35>
    
    <app-common-button-v35
      [type]="{style:'modal', name: 'main' }"
      [text]="loading ? 'Sharing...' : 'Share'"
      [disabled]="loading"
      [loading]="loading"
      (click)="onShare()"
      width="125px"
    ></app-common-button-v35>
  </div>
</div>
