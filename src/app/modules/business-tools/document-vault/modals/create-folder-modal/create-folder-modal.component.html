<div class="px-[6px] pb-[6px]">
  <div class="flex justify-between pb-6">
    <div>
      <span class="mt-18 w-full text-base text-main-text-color align-middle flex items-center\">
        <fa-icon class="!text-[20px]" [icon]="faFolderPlus"></fa-icon>
        <span class="pl-1 font-inter font-semibold text-base pb-0.5"> Create New Folder </span>
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon class="text-secondary-text-color cursor-pointer" [icon]="faXmark"></fa-icon>
    </div>
  </div>

  <div>
    <form [formGroup]="folderForm" class="space-y-4">
      <!-- Folder Name Input -->
      <div class="w-full">
        <app-common-input-field
          [placeholder]="'Folder Name'"
          formControlName="name"
          [isFieldRequired]="true"
          class="w-full"
        ></app-common-input-field>
        <app-control-message-v35 
          [control]="folderForm.controls.name"
          [customMessages]="{'pattern': 'Folder name must contain only alphanumeric characters'}"
        ></app-control-message-v35>
      </div>
    </form>
  </div>

  <div class="flex justify-end gap-3 pt-8">
    <app-common-button-v35
      [type]="{style:'bordered', name: 'main' }"
      [text]="'Cancel'"
      [disabled]="loading"
      [mat-dialog-close]="false"
      width="125px"
    ></app-common-button-v35>
    
    <app-common-button-v35
      [type]="{style:'modal', name: 'main' }"
      [text]="loading ? 'Creating...' : 'Create Folder'"
      [disabled]="loading"
      [loading]="loading"
      (click)="onCreateFolder()"
      width="125px"
    ></app-common-button-v35>
  </div>
</div>
