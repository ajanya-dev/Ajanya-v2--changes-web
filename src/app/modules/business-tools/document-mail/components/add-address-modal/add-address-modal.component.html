<div class="ocw_man_modal_wrapper">
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">Add Address</div>
    <div class="close_btn" [mat-dialog-close]="false">
      <img
        src="assets/icon/close-icon.svg"
        type="image/svg+xml"
        alt="Close Icon"
      />
    </div>
  </div>
  <div class="ocw_modal_body">
    <div [formGroup]="addressForm" class="grid grid-cols-2 gap-x-3 gap-y-4">
      <div class="single_input">
        <input
          formControlName="payee_name"
          type="text"
          class="input_style"
          placeholder=" "
        />
        <span class="floating_label_field"
          >Name <span class="required">*</span></span
        >
        <app-control-message [control]="addressForm.controls.payee_name" />
      </div>
      <div class="single_input">
        <input
          formControlName="payee_company_name"
          type="text"
          class="input_style"
          placeholder=" "
        />
        <span class="floating_label_field">Company Name </span>
        <app-control-message
          [control]="addressForm.controls.payee_company_name"
        />
      </div>
      <div class="single_input">
        <input
          #address1
          (focus)="loadGoogleAddress(address1)"
          formControlName="payee_address_line_1"
          type="text"
          class="input_style"
          placeholder=" "
        />
        <span class="floating_label_field"
          >Address Line 1 <span class="required">*</span></span
        >
        <app-control-message
          [control]="addressForm.controls.payee_address_line_1"
        />
      </div>
      <div class="single_input">
        <input
          formControlName="payee_address_line_2"
          type="text"
          class="input_style"
          placeholder=" "
        />
        <span class="floating_label_field">Address Line 2 </span>
        <app-control-message
          [control]="addressForm.controls.payee_address_line_2"
        />
      </div>
      <div class="single_input">
        <input
          formControlName="payee_city"
          type="text"
          class="input_style"
          placeholder=" "
        />
        <span class="floating_label_field"
          >City <span class="required">*</span></span
        >
        <app-control-message [control]="addressForm.controls.payee_city" />
      </div>
      <div class="single_input">
        <input
          formControlName="payee_state"
          type="text"
          class="input_style"
          placeholder=" "
        />
        <span class="floating_label_field"
          >State <span class="required">*</span></span
        >
        <app-control-message [control]="addressForm.controls.payee_state" />
      </div>
      <div class="single_input">
        <select class="input_style" formControlName="payee_country">
          <option value="" hidden disabled selected class="font-extrabold">
            Country <span class="required" style="color: red" required>*</span>
          </option>
          <option value="United States">United States</option>
          <option value="Canada">Canada</option>
        </select>
        <app-control-message [control]="addressForm.controls.payee_country" />
      </div>
      <div class="single_input">
        <input
          (keypress)="utils.numberOnly($event)"
          formControlName="payee_zip"
          type="text"
          class="input_style"
          placeholder=" "
        />
        <span class="floating_label_field"
          >Zip <span class="required">*</span></span
        >
        <app-control-message [control]="addressForm.controls.payee_zip" />
      </div>
      <div class="single_input">
        <input
          formControlName="payee_email"
          type="text"
          class="input_style"
          placeholder=" "
        />
        <span class="floating_label_field">Email </span>
        <app-control-message [control]="addressForm.controls.payee_email" />
      </div>
      <div class="single_input">
        <input
          (keypress)="utils.numberOnly($event)"
          formControlName="payee_phone"
          type="text"
          class="input_style"
          placeholder=" "
        />
        <span class="floating_label_field">Phone </span>
        <app-control-message [control]="addressForm.controls.payee_phone" />
      </div>
    </div>
  </div>
  <div class="ocw_modal_footer">
    <button
      class="ocw-btn ocw-btn-modal-blue add_btn w-full flex justify-center"
      (click)="submit()"
    >
      <span>Submit</span>
      @if (loading) {
        <span class="loadingSpinner"></span>
      }
    </button>
  </div>
</div>
