<div class="ocw_man_modal_wrapper flex justify-between flex-col">
  <div class="ocw_modal_header flex justify-between items-center relative">
    <div class="ocw_modal_title mail-modal-heading">
      <p>Statements</p>
    </div>
    <div class="close_btn" [mat-dialog-close]="false">
      <i class="fa-solid fa-xmark"></i>
    </div>
  </div>

  <div class="ocw_modal_body">
    <div class="ocw_table_wrapper">
      @if (dailogData.statements.length) {
        <table class="ocw-table table-name ocw-table ocw-table-striped">
          <thead>
            <tr>
              <td>Status</td>
              <td>Created At</td>
            </tr>
          </thead>
          <tbody>
            @for (item of dailogData.statements; track item) {
              <tr>
                <td>{{ item.status_name | titlecase }}</td>
                <td>{{ item.created_at | date }}</td>
              </tr>
            }
          </tbody>
        </table>
      } @else {
        <div class="w-full h-40 flex items-center justify-center">
          <span>No Statements</span>
        </div>
      }
    </div>
  </div>
  <div class="ocw_modal_footer flex gap-4">
    <button
      type="submit"
      class="ocw-btn ocw-btn-modal-blue add_btn"
      [mat-dialog-close]="false"
    >
      <span class="text">Close</span>
    </button>
  </div>
</div>
