<div class="ocw_man_modal_wrapper category_modal">
  <form>
    <div class="ocw_modal_header">
      <div class="ocw_modal_title">Add Attachments</div>

      <div class="close_btn" [mat-dialog-close]="false">
        <fa-icon [icon]="faXmark" />
      </div>
    </div>

    <div class="ocw_modal_body">
      <app-drop-zone
        previewHeight="100px"
        [accept]="'*'"
        previewWidth="100px"
        (changeEvent)="onSelect($event)"
        [removeSubject]="removeSubject"
        [clearable]="false"
      />
      <div class="h-3"></div>
      @if (loading) {
        <div class="flex gap-2 justify-end items-center">
          <span class="loadingSpinner attachloader"></span>
          <span> Saving... </span>
        </div>
      }
    </div>

    <div class="comment_table">
      <table>
        <thead>
          <tr>
            <td>#</td>
            <td>FileName</td>
          </tr>
        </thead>
        @if (uploadedFiles.length) {
          <tbody>
            @for (item of uploadedFiles; track item; let i = $index) {
              <tr>
                <td>{{ i + 1 }}</td>
                <td>{{ item.document_title }}</td>
                <td class="icon">
                  <span title="Delete">
                    <fa-icon
                      class="cursor-pointer"
                      (click)="deleteAttachment(item.id)"
                      [icon]="faTrash"
                    ></fa-icon>
                  </span>
                </td>
              </tr>
            }
          </tbody>
        }
      </table>
      @if (!uploadedFiles.length) {
        <div
          class="font-semibold text-secondary-text-color font-inter text-sm w-full flex items-center justify-center h-20"
        >
          <span> No File Uploaded </span>
        </div>
      }
    </div>

    <div class="ocw_modal_footer">
      <mat-dialog-actions align="end">
        <button type="button" class="ocw-btn-modal-bordered" (click)="onMail()">
          Mail
        </button>
        <button
          [disabled]="loading"
          type="submit"
          class="ocw-btn ocw-btn-modal-blue add_btn flex gap-2"
          [mat-dialog-close]="false"
        >
          <span>Done</span>
        </button>
      </mat-dialog-actions>
    </div>
  </form>
</div>
