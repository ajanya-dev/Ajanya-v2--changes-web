<div class="flex flex-col font-funnel rounded-2xl overflow-hidden">

  <!-- Header -->
  <div class="flex justify-between items-center px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color">
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color">Statements</h1>
      <h2 class="text-xs text-v4-subtle-text-color">Status history for this mail</h2>
    </div>
    <div [mat-dialog-close]="false" class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center">
      <lucide-icon name="x" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- Body -->
  <div class="p-6 bg-v4-tertiary-background-color">
    @if (dialogData.statements.length) {
      <div class="overflow-x-auto border border-v4-border-color rounded-xl">
        <div class="max-h-[490px] overflow-y-auto">
          <table class="v4-ocw-table">
            <thead>
              <tr>
                <th>STATUS</th>
                <th>CREATED AT</th>
              </tr>
            </thead>
            <tbody>
              @for (item of dialogData.statements; track item) {
                <tr>
                  <td>
                    <span [class]="getStatusClass(item.status_name)">
                      {{ item.status_name | titlecase }}
                    </span>
                  </td>
                  <td class="text-sm text-v4-main-text-color">
                    {{ item.created_at | date: 'MMM d, y, h:mm a' }}
                  </td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      </div>
    } @else {
      <div class="w-full h-40 flex items-center justify-center">
        <span class="text-sm text-v4-subtle-text-color">No statements available</span>
      </div>
    }
  </div>

</div>
