<!-- Modal Header -->
<div class="flex justify-between items-center px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color">
  <div class="flex items-center gap-3">
    <button
      (click)="onStepBack()"
      class="w-8 h-8 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center border-none bg-transparent"
    >
      <lucide-icon name="arrow-left" [size]="18" class="text-v4-subtle-text-color" />
    </button>
    <div class="flex flex-col">
      <div class="flex items-center gap-2">
        <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel m-0">
          {{ stepTitle() }}
        </h1>
        <span class="step-badge">
          <span class="text-v4-primary-brand-bold-color font-bold">Step {{ currentStep() }}</span>
          <span class="mx-1">of</span>
          <span class="font-bold">3</span>
        </span>
      </div>
      <p class="text-xs text-v4-tertiary-text-color m-0 mt-0.5">{{ stepSubtitle() }}</p>
    </div>
  </div>
  <button
    (click)="close()"
    class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center border-none bg-transparent"
  >
    <lucide-icon name="x" [size]="18" class="text-v4-subtle-text-color" />
  </button>
</div>

<!-- Step 1: Attach Document -->
<div [style.display]="currentStep() === 1 ? 'block' : 'none'">
  <app-step1-attach-doc (fileSelected)="onFileSelected($event)" />
</div>

<!-- Step 2: Page Select -->
@if (currentStep() === 2 && tempFile()) {
  <app-step2-page-select
    [file]="tempFile()!"
    (stepBack)="onStepBack()"
    (continueEvent)="onPageSelectContinue($event)"
  />
}

<!-- Step 3: Mail Details -->
@if (currentStep() === 3) {
  <app-step3-mail-details
    [pdfDocuments]="pdfDocuments()"
    [selectedPagesByPdf]="selectedPagesByPdf()"
    (stepBack)="onStepBack()"
    (submitSuccess)="onSubmitSuccess()"
  />
}
