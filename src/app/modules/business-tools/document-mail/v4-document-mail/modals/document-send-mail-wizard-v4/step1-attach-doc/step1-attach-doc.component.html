<!-- modal body -->
<div class="py-6 px-6 bg-v4-tertiary-background-color">
  <div
    class="border-2 border-dashed rounded-lg p-12 flex flex-col items-center justify-center transition-colors"
    [class]="isDragging()
      ? 'border-v4-common-blue-color bg-v4-secondary-background-color'
      : 'border-v4-border-color hover:border-v4-subtle-text-color'"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <lucide-icon name="upload" [size]="48" class="text-v4-subtle-text-color mx-auto mb-4" />
    <p class="text-lg text-v4-main-text-color mb-2 m-0">Upload or drag a file here</p>
    <p class="text-sm text-v4-subtle-text-color m-0">Supports PDF files up to 50MB</p>
    <input
      #fileInput
      type="file"
      accept=".pdf,application/pdf"
      class="hidden"
      (change)="onFileSelect($event)"
    />
    <div class="mt-4">
      <app-common-button-v4
        [type]="{ style: 'outline', name: 'main' }"
        text="No file chosen"
        (clickEvent)="triggerFileInput(fileInput)"
      />
    </div>
  </div>
</div>

<!-- modal footer -->
<div class="p-6 bg-v4-secondary-background-color border-t border-v4-border-color">
  <div class="flex items-center justify-center gap-2 text-xs text-v4-tertiary-text-color">
    <lucide-icon name="info" [size]="14" class="text-v4-primary-brand-bold-color shrink-0" />
    <span>Your document will be securely processed. You'll be able to select specific pages to attach in the next step.</span>
  </div>
</div>
