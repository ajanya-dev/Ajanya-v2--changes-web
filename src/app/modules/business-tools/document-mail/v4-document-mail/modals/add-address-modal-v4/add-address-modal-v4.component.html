<div class="max-h-[90vh] overflow-y-auto">
  <!-- Modal Header -->
  <div class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color">
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel m-0">Add From Address</h1>
      <h2 class="text-xs text-v4-subtle-text-color m-0">Enter the mailing address details</h2>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon name="x" [size]="18" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- Modal Body -->
  <div class="px-6 py-5 bg-v4-tertiary-background-color">
    <form [formGroup]="addressForm" class="flex flex-col gap-3">
      <!-- Row 1: Name + Company Name -->
      <div class="grid grid-cols-2 gap-3">
        <app-common-input-v4
          placeholder="Name"
          formControlName="payee_name"
          [control]="addressForm.controls.payee_name"
        />
        <app-common-input-v4
          placeholder="Company Name"
          formControlName="payee_company_name"
          [isFieldRequired]="false"
        />
      </div>

      <!-- Row 2: Phone + Email -->
      <div class="grid grid-cols-2 gap-3">
        <app-common-input-v4
          placeholder="Phone"
          formControlName="payee_phone"
          [isFieldRequired]="false"
          [control]="addressForm.controls.payee_phone"
        />
        <app-common-input-v4
          placeholder="Email"
          formControlName="payee_email"
          [type]="'email'"
          [isFieldRequired]="false"
          [control]="addressForm.controls.payee_email"
        />
      </div>

      <!-- Row 3: Address Line 1 + Address Line 2 -->
      <div class="grid grid-cols-2 gap-3">
        <app-address-autocomplete-v4
          [label]="'Address Line 1'"
          [placeholder]="'Start typing address...'"
          [control]="addressForm.controls.payee_address_line_1"
          [allowedCountries]="['us', 'ca']"
          [isFieldRequired]="true"
          (addressSelected)="onAddressSelected($event)"
        />
        <app-common-input-v4
          placeholder="Apt, Suite, Unit, etc."
          [fieldLabel]="'Address Line 2'"
          formControlName="payee_address_line_2"
          [isFieldRequired]="false"
        />
      </div>

      <!-- Row 4: City + State + Zip + Country -->
      <div class="grid grid-cols-4 gap-3">
        <app-common-input-v4
          placeholder="City"
          [fieldLabel]="'City'"
          formControlName="payee_city"
          [control]="addressForm.controls.payee_city"
        />
        <app-common-input-v4
          placeholder="e.g. CA"
          [fieldLabel]="'State'"
          formControlName="payee_state"
          [control]="addressForm.controls.payee_state"
        />
        <app-common-input-v4
          placeholder="Zip"
          [fieldLabel]="'Zip'"
          formControlName="payee_zip"
          [control]="addressForm.controls.payee_zip"
        />
        <div class="flex flex-col">
          <label class="block text-sm font-medium text-v4-subtle-text-color mb-1.5 tracking-wide">
            Country <span class="text-v4-common-red-color">*</span>
          </label>
          <app-v4-common-dropdown
            [config]="countryDropdownConfig"
            [listData]="sortedCountries"
            formControlName="payee_country"
            [clearable]="false"
            [appendTo]="'body'"
          />
        </div>
      </div>
    </form>
  </div>

  <!-- Modal Footer -->
  <div class="flex justify-end gap-3 px-6 py-4 bg-v4-secondary-background-color border-t border-v4-border-color">
    <app-common-button-v4
      [mat-dialog-close]="false"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
      width="100px"
    />
    <app-common-button-v4
      [type]="{ style: 'primary', name: 'main' }"
      text="Add"
      width="100px"
      [loading]="loading()"
      [disabled]="loading()"
      (clickEvent)="submit()"
    />
  </div>
</div>
