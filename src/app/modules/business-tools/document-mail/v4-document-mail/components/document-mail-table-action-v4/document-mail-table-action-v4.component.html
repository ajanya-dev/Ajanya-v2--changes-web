<div class="flex items-center gap-1 h-full">
  <button aria-label="Actions"
    class="action-icon-btn"
    [matMenuTriggerFor]="menu"
    (click)="$event.stopPropagation()"
    matTooltip="Actions"
  >
    <lucide-icon
      name="ellipsis-vertical"
      [size]="16"
      class="v4-action-icon"
    ></lucide-icon>
  </button>
  <a
    class="action-icon-btn"
    [href]="params.data?.document"
    target="_blank"
    matTooltip="View Document"
    (click)="$event.stopPropagation()"
  >
    <lucide-icon name="eye" [size]="16" class="v4-action-icon"></lucide-icon>
  </a>

  <mat-menu #menu="matMenu" class="v4-action-menu">
    <div class="v4-menu-group-label">DOCUMENTS</div>
    <button mat-menu-item (click)="getStatement()">
      <div class="v4-menu-item">
        <lucide-icon name="file-text" [size]="16"></lucide-icon>
        <span>Statement</span>
      </div>
    </button>

    <div class="v4-menu-group-label">PROOF</div>
    <button
      mat-menu-item
      (click)="getTrackDetails()"
      [disabled]="params.data?.status !== 3 && params.data?.status !== 4"
    >
      <div class="v4-menu-item">
        <lucide-icon name="truck" [size]="16"></lucide-icon>
        <span>Tracking Details</span>
      </div>
    </button>
  </mat-menu>
</div>
