<div class="flex items-center gap-1 h-full">
  <button aria-label="Actions"
    class="action-icon-btn"
    [matMenuTriggerFor]="menu"
    (click)="$event.stopPropagation()"
    matTooltip="Actions"
  >
    <lucide-icon
      name="ellipsis-vertical"
      [size]="16"
      class="v4-action-icon"
    ></lucide-icon>
  </button>
  <button aria-label="View"
    class="action-icon-btn"
    (click)="onView(); $event.stopPropagation()"
    matTooltip="View"
  >
    <lucide-icon name="eye" [size]="16" class="v4-action-icon"></lucide-icon>
  </button>

  <mat-menu #menu="matMenu" class="v4-action-menu">
    <div class="v4-menu-group-label">ACTIONS</div>
    <button
      mat-menu-item
      [disabled]="params.data?.status !== 0"
      (click)="onEdit()"
    >
      <div class="v4-menu-item">
        <lucide-icon name="square-pen" [size]="16"></lucide-icon>
        <span>Edit</span>
      </div>
    </button>
    <button mat-menu-item (click)="onMail()">
      <div class="v4-menu-item">
        <lucide-icon name="send" [size]="16"></lucide-icon>
        <span>Mail</span>
      </div>
    </button>
    <button
      mat-menu-item
      class="v4-menu-item-danger"
      [disabled]="params.data?.status !== 0"
      (click)="onDelete()"
    >
      <div class="v4-menu-item">
        <lucide-icon name="trash-2" [size]="16"></lucide-icon>
        <span>Delete</span>
      </div>
    </button>

    <div class="v4-menu-group-label">DOCUMENTS</div>
    <button mat-menu-item (click)="onDownload()">
      <div class="v4-menu-item">
        <lucide-icon name="download" [size]="16"></lucide-icon>
        <span>Download</span>
      </div>
    </button>
    <button mat-menu-item (click)="onAddComment()">
      <div class="v4-menu-item">
        <lucide-icon name="message-square" [size]="16"></lucide-icon>
        <span>Add Comment</span>
      </div>
    </button>
  </mat-menu>
</div>
