<div class="bg-secondary-background-color px-2.5 h-full overflow-hidden">
  <div class="bg-main-background-color rounded p-5 h-full">
    <div class="flex justify-between items-center">
      <div class="flex gap-4">
        <h1 class="font-inter font-semibold text-main-text-color">
          Mail Documents
        </h1>
        <div
          class="flex gap-2 text-secondary-text-color font-roboto font-semibold text-xs items-center"
        >
          <span
            (click)="changeTab('files')"
            class="px-1 cursor-pointer"
            [ngClass]="{
              'selected-tab': selectedTable === 'files'
            }"
            >Files</span
          >
          <span
            (click)="changeTab('mail')"
            class="px-1 cursor-pointer"
            [ngClass]="{
              'selected-tab': selectedTable === 'mail'
            }"
            >Mailed</span
          >
          <div matTooltip="Delete Documents.">
            <button
              class="h-6 w-6 rounded-full bg-common-secondary-red-color text-common-red-color p-1"
              (click)="bulkDelete()"
              [disabled]="!selectedRowData?.length"
              [ngClass]="{ 'pointer-events-none opacity-40': !selectedRowData?.length }"
            >
              <fa-icon class="text-common-red-color text-md" [icon]="faTrash"></fa-icon>
            </button>
          </div>
        </div>
      </div>
      <div class="flex gap-2">
      <app-demo-video 
        class="ml-auto demo-video"
        [slug]="helpVideoSlug"
      ></app-demo-video>
      </div>
    </div>
    <div class="h-4"></div>
    <div class="relative h-full">
      <div class="buttons flex gap-2 absolute">
        <app-common-button-v35
          (clickEvent)="onSendMail()"
          text="New"
          [disabled]="selectedRowData.length > 0"
          [ngClass]="{ 'pointer-events-none opacity-40': selectedRowData.length > 0 }"
          [type]="{ style: 'general', name: 'action' }"
          backGroundInput="var(--common-blue-color)"
          textColorInput="white"
        />

        <app-common-button-v35
          (clickEvent)="onUpload()"
          text="Upload Files"
          isAddIcon="true"
          [disabled]="selectedRowData.length > 0"
          [ngClass]="{ 'pointer-events-none opacity-40': selectedRowData.length > 0 }"
          [type]="{ style: 'general', name: 'action' }"
          backGroundInput="var(--common-blue-color)"
          textColorInput="white"
        />

        @if (selectedTable === "files") {
          <app-common-button-v35
            textColorInput="white"
            (clickEvent)="onMail('normal')"
            text="Mail"
            width="80px"
            backGroundInput="var(--common-green-color)"
            [type]="{ style: 'general', name: 'action' }"
          />
          <app-common-button-v35
            [disabled]="selectedRowData.length"
            (clickEvent)="onMail('bulk')"
            text="Bulk Mail"
            [type]="{ style: 'blue', name: 'action' }"
          />
        }
      </div>

      @if (selectedTable === "mail") {
        <app-documents-mail-data-table class="h-full" />
      }

      @if (selectedTable === "files") {
        <app-document-mail-files-table class="h-full" />
      }
    </div>
  </div>
</div>
