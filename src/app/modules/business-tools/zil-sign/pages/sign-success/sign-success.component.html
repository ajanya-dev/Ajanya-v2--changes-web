<div class="flex flex-col items-center justify-center min-h-screen bg-main-background-color p-6">
  <div class="max-w-md w-full text-center">
    <!-- Success Message -->
    <h1 class="text-2xl md:text-3xl font-semibold text-common-blue-color mb-12">
      You have signed this document
    </h1>

    <!-- Action Buttons -->
    <div class="flex flex-col sm:flex-row gap-4 justify-center items-center mb-16">
      <button
        (click)="emailToMe()"
        class="flex items-center justify-center gap-2 px-6 py-3 bg-secondary-background-color border-2 border-input-border-color rounded-lg text-main-text-color hover:bg-secondary-background-color hover:border-common-blue-color transition-all shadow-sm min-w-[170px]"
      >
        <fa-icon [icon]="faEnvelope" class="text-base"></fa-icon>
        <span class="font-medium">Email to me</span>
      </button>

      <button
        (click)="print()"
        class="flex items-center justify-center gap-2 px-6 py-3 bg-secondary-background-color border-2 border-input-border-color rounded-lg text-main-text-color hover:bg-secondary-background-color hover:border-common-blue-color transition-all shadow-sm min-w-[170px]"
      >
        <fa-icon [icon]="faPrint" class="text-base"></fa-icon>
        <span class="font-medium">Print</span>
      </button>

      <button
        (click)="download()"
        class="flex items-center justify-center gap-2 px-6 py-3 bg-secondary-background-color border-2 border-input-border-color rounded-lg text-main-text-color hover:bg-secondary-background-color hover:border-common-blue-color transition-all shadow-sm min-w-[170px]"
      >
        <fa-icon [icon]="faDownload" class="text-base"></fa-icon>
        <span class="font-medium">Download</span>
      </button>
    </div>

    <!-- Powered by -->
    <div class="text-center text-secondary-text-color text-sm flex items-center justify-center gap-2">
      <span>Powered by</span>
      <img
        [ngSrc]="logoPath"
        alt="Logo"
        width="100"
        height="30"
        class="h-6 w-auto object-contain"
      />
    </div>
  </div>
</div>
