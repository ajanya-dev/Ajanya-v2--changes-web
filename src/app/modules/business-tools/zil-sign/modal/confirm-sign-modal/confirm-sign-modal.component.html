<div class="px-[6px] pb-[6px]">
  <!-- modal header -->
  <div class="flex justify-between pb-6">
    <div>
      <span class="mt-18 w-full text-base text-main-text-color align-middle flex items-center">
        <span class="pl-1 font-inter font-semibold text-base pb-0.5">Confirm details</span>
      </span>
    </div>
    <div (click)="onCancel()">
      <fa-icon class="text-secondary-text-color cursor-pointer" [icon]="['fas','xmark']"></fa-icon>
    </div>
  </div>

  <!-- modal body start -->
  <div>
    <p class="text-sm text-secondary-text-color mb-5">
      Please verify the number of fields added for each recipient and confirm
    </p>

    <div class="border border-input-border-color rounded-md overflow-hidden">
      <div class="flex bg-secondary-background-color border-b border-input-border-color">
        <div class="flex-1 px-4 py-3 text-sm font-semibold text-main-text-color">Recipient</div>
        <div class="w-24 px-4 py-3 text-sm font-semibold text-main-text-color text-center">Fields</div>
      </div>

      <div class="bg-main-background-color">
        @for (recipient of recipients; track $index) {
          <div class="flex border-b border-input-border-color last:border-b-0">
            <div class="flex-1 px-4 py-3 text-sm text-main-text-color break-words">{{ recipient.recipientEmail }}</div>
            <div class="w-24 px-4 py-3 text-sm text-main-text-color text-center font-medium">{{ recipient.fieldCount }}</div>
          </div>
        }
      </div>
    </div>
  </div>
  <!-- modal body end -->

  <div class="flex justify-end gap-3 pt-8">
    <app-common-button-v35 [type]="{style:'bordered', name: 'main' }" text="Cancel" (click)="onCancel()"></app-common-button-v35>
    <app-common-button-v35 [type]="{style:'modal', name: 'main' }" text="Confirm" (click)="onConfirm()"></app-common-button-v35>
  </div>
</div>
