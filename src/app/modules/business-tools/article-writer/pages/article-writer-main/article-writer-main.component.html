<div class="flex justify-center">
  <div class="article-writer-main-container">
    <div class="header flex justify-center mt-2 text-main-text-color">AI BASED E-MAIL WRITER</div>
    <div class="flex justify-center">
      <div class="header2 text-secondary-text-color">Generate AI based E-mail Content</div>
    </div>
    <div class="mt-5">
      <label class="input-label text-secondary-text-color">Enter E-mail Content</label>
      <textarea
        class="input_style content-textarea"
        [(ngModel)]="content"
      ></textarea>
      <div class="flex items-center mt-2 gap-2">
        <app-common-button-v35
          [type]="{style: 'filled', name: 'main'}"
          text="Generate Article"
          width="180px"
          [loading]="loading"
          [disabled]="loading"
          backGroundInput="var(--common-green-color)"
          (clickEvent)="onGenerateButtonClicked()"
        >
        </app-common-button-v35>
        <app-common-button-v35
        [type]="{style: 'filled', name: 'main'}"
        text="Clear"
        width="100px"
        backGroundInput="var(--common-red-color)"
        (clickEvent)="clearText('content')"></app-common-button-v35>
      </div>
    </div>
    <div class="mt-5">
      <div class="flex justify-between items-center mb-2">
        <label class="input-label text-secondary-text-color mb-1">Result:</label>
        <div class="flex gap-2 items-center">
          <app-common-button-v35
          [type]="{style: 'filled', name: 'main'}"
          text="Clear"
          width="100px"
          backGroundInput="var(--common-red-color)"
          (clickEvent)="clearText('result')">
          </app-common-button-v35>
          <app-common-button-v35
          [type]="{style: 'filled', name: 'main'}"
          text="Copy"
          width="100px"
          (clickEvent)="showCopied1()"
          [isAddIcon]="true"
          [icon]="!showCopied1banner ? ['fas', 'copy'] : ['fas', 'check']"
          backGroundInput="var(--common-blue-color)">
          </app-common-button-v35>
        </div>
      </div>

      <textarea
        class="input_style result-textarea"
        [(ngModel)]="result1"
      ></textarea>
    </div>
    <div class="line"></div>
    <div class="">
      <div class="flex justify-end items-end mr-0 mb-2">
        <app-common-button-v35
          [type]="{style: 'filled', name: 'main'}"
          text="Copy"
          width="100px"
          (clickEvent)="showCopied2()"
          [isAddIcon]="true"
          [icon]="!showCopied2banner ? ['fas', 'copy'] : ['fas', 'check']"
          backGroundInput="var(--common-blue-color)">
          </app-common-button-v35>
      </div>
      <textarea
        class="input_style result-textarea"
        [(ngModel)]="result2"
      ></textarea>
    </div>
  </div>
</div>
