<div class="bg-secondary-background-color">
  <div
    class="common-transaction-table-container relative pt-3 px-5 bg-main-background-color"
  >
    <div class="flex justify-end mb-3 absolute top-12">
      <app-common-button-v35
      (clickEvent)="onSendMail()"
      text="Send"
      [type]="{ style: 'general', name: 'action' }"
      backGroundInput="var(--common-blue-color)"
      textColorInput="white"
      />
    </div>
    <div class="transaction-table">
      <app-v3-data-table
        [columnDefs]="columnDefs"
        [tableId]="tableId"
        [frameworkComponents]="frameworkComponents"
        [defaultColumnFields]="defaultColumnFields"
        [deselectedColumns]="deselectedColumns"
        [isRowSelectable]="isRowSelectable"
        dynamicHeaderText="Document Mail History"
        backButtonEnabled="true"
      />
    </div>
  </div>
</div>
