<ng-template #groupMailingTable>
  <app-v3-data-table
    class="flex-1 flex flex-col min-h-0 bg-main-background-color rounded-lg shadow-sm overflow-hidden"
    [columnDefs]="columnDefs"
    [tableId]="tableId"
    [frameworkComponents]="frameWorkComponents"
    [isRowSelectable]="isRowSelectable"
    [defaultColumnFields]="defaultColumnFields"
    [deselectedColumns]="deselectedColumns"
  ></app-v3-data-table>
</ng-template>

@if (embedded) {
  <!-- Rendered inside the payments-out check list tab: the host owns the header/tabs. -->
  <div class="flex flex-col w-full min-h-[500px] pb-4">
    <ng-container *ngTemplateOutlet="groupMailingTable"></ng-container>
  </div>
} @else {
  <div class="flex flex-col h-screen w-full overflow-hidden">
    <!-- Page Header -->
    <div class="flex-shrink-0 bg-main-background-color shadow-sm border-b border-input-border-color px-6 py-4">
      <div class="flex items-center gap-4">
        <app-ocw-back-button
          [backUrl]="backUrl"
        ></app-ocw-back-button>
        <h1 class="m-0 text-xl font-semibold text-main-text-color font-roboto">Group Mailing</h1>
      </div>
    </div>

    <!-- Data Table -->
    <div class="flex-1 flex flex-col p-4 min-h-0 overflow-hidden">
      <ng-container *ngTemplateOutlet="groupMailingTable"></ng-container>
    </div>
  </div>
}
