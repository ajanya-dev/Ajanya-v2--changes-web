<div class="w-full h-full flex items-center relative">
  <!-- Display Mode -->
  @if(!isEditing) {
  <div 
    class="w-full cursor-pointer p-1 rounded flex items-center justify-between transition-all duration-200 hover:bg-gray-100 hover:text-gray-800 group"
    (click)="onCellClick()"
    title="Click to edit">
    {{ originalValue || 'Click to edit' }}
    <fa-icon [icon]="faEdit" class="opacity-0 text-xs text-gray-500 transition-opacity duration-200 group-hover:opacity-100 ml-2"></fa-icon>
  </div>
  }

  @if(isEditing) {
    <!-- Edit Mode -->
    <div class="w-full h-full relative z-[1000]" (click)="$event.stopPropagation()">
      <div class="flex items-center gap-1 w-full bg-common-secondary-background-color border-blue-500 rounded p-0.5 shadow-common-box-shadow">
        <input
          #editInput
          type="text"
          [id]="'edit-input-' + params.node?.id"
          [(ngModel)]="editValue"
          class="flex-1 border-none outline-none p-1 text-sm bg-transparent text-gray-800 placeholder-gray-400 min-w-0 w-full focus:outline-none"
          (click)="onInputClick($event)"
          (keydown)="onKeyDown($event)"
          maxlength="100"
          placeholder="Enter payee name"
        />
        <div class="flex gap-0.5">
          <app-common-button-v35
            text=""
            [loading]="isLoading"
            [disabled]="isLoading"
            (clickEvent)="onConfirm()"
            [toolTip]="'Confirm changes'"
            [isAddIcon]="true"
            [icon]="faCheck"
            customClasses="border-none bg-none cursor-pointer p-1 rounded text-xs flex items-center justify-center transition-all duration-200 hover:scale-110 active:scale-95 disabled:opacity-60 disabled:cursor-not-allowed text-common-green-color hover:bg-common-secondary-green-color"
            [disableHoverEffect]="true">
          </app-common-button-v35>
          <app-common-button-v35
            text=""
            [disabled]="isLoading"
            (clickEvent)="onCancel()"
            [toolTip]="'Cancel changes'"
            [isAddIcon]="true"
            [icon]="faTimes"
            customClasses="border-none bg-none cursor-pointer p-1 rounded text-xs flex items-center justify-center transition-all duration-200 hover:scale-110 active:scale-95 disabled:opacity-60 disabled:cursor-not-allowed text-common-red-color hover:bg-common-secondary-red-color"
            [disableHoverEffect]="true">
          </app-common-button-v35>
        </div>
      </div>
    </div>
  }
</div>
