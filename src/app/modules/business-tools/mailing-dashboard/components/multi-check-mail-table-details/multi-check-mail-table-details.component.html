<div class="flex flex-col w-full h-full overflow-auto">
  <div class="data-table-wrapper bg-main-background-color flex-1 rounded">
    <div class="px-5 pt-3">
      <app-v3-data-table
        dynamicHeaderText="Check Batch Details"
        [backButtonEnabled]="true"
        prevoiusUrl="/manage/business-tools/mail-dashboard/multi-check-mail-table"
        [deselectedColumns]="deselectedColumns"
        [headerElements]="headerElements()"
        [columnDefs]="columnDefs"
        [defaultColumnFields]="defaultColumnFields"
        [tableId]="tableId"
        [frameworkComponents]="frameWorkComponents"
        [isRowSelectable]="isRowSelectable"
        (headerButtonEvent)="headerButtonClick($event)"
      >
      </app-v3-data-table>
    </div>
  </div>
</div>
