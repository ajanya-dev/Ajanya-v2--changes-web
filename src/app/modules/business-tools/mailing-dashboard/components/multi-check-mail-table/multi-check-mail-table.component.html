<div class="flex flex-col w-full h-full overflow-auto relative">
  <div class="absolute top-1 right-7">
    <app-demo-video [slug]="env.env_id==='zilMoney' ? 'multi_check_zm' : 'multi_check_ocw' " pageType="business-tools"></app-demo-video>
  </div>
  <div class="data-table-wrapper bg-main-background-color flex-1 rounded">
    <div class="px-5 pt-3">
      <app-v3-data-table
        dynamicHeaderText="Multi Check Import"
        [backButtonEnabled]="true"
        prevoiusUrl="/manage/business-tools/mail-dashboard/index"
        [deselectedColumns]="deselectedColumns"
        [headerElements]="headerElements()"
        [columnDefs]="columnDefs"
        [defaultColumnFields]="defaultColumnFields"
        [tableId]="tableId"
        [frameworkComponents]="frameWorkComponents"
        (headerButtonEvent)="headerButtonClick($event)"
        [isRowSelectable]="isRowSelectable"
      >
      </app-v3-data-table>
    </div>
  </div>
</div>
