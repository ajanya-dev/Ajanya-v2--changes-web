<div
  class="flex flex-col h-full w-full overflow-hidden bg-v4-main-background-color"
>
  <!-- Page Header -->
  <div
    class="flex-shrink-0 bg-v4-main-background-color shadow-sm border-b border-v4-border-color px-6 py-4"
  >
    <div class="flex flex-col">
      <button
        class="flex items-center gap-1.5 text-sm text-v4-secondary-text-color hover:text-v4-primary-brand-bold-color transition-colors mb-2 bg-transparent border-none cursor-pointer p-0 font-peridot"
        (click)="goBack()"
      >
        <lucide-icon name="arrow-left" [size]="14"></lucide-icon>
        <span>{{ backLabel }}</span>
      </button>
      <h1 class="m-0 text-xl font-semibold text-v4-main-text-color font-peridot">
        Single Mail History
      </h1>
    </div>
  </div>

  <!-- Data Table -->
  <div class="flex-1 overflow-auto p-4 min-h-0">
    <app-v4-data-table
      class="block bg-v4-main-background-color rounded-lg"
      [columnDefs]="columnDefs"
      [tableId]="tableId"
      [frameworkComponents]="frameworkComponents"
      [defaultColumnFields]="defaultColumnFields"
      [deselectedColumns]="deselectedColumns"
      (cellRendererViewEvent)="onCellActionView($event)"
    ></app-v4-data-table>
  </div>
</div>
