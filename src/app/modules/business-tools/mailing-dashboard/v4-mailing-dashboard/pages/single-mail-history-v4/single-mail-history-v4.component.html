<div class="bg-v4-main-background-color">
  <div>
    <!-- Page Header -->
    <div class="mb-5">
      <app-v4-page-header
        [title]="'Single Mail History'"
        [subtitle]="'View history of single mail items'"
        [showBackButton]="true"
        backButtonType="takeEvent"
        (backEvent)="onBack()"
      />
    </div>

    <div
      class="bg-v4-secondary-background-color border border-v4-border-color rounded-xl px-6 py-4"
    >
      <app-v4-data-table
        [columnDefs]="columnDefs"
        [tableId]="tableId"
        [frameworkComponents]="frameworkComponents"
        [defaultColumnFields]="defaultColumnFields"
        [backButtonEnabled]="false"
        (cellRendererViewEvent)="onCellActionView($event)"
      />
    </div>
  </div>
</div>
