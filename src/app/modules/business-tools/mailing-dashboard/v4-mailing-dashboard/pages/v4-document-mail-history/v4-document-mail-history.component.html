<div class="bg-v4-main-background-color">
  <div>
    <!-- Page Header -->
    <app-v4-page-header
      class="block mb-5"
      title="Document Mail History"
      subtitle="View history of document mailings"
      [actions]="headerActions"
      [showBackButton]="true"
      [backButtonType]="'takeEvent'"
      (actionClick)="onSendMail()"
      (backEvent)="goBack()"
    />

    <!-- Data Table -->
    <app-v4-data-table
      [tableId]="tableId"
      [frameworkComponents]="frameworkComponents"
      [defaultColumnFields]="defaultColumnFields"
      [fieldsShownByDefault]="[
        'id',
        'action',
        'document_title',
        'status',
        'created_at'
      ]"
      [freeColumnResize]="false"
      [useCustomEmptyState]="true"
      [emptyStateConfig]="{
        icon: 'mail',
        title: 'No mail history yet',
        description:
          'Documents you send by mail will appear here with their delivery status',
        buttonText: 'Send',
        buttonIcon: 'send'
      }"
      (emptyStateActionClick)="onSendMail()"
      [headerElements]="headerElements()"
      (headerButtonEvent)="headerButtonClick($event)"
    ></app-v4-data-table>
  </div>
</div>

@if (selectedDocumentId()) {
  <app-document-mail-detail-panel-v4
    [documentId]="selectedDocumentId()"
    [isOpen]="isPanelOpen()"
    [refreshTrigger]="panelRefreshTrigger()"
    (closed)="closePanel()"
  />
}
