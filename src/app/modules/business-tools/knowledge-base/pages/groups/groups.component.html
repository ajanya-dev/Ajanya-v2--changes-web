<div class="main-container">
  <div class="header-section">
    <div class="left-section">
      <h1>Groups</h1>
    </div>
    <div class="right-section">
      <button
        (click)="openGroupModal()"
        class="ocw-btn ocw-btn-modal-blue add_btn"
      >
        New Group
      </button>
      <button
        [routerLink]="['/manage/business-tools/knowledge-base/articles-list']"
        class="ocw-btn ocw-btn-modal-bordered"
      >
        Articles
      </button>
    </div>
  </div>
  <div class="table-section">
    <table>
      <tr>
        <th>Group Name</th>
        <th>Group Status</th>
        <th>Short Description</th>
        <th>Action</th>
      </tr>
      <tr id="remove-row">
        <td colspan="6">
          <div id="loading-spinner" class="loadingSpinner"></div>
        </td>
      </tr>
      <tr *ngIf="(groups | json) === '[]'">
        <td class="not-found-text" colspan="6">Sorry! No result found :(</td>
      </tr>
      <tr *ngFor="let item of groups">
        <td class="article-name">{{ item.group_name }}</td>
        <td class="group-name">
          <button
            class="ocw-btn ocw-btn-modal-blue add_btn"
            *ngIf="item.status === 'Active'"
            (click)="setStatus(item)"
          >
            {{ item.status }}
          </button>
          <button
            class="ocw-btn ocw-btn-modal-bordered add_btn"
            *ngIf="item.status === 'Inactive'"
            (click)="setStatus(item)"
          >
            {{ item.status }}
          </button>
        </td>
        <td>
          <p class="text-break">{{ item.short_description }}</p>
        </td>
        <td class="icons-section">
          <i
            (click)="openEditGroupModal(item.id)"
            routerLinkActive="router-link-active"
            class="fa-solid fa-pen-to-square"
          ></i>
          <i (click)="openInfoAlert()" class="fa-solid fa-share-nodes"></i>
          <i (click)="onDelete(item.id)" class="fa-solid fa-trash"></i>
        </td>
      </tr>
    </table>
  </div>
</div>
