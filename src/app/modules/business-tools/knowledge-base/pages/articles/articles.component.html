<div class="main-container">
  <div class="header-section">
    <div class="left-section">
      <h1>Knowledge Base</h1>
    </div>
    <div class="right-section">
      <button
        [routerLink]="['/manage/business-tools/knowledge-base/article']"
        class="ocw-btn ocw-btn-modal-blue add_btn"
      >
        New Article
      </button>
      <button
        [routerLink]="['/manage/business-tools/knowledge-base/groups-list']"
        class="ocw-btn ocw-btn-modal-bordered"
      >
        Groups
      </button>
    </div>
  </div>
  <div class="table-section">
    <table>
      <tr>
        <th>S. No</th>
        <th>Article Name</th>
        <th>Group</th>
        <th>Date</th>
        <th>Article Disabled</th>
        <th>Action</th>
      </tr>
      <tr id="remove-row">
        <td colspan="6">
          <div id="loading-spinner" class="loadingSpinner"></div>
        </td>
      </tr>
      <tr class="data-portion" *ngIf="(knowledgeBaseArticles | json) === '[]'">
        <td class="not-found-text" colspan="6">Sorry! No result found :(</td>
      </tr>
      <tr
        class="data-portion"
        *ngFor="let item of knowledgeBaseArticles; let i = index"
      >
        <td>{{ i + 1 }}.</td>
        <td (click)="viewArticle(item.disabled, item.id)" class="article-name">
          {{ item.subject }}
        </td>
        <td class="group-name">
          <p class="text-break">{{ item.group_name }}</p>
        </td>
        <td>{{ item.created_at }}</td>
        <td>
          <ng-container *ngIf="item.disabled">Yes</ng-container>
          <ng-container *ngIf="!item.disabled">No</ng-container>
        </td>
        <td class="icons-section">
          <i
            [routerLink]="[
              '/manage/business-tools/knowledge-base/article',
              item.id
            ]"
            routerLinkActive="router-link-active"
            class="fa-solid fa-pen-to-square"
          ></i>
          <i (click)="openInfoAlert()" class="fa-solid fa-share-nodes"></i>
          <i (click)="onDelete(item.id)" class="fa-solid fa-trash"></i>
          <i
            (click)="viewArticle(item.disabled, item.id)"
            class="fa fa-eye eye"
          ></i>
        </td>
      </tr>
    </table>
  </div>
</div>
