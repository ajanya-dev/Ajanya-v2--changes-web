<div class="main-container">
  <div class="header-section">
    <app-ocw-back-button
      backUrl="/manage/business-tools/knowledge-base/articles-list"
    ></app-ocw-back-button>
    <h1 *ngIf="!this.editArticleMode">Add New Article</h1>
    <h1 *ngIf="this.editArticleMode">Update Article</h1>
  </div>
  <form class="form-section" [formGroup]="articlesForm">
    <div class="input-fields">
      <div class="basis-1/2">
        <input
          type="text"
          class="input_style"
          formControlName="subject"
          [maxLength]="40"
          placeholder="Subject"
        />
        <app-control-message
          [control]="articlesForm.controls.subject"
        ></app-control-message>
      </div>

      <div class="basis-1/2">
        <div class="flex">
          <ng-select
            [(ngModel)]="selectedItem"
            (ngModelChange)="patchGroupName()"
            (clear)="clear()"
            placeholder="Select Group"
            [ngModelOptions]="{ standalone: true }"
          >
            <ng-option *ngFor="let item of groups" [value]="item.group_name">{{
              item.group_name
            }}</ng-option>
          </ng-select>
          <div class="add_modal_btn" (click)="openGroupModal()">
            <svg
              aria-hidden="true"
              focusable="false"
              data-prefix="far"
              data-icon="plus"
              class="svg-inline--fa fa-plus fa-w-12"
              role="img"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 384 512"
            >
              <path
                fill="currentColor"
                d="M368 224H224V80c0-8.84-7.16-16-16-16h-32c-8.84 0-16 7.16-16 16v144H16c-8.84 0-16 7.16-16 16v32c0 8.84 7.16 16 16 16h144v144c0 8.84 7.16 16 16 16h32c8.84 0 16-7.16 16-16V288h144c8.84 0 16-7.16 16-16v-32c0-8.84-7.16-16-16-16z"
              ></path>
            </svg>
          </div>
        </div>
        <app-control-message
          [control]="articlesForm.controls.group_name"
        ></app-control-message>
      </div>
    </div>
    <div class="checkbox-fields">
      <mat-checkbox formControlName="internal_article"
        >Internal Article</mat-checkbox
      >
      <mat-checkbox formControlName="disabled">Disabled</mat-checkbox>
    </div>
    <div class="text-editor-section">
      <h2>Add New Article</h2>
      <app-text-editor
        [content]="articleContent"
        [toolbarHiddenButtons]="toolbarHiddenButtons"
        (textChange)="textChange($event)"
      ></app-text-editor>
      <app-control-message
        [control]="articlesForm.controls.article_description"
      ></app-control-message>
    </div>

    <div class="submit-cancel">
      <button (click)="onSubmit()" class="ocw-btn ocw-btn-modal-blue add_btn">
        {{ onSubmitButtonText }}
      </button>
      <button
        [routerLink]="['/manage/business-tools/knowledge-base/articles-list']"
        class="ocw-btn ocw-btn-modal-bordered"
      >
        Cancel
      </button>
    </div>
  </form>
</div>
