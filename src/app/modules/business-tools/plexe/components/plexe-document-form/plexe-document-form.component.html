<div class="px-5 pb-5 flex-grow">
  <div class="header1 mb-3">Your Drivers License Details</div>
  <div class="w-full flex flex-col" [formGroup]="licenseForm">
    <div class="flex mt-4 w-full">
      <div class="single_input w-1/2 pr-1">
        <input
          type="text"
          class="input_style"
          placeholder=" "
          formControlName="fullName"
        />
        <label class="floating_label_field"
          >Full Name<span class="required">*</span></label
        >
        <app-control-message
          [control]="licenseForm.controls.fullName"
        ></app-control-message>
      </div>
      <div class="single_input w-1/2 pl-1">
        <input
          type="text"
          class="input_style"
          placeholder=" "
          formControlName="licenseNumber"
          mask="00000000"
          maxlength="8"
        />
        <label class="floating_label_field"
          >License Number<span class="required">*</span></label
        >
        <app-control-message
          [control]="licenseForm.controls.licenseNumber"
        ></app-control-message>
      </div>
    </div>
    <div class="single_input mt-4">
      <input
        type="text"
        class="input_style"
        placeholder=" "
        formControlName="address"
        #address
        (focus)="loadGoogleAddress(address)"
      />
      <label class="floating_label_field"
        >Address<span class="required">*</span></label
      >
      <app-control-message
        [control]="licenseForm.controls.address"
      ></app-control-message>
    </div>
    <div class="flex mt-4 w-full">
      <div class="single_input w-1/2 pr-1">
        <input
          type="text"
          class="input_style"
          placeholder=" "
          formControlName="city"
        />
        <label class="floating_label_field"
          >City<span class="required">*</span></label
        >
        <app-control-message
          [control]="licenseForm.controls.city"
        ></app-control-message>
      </div>
      <div class="single_input w-1/2 pl-1">
        <input
          type="date"
          class="input_style"
          formControlName="dob"
          [max]="minDate"
        />
        <label class="floating_label_field"
          >Date Of Birth<span class="required">*</span></label
        >
        <app-control-message
          [control]="licenseForm.controls.dob"
        ></app-control-message>
      </div>
    </div>

    <div class="flex mt-4 w-full">
      <div class="single_input w-1/2 pr-1">
        <input
          type="text"
          class="input_style"
          placeholder=" "
          formControlName="stateOfIssue"
        />
        <label class="floating_label_field"
          >State Of Issue<span class="required">*</span></label
        >
        <app-control-message
          [control]="licenseForm.controls.stateOfIssue"
        ></app-control-message>
      </div>
      <div class="single_input w-1/2 pl-1">
        <input type="date" class="input_style" formControlName="expiryDate" />
        <label class="floating_label_field"
          >Expiry Date<span class="required">*</span></label
        >
        <app-control-message
          [control]="licenseForm.controls.expiryDate"
        ></app-control-message>
      </div>
    </div>
  </div>
  <div class="btn-section">
    <div>
      <button
        class="ocw-btn ocw-btn-modal-bordered"
        [routerLink]="['/manage/working-capital/home']"
        [disabled]="isLoading"
      >
        Back
      </button>
    </div>
    <div>
      <button
        class="ocw-btn ocw-btn-modal-blue"
        [disabled]="isLoading"
        (click)="submit()"
      >
        <ng-container *ngIf="!isLoading">
          <span> Next </span>
        </ng-container>

        <span *ngIf="isLoading" class="loadingSpinner"></span>
      </button>
    </div>
  </div>
</div>
