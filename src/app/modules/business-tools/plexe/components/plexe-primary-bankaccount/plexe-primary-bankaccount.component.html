<div class="plexe-bank-container">
  <div class="header-section">
    <span
      >Select a primary bank account that will be used to receive the
      funds</span
    >
  </div>
  <div class="bank-list" [ngClass]="{ skelton: isLoading }">
    <div
      class="bank"
      *ngFor="let bank of bankList"
      (click)="selectBank(bank?.id)"
      [ngClass]="{ skelton: isLoading, active: bank?.id === bankId }"
    >
      <div class="flex items-center bank-item">
        <img
          class="w-[20px] h-[20px]"
          *ngIf="bank?.id !== bankId"
          src="./../../../../../assets/images/plexe/unselected-bank.svg"
          title="Unselected Bank"
        />
        <img
          class="w-[20px] h-[20px]"
          *ngIf="bank?.id === bankId"
          src="./../../../../../assets/images/plexe/selected-bank.svg"
          title="Selected Bank"
        />
      </div>
      <div>
        <span>Account Name</span>
        <p>{{ bank?.name }}</p>
      </div>
      <div>
        <span>Routing Number</span>
        <p>{{ bank?.routingNumber }}</p>
      </div>
      <div>
        <span>Account Number</span>
        <p>{{ bank?.accountNumber }}</p>
      </div>
    </div>
  </div>
  <div class="btn-section">
    <div>
      <button
        class="ocw-btn ocw-btn-modal-bordered"
        [routerLink]="['/manage/working-capital/home']"
        [disabled]="btnDisable"
      >
        Back
      </button>
    </div>
    <div>
      <button class="ocw-btn ocw-btn-modal-blue" (click)="onSumbit()">
        <ng-container *ngIf="!btnDisable">
          <span> Next </span>
        </ng-container>

        <span *ngIf="btnDisable" class="loadingSpinner"></span>
      </button>
    </div>
  </div>
</div>
