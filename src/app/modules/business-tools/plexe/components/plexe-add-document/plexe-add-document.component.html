<div class="plexe-document-container">
  <div class="header-section">
    <span>Supporting Documents</span>
  </div>
  <div class="main-body">
    <div class="document-list" [ngClass]="{ skelton: isLoading }">
      <div class="document" *ngFor="let doc of requiedDocs; let i = index">
        <input
          #fileInput
          type="file"
          class="hidden"
          (change)="onFileSelected($event)"
          accept=".jpeg, .png, .heic, .doc,.docx,.pdf,.jpg"
        />
        <div class="documnet-body" (click)="selectFile(i, doc?.label)">
          <div class="flex items-center">
            <span>{{ doc?.label }}</span>
          </div>
          <div class="attach-part">
            <ng-container *ngIf="!doc?.file?.name; else fileName">
              <div
                class="flex gap-1 items-center cursor-pointer"
                *ngIf="!isEinChecked && doc?.label === 'EIN'"
              >
                <div>
                  <img
                    src="./../../../../../assets/images/plexe/upload.svg"
                    title="Upload File"
                  />
                </div>
                <div>Attach file</div>
              </div>
              <div
                class="flex gap-1 items-center cursor-pointer"
                *ngIf="doc?.label !== 'EIN'"
              >
                <div>
                  <img
                    src="./../../../../../assets/images/plexe/upload.svg"
                    title="Upload File"
                  />
                </div>
                <div>Attach file</div>
              </div>
              <div *ngIf="isEinChecked && doc?.label === 'EIN'">
                <img
                  src="./../../../../../assets/images/plexe/Checked.svg"
                  alt="Checked Icon"
                  width="20px"
                />
              </div>
            </ng-container>
            <ng-template #fileName>
              {{ doc?.file?.name }}
            </ng-template>
          </div>
        </div>
      </div>
    </div>
    <div class="btn-section">
      <div>
        <button
          class="ocw-btn ocw-btn-modal-bordered"
          [routerLink]="['/manage/working-capital/home']"
          [disabled]="btnDisable"
        >
          Back
        </button>
      </div>
      <div>
        <button
          class="ocw-btn ocw-btn-modal-blue"
          (click)="onSubmit()"
          [disabled]="btnDisable"
        >
          <ng-container *ngIf="!btnDisable">
            <span> Next </span>
          </ng-container>

          <span *ngIf="btnDisable" class="loadingSpinner"></span>
        </button>
      </div>
    </div>
  </div>
</div>
