<div class="ocw-plexe-container">
  <div class="header-section">
    <div class="pt-5 text-center">
      <span class="font-semibold text-sm">Line of Credit Application</span>
    </div>
    <div class="progress-header">
      <div
        *ngFor="let step of steps; let i = index"
        class="item"
        [ngClass]="{
          active: currentStep === i,
          done: currentStep > i
        }"
      >
        <img
          *ngIf="currentStep === i; else otherStepBlock"
          src="./../../../../../assets/images/plexe/complete-step.svg"
          title="round-shape"
        />
        <ng-template #otherStepBlock>
          <div class="shape" *ngIf="currentStep < i">
            <span>{{ step.stepNo }}</span>
          </div>
          <img
            *ngIf="currentStep > i"
            src="./../../../../../assets/images/plexe/incomplete-step.svg"
            title="round-shape"
          />
        </ng-template>

        <div class="name">{{ step.name }}</div>
      </div>
    </div>
  </div>

  <div class="main-body">
    <span *ngIf="isLoading" class="data_spinner"></span>
    <div>
      <div *ngIf="step === 6">
        <app-plexe-document-form
          [applicationId]="onBoardingId"
          (nextStep)="nextSlide()"
        ></app-plexe-document-form>
      </div>
      <div *ngIf="step === 7">
        <app-plexe-primary-bankaccount
          [applicationId]="onBoardingId"
          (nextStep)="nextSlide()"
        >
        </app-plexe-primary-bankaccount>
      </div>
      <div *ngIf="step === 8">
        <app-plexe-agreement
          [applicationId]="onBoardingId"
          (nextStep)="nextSlide()"
        ></app-plexe-agreement>
      </div>
      <div *ngIf="step === 9">
        <app-plexe-add-document
          [applicationId]="onBoardingId"
          (nextStep)="nextSlide()"
        ></app-plexe-add-document>
      </div>
      <div *ngIf="step === 10 || step === 29 || step === 21">
        <div class="plexe-success-container">
          <div class="header-section">
            <span>Application Submitted Successfully.</span>
          </div>
          <div class="gif flex justify-center">
            <svg
              class="checkmark"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 52 52"
            >
              <circle
                class="checkmark__circle"
                cx="26"
                cy="26"
                r="25"
                fill="none"
              />
              <path
                class="checkmark__check"
                fill="none"
                d="M14.1 27.2l7.1 7.2 16.7-16.8"
              />
            </svg>
          </div>
          <div class="text flex justify-center">
            <div class="text-center text-info">
              <span class="text-sm font-normal"
                >Your application for line of credit is submitted
                successfully.</span
              >
              <p class="text-sm font-normal">
                Please wait until our team verify your details and you will be
                notified with an update soon.
              </p>
            </div>
          </div>
          <div class="btn flex justify-center">
            <button
              class="ocw-btn ocw-btn-modal-blue"
              [routerLink]="['/manage/business-tools']"
              routerLinkActive="router-link-active"
            >
              OK
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
