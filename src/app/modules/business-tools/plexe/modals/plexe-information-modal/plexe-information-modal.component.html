<div class="ocw_man_modal_wrapper">
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">Instruction</div>
    <div class="close_btn" [mat-dialog-close]="false">
      <img
        src="/assets/icon/close-icon.svg"
        type="image/svg+xml"
        alt="Close Icon"
      />
    </div>
  </div>
  <div class="ocw_modal_body pt-2 pb-5">
    <div>
      <h2 class="text-base font-semibold pb-3">Minimum qualifications</h2>
      <div class="flex gap-2">
        <i class="fa-solid fa-period"></i>
        <p class="text-sm font-normal">12+ months in business</p>
      </div>
      <div class="flex gap-2">
        <i class="fa-solid fa-period"></i>
        <p class="text-sm font-normal">$30,000+ in monthly revenue</p>
      </div>
      <div class="flex gap-2">
        <i class="fa-solid fa-period"></i>
        <p class="text-sm font-normal">
          The business is operating or incorporated in an eligible US state
        </p>
      </div>
    </div>
    <div class="pt-7">
      <h2 class="text-base font-semibold pb-3">What you need to apply</h2>
      <div class="flex gap-2">
        <i class="fa-solid fa-period"></i>
        <p class="text-sm font-normal">Instantly verify your bank account</p>
      </div>
      <div class="flex gap-2">
        <i class="fa-solid fa-period"></i>
        <p class="text-sm font-normal">Business in good standing</p>
      </div>
    </div>
  </div>
  <div class="ocw_modal_footer">
    <mat-dialog-actions align="end">
      <button mat-dialog-close class="ocw-btn ocw-btn-modal-bordered">
        Close
      </button>
      <button
        type="submit"
        class="ocw-btn ocw-btn-modal-blue add_btn"
        (click)="onContinue()"
      >
        <span>Continue</span>
      </button>
    </mat-dialog-actions>
  </div>
</div>
