<div class="px-[6px] pb-[6px]">
  <!-- modal header -->
  <div class="flex justify-between pb-6">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
        <span class="pl-1 font-inter font-semibold text-base pb-0.5"
          >Update Address</span
        >
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      ></fa-icon>
    </div>
  </div>
  <!-- modal body start -->
  <div class="grid grid-cols-2 gap-5" [formGroup]="addressForm">
    <div>
      <app-common-input-field
        placeholder="Address Line 1"
        formControlName="line1"
        (inputFocusEvent)="loadGoogleAddress($event)"
      />
      <app-control-message-v35 [control]="addressForm.controls.line1" />
    </div>
    <div>
      <app-common-input-field
        placeholder="Address Line 2"
        formControlName="line2"
        [isFieldRequired]="false"
      />
      <app-control-message-v35 [control]="addressForm.controls.line2" />
    </div>
    <div>
      <app-common-input-field placeholder="City" formControlName="city" />
      <app-control-message-v35 [control]="addressForm.controls.city" />
    </div>
    <div>
      <app-common-input-field placeholder="State" formControlName="state" />
      <app-control-message-v35 [control]="addressForm.controls.state" />
    </div>
    <div>
      <app-common-input-field placeholder="Zip" formControlName="postal_code" />
      <app-control-message-v35 [control]="addressForm.controls.postal_code" />
    </div>
    <div>
      <div class="single_input w-full">
        <small
          [ngClass]="{
            '!opacity-100': addressForm.controls.country.value
          }"
          class="small_floating_label bg-main-background-color"
          >Country</small
        >
        <select
          name="country"
          id="country"
          class="input_style"
          formControlName="country"
        >
          <option [value]="''" selected disabled>Country</option>
          @for (item of countryList; track item.code) {
            <option [value]="item.code">
              {{ item.name }}
            </option>
          }
        </select>
      </div>
      <app-control-message-v35 [control]="addressForm.controls.country" />
    </div>
  </div>
  <!-- modal body end -->
  <div class="flex justify-end gap-3 pt-8">
    <app-common-button-v35
      mat-dialog-close
      width="120px"
      [type]="{ style: 'bordered', name: 'main' }"
      text="Cancel"
    ></app-common-button-v35>
    <app-common-button-v35
      width="120px"
      [type]="{ style: 'modal', name: 'main' }"
      text="Update"
      (clickEvent)="onSubmit()"
      [disabled]="isSubmit()"
      [loading]="isSubmit()"
    ></app-common-button-v35>
  </div>
</div>
