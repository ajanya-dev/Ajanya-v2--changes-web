<div class="body_wrapper">
  <div class="sign_up_box">
    <div class="header">
      <div class="logo">
        <img
          [ngStyle]="{ 'width.px': isVirtualCard ? 200 : null }"
          [src]="
            isVirtualCard
              ? logo_if_virtualCard
              : '../../../../assets/images/zil_bank._logo.svg'
          "
          alt="Zil bank"
          title="Zil bank"
        />
      </div>
      <p>Log in to view the card details</p>
    </div>

    <form [formGroup]="loginForm">
      <div class="input_group">
        <div class="single_input">
          <input
            type="email"
            class="input_style"
            placeholder=" "
            maxlength="60"
            formControlName="email"
            autofocus
          />
          <span class="floating_label_field">Email</span>
        </div>

        <div class="single_input">
          <input
            type="password"
            class="input_style"
            placeholder=" "
            formControlName="password"
            maxlength="100"
          />
          <span class="floating_label_field">Password</span>

          <span *ngIf="warningMsg" class="alert_label">
            <p>{{ warningMsg }}</p>
          </span>
        </div>

        <div class="notes">
          <p>
            <i [matTooltip]="'info'" class="fas fa-info-circle"></i>The username
            is your email address, and the password is enclosed in the email you
            received.
          </p>
        </div>
      </div>
    </form>

    <a class="actions">
      <button
        class="ocw-btn btn_sign_up"
        (click)="submit()"
        [ngClass]="{ disableBtn: loading }"
      >
        <span class="loadingSpinner" *ngIf="loading"></span>
        Login
      </button>
    </a>
  </div>
</div>
