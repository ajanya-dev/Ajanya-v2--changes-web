<div
  class="bg-main-background-color w-full bg-[url(/assets/images/register-bg.svg)] max-sm:bg-none min-h-screen"
>
  <div class="flex w-full h-full items-center flex-col">
    <div class="w-32 py-14 max-sm:w-24 max-sm:!pb-0">
      <img
        role="presentation"
        [alt]="authV3Service.appConfig?.websiteTitle"
        (click)="authV3Service.onGoToWebsite()"
        [ngSrc]="logoPath"
        [title]="authV3Service.appConfig?.websiteTitle"
        width="130"
        height="85"
        priority
      />
    </div>
    <div
      class="shadow-common-box-shadow rounded flex flex-col gap-3 w-2/6 min-w-80 py-5 px-7 bg-main-background-color max-sm:shadow-none max-sm:px-0 max-xl:w-1/2"
    >
      <div class="w-full flex flex-col justify-center items-center">
        <h2 class="text-xl text-main-text-color font-semibold mb-2">
          Upload Payment Receipt
        </h2>
        <p class="text-sm text-secondary-text-color mb-6">
          Please upload your payment receipt in any of the supported formats
        </p>
      </div>

      <div
        class="upload-area bg-secondary-background-color border-2 border-dashed border-input-border-color rounded-lg p-8 mb-4 cursor-pointer"
        [class.dragging]="isDragging"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)"
        (click)="triggerFileInput()"
        (keydown.enter)="triggerFileInput()"
        (keydown.space)="triggerFileInput()"
        tabindex="0"
        role="button"
        aria-label="Upload receipt file"
      >
        <input
          #fileInput
          type="file"
          accept=".pdf,.jpg,.jpeg,.png"
          class="hidden"
          (change)="onFileSelected($event)"
        />
        <div
          class="upload-icon text-2xl text-common-blue-color mb-4 flex justify-center"
        >
          <!-- Icon will go here -->
          <fa-icon [icon]="faFileUpload"></fa-icon>
        </div>
        <div class="w-full flex flex-col justify-center text-center">
          <div class="text-main-text-color font-semibold">
            Drag and drop your file here
          </div>
          <div class="text-secondary-text-color text-sm">
            or click to browse from your computer
          </div>
        </div>
        <p
          class="file-status text-sm text-secondary-text-color mt-4 flex justify-center"
        >
          {{ fileStatus }}
        </p>
      </div>

      <div
        class="supported-formats flex justify-center gap-5 mb-4 text-secondary-text-color text-sm"
      >
        <div
          class="rounded-2xl p-1.5 px-2.5 font-semibold bg-secondary-background-color"
        >
          <fa-icon [icon]="faPDF" class="mx-1"></fa-icon>
          PDF
        </div>
        <div
          class="rounded-2xl p-1.5 px-2.5 font-semibold bg-secondary-background-color"
        >
          <fa-icon [icon]="faJPG" class="mx-2"></fa-icon>
          JPG
        </div>
        <div
          class="rounded-2xl p-1.5 px-2.5 font-semibold bg-secondary-background-color"
        >
          <fa-icon [icon]="faPNG" class="mx-2"></fa-icon>
          PNG
        </div>
      </div>

      <app-common-button-v35
        type="button"
        customClasses="upload-button bg-common-blue-color text-white font-semibold !py-2 rounded w-full mb-4"
        text="Upload Receipt"
        customHeight="34px"
        [loading]="isLoading()"
        [disabled]="isLoading()"
        (clickEvent)="uploadDocument()"
      >
      </app-common-button-v35>

      <div
        class="support-link flex justify-center text-sm text-secondary-text-color"
      >
        Need help?
        <div class="ml-2 text-common-blue-color hover:underline cursor-pointer"
        (click)="goToLiveChat()"
        (keydown.enter)="goToLiveChat()"
        (keydown.space)="goToLiveChat()"
        tabindex="0"
        role="button"
          >Contact our support team</div
        >
      </div>
    </div>
  </div>
</div>
