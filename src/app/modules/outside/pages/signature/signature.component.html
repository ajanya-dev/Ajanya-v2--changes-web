<ng-container>
  <div class="main_content_wrapper flex justify-center items-center h-full">
    <div class="main_content flex justify-center flex-col gap-3">
      <canvas #signPad></canvas>
      <div id="s_line">Sign above</div>

      <input
        type="text"
        class="input_style"
        placeholder="Enter Name"
        maxlength="20"
        #nickName
      />

      <div class="flex justify-center items-center gap-2">
        <button
          (click)="clearSignaturePad()"
          class="ocw-btn ocw-btn-modal-bordered flex justify-center items-center clr-btn"
        >
          Clear
        </button>
        <button
          (click)="save(nickName.value)"
          class="ocw-btn ocw-btn-skyblue flex justify-center items-center gap-2 save-btn"
          [ngClass]="{
            disableBtn:
              signaturePad?.isEmpty() || !nickName.value?.length || saving
          }"
        >
          <ng-container *ngIf="saving">
            <span class="loadingSpinner"></span>
          </ng-container>
          Save
        </button>
      </div>
    </div>
  </div>
</ng-container>
