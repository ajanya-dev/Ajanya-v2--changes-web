<div class="attachment_wrapper">
  <div class="body_container">
    <div class="main_header">
      <div class="logo">
        <img
          [alt]="appConfig?.websiteTitle"
          [src]="
            appConfig?.websiteLogo || '../../../../assets/main/app_logo.svg'
          "
          [title]="appConfig?.websiteTitle"
        />
      </div>
    </div>

    <ng-container *ngIf="!linkExpired; else loader">
      <div class="main_body">
        <div class="sub_heading">
          <h3>Add attachment to this Check</h3>
        </div>

        <div class="check_details">
          <div>
            <p>Check No</p>
            <p>{{ checkDetails?.chequeSerialNumber }}</p>
          </div>
          <div>
            <p>Amount</p>
            <p>{{ checkDetails?.chequeAmount | currency }}</p>
          </div>
        </div>

        <div class="show_files" *ngIf="selectedFiles?.length">
          <ng-container *ngFor="let item of selectedFiles; let i = index">
            <div>
              <div class="left">
                <p>
                  <svg
                    width="20"
                    height="25"
                    viewBox="0 0 20 25"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M13.7811 0.0996094H4.1418C2.73353 0.0996094 1.58739 1.24655 1.58739 2.65397V12.0996H1.33785C0.769091 12.0996 0.308594 12.5601 0.308594 13.1289V19.3713C0.308594 19.9401 0.769091 20.4006 1.33785 20.4006H1.58739V21.5452C1.58739 22.9542 2.73353 24.0996 4.1418 24.0996H17.2942C18.7016 24.0996 19.8479 22.9541 19.8479 21.5452V6.14511L13.7811 0.0996094ZM2.2126 14.2554C2.51386 14.2045 2.93752 14.166 3.53531 14.166C4.13936 14.166 4.5693 14.2813 4.85886 14.5128C5.13493 14.7309 5.3209 15.0909 5.3209 15.5146C5.3209 15.9382 5.17968 16.2984 4.92312 16.5424C4.58891 16.857 4.09387 16.9982 3.51649 16.9982C3.38782 16.9982 3.27173 16.9918 3.18223 16.9793V18.5272H2.2126V14.2554ZM17.2942 22.5352H4.1418C3.59653 22.5352 3.15246 22.0912 3.15246 21.5452V20.4006H15.413C15.9818 20.4006 16.4423 19.9401 16.4423 19.3713V13.1289C16.4423 12.5601 15.9818 12.0996 15.413 12.0996H3.15246V2.65397C3.15246 2.1095 3.59653 1.66548 4.1418 1.66548L13.1959 1.65602V5.00275C13.1959 5.98029 13.9891 6.7742 14.9674 6.7742L18.2458 6.76479L18.2827 21.5451C18.2827 22.0912 17.8395 22.5352 17.2942 22.5352ZM8.63149 15.4636V14.1982H9.53063V18.5272H8.50296L7.57798 16.8569C7.32068 16.3948 7.03819 15.8354 6.82644 15.3286L6.80752 15.3349C6.83271 15.9061 6.84605 16.5163 6.84605 17.2233V18.5272H5.94616V14.1982H7.09001L7.98905 15.7844C8.24645 16.2402 8.50296 16.78 8.6959 17.268H8.71477C8.6504 16.6969 8.63149 16.1116 8.63149 15.4636ZM12.5707 17.7818C12.7957 17.7818 12.9755 17.7559 13.0523 17.7176V16.8122H12.3847V16.048H13.997V18.3278C13.6949 18.4306 13.123 18.5718 12.5518 18.5718C11.7618 18.5718 11.1899 18.3725 10.7914 17.9874C10.3936 17.6147 10.1747 17.0499 10.1818 16.4136C10.188 14.9748 11.2347 14.1527 12.6547 14.1527C13.2133 14.1527 13.6439 14.2617 13.8557 14.3653L13.6502 15.1482C13.4125 15.0455 13.1167 14.9623 12.6413 14.9623C11.8262 14.9623 11.2095 15.4244 11.2095 16.3627C11.2094 17.2555 11.768 17.7818 12.5707 17.7818Z"
                      fill="black"
                    />
                  </svg>
                </p>
                <p>{{ item.name }}</p>
              </div>
              <div class="right">
                <i
                  class="fa-regular fa-trash-can"
                  (click)="onDeleteAttachment(i)"
                ></i>
              </div>
            </div>
          </ng-container>
        </div>

        <div class="upload_button" *ngIf="selectedFiles?.length">
          <button
            class="ocw-btn ocw-btn-dark-green"
            [ngStyle]="{
              'pointer-events': loading.uploading ? 'none' : 'auto'
            }"
            (click)="onSubmit()"
          >
            {{ loading.uploading ? "Uploading" : "Upload" }}
          </button>
        </div>

        <div
          class="actions"
          [ngClass]="{ disable: selectedFiles?.length == 5 }"
        >
          <div class="from_phone">
            <input
              type="file"
              [accept]="acceptedFormat"
              onclick="this.value=null"
              (change)="uploadInput($event)"
            />
            <p>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512">
                <path
                  d="M63.1 464H284.5C296.5 482.4 311.9 498.5 329.7 511.3C326.6 511.7 323.3 512 320 512H64C28.65 512 0 483.3 0 448V64C0 28.65 28.65 0 64 0H229.5C246.5 0 262.7 6.743 274.7 18.75L365.3 109.3C377.3 121.3 384 137.5 384 154.5V198.6C366.8 203.5 350.6 210.9 336 220.5V160H256C238.3 160 224 145.7 224 128V48H64C55.16 48 48 55.16 48 64V448C48 456.8 55.16 464 64 464H63.1zM287.1 368C287.1 288.5 352.5 224 432 224C511.5 224 576 288.5 576 368C576 447.5 511.5 512 432 512C352.5 512 287.1 447.5 287.1 368zM448 303.1C448 295.2 440.8 287.1 432 287.1C423.2 287.1 416 295.2 416 303.1V351.1H368C359.2 351.1 352 359.2 352 367.1C352 376.8 359.2 383.1 368 383.1H416V431.1C416 440.8 423.2 447.1 432 447.1C440.8 447.1 448 440.8 448 431.1V383.1H496C504.8 383.1 512 376.8 512 367.1C512 359.2 504.8 351.1 496 351.1H448V303.1z"
                />
              </svg>
            </p>
          </div>
        </div>
      </div>
    </ng-container>

    <ng-template #loader>
      <div
        class="data_spinner"
        [ngClass]="{ data_fetched: !loading.defaultLoading }"
      ></div>
    </ng-template>

    <ng-container *ngIf="linkExpired && !loading.defaultLoading">
      <div class="link_expired">
        <p>
          <svg
            width="82"
            height="75"
            viewBox="0 0 82 75"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M32.9375 31C32.9375 32.0656 32.0656 32.9375 31 32.9375H17.4375C16.3719 32.9375 15.5 32.0656 15.5 31C15.5 29.9344 16.3719 29.0625 17.4375 29.0625H29.0625V13.5625C29.0625 12.4969 29.9344 11.625 31 11.625C32.0656 11.625 32.9375 12.4969 32.9375 13.5625V31ZM62 31C62 48.1227 48.1227 62 31 62C13.8773 62 0 48.1227 0 31C0 13.8773 13.8773 0 31 0C48.1227 0 62 13.8773 62 31ZM31 3.875C16.0207 3.875 3.875 16.0207 3.875 31C3.875 45.9793 16.0207 58.125 31 58.125C45.9793 58.125 58.125 45.9793 58.125 31C58.125 16.0207 45.9793 3.875 31 3.875Z"
              fill="#BFBFBF"
            />
            <path
              d="M80.6847 48.4352L61.574 29.2406C59.8291 27.5865 56.98 27.5865 55.3268 29.2406L36.3108 48.4352C34.5631 50.0857 34.5631 52.9359 36.3108 54.5864L55.4214 73.6892C57.0754 75.4369 59.9237 75.4369 61.5777 73.6892L80.6883 54.5864C82.4378 52.9332 82.4378 50.0875 80.6847 48.4352ZM56.2961 41.8717C56.2961 40.6555 57.2829 39.6686 58.4991 39.6686C59.7153 39.6686 60.702 40.6555 60.702 41.8717V52.1529C60.702 53.3692 59.7153 54.356 58.4991 54.356C57.2829 54.356 56.2961 53.3692 56.2961 52.1529V41.8717ZM58.4991 63.1684C56.8781 63.1684 55.5618 61.8521 55.5618 60.2309C55.5618 58.6098 56.8781 57.2935 58.4991 57.2935C60.1201 57.2935 61.4364 58.6098 61.4364 60.2309C61.4364 61.8521 60.1238 63.1684 58.4991 63.1684Z"
              fill="#C9C9C9"
            />
            <path
              d="M56.2961 41.8717C56.2961 40.6555 57.2829 39.6686 58.4991 39.6686C59.7153 39.6686 60.702 40.6555 60.702 41.8717V52.1529C60.702 53.3692 59.7153 54.356 58.4991 54.356C57.2829 54.356 56.2961 53.3692 56.2961 52.1529V41.8717Z"
              fill="white"
            />
            <path
              d="M58.4991 63.1684C56.8781 63.1684 55.5618 61.8521 55.5618 60.2309C55.5618 58.6098 56.8781 57.2935 58.4991 57.2935C60.1201 57.2935 61.4364 58.6098 61.4364 60.2309C61.4364 61.8521 60.1238 63.1684 58.4991 63.1684Z"
              fill="white"
            />
          </svg>
        </p>
        <p>Link Expired!</p>
      </div>
    </ng-container>
  </div>
</div>
