<div
  class="bg-main-background-color w-full relative bg-[url(/assets/images/register-bg.svg)] max-sm:bg-none min-h-screen"
>
  <div
    class="flex w-full absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 items-center flex-col"
  >
    <div
      class="shadow-common-box-shadow rounded flex flex-col gap-5 justify-between w-1/5 min-w-80 min-h-[450px] py-5 px-7 bg-main-background-color max-sm:shadow-none max-sm:px-0"
    >
      <div class="flex flex-col gap-5">
        <div class="flex justify-center items-center">
          <div class="w-32 max-sm:w-24 max-sm:!pb-0 cursor-pointer">
            <img
              role="presentation"
              [alt]="authV3Service.appConfig?.websiteTitle"
              (click)="authV3Service.onGoToWebsite()"
              [ngSrc]="logoPath"
              [title]="authV3Service.appConfig?.websiteTitle"
              width="130"
              height="85"
              priority
            />
          </div>
        </div>
        <h1
          class="font-inter font-medium text-main-text-color text-xl text-center pt-5"
        >
          Enter OTP to view the card details
        </h1>
        <div class="flex flex-col items-center">
          <div class="flex justify-center gap-3 w-full" (paste)="onPaste($event)">
            <!-- OTP Input Boxes -->
            <input 
              #otpInput
              type="text" 
              maxlength="1"
              [value]="otp[0]"
              (input)="onDigitInput(0, $event)"
              (keydown)="onKeyDown(0, $event)"
              class="w-12 h-12 text-main-text-color font-inter border border-input-border-color rounded-md text-center text-xl font-medium focus:border-common-blue-color focus:ring-1 focus:ring-common-bborder-common-blue-color outline-none"
            >
            <input 
              #otpInput
              type="text" 
              maxlength="1"
              [value]="otp[1]"
              (input)="onDigitInput(1, $event)"
              (keydown)="onKeyDown(1, $event)"
              class="w-12 h-12 text-main-text-color font-inter border border-input-border-color rounded-md text-center text-xl font-medium focus:border-common-blue-color focus:ring-1 focus:ring-common-bborder-common-blue-color outline-none"
            >
            <input 
              #otpInput
              type="text" 
              maxlength="1"
              [value]="otp[2]"
              (input)="onDigitInput(2, $event)"
              (keydown)="onKeyDown(2, $event)"
              class="w-12 h-12 text-main-text-color font-inter border border-input-border-color rounded-md text-center text-xl font-medium focus:border-common-blue-color focus:ring-1 focus:ring-common-bborder-common-blue-color outline-none"
            >
            <input 
              #otpInput
              type="text" 
              maxlength="1"
              [value]="otp[3]"
              (input)="onDigitInput(3, $event)"
              (keydown)="onKeyDown(3, $event)"
              class="w-12 h-12 text-main-text-color font-inter border border-input-border-color rounded-md text-center text-xl font-medium focus:border-common-blue-color focus:ring-1 focus:ring-common-bborder-common-blue-color outline-none"
            >
          </div>
          <div class="mt-2">
            @if(isInvalid()){
              <div class="text-common-red-color text-sm font-inter font-normal">
                Please enter valid OTP
              </div>
            }
          </div>
        </div>
        <span class="font-inter font-normal text-xs text-secondary-text-color text-center"
          >Please enter the 4-digit OTP code sent to <br>your email address or phone number.</span
        >
      </div>
      <div>
        <app-common-button-v35
          [type]="{ style: 'filled', name: 'main' }"
          text="Verify OTP"
          width="100%"
          (clickEvent)="onSubmit()"
          [loading]="isLogin()"
          [disabled]="isLogin()"
        />
      </div>
    </div>
  </div>
</div>
