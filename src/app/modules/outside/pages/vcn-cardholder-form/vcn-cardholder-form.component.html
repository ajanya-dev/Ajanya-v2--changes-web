<div
  class="bg-main-background-color w-full bg-[url(/assets/images/register-bg.svg)] max-sm:bg-none min-h-screen"
>
  <div class="flex w-full h-full items-center flex-col">
    <div class="w-32 py-14 max-sm:w-24 max-sm:!pb-0">
      <img
        role="presentation"
        [alt]="authV3Service.appConfig?.websiteTitle"
        (click)="authV3Service.onGoToWebsite()"
        [ngSrc]="logoPath"
        [title]="authV3Service.appConfig?.websiteTitle"
        width="130"
        height="85"
        priority
      />
    </div>

    <div
      class="shadow-common-box-shadow rounded flex flex-col gap-5 w-2/5 min-w-80 py-5 px-7 bg-main-background-color max-sm:shadow-none max-sm:px-0 max-xl:w-1/2"
      [ngClass]="{ skelton: isLoading() }"
    >
      @if (!isLoading() && isLinkExpired()) {
        <div class="h-96 flex justify-center items-center flex-col">
          <img
            ngSrc="assets/images/link-expired.svg"
            alt="Link Expired"
            width="85"
            height="85"
          />
          <span class="font-inter font-medium text-main-text-color text-base"
            >Link Expired</span
          >
        </div>
      } @else if (payeeAdded()) {
        <div class="flex flex-col justify-center items-center h-96">
          <svg
            class="checkmark"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 52 52"
          >
            <circle
              class="checkmark__circle"
              cx="26"
              cy="26"
              r="25"
              fill="none"
            />
            <path
              class="checkmark__check"
              fill="none"
              d="M14.1 27.2l7.1 7.2 16.7-16.8"
            />
          </svg>
          <p class="font-inter font-medium text-main-text-color text-xl mt-4">
            Thank you for completing the process.
          </p>
          <div class="text-center mt-1">
            <p
              class="font-inter font-medium text-main-text-color text-base text-gray-600"
            >
              We've sent your card login credentials to your email address.
            </p>
            <p
              class="font-inter font-medium text-main-text-color text-base text-gray-600"
            >
              Please follow the provided link to log in and activate your gift
              card.
            </p>
          </div>
        </div>
      } @else {
        <div class="p-4 flex flex-col gap-4" [formGroup]="payeeForm">
          <div class="flex flex-col gap-4">
            <h1
              class="font-inter font-medium text-main-text-color text-2xl text-center"
            >
              Enter Details
            </h1>
            <div class="grid grid-cols-2 gap-4 max-lg:grid-cols-1">
              <div>
                <app-common-input-field
                  placeholder="First Name"
                  formControlName="firstName"
                />
                <app-control-message-v35
                  [control]="payeeForm.controls.firstName"
                />
              </div>
              <div>
                <app-common-input-field
                  placeholder="Last Name"
                  formControlName="lastName"
                />
                <app-control-message-v35
                  [control]="payeeForm.controls.lastName"
                />
              </div>

              <div class="single_input w-full" (focusout)="onPhoneBlur()">
                <app-new-phone-input
                  formControlName="phone"
                  [isRequiredField]="true"
                />
                <app-control-message-v35 [control]="payeeForm.controls.phone" />
              </div>

              <div>
                <app-common-input-field
                  placeholder="Email"
                  formControlName="email"
                />
                <app-control-message-v35 [control]="payeeForm.controls.email" />
              </div>
              <div>
                <app-common-input-field
                  placeholder="Address Line 1"
                  formControlName="address_line1"
                  (inputFocusEvent)="loadGoogleAddress($event)"
                />
                <app-control-message-v35
                  [control]="payeeForm.controls.address_line1"
                />
              </div>
              <div>
                <app-common-input-field
                  placeholder="Address Line 2"
                  [isFieldRequired]="false"
                  formControlName="address_line2"
                />
                <app-control-message-v35
                  [control]="payeeForm.controls.address_line2"
                />
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <app-common-input-field
                    placeholder="City"
                    formControlName="city"
                  />
                  <app-control-message-v35
                    [control]="payeeForm.controls.city"
                  />
                </div>
                <div>
                  <app-common-input-field
                    placeholder="State"
                    formControlName="state"
                  />
                  <app-control-message-v35
                    [control]="payeeForm.controls.state"
                  />
                </div>
                <!-- } -->
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <app-common-input-field
                    placeholder="Country"
                    formControlName="country"
                  />
                  <app-control-message-v35
                    [control]="payeeForm.controls.country"
                  />
                </div>
                <div>
                  <app-common-input-field
                    placeholder="Zip"
                    formControlName="zip"
                  />
                  <app-control-message-v35 [control]="payeeForm.controls.zip" />
                </div>
              </div>
            </div>
          </div>
          <div class="flex justify-end items-center">
            <app-common-button-v35
              [type]="{ style: 'filled', name: 'main' }"
              [text]="'Save'"
              width="120px"
              (clickEvent)="onSubmit()"
              [disabled]="isSubmit()"
              [loading]="isSubmit()"
            />
          </div>
        </div>
      }
    </div>
  </div>
</div>
