<div class="flex flex-col font-peridot">
  <!-- Header -->
  <div
    class="flex items-center justify-between px-6 py-4 border-b border-v4-border-color"
  >
    <div class="flex items-center gap-3">
      <div
        class="w-10 h-10 rounded-xl flex items-center justify-center bg-v4-primary-brand-color"
      >
        <lucide-icon name="undo-2" [size]="20" class="text-v4-neon-color" />
      </div>
      <div>
        <h2 class="text-lg font-semibold text-v4-main-text-color">
          Reopen Company
        </h2>
        <p class="text-xs text-v4-tertiary-text-color">
          Cancel the scheduled deletion
        </p>
      </div>
    </div>
    <button
      class="p-2 rounded-xl hover:bg-v4-background-color transition-colors"
      (click)="close()"
    >
      <lucide-icon name="x" [size]="20" class="text-v4-tertiary-text-color" />
    </button>
  </div>

  <!-- Body -->
  <div class="px-6 py-5 space-y-4">
    <p class="text-sm text-v4-secondary-text-color">
      Please enter your password to proceed.
    </p>
    <div class="relative">
      <app-common-input-v4
        [placeholder]="'Password'"
        [type]="showPassword() ? 'text' : 'password'"
        [control]="passwordForm.controls.password"
        [formControl]="passwordForm.controls.password"
      />
      <button
        type="button"
        class="absolute right-3 top-1/2 -translate-y-1/2 text-v4-tertiary-text-color hover:text-v4-secondary-text-color"
        (click)="showPassword.set(!showPassword())"
      >
        <lucide-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="16" />
      </button>
    </div>
  </div>

  <!-- Footer -->
  <div class="px-6 pb-6 pt-2 border-t border-v4-border-color">
    <div class="flex gap-3">
      <app-common-button-v4
        class="flex-1"
        [type]="{ style: 'outline', name: 'main' }"
        text="Cancel"
        [width]="'100%'"
        (clickEvent)="close()"
      />
      <app-common-button-v4
        class="flex-1"
        [type]="{ style: 'primary', name: 'main' }"
        text="Reopen Company"
        [loading]="loading()"
        [width]="'100%'"
        (clickEvent)="reopenCompany()"
      />
    </div>
  </div>
</div>
