<div class="flex flex-col font-peridot">
  <div
    class="flex items-center justify-between px-6 py-4 border-b border-v4-border-color"
  >
    <h2 class="text-lg font-semibold text-v4-main-text-color">{{ title }}</h2>
    <button
      class="p-2 rounded-lg hover:bg-v4-background-color transition-colors"
      (click)="close()"
    >
      <lucide-icon name="x" [size]="20" class="text-v4-tertiary-text-color" />
    </button>
  </div>

  <div class="px-6 py-5">
    <p class="text-sm text-v4-secondary-text-color leading-relaxed">
      {{ message }}
    </p>
  </div>

  <div class="px-6 pb-6 pt-2 border-t border-v4-border-color">
    <div class="flex gap-3">
      <app-common-button-v4
        class="flex-1"
        [type]="{ style: 'outline', name: 'main' }"
        text="Cancel"
        [width]="'100%'"
        (clickEvent)="close()"
      />
      <app-common-button-v4
        class="flex-1"
        [type]="{ style: 'primary', name: 'main' }"
        text="OK"
        [width]="'100%'"
        (clickEvent)="confirm()"
      />
    </div>
  </div>
</div>
