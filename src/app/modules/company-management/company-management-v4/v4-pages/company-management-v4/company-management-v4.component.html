<div class="flex flex-col gap-6 font-peridot pb-4">
  <!-- Header -->
  <app-cm-header-v4
    (requestAccess)="openRequestAccess()"
    (addCompany)="openAddCompany()"
  />

  <!-- Search + Tabs -->
  <div
    class="rounded-xl border border-v4-border-color bg-v4-secondary-background-color p-4"
  >
    <div
      class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4"
    >
      <!-- Search -->
      <div class="relative flex-1 w-full md:w-auto">
        <lucide-icon
          name="search"
          [size]="18"
          class="absolute left-4 top-1/2 -translate-y-1/2 text-v4-tertiary-text-color pointer-events-none"
        />
        <input
          type="text"
          placeholder="Search companies..."
          autocomplete="off"
          [ngModel]="searchQuery()"
          (ngModelChange)="onSearchChange($event)"
          class="w-full pl-14 pr-3 py-2 bg-v4-background-color border border-v4-border-color rounded-lg focus:outline-none focus:ring-2 focus:ring-v4-primary-brand-color text-sm text-v4-main-text-color font-peridot"
        />
      </div>

      <!-- Tabs -->
      <app-common-tab-v4
        [tabs]="tabs"
        [(activeTab)]="activeTab"
        [variant]="'pill'"
        [height]="'32px'"
        (tabChange)="onTabChange($event)"
      />
    </div>
  </div>

  <!-- Summary Cards -->
  <app-cm-summary-cards-v4
    [totalCount]="totalCount()"
    [ownedCount]="ownCompanies().length"
    [activeCompanyName]="activeCompanyName()"
    [loading]="loading()"
  />

  <!-- Company Table / Cards -->
  <app-cm-company-table-v4
    [companies]="filteredCompanies()"
    [loading]="loading()"
    [searchQuery]="searchQuery()"
    [editingCompanyId]="editingCompanyId()"
    (edit)="openEditCompany($event)"
    (delete)="openDeleteCompany($event)"
    (switchTo)="switchCompany($event)"
    (acceptInvite)="acceptInvite($event)"
    (rejectInvite)="rejectInvite($event)"
    (removeAccess)="removeAccess($event)"
    (resendRequest)="resendRequest($event)"
    (onboardingLink)="openOnboardingLink($event)"
  />
</div>
