<div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
  @if (loading()) {
    @for (i of [1, 2, 3]; track i) {
      <div
        class="flex items-center justify-between rounded-xl border border-v4-border-color bg-v4-secondary-background-color p-3 md:p-4 animate-pulse"
      >
        <div>
          <div
            class="h-3 w-24 rounded bg-v4-tertiary-background-color mb-2"
          ></div>
          <div class="h-7 w-16 rounded bg-v4-tertiary-background-color"></div>
        </div>
        <div class="w-10 h-10 rounded-xl bg-v4-tertiary-background-color"></div>
      </div>
    }
  } @else {
    @for (card of cards; track card.title) {
      <div
        class="flex items-center justify-between rounded-xl border border-v4-border-color bg-v4-secondary-background-color p-3 md:p-4 min-w-0"
      >
        <div class="min-w-0 flex-1 mr-3">
          <p
            class="text-[12px] md:text-xs font-semibold uppercase text-v4-tertiary-text-color whitespace-nowrap"
          >
            {{ card.title }}
          </p>
          <p
            class="font-bold mt-1 truncate"
            [ngClass]="[
              card.valueColor,
              card.valueSizeClass || 'text-xl md:text-2xl'
            ]"
          >
            {{ card.value }}
          </p>
        </div>
        <div
          class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0"
          [ngClass]="card.iconBg || ''"
          [style.background-color]="card.iconBgStyle || null"
        >
          <lucide-icon
            [name]="card.icon"
            [size]="20"
            [ngClass]="card.iconColor || ''"
            [style.color]="card.iconColorStyle || null"
          />
        </div>
      </div>
    }
  }
</div>
