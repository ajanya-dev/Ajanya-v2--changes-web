<div class="flex flex-col max-h-[85vh]">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color flex-shrink-0"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        FreshBooks Settings
      </h1>
      <h2 class="text-xs text-v4-subtle-text-color">
        Manage auto downloading, pushback, and data imports.
      </h2>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
      (click)="close()"
    >
      <lucide-icon name="x" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div
    class="flex-1 overflow-y-auto p-6 space-y-5 bg-v4-tertiary-background-color"
  >
    <!-- Auto Downloading -->
    <div
      class="border border-v4-input-border-color rounded-xl py-3.5 px-4 bg-v4-secondary-background-color"
    >
      <div class="flex items-center gap-2">
        <mat-checkbox
          [formControl]="autoDownloading"
          class="v4-freshbooks-checkbox"
          (change)="onAutoDownloadingChange()"
        >
          <span class="text-sm text-v4-main-text-color">Auto Downloading</span>
        </mat-checkbox>
      </div>
    </div>

    <!-- Enable Pushback (only if export enabled) -->
    @if (isFreshbooksExport()) {
      <div
        class="border border-v4-input-border-color rounded-xl py-3.5 px-4 bg-v4-secondary-background-color"
      >
        <div class="flex items-center gap-2">
          <mat-checkbox
            [formControl]="pushbackEnable"
            class="v4-freshbooks-checkbox"
            (change)="onPushbackChange()"
          >
            <span class="text-sm text-v4-main-text-color">Enable Pushback</span>
          </mat-checkbox>
        </div>
      </div>

      <!-- Import Data from FreshBooks -->
      <div
        class="border border-v4-input-border-color rounded-xl p-4 bg-v4-secondary-background-color"
      >
        <div class="mb-3">
          <div class="flex items-center gap-2 mb-1">
            <lucide-icon
              name="download-cloud"
              [size]="18"
              class="text-v4-primary-brand-color flex-shrink-0"
            ></lucide-icon>
            <span class="text-sm font-semibold text-v4-main-text-color"
              >Import Data from FreshBooks</span
            >
          </div>
          <span class="text-xs text-v4-tertiary-text-color">
            Click on any item below to sync from your FreshBooks account
          </span>
        </div>

        <div
          class="flex flex-wrap gap-2"
          [ngClass]="
            !isConnected()
              ? 'opacity-40 pointer-events-none'
              : '!opacity-100 pointer-events-auto'
          "
        >
          <app-common-button-v4
            [type]="{ style: 'primary', name: 'main' }"
            [text]="'Payee'"
            [textColorInput]="'white'"
            [isAddIcon]="true"
            [icon]="['fas', 'down-to-line']"
            [loading]="loading().payeeLoading"
            [disabled]="
              loading().payeeLoading || (!pushbackEnable.value && isConnected())
            "
            [ngClass]="{
              'opacity-40 pointer-events-none':
                !pushbackEnable.value && isConnected()
            }"
            (clickEvent)="openCompanyListModal('Payee')"
          />

          <app-common-button-v4
            [type]="{ style: 'primary', name: 'main' }"
            text="Category"
            [textColorInput]="'white'"
            [isAddIcon]="true"
            [icon]="['fas', 'down-to-line']"
            [loading]="loading().categoryLoading"
            [disabled]="
              loading().categoryLoading ||
              (!pushbackEnable.value && isConnected())
            "
            [ngClass]="{
              'opacity-40 pointer-events-none':
                !pushbackEnable.value && isConnected()
            }"
            (clickEvent)="openCompanyListModal('Category')"
          />
        </div>
      </div>
    }
  </div>
  <!-- modal body end -->

  <!-- modal footer -->
  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color flex-shrink-0"
  >
    <app-common-button-v4
      mat-dialog-close=""
      [width]="'120px'"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
      (clickEvent)="close()"
    />
    <app-common-button-v4
      [width]="'120px'"
      [type]="{ style: 'primary', name: 'main' }"
      text="Update"
      (clickEvent)="saveSettings()"
      [disabled]="loading().defaultLoading"
      [loading]="loading().defaultLoading"
    />
  </div>
</div>
