<div class="space-y-6 font-peridot">
  @if (loading().dataLoading) {
    <div class="flex justify-center py-12">
      <lucide-icon
        name="loader-circle"
        [size]="24"
        class="text-v4-primary-brand-color animate-spin"
      ></lucide-icon>
    </div>
  }

  @if (!loading().dataLoading) {
    @if (isConnected()) {

      <!-- Status banner -->
      <div
        class="flex items-center gap-3 p-4 rounded-xl border border-v4-badge-success-text-color bg-v4-badge-success-bg-color"
      >
        <lucide-icon
          name="circle-check"
          [size]="24"
          class="flex-shrink-0 text-v4-badge-success-text-color"
        ></lucide-icon>
        <div>
          <p class="font-semibold text-v4-badge-success-text-color">Connected</p>
          <p class="text-xs text-v4-badge-success-text-color opacity-80 mt-0.5">
            Your Square account is linked.
          </p>
        </div>
      </div>

      <!-- Heading -->
      <div>
        <h3 class="text-lg font-bold text-v4-main-text-color font-funnel">Connection Settings</h3>
        <p class="text-sm text-v4-tertiary-text-color mt-1">
          Manage your Square account integration.
        </p>
      </div>

      <!-- Import buttons -->
      <div class="grid grid-cols-1 gap-2">
        <app-common-button-v4
          [type]="{ style: 'primary', name: 'main' }"
          text="Import Customers"
          [width]="'100%'"
          [loading]="isImportLoading().customer"
          [disabled]="isImportLoading().customer || isImportLoading().vendor || isImportLoading().employee"
          (clickEvent)="import(2)"
        />
        <app-common-button-v4
          [type]="{ style: 'primary', name: 'main' }"
          text="Import Vendors"
          [width]="'100%'"
          [loading]="isImportLoading().vendor"
          [disabled]="isImportLoading().customer || isImportLoading().vendor || isImportLoading().employee"
          (clickEvent)="import(3)"
        />
        <app-common-button-v4
          [type]="{ style: 'primary', name: 'main' }"
          text="Import Employees"
          [width]="'100%'"
          [loading]="isImportLoading().employee"
          [disabled]="isImportLoading().customer || isImportLoading().vendor || isImportLoading().employee"
          (clickEvent)="import(4)"
        />
      </div>

      <!-- Disconnect button -->
      <div class="grid grid-cols-2 gap-2">
        <app-common-button-v4
          [type]="{ style: 'destructive', name: 'main' }"
          text="Disconnect"
          [width]="'100%'"
          [loading]="loading().disconnecting"
          [disabled]="loading().disconnecting"
          (clickEvent)="onDisconnect()"
        />
      </div>

    } @else {

      <!-- Disconnected state -->
      <div
        class="flex items-center gap-3 p-4 rounded-xl bg-v4-badge-error-bg-color"
      >
        <lucide-icon
          name="x-circle"
          [size]="20"
          [color]="'var(--v4-badge-error-text-color)'"
        ></lucide-icon>
        <span class="text-sm font-semibold text-v4-badge-error-text-color">
          Status: <span class="font-bold">Disconnected</span>
        </span>
      </div>
      <p class="text-sm text-v4-tertiary-text-color">
        Connect to Square from the Overview tab to start syncing your data.
      </p>

    }
  }
</div>
