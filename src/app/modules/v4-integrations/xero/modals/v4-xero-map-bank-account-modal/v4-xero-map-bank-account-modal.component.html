<div class="flex flex-col max-h-[80vh]">
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color flex-shrink-0"
  >
    <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
      {{ editmode ? "Update Bank Account Mapping" : "Map Bank Account" }}
    </h1>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon name="x" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <div
    class="flex-1 overflow-y-auto p-6 space-y-4 bg-v4-tertiary-background-color"
    [formGroup]="mapForm"
  >
    <div
      class="p-3 rounded-xl bg-v4-secondary-background-color border border-v4-border-color"
    >
      <div class="flex items-start gap-2">
        <lucide-icon
          name="info"
          [size]="14"
          class="mt-0.5 flex-shrink-0"
          style="color: var(--v4-primary-brand-bold-color)"
        ></lucide-icon>
        <p class="text-xs text-v4-main-text-color">
          You are mapping the Xero bank account
          <span class="font-bold">{{ data.bank.thirdPartyName }}</span> from
          Xero company <span class="font-bold">{{ data.bank.company }}</span> to
          an OCW bank account.
        </p>
      </div>
    </div>

    <div>
      <label
        class="text-xs font-bold tracking-wider text-v4-secondary-text-color uppercase mb-2 block"
      >
        Select a bank account to map
      </label>
      <app-bank-ac-dropdown-v4
        [append]="'body'"
        [labelIconNeeded]="false"
        (changeEvent)="bankDropDownChange($event)"
      ></app-bank-ac-dropdown-v4>
      <app-control-message-v4 [control]="mapForm.controls.bankAccount" />
    </div>
  </div>

  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color flex-shrink-0"
  >
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      [text]="editmode ? 'Update' : 'Map Now'"
      [disabled]="loading"
      [loading]="loading"
      (clickEvent)="submit()"
    />
  </div>
</div>
