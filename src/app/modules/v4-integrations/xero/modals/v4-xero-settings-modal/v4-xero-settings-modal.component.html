<div class="flex flex-col max-h-[80vh] min-w-[380px]">
  <div
    class="flex justify-between items-center px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color flex-shrink-0"
  >
    <h1
      class="text-xl font-semibold text-v4-main-text-color font-funnel flex items-center gap-2"
    >
      <lucide-icon
        name="settings"
        [size]="20"
        class="text-v4-primary-brand-bold-color"
      />
      Xero Settings
    </h1>
    <div
      (click)="close()"
      (keydown.enter)="close()"
      role="button"
      tabindex="0"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center shrink-0"
    >
      <lucide-icon name="x" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <div
    class="flex-1 overflow-y-auto p-6 bg-v4-tertiary-background-color"
    [formGroup]="form"
  >
    @if (loading().fetching) {
      <div class="flex justify-center py-8">
        <lucide-icon
          name="loader-circle"
          [size]="24"
          class="text-v4-primary-brand-color animate-spin"
        />
      </div>
    } @else {
      <div
        class="p-4 rounded-xl bg-v4-secondary-background-color border border-v4-border-color flex items-center justify-between gap-4"
      >
        <div>
          <p class="text-sm font-semibold text-v4-main-text-color">
            Auto Downloading
          </p>
          <p class="text-xs text-v4-tertiary-text-color mt-1">
            Automatically download new transactions from Xero.
          </p>
        </div>
        <label class="relative inline-block w-11 h-6 shrink-0 cursor-pointer">
          <input
            type="checkbox"
            class="peer opacity-0 w-0 h-0"
            formControlName="autoDownloading"
          />
          <span
            class="absolute inset-0 rounded-full bg-v4-border-color transition-colors duration-300 peer-checked:bg-v4-primary-brand-color before:content-[''] before:absolute before:h-[18px] before:w-[18px] before:left-[3px] before:bottom-[3px] before:bg-white before:rounded-full before:shadow before:transition-transform before:duration-300 peer-checked:before:translate-x-5"
          ></span>
        </label>
      </div>
    }
  </div>

  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color flex-shrink-0"
  >
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
      (clickEvent)="close()"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Save"
      [disabled]="loading().saving || loading().fetching"
      [loading]="loading().saving"
      (clickEvent)="save()"
    />
  </div>
</div>
