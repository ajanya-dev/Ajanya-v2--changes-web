<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-popup-header-footer-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Connect your Shopify store
      </h1>
      <h2 class="text-xs text-v4-secondary-text-color">
        Enter the store domain you want to authorize
      </h2>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <div class="pb-4 flex justify-center">
      <img
        ngSrc="/assets/images/integration/shopify.svg"
        alt="Shopify"
        width="150"
        height="75"
      />
    </div>

    <div
      class="border border-v4-input-border-color rounded-xl overflow-hidden bg-v4-secondary-background-color"
    >
      <div class="border-b border-v4-input-border-color px-4 py-3">
        <span class="text-v4-tertiary-text-color font-medium text-xs">
          Where do I find my store domain?
        </span>
      </div>
      <div class="overflow-y-auto px-4 py-3 max-h-40">
        <div class="text-v4-main-text-color text-sm space-y-3">
          <div class="flex items-start gap-3">
            <span
              class="flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-xs font-semibold bg-v4-badge-error-bg-color text-v4-badge-error-text-color"
              >1</span
            >
            <span>Log into your Shopify admin.</span>
          </div>
          <div class="flex items-start gap-3">
            <span
              class="flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-xs font-semibold bg-v4-badge-error-bg-color text-v4-badge-error-text-color"
              >2</span
            >
            <span>
              Copy the domain shown in your browser, for example
              <b>mystore.myshopify.com</b>.
            </span>
          </div>
          <div class="flex items-start gap-3 ml-9">
            <span
              class="flex-shrink-0 w-1.5 h-1.5 rounded-full mt-1.5 bg-v4-main-text-color"
              aria-hidden="true"
            ></span>
            <span>
              Just the store name works too &mdash; we add
              ".myshopify.com" for you.
            </span>
          </div>
        </div>
      </div>
    </div>

    <form [formGroup]="shopForm" class="flex flex-col gap-4 mt-4">
      <app-common-input-v4
        placeholder="e.g. mystore.myshopify.com"
        formControlName="shop"
        [control]="shopForm.controls.shop"
        errorLabel="Store domain"
      />
    </form>
  </div>
  <!-- modal body end -->

  <div
    class="flex justify-end gap-3 p-6 bg-v4-popup-header-footer-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Connect"
      (clickEvent)="onSubmit()"
      [disabled]="isLoading"
      [loading]="isLoading"
    />
  </div>
</div>
