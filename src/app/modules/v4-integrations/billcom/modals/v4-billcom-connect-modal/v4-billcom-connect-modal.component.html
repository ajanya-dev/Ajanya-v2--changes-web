<div class="flex flex-col max-h-[85vh]">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color flex-shrink-0"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Connect Bill.com
      </h1>
      <h2 class="text-xs text-v4-subtle-text-color">
        Authenticate with your Bill.com credentials
      </h2>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body -->
  <div
    class="flex-1 min-h-0 overflow-y-auto flex flex-col p-6 bg-v4-tertiary-background-color"
  >
    <div class="pb-4 flex justify-center flex-shrink-0">
      <img
        ngSrc="../../../../assets/images/integration/bill-dot-com.png"
        alt="Bill.com"
        width="120"
        height="60"
        style="max-height: 60px; width: auto"
      />
    </div>

    <form [formGroup]="billcomForm" class="flex flex-col gap-4 flex-shrink-0">
      <app-common-input-v4
        placeholder="User Name"
        formControlName="userName"
        autocomplete="username"
        [control]="billcomForm.controls['userName']"
        errorLabel="User Name"
      />
      <app-common-input-v4
        placeholder="Password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [control]="billcomForm.controls['password']"
        errorLabel="Password"
      />
    </form>
  </div>

  <!-- modal footer -->
  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color flex-shrink-0"
  >
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Connect"
      (clickEvent)="onSubmit()"
      [disabled]="isLoading"
      [loading]="isLoading"
    />
  </div>
</div>
