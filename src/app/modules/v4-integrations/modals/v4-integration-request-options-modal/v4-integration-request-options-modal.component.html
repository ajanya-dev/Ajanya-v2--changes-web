<div class="max-h-[90vh] overflow-hidden flex flex-col">
  <!-- modal header -->
  <div
    class="flex items-center justify-between px-6 py-4 bg-v4-popup-header-footer-color border-b border-v4-border-color flex-shrink-0"
  >
    <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
      How can we help?
    </h1>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center flex-shrink-0"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="overflow-y-auto p-6 bg-v4-tertiary-background-color">
    <div class="grid grid-cols-2 gap-2.5">
      @for (option of requestOptions; track option.id) {
        <button
          type="button"
          class="option-card p-3 border-2 border-v4-border-color rounded-xl text-left bg-v4-popup-header-footer-color transition-all hover:-translate-y-0.5 hover:shadow-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-v4-primary-brand-bold-color"
          (click)="selectOption(option)"
        >
          <div class="flex items-center gap-2 mb-2">
            <div
              class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 bg-v4-input-background-color"
              [style]="option.accent"
            >
              <lucide-icon [img]="option.icon" [size]="16"></lucide-icon>
            </div>
          </div>

          <p class="text-sm font-semibold text-v4-main-text-color">
            {{ option.title }}
          </p>

          <p
            class="text-xs text-v4-secondary-text-color mt-0.5 leading-relaxed"
          >
            {{ option.description }}
          </p>
        </button>
      }
    </div>
  </div>
  <!-- modal body end -->
</div>
