<div class="px-[6px] pb-[6px]">
  <!-- modal header -->
  <div class="flex justify-between pb-6">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
        <!-- back button ends -->
        <span class="pl-1 font-inter font-semibold text-base pb-0.5">
          Business List
        </span>
      </span>
    </div>
    <div>
      <fa-icon
        (click)="close()"
        role="presentation"
        class="text-secondary-text-color cursor-pointer"
        [icon]="['fas', 'xmark']"
      ></fa-icon>
    </div>
  </div>
  <!-- modal body start -->
  <div>
    <div
      class="angular-ocw-v35-ng-select-dropdown angular-ocw-v35-multi-select-dropdown"
    >
      <div class="text-center h-[70px]">
        <fa-icon
          [icon]="faBriefcase"
          class="border shadow-[0_0_10px] border-[color:var(--common-blue-color)] text-[color:var(--common-blue-color)] px-2.5 py-[7px] rounded-[50%] border-solid;"
        ></fa-icon
        ><br />
        <div class="text-[color:var(--common-blue-color)] font-medium pt-5">
          Select your business to apply for the ACH application
        </div>
      </div>
      <ng-select
        style="width: 200px"
        dropdownPosition="{{ dropdownPosition }}"
        placeholder="{{ placeholder }}"
        [(ngModel)]="selectedItem"
        (change)="getChange($event)"
        [items]="businessData"
        class="ng-dropdown-panel-v35 text-sm height-5"
      >
        <ng-template ng-option-tmp let-item="item" let-index="index">
          <div class="flex-1 main-text-highlight font-medium overflow-hidden">
            <div class="main-text-highlight text-ellipsis truncate text-sm">
              {{ item.businessName }}
            </div>
          </div>
        </ng-template>
      </ng-select>
      @if ((!selectedItem || selectedItem === "") && isSelected) {
        <label for="" class="text-xs text-common-red-color">
          Please select a business for apply ACH</label
        >
      }
    </div>
  </div>
  <!-- modal body end -->
  <div class="flex justify-end gap-3 pt-8">
    <app-common-button-v35
      [type]="{ style: 'bordered', name: 'main' }"
      text="Cancel"
      (clickEvent)="close()"
    ></app-common-button-v35>
    <app-common-button-v35
      [type]="{ style: 'modal', name: 'main' }"
      [loading]="loading"
      (clickEvent)="clickEvent()"
      text="Apply For ACH"
    ></app-common-button-v35>
  </div>
</div>
