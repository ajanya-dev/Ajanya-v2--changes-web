<div
  class="business-table-wrapper border border-input-border-color p-5 mt-5 rounded-xl"
>
  <div class="heading-wrapper flex justify-between">
    <div class="left-section-wrapper flex gap-2">
      <div class="icon-container">
        <fa-icon [icon]="faCreditCard" class="text-common-blue-color"></fa-icon>
      </div>
      <div class="heading-content font-semibold">
        Cards
        @if(cards.length>0){
          <span class="text-secondary-text-color text-sm ml-2"
            >{{ cards.length }} items</span
          >
        }
      </div>
    </div>
    <div
      (click)="addNewCard()"
      role="presentation"
      class=" rounded-full cursor-pointer mt-[-3px] ml-2.5 mb-[3px] px-2 py-px border border-input-border-color text-common-blue-color"
    >
      +
    </div>
  </div>

  <div class="relative flex flex-col w-full">
    <div
      class="flex font-medium text-start items-center px-5 text-[14px] justify-between h-[50px] bg-secondary-background-color mt-3 rounded-lg mb-2"
    >
      <div class="w-1/3">
        <span
          matTooltip="When adding a card, you have the option to assign a nickname. This nickname will be displayed as the 'Card Name' for easy identification."
        >
          Card Name
        </span>
      </div>
      <div class="w-1/3">Card Number</div>
      <div class="w-1/3">Status</div>
    </div>
    <!-- datas -->

    @if (isLoadingContent) {
      <div class="absolute left-[50%] top-[50%] loader"></div>
    }

    @for (item of cardsPaginated; track $index) {
      <div
        class="text-sm flex text-start items-center px-5 py-4 justify-between border-solid"
        [ngClass]="{
          'border-b-[#e1e1e1] border-b': $index < cardsPaginated.length - 1,
          'blur-[2px]': isLoadingContent
        }"
      >
        <div class="w-1/3">
          <span
            class="font-medium p-2 bg-common-secondary-yellow-color rounded-full text-center"
            ><fa-icon
              class="text-common-yellow-color"
              [icon]="faCreditCard"
            ></fa-icon
          ></span>
          <span class="font-medium ml-2">{{ item.nickName }}</span
          ><br />
        </div>

        <div class="card-number w-1/3">
          <span class="font-medium text-xs text-main-text-color opacity-70">{{
            formatedCardNumber(item.card)
          }}</span>
        </div>

        <div class="w-1/3">
          <span
            class="text-sm !text-[12px] font-semibold py-[4px] rounded-[3px] text-common-green-color"
          >
            <fa-icon [icon]="faCheck" />
            Activated
          </span>
        </div>
      </div>
    } @empty {
      <div
        class="w-full flex justify-center text-sm font-medium text-center items-center h-[100px]"
        [ngClass]="{ 'blur-[2px]': isLoadingContent }"
      >
      No cards linked.
      </div>
    }

    @if (cards.length >= perPage) {
      <app-common-table-pagination
        [rowCount]="cardsPaginated.length"
        [page]="page"
        [pageLimit]="perPage"
        (clcikedItem)="onClickEvent($event)"
        (viewAllEvent)="viewAll()"
      ></app-common-table-pagination>
    }
  </div>
</div>
