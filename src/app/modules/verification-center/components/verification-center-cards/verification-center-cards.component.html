<div class="mt-10">
    <div class="flex w-fit">
        <h4 class="font-semibold">Cards
        </h4>
        <div (click)="addNewCard()" role="presentation"
            class="border cursor-pointer rounded mt-[-3px] ml-2.5 mb-[3px] px-2 py-px border-solid border-[#e1e1e1] text-common-blue-color">
            +
        </div>
    </div>
    <div class="relative flex flex-col w-full border rounded-md border-input-border-color">
        <div
            class="flex font-semibold text-start items-center px-5 text-[14px] justify-between  h-[50px] bg-[var(--button-backgorund-color)]">
            <div class="w-1/2" >
                <span matTooltip="When adding a card, you have the option to assign a nickname. This nickname will be displayed as the 'Card Name' for easy identification.">
                    Custom Card Name
                </span></div>
            <div class="w-1/2">Digital Payment</div>
        </div>
        <!-- datas -->

        @if(isLoadingContent){
        <div class="absolute left-[50%] top-[50%] loader"></div>    
        }
        
        @for (item of cardsPaginated; track $index) {
        <div class="text-sm flex text-start items-center px-5 py-2 justify-between  border-solid"
            [ngClass]="{'border-b-[#e1e1e1] border-b': $index < cardsPaginated.length - 1, 'blur-[2px]': isLoadingContent}">
            <div class="w-1/2 ">
                <span class="font-medium p-2 !pl-0"><fa-icon class="text-common-yellow-color"
                        [icon]="faCreditCard"></fa-icon></span>
                <span class="font-medium">{{item.nickName}}</span><br>
                <span class="font-medium text-xs text-main-text-color opacity-70">{{formatedCardNumber(item.card)}}</span>
            </div>

            <div class="w-1/2">
                <span
                    class="text-sm bg-common-secondary-green-color !text-[12px] font-semibold px-2.5 py-[4px] rounded-[3px] text-common-green-color">
                    <fa-icon [icon]="faCheck" />
                    Activated
                </span>
            </div>
        </div>
        }
        @empty {
            <div class="w-full flex justify-center text-sm font-medium text-center items-center h-[100px]" [ngClass]="{'blur-[2px]': isLoadingContent}" >No Cards Found!
            </div>
        }
        
        @if(cards.length >= perPage){
            <app-common-table-pagination [rowCount]="cardsPaginated.length" [page]="page" [pageLimit]="perPage" (clcikedItem)="onClickEvent($event)" (viewAllEvent)="viewAll()"></app-common-table-pagination>
        }


    </div>
</div>
