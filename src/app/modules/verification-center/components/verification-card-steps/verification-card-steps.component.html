@if (selectedLevel === "check") {
  <app-level-one-verification
    [verificationStatus]="verificationStatus"
    cardType="check"
  ></app-level-one-verification>
}
@if (selectedLevel === "card") {
  <app-level-two-verification
    [verificationStatus]="verificationStatus"
    cardType="payByCreditCard"
  ></app-level-two-verification>
}
@if (selectedLevel === "payment") {
  <app-level-three-verification
    [verificationStatus]="verificationStatus"
    cardType="digitalPayment"
  ></app-level-three-verification>
}
