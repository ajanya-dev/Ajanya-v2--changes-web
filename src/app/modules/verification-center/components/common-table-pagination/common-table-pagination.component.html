<div class="flex justify-between p-3 border-t-2 border-t-[var(--common-secondary-blue-color)] border-dashed">

    <div>
        @if(!hideViewAll){
            <a class="text-sm rounded cursor-pointer underline text-common-blue-color px-2 py-[3px]" (click)="viewAll()" role="presentation">View All</a>
        }
    </div>
    <div class="flex gap-2 items-center">
        <div class="cursor-pointer" [ngClass]="{'!cursor-no-drop' : page === 1 }">
            <a matTooltip="Previous" (click)="onSelect('prev')" role="presentation" [ngClass]="{'!pointer-events-none' : page === 1 }" class="text-sm shadow-[0px_0px_3px_var(--common-blue-color)] rounded  px-2 py-[3px]"><fa-icon [icon]="faAngleLeft" /></a>
        </div>
        <div>
            @if (totalPages > 0) {
                <span class="text-sm font-medium px-2 py-[3px]">Page {{page}} of {{totalPages}}</span>
            } @else {
                <a matTooltip="Page No" class="text-sm font-medium shadow-[0px_0px_3px_var(--common-blue-color)] rounded  px-2 py-[3px]">{{page}}</a>
            }
        </div>
        <div class="cursor-pointer" [ngClass]="{'!cursor-no-drop' : (totalPages > 0 && page >= totalPages) || (totalPages === 0 && page > 1 && (rowCount === 0 || rowCount < pageLimit))}">
            <a matTooltip="Next" (click)="onSelect('next')" role="presentation" [ngClass]="{'!pointer-events-none' : (totalPages > 0 && page >= totalPages) || (totalPages === 0 && page > 1 && (rowCount === 0 || rowCount < pageLimit))}" class="text-sm shadow-[0px_0px_3px_var(--common-blue-color)] rounded px-2 py-[3px]"><fa-icon [icon]="faAngleRight" /></a>
        </div>
    </div>

</div>
