<div class="mt-10">
    <div class="flex w-fit">
        <h4 class="font-semibold">Wallets
        </h4>
    </div>
    <div class="relative flex flex-col w-full border rounded-md border-input-border-color">
        <div
            class="flex font-semibold text-start items-center px-5 text-[14px] justify-between  h-[50px] bg-[var(--button-backgorund-color)]">
            <div class="w-1/2">
                <span matTooltip="When adding a Wallet, you have the option to assign a nickname. This nickname will be displayed as the 'Wallet Name' for easy identification.">
                    Custom Wallet Name
                </span>
            </div>
            <div class="w-1/2">
                Digital Payment
            </div>
        </div>
        <!-- datas -->
        @if(isLoadingContent){
            <div class="absolute left-[50%] top-[50%] loader"></div>  
        }
        @for (item of walletsPaginatedData; track $index) {
        <div class="text-sm flex text-start items-center px-5 py-2 justify-between"
            [ngClass]="{'border-b-[#e1e1e1] border-b': $index < walletsPaginatedData.length - 1, 'blur-[2px]': isLoadingContent}">
            <div class="w-1/2 ">
                <span class="font-medium p-2 !pl-0"><fa-icon class="text-common-violet-color"
                    [icon]="faWallet"></fa-icon></span>
                <span class="font-medium">{{item.walletName}}</span><br>
            </div>
            <div class="w-1/2 ">
                <span
                    class="text-sm bg-common-secondary-green-color !text-[12px] font-semibold px-2.5 py-[4px] rounded-[3px] text-common-green-color">
                    <fa-icon [icon]="faCheck" />
                    Activated
                </span>
            </div>

        </div>
        }@empty {
            <div class="w-full flex justify-center text-sm font-medium text-center items-center h-[100px]" [ngClass]="{'blur-[2px]': isLoadingContent}" >No Wallets Found!
            </div>
        }
        
        @if(wallets.length >= perPage){
            <app-common-table-pagination [rowCount]="walletsPaginatedData.length" [page]="page" [pageLimit]="perPage" (clcikedItem)="onClickEvent($event)" (viewAllEvent)="viewAll()"></app-common-table-pagination>
        }

    </div>
</div>
