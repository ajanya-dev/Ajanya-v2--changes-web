<div class="px-[6px] pb-[6px]">
  <!-- modal header -->
  <div class="flex justify-between pb-6 border-b border-input-border-color">
    <div>
      <span class="mt-18 w-full text-base text-main-text-color align-middle flex items-center">
        <span class="pl-1 font-inter font-semibold text-base pb-0.5">
          Select Bank Account
        </span>
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon class="text-secondary-text-color cursor-pointer" [icon]="faXmark"></fa-icon>
    </div>
  </div>

  <!-- Modal Body -->
  <!-- Add New Bank Account Button -->
  <div class="mb-4 mt-4">
    <button type="button"
      class="w-full py-3 px-4 border border-dashed border-common-blue-color rounded-lg hover:bg-common-secondary-blue-color transition-colors flex items-center justify-center gap-2"
      (click)="onAddNewBankAccount()">
      <fa-icon [icon]="faPlus" class="text-common-blue-color text-sm"></fa-icon>
      <span class="text-sm font-medium text-common-blue-color">Add New Bank Account</span>
    </button>
  </div>

  <!-- Bank List -->
  <div class="space-y-3 max-h-80 overflow-y-auto">
    @for (bank of bankList(); track bank.encrypted_id) {
    <!-- group is used to show the set as default button on hover -->
    <button [ngClass]="{'bg-common-secondary-blue-color': bank.encrypted_id === selectedBankId()}"
      class="px-4 py-2 rounded-lg border border-input-border-color hover:border-common-blue-color w-full transition-all cursor-pointer group"
      (click)="selectBank(bank)">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3 flex-1">
          <fa-icon [icon]="faBuildingColumns" class="text-common-blue-color text-lg"></fa-icon>

          <div class="flex-1">
            <div class="flex items-center gap-2 mb-1">
              <h3 class="text-sm font-semibold text-main-text-color font-inter">
                {{ bank.bank_name }}
              </h3>
            </div>

            <div class="flex gap-4 text-xs text-secondary-text-color">
              <span> ****{{ getLastFourDigits(bank.account_number) }}</span>
            </div>
          </div>
        </div>

        <div class="flex items-center">
          @if (isDefaultBank(bank)) {
          <span class="text-xs font-medium text-white bg-common-blue-color px-3 py-1 rounded">
            Default
          </span>
          } @else {
          <button type="button"
            class="text-xs font-medium text-secondary-text-color opacity-0 group-hover:opacity-100 hover:text-common-blue-color transition-colors"
            (click)="setAsDefault(bank, $event)">
            Set as Default
          </button>
          }
        </div>
      </div>
    </button>
    }
  </div>

  @if (bankList().length === 0) {
  <div class="py-8 text-center">
    <fa-icon [icon]="faBuildingColumns" class="text-4xl text-secondary-text-color mb-3"></fa-icon>
    <p class="text-secondary-text-color text-sm">No bank accounts available</p>
    <p class="text-secondary-text-color text-xs mt-1">Add a new bank account to get started</p>
  </div>
  }

</div>
