<div class="flex h-full bg-main-background-color">
    <!-- Main Content -->
    <div class="flex-1 px-8 py-12">
        <!-- Header -->
        <div class="text-center mb-4">
            <h1 class="text-3xl font-bold text-main-text-color mb-6 font-roboto">
                Send Money Globally – International Payments Are Now Available!
            </h1>
            <p class="text-base font-roboto font-normal text-secondary-text-color max-w-2xl mx-auto leading-relaxed">
                Send money globally from your Zil Money wallet—set up instantly, transfer fast to selected countries, and experience unmatched speed, security, and simplicity.
            </p>
        </div>

        <!-- Main Illustration Area -->
        <div class="flex justify-center items-center mb-4">
            <img ngSrc="assets/images/inter-payment.svg" alt="International Paymant" width="500" height="450" />
        </div>

        <!-- CTA Button -->
        <div class="flex justify-center">
            <app-common-button-v35
              [type]="{ style: 'filled', name: 'main' }"
               text="Start Your Transfer"
               [isAddIcon]="true"
               [icon]="faPaperPlane"
               width="210px"
               customHeight="50px"
               (clickEvent)="onStartTransferClick()"
            />
        </div>
    </div>

    <!-- Right Sidebar -->
    <div class="w-80 bg-main-background-color border-l border-input-border-color pl-6 py-6">
        <!-- Support Section -->
        <div class="mb-12 help-section">
            <div class="flex items-center mb-8 gap-3">
                <div class="w-20 h-12 bg-common-secondary-blue-color rounded-full flex items-center justify-center">
                    <fa-icon [icon]="faHeadset" class="text-common-blue-color text-base" />
                </div>
                <div>
                    <h3 class="font-semibold text-main-text-color font-roboto text-lg">Need Support?</h3>
                    <p class="text-base text-secondary-text-color font-normal font-roboto">Our support team is here to help you 24/7</p>
                </div>
            </div>

            <!-- Support Options -->
            <div class="space-y-6">
              <div class="flex flex-col gap-4 pt-6">
                <button
                  class="flex items-center w-full gap-3 border border-input-border-color rounded-lg py-2 px-6 bg-main-background-color hover:shadow transition cursor-pointer"
                  (click)="goToLiveChat()"
                  type="button"
                >
                  <fa-icon [icon]="faMessage" class="text-xl" />
                  <span class="font-roboto font-medium text-main-text-color text-lg">Live Chat</span>
                </button>
                <button
                  class="flex items-center w-full gap-3 border border-input-border-color rounded-lg py-2 px-6 bg-main-background-color hover:shadow transition cursor-pointer"
                  (click)="callSupport()"
                  type="button"
                >
                  <fa-icon [icon]="faPhone" class="text-xl" />
                  <span class="font-roboto font-medium text-main-text-color text-lg">Call Support</span>
                </button>
                <button
                  class="flex items-center w-full gap-3 border border-input-border-color rounded-lg py-2 px-6 bg-main-background-color hover:shadow transition cursor-pointer"
                  (click)="goToEmailSupport()"
                  type="button"
                >
                  <fa-icon [icon]="faEnvelope" class="text-xl" />
                  <span class="font-roboto font-medium text-main-text-color text-lg">Email</span>
                </button>
              </div>
            </div>
        </div>

        <!-- Video Tutorial Section -->
        <div class="help-section text-center">
            <h3 class="font-semibold text-main-text-color font-roboto text-xl mb-3">Video Tutorial</h3>
            <div class="help-video flex-col flex h-1/2 items-center">
                <div class="video pt-4 pb-2">
                  <img
                    src="/assets/images/international-payment/interVideo.png"
                    alt="image not loaded"
                  />
                </div>
                <div class="flex justify-center w-full">
                  <app-demo-video
                    [slug]="env.env_id==='zilMoney' ? 'zilmoneyInternationalPayment' : 'ocwInternationalPayment'"></app-demo-video>
                </div>
              </div>
        </div>
    </div>
</div>
