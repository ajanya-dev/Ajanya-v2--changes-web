<div class="flex flex-col w-full h-full overflow-hidden">
  <div class="flex-1 rounded min-h-0 overflow-hidden">
    <div class="px-1 h-full">
      <app-v4-data-table
        [deselectedColumns]="deselectedColumns"
        [defaultColumnFields]="columnFields"
        [columnDefs]="columnDefs"
        [tableId]="tableId"
        domLayout="normal"
        [adjustHeightCondition]="true"
        [fieldsShownByDefault]="fieldsShownByDefault"
        [frameworkComponents]="frameworkComponents"
        [showActionButtonContainer]="false"
        [headerElements]="headerElements()"
        [useCustomEmptyState]="true"
        [emptyStateConfig]="emptyStateConfig"
        (emptyStateActionClick)="onEmptyStateNewPayment()"
        (headerButtonEvent)="headerButtonClick($event)"
        (gridReadyOutput)="onGridReady($event)"
        class="h-full block"
      />
    </div>
  </div>

  <app-detail-side-panel
    [isOpen]="isDetailPanelOpen()"
    [width]="'clamp(460px, 34vw, 640px)'"
    [expandable]="true"
    [expandedWidth]="'min(100vw, max(960px, 62vw))'"
    [panelId]="'international-payment-detail'"
    (expandedChange)="isDetailPanelExpanded.set($event)"
    [title]="'Payment Details'"
    [subtitle]="selectedPayeeName()"
    [statusBadge]="selectedStatusBadge()"
    icon="globe"
    iconBgColor="var(--v4-primary-brand-color)"
    [contentTemplate]="detailContent"
    [backdropZIndex]="1000"
    [actionButtons]="[
      { label: 'Clone', lucideIcon: 'copy', variant: 'outline', key: 'clone' },
      {
        label: 'Send proof',
        lucideIcon: 'send',
        variant: 'outline',
        key: 'send-proof'
      }
    ]"
    (closed)="isDetailPanelOpen.set(false)"
    (actionButtonClicked)="onActionButtonClicked($event)"
  />
</div>

<ng-template #detailContent>
  <app-international-payment-detail-panel-v4
    [paymentUuId]="selectedPaymentUuId()"
    [expanded]="isDetailPanelExpanded()"
    (activityChanged)="onActivityChanged($event)"
  />
</ng-template>
