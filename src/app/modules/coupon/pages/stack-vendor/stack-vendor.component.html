<div class="ocw_one_side_body">
  <div class="ocw_header">
    <div class="title">
      <h3>Coupon Code</h3>
    </div>
  </div>
  <!-- main body -->
  <div class="ocw_body">
    <form [formGroup]="codeForm" (ngSubmit)="onSubmit()">
      <div class="coupon">
        <div class="single_input coupon-sec">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="couponCode"
          />
          <label class="floating_label_field">Enter Coupon Code</label>
        </div>
        <div class="coupon-sec">
          <button class="ocw-btn ocw-btn-skyblue">
            Submit <span [ngClass]="{ loadingSpinner: loading }"></span>
          </button>
        </div>
      </div>
    </form>
    <div class="ocw_table_wrapper mt-3">
      <table class="ocw-table ocw-table-striped">
        <thead>
          <tr>
            <td>Used Coupon</td>
            <td>Activated On</td>
            <td>Expired On</td>
            <td>Redeem Code</td>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of couponDataDetails">
            <td>
              <h3>{{ item.couponCode }}</h3>
            </td>
            <td>{{ item.activatedOn }}</td>
            <td>{{ item.expiredOn }}</td>
            <td>
              <h3>{{ item.redeemCode }}</h3>
              <p>
                (Use this code on coupon code field when you will subscribe)
              </p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
