<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between items-center px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex items-center gap-2.5">
      <div
        class="w-10 h-10 rounded-lg flex items-center justify-center"
        style="background-color: rgba(245, 158, 11, 0.12)"
      >
        <lucide-icon
          [img]="FolderPlusIcon"
          [size]="20"
          style="color: var(--v4-common-yellow-color)"
        ></lucide-icon>
      </div>
      <h1 class="text-[18px] font-semibold text-v4-main-text-color font-funnel">
        Create New Folder
      </h1>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <form [formGroup]="folderForm">
      <div class="w-full">
        <label
          class="text-sm font-medium font-funnel text-v4-main-text-color mb-1.5 block"
        >
          Folder Name <span class="text-v4-common-red-color">*</span>
        </label>
        <app-common-input-v4
          formControlName="name"
          placeholder="Enter folder name"
          class="w-full"
        ></app-common-input-v4>
        <app-control-message-v4
          [control]="folderForm.controls.name"
          [customMessages]="{
            pattern: 'Folder name must contain only alphanumeric characters'
          }"
        ></app-control-message-v4>
      </div>
    </form>
  </div>

  <!-- modal footer -->
  <div
    class="flex justify-end gap-3 px-6 py-4 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="160px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Create Folder"
      lucideIcon="folder-plus"
      [lucideIconSize]="16"
      (clickEvent)="onCreateFolder()"
      [disabled]="isSubmitting()"
      [loading]="isSubmitting()"
    />
  </div>
</div>
