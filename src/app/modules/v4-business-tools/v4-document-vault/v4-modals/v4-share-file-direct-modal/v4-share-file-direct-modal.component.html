<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between items-center px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex items-center gap-2">
      <div
        class="w-8 h-8 rounded-lg flex items-center justify-center"
        style="background-color: rgba(5, 149, 229, 0.12)"
      >
        <lucide-icon
          [img]="Share2Icon"
          [size]="16"
          style="color: var(--v4-primary-brand-bold-color)"
        ></lucide-icon>
      </div>
      <h1 class="text-base font-semibold text-v4-main-text-color font-peridot">
        Share File
      </h1>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <form [formGroup]="shareForm" class="space-y-4">
      <!-- Email Address -->
      <div>
        <app-common-input-v4
          formControlName="email"
          fieldLabel="Email Address"
          [isFieldRequired]="true"
          placeholder="Enter email address"
          class="w-full"
        ></app-common-input-v4>
        <app-control-message-v4
          [control]="shareForm.controls.email"
          [customMessages]="{
            invalidEmailAddress: 'Please enter a valid email address',
            hasWhitespace: 'Email cannot contain spaces'
          }"
        ></app-control-message-v4>
      </div>

      <!-- Expires After & Max Downloads -->
      <div class="flex gap-3">
        <div class="flex-1">
          <app-common-input-v4
            formControlName="expires_days"
            fieldLabel="Expires After (Days)"
            [isFieldRequired]="true"
            [isNumberOnly]="true"
            [numberType]="'numeric'"
            [maxLength]="3"
            placeholder="e.g. 7"
            class="w-full"
          ></app-common-input-v4>
          <app-control-message-v4
            [control]="shareForm.controls.expires_days"
            [customMessages]="{
              min: 'Must be at least 1 day',
              max: 'Cannot exceed 90 days'
            }"
          ></app-control-message-v4>
        </div>
        <div class="flex-1">
          <app-common-input-v4
            formControlName="max_downloads"
            fieldLabel="Maximum Downloads"
            [isFieldRequired]="true"
            [isNumberOnly]="true"
            [numberType]="'numeric'"
            [maxLength]="5"
            placeholder="e.g. 5"
            class="w-full"
          ></app-common-input-v4>
          <app-control-message-v4
            [control]="shareForm.controls.max_downloads"
            [customMessages]="{
              min: 'Must be at least 1'
            }"
          ></app-control-message-v4>
        </div>
      </div>
    </form>
  </div>

  <!-- modal footer -->
  <div
    class="flex justify-end gap-3 px-6 py-4 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Share"
      (clickEvent)="onShare()"
      [disabled]="isSubmitting()"
      [loading]="isSubmitting()"
    />
  </div>
</div>
