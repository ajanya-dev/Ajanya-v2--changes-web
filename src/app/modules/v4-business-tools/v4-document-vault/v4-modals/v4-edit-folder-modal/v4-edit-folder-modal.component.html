<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between items-center px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex items-center gap-2">
      <div
        class="w-8 h-8 rounded-lg flex items-center justify-center"
        style="background-color: rgba(5, 149, 229, 0.12)"
      >
        <lucide-icon
          [img]="PencilIcon"
          [size]="16"
          style="color: var(--v4-primary-brand-bold-color)"
        ></lucide-icon>
      </div>
      <h1 class="text-base font-semibold text-v4-main-text-color font-funnel">
        {{ isFile ? 'Edit Item' : 'Rename Item' }}
      </h1>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <form [formGroup]="renameForm">
      <div class="w-full">
        <app-common-input-v4
          formControlName="name"
          fieldLabel="New Name"
          [isFieldRequired]="true"
          placeholder="Enter new name"
          class="w-full"
        ></app-common-input-v4>
        <app-control-message-v4
          [control]="renameForm.controls.name"
          [customMessages]="{
            pattern: 'Name must contain only alphanumeric characters'
          }"
        ></app-control-message-v4>
      </div>
      @if (isFile) {
        <div class="w-full mt-4">
          <app-common-input-v4
            formControlName="serial_number"
            fieldLabel="Serial Number"
            [isFieldRequired]="false"
            placeholder="Enter serial number"
            class="w-full"
          ></app-common-input-v4>
        </div>
      }
    </form>
  </div>

  <!-- modal footer -->
  <div
    class="flex justify-end gap-3 px-6 py-4 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      [text]="isFile ? 'Update' : 'Rename'"
      (clickEvent)="onRename()"
      [disabled]="isSubmitting()"
      [loading]="isSubmitting()"
    />
  </div>
</div>
