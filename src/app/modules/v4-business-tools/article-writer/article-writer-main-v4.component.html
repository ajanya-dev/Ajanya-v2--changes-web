<div class="max-w-[1200px] mx-auto p-4 flex flex-col gap-6 font-peridot">
  <!-- Header Section -->
  <div class="bg-v4-main-background-color">
    <button
      type="button"
      class="flex items-center gap-1.5 text-sm text-v4-secondary-text-color hover:text-v4-main-text-color transition-colors mb-2 bg-transparent border-none cursor-pointer p-0 font-peridot"
      (click)="goBack()"
    >
      <lucide-icon [img]="ArrowLeftIcon" [size]="14"></lucide-icon>
      <span>Back</span>
    </button>
    <div class="flex items-center justify-between gap-3 flex-wrap">
      <div class="flex items-center gap-3">
        <div
          class="w-10 h-10 rounded-lg flex items-center justify-center"
          [style.background-color]="'rgba(32,49,157,0.12)'"
        >
          <lucide-icon
            [img]="PenLineIcon"
            [size]="20"
            [style.color]="'var(--v4-primary-brand-bold-color)'"
          ></lucide-icon>
        </div>
        <div class="flex flex-col">
          <h1
            class="m-0 text-xl font-semibold text-v4-main-text-color font-funnel"
          >
            Email Writer
          </h1>
          <span class="text-xs text-v4-secondary-text-color font-peridot">
            Create high-quality email content in just a few seconds using AI
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- Input Section -->
  <div class="bg-v4-secondary-background-color rounded-xl overflow-hidden shadow-lg">
    <div class="p-6 flex flex-col gap-4">
      <label class="text-sm font-semibold text-v4-secondary-text-color" for="v4-email-description">Describe your email</label>
      <textarea
        id="v4-email-description"
        class="w-full min-h-[150px] px-4 py-3 border border-v4-input-border-color rounded-[10px] text-sm leading-relaxed resize-y outline-none shadow-lg box-border bg-v4-secondary-background-color text-v4-main-text-color font-peridot placeholder:text-v4-secondary-text-color placeholder:opacity-60 focus:border-v4-primary-brand-color"
        [ngModel]="content()"
        (ngModelChange)="content.set($event)"
        placeholder="E.g., Write a professional email to a potential business partner about scheduling a meeting to discuss collaboration opportunities..."
      ></textarea>
      <div class="flex justify-between gap-3 sm:flex-row">
        <div class="w-full">
          <app-common-button-v4
          [type]="{ style: 'primary', name: 'main' }"
          text="Generate Article"
          width="100%"
          [loading]="loading()"
          [disabled]="loading() || !content()"
          [isAddIcon]="true"
          [lucideIcon]="'sparkles'"
          (clickEvent)="onGenerateButtonClicked()"
          />
        </div>
        <app-common-button-v4
          [type]="{ style: 'destructive', name: 'main' }"
          text="Clear"
          width="100px"
          [isAddIcon]="true"
          [lucideIcon]="'trash-2'"
          [disabled]="!content()"
          (clickEvent)="clearText('content')"
        />
      </div>
    </div>
  </div>

  <!-- Result 1 Section -->
  @if (result1()) {
    <div class="bg-v4-secondary-background-color rounded-xl overflow-hidden shadow-lg">
      <div class="p-6 flex flex-col gap-4">
        <div class="flex items-center justify-between flex-wrap gap-2">
          <h2 class="text-lg font-bold m-0 text-v4-main-text-color">Generated Email - Version 1</h2>
          <div class="flex items-center gap-1.5 text-[13px] font-medium text-v4-common-green-color">
            <lucide-icon [img]="CheckIcon" [size]="16"></lucide-icon>
            Ready to use
          </div>
        </div>
        <textarea
          class="w-full min-h-[200px] px-4 py-3 border border-v4-input-border-color rounded-[10px] text-sm leading-relaxed resize-y outline-none shadow-lg box-border bg-v4-secondary-background-color text-v4-main-text-color font-peridot placeholder:text-v4-secondary-text-color placeholder:opacity-60 focus:border-v4-primary-brand-color"
          [ngModel]="result1()"
          (ngModelChange)="result1.set($event)"
        ></textarea>
        <div class="flex gap-3 flex-wrap">
          <app-common-button-v4
            [type]="{ style: 'destructive', name: 'main' }"
            text="Clear"
            width="100px"
            [isAddIcon]="true"
            [lucideIcon]="'trash-2'"
            (clickEvent)="clearText('result')"
          />
          <app-common-button-v4
            [type]="{ style: 'outline', name: 'main' }"
            [text]="showCopied1banner() ? 'Copied!' : 'Copy'"
            width="120px"
            [isAddIcon]="true"
            [lucideIcon]="showCopied1banner() ? 'check' : 'copy'"
            (clickEvent)="showCopied1()"
          />
        </div>
      </div>
    </div>

    <!-- Result 2 Section -->
    @if (result2()) {
      <div class="bg-v4-secondary-background-color rounded-xl overflow-hidden shadow-lg">
        <div class="p-6 flex flex-col gap-4">
          <div class="flex items-center justify-between flex-wrap gap-2">
            <h2 class="text-lg font-bold m-0 text-v4-main-text-color">Generated Email - Version 2</h2>
            <div class="flex items-center gap-1.5 text-[13px] font-medium text-v4-common-green-color">
              <lucide-icon [img]="CheckIcon" [size]="16"></lucide-icon>
              Ready to use
            </div>
          </div>
          <textarea
            class="w-full min-h-[200px] px-4 py-3 border border-v4-input-border-color rounded-[10px] text-sm leading-relaxed resize-y outline-none shadow-lg box-border bg-v4-secondary-background-color text-v4-main-text-color font-peridot placeholder:text-v4-secondary-text-color placeholder:opacity-60 focus:border-v4-primary-brand-color"
            [ngModel]="result2()"
            (ngModelChange)="result2.set($event)"
          ></textarea>
          <div class="flex gap-3 flex-wrap">
            <app-common-button-v4
              [type]="{ style: 'outline', name: 'main' }"
              [text]="showCopied2banner() ? 'Copied!' : 'Copy'"
              width="120px"
              [isAddIcon]="true"
              [lucideIcon]="showCopied2banner() ? 'check' : 'copy'"
              (clickEvent)="showCopied2()"
            />
          </div>
        </div>
      </div>
    }
  }
</div>
