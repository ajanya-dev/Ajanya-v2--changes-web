<div
  class="flex flex-col h-screen w-full overflow-hidden bg-v4-main-background-color"
>
  <!-- Page Header -->
  <div class="flex-shrink-0 bg-v4-main-background-color px-6 pt-4">
    <button
      type="button"
      class="flex items-center gap-1.5 text-sm text-v4-secondary-text-color hover:text-v4-main-text-color transition-colors mb-2 bg-transparent border-none cursor-pointer p-0 font-peridot"
      (click)="goBack()"
    >
      <lucide-icon name="arrow-left" [size]="14"></lucide-icon>
      <span>Back</span>
    </button>
    <div class="flex items-center justify-between gap-3 flex-wrap">
      <div class="flex items-center gap-3">
        <div
          class="w-10 h-10 rounded-lg flex items-center justify-center"
          [style.background-color]="'var(--v4-badge-success-bg-color)'"
        >
          <lucide-icon
            name="truck"
            [size]="20"
            [style.color]="'var(--v4-common-green-color)'"
          ></lucide-icon>
        </div>
        <div class="flex flex-col">
          <h1
            class="m-0 text-xl font-semibold text-v4-main-text-color font-funnel"
          >
            Shipping Label
          </h1>
          <span class="text-xs text-v4-secondary-text-color font-peridot">
            Create, print and track USPS and FedEx shipping labels
          </span>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <app-common-button-v4
          [type]="{ style: 'primary', name: 'main' }"
          text="New"
          [toolTip]="'New Shipping Label'"
          [isAddIcon]="true"
          [icon]="['fas', 'plus']"
          (clickEvent)="createShippingLabel()"
        />
        <app-common-button-v4
          [type]="{ style: 'outline', name: 'main' }"
          text="Quick Label"
          [toolTip]="'Quick Label'"
          [lucideIcon]="'tag'"
          (clickEvent)="openQuickLabel()"
        />
      </div>
    </div>
  </div>

  <!-- Data Table -->
  <div class="flex-1 overflow-auto px-4 min-h-0">
    <app-v4-data-table
      class="block bg-v4-main-background-color rounded-lg"
      [columnDefs]="columnDefs"
      [defaultColumnFields]="defaultColumnFields"
      [tableId]="tableId"
      [frameworkComponents]="frameworkComponents"
      [headerElements]="headerElements()"
      [deselectedColumns]="deselectedColumns"
      (headerButtonEvent)="headerButtonClick($event)"
      (cellRendererIdEvent)="cellRendererActionClick($event)"
      (cellRendererViewEvent)="cellRendererActionView($event)"
    ></app-v4-data-table>
  </div>
</div>
