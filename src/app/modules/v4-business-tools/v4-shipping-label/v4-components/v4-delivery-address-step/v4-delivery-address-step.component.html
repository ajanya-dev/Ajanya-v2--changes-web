<div class="flex flex-col gap-4">
  <div class="flex items-center justify-between gap-3 flex-wrap">
    <h2 class="m-0 text-base font-semibold text-v4-main-text-color font-funnel">
      Delivery Address
    </h2>
    <app-common-button-v4
      [type]="{ style: 'outline', name: 'main' }"
      text="Existing Address"
      [customHeight]="'34px'"
      (clickEvent)="openExistingAddress()"
    />
  </div>

  <app-v4-shipping-address-form [form]="deliverAddrForm" />

  <div class="flex items-center justify-end pt-2">
    <app-common-button-v4
      [type]="{ style: 'primary', name: 'main' }"
      text="Next"
      [minWidth]="'120px'"
      [loading]="loading()"
      [disabled]="loading()"
      (clickEvent)="nextstep()"
    />
  </div>
</div>
