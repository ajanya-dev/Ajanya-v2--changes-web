<div class="flex flex-col gap-5">
  <!-- Package Type -->
  <div class="flex flex-col gap-2">
    <h2 class="m-0 text-base font-semibold text-v4-main-text-color font-funnel">
      Package Type
    </h2>
    <div class="w-full sm:w-[280px]">
      <app-common-input-v4
        placeholder="Package Type"
        [formControl]="packageTypeControl"
        [control]="packageTypeControl"
        [isFieldRequired]="false"
      />
    </div>
  </div>

  <div class="border-t border-v4-border-color"></div>

  <!-- Dimensions -->
  <div class="flex flex-col gap-2">
    <h2 class="m-0 text-base font-semibold text-v4-main-text-color font-funnel">
      Dimensions
    </h2>
    <p class="m-0 text-xs text-v4-secondary-text-color font-peridot">
      Enter the dimensions and weight of your {{ packageType }}.
    </p>
  </div>

  <form [formGroup]="packageForm" class="flex flex-col gap-4">
    <div class="grid grid-cols-[repeat(auto-fit,minmax(140px,1fr))] gap-4">
      <app-common-input-v4
        fieldLabel="Length (in)"
        placeholder="0.00"
        formControlName="length"
        [control]="packageForm.controls.length"
        [isNumberOnly]="true"
        [numberType]="'decimal'"
        [customMask]="'separator.2'"
        [maxLength]="5"
      />
      <app-common-input-v4
        fieldLabel="Width (in)"
        placeholder="0.00"
        formControlName="width"
        [control]="packageForm.controls.width"
        [isNumberOnly]="true"
        [numberType]="'decimal'"
        [customMask]="'separator.2'"
        [maxLength]="5"
      />
      <app-common-input-v4
        fieldLabel="Height (in)"
        placeholder="0.00"
        formControlName="height"
        [control]="packageForm.controls.height"
        [isNumberOnly]="true"
        [numberType]="'decimal'"
        [customMask]="'separator.2'"
        [maxLength]="5"
      />
      <div class="flex flex-col">
        <div class="flex items-end gap-2">
          <div class="flex-1 min-w-0">
            <app-common-input-v4
              fieldLabel="Weight"
              placeholder="0.00"
              formControlName="weight"
              [isNumberOnly]="true"
              [numberType]="'decimal'"
              [customMask]="'separator.2'"
              [maxLength]="5"
            />
          </div>
          <div class="w-[86px] shrink-0 pb-[2px]">
            <app-v4-select-dropdown
              [items]="weightUnitOptions"
              [compact]="false"
              [selectedValue]="packageForm.controls.unit.value"
              (selectionChange)="onChangeUnit($event)"
            />
          </div>
        </div>
        <app-control-message-v4
          [control]="packageForm.controls.weight"
          [isMarginTopEnabled]="false"
          [marginTopOverride]="'mt-1'"
        />
      </div>
    </div>

    <div class="flex">
      <img
        class="max-w-[210px] w-full"
        src="./assets/images/quick-label/box-dimension.svg"
        alt="Package dimensions reference"
        [style.filter]="'var(--quick-label-box-filter)'"
      />
    </div>
  </form>

  <div class="flex items-center justify-end gap-3 pt-2">
    <app-common-button-v4
      [type]="{ style: 'outline', name: 'main' }"
      text="Back"
      [minWidth]="'110px'"
      (clickEvent)="backstep()"
    />
    <app-common-button-v4
      [type]="{ style: 'primary', name: 'main' }"
      text="Next"
      [minWidth]="'120px'"
      [loading]="loading()"
      [disabled]="loading()"
      (clickEvent)="nextstep()"
    />
  </div>
</div>
