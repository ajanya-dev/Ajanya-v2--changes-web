<div class="flex flex-col gap-4">
  <div class="flex items-center justify-between gap-3 flex-wrap">
    <h2 class="m-0 text-base font-semibold text-v4-main-text-color font-funnel">
      From Address
    </h2>
    <app-common-button-v4
      [type]="{ style: 'outline', name: 'main' }"
      text="Existing Address"
      [customHeight]="'34px'"
      (clickEvent)="openExistingAddress()"
    />
  </div>

  <app-v4-shipping-address-form [form]="fromAddrForm" />

  <!-- Return address -->
  @if (isViewReturn()) {
    <div class="flex items-center gap-2">
      <button
        type="button"
        class="text-sm font-medium text-v4-primary-brand-bold-color hover:underline font-peridot"
        matTooltip="Edit return address"
        (click)="editAddress()"
      >
        View or Edit the Return Address
      </button>
      <lucide-icon
        name="circle-check"
        [size]="16"
        class="text-v4-common-green-color"
      ></lucide-icon>
    </div>
  } @else {
    <div class="flex items-center gap-2 flex-wrap">
      <button
        type="button"
        class="group flex items-center gap-2 cursor-pointer"
        (click)="toggleReturnAddress()"
      >
        <span
          class="w-[18px] h-[18px] rounded-[5px] border-2 flex items-center justify-center transition-all duration-200"
          [class]="
            isReturnAddressSame()
              ? 'border-v4-primary-brand-color bg-v4-primary-brand-color'
              : 'border-v4-subtle-text-color group-hover:border-v4-secondary-text-color'
          "
        >
          @if (isReturnAddressSame()) {
            <lucide-icon
              name="check"
              [size]="12"
              class="text-white"
            ></lucide-icon>
          }
        </span>
        <span class="text-sm text-v4-secondary-text-color font-peridot">
          Return address same as the from address
        </span>
      </button>

      <span class="text-sm text-v4-secondary-text-color font-peridot">or</span>

      <button
        type="button"
        class="text-sm font-medium text-v4-primary-brand-bold-color hover:underline font-peridot"
        (click)="addAddress()"
      >
        Add a new return address
      </button>
    </div>
  }

  <div class="flex items-center justify-end gap-3 pt-2">
    <app-common-button-v4
      [type]="{ style: 'outline', name: 'main' }"
      text="Back"
      [minWidth]="'110px'"
      (clickEvent)="backstep()"
    />
    <app-common-button-v4
      [type]="{ style: 'primary', name: 'main' }"
      text="Next"
      [minWidth]="'120px'"
      [loading]="loading()"
      [disabled]="loading()"
      (clickEvent)="nextstep()"
    />
  </div>
</div>
