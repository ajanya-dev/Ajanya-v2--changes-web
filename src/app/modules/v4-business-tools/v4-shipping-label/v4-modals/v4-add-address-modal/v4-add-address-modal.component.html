<div class="flex flex-col max-h-[90vh]">
  <!-- modal header -->
  <div
    class="flex items-center justify-between gap-3 px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color shrink-0"
  >
    <div class="flex items-center gap-2.5">
      <div
        class="w-10 h-10 rounded-lg flex items-center justify-center shrink-0 bg-v4-input-background-color"
      >
        <lucide-icon
          name="map-pin"
          [size]="20"
          class="text-v4-primary-brand-bold-color"
        ></lucide-icon>
      </div>
      <h1
        class="m-0 text-[18px] font-semibold text-v4-main-text-color font-funnel"
      >
        {{ isEditMode() ? "Edit" : "Add" }} Address
      </h1>
    </div>

    <button
      type="button"
      class="w-9 h-9 rounded-lg flex items-center justify-center text-v4-subtle-text-color hover:text-v4-main-text-color hover:bg-v4-tertiary-background-color transition-colors shrink-0"
      (click)="closeModal()"
    >
      <lucide-icon name="x" [size]="18"></lucide-icon>
    </button>
  </div>

  <!-- modal body -->
  <div class="overflow-y-auto px-6 py-5 bg-v4-popup-background-color">
    <form [formGroup]="addressForm">
      <app-v4-shipping-address-form [form]="addressForm" />
    </form>
  </div>

  <!-- modal footer -->
  <div
    class="flex justify-end gap-3 px-6 py-4 bg-v4-tertiary-background-color border-t border-v4-border-color shrink-0"
  >
    <app-common-button-v4
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
      [minWidth]="'110px'"
      (clickEvent)="closeModal()"
    />
    <app-common-button-v4
      [type]="{ style: 'primary', name: 'main' }"
      [text]="isEditMode() ? 'Update' : 'Save'"
      [minWidth]="'120px'"
      [loading]="loading()"
      [disabled]="loading()"
      (clickEvent)="saveAddress()"
    />
  </div>
</div>
