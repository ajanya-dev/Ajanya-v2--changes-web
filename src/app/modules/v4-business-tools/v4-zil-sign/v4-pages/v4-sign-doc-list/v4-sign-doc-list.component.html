<!-- h-screen -> flex-1 min-h-0: fill the page area (100vh ignored the header and double-scrolled). -->
<div
  class="flex flex-col flex-1 min-h-0 w-full overflow-hidden bg-v4-main-background-color"
>
  <div class="flex-shrink-0 bg-v4-main-background-color">
    <app-v4-page-header
      [title]="'Zil Sign'"
      subtitle="Sign documents online easily and securely"
      [actions]="headerActions"
      (actionClick)="onHeaderAction($event)"
      [showBackButton]="true"
    >
     
    </app-v4-page-header>
  </div>

  <!-- Data Table -->
  <div class="flex-1 overflow-auto min-h-0">
    <app-v4-data-table
      class="block bg-v4-main-background-color rounded-lg"
      [columnDefs]="columnDefs"
      [tableId]="tableId"
      [freeColumnResize]="false"
      [frameworkComponents]="frameworkComponents"
      [defaultColumnFields]="defaultColumnFields"
      [deselectedColumns]="deselectedColumns"
      [useCustomEmptyState]="true"
      [emptyStateConfig]="{
        icon: 'pen-tool',
        title: 'No documents yet',
        description:
          'Send a document for signature and track every request, reminder, and completed signature here.',
        buttonText: 'Request Signature',
        buttonIcon: 'plus'
      }"
      (emptyStateActionClick)="goToRequestSignature()"
    ></app-v4-data-table>
  </div>
</div>

<app-v4-sign-doc-detail-panel />
