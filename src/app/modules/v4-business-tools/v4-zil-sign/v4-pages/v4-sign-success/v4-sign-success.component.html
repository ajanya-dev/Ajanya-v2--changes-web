<div class="min-h-screen w-full bg-v4-main-background-color flex flex-col">
  <div class="flex-shrink-0 px-6 py-4 border-b border-v4-border-color">
    <img [src]="logoPath" alt="Logo" class="h-8" />
  </div>

  <div class="flex-1 flex items-center justify-center p-6">
    <div class="w-full max-w-[480px] bg-v4-secondary-background-color border border-v4-border-color rounded-xl p-8 text-center">
      <div
        class="mx-auto w-16 h-16 rounded-full flex items-center justify-center mb-4"
        [style.background-color]="'var(--v4-badge-success-bg-color)'"
      >
        <lucide-icon
          name="check-circle-2"
          [size]="32"
          [style.color]="'var(--v4-common-green-color)'"
        ></lucide-icon>
      </div>
      <h1 class="m-0 mb-2 text-2xl font-semibold text-v4-main-text-color font-peridot">
        Document Signed Successfully
      </h1>
      <p class="m-0 mb-6 text-sm text-v4-secondary-text-color">
        Your signature has been submitted. You can download the signed document
        or have it sent to your email.
      </p>
      <div class="flex flex-col gap-3">
        <app-common-button-v4
          [type]="{ style: 'primary', name: 'main' }"
          text="Email to me"
          lucideIcon="mail"
          [width]="'100%'"
          (clickEvent)="emailToMe()"
        />
        <app-common-button-v4
          [type]="{ style: 'outline', name: 'main' }"
          text="Print"
          lucideIcon="printer"
          [width]="'100%'"
          (clickEvent)="print()"
        />
        <app-common-button-v4
          [type]="{ style: 'outline', name: 'main' }"
          text="Download"
          lucideIcon="download"
          [width]="'100%'"
          (clickEvent)="download()"
        />
      </div>
    </div>
  </div>
</div>
