<div class="font-inter flex flex-col justify-between items-center h-[450px]">
  <h1 class="text-[1.44rem]">
    <span class="text-common-yellow-color font-semibold">Oh! &nbsp;</span>
    <span class="text-common-dark-blue-color font-medium"
      >Your trial period is over</span
    >
  </h1>

  <div class="flex flex-col items-center">
    <img
      ngSrc="assets/images/subscription/subscribe-robot-icon.svg"
      height="210"
      width="210"
      alt="subscribe-robot-image"
    />
  </div>

  <div class="font-inter text-sm text-main-text-color">
    Please subscribe to continue using the service
  </div>

  <div class="flex gap-3">
    <button
      class="min-w-52 py-[11px] px-[1.8rem] text-sm rounded-[5px] border-common-red-color text-common-red-color border"
      [mat-dialog-close]="false"
    >
      Maybe Later
    </button>
    <button
      class="py-[11px] px-[1.8rem] text-sm rounded-[5px] bg-common-dark-blue-color text-white"
      (click)="seePlans()"
    >
      Subscribe Now
    </button>
  </div>
</div>
