<div class="">
  <!-- single unified body -->
  <div class="bg-v4-popup-background-color px-6 pt-6 pb-4 flex flex-col gap-5">

    <!-- top row: badge + close button -->
    <div class="flex items-center justify-between">
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-v4-secondary-brand-color text-v4-badge-neutral-text-color">
        <span class="w-1.5 h-1.5 rounded-full bg-current"></span>
        TRIAL ENDED
      </span>
      <div
        [mat-dialog-close]="false"
        class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
      >
        <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
      </div>
    </div>

    <!-- headline + subtitle -->
    <div class="flex flex-col gap-1">
      <h2 class="text-2xl font-bold text-v4-main-text-color font-funnel">
        Your free trial has ended
      </h2>
      <p class="text-sm text-v4-secondary-text-color">
        Your payees, checks, and history are saved. Subscribe to keep going.
      </p>
    </div>

    <!-- features -->
    <ul class="flex flex-col gap-2">
      @for (f of features; track f) {
        <li class="flex items-center gap-2 text-sm text-v4-main-text-color">
          <span class="w-5 h-5 rounded-full flex items-center justify-center bg-v4-insight-card-background-blue shrink-0">
            <lucide-icon [img]="CheckIcon" class="text-v4-primary-brand-bold-color" [size]="12" />
          </span>
          {{ f }}
        </li>
      }
    </ul>

  </div>

  <!-- footer -->
  <div class="flex gap-3 px-6 py-5">
    <app-common-button-v4
      class="flex-1"
      [width]="'100%'"
      [mat-dialog-close]="false"
      [type]="{ style: 'outline', name: 'main' }"
      text="Maybe later"
    />
    <app-common-button-v4
      class="flex-1"
      [width]="'100%'"
      [type]="{ style: 'primary', name: 'main' }"
      text="Subscribe now"
      (clickEvent)="subscribe()"
    />
  </div>
</div>
