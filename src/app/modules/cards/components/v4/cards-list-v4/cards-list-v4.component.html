<!-- List Header (hidden when collapsed) -->
@if (!resize) {
  <app-list-header-v4
    header=""
    [isSwitchOption]="false"
    [isAddButton]="true"
    [searchPlaceholder]="'Search cards...'"
    (searchEvent)="onSearch($event)"
    (addButtonClickEvent)="addNewButtonClick()"
  />
}

<!-- Credit Cards List -->
<app-credit-cards-ocw-v4 [resize]="resize" class="flex-1 overflow-y-auto" />
