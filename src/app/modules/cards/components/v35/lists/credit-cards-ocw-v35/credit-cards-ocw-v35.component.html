<div class="h-full">
  <!-- shown only screen size less than laptop -->
  <div class="laptop:hidden">
    <app-v35-common-dropdown
      [loading]="loading() ?? false"
      [config]="{
        placeholder: loading()
          ? 'Loading..'
          : (selectedCard()?.nickName ?? 'Select Card' | truncate: 20),
        enableAddNew: true,
        displayField: 'nickName',
        displaySubField: 'cardMasked',
        iconColorField: {
          background: 'colorClasses.bg',
          text: 'colorClasses.text'
        },
        style: {
          size: 3,
          enableLabelIcon: true,
          labelIconData: {
            icon_fa: ['fas', 'credit-card'],
            color: selectedCard()?.colorClasses?.text ?? 'common-green-color'
          }
        },
        commons: {
          iconColor: {
            background: 'common-secondary-green-color',
            text: 'common-green-color'
          },
          iconData: ['fas', 'credit-card']
        }
      }"
      [listData]="cardList() ?? []"
      [(ngModel)]="SelectorSelectedValue"
      (buttonClick)="addNewButtonClick()"
    ></app-v35-common-dropdown>
  </div>

  <!-- shown only screen size larger than than laptop -->
  <di1v
    [ngClass]="
      resize ? '!min-w-[150px] !w-[150px]' : '!min-w-[280px] !w-[280px]'
    "
    class="h-full hidden laptop:flex laptop:flex-col border-t border-input-border-color"
  >
    <div class="flex flex-col h-full overflow-y-auto thin-scroll">
      @if (cardList().length > 0) {
        <button
          class="border-b w-full text-left"
          [ngClass]="
            !selectedCard()
              ? 'selected-card bg-secondary-background-color border border-common-blue-color rounded'
              : 'border-input-border-color'
          "
          (click)="selectAll()"
        >
          <div class="pl-4 pr-3 py-2 flex gap-3 items-center">
            @if (!resize) {
              <div class="flex items-center justify-center">
                <div
                  class="flex justify-center items-center h-7 w-7 bg-common-secondary-blue-color rounded-full"
                >
                  <fa-icon
                    class="text-common-blue-color text-xs"
                    [icon]="['fas', 'credit-card']"
                  ></fa-icon>
                </div>
              </div>
            }
            <div class="w-full">
              <h1
                class="font-roboto text-xs font-medium text-main-text-color text-left"
              >
                All Cards
              </h1>
              <h2
                class="font-roboto text-xs font-normal text-secondary-text-color text-left pt-1"
              >
                {{ cardList().length }} cards
              </h2>
            </div>
          </div>
        </button>

        <ng-container>
          @for (card of cardList() | searchFilter: searchKey(); track $index) {
            <button
              class="border-b hover:bg-secondary-background-color"
              [ngClass]="
                matchSelectedCard(card)
                  ? 'selected-card bg-secondary-background-color border border-common-blue-color rounded'
                  : 'border-input-border-color'
              "
              (click)="selectCard(card)"
            >
              <div class="pl-4 pr-3 py-2 flex gap-3">
                @if (!resize) {
                  <div class="flex items-center justify-center">
                    <div
                      class="flex justify-center items-center h-7 w-7 bg-common-secondary-yellow-color rounded-full"
                      [style]="
                        'background: var(--common-secondary-' +
                        card.bgColor +
                        '-color);'
                      "
                    >
                      <fa-icon
                        class="text-common-yellow-color text-xs"
                        [icon]="['fas', 'credit-card']"
                        [style]="
                          'color: var(--common-' + card.bgColor + '-color);'
                        "
                      ></fa-icon>
                    </div>
                  </div>
                }
                <div class="w-full">
                  <h1
                    class="font-roboto text-xs font-medium text-main-text-color text-left"
                  >
                    {{ (card.nickName | truncate: 15) ?? "_" }}
                  </h1>
                  <div class="flex justify-between pt-1">
                    <h2
                      class="font-roboto text-xs font-normal text-secondary-text-color text-left"
                    >
                      {{ card.cardMasked }}
                    </h2>
                  </div>
                </div>
                <div class="col-span-2 flex justify-center items-center">
                  @if (!resize) {
                    <button
                      class="flex justify-center items-center w-full"
                      matTooltip="Actions"
                      [matMenuTriggerFor]="menu"
                      aria-label="Example icon-button with a menu"
                    >
                      <fa-icon
                        [icon]="faEllipsis"
                        class="text-[15px] text-secondary-text-color"
                      ></fa-icon>
                    </button>
                  }
                  <mat-menu #menu="matMenu">
                    <button (click)="editCard(card)" mat-menu-item>
                      <div class="w-full settings">
                        <fa-icon [icon]="faEdit" class="pr-3"></fa-icon>
                        <span>Edit</span>
                      </div>
                    </button>
                    <button (click)="deleteCard(card)" mat-menu-item>
                      <div class="w-full settings">
                        <fa-icon [icon]="faTrash" class="pr-3"></fa-icon>
                        <span>Delete</span>
                      </div>
                    </button>
                  </mat-menu>
                </div>
              </div>
            </button>
          }

          @if ((cardList() | searchFilter: searchKey() | json) === "[]") {
            <div class="h-full w-full flex items-center justify-center">
              Sorry! No Cards Found.
            </div>
          }
        </ng-container>
      }
      @if (cardList().length === 0) {
        <ng-container>
          @if (loading()) {
            <app-common-list-skelton [items]="14"></app-common-list-skelton>
          } @else {
            <div
              class="h-full w-full flex items-center text-center justify-center"
            >
              Sorry!
              @if (resize) {
                <br />
              }
              No Cards Found.
            </div>
          }
        </ng-container>
      }
    </div>
  </di1v>
</div>
