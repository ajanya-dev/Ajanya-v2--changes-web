<div class="main-container h-full">
  <div
    class="h-full w-full p-5 laptop:p-0 laptop:min-w-[230px] laptop:flex-col"
  >
    <!--  tabs  -->
    <div
      class="flex laptop:hidden gap-1 overflow-x-auto whitespace-nowrap thin-scroll pb-1 mb-2"
    >
      <div
        role="presentation"
        class="px-1 cursor-pointer font-roboto font-semibold text-xs text-secondary-text-color"
        [ngClass]="
          currentTab() === item.value
            ? 'text-main-text-color border-b-2 border-b-common-blue-color'
            : ''
        "
        (click)="changeTab(item.value)"
        *ngFor="let item of tabsList"
      >
        {{ item.name }}
      </div>
    </div>

    @if (!resize) {
      <app-list-header-v35
        class="hidden laptop:block"
        [isAddButton]="currentTab() === 'credit' || currentTab() === 'sent'"
        header="My Cards"
        [isSwitchOption]="false"
        [isTabChangeOption]="true"
        [tabsArray]="tabsList"
        [selectedTab]="currentTab()"
        (tabClickEvent)="changeTab($event)"
        (searchEvent)="onSearch($event)"
        (addButtonClickEvent)="addNewButtonClick()"
      ></app-list-header-v35>
    }

    <div
      [ngClass]="{ 'laptop:max-h-[calc(100%-190px)]': !resize }"
      class="cards-list-v35 laptop:cards-list flex flex-1 flex-col h-full laptop:overflow-y-auto"
    >
      @if (currentTab() === "credit") {
        <app-credit-cards-list-ocw-v35 [resize]="resize" class="h-full" />
      } @else if (currentTab() === "sent") {
        <app-sent-cards-list-ocw-v35 class="h-full" />
      } @else if (currentTab() === "recieved") {
        <app-received-cards-list-ocw-v35 class="h-full" />
      }
    </div>
  </div>
</div>
