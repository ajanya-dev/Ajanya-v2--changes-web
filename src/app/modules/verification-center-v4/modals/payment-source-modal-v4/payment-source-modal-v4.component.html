<div class="font-peridot">
  <!-- modal header -->
  <div
    class="flex justify-between gap-4 px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Add a payment source
      </h1>
      <h2 class="text-xs text-v4-subtle-text-color">
        Choose how you'll fund your payments.
      </h2>
    </div>
    <button
      type="button"
      (click)="close()"
      class="w-9 h-9 shrink-0 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="X" class="text-v4-subtle-text-color" />
    </button>
  </div>

  <!-- modal body -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <div class="flex flex-col gap-3">
      @for (option of options; track option.key) {
        <button
          type="button"
          class="flex items-center gap-3.5 rounded-2xl px-4 py-4 text-left cursor-pointer transition-colors"
          [ngClass]="
            selected() === option.key
              ? 'border-2 border-v4-primary-brand-color bg-v4-badge-info-bg-color'
              : 'border border-v4-input-border-color bg-v4-secondary-background-color hover:border-v4-primary-brand-color'
          "
          [attr.aria-pressed]="selected() === option.key"
          [disabled]="loading()"
          (click)="select(option.key)"
        >
          <span
            class="w-11 h-11 shrink-0 rounded-xl flex items-center justify-center"
            [ngClass]="
              selected() === option.key
                ? 'bg-v4-secondary-background-color text-v4-primary-brand-bold-color'
                : 'bg-v4-badge-neutral-bg-color text-v4-badge-neutral-text-color'
            "
          >
            <lucide-icon [img]="option.icon" [size]="21" />
          </span>

          <span class="flex flex-col flex-1 min-w-0 gap-0.5">
            <span class="flex items-center gap-2 flex-wrap">
              <span class="text-[15.5px] font-bold text-v4-main-text-color">
                {{ option.title }}
              </span>
              <span
                class="text-[12px] font-bold rounded-full px-2 py-0.5 whitespace-nowrap"
                [ngClass]="option.tagClasses"
              >
                {{ option.tag }}
              </span>
            </span>
            <span class="text-xs text-v4-tertiary-text-color leading-relaxed">
              {{ option.description }}
            </span>
          </span>

          <!-- radio -->
          <span
            class="w-[22px] h-[22px] shrink-0 rounded-full flex items-center justify-center"
            [ngClass]="
              selected() === option.key
                ? 'bg-v4-primary-brand-color'
                : 'border-2 border-v4-input-border-color bg-v4-secondary-background-color'
            "
          >
            @if (selected() === option.key) {
              <lucide-icon [img]="Check" [size]="12" class="text-white" />
            }
          </span>
        </button>
      }
    </div>

    <button
      type="button"
      class="mt-5 w-full flex items-center justify-center gap-2 rounded-xl px-4 py-3.5 text-[15px] font-bold border-0 transition-colors"
      [ngClass]="
        selected()
          ? 'bg-v4-primary-brand-color text-white cursor-pointer hover:brightness-110'
          : 'bg-v4-badge-neutral-bg-color text-v4-tertiary-text-color cursor-not-allowed'
      "
      [disabled]="!selected() || loading()"
      (click)="continue()"
    >
      Continue
      @if (loading()) {
        <lucide-icon [img]="LoaderCircle" [size]="16" class="animate-spin" />
      }
    </button>

    <div
      class="mt-3.5 flex items-center justify-center gap-2 text-xs text-v4-tertiary-text-color"
    >
      <lucide-icon [img]="Lock" [size]="12" />
      Bank-level encryption. Your details stay private.
    </div>
  </div>
</div>
