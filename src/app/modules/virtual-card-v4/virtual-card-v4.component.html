@if (complianceFreeze()) {
  <app-compliance-freeze />
} @else {
  <div class="h-full w-full flex flex-col">

    @if (requestStatus() === 'Loading') {
      <div class="flex-1 flex justify-center items-center">
        <div class="loadingSpinner"></div>
      </div>
    }

    @if (showStatus()) {
      <app-application-status-v4
        class="flex-1"
        [status]="showStatus()!"
        [receivedCardCount]="receivedCardCount()"
        (showReceivedGiftCards)="showReceivedGiftCards($event)"
      />
    }

    @if (noApplication() && showWelcomePage()) {
      <app-welcome-page-v4 
      class="flex-1"
      (changeStatus)="onChangeStatus($event)" />
    }

    @if (requestStatus() === 'Approved') {
      <iframe
        #virtualCardIframe
        class="h-full w-full"
        [src]="src"
        allow="camera; microphone"
      ></iframe>
      <app-demo-video
        [slug]="isZilMoney ? 'virtual_card_zil' : 'virtual_card_ocw'"
        class="hidden"
        #demoVideo
        [clickedFromOutside]="clickedFromOutside"
        (clickedFromOutsideChange)="clickedFromOutside = $event"
      />
    }

  </div>
}
