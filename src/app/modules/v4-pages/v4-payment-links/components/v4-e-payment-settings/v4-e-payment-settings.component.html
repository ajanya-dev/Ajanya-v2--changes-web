<!-- Removed min-h-[calc(100vh-10vh)]: taller than the v4 page area, it forced a page scroll. -->
<div
  class="flex flex-col h-full w-full"
>
  <div class="main-container flex flex-col h-full w-full rounded">
    <app-v4-page-header
      [title]="'Payment Settings'"
      subtitle="Manage the payment gateways used to collect payments through your links"
      [actions]="headerActions"
      [showBackButton]="true"
      (actionClick)="headerButtonNavigation({ id: $event, selectedRows: [] })"
    />

    <div class="flex flex-1 flex-col min-h-0 mt-4">
      <app-v4-data-table
        [columnDefs]="columnDefs"
        [tableId]="tableId"
        [useCustomEmptyState]="true"
        [emptyStateConfig]="{
          icon: 'credit-card',
          title: 'No payment settings yet',
          description: 'Connect a payment gateway so you can start collecting payments through your links',
          buttonText: 'New Payment Setting'
        }"
        (emptyStateActionClick)="openPaymentModal('C', '')"
        [frameworkComponents]="frameworkComponents"
        [headerElements]="headerElements"
        [showActionButtonContainer]="false"
        (headerButtonEvent)="headerButtonNavigation($event)"
        (cellRendererDangerEvent)="onCellAction($event)"
      >
      </app-v4-data-table>
    </div>
  </div>
</div>
