<div class="h-full w-full overflow-x-auto">
  <!-- Sub-Links header with four actions only (matching zilmoneyfrontendreactlive) -->
  <div class="flex items-center justify-end px-4 py-3">
    <div class="flex items-center gap-2 flex-wrap">
      <!-- 1. Help -->
      <lucide-angular
        name="circle-help"
        [size]="18"
        class="text-v4-secondary-text-color cursor-pointer"
        matTooltip="Custom Sub-Links allow you to quickly create unique payment requests from your main link. They inherit security settings and let you set a specific amount."
      />
      <!-- 2. Create Custom Link -->
      <app-common-button-v4
        [type]="{ style: 'primary', name: 'main' }"
        text="Create Custom Link"
        lucideIcon="plus"
        [textClasses]="'text-sm'"
        toolTip="New Advance Link"
        (clickEvent)="addNewCustumRecurringLink()"
      />
      <!-- 3. Import CSV -->
      <app-common-button-v4
        [type]="{ style: 'outline', name: 'main' }"
        text="Import CSV"
        lucideIcon="download"
        [textClasses]="'text-sm'"
        toolTip="Upload a CSV file to import your custom links."
        (clickEvent)="openImportModal()"
      />
      <!-- 4. Delete -->
      <app-common-button-v4
        [type]="{ style: 'destructive', name: 'main' }"
        text=""
        lucideIcon="trash-2"
        [customClasses]="'!min-w-0 !w-9 !h-9 !p-0 justify-center !rounded-full'"
        toolTip="Delete Selected Links"
        (clickEvent)="deleteSelectedLinks()"
      />
    </div>
  </div>

  <app-v4-data-table
    class="overflow-auto"
    [showActionButtonContainer]="false"
    [showFilterBar]="false"
    [columnDefs]="columnDefs"
    [tableId]="tableId"
    [additionalPayload]="additionalPayload()"
    [frameworkComponents]="frameworkComponents"
    [headerElements]="headerElements"
    [useCustomEmptyState]="true"
    [emptyStateConfig]="{
      icon: 'link',
      title: 'No custom sub-links yet',
      description: 'Create unique payment requests from your main link with custom amounts',
      buttonText: 'Create Custom Link'
    }"
    (emptyStateActionClick)="addNewCustumRecurringLink()"
    (headerButtonEvent)="headerButtonNavigation($event)"
    (cellRendererIdEvent)="getActionComp($event)"
  >
  </app-v4-data-table>
</div>
