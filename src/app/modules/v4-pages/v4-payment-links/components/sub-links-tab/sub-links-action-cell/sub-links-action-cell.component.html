<div class="flex items-center gap-0 h-full">
    <button aria-label="Actions"
    class="action-icon-btn"
    [matMenuTriggerFor]="menu"
    (click)="$event.stopPropagation()"
    matTooltip="Actions"
  >
    <lucide-icon
      name="ellipsis-vertical"
      [size]="15"
      class="v4-action-icon"
    ></lucide-icon>
  </button>
  
  <button aria-label="View Transactions"
    class="action-icon-btn"
    (click)="onAction('Rid_view'); $event.stopPropagation()"
    matTooltip="View Transactions"
  >
    <lucide-icon name="eye" [size]="15" class="v4-action-icon"></lucide-icon>
  </button>

  <mat-menu #menu="matMenu" class="v4-action-menu">
    <button mat-menu-item (click)="onAction('Rid_view')">
      <div>
        <lucide-icon name="eye" [size]="14"></lucide-icon>
        <span>View Transactions</span>
      </div>
    </button>
    <button
      mat-menu-item
      [disabled]="rowData?.transaction_count > 0"
      (click)="onAction('RId_edit')"
    >
      <div>
        <lucide-icon name="pencil" [size]="14"></lucide-icon>
        <span>Edit</span>
      </div>
    </button>
    <button mat-menu-item (click)="onAction('RId_email_link')">
      <div>
        <lucide-icon name="mail" [size]="14"></lucide-icon>
        <span>Email Link</span>
      </div>
    </button>
    <button mat-menu-item (click)="onAction('RId_sms_link')">
      <div>
        <lucide-icon name="message-square" [size]="14"></lucide-icon>
        <span>SMS Link</span>
      </div>
    </button>
    <div class="border-t border-v4-border-color my-1"></div>
    <button mat-menu-item (click)="onAction('RId_dlt')">
      <div class="v4-danger-item">
        <lucide-icon name="trash-2" [size]="14"></lucide-icon>
        <span>Delete</span>
      </div>
    </button>
  </mat-menu>
</div>
