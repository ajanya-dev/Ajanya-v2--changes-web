<!-- Backdrop -->
<div
  class="drawer-backdrop"
  (click)="onBackdropClick($event)"
>
  <!-- Drawer Panel -->
  <div
    class="absolute top-0 right-0 h-full w-[580px] max-w-full bg-v4-secondary-background-color shadow-2xl z-[1] flex flex-col animate-slide-in"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->
    <div class="flex items-center justify-between p-5 border-b border-v4-border-color">
      <div>
        <h2 class="text-sm font-bold text-v4-main-text-color">Link Preview</h2>
        <p class="text-[12px] text-v4-secondary-text-color mt-0.5">This is how your payment page will look</p>
      </div>
      <button
        (click)="close.emit()"
        class="p-1.5 rounded-lg hover:bg-v4-tertiary-background-color transition-colors cursor-pointer shrink-0"
      >
        <lucide-angular name="x" [size]="18" class="text-v4-secondary-text-color" />
      </button>
    </div>

    <!-- Scrollable Content -->
    <div class="flex-1 overflow-y-auto thin-scroll p-5 space-y-5">

      <!-- V3 Preview Component (legacy) -->
      <div class="rounded-xl border border-v4-border-color overflow-hidden">
        <app-payment-links-preview
          baseSize="0.65rem"
          [config]="previewConfig"
        />
      </div>

      <!-- QR Code & Link Section -->
      <div class="rounded-xl border border-v4-border-color p-5 space-y-4">
        <div class="flex items-start gap-4">
          <!-- QR Code -->
          <div class="shrink-0">
            <img
              [src]="qrCodeUrl"
              alt="QR Code"
              class="w-24 h-24 rounded-lg border border-v4-border-color"
            />
          </div>

          <!-- Link + Actions -->
          <div class="flex-1 min-w-0 space-y-3">
            <div>
              <span class="text-[12px] font-semibold text-v4-secondary-text-color uppercase tracking-wider">Payment Link</span>
              <div class="flex items-center gap-2 mt-1 px-3 py-2 rounded-lg bg-v4-tertiary-background-color border border-v4-border-color">
                <lucide-angular name="external-link" [size]="12" class="shrink-0 text-v4-secondary-text-color" />
                <span class="text-[12px] font-medium truncate flex-1 text-v4-main-text-color">{{ fullUrl }}</span>
                <button [attr.aria-label]="(copied() ? 'Copied!' : 'Copy link') || null"
                  (click)="copyUrl()"
                  class="p-1 rounded transition-colors shrink-0 cursor-pointer"
                  [matTooltip]="copied() ? 'Copied!' : 'Copy link'"
                >
                  @if (copied()) {
                    <lucide-angular name="check-circle-2" [size]="12" class="text-v4-common-green-color" />
                  } @else {
                    <lucide-angular name="copy" [size]="12" class="text-v4-secondary-text-color" />
                  }
                </button>
              </div>
            </div>

            <!-- Action buttons -->
            <div class="flex gap-2">
              <div class="flex-1">
                <app-common-button-v4
                  [type]="{ style: 'outline', name: 'main' }"
                  text="Download QR"
                  lucideIcon="download"
                  [width]="'100%'"
                  (clickEvent)="downloadQr()"
                />
              </div>
              <div class="flex-1">
                <app-common-button-v4
                  [type]="{ style: 'outline', name: 'main' }"
                  text="Share"
                  lucideIcon="share-2"
                  [width]="'100%'"
                  (clickEvent)="share.emit()"
                />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
