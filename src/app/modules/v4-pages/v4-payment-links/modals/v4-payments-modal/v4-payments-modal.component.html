<div class="flex max-h-[90vh] flex-col font-peridot">
  <div
    class="flex shrink-0 items-center justify-between border-b border-v4-border-color bg-v4-popup-header-footer-color px-5 py-4 sm:px-6"
  >
    <div class="flex items-center gap-3">
      <div
        class="flex h-10 w-10 items-center justify-center rounded-lg bg-v4-badge-info-bg-color"
      >
        <lucide-angular
          name="receipt"
          [size]="20"
          class="text-v4-primary-brand-color"
        />
      </div>
      <div>
        <h2 class="text-base font-bold text-v4-main-text-color">Payments</h2>
        <p class="mt-0.5 text-xs text-v4-secondary-text-color">
          Payments collected through this link
        </p>
      </div>
    </div>
    <button aria-label="Close"
      mat-dialog-close
      matTooltip="Close"
      class="p-1 text-v4-secondary-text-color transition-colors hover:text-v4-main-text-color"
    >
      <lucide-angular name="x" [size]="20" />
    </button>
  </div>

  <div
    class="min-h-0 min-w-0 flex-1 overflow-auto bg-v4-popup-background-color p-4 sm:p-5"
  >
    <div class="w-full min-w-0 overflow-auto">
      <app-v4-data-table
        [columnDefs]="columnDefs"
        [defaultColumnFields]="columnFields"
        [tableId]="tableId"
        [frameworkComponents]="frameworkComponents"
        [additionalPayload]="{ linkId: dialogData.row.id }"
        [showActionButtonContainer]="false"
        [showFilterBar]="false"
        [isInsideModal]="true"
      />
    </div>
  </div>
</div>
