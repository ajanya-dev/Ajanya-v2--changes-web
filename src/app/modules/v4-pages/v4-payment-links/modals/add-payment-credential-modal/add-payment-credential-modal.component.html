<div class="p-6">
  <!-- Header -->
  <div class="flex items-center justify-between mb-5">
    <h2 class="text-lg font-semibold text-v4-main-text-color font-funnel">{{ title }}</h2>
    <button mat-dialog-close class="p-1 rounded hover:bg-v4-tertiary-background-color transition-colors cursor-pointer">
      <lucide-angular name="x" [size]="18" class="text-v4-secondary-text-color" />
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <!-- Live / Sandbox segmented toggle -->
    <div class="flex p-1 bg-v4-tertiary-background-color rounded-lg mb-5 gap-1">
      <app-common-button-v4
        [type]="paymentType === 'live' ? { style: 'primary', name: 'main' } : { style: 'secondary', name: 'main' }"
        [text]="'Live'"
        [customClasses]="'flex-1 py-1.5 text-sm rounded-md'"
        [disableHoverEffect]="true"
        (clickEvent)="paymentType = 'live'"
      ></app-common-button-v4>
      <app-common-button-v4
        [type]="paymentType === 'sandbox' ? { style: 'primary', name: 'main' } : { style: 'secondary', name: 'main' }"
        [text]="'Sandbox'"
        [customClasses]="'flex-1 py-1.5 text-sm rounded-md'"
        [disableHoverEffect]="true"
        (clickEvent)="paymentType = 'sandbox'"
      ></app-common-button-v4>
    </div>

    <!-- Nick Name -->
    <div class="mb-4">
      <label class="text-xs font-medium text-v4-main-text-color mb-1 block">
        Nick Name <span class="text-v4-common-red-color">*</span>
      </label>
      <app-common-input-v4
        formControlName="nickName"
        placeholder="Enter nick name"
        [isFieldRequired]="true"
      />
      <app-control-message-v4 [control]="form.controls.nickName" label="Nick Name" />
    </div>

    <!-- Dynamic credential fields -->
    <div formArrayName="credentials">
      @for (field of credentialFields; track $index) {
        <div class="mb-4">
          <label class="text-xs font-medium text-v4-main-text-color mb-1 block">
            {{ field.name }} <span class="text-v4-common-red-color">*</span>
          </label>
          <app-common-input-v4
            [formControlName]="$index"
            [placeholder]="'Enter ' + field.name"
            [isFieldRequired]="true"
          />
          <app-control-message-v4 [control]="getCredentialControl($index)" [label]="field.name" />
        </div>
      }
    </div>

    <!-- Actions -->
    <div class="flex justify-end gap-2 mt-6">
      <app-common-button-v4
        [type]="{ style: 'outline', name: 'main' }"
        text="Cancel"
        mat-dialog-close
      />
      <app-common-button-v4
        [type]="{ style: 'primary', name: 'main' }"
        text="Save"
        btnType="submit"
        [loading]="isSubmit()"
        [disabled]="isSubmit()"
      />
    </div>
  </form>
</div>
