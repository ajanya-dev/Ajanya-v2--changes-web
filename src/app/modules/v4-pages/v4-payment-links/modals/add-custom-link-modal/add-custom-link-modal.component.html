<div class="p-6 font-peridot">
  <!-- Header -->
  <div class="flex items-center justify-between mb-5">
    <h2 class="font-funnel text-lg font-bold text-v4-main-text-color">
      {{ isEditMode ? 'Edit Custom Link' : 'Create Custom Link' }}
    </h2>
    <button mat-dialog-close class="p-1 rounded hover:bg-v4-tertiary-background-color transition-colors cursor-pointer">
      <lucide-angular name="x" [size]="18" class="text-v4-secondary-text-color" />
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <!-- Amount -->
    <div class="mb-4">
      <label for="amount-input" class="font-peridot text-xs font-medium text-v4-main-text-color mb-1.5 block">
        Amount <span class="text-v4-common-red-color">*</span>
      </label>
      <app-common-amount-input-v4 formControlName="amount" />
      <app-control-message-v4 [control]="form.controls.amount" label="Amount" />
    </div>

    <!-- Nickname -->
    <div class="mb-4">
      <label for="add-custom-link-nickname" class="font-peridot text-xs font-medium text-v4-main-text-color mb-1.5 block">
        Nick Name <span class="text-v4-common-red-color">*</span>
      </label>
      <app-common-input-v4
        formControlName="nickname"
        inputId="add-custom-link-nickname"
        placeholder="Enter nickname"
        [isFieldRequired]="true"
        [maxLength]="15"
        (inputEvent)="onNicknameInput($event)"
      />
      <app-control-message-v4 [control]="form.controls.nickname" label="Nick Name" />
      @if (showNickNameError()) {
        <p class="font-peridot text-xs text-v4-common-red-color mt-1">{{ errorMsg }}</p>
      }
    </div>

    <!-- Link Preview -->
    <div class="mb-4 p-3 rounded-lg border border-v4-border-color bg-v4-tertiary-background-color">
      <span class="font-peridot text-[12px] text-v4-secondary-text-color">Link Preview:</span>
      <p class="font-peridot text-xs text-v4-primary-brand-bold-color break-all mt-0.5">{{ linkPreview }}</p>
    </div>

    <!-- Single Use / Recurring -->
    <div class="flex flex-wrap gap-6 mb-4">
      <label
        for="add-custom-link-single-use"
        class="flex items-center gap-2 cursor-pointer"
      >
        <div class="v4-radio-wrapper">
          <input
            type="radio"
            id="add-custom-link-single-use"
            value="single_use"
            formControlName="linkType"
            class="v4-radio-input"
          />
        </div>
        <span class="font-funnel text-sm text-v4-main-text-color"
          >Single Use</span
        >
      </label>
      <label
        for="add-custom-link-recurring"
        class="flex items-center gap-2 cursor-pointer"
      >
        <div class="v4-radio-wrapper">
          <input
            type="radio"
            id="add-custom-link-recurring"
            value="recurring"
            formControlName="linkType"
            class="v4-radio-input"
          />
        </div>
        <span class="font-funnel text-sm text-v4-main-text-color"
          >Recurring</span
        >
      </label>
    </div>

    <!-- Recurring fields -->
    @if (showRecurring) {
      <div class="grid grid-cols-2 gap-3 mb-4">
        <div>
          <label for="add-custom-link-months" class="font-peridot text-xs font-medium text-v4-main-text-color mb-1.5 block">
            Months <span class="text-v4-common-red-color">*</span>
          </label>
          <app-common-input-v4
            formControlName="months"
            inputId="add-custom-link-months"
            placeholder="Number of months"
            [isFieldRequired]="true"
            [isNumberOnly]="true"
            numberType="numeric"
          />
          <app-control-message-v4 [control]="form.controls.months" label="Months" />
        </div>
        <div>
          <label for="add-custom-link-start-date" class="font-peridot text-xs font-medium text-v4-main-text-color mb-1.5 block">
            Start Date <span class="text-v4-common-red-color">*</span>
          </label>
          <app-v4-date-picker
            formControlName="startDate"
            placeholder="Select date"
            [isFieldRequired]="true"
            [minDate]="tomorrow ?? ''"
            [control]="form.controls.startDate"
          />
        </div>
      </div>
    }

    <!-- Actions -->
    <div class="flex justify-end gap-2 mt-6">
      <app-common-button-v4
        [type]="{ style: 'outline', name: 'main' }"
        text="Cancel"
        mat-dialog-close
      />
      <app-common-button-v4
        [type]="{ style: 'primary', name: 'main' }"
        [text]="isEditMode ? 'Update' : 'Create'"
        btnType="submit"
        [loading]="loading()"
      />
    </div>
  </form>
</div>
