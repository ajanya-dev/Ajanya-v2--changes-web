<div class="p-6">
  <!-- Header -->
  <div class="flex items-center justify-between mb-5">
    <h2 class="text-lg font-semibold text-v4-main-text-color">Payments</h2>
    <button mat-dialog-close class="p-1 rounded hover:bg-v4-tertiary-background-color transition-colors">
      <lucide-angular name="x" [size]="18" class="text-v4-secondary-text-color" />
    </button>
  </div>

  <!-- Data Table -->
  <div>
    <app-v3-data-table
      [columnDefs]="columnDefs"
      [defaultColumnFields]="columnFields"
      [tableId]="tableId"
      [frameworkComponents]="frameworkComponents"
      [additionalPayload]="{ linkId: dialogData.row.id }"
    />
  </div>
</div>
