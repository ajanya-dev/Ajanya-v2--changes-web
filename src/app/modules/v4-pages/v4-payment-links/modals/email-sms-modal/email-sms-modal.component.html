<div class="p-6">
  <!-- Header -->
  <div class="flex items-center justify-between mb-5">
    <h2 class="text-lg font-semibold text-v4-main-text-color">
      {{ isEmail ? 'Email Link' : 'SMS Link' }}
    </h2>
    <button mat-dialog-close class="p-1 rounded hover:bg-v4-tertiary-background-color transition-colors">
      <lucide-angular name="x" [size]="18" class="text-v4-secondary-text-color" />
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    @if (isEmail) {
      <!-- Email -->
      <div class="mb-4">
        <label class="text-xs font-medium text-v4-main-text-color mb-1 block">
          Email <span class="text-v4-common-red-color">*</span>
        </label>
        <app-common-input-v4
          formControlName="email"
          placeholder="Enter email address"
          type="email"
          [control]="form.controls.email"
          [isFieldRequired]="true"
          errorLabel="Email"
        />
      </div>

      <!-- Message -->
      <div class="mb-4">
        <label class="text-xs font-medium text-v4-main-text-color mb-1 block">Message (optional)</label>
        <textarea
          formControlName="message"
          placeholder="Enter a message..."
          rows="3"
          class="v4-input-style w-full px-3 py-2 border border-input-border-color text-sm text-v4-main-text-color placeholder:text-v4-tertiary-text-color focus:outline-none focus:ring-2 focus:ring-v4-brand-border-color focus:border-v4-brand-border-color resize-none font-peridot placeholder:font-peridot"
        ></textarea>
        <div class="flex gap-3 mt-2">
          <button type="button" (click)="addMessage('amount')" matTooltip="Insert the payment amount into your message" class="text-xs font-medium text-v4-primary-brand-bold-color hover:underline">+ Amount</button>
          <button type="button" (click)="addMessage('bank')" matTooltip="Insert the bank name into your message" class="text-xs font-medium text-v4-primary-brand-bold-color hover:underline">+ Bank Name</button>
        </div>
      </div>
    } @else {
      <!-- Phone -->
      <div class="mb-4">
        <label class="text-xs font-medium text-v4-main-text-color mb-1 block">
          Phone Number <span class="text-v4-common-red-color">*</span>
        </label>
        <app-common-input-v4
          formControlName="phone"
          placeholder="Enter phone number"
          [control]="form.controls.phone"
          [isFieldRequired]="true"
          [isNumberOnly]="true"
          customMask="(000) 000-0000"
          errorLabel="Phone"
        />
      </div>
    }

    <!-- Short URL (readonly) -->
    <div class="mb-4 p-3 rounded-lg bg-v4-tertiary-background-color border border-v4-border-color">
      <span class="text-xs font-medium text-v4-secondary-text-color">Payment Link:</span>
      <p class="text-[13px] font-medium text-v4-primary-brand-bold-color break-all mt-1">{{ data.link }}</p>
    </div>

    <!-- Actions -->
    <div class="flex justify-end gap-2 mt-6">
      <app-common-button-v4
        [type]="{ style: 'outline', name: 'main' }"
        text="Cancel"
        mat-dialog-close
      />
      <app-common-button-v4
        [type]="{ style: 'primary', name: 'main' }"
        [text]="isEmail ? 'Send Email' : 'Send SMS'"
        btnType="submit"
        [loading]="isSubmit()"
      />
    </div>
  </form>
</div>
