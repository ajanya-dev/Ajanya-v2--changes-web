<!-- Modal Content -->
<div class="font-peridot w-full bg-v4-secondary-background-color rounded-xl overflow-hidden">
  <!-- Header -->
  <div class="flex items-center justify-between p-4 border-b border-v4-border-color">
    <h2 class="font-funnel text-lg font-bold text-v4-main-text-color">Share Payment Link</h2>
    <button
      (click)="closeModal()"
      class="p-1.5 hover:bg-v4-tertiary-background-color rounded-full transition-colors cursor-pointer"
    >
      <lucide-angular name="x" [size]="20" class="text-v4-tertiary-text-color" />
    </button>
  </div>

  <!-- Content -->
  <div class="p-6">
    <!-- QR Code -->
    <div class="flex flex-col items-center mb-6">
      <div class="p-4 border-2 border-dashed border-v4-border-color rounded-xl mb-3">
        <img [src]="qrUrl" alt="QR Code" class="w-[180px] h-[180px]" />
      </div>
      <p class="text-sm text-v4-secondary-text-color">{{ linkName }}</p>
    </div>

    <!-- Link Copy -->
    <div class="flex gap-2 mb-6">
      <div class="flex-1 flex items-center gap-2 min-w-0 px-3 py-2.5 bg-v4-tertiary-background-color border border-v4-border-color rounded-lg">
        <lucide-angular name="link" [size]="16" class="text-v4-subtle-text-color shrink-0" />
        <span class="text-sm text-v4-main-text-color truncate">{{ linkUrl }}</span>
      </div>
      <button
        (click)="copyLink()"
        class="flex items-center gap-2 px-4 h-11 rounded-lg text-sm font-bold transition-colors cursor-pointer shrink-0"
        [style.background-color]="copied() ? '#00a5b2' : '#004a7c'"
        [style.color]="copied() ? '#004a7c' : '#00a5b2'"
      >
        @if (copied()) {
          <lucide-angular name="check-circle-2" [size]="16" />
          Copied!
        } @else {
          <lucide-angular name="copy" [size]="16" />
          Copy
        }
      </button>
    </div>

    <!-- Share via -->
    <div class="mb-6">
      <p class="text-sm font-medium text-v4-main-text-color mb-3">Share via</p>
      <div class="grid grid-cols-4 gap-3">
        <button
          (click)="shareWhatsApp()"
          class="flex flex-col items-center gap-2 p-3 bg-v4-tertiary-background-color hover:bg-v4-tertiary-background-color rounded-xl transition-colors cursor-pointer"
        >
          <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background-color: #25D366;">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          </div>
          <span class="text-xs text-v4-secondary-text-color">WhatsApp</span>
        </button>
        <button
          (click)="shareFacebook()"
          class="flex flex-col items-center gap-2 p-3 bg-v4-tertiary-background-color hover:bg-v4-tertiary-background-color rounded-xl transition-colors cursor-pointer"
        >
          <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background-color: #1877F2;">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          </div>
          <span class="text-xs text-v4-secondary-text-color">Facebook</span>
        </button>
        <button
          (click)="shareTwitter()"
          class="flex flex-col items-center gap-2 p-3 bg-v4-tertiary-background-color hover:bg-v4-tertiary-background-color rounded-xl transition-colors cursor-pointer"
        >
          <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background-color: #000000;">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="white"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          </div>
          <span class="text-xs text-v4-secondary-text-color">X</span>
        </button>
        <button
          (click)="shareEmail()"
          class="flex flex-col items-center gap-2 p-3 bg-v4-tertiary-background-color hover:bg-v4-tertiary-background-color rounded-xl transition-colors cursor-pointer"
        >
          <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background-color: #004a7c;">
            <lucide-angular name="mail" [size]="18" class="text-white" />
          </div>
          <span class="text-xs text-v4-secondary-text-color">Email</span>
        </button>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex gap-3">
      <button
        (click)="closeModal()"
        class="flex-1 flex items-center justify-center gap-2 h-11 rounded-lg border border-v4-brand-border-color text-v4-primary-brand-bold-color text-sm font-bold transition-colors cursor-pointer hover:bg-v4-tertiary-background-color"
      >
        Close
      </button>
      <button
        (click)="downloadQr()"
        [disabled]="isDownloading()"
        class="flex-1 flex items-center justify-center gap-2 h-11 rounded-lg text-sm font-bold transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
        style="background-color: #004a7c; color: #00a5b2;"
      >
        @if (isDownloading()) {
          <div class="w-4 h-4 animate-spin">
            <lucide-angular name="loader-circle" [size]="16" />
          </div>
          Downloading...
        } @else {
          <lucide-angular name="download" [size]="16" />
          Download QR
        }
      </button>
    </div>
  </div>
</div>
