<ng-select
  [(ngModel)]="selectedItem"
  (ngModelChange)="valueChanged()"
  (scrollToEnd)="onScrollToEnd()"
  (keyup)="search($event)"
  (clear)="clear()"
  [addTag]="addTag"
  ngDefaultControl
  class="my-ng-select-class text-secondary-text-color text-md"
  appendTo=".ag-root-wrapper"
  placeholder="Select Account"
  [ngClass]="{'border border-common-blue-color rounded':selectedItem}"
>
  @for (item of bankAccounts; track item) {
    <ng-option [value]="item">
      {{ item.nickName ? item.nickName : item.name }}
      {{ addTag === true && item.verified === 1 ? "[MANUAL ACH ]" : "" }}
    </ng-option>
  }
</ng-select>
