@if (optionResult !== null) {
<div class="flex items-center pr-2" 
    [ngClass]="{'border border-common-blue-color rounded':currentValue}">
    <select
    [(ngModel)]="currentValue"
    (ngModelChange)="valueChanged()"
    value=""
    class="form-control !bg-main-background-color"
  >
    <option selected="selected" value="">All</option>
    @for (value of optionResult[0]?.values; track $index) {
      <option [value]="value?.value">{{ value?.name }}</option>
    }
  </select>
  @if(currentValue){
    <fa-icon (click)="resetFilter()" class="text-secondary-text-color cursor-pointer font-black text-sm" [icon]="faXmark"></fa-icon>
  }
</div>
}
