<div
  class="flex items-center pr-2"
  [ngClass]="{ 'border border-common-blue-color rounded': currentValue }"
>
  <input
    type="text"
    [(ngModel)]="currentValue"
    style="font-family: Arial, FontAwesome"
    placeholder="🔍 Search"
    (keyup)="getSearch($event)"
  />
  @if (currentValue) {
    <fa-icon
      (click)="resetFilter()"
      class="text-secondary-text-color cursor-pointer font-black text-sm"
      [icon]="faXmark"
    ></fa-icon>
  }
</div>
