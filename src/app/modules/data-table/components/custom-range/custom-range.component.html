<div class="mat-elevation-z3 mr-[0.1rem]">
  <mat-card appearance="outlined" class="mat-elevation-z3">
    <button
      [ngClass]="{ 'selected-range': item === selectedRange }"
      *ngFor="let item of customPresets"
      mat-button
      color="primary"
      (click)="selectRange(item)"
    >
      {{ item }}
    </button>
  </mat-card>
</div>
