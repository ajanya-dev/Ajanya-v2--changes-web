<span
  class="heading-h4 padng-top-main !text-[14px] !text-main-text-color font-inter mt-5"
  >Comments</span
>

@if (canAdd) {
  <form class="example-form">
    <textarea
      placeholder="Write your comments.."
      [(ngModel)]="comment"
      name="comment"
      maxlength="190"
      class="input_style mb-4"
      rows="3"
    ></textarea>
    <div
      class="righ-tside-buton mb-4"
      [ngStyle]="{ 'pointer-events': loading ? 'none' : 'all' }"
    >
      <app-common-button-v35
        [type]="{ style: 'blue', name: 'money-action' }"
        (clickEvent)="onSubmit()"
        [text]="!loading ? 'Add Message' : 'Loading'"
        [disabled]="loading"
        width="150px"
      ></app-common-button-v35>
    </div>
  </form>
}
<div class="max-h-[150px] overflow-auto">
  <table class="new-table">
    <thead>
      <tr class="border-under">
        <th>Date</th>
        <th>User</th>
        <th>Comment</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      @for (item of listData; track item) {
        <tr>
          <td>{{ item.date }}</td>
          <td>{{ item.createdBy }}</td>
          <td>
            {{ item.comment }}
            @if (item.all_comment_status?.status_text) {
              <a
                class="info"
                title="{{ item.all_comment_status?.status_text }}"
              >
                <fa-icon class="cursor-pointer" [icon]="faEnvelope"></fa-icon>
              </a>
            }
          </td>
          <td>
            @if (canAdd) {
              <div class="flex w-12 justify-center items-center">
                <fa-icon
                  class="text-common-red-color cursor-pointer"
                  [icon]="faTrash"
                  (click)="deleteComment(item.encrypted_id || item.id)"
                ></fa-icon>
              </div>
            }
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
