<div class="ocw_man_modal_wrapper add_bank_modal">
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">Export To QuickBooks Desktop</div>

    <svg
      mat-dialog-close
      aria-hidden="true"
      focusable="false"
      data-prefix="fal"
      data-icon="times"
      class="svg-inline--fa fa-times fa-w-10 text-gray-400"
      role="img"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 320 512"
    >
      <path
        fill="currentColor"
        d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
      ></path>
    </svg>
  </div>

  <!-- modal body start -->
  <div class="ocw_modal_body">
    <div class="remittance__wrapper">
      <div class="remittance__wrapper">
        <div class="w-full flex items-center justify-between">
          <div class="flex items-center single_input" style="width: 49%">
            <input
              type="text"
              class="input_style"
              [(ngModel)]="QBDCompanyName"
              [ngModelOptions]="{ standalone: true }"
              id=""
              disabled
              placeholder=" "
              maxlength="155"
            />
            <label class="floating_label_field"
              >QuickBooks Company<span class="required">*</span></label
            >
            <span class="ml-2">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="Category_svg"
                width="15"
                height="15"
                viewBox="0 0 512 512"
                matTooltip="Select a bank account mapped with QuickBooks to list the companies"
              >
                <path
                  d="M256 0C114.6 0 0 114.6 0 256s114.6 256 256 256s256-114.6 256-256S397.4 0 256 0zM256 400c-18 0-32-14-32-32s13.1-32 32-32c17.1 0 32 14 32 32S273.1 400 256 400zM325.1 258L280 286V288c0 13-11 24-24 24S232 301 232 288V272c0-8 4-16 12-21l57-34C308 213 312 206 312 198C312 186 301.1 176 289.1 176h-51.1C225.1 176 216 186 216 198c0 13-11 24-24 24s-24-11-24-24C168 159 199 128 237.1 128h51.1C329 128 360 159 360 198C360 222 347 245 325.1 258z"
                />
              </svg>
            </span>
          </div>
          <div class="flex items-center single_input" style="width: 49%">
            <input
              type="text"
              class="input_style"
              [(ngModel)]="QBDBankAccountName"
              [ngModelOptions]="{ standalone: true }"
              id=""
              disabled
              placeholder=" "
              maxlength="155"
            />
            <label class="floating_label_field"
              >QuickBooks Bank Account<span class="required">*</span></label
            >
            <span class="ml-2">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="15"
                height="15"
                viewBox="0 0 512 512"
                class="Category_svg"
                matTooltip="Choose the bank account listed from your QuickBooks account."
              >
                <path
                  d="M256 0C114.6 0 0 114.6 0 256s114.6 256 256 256s256-114.6 256-256S397.4 0 256 0zM256 400c-18 0-32-14-32-32s13.1-32 32-32c17.1 0 32 14 32 32S273.1 400 256 400zM325.1 258L280 286V288c0 13-11 24-24 24S232 301 232 288V272c0-8 4-16 12-21l57-34C308 213 312 206 312 198C312 186 301.1 176 289.1 176h-51.1C225.1 176 216 186 216 198c0 13-11 24-24 24s-24-11-24-24C168 159 199 128 237.1 128h51.1C329 128 360 159 360 198C360 222 347 245 325.1 258z"
                />
              </svg>
            </span>
          </div>
        </div>
        <h3 class="sub_head ml-1.5 mt-1.5">EXPENSE DETAILS</h3>

        <div class="remittance_table">
          <table class="expense">
            <thead>
              <tr>
                <!-- <td>SL </td> -->
                <td>EXPENSE</td>
                <td>DESCRIPTION</td>
                <td>CUSTOMER</td>
                <td>CLASS</td>
                <td>AMOUNT</td>
                <td>ACTION</td>
              </tr>
            </thead>
            <tbody>
              <tr
                *ngFor="let data of expenseListFormArr.controls; let i = index"
                [formGroup]="expenseListFormArr.controls[i]"
              >
                <!-- <td width="10%">{{i+1}}</td> -->
                <td width="10%">
                  <ng-select
                    class="category_item"
                    [appendTo]="body"
                    (scrollToEnd)="onQBDScrollCompanyDetails('expense-items')"
                    (keyup)="
                      onQBDSearchItemsCompanyDetails($event, 'expense-items')
                    "
                    (change)="OnQBDItemChangeExpenseDetails($event, i)"
                    bindLabel="name"
                    formControlName="expenseObj"
                    placeholder="select Items"
                    appendTo="ng-select"
                  >
                    <ng-option
                      *ngFor="let item of QBDExpenseItem"
                      [value]="item"
                    >
                      {{ item.name }}
                    </ng-option>
                  </ng-select>
                </td>
                <td width="10%">
                  <input type="text" formControlName="description" />
                </td>
                <td width="10%">
                  <div class="single_input">
                    <ng-select
                      class="category_item"
                      [appendTo]="body"
                      (scrollToEnd)="onQBDScrollCompanyDetails('customers')"
                      (keyup)="
                        onQBDSearchItemsCompanyDetails($event, 'customers')
                      "
                      (change)="OnQBDItemChangeCustomerDetails($event, i)"
                      bindLabel="name"
                      formControlName="customerObj"
                      placeholder="select Items"
                      appendTo="ng-select"
                    >
                      <ng-option
                        *ngFor="let item of QBDcustomersItem"
                        [value]="item"
                      >
                        {{ item.name }}
                      </ng-option>
                    </ng-select>
                  </div>
                </td>
                <td width="10%">
                  <ng-select
                    class="category_item"
                    [appendTo]="body"
                    (scrollToEnd)="onQBDScrollCompanyDetails('classes')"
                    (keyup)="onQBDSearchItemsCompanyDetails($event, 'classes')"
                    (change)="OnQBDItemChangeClassDetails($event, i)"
                    bindLabel="name"
                    formControlName="classObj"
                    placeholder="select Items"
                    appendTo="ng-select"
                  >
                    <ng-option *ngFor="let item of QBDClassItem" [value]="item">
                      {{ item.name }}
                    </ng-option>
                  </ng-select>
                </td>
                <td width="10%">
                  <input
                    type="text"
                    formControlName="amount"
                    maxlength="10"
                    mask="separator.2"
                    thousandSeparator=","
                    (keypress)="utils.numberOnly($event, 'decimal')"
                    (keyup)="calculateExpenseTotal()"
                  />
                </td>
                <td width="10%" (click)="removeSelectedRow(i, 'expense')">
                  <svg
                    aria-hidden="true"
                    focusable="false"
                    data-prefix="fas"
                    data-icon="trash"
                    class="trash_btn svg-inline--fa fa-trash fa-w-14"
                    role="img"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 448 512"
                  >
                    <path
                      fill="currentColor"
                      d="M432 32H312l-9.4-18.7A24 24 0 0 0 281.1 0H166.8a23.72 23.72 0 0 0-21.4 13.3L136 32H16A16 16 0 0 0 0 48v32a16 16 0 0 0 16 16h416a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16zM53.2 467a48 48 0 0 0 47.9 45h245.8a48 48 0 0 0 47.9-45L416 128H32z"
                    ></path>
                  </svg>
                </td>
              </tr>
              <tr></tr>
            </tbody>
          </table>
        </div>

        <div class="remi_bottom_area">
          <div class="control_table_btn mt-1">
            <button class="add_btn ocw-btn" (click)="addNewRow('expense')">
              <svg
                aria-hidden="true"
                focusable="false"
                data-prefix="fas"
                data-icon="plus"
                class="svg-inline--fa fa-plus fa-w-14"
                role="img"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 448 512"
              >
                <path
                  fill="currentColor"
                  d="M416 208H272V64c0-17.67-14.33-32-32-32h-32c-17.67 0-32 14.33-32 32v144H32c-17.67 0-32 14.33-32 32v32c0 17.67 14.33 32 32 32h144v144c0 17.67 14.33 32 32 32h32c17.67 0 32-14.33 32-32V304h144c17.67 0 32-14.33 32-32v-32c0-17.67-14.33-32-32-32z"
                ></path>
              </svg>
            </button>
            <button class="minus_btn ocw-btn" (click)="removeRow('expense')">
              <svg
                aria-hidden="true"
                focusable="false"
                data-prefix="fas"
                data-icon="minus"
                class="svg-inline--fa fa-minus fa-w-14"
                role="img"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 448 512"
              >
                <path
                  fill="currentColor"
                  d="M416 208H32c-17.67 0-32 14.33-32 32v32c0 17.67 14.33 32 32 32h384c17.67 0 32-14.33 32-32v-32c0-17.67-14.33-32-32-32z"
                ></path>
              </svg>
            </button>
            <button class="clear_btn" (click)="clearAllRow('expense')">
              Clear
            </button>
          </div>
        </div>

        <div class="flex flex-col items-end">
          <div class="total_val">
            <p>Total :{{ expenseTotal | currency }}</p>
          </div>
          <button
            type="button"
            (click)="onSaveExpense()"
            class="ocw-btn ocw-btn-dark-green mt-1"
          >
            <span>SAVE DETAILS</span>
            <svg
              aria-hidden="true"
              focusable="false"
              data-prefix="fas"
              data-icon="save"
              class="svg-inline--fa fa-save fa-w-14"
              role="img"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 448 512"
            >
              <path
                fill="currentColor"
                d="M433.941 129.941l-83.882-83.882A48 48 0 0 0 316.118 32H48C21.49 32 0 53.49 0 80v352c0 26.51 21.49 48 48 48h352c26.51 0 48-21.49 48-48V163.882a48 48 0 0 0-14.059-33.941zM224 416c-35.346 0-64-28.654-64-64 0-35.346 28.654-64 64-64s64 28.654 64 64c0 35.346-28.654 64-64 64zm96-304.52V212c0 6.627-5.373 12-12 12H76c-6.627 0-12-5.373-12-12V108c0-6.627 5.373-12 12-12h228.52c3.183 0 6.235 1.264 8.485 3.515l3.48 3.48A11.996 11.996 0 0 1 320 111.48z"
              ></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
<div
  class="data_spinner absolute top-0 z-10 overflow-hidden h-full w-full"
  *ngIf="isLoading"
></div>
