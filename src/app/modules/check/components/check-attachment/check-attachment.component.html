<div>
  @if (canAdd) {
    <div class="flex justify-end gap-3 mt-2">
      <app-common-button-v35
        [type]="{ style: 'blue', name: 'money-action' }"
        [isAddIcon]="true"
        [icon]="['fas', 'plus']"
        (clickEvent)="addAttachment()"
        text="Add Attachment"
        width="150px"
      ></app-common-button-v35>
    </div>
  }
  <div class="ocw_table_wrapper mt-5 max-h-[244px] overflow-auto">
    <table class="new-table">
      <thead>
        <tr>
          <td>Date</td>
          <td>User</td>
          <td>File</td>
          <td>Action</td>
        </tr>
      </thead>
      <tbody>
        @for (item of checkAttachmentData; track item; let i = $index) {
          <tr class="bg-tr">
            <td width="30%">{{ item.formated_date }}</td>
            <td width="20%">{{ item.user_name }}</td>
            <td width="40%" class="file">
              <div class="flex items-center">
                <a
                  role="presentation"
                  (click)="openAttachment(item.id, true)"
                  tabindex="0"
                >
                  {{ item.fileName }}
                </a>
                <fa-icon
                  [icon]="['fas', 'external-link']"
                  aria-hidden="true"
                  (click)="openAttachment(item.id, false)"
                  class="cursor-pointer"
                ></fa-icon>
              </div>
            </td>
            <td class="icon">
            @if (canAdd) {
              <a class="deleteButton" data-id="">
                <fa-icon
                  [icon]="['fas', 'trash']"
                  class="!text-common-red-color cursor-pointer"
                  aria-hidden="true"
                  title="Delete"
                  (click)="onDeleteAttachment(item.id)"
                ></fa-icon>
                <span class="sr-only">Delete</span></a
              >
            }
              @if (item.all_attachment_status?.status_text) {
                <a class="info">
                  <fa-icon
                    [icon]="['fas', 'envelope']"
                    aria-hidden="true"
                    title="{{ item.all_attachment_status?.status_text }}"
                  ></fa-icon>
                </a>
              }
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
