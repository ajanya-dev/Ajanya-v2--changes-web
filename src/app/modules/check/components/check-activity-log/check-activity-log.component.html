<div class="mt-5 max-h-[255px] overflow-auto">
  <table class="new-table">
    <thead>
      <tr>
        <th class="" width="30%">Date</th>
        <th width="15%">Status</th>
        <th width="15%">Initiated By</th>
        <th width="20%">Device</th>
        <th width="10%">Note</th>
      </tr>
    </thead>
    <tbody>
      <tr class="bg-tr" *ngFor="let item of activityData">
        <td>{{ item.date }}</td>
        <td>{{ item.status }}</td>
        <td>{{ item.activityBy }}</td>
        <td>
          <div class="flex items-center gap-1">
            <p>{{ item.location }}</p>
            <span>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                (click)="editDeviceName(item.ipAddress)"
                width="10"
                aria-hidden="true"
                focusable="false"
                data-prefix="fas"
                data-icon="pen"
                class="svg-inline--fa fa-pen fa-w-16"
                role="img"
                viewBox="0 0 512 512"
              >
                <path
                  fill="currentColor"
                  d="M290.74 93.24l128.02 128.02-277.99 277.99-114.14 12.6C11.35 513.54-1.56 500.62.14 485.34l12.7-114.22 277.9-277.88zm207.2-19.06l-60.11-60.11c-18.75-18.75-49.16-18.75-67.91 0l-56.55 56.55 128.02 128.02 56.55-56.55c18.75-18.76 18.75-49.16 0-67.91z"
                />
              </svg>
            </span>
          </div>
        </td>

        <td class="note">
          <span *ngIf="item.notes">{{ item.notes }}</span>
          <span *ngIf="!item.notes">{{
            item.status === "Schedule" ? "Check mailing scheduled" : item.notes
          }}</span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
