<div class="ocw_table_wrapper mt-5 max-h-[255px] overflow-auto">
  <table class="new-table">
    <thead>
      <tr>
        <th class="tabs-inner-h4" width="15%">Date</th>
        <th width="55%">Memo</th>
        <th width="10%">Amount</th>
        <th width="20%">Account</th>
      </tr>
    </thead>
    <tbody>
      <tr class="bg-tr" *ngFor="let item of payeeTransactionData">
        <td>{{ item?.date }}</td>
        <td>{{ item?.memo }}</td>
        <td (click)="onCheckView(item.id)">{{ item?.amount }}</td>
        <td>{{ item.account }}</td>
      </tr>
    </tbody>
  </table>
</div>
