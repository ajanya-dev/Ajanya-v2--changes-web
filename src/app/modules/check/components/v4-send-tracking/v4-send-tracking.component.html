<div
  class="px-6 pb-4 pt-4 transition-all duration-500 overflow-hidden"
  [ngClass]="isCountryDropdownOpened ? 'min-h-[330px]' : 'min-h-[160px]'"
>
  <div class="flex justify-between items-center pb-5">
    <div class="flex items-center gap-2">
      @if (proofType) {
        <lucide-icon
          class="cursor-pointer text-v4-secondary-text-color hover:text-v4-main-text-color"
          [img]="ArrowLeftIcon"
          [size]="18"
          (click)="back()"
        />
      }
      <span class="font-funnel font-semibold text-base text-v4-main-text-color">
        Share Track Link
      </span>
    </div>
    <lucide-icon
      class="cursor-pointer text-v4-secondary-text-color hover:text-v4-main-text-color"
      [img]="XIcon"
      [size]="18"
      [mat-dialog-close]="false"
    />
  </div>

  <div class="flex items-center min-h-[80px]">
    @if (proofType) {
      @if (proofType === "Email") {
        <div class="flex justify-center items-start gap-3 w-full">
          <div class="flex-1">
            <app-common-input-v4
              [placeholder]="'Enter Email'"
              [type]="'email'"
              [control]="sendEmail"
              [formControl]="sendEmail"
              [isFieldRequired]="true"
              [fieldHeight]="'44px'"
            />
          </div>
          <div>
            <app-common-button-v4
              [type]="{ style: 'primary', name: 'main' }"
              text="Send Email"
              (clickEvent)="sendProof('email')"
              [loading]="isEmailProofLoading()"
              [disabled]="isEmailProofLoading()"
            />
          </div>
        </div>
      } @else if (proofType === "SMS") {
        <div class="flex justify-center items-start gap-3 w-full">
          <div class="flex-1">
            <app-phone-input-v4
              [placeholder]="'Phone Number'"
              [control]="sendPhoneNumber"
              [formControl]="sendPhoneNumber"
              [isFieldRequired]="true"
              (countryDropdown)="countryChange($event)"
            />
            <p class="text-sm font-semibold text-v4-main-text-color mt-1">
              Cost:
              <span class="text-v4-common-green-color">
                ${{ sendPhoneNumber.value ? "0.50" : "0.00" }}
              </span>
            </p>
          </div>
          <div>
            <app-common-button-v4
              [type]="{ style: 'primary', name: 'main' }"
              text="Send SMS"
              (clickEvent)="sendProof('sms')"
              [loading]="isSMSProofLoading()"
              [disabled]="isSMSProofLoading()"
            />
          </div>
        </div>
      }
    } @else {
      <div class="w-full h-fit flex justify-start gap-3">
        @for (item of proofsList; track item) {
          <div
            role="presentation"
            (click)="sendProof(item.action)"
            class="w-full bg-v4-tertiary-background-color rounded-xl min-h-10 px-3 py-2 flex gap-2 items-center cursor-pointer group hover:shadow-common-box-shadow border border-transparent hover:border-v4-border-color transition-all"
          >
            <lucide-icon
              class="text-v4-primary-brand-color"
              [img]="item.icon"
              [size]="18"
            />
            <span
              class="text-v4-primary-brand-color text-sm font-medium group-hover:pl-0.5 transition-all"
            >
              {{ item.name }}
            </span>
          </div>
        }
      </div>
    }
  </div>
</div>
