<div class="alert_wrapper failed_alert">
  <!-- header -->
  <div class="alert_header">
    <div class="alert_icon">
      <svg
        version="1.1"
        id="Layer_1"
        xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink"
        x="0px"
        y="0px"
        viewBox="0 0 512 512"
        style="enable-background: new 0 0 512 512"
        xml:space="preserve"
      >
        <ellipse
          style="fill: #e04f5f"
          cx="256"
          cy="256"
          rx="256"
          ry="255.832"
        />
        <g transform="matrix(-0.7071 0.7071 -0.7071 -0.7071 77.26 32)">
          <rect
            x="3.98"
            y="-427.615"
            style="fill: #ffffff"
            width="55.992"
            height="285.672"
          />
          <rect
            x="-110.828"
            y="-312.815"
            style="fill: #ffffff"
            width="285.672"
            height="55.992"
          />
        </g>
      </svg>
    </div>
  </div>

  <!-- body -->
  <div class="alert_body">
    <h2 class="title">Checks export failed!</h2>
    <h3 class="content">
      We have encountered some issues while exporting your checks.
    </h3>
  </div>
  <div class="alert_body">
    <div>
      <table class="ocw-table ocw-table-striped">
        <thead>
          <tr>
            <td style="width: 120px">Check No.</td>
            <td>Notes</td>
          </tr>
        </thead>
      </table>
    </div>
    <div class="check-table-body-container">
      <table class="ocw-table ocw-table-striped">
        <tbody>
          <ng-container *ngFor="let item of errorCheckList">
            <tr *ngFor="let checkno of item | keyvalue">
              <td style="width: 120px">{{ checkno.key }}</td>
              <td>{{ checkno.value }}</td>
            </tr>
          </ng-container>
        </tbody>
      </table>
    </div>
  </div>

  <!-- actions -->
  <div class="alert_button_wrapper">
    <button mat-dialog-close class="ocw-btn ocw-btn-modal-blue">Ok</button>
  </div>
</div>
