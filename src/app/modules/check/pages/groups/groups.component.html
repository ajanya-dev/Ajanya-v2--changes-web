<section class="main_common_module">
  <div class="main_wrapper">
    <div class="module_main_header">
      <div class="flex justify-between items-center gap-2">
        <div class="header_title !flex gap-2 items-center">
          <app-common-back-button-v35
            type="takeEvent"
            (backEvent)="onBackButtonClick()"
          ></app-common-back-button-v35>
          <h3
            class="!font-inter !font-semibold !text-base !text-main-text-color"
          >
            {{ activeTab === "group" ? "Group Checks: Index" : "Bulk Payment" }}
          </h3>
        </div>
      </div>
    </div>

    <div class="module_main_body">
      <div class="v35-tabs text-sm pt-1 w-32">
        <div
          [ngClass]="{
            selected: activeTab === 'check'
          }"
          role="presentation"
          routerLink="/manage/cheque/multiplecheck/create"
        >
          <div>Multiple Check</div>
        </div>
        <div
          role="presentation"
          (click)="changeTab('group')"
          [ngClass]="{
            selected: activeTab === 'group'
          }"
        >
          <div>My Groups</div>
        </div>
        <div
          (click)="changeTab('more')"
          role="presentation"
          [ngClass]="{
            selected: activeTab === 'more'
          }"
        >
          <div>Bulk Pay</div>
        </div>
      </div>

      @if (activeTab === "group") {
        <app-group-payments-table [asComponent]="true" />
      }

      @if (activeTab === "more") {
        <div class="h-7"></div>
        <app-group-payments payFrom="bank" />
      }
    </div>
  </div>
</section>
