<div class="w-full flex justify-center">
  <div
    class="w-2/3 max-w-3xl flex flex-col justify-start items-start bg-main-background-color p-5 rounded"
  >
    <div class="w-full">
      <div
        class="text-base !text-[18px] font-semibold text-main-text-color font-inter"
      >
        Import Checks from File
      </div>
    </div>

    <div class="w-full">
      <!-- FORM START -->
      <form [formGroup]="importForm" (ngSubmit)="submit()" class="mt-4">
        <div class="flex flex-col gap-4">
          <div class="grid grid-cols-1 md:grid-cols-2">
            <label for="account" class="font-inter"
              >Select Account: <span class="required">*</span></label
            >
            <div class="single_input control_wrap">
              <app-bank-ac-dropdown-v3
                customHeight="2"
                [formControl]="selectedBank"
                class="w-full h-full"
                (clearEvent)="onRemoveBank()"
              ></app-bank-ac-dropdown-v3>
              <app-control-message
                [control]="importForm.controls.bankAccount"
                labelName="Please select bank account"
              >
              </app-control-message>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2">
            <label for="file" class="font-inter"
              >Select File: <span class="required">*</span></label
            >
            <div class="single_input no_modal_btn control_wrap">
              <div class="ocw-browse-file m-t1">
                <app-common-upload-button-v35
                  buttonText="BROWSE"
                  [acceptedFileTypes]="['.txt']"
                  (selectedFileEvent)="uploadEvent($event)"
                ></app-common-upload-button-v35>
              </div>
              <app-control-message
                [control]="importForm.controls.file"
                labelName="Please select file"
              >
              </app-control-message>
            </div>
          </div>

          <div class="flex justify-end">
            <app-common-button-v35
              text="Import"
              [disabled]="submitting"
              [loading]="submitting"
              [type]="{ style: 'green', name: 'money-action' }"
              (clickEvent)="submit()"
            ></app-common-button-v35>
          </div>
        </div>
      </form>
      <!-- FORM END -->
    </div>
  </div>
</div>
