<div class="flex justify-center pt-8">
  <div class="bg-main-background-color px-4 py-5 rounded-sm w-[800px]">
    <div>
      <div class="pb-4">
        <h3 class="!text-main-text-color font-inter font-semibold">
          Import Checks
        </h3>
      </div>
    </div>

    <!-- MAIN BODY START -->
    <div class="max-h-[540px] overflow-x-hidden overflow-y-auto">
      <!-- TABLE START -->
      <div class="w-full">
        @if (isLoading()) {
          @for (_ of [].constructor(5); let i = $index; track i) {
            <div class="skelton mb-2 w-full h-11"></div>
          }
        } @else {
          <table class="ocw-table ocw-table-striped">
            <thead>
              <tr>
                <td>
                  <input
                    type="checkbox"
                    (click)="toggleSelect($event.target.checked)"
                    checked
                  />
                </td>
                <td>S.No</td>
                <td class="header">Amount</td>
                <td class="header">Check Serial Number</td>
                <td class="header">Date</td>
              </tr>
            </thead>

            <tbody>
              @for (item of checkData(); let i = $index; track item) {
                <tr>
                  <td>
                    <input type="checkbox" [(ngModel)]="item.selected" />
                  </td>
                  <td>{{ i }}</td>
                  <td>{{ item.amount }}</td>
                  <td>{{ item.checkSerialNumber }}</td>
                  <td>{{ item.date }}</td>
                </tr>
              }
            </tbody>
          </table>
        }
      </div>
    </div>
    <div class="flex justify-end flex-wrap gap-2 mt-4">
      <app-common-button-v35
        [type]="{ style: 'filled', name: 'main' }"
        textColorInput="white"
        text="Cancel"
        backGroundInput="var(--common-red-color)"
        width="100%"
        customClasses="!h-[38px]"
        class="w-24 max-sm:w-full"
        routerLink="/manage/cheque/reconciliation/step1"
      >
      </app-common-button-v35>
      <app-common-button-v35
        [type]="{ style: 'filled', name: 'main' }"
        backGroundInput="var(--common-blue-color)"
        text="Process Now"
        width="100%"
        class="w-36"
        (clickEvent)="processNow()"
        [disabled]="isSubmit() || isLoading()"
        [loading]="isSubmit()"
      >
      </app-common-button-v35>
    </div>
  </div>
</div>
