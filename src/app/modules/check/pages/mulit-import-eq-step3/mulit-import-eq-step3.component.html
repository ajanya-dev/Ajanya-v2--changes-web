<div class="table-container bg-main-background-color p-3 rounded-sm">
  <div class="main_wrapper table-scroll-container !w-auto">
    <div class="module_main_header">
      <div class="header_title">
        <h3 class="!text-main-text-color font-inter font-semibold">
          Import Checks
        </h3>
      </div>
    </div>

    <!-- MAIN BODY START -->
    <div
      class="!max-w-11/12 flex flex-shrink !overflow-auto mt-3"
      [ngClass]="{ skelton: loading }"
    >
      <!-- TABLE START -->
      <div class="table">
        <table class="ocw-table ocw-table-striped">
          <thead>
            <tr>
              <td>
                <input
                  type="checkbox"
                  (click)="toggleSelect($event.target.checked)"
                  checked
                />
              </td>
              @for (item of headers; track item) {
                <td class="min-w-[150px]">{{ item }}</td>
              }
            </tr>
          </thead>

          <tbody>
            @for (item of data; track item) {
              <tr>
                <td>
                  <input type="checkbox" [(ngModel)]="item.selected" />
                </td>
                @for (key of columnKeys; track key) {
                  <td>{{ item[key] }}</td>
                }
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
    <div class="flex justify-end flex-wrap gap-2 mt-4">
      <app-common-button-v35
        [type]="{ style: 'filled', name: 'main' }"
        (clickEvent)="goToStep1()"
        textColorInput="white"
        text="Cancel"
        backGroundInput="var(--common-red-color)"
        width="100%"
        customClasses="!h-[38px]"
        class="w-24 max-sm:w-full"
      >
      </app-common-button-v35>
      <app-common-button-v35
        [type]="{ style: 'filled', name: 'main' }"
        backGroundInput="var(--common-green-color)"
        (clickEvent)="submit()"
        [disabled]="submitting"
        [loading]="submitting"
        text="Submit"
        width="100%"
        class="w-24 max-sm:w-full"
      >
      </app-common-button-v35>
    </div>
  </div>
</div>
