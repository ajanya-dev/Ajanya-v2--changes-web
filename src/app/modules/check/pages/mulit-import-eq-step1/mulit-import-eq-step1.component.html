<section
  class="flex justify-center m-auto gap-5 origin-top max-w-[1300px] mt-8"
>
  <div class="max-w-full w-[65%]">
    <div class="bg-main-background-color rounded-lg py-5 px-6">
      <div class="flex justify-between items-center">
        <div>
          <h3 class="text-lg text-main-text-color font-inter font-semibold">
            Import Checks from Excel/Csv File
          </h3>
        </div>
      </div>

      <div class="mt-5">
        <form [formGroup]="importForm">
          <div class="flex flex-col gap-4">
            <div class="grid grid-cols-1 md:grid-cols-2">
              <label
                class="font-inter font-semibold text-main-text-color text-sm"
                for="account"
                >Select File: <span class="required">*</span></label
              >
              <div class="single_input control_wrap">
                <div class="flex flex-col">
                  <app-common-upload-button-v35
                    buttonText="Upload"
                    class="w-full"
                    [acceptedFileTypes]="['.csv', '.xlsx']"
                    (selectedFileEvent)="uploadEvent($event)"
                  />
                  <app-control-message
                    [control]="importForm.controls.file"
                    labelName="Please select file"
                  >
                  </app-control-message>
                </div>
              </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2">
              <label
                class="font-inter font-semibold text-main-text-color text-sm"
                for="file"
                >Select Template:
              </label>
              <div class="flex flex-col">
                <div class="angular-ocw-v35-ng-select-dropdown w-full">
                  <ng-select
                    appendTo="body"
                    class="ng-dropdown-panel-v35 text-sm import-cheques"
                    formControlName="template"
                    [clearable]="false"
                  >
                    <ng-option value="NOTEMPLATE" selected
                      >No template</ng-option
                    >
                    <ng-option value="">-- DEFAULT --</ng-option>
                    @for (template of templates; track template) {
                      <ng-option [value]="template.id">{{
                        template.templateName
                      }}</ng-option>
                    }
                  </ng-select>
                </div>
              </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2">
              <label
                class="font-inter font-semibold text-main-text-color text-sm"
                for="account"
                >Include Column Heading Lines:</label
              >
              <div class="single_input no_modal_btn">
                <div class="angular-ocw-v35-ng-select-dropdown w-full">
                  <ng-select
                    appendTo="body"
                    class="ng-dropdown-panel-v35 text-sm import-cheques"
                    formControlName="includeHeader"
                    [clearable]="false"
                  >
                    <ng-option value="no" selected>No</ng-option>
                    <ng-option value="yes">Yes</ng-option>
                  </ng-select>
                </div>
              </div>
            </div>

            <div class="flex justify-end">
              <app-common-button-v35
                [type]="{ style: 'filled', name: 'main' }"
                text="Import"
                backGroundInput="var(--common-green-color)"
                (clickEvent)="submit()"
                [loading]="submitting"
                [disabled]="submitting"
              />
            </div>
          </div>
        </form>

        <div class="text-sm flex flex-col">
          <span
            class="mt-3 flex items-center gap-1 font-inter text-main-text-color font-normal"
          >
            <fa-icon
              class="text-common-blue-color"
              [icon]="faAngleRight"
            ></fa-icon>
            Please make sure date format is (mm/dd/yyyy or mm/dd/yy)
          </span>
          <span
            class="mt-3 flex items-center gap-1 font-inter text-main-text-color font-normal"
          >
            <fa-icon
              class="text-common-blue-color"
              [icon]="faAngleRight"
            ></fa-icon>
            We only support csv/xlsx file
          </span>

          <a class="flex items-center gap-1 mt-3">
            <span class="m-1 text-common-blue-color font-inter font-normal">
              <app-common-button-v35
                class="whitespace-nowrap"
                text="Download Sample File"
                [type]="{ name: 'list', style: 'blue' }"
                [disableHoverEffect]="false"
                customClasses="font-extralight p-0"
                backGroundInput="transparent"
                [isAddIcon]="true"
                [icon]="['fas', 'arrow-down-to-line']"
                (clickEvent)="downloadClick()"
                [disabled]="loading"
              ></app-common-button-v35>
            </span>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
<div class="flex justify-start m-auto gap-5 origin-top max-w-[845px] pl-2 py-2">
  <fa-icon class="text-common-blue-color" [icon]="faCircleInfo"></fa-icon>
  <span class="text-sm mt-1 font-inter">
    Please make sure Date format is (mm/dd/yyyy or mm/dd/yy)
  </span>
</div>
