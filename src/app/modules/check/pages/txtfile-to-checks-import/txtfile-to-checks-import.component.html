<section
  class="flex justify-center m-auto gap-5 origin-top max-w-[1300px] mt-8"
>
  <div class="max-w-full w-[65%]">
    <div class="bg-main-background-color rounded-lg py-5 px-6">
      <div class="flex justify-between items-center">
        <div class="flex w-full justify-between">
          <div
            class="text-base !text-[18px] font-semibold text-main-text-color font-inter"
          >
            Import Checks from Text File
          </div>
          <app-common-button-v35
            text="Jobs Report"
            [disabled]="submitting"
            [type]="{ style: 'filled', name: 'main' }"
            backGroundInput="var(--common-green-color)"
            (clickEvent)="goToJobsReport()"
          ></app-common-button-v35>
        </div>
      </div>

      <div class="mt-5">
        <form [formGroup]="importForm">
          <div class="flex flex-col gap-4">
            <div class="grid grid-cols-1 md:grid-cols-2">
              <label
                class="font-inter text-main-text-color font-semibold text-sm"
                for="account"
                >Select Account: <span class="required">*</span></label
              >
              <div class="single_input control_wrap">
                <app-bank-ac-dropdown-v3
                  id="bankAccount"
                  customHeight="2"
                  [formControl]="selectedBank"
                  permissionContext="forPayment"
                  class="multi-import-Bank-ac-dropdown w-full h-full"
                  (clearEvent)="onRemoveBank()"
                ></app-bank-ac-dropdown-v3>
                <app-control-message
                  [control]="importForm.controls.bankAccount"
                  labelName="Please select bank account"
                >
                </app-control-message>
              </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2">
              <label
                class="font-inter text-main-text-color font-semibold text-sm"
                for="file"
                >Select File: <span class="required">*</span></label
              >
              <div class="flex flex-col">
                <app-common-upload-button-v35
                  id="file"
                  buttonText="BROWSE"
                  [acceptedFileTypes]="[
                    '.pdf',
                    '.csv',
                    '.xlsx',
                    '.xls',
                    '.docx',
                    '.doc',
                    '.rtf',
                    '.txt',
                    '.jpg',
                    '.png'
                  ]"
                  (selectedFileEvent)="uploadEvent($event)"
                ></app-common-upload-button-v35>
                <app-control-message
                  [control]="importForm.controls.file"
                  labelName="Please select file"
                >
                </app-control-message>
              </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2">
              <label
                class="font-inter text-main-text-color font-semibold text-sm"
                for="account"
                >Select Type:</label
              >
              <div class="single_input control_wrap">
                <div class="angular-ocw-v35-ng-select-dropdown w-full">
                  <ng-select
                    id="type"
                    appendTo="body"
                    class="ng-dropdown-panel-v35 text-sm select-template-dropdown import-cheques"
                    formControlName="type"
                    [clearable]="false"
                    [searchable]="false"
                  >
                    <ng-option value="1">NIVD</ng-option>
                    <ng-option value="2">IVD</ng-option>
                  </ng-select>
                </div>
              </div>
            </div>

            <div class="flex justify-end">
              <app-common-button-v35
                [type]="{ style: 'filled', name: 'main' }"
                text="Import"
                backGroundInput="var(--common-green-color)"
                (clickEvent)="submit()"
                [loading]="submitting"
                [disabled]="submitting"
              />
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
<div class="flex justify-start m-auto gap-5 origin-top max-w-[845px] pl-2 py-2">
  <fa-icon
    class="text-common-blue-color"
    [icon]="['fas', 'circle-info']"
  ></fa-icon>
  <span class="text-sm mt-1 font-inter">
    Please make sure Date format is (mm/dd/yyyy or mm/dd/yy)
  </span>
</div>
