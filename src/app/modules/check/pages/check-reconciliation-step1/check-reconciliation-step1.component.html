<section
  class="flex justify-center m-auto gap-5 origin-top max-w-[1300px] mt-8"
>
  <div class="max-w-full w-[65%]">
    <div class="bg-main-background-color rounded-lg py-5 px-6">
      <div class="flex justify-between items-center">
        <div>
          <h3 class="text-lg text-main-text-color font-inter font-semibold">
            Reconcile Checks
          </h3>
        </div>
      </div>

      <div class="mt-5">
        <form [formGroup]="importForm">
          <div class="flex flex-col gap-4">
            <div class="grid grid-cols-1 md:grid-cols-2">
              <label
                class="font-inter font-semibold text-main-text-color text-sm"
                for="account"
                >Select Account: <span class="required">*</span></label
              >
              <div class="single_input control_wrap">
                <app-bank-ac-dropdown-v3
                  customHeight="2"
                  [formControl]="selectedBank"
                  class="multi-import-Bank-ac-dropdown w-full h-full"
                  [enableAddNew]="true"
                  (clearEvent)="onRemoveBank()"
                ></app-bank-ac-dropdown-v3>
                <app-control-message-v35
                  [control]="importForm.controls.bankAccount"
                  labelName="Please select bank account"
                >
                </app-control-message-v35>
              </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2">
              <label
                class="font-inter font-semibold text-main-text-color text-sm"
                for="file"
                >Select File: <span class="required">*</span></label
              >
              <div class="flex flex-col">
                <app-common-upload-button-v35
                  buttonText="BROWSE"
                  [acceptedFileTypes]="['.csv', '.xlsx']"
                  (selectedFileEvent)="uploadEvent($event)"
                ></app-common-upload-button-v35>
                <app-control-message-v35
                  [control]="importForm.controls.file"
                  labelName="Please select a file"
                >
                </app-control-message-v35>
              </div>
            </div>

            <div class="flex justify-end">
              <app-common-button-v35
                [type]="{ style: 'filled', name: 'main' }"
                text="Import"
                backGroundInput="var(--common-green-color)"
                (clickEvent)="submit()"
                [loading]="isSubmit()"
                [disabled]="isSubmit()"
              />
            </div>
          </div>
        </form>

        <div class="text-sm flex flex-col">
          <span
            class="mt-3 flex items-center gap-1 font-inter text-main-text-color font-normal"
          >
            <fa-icon
              class="text-common-blue-color"
              [icon]="faAngleRight"
            ></fa-icon>
            Please make sure date format is (mm/dd/yyyy or mm/dd/yy)
          </span>
          <span
            class="mt-3 flex items-center gap-1 font-inter text-main-text-color font-normal"
          >
            <fa-icon
              class="text-common-blue-color"
              [icon]="faAngleRight"
            ></fa-icon>
            We only support csv/xlsx file
          </span>

          <a class="flex items-center gap-1 mt-3">
            <span class="m-1 text-common-blue-color font-inter font-normal">
              <app-common-button-v35
                class="whitespace-nowrap"
                text="Download Sample File"
                [type]="{ name: 'list', style: 'blue' }"
                [disableHoverEffect]="false"
                customClasses="font-extralight p-0"
                backGroundInput="transparent"
                [isAddIcon]="true"
                [icon]="['fas', 'arrow-down-to-line']"
                [disabled]="isSampleFileLoading()"
                (clickEvent)="downloadClick()"
              ></app-common-button-v35>
            </span>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
