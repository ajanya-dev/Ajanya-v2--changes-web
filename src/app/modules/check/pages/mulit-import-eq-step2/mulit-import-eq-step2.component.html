
<div class="table-container bg-main-background-color p-3">
  <div class="main_wrapper table-scroll-container !w-auto">
    <div class="module_main_header">
      <div class="header_title">
        <h3 class="!text-main-text-color font-inter font-semibold">
          <app-common-back-button-v35></app-common-back-button-v35>
          Import From Excel/Csv : Match Your Data
        </h3>
      </div>
    </div>

    <!-- MAIN BODY START -->
    <div class="!max-w-11/12 flex flex-shrink !overflow-auto mt-4">
      <!-- TABLE START -->
      <div class="table">
        <table class="ocw-table ocw-table-striped">
          <thead>
            <tr>
              <th
                [attr.colspan]="headerColumns?.length + 1"
                class="text-left font-medium text-lg p-2 template_name"
              >
                {{ templateName ? templateName : "No template" }}
              </th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td>S.No</td>

              <td *ngFor="let item of headerColumns; let i = index">
                <div class="single_input no_modal_btn">
                  <select
                    placeholder="Base Account"
                    class="input_style min-w-[250px]"
                    [(ngModel)]="item.selectedIndex"
                    (ngModelChange)="mappingChange()"
                  >
                    <option value="" selected>-- Match --</option>
                    <option
                      *ngFor="let option of headerOptions"
                      [value]="option.key"
                      [disabled]="disableMapping[option.key]"
                    >
                      {{ option.value }}
                    </option>
                  </select>
                </div>
              </td>
            </tr>

            <tr *ngIf="data?.fileHeader?.length">
              <td>1</td>
              <td *ngFor="let item of data?.fileHeader">{{ item }}</td>
            </tr>

            <tr *ngFor="let row of checkData; let i = index">
              <td>{{ data?.fileHeader?.length ? i + 2 : i + 1 }}</td>

              <td *ngFor="let item of columnKeys">{{ row[item] }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="flex justify-between flex-wrap gap-2 mt-4 sm_w_full">
      <div class="flex flex-col sm_w_full gap-2">
        <app-common-button-v35
          [type]="{ style: 'filled', name: 'main' }"
          (clickEvent)="toggleShowTemp()"
          text="Save new template"
          width="100%"
          class="max-sm:w-full"
        >
        </app-common-button-v35>
        @if (showSaveTemplate) {
          <div class="flex gap-2 sm_w_full">
            <input
              type="text"
              class="input_style"
              placeholder="Template Name"
              #templateName
            />
            <app-common-button-v35
              [type]="{ style: 'filled', name: 'main' }"
              backGroundInput="var(--common-green-color)"
              (clickEvent)="saveTemplate(templateName)"
              [disabled]="savingTemplate"
              text="Save"
              width="100%"
              class="w-24 max-sm:w-full"
            >
            </app-common-button-v35>
          </div>
        }
      </div>
      <app-common-button-v35
        [type]="{ style: 'filled', name: 'main' }"
        backGroundInput="var(--common-green-color)"
        (clickEvent)="submit()"
        [disabled]="submitting"
        [loading]="submitting"
        text="Submit"
        width="100%"
        class="w-24 max-sm:w-full"
      >
      </app-common-button-v35>
    </div>
  </div>
</div>
