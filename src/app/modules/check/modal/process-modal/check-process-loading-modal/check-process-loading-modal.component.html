<div *ngIf="!loading" class="flex justify-center items-center w-full h-full">
  <div class="flex justify-center items-center w-full h-full">
    <div class="loadingSpinner flex justify-center items-center flex-col"></div>
    <div class="flex flex-col ml-5">
      <p>Processing...</p>
    </div>
  </div>
</div>
<div *ngIf="loading" class="flex justify-center items-center w-full h-full">
  <div class="flex justify-center items-center w-full h-full">
    <div class="loadingSpinner flex justify-center items-center flex-col"></div>
    <div class="flex flex-col ml-5">
      <p>Check Process</p>
      <p *ngIf="complete">Processing...</p>

      <p *ngIf="email">Processing email check...</p>
      <p *ngIf="mail">Processing mail check...</p>
      <p *ngIf="dd">Processing direct deposit check...</p>
      <p *ngIf="print">Processing print check...</p>
    </div>
  </div>
</div>
