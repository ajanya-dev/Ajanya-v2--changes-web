<div class="flex flex-col items-center justify-center gap-3 py-16">
  <div
    class="flex items-center justify-center bg-v4-common-blue-color rounded-full w-20 h-20 blink-animation"
  >
    <lucide-icon
      [img]="SendIcon"
      [size]="32"
      class="text-v4-secondary-brand-color"
    />
  </div>
  <div class="flex flex-col items-center justify-center">
    <h1 class="text-v4-main-text-color text-xl font-semibold font-funnel">
      Processing...
    </h1>
    <p class="text-v4-secondary-text-color text-sm font-peridot">
      {{ processingMessage() }}
    </p>
  </div>
</div>
