<div>

  <!-- ==================== STEP 1: Upload Form ==================== -->
  @if (currentStep() === 1) {

    <!-- Modal Header -->
    <div class="flex justify-between px-6 py-4 bg-v4-popup-header-footer-color border-b border-v4-border-color">
      <div class="flex flex-col">
        <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">Import Checks from Text File</h1>
        <h2 class="text-xs text-v4-subtle-text-color">Upload a .txt file to import checks</h2>
      </div>
      <div [mat-dialog-close]="false" class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center">
        <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
      </div>
    </div>

    <!-- Modal Body -->
    <div class="p-6 bg-v4-tertiary-background-color space-y-5">

      <!-- Bank Account -->
      <div class="space-y-1.5">
        <p class="text-sm font-medium text-v4-main-text-color">
          Bank Account <span class="text-v4-common-red-color">*</span>
        </p>
        <app-bank-ac-dropdown-v4
          [formControl]="selectedBankControl"
          (clearEvent)="onClearBank()"
        />
      </div>

      <!-- File Upload -->
      <div class="space-y-1.5">
        <p class="text-sm font-medium text-v4-main-text-color">
          Select File <span class="text-v4-common-red-color">*</span>
        </p>
        <app-common-upload-button-v4
          [acceptedFileTypes]="['.txt']"
          [uploadedFile]="selectedFile()"
          (selectedFileEvent)="onFileSelected($event)"
          (removingFileName)="onFileRemoved()"
        />
      </div>

      <!-- Import Type -->
      <div class="space-y-1.5">
        <p class="text-sm font-medium text-v4-main-text-color">
          Import Type <span class="text-v4-common-red-color">*</span>
        </p>
        <app-v4-common-dropdown
          [listData]="importTypes"
          [config]="{
            placeholder: 'Select Import Type',
            displayField: 'label',
            outputField: 'value'
          }"
          [clearable]="false"
          [selectedValue]="importType()"
          appendTo="body"
          (valueChange)="onTypeChange($event)"
        />
      </div>

      <!-- Hints -->
      <div class="space-y-1.5 text-sm text-v4-secondary-text-color">
        <div class="flex items-center gap-2">
          <lucide-icon [img]="ChevronRightIcon" [size]="14" class="text-v4-subtle-text-color shrink-0" />
          <span>Please make sure Date format is (mm/dd/yyyy or mm/dd/yy)</span>
        </div>
        <div class="flex items-center gap-2">
          <lucide-icon [img]="ChevronRightIcon" [size]="14" class="text-v4-subtle-text-color shrink-0" />
          <span>Only .txt format is supported</span>
        </div>
      </div>

    </div>

    <!-- Modal Footer -->
    <div class="flex justify-end gap-3 p-6 bg-v4-popup-header-footer-color border-t border-v4-border-color">
      <app-common-button-v4
        [type]="{ style: 'outline', name: 'main' }"
        text="Jobs Report"
        (clickEvent)="goToJobsReport()"
      />
      <app-common-button-v4
        width="140px"
        [type]="{ style: 'primary', name: 'main' }"
        text="Import Checks"
        [loading]="submitting()"
        [disabled]="submitting()"
        (clickEvent)="importChecks()"
      />
    </div>

  }

  <!-- ==================== STEP 2: Review Table ==================== -->
  @if (currentStep() === 2) {
    <app-youngwilliams-import-step2-v4
      (cancel)="onStep2Cancel()"
      (submitSuccess)="onStep2Submit()"
    />
  }

</div>
