<div class="ocw_man_modal_wrapper">
  <div class="ocw_modal_header flex justify-between items-center">
    <div class="ocw_modal_title mail-modal-heading">Update Payee Address</div>
    <div class="close_btn" [mat-dialog-close]="false">
      <svg
        aria-hidden="true"
        focusable="false"
        data-prefix="fal"
        data-icon="times"
        width="15"
        height="30"
        class="svg-inline--fa fa-times fa-w-10"
        role="img"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 320 512"
      >
        <path
          fill="currentColor"
          d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
        ></path>
      </svg>
    </div>
  </div>

  <div class="ocw_modal_body">
    <div class="table-responsive">
      <table class="payee-update-table ocw-table ocw-table-striped">
        <thead>
          <tr>
            <th>S.l</th>
            <th>Check No</th>
            <th>Name</th>
            <th>Address Line 1</th>
            <th>Address Line 2</th>
            <th>City</th>
            <th>State</th>
            <th>Zip</th>
            <th>Country</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let address of allPayeeFromAddress; let i = index">
            <td>{{ address.sl }}</td>
            <td>{{ address.check_no }}</td>
            <td>
              <input
                type="text"
                name="payee-name"
                value="{{ address.name }}"
                id="{{ address.name_i }}"
              />
            </td>
            <td>
              <input
                type="text"
                name="payee_address_line_1"
                id="{{ payee_address_line_1_i }}"
                value="{{ address.address_line_1 }}"
              />
            </td>
            <td>
              <input
                type="text"
                name="payee_address_line_2"
                id="{{ payee_address_line_2_i }}"
                value="{{ address.address_line_2 }}"
              />
            </td>
            <td>
              <input
                type="text"
                name="city"
                id="{{ city_i }}"
                value="{{ adrress.city }}"
              />
            </td>
            <td>
              <input
                type="text"
                name="state"
                id="{{ state_i }}"
                value="{{ adrress.state }}"
              />
            </td>
            <td>
              <input
                type="text"
                name="zip"
                id="{{ zip_i }}"
                value="{{ adrress.zip }}"
              />
            </td>
            <td>
              <select name="country" id="{{ country_i }}">
                <options value="us">US</options>
                <options value="ca">CA</options>
              </select>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="ocw_modal_footer">
    <mat-dialog-actions align="end">
      <button mat-dialog-close class="ocw-btn ocw-btn-modal-bordered">
        Close
      </button>

      <button type="submit" class="ocw-btn ocw-btn-modal-blue add_btn">
        <span>Update</span>

        <!-- <svg
            aria-hidden="true"
            focusable="false"
            data-prefix="fas"
            data-icon="plus"
            class="svg-inline--fa fa-plus fa-w-14"
            role="img"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 448 512"
          >
            <path
              fill="currentColor"
              d="M416 208H272V64c0-17.67-14.33-32-32-32h-32c-17.67 0-32 14.33-32 32v144H32c-17.67 0-32 14.33-32 32v32c0 17.67 14.33 32 32 32h144v144c0 17.67 14.33 32 32 32h32c17.67 0 32-14.33 32-32V304h144c17.67 0 32-14.33 32-32v-32c0-17.67-14.33-32-32-32z"
            ></path>
          </svg> -->
      </button>
    </mat-dialog-actions>
  </div>
</div>
