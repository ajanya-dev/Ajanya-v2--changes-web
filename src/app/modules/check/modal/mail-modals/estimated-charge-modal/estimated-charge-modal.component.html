<div class="flex justify-center items-center flex-col w-full mt-6">
  <div>
    <i class="fa-regular fa-circle-exclamation"></i>
  </div>

  <h1 class="mb-2">Are you sure?</h1>

  <p>{{ errorMsg }}</p>

  <div class="w-full flex justify-around items-center mt-10">
    <button type="button" class="ocw-btn-warning" (click)="close()">
      No,cancel!
    </button>
    <button type="button" class="ocw-btn-violet" (click)="send()">
      Yes, Send
    </button>
  </div>
</div>
