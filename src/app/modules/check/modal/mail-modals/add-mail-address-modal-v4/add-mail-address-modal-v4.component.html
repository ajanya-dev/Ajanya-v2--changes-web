<div class="max-h-[90vh] overflow-y-auto">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Mail {{ isMailFrom() ? "From" : "To" }}
      </h1>
      <h2 class="text-xs text-v4-subtle-text-color">
        Enter the mailing address details
      </h2>
    </div>
    <div
      [matDialogClose]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <fa-icon [icon]="faXmark" class="text-v4-subtle-text-color"></fa-icon>
    </div>
  </div>

  <!-- modal body start -->
  <div class="px-6 py-5 bg-v4-tertiary-background-color">
    <form
      [formGroup]="mailForm"
      class="v4-mail-address-form flex flex-col gap-3"
    >
      <!-- Row 1: Name + Company Name -->
      <div class="grid grid-cols-2 gap-3">
        <app-common-input-v4
          placeholder="Name *"
          formControlName="name"
          [control]="mailForm.controls.name"
        />
        <app-common-input-v4
          placeholder="Company Name"
          formControlName="CompanyName"
          [isFieldRequired]="false"
        />
      </div>

      <!-- Row 2: Phone + Email -->
      <div class="grid grid-cols-2 gap-3">
        <app-phone-input-v4
          placeholder="Phone Number"
          formControlName="phone"
          [isFieldRequired]="false"
          [control]="mailForm.controls.phone"
          [showCountryDropdown]="false"
        />
        <app-common-input-v4
          placeholder="Email"
          formControlName="email"
          [type]="'email'"
          [isFieldRequired]="false"
          [control]="mailForm.controls.email"
        />
      </div>

      <!-- Row 3: Address Line 1 + Address Line 2 -->
      <div class="grid grid-cols-2 gap-3">
        <app-address-autocomplete-v4
          [label]="'Address Line 1'"
          [placeholder]="'Start typing address...'"
          [control]="mailForm.controls.addressLine1"
          [allowedCountries]="['us', 'ca']"
          [isFieldRequired]="true"
          (addressSelected)="onAddressSelected($event)"
        />
        <app-common-input-v4
          placeholder="Apt, Suite, Unit, etc."
          [fieldLabel]="'Address Line 2'"
          formControlName="addressLine2"
          [isFieldRequired]="false"
        />
      </div>

      <!-- Row 4: City + State + Zip + Country -->
      <div class="grid grid-cols-4 gap-3 items-start">
        <div class="flex flex-col">
          <label
            class="block text-sm font-medium text-v4-subtle-text-color mb-1.5 tracking-wide pl-0"
          >
            City <span class="text-v4-common-red-color">*</span>
          </label>
          <app-common-input-v4
            placeholder="City"
            formControlName="city"
            [maxLength]="50"
            [control]="mailForm.controls.city"
          />
        </div>
        <div class="flex flex-col">
          <label
            class="block text-sm font-medium text-v4-subtle-text-color mb-1.5 tracking-wide pl-0"
          >
            State <span class="text-v4-common-red-color">*</span>
          </label>
          <app-common-state-select-v4
            formControlName="state"
            [country]="findCountryCode(mailForm.controls.country.value)"
            [isRequired]="true"
            placeholder="State"
          ></app-common-state-select-v4>
        </div>
        <div class="flex flex-col">
          <label
            class="block text-sm font-medium text-v4-subtle-text-color mb-1.5 tracking-wide pl-0"
          >
            {{
              mailForm.get("country")?.value === "United States" ||
              mailForm.get("country")?.value === ""
                ? "Zip"
                : "Postal Code"
            }}
            <span class="text-v4-common-red-color">*</span>
          </label>
          <app-common-input-v4
            [placeholder]="
              mailForm.get('country')?.value === 'United States' ||
              mailForm.get('country')?.value === ''
                ? 'Zip'
                : 'Postal Code'
            "
            formControlName="Zip"
            [control]="mailForm.controls.Zip"
          />
        </div>
        <div class="flex flex-col min-w-0">
          <label
            class="block text-sm font-medium text-v4-subtle-text-color mb-1.5 tracking-wide pl-0"
          >
            Country <span class="text-v4-common-red-color">*</span>
          </label>
          <app-common-country-select-v4
            formControlName="country"
            bindValue="name"
            [allowedCountries]="
              data.isWalletCheckCustomAddress
                ? { US: 'United States' }
                : undefined
            "
            [isRequired]="true"
            placeholder="Country"
            (countryChange)="onCountryChange($event?.name ?? '')"
          ></app-common-country-select-v4>
        </div>
      </div>

      <!-- Row 6: Note -->
      <app-common-input-v4
        placeholder="Note"
        formControlName="note"
        [maxLength]="150"
        [isFieldRequired]="false"
      />
    </form>
  </div>
  <!-- modal body end -->

  <!-- modal footer -->
  <div
    class="flex justify-end gap-3 px-6 py-4 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    @if (!isForUpdate()) {
      <app-common-button-v4
        mat-dialog-close
        [type]="{ style: 'outline', name: 'main' }"
        [text]="'Cancel'"
        width="100px"
      />
      <app-common-button-v4
        [type]="{ style: 'primary', name: 'main' }"
        [text]="'Add'"
        width="100px"
        [disabled]="isSubmit()"
        [loading]="isSubmit()"
        (clickEvent)="submit()"
      />
    }
    @if (isForUpdate()) {
      <app-common-button-v4
        [type]="{ style: 'outline', name: 'main' }"
        [text]="'Delete'"
        width="100px"
        textColorInput="var(--v4-common-red-color)"
        lucideIcon="trash-2"
        [disabled]="isSubmit() || isDeleting()"
        [loading]="isDeleting()"
        (clickEvent)="deleteid()"
      />
      <app-common-button-v4
        [type]="{ style: 'primary', name: 'main' }"
        [text]="'Update'"
        width="100px"
        [disabled]="!mailForm.valid || isSubmit() || isDeleting()"
        [loading]="isSubmit()"
        (clickEvent)="Update()"
      />
    }
  </div>
</div>
