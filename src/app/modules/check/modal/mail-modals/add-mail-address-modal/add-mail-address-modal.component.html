<div class="ocw_man_modal_wrapper">
  <div class="ocw_modal_header flex justify-between items-center">
    <div class="ocw_modal_title mail-modal-heading">
      Mail {{ isMailFrom ? "From" : "To" }}
    </div>
    <div class="close_btn" [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="['fas', 'xmark']"
      ></fa-icon>
    </div>
  </div>

  <div class="ocw_modal_body">
    <form [formGroup]="mailForm">
      <div class="grid grid-cols-2 gap-2">
        <div class="relative mb-3">
          <input
            type="text"
            name="name"
            value=""
            id="name"
            placeholder=" "
            formControlName="name"
            class="input_style floating_input_field"
          />
          <label for="name" class="floating_label_field">
            Name<span class="required">&nbsp;*</span></label
          >
          <app-control-message
            [control]="mailForm.controls.name"
          ></app-control-message>
        </div>

        <div class="relative mb-3">
          <input
            type="text"
            name="company-name"
            value=""
            id="company-name"
            placeholder=" "
            formControlName="CompanyName"
            class="input_style floating_input_field"
          />
          <label for="name" class="floating_label_field"> Company Name </label>
        </div>

        <div class="relative mb-3">
          <input
            type="text"
            name="phone"
            value=""
            id="phone"
            placeholder=" "
            mask="(000) 000-0000"
            formControlName="phone"
            class="input_style floating_input_field"
          />
          <label for="phone" class="floating_label_field"> Phone Number</label>
          <app-control-message
            [control]="mailForm.controls.phone"
          ></app-control-message>
        </div>

        <div class="relative mb-3">
          <input
            type="email"
            name="email"
            value=""
            id="email"
            placeholder=" "
            formControlName="email"
            class="input_style floating_input_field"
          />
          <label for="email" class="floating_label_field"> Email</label>
        </div>

        <div class="relative mb-3">
          <input
            type="text"
            name="address-line-1"
            value=""
            id="address-line-1"
            placeholder=" "
            #addressLine1
            (focus)="loadGoogleAddress(addressLine1)"
            formControlName="addressLine1"
            class="input_style floating_input_field"
          />
          <label for="address-line-1" class="floating_label_field">
            Address Line 1 <span class="required">&nbsp;*</span>
          </label>
          <app-control-message
            [control]="mailForm.controls.addressLine1"
          ></app-control-message>
        </div>

        <div class="relative mb-3">
          <input
            type="text"
            name="address-line-2"
            value=""
            id="address-line-2"
            placeholder=" "
            formControlName="addressLine2"
            class="input_style floating_input_field"
          />
          <label for="address-line-2" class="floating_label_field">
            Address Line 2
          </label>
        </div>
      </div>

      <div class="mb-3 grid grid-cols-4 gap-2">
        <div class="relative">
          <input
            type="text"
            name="city"
            value=""
            id="city"
            formControlName="city"
            class="input_style floating_input_field"
            placeholder=" "
            maxlength="50"
          />
          <label for="city" class="floating_label_field"
            >City <span class="required">&nbsp;*</span>
          </label>
          <app-control-message
            [control]="mailForm.controls.city"
          ></app-control-message>
        </div>
        <div class="relative">
          <input
            type="text"
            name="state"
            value=""
            id="state"
            formControlName="state"
            class="input_style floating_input_field"
            placeholder=" "
          />
          <label for="city" class="floating_label_field"
            >State<span class="required">&nbsp;*</span>
          </label>
          <app-control-message
            [control]="mailForm.controls.state"
          ></app-control-message>
        </div>
        <div class="relative">
          <input
            type="text"
            name="zip"
            value=""
            id="zip"
            formControlName="Zip"
            class="input_style floating_input_field"
            placeholder=" "
          />
          @if (
            mailForm.get("country")?.value === "United States" ||
            mailForm.get("country")?.value === ""
          ) {
            <label for="city" class="floating_label_field"
              >Zip <span class="required">&nbsp;*</span></label
            >
          } @else {
            <label for="city" class="floating_label_field"
              >Postal Code<span class="required">&nbsp;*</span></label
            >
          }
          <app-control-message
            [control]="mailForm.controls.Zip"
          ></app-control-message>
        </div>
        <div class="relative">
          <select name="" id="country" formControlName="country" class="input_style" placeholder=" ">
            <option selected value="">Country</option>
            @for (item of allowedcountries | keyvalue; track item.key) {
              <option [value]="item.value">
                {{ item.value }}
              </option>
            }
          </select>
          <label for="country" class="floating_label_field">
            Country<span class="required">&nbsp;*</span>
          </label>
          <app-control-message
            [control]="mailForm.controls.country"
          ></app-control-message>
        </div>
      </div>
      <div class="relative">
        <input
          type="text"
          name="note"
          class="input_style floating_input_field"
          maxlength="150"
          formControlName="note"
          id="note"
          placeholder=" "
        />
        <label for="note" class="floating_label_field"> Note </label>
      </div>
    </form>
  </div>
  <div class="ocw_modal_footer">
    <mat-dialog-actions align="end">
      @if (!isForUpdate) {
        <button mat-dialog-close class="ocw-btn ocw-btn-modal-bordered">
          Cancel
        </button>
      }
      @if (!isForUpdate) {
        <button
          (click)="submit()"
          [ngClass]="{ 'disable-btn': disabled }"
          [disabled]="isSubmit"
          type="submit"
          class="ocw-btn ocw-btn-modal-blue add_btn"
        >
          <span>Add</span>
        </button>
      }
      @if (isForUpdate) {
        <button
          (click)="deleteid()"
          [ngClass]="{ disable: disabled }"
          type="submit"
          [disabled]="isSubmit"
          class="ocw-btn-modal-bordered"
        >
          <span>Delete</span>
        </button>
      }
      @if (isForUpdate) {
        <button
          type="submit"
          (click)="Update()"
          [disabled]="!mailForm.valid || isSubmit"
          class="ocw-btn ocw-btn-modal-blue"
        >
          <span>Update</span>
        </button>
      }
    </mat-dialog-actions>
  </div>
</div>
