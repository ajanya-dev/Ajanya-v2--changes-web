<div class="ocw_man_modal_wrapper">
  <div class="ocw_modal_header flex justify-between items-center">
    <div class="ocw_modal_title mail-modal-heading">Update Return Address</div>
    <div class="close_btn" [mat-dialog-close]="false">
      <svg
        aria-hidden="true"
        focusable="false"
        data-prefix="fal"
        data-icon="times"
        width="15"
        height="30"
        class="svg-inline--fa fa-times fa-w-10"
        role="img"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 320 512"
      >
        <path
          fill="currentColor"
          d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
        ></path>
      </svg>
    </div>
  </div>

  <div class="ocw_modal_body">
    <form [formGroup]="EditPayeeForm">
      <!-- <div>
          <input type="text" formControlName="add" >
        </div> -->
      <div class="table-responsive">
        <table class="payee-update-table ocw-table ocw-table-striped">
          <thead>
            <tr>
              <th>S.l</th>
              <th>Check No</th>
              <th>Bank Name</th>
              <th>Address Line 1</th>
              <th>Address Line 2</th>
              <th>City</th>
              <th>State</th>
              <th>Zip</th>
              <th>Country</th>
            </tr>
          </thead>
          <tbody formArrayName="item">
            <tr
              *ngFor="
                let credit of getFormControl()['controls'];
                let i = index;
                let l = last
              "
              [formGroupName]="i"
            >
              <td>{{ i + 1 }}</td>
              <td>
                <input
                  class="custom-input"
                  type="text"
                  name="payee-name"
                  formControlName="checkNo"
                  disabled
                  value=""
                  id=""
                />
              </td>
              <td>
                <input
                  class="custom-input"
                  type="text"
                  name="payee-name"
                  formControlName="name"
                  disabled
                  value=""
                  id=""
                />
                <app-control-message-v35 [control]="credit.get('name')" />
              </td>
              <td>
                <input
                  type="text"
                  name="payee_address_line_1"
                  formControlName="address_line_1"
                  class="payeeaddressline custom-input"
                  (focus)="addressFocus($event, i)"
                  #payeeaddressline1
                  id=""
                  value=""
                />
              </td>
              <td>
                <input
                  class="custom-input"
                  type="text"
                  name="payee_address_line_2"
                  formControlName="address_line_2"
                  id=""
                  value=""
                />
              </td>
              <td>
                <input
                  class="custom-input"
                  type="text"
                  name="city"
                  id=""
                  formControlName="city"
                  value=""
                  maxlength="50"
                />
              </td>
              <td>
                <input
                  class="custom-input"
                  type="text"
                  name="state"
                  id=""
                  formControlName="state"
                  value=""
                />
              </td>
              <td>
                <input
                  class="custom-input"
                  type="text"
                  name="zip"
                  id=""
                  (keypress)="utils.prevantSpecialChar($event)"
                  formControlName="zip"
                  value=""
                />
              </td>
              <td>
                <input
                  style="cursor: no-drop"
                  name="country"
                  formControlName="country"
                  id=""
                  readonly
                  class="custom-input"
                />
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </form>
  </div>

  <div class="ocw_modal_footer">
    <mat-dialog-actions align="end">
      <button
        type="submit"
        class="ocw-btn ocw-btn-modal-blue add_btn"
        [ngClass]="{ 'disable-btn': disabled }"
        (click)="update()"
      >
        <span>Update</span>
      </button>
    </mat-dialog-actions>
  </div>
</div>
