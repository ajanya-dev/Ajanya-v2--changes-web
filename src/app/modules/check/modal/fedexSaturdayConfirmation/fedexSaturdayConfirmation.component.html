<div class="alert_wrapper confirm_alert ">
  <div class="flex justify-center items-center flex-col">
  <!-- header -->
  <div class="alert_header">
    <div class="alert_icon mb-2">
      <img
        ngSrc="assets/images/alert-icons/confirm-icon.svg"
        alt=""
        width="60"
        height="60"
      />
    </div>
  </div>

  <!-- body -->
  <div class="alert_body  flex flex-col items-center text-center">
    <h2 class="title font-bold !text-main-text-color text-[20px] mb-2">Confirm</h2>
    <h3 class="content text-wrap w-[500px] !text-main-text-color text-sm">{{data.message}}</h3>
  </div>
</div>
  <!-- actions -->
  <div class="alert_button_wrapper">
    <button [mat-dialog-close]="false" class="ocw-btn ocw-btn-modal-bordered cancel-btn">Cancel</button>
    <button (click)="processMonday()" class="ocw-btn ocw-btn-modal-blue done_btn">
      Deliver on Monday
    </button>
    <button (click)="processSaturday()" class="ocw-btn ocw-btn-modal-blue done_btn">
      Deliver on Saturday
    </button>
  </div>
</div>
