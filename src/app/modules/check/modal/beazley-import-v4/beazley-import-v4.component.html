<div>
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex items-center gap-3">
      <h1 class="text-xl font-medium text-v4-main-text-color font-funnel">
        Import from Lis File
      </h1>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div
    class="p-6 bg-v4-tertiary-background-color overflow-y-auto max-h-[500px]"
  >
    <form [formGroup]="importForm" class="space-y-4">
      <!-- Select Account -->
      <div class="space-y-1.5">
        <label
          class="text-xs font-medium text-v4-subtle-text-color uppercase tracking-wide"
        >
          Select Account: <span class="text-v4-common-red-color">*</span>
        </label>
        <app-bank-ac-dropdown-v4
          permissionContext="forPayment"
          [formControl]="selectedBankControl"
          class="w-full"
          [enableAddNew]="true"
          [labelIconNeeded]="false"
          append="body"
          (clearEvent)="onClearBank()"
        ></app-bank-ac-dropdown-v4>
        <app-control-message-v4
          [control]="importForm.controls.bankAccount"
          label="Please select bank account"
        />
      </div>

      <!-- Select File -->
      <div class="space-y-1.5">
        <label
          class="text-xs font-medium text-v4-subtle-text-color uppercase tracking-wide"
        >
          Select File: <span class="text-v4-common-red-color">*</span>
        </label>
        <div class="flex items-center gap-2">
          @if (fileName()) {
            <div
              class="flex-1 flex items-center gap-2 px-3 py-2 rounded-lg border border-v4-badge-success-text-color bg-v4-badge-success-bg-color h-[44px]"
            >
              <lucide-icon
                [img]="FileSpreadsheetIcon"
                [size]="16"
                class="text-v4-badge-success-text-color flex-shrink-0"
              ></lucide-icon>
              <span
                class="text-sm text-v4-badge-success-text-color truncate flex-1"
                >{{ fileName() }}</span
              >
              <button
                type="button"
                (click)="clearFile(fileInput)"
                class="text-v4-badge-success-text-color hover:opacity-70 border-none bg-transparent cursor-pointer p-0 flex-shrink-0 flex items-center"
              >
                <lucide-icon [img]="XIcon" [size]="14"></lucide-icon>
              </button>
            </div>
          } @else {
            <div
              class="flex-1 px-3 rounded-lg border border-v4-input-border-color bg-v4-tertiary-background-color text-sm text-v4-subtle-text-color h-[44px] flex items-center"
            >
              No file selected
            </div>
          }
          <app-common-button-v4
            [type]="{ style: 'outline', name: 'main' }"
            [text]="'BROWSE'"
            [lucideIcon]="'upload'"
            [lucideIconSize]="14"
            (clickEvent)="fileInput.click()"
          ></app-common-button-v4>
          <input
            #fileInput
            type="file"
            class="hidden"
            accept=".lis"
            (change)="onFileChange($event)"
          />
        </div>
        <app-control-message-v4
          [control]="importForm.controls.file"
          label="Please select a file"
        />
      </div>
    </form>

    <!-- Import button -->
    <div class="flex justify-end mt-5">
      <app-common-button-v4
        [type]="{ style: 'primary', name: 'main' }"
        text="Import"
        [textColorInput]="'white'"
        (clickEvent)="submit()"
        [disabled]="submitting()"
        [loading]="submitting()"
      />
    </div>

    <!-- Divider -->
    <div class="border-t border-v4-border-color my-4"></div>

    <!-- Helper text -->
    <div class="space-y-2 text-sm">
      <div class="flex items-center gap-2 text-v4-main-text-color">
        <lucide-icon
          [img]="ChevronRightIcon"
          [size]="14"
          class="text-v4-primary-brand-bold-color"
        ></lucide-icon>
        <span>We only support lis file</span>
      </div>
    </div>
  </div>
  <!-- modal body end -->

  <!-- modal footer -->
  <div
    class="flex gap-3 px-6 py-4 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    @if (loadingSampleFile()) {
      <div
        class="h-5 w-40 rounded bg-v4-border-color animate-pulse"
        aria-hidden="true"
      ></div>
    } @else if (sampleFileUrl()) {
      <a
        [href]="sampleFileUrl()"
        class="inline-flex items-center gap-2 text-v4-primary-brand-bold-color hover:underline text-sm cursor-pointer font-semibold"
      >
        <lucide-icon [img]="DownloadIcon" [size]="14"></lucide-icon>
        <span>Download Sample File</span>
      </a>
    }
  </div>
</div>
