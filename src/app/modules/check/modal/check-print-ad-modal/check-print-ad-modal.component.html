<div class="ocw_man_modal_wrapper">
  <div class="ocw_modal_header">
    <p>Mail My Check For <span>&#36;1.25</span></p>
    <div class="close_btn" [mat-dialog-close]="false">
      <svg
        aria-hidden="true"
        focusable="false"
        data-prefix="fal"
        data-icon="times"
        class="svg-inline--fa fa-times fa-w-10"
        role="img"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 320 512"
      >
        <path
          fill="currentColor"
          d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
        ></path>
      </svg>
    </div>
  </div>

  <div class="ocw_modal_body">
    <div class="image-section">
      <img src="../../../../../assets/images/fedex.svg" alt="FedEx" />
      <img src="../../../../../assets/images/usps.svg" alt="FedEx" />
    </div>
    <div class="content-section">
      <div>
        <ng-container *ngFor="let item of content">
          <mat-checkbox checked="true"> {{ item }} </mat-checkbox>
        </ng-container>
      </div>
    </div>
  </div>
  <div class="ocw_modal_footer">
    <mat-dialog-actions>
      <button class="ocw-btn ocw-btn-light-blue" (click)="modalClose('print')">
        Print Now
      </button>
      <button
        class="ocw-btn ocw-btn-gradient submit-btn"
        (click)="modalClose('mail')"
      >
        <span>Mail Now</span>
      </button>
    </mat-dialog-actions>
  </div>
</div>
