<div class="ocw_man_modal_wrapper add_bank_modal overflow-auto">
  <div class="flex justify-between pb-6">
    <div>
      <span
        class="mt-18 w-full text-base text-main-text-color align-middle flex items-center"
      >
        <span class="pl-1 font-inter font-semibold text-base pb-0.5"
          >DIRECT DEPOSIT</span
        >
      </span>
    </div>
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="['fas', 'xmark']"
      ></fa-icon>
    </div>
  </div>

  <!-- modal body start -->
  <div class="ocw_modal_body">
    <div class="ocw_table_wrapper">
      <form>
        <table class="ocw-table ocw-table-base">
          <thead>
            <tr>
              <th class="text-left">Payee To</th>
              <th class="text-left">Email Address</th>
              <th class="text-left">Amount</th>
              <th class="text-left">Payee Bank Accounts</th>
            </tr>
          </thead>
          <ng-container>
            <tbody class="text-sm">
              <tr>
                <td class="text-left">{{ data?.payees[0]?.name }}</td>
                <td class="text-left">{{ data?.payees[0]?.email }}</td>
                <td class="text-left">{{ data?.amount }}</td>
                <td class="text-left">
                  <div class="single_input flex">
                    <app-drop-down-payee-bank
                      class="w-full"
                      [data]="payeeBankDetails"
                      [payeeDetails]="payeeBankDetails"
                      [selectedPayeeName]="defaultCDPayeeBank?.bankName"
                      (selectionChange)="getSelectedPayeeBank($event)"
                    >
                    </app-drop-down-payee-bank>
                    <!-- <ng-template> -->
                    <div
                      class="add_modal_btn !py-2"
                      (click)="addBankAccountToPayeeModal()"
                      role="presentation"
                    >
                      <fa-icon [icon]="['fas', 'plus']"></fa-icon>
                    </div>
                    <!-- </ng-template> -->
                  </div>
                </td>
              </tr>
            </tbody>
          </ng-container>
        </table>
      </form>
    </div>
  </div>
  <!-- modal body end  -->

  <div class="ocw_modal_footer">
    <div class="action_button">
      <app-common-button-v35
        width="140px"
        [type]="{ style: 'modal', name: 'main' }"
        [disabled]="loading"
        [loading]="loading"
        text="Process Now"
        (clickEvent)="onProcess()"
      ></app-common-button-v35>
    </div>
  </div>
</div>
