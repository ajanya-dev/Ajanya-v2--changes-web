<div class="bg-v4-main-background-color">
  <div>
    <!-- Page Header -->
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-v4-main-text-color">More</h1>
      <p class="text-sm text-v4-tertiary-text-color mt-1">
        Additional tools and features to help manage your finances
      </p>
    </div>

    <!-- Search Bar -->
    <div class="relative mb-8 max-w-sm">
      <span
        class="absolute left-3 top-1/2 -translate-y-1/2 flex items-center pointer-events-none text-v4-tertiary-text-color"
      >
        <lucide-icon name="search" [size]="16" />
      </span>
      <input
        type="text"
        placeholder="Search tools and features..."
        [ngModel]="searchQuery()"
        (ngModelChange)="searchQuery.set($event)"
        class="w-full pl-10 pr-4 py-2.5 text-sm rounded-xl border border-v4-border-color bg-v4-secondary-background-color text-v4-main-text-color placeholder:text-v4-tertiary-text-color focus:outline-none focus:ring-2 focus:ring-v4-primary-brand-color/30 focus:border-v4-primary-brand-color transition-all"
      />
    </div>

    <!-- Items Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      @for (item of filteredItems(); track item.title) {
        <button
          type="button"
          class="more-item-card group relative overflow-hidden w-full text-left bg-v4-secondary-background-color border border-v4-border-color rounded-xl p-6 flex flex-col gap-4 hover:border-v4-primary-brand-bold-color transition-all duration-200 cursor-pointer"
          [class.pointer-events-none]="loadingRoute() === item.route"
          [class.opacity-70]="loadingRoute() === item.route"
          (click)="navigate(item.route)"
        >
          <!-- Icon -->
          <div
            class="w-14 h-14 rounded-xl flex items-center justify-center flex-shrink-0 group-hover:scale-110 transition-transform duration-200"
            [style.background]="item.iconBgLight"
          >
            <div class="rounded-lg p-2.5" [style.background]="item.iconBg">
              <lucide-icon [name]="item.icon" [size]="25" class="text-white" />
            </div>
          </div>

          <!-- Coming Soon badge: top-right (< 1024px and > 1024px) -->
          @if (item.comingSoon) {
            <span class="lg:hidden xl:inline-flex absolute top-6 right-6 inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-v4-primary-brand-color text-white shrink-0">
              <lucide-icon name="sparkles" [size]="11" />
              Coming Soon
            </span>
          }

          <!-- Text -->
          <div>
            <h3 class="text-sm font-bold text-v4-main-text-color mb-2">
              {{ item.title }}
            </h3>
            <p class="text-xs text-v4-tertiary-text-color leading-relaxed">
              {{ item.description }}
            </p>
            <!-- Coming Soon badge: below description only at exactly 1024px (lg) -->
            @if (item.comingSoon) {
              <span class="hidden lg:inline-flex xl:hidden items-center gap-1.5 mt-3 px-3 py-1 rounded-full text-xs font-semibold bg-v4-primary-brand-color text-white">
                <lucide-icon name="sparkles" [size]="11" />
                Coming Soon
              </span>
            }
          </div>

          <!-- Loading spinner or Arrow: absolute bottom-right -->
          @if (loadingRoute() === item.route) {
            <div class="absolute bottom-6 right-6">
              <lucide-icon
                name="loader-circle"
                [size]="18"
                class="animate-spin text-v4-primary-brand-color"
              />
            </div>
          } @else {
            <div
              class="absolute bottom-6 right-6 opacity-0 group-hover:opacity-100 transition-opacity duration-200"
            >
              <lucide-icon
                name="arrow-right"
                [size]="18"
                class="text-v4-primary-brand-bold-color"
              />
            </div>
          }
        </button>
      }

      <!-- Empty state -->
      @if (filteredItems().length === 0) {
        <div class="col-span-full flex flex-col items-center justify-center py-16 text-center">
          <div
            class="w-16 h-16 bg-v4-input-background-color rounded-full flex items-center justify-center mx-auto mb-4"
          >
            <lucide-icon
              name="search"
              [size]="24"
              class="text-v4-subtle-text-color"
            />
          </div>
          <h3 class="text-sm font-bold text-v4-main-text-color mb-2">
            No results found
          </h3>
          <p class="text-xs text-v4-secondary-text-color">
            Try adjusting your search to find what you're looking for
          </p>
        </div>
      }
    </div>
  </div>
</div>
