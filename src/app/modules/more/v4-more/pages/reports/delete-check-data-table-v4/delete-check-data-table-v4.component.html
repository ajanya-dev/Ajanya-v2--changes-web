<div class="bg-v4-main-background-color">
  <div [ngClass]="{ blur: isBlur() }">
    <app-v4-page-header [title]="'Delete Checks'" [showBackButton]="true" />
    <app-v4-data-table
      [columnDefs]="columnDefs"
      [tableId]="tableId"
      [frameworkComponents]="frameworkComponents"
      (headerButtonEvent)="headerButtonClick($event)"
      [headerElements]="headerElements()"
      [filterAndExportLoadingInput]="loading()"
      (reportExportEvent)="exportData($event)"
    >
    </app-v4-data-table>
  </div>
</div>
