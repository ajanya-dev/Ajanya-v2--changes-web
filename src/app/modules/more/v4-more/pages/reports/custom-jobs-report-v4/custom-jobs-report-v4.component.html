<div class="bg-v4-main-background-color">
  <div>
    <app-v4-page-header
      class="block mb-3"
      title="Jobs Report"
      subtitle="Track the files processed by your custom jobs"
      [showBackButton]="true"
    />
    <app-v4-data-table
      [columnDefs]="columnDefs"
      [tableId]="tableId"
      [frameworkComponents]="frameworkComponents"
      [freeColumnResize]="false"
      [defaultDisabledColumn]="alwaysShownFields"
      [fieldsShownByDefault]="alwaysShownFields"
      [useCustomEmptyState]="true"
      [emptyStateConfig]="{
        icon: 'briefcase',
        title: 'No jobs yet',
        description:
          'Jobs triggered from your reports will appear here once the first one runs',
        buttonText: ''
      }"
    >
    </app-v4-data-table>
  </div>
</div>
