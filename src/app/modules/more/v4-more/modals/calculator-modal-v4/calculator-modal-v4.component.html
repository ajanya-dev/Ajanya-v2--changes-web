<div class="w-full" cdkDrag cdkDragRootElement=".cdk-overlay-pane">
  <!-- Header -->
  <div class="flex justify-between items-center px-6 py-4 bg-v4-popup-header-footer-color border-b border-v4-border-color cursor-move" cdkDragHandle>
    <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">Calculator</h1>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon name="x" [size]="18" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- Body -->
  <div class="p-4 bg-v4-secondary-background-color flex flex-col gap-3">

    <!-- Display -->
    <div class="rounded-xl px-4 py-3 flex flex-col items-end min-h-[72px] justify-end"
         style="background: var(--v4-primary-brand-color)">
      <div class="text-white/70 text-sm min-h-[20px] truncate max-w-full text-right">{{ input }}</div>
      <div class="text-white text-2xl font-semibold truncate max-w-full text-right">
        {{ result || displayValue }}
      </div>
    </div>

    <!-- Copy Result -->
    <button
      type="button"
      (click)="copyResult()"
      class="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl border border-v4-border-color bg-v4-tertiary-background-color text-v4-main-text-color text-sm font-medium hover:opacity-80 transition-opacity"
    >
      <lucide-icon [name]="copied ? 'check' : 'copy'" [size]="15" />
      {{ copied ? 'Copied!' : 'Copy Result' }}
    </button>

    <!-- Button Grid (4 cols) -->
    <div class="grid grid-cols-4 gap-2">
      <!-- Row 1: AC, ⌫, ÷, × -->
      <button type="button" (click)="allClear()"
        class="calc-btn calc-ac-btn font-semibold">AC</button>
      <button type="button" (click)="clear()"
        class="calc-btn calc-operator-btn">
        <lucide-icon name="delete" [size]="16" />
      </button>
      <button type="button" (click)="pressOperator('/')"
        class="calc-btn calc-operator-btn font-semibold">÷</button>
      <button type="button" (click)="pressOperator('*')"
        class="calc-btn calc-operator-btn font-semibold">×</button>

      <!-- Row 2: 7, 8, 9, - -->
      <button type="button" (click)="pressNum('7')" class="calc-btn calc-num-btn">7</button>
      <button type="button" (click)="pressNum('8')" class="calc-btn calc-num-btn">8</button>
      <button type="button" (click)="pressNum('9')" class="calc-btn calc-num-btn">9</button>
      <button type="button" (click)="pressOperator('-')"
        class="calc-btn calc-operator-btn font-semibold">−</button>

      <!-- Row 3: 4, 5, 6, + -->
      <button type="button" (click)="pressNum('4')" class="calc-btn calc-num-btn">4</button>
      <button type="button" (click)="pressNum('5')" class="calc-btn calc-num-btn">5</button>
      <button type="button" (click)="pressNum('6')" class="calc-btn calc-num-btn">6</button>
      <button type="button" (click)="pressOperator('+')"
        class="calc-btn calc-operator-btn font-semibold">+</button>

      <!-- Row 4: 1, 2, 3, = -->
      <button type="button" (click)="pressNum('1')" class="calc-btn calc-num-btn">1</button>
      <button type="button" (click)="pressNum('2')" class="calc-btn calc-num-btn">2</button>
      <button type="button" (click)="pressNum('3')" class="calc-btn calc-num-btn">3</button>
      <button type="button" (click)="getAnswer()"
        style="color: #000"
        class="calc-btn bg-v4-secondary-brand-color font-semibold">=</button>
    </div>

    <!-- Row 5: ., 0, 00 (3 equal cols) -->
    <div class="grid grid-cols-3 gap-2">
      <button type="button" (click)="pressNum('.')" class="calc-btn calc-num-btn">.</button>
      <button type="button" (click)="pressNum('0')" class="calc-btn calc-num-btn">0</button>
      <button type="button" (click)="pressDoubleZero()" class="calc-btn calc-num-btn">00</button>
    </div>

  </div>

  <!-- Footer -->
  <div class="px-4 py-4 bg-v4-popup-header-footer-color border-t border-v4-border-color">
    <app-common-button-v4
      [mat-dialog-close]="false"
      [type]="{ style: 'outline', name: 'main' }"
      text="Close"
      width="100%"
    />
  </div>
</div>
