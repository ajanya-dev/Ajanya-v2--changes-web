<div class="ocw_man_modal_wrapper">
  <!-- modal header -->
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">Request To Payout</div>
    <div class="close_btn" [mat-dialog-close]="false">
      <img
        src="./../../../../assets/icon/close-icon.svg"
        type="image/svg+xml"
        alt="Close Icon"
      />
    </div>
  </div>
  <!-- modal body start -->
  <div [formGroup]="earningFrom" class="ocw_modal_body">
    <ng-container>
      <input
        minlength="3"
        maxlength="10"
        type="text"
        class="input_style ng-untouched"
        placeholder="Approved Amount"
        maxlength="40"
        prefix="$"
        mask="separator.2"
        thousandSeparator=","
        formControlName="requestPayoutAmount"
      />
      <div class="note_message">
        Note: Only withdrawal requests for amounts greater than $100 will be
        processed.
      </div>
    </ng-container>
  </div>
  <!-- modal body end -->
  <div class="footer">
    <mat-dialog-actions class="buttons">
      <button
        (click)="requestPayout()"
        type="submit"
        class="ocw-btn ocw-btn-modal-blue add_btn download_btn"
      >
        <span *ngIf="loading" class="loadingSpinner"></span>
        Request
      </button>
    </mat-dialog-actions>
  </div>
</div>
