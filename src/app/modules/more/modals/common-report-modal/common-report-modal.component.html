<div class="ocw_man_modal_wrapper">
  <!-- modal header -->
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">Download Report</div>
    <div class="close_btn" [mat-dialog-close]="false">
      <svg
        aria-hidden="true"
        focusable="false"
        data-prefix="fal"
        data-icon="times"
        class="svg-inline--fa fa-times fa-w-10"
        role="img"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 320 512"
      >
        <path
          fill="currentColor"
          d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
        ></path>
      </svg>
    </div>
  </div>
  <!-- modal body start -->
  <div class="ocw_modal_body" [formGroup]="reportForm">
    <div
      class="row"
      style="margin-top: 20px"
      *ngIf="reportFormMetaData.fromDate?.show"
    >
      <div class="items_name">Date Range</div>
      <div class="select_items">
        <app-date-range-main
          (selectedRange)="selectedRange($event)"
        ></app-date-range-main>
      </div>
    </div>
    <div
      class="row"
      style="margin-top: 20px"
      *ngIf="reportFormMetaData.type?.show"
    >
      <div class="items_name">Select Type</div>
      <div class="select_items">
        <select
          formControlName="type"
          placeholder="Select File"
          class="input_style"
        >
          <option value="1">NIVD</option>
          <option value="2">IVD</option>
        </select>
      </div>
    </div>

    <div
      class="row"
      style="margin-top: 20px"
      *ngIf="reportFormMetaData.formate?.show"
    >
      <div class="items_name">File Format</div>
      <div class="file_formates">
        <div
          class="formate"
          [ngClass]="{ selected_item: selectedFormate === 'pdf' }"
          (click)="selectFileFormate('pdf')"
        >
          PDF
        </div>
        <!-- <div class="formate" [ngClass]="{'selected_item': selectedFormate === 'excel'}"
                        (click)="selectFileFormate('excel')">EXCEL</div>
                    <div class="formate" [ngClass]="{'selected_item': selectedFormate === 'csv'}"
                        (click)="selectFileFormate('csv')">CSV</div> -->
      </div>
    </div>
  </div>
  <!-- modal body end -->
  <div class="footer flex justify-center">
    <button
      type="submit"
      class="ocw-btn ocw-btn-light-green download_btn mt-2"
      [disabled]="loading"
      (click)="generateReport()"
    >
      Download
    </button>
  </div>
</div>
