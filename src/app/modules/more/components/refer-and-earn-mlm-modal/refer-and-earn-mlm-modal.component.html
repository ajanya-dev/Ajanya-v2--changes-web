<div class="px-[6px] pb-[6px] font-inter">
  <div class="flex justify-end pb-6">
    <fa-icon
      [mat-dialog-close]="false"
      class="text-secondary-text-color cursor-pointer rotate-45"
      [icon]="faPlus"
    ></fa-icon>
  </div>
  <div>
    <div class="text-center font-medium text-main-text-color">
      Multilevel Commission Structure
    </div>
    <div class="h-5"></div>
    <div class="flex justify-between">
      @for (item of data; track item) {
        <div
          class="w-[357px] p-3 rounded-2xl bg-secondary-background-color flex flex-col gap-4"
          [ngClass]="{ 'h-fit': !item?.breakDowns?.title }"
        >
          <div
            class="w-full h-10 rounded-lg bg-main-background-color flex items-center justify-center text-secondary-text-color text-sm font-medium"
          >
            {{ item.heading }}
          </div>
          <div class="flex flex-col gap-1 items-start text-sm p-3 min-h-[88px]">
            <span class="text-main-text-color font-medium">
              {{ item.desc.descHeader }}
            </span>
            <span class="font-normal text-secondary-text-color">
              {{ item.desc.desc }}
            </span>
          </div>
          @if (item?.breakDowns) {
            <div
              class="w-full rounded-lg bg-main-background-color p-3 text-sm flex flex-col gap-2"
            >
              <span class="text-main-text-color font-medium">
                {{ item?.breakDowns?.title }}
              </span>
              <div class="flex flex-col gap-1.5 text-secondary-text-color">
                @for (bd of item?.breakDowns?.values; track bd) {
                  <div class="flex justify-between">
                    <span>{{ bd.name }}</span>
                    <span class="italic">{{ bd.value }}</span>
                  </div>
                }
              </div>
            </div>
          }
        </div>
      }
    </div>
  </div>
</div>
