<div class="ocw_one_side_body">
  <div class="ocw_header">
    <div class="title">
      <!-- <h3>My Heading</h3> -->
    </div>
    <div class="title">
      <h3>Available Balance : {{ balance | currency }}</h3>
    </div>
  </div>
  <hr class="header_border" />

  <!-- main body -->
  <div class="ocw_body">
    <form [formGroup]="radeemForm" (ngSubmit)="onSubmit()">
      <div class="radeem_form">
        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="name"
          />
          <span class="floating_label_field"
            >Name<span class="required">*</span></span
          >
          <app-control-message
            [control]="radeemForm.controls.name"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="phone"
          />
          <span class="floating_label_field"
            >Phone<span class="required">*</span></span
          >
          <app-control-message
            [control]="radeemForm.controls.phone"
          ></app-control-message>
        </div>
        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="email"
          />
          <span class="floating_label_field"
            >Email<span class="required">*</span></span
          >
          <app-control-message
            [control]="radeemForm.controls.email"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="address1"
            #addressSearch
            (click)="loadGoogleAddress(addressSearch)"
          />
          <span class="floating_label_field"
            >Address Line 1<span class="required">*</span></span
          >
          <app-control-message
            [control]="radeemForm.controls.address1"
          ></app-control-message>
        </div>
        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="address2"
          />
          <span class="floating_label_field">Address Line 2</span>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="city"
          />
          <span class="floating_label_field"
            >City<span class="required">*</span></span
          >
          <app-control-message
            [control]="radeemForm.controls.city"
          ></app-control-message>
        </div>
        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="state"
          />
          <span class="floating_label_field">State</span>
          <app-control-message
            [control]="radeemForm.controls.state"
          ></app-control-message>
        </div>
        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="zip"
          />
          <span class="floating_label_field">Zip</span>
          <app-control-message
            [control]="radeemForm.controls.zip"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="amount"
            (keypress)="utils.numberOnly($event, 'decimal')"
          />
          <span class="floating_label_field">Withdrawal Amount</span>
          <app-control-message
            [control]="radeemForm.controls.amount"
          ></app-control-message>
        </div>
      </div>

      <div class="btn">
        <button
          type="submit"
          class="ocw-btn ocw-btn-light-green add_btn"
          [disabled]="btnDisable"
        >
          <span *ngIf="btnDisable" class="loadingSpinner"></span>
          SUBMIT
        </button>
      </div>
    </form>
  </div>
</div>
