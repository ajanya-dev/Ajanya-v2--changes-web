<div class="ocw_one_side_body">
  <div class="ocw_header">
    <div class="title">
      <h3>Referral List</h3>
    </div>
  </div>
  <hr class="header_border" />

  <!-- main body -->
  <div class="ocw_body">
    <div class="ocw_table_wrapper">
      <table class="ocw-table ocw-table-striped">
        <thead>
          <tr>
            <td>S.I</td>
            <td>Ip Address</td>
            <td>Clicked</td>
            <td>Sign Up</td>
            <td>Subscribed</td>
            <td>Total</td>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let item of referalDetails; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ item.ipAddress }}</td>
            <td>{{ item.clicked }}</td>
            <td>{{ item.signUp }}</td>
            <td>{{ item.subscribed }}</td>
            <td>
              <span class="total_amount" (click)="viewActivity(item.ip)">{{
                item.total
              }}</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
