@if(!isLoading){
<div class="main-container">
  <!-- Header -->
  <div class="header-container">
    <div class="flex items-center justify-between">
      <div class="main-header">
        <h1>Reports</h1>
      </div>
      <!-- Search Box -->
      <div class="input-icons">
        <i class="fa-solid fa-magnifying-glass icon"></i>
        <input
          type="search"
          class="input_style input-field"
          name="search"
          id="search"
          [(ngModel)]="searchInput"
          placeholder="Search"
        />
      </div>
    </div>
    <div class="main-border"></div>
  </div>

  <!-- Content -->
  <div class="main-section flex justify-center">
    <!-- Cards Container -->
    <div class="cards-container grid grid-cols-1 md:grid-cols-5 lg:grid-cols-5">
      @for(card of reportItems | searchFilter: searchInput; track card){
        <div>
          <div class="business-card">
            <div class="upper-card flex justify-center items-center">
              <img [ngSrc]="card?.icon" alt="{{ card.product_name }}" width="30" height="30" />
              <h1 class="ml-3 card-text">{{ card.name }}</h1>
            </div>
            <div class="description-text">
              <p>{{ card.description }}</p>
            </div>
            <div class="lower-card flex justify-center">
              @if(card.isComingSoon){
                <button class="coming-soon-btn">
                  Coming Soon
                </button>
              }@else {
                <div>
                  <button class="apply-now-btn" (click)="getReport(card?.id)">
                    Get Report
                  </button>
                </div>
              }
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
}

@if (isLoading) {
  <div class="w-full h-full">
      <span class="data_spinner"></span>
  </div>
}
