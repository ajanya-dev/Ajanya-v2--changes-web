<div class="data-table-wrapper">
  <div class="data-table-wrapper bg-main-background-color flex-1 rounded"
  [ngClass]="{'blur':isBlur()}">
    <div class="px-5 pt-3">
      <app-v3-data-table dynamicHeaderText="Delete Checks" [columnDefs]="columnDefs" [tableId]="tableId"
        [frameworkComponents]="frameworkComponents" [backButtonEnabled]="true" (headerButtonEvent)="headerButtonClick($event)"
        [headerElements]="headerElements()" [filterAndExportLoadingInput]="loading()" (reportExportEvent)="exportData($event)">
      </app-v3-data-table>
    </div>
  </div>
</div>
