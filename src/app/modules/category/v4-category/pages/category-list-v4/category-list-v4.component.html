<div class="flex flex-col h-full w-full">
  <div class="main-container flex flex-col h-full w-full rounded">
    <app-v4-page-header
      [title]="'Category'"
      subtitle="Organize and manage transaction categories"
      [actions]="headerActions"
      [showBackButton]="true"
      backButtonType="takeEvent"
      (backEvent)="goBack()"
      (actionClick)="onHeaderAction($event)"
    />

    <div class="flex flex-1 flex-col min-h-0 mt-5">
      <app-v4-data-table
        [defaultColumnFields]="columnFields"
        [tableId]="tableId"
        [useCustomEmptyState]="true"
        [emptyStateConfig]="{
          icon: 'tag',
          title: 'No categories yet',
          description: 'Create your first category to organize and group your transactions',
          buttonText: 'New Category'
        }"
        (emptyStateActionClick)="openAddModal()"
        [headerElements]="headerElements()"
        [frameworkComponents]="frameworkComponents"
        [fieldsShownByDefault]="[
          'id',
          'action',
          'catagory_name',
          'catagory_type',
          'category_status'
        ]"
        (headerButtonEvent)="headerButtonClick($event)"
        (cellRendererIdEvent)="cellRendererActionClick($event)"
      />
    </div>
  </div>
</div>
