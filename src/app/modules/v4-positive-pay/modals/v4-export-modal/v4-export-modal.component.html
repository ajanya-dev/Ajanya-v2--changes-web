<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Export Positive Pay File
      </h1>
      <h2 class="text-xs text-v4-subtle-text-color">
        Select date range and export format
      </h2>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <form [formGroup]="exportForm" class="flex flex-col gap-5">
      <app-v4-date-range-selector
        (dateEmiter)="selectedRange($event)"
        selectDate="today"
      />
      <div class="flex items-center gap-5">
        <span class="text-sm font-medium text-v4-main-text-color"
          >Export As:</span
        >
        <mat-radio-group
          aria-label="Select an option"
          formControlName="fileType"
          class="flex gap-5"
        >
          <mat-radio-button value="txt">
            <span class="text-sm text-v4-subtle-text-color">TXT</span>
          </mat-radio-button>
          <mat-radio-button value="csv">
            <span class="text-sm text-v4-subtle-text-color">CSV</span>
          </mat-radio-button>
          <mat-radio-button value="xlsx">
            <span class="text-sm text-v4-subtle-text-color">EXCEL</span>
          </mat-radio-button>
        </mat-radio-group>
      </div>
    </form>
  </div>
  <!-- modal body end -->

  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Export"
      (clickEvent)="submit()"
      [disabled]="isSubmitting()"
      [loading]="isSubmitting()"
    />
  </div>
</div>
