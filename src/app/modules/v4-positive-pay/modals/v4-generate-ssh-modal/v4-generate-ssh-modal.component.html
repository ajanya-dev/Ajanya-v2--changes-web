<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Generate SSH File
      </h1>
      <h2 class="text-xs text-v4-subtle-text-color">
        Create or import an SSH key pair
      </h2>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <div [formGroup]="sshForm" class="flex flex-col gap-4">
      <div>
        <label
          class="block text-sm font-medium text-v4-secondary-text-color mb-1"
          >File Name <span class="text-v4-common-red-color">*</span></label
        >
        <app-common-input-v4
          placeholder="File Name"
          formControlName="fileName"
          [maxlength]="40"
        />
        <app-control-message-v4 [control]="sshForm.controls.fileName" />
      </div>
      <div>
        <label
          class="block text-sm font-medium text-v4-secondary-text-color mb-1"
          >Auth Type <span class="text-v4-common-red-color">*</span></label
        >
        <app-v4-common-dropdown
          formControlName="sshType"
          [listData]="sshTypeOptions"
          [config]="{
            placeholder: 'Select auth type',
            displayField: 'label',
            outputField: 'value'
          }"
          [clearable]="false"
          [appendTo]="'body'"
        />
        <app-control-message-v4 [control]="sshForm.controls.sshType" />
      </div>
      <div>
        <label
          class="block text-sm font-medium text-v4-secondary-text-color mb-1"
          >RSA Size <span class="text-v4-common-red-color">*</span></label
        >
        <app-v4-common-dropdown
          formControlName="rsaSize"
          [listData]="rsaSizeOptions"
          [config]="{ placeholder: 'RSA Size' }"
          [clearable]="false"
          [appendTo]="'body'"
        />
        <app-control-message-v4 [control]="sshForm.controls.rsaSize" />
      </div>
      @if (showTextArea()) {
        <div>
          <textarea
            style="height: 160px"
            formControlName="privateKey"
            class="w-full rounded-lg border border-v4-border-color bg-v4-secondary-background-color text-v4-main-text-color text-sm p-3 resize-none focus:outline-none placeholder:text-v4-subtle-text-color"
            placeholder="Private Key"
          ></textarea>
          <app-control-message-v4 [control]="sshForm.controls.privateKey" />
        </div>
      }
    </div>
  </div>
  <!-- modal body end -->

  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Save"
      (clickEvent)="submit()"
      [disabled]="isSubmitting()"
      [loading]="isSubmitting()"
    />
  </div>
</div>
