<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <div class="flex items-center gap-2">
        <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
          Set Bank Accounts
        </h1>
        <lucide-icon
          [img]="InfoIcon"
          [size]="16"
          class="text-v4-subtle-text-color cursor-pointer"
          matTooltip="Choose the bank accounts to set Positive Pay"
        />
      </div>
      <h2 class="text-xs text-v4-subtle-text-color">
        Choose the bank accounts to set Positive Pay
      </h2>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color flex flex-col gap-4">
    <div class="flex items-center gap-2">
      <input
        type="checkbox"
        id="selectAllAccounts"
        [(ngModel)]="isSelectAll"
        (change)="selectAll($event)"
        class="cursor-pointer"
      />
      <label
        for="selectAllAccounts"
        class="text-sm text-v4-main-text-color cursor-pointer"
      >
        Select All
      </label>
    </div>
    <app-bank-multi-select-dropdown-v4
      [routingNumber]="routingNumber"
      [selectedBankAccounts]="bankAccounts"
      [selectAll]="isChecked"
      placeholder="All Bank Accounts"
      appendTo="body"
      (selectionEvent)="bankSlectionEvent($event)"
    />
  </div>
  <!-- modal body end -->

  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Save"
      (clickEvent)="save()"
      [disabled]="isSubmitting()"
      [loading]="isSubmitting()"
    />
  </div>
</div>
