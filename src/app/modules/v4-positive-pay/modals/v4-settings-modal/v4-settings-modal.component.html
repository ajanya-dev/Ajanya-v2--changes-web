<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Set Positive Pay Details
      </h1>
      <h2 class="text-xs text-v4-subtle-text-color">
        Configure metadata for file uploads
      </h2>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <div [formGroup]="settingsForm" class="flex flex-col gap-4">
      <div>
        <app-common-input-v4
          placeholder="Bank Id"
          formControlName="bankId"
          [fieldLabel]="'Bank Id'"
          [isFieldRequired]="false"
          [maxlength]="40"
        />
        <app-control-message-v4 [control]="settingsForm.controls.bankId" />
      </div>
      <div>
        <app-common-input-v4
          placeholder="Upload folder path"
          formControlName="folderPath"
          [fieldLabel]="'Upload folder path'"
          [isFieldRequired]="false"
          [maxlength]="100"
        />
        <app-control-message-v4 [control]="settingsForm.controls.folderPath" />
      </div>
      <div>
        <app-common-input-v4
          placeholder="File name"
          formControlName="fileName"
          [fieldLabel]="'File name'"
          [isFieldRequired]="false"
          [maxlength]="40"
        />
        <app-control-message-v4 [control]="settingsForm.controls.fileName" />
      </div>
    </div>
  </div>
  <!-- modal body end -->

  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Save"
      (clickEvent)="submit()"
      [disabled]="isSubmitting()"
      [loading]="isSubmitting()"
    />
  </div>
</div>
