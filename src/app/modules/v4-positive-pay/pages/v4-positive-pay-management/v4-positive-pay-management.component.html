<div class="h-full w-full overflow-x-auto">
  <app-v4-page-header
    [title]="'Positive Pay Management'"
    [actions]="pageHeaderActions"
    (actionClick)="onPageHeaderAction($event)"
  >
    <button
      headerLead
      type="button"
      class="flex items-center justify-center w-8 h-8 rounded-lg border border-v4-border-color bg-v4-secondary-background-color text-v4-main-text-color cursor-pointer hover:bg-v4-tertiary-background-color transition-colors"
      (click)="goBack()"
    >
      <lucide-icon name="arrow-left" [size]="16" />
    </button>
  </app-v4-page-header>
  <app-v4-data-table
    [columnDefs]="columnDefs"
    [defaultColumnFields]="columnFields"
    [tableId]="tableId"
    [frameworkComponents]="frameworkComponents"
    [headerElements]="headerElements()"
    (headerButtonEvent)="headerButtonClick($event)"
    (rowSelected)="onRowSelected($event)"
    [exportConfig]="exportConfig"
  />
</div>
