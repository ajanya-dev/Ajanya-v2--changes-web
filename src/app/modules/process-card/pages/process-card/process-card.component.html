<div
  class="ocw_one_side_body"
  [ngClass]="{
    firstSlide: id === 'started',
    secondSlide: id === 'business',
    thirdClass: id === 'signor',
    fourthClass: id === 'success'
  }"
>
  <div class="progressbars">
    <div class="progress_as">
      <p>Started</p>
      <div
        class="round"
        [ngClass]="{ active: id === 'started', bgGrean: id !== 'started' }"
      >
        <i class="fa fa-check" *ngIf="id !== 'started'"></i>
        <span *ngIf="id === 'started'">1</span>
      </div>
    </div>
    <div class="progress_as">
      <p>Business Details</p>
      <div
        class="round"
        [ngClass]="{
          active: id === 'business',
          bgGrean: id !== 'started' && id !== 'business'
        }"
      >
        <i class="fa fa-check" *ngIf="id !== 'started' && id !== 'business'"></i
        ><span *ngIf="id === 'started' || id === 'business'">2</span>
      </div>
    </div>
    <div class="progress_as">
      <p>Signor Details</p>
      <div
        class="round"
        [ngClass]="{
          active: id === 'signor',
          bgGrean: id !== 'started' && id !== 'business' && id !== 'signor'
        }"
      >
        <i
          class="fa fa-check"
          *ngIf="id !== 'started' && id !== 'business' && id !== 'signor'"
        ></i
        ><span *ngIf="id === 'started' || id === 'business' || id === 'signor'"
          >3</span
        >
      </div>
    </div>
    <div class="progress_as">
      <p>Completed</p>
      <div class="round" [ngClass]="{ active: id === 'success' }">4</div>
    </div>

    <div class="progress_line"></div>
  </div>

  <div class="ocw_header">
    <div class="title">
      <h3>Application Information</h3>
    </div>
  </div>
  <hr class="header_border" />

  <!-- main body -->
  <div class="ocw_body">
    <div class="main">
      <form [formGroup]="form">
        <div *ngIf="step === 1">
          <div class="fields">
            <div class="field">
              <div class="flex">
                <label class="label">Bisiness Leagal Name : </label>
                <input
                  type="text"
                  maxlength="30"
                  formControlName="businessName"
                  class="inputs"
                />
              </div>
              <app-control-message
                [control]="form.controls.businessName"
              ></app-control-message>
            </div>

            <div class="field">
              <div class="flex">
                <label class="label">DBA Name: </label>
                <input
                  type="text"
                  maxlength="30"
                  formControlName="dbaName"
                  class="inputs"
                />
              </div>
              <app-control-message
                [control]="form.controls.dbaName"
              ></app-control-message>
            </div>

            <div class="field">
              <div class="flex">
                <label class="label">Business Address: </label>
                <input
                  type="text"
                  maxlength="30"
                  #businessAddress
                  (focus)="loadGoogleAddress(businessAddress, 0)"
                  formControlName="businessAddress"
                  class="inputs"
                />
              </div>
              <app-control-message
                [control]="form.controls.businessAddress"
              ></app-control-message>
            </div>

            <div class="field">
              <div class="flex">
                <label class="label">City: </label>
                <input
                  type="text"
                  maxlength="50"
                  formControlName="businessCity"
                  class="inputs"
                />
              </div>
              <app-control-message
                [control]="form.controls.businessCity"
              ></app-control-message>
            </div>
            <div class="field">
              <div class="flex">
                <label class="label">State: </label>
                <input
                  type="text"
                  maxlength="20"
                  formControlName="businessState"
                  class="inputs"
                />
              </div>
              <app-control-message
                [control]="form.controls.businessState"
              ></app-control-message>
            </div>
            <div class="field">
              <div class="flex">
                <label class="label">Zip: </label>
                <input
                  type="text"
                  maxlength="20"
                  formControlName="businessZip"
                  class="inputs"
                />
              </div>
              <app-control-message
                [control]="form.controls.businessZip"
              ></app-control-message>
            </div>

            <div class="field">
              <div class="flex">
                <label class="label">Business Phone: </label>
                <input
                  type="text"
                  mask="(000) 000-0000"
                  placeholder="(000) 000-0000"
                  formControlName="businessPhone"
                  class="inputs"
                />
              </div>
              <app-control-message
                [control]="form.controls.businessPhone"
              ></app-control-message>
            </div>
            <div class="field">
              <div class="flex">
                <label class="label">Business Fax: </label>
                <input
                  type="text"
                  maxlength="20"
                  formControlName="businessFax"
                  class="inputs"
                />
              </div>
            </div>

            <div class="field">
              <div class="flex">
                <label class="label">Email: </label>
                <input
                  type="text"
                  maxlength="40"
                  formControlName="businessEmail"
                  class="inputs"
                />
              </div>
              <app-control-message
                [control]="form.controls.businessEmail"
              ></app-control-message>
            </div>
            <div class="field">
              <div class="flex">
                <label class="label">Requested Service Start Date: </label>
                <input
                  type="date"
                  formControlName="requestedServiceStartDate"
                  [max]="newDate"
                  class="inputs"
                />
              </div>
              <app-control-message
                [control]="form.controls.requestedServiceStartDate"
              ></app-control-message>
              <span class="err" *ngIf="dateInvalid"
                >Future date not allowed</span
              >
            </div>
            <div class="field">
              <div class="flex">
                <label class="label">is this date flexible?: </label>

                <div class="flex items-center justify-center">
                  <div class="flex items-center justify-center">
                    <label for="yes" class="mr-2">Yes</label>
                    <input
                      type="radio"
                      id="yes"
                      name="radio"
                      value="1"
                      formControlName="dateFlexible"
                      class=" "
                    />
                  </div>

                  <div class="flex items-center justify-center ml-3">
                    <label class="mr-2" for="no">No</label>
                    <input
                      type="radio"
                      id="no"
                      name="radio"
                      value="0"
                      formControlName="dateFlexible"
                      class=" "
                    />
                  </div>
                </div>
              </div>
              <app-control-message
                [control]="form.controls.dateFlexible"
              ></app-control-message>
            </div>
          </div>

          <div style="margin-top: 50px" class="field2">
            <div class="field">
              <div class="flex">
                <label class="label">Products/Service Sold: </label>
                <input
                  type="text"
                  maxlength="20"
                  formControlName="productsSold"
                  class="inputs"
                />
              </div>
              <app-control-message
                [control]="form.controls.productsSold"
              ></app-control-message>
            </div>

            <div class="field">
              <div class="flex">
                <label class="label">Fed Tax ID: </label>
                <input
                  type="text"
                  mask="00-0000000"
                  formControlName="fedTaxId"
                  class="inputs"
                />
              </div>
              <app-control-message
                [control]="form.controls.fedTaxId"
              ></app-control-message>
            </div>
            <div class="field">
              <div class="flex">
                <label class="label">Fed ID Month / Year Started: </label>
                <input
                  type="text"
                  maxlength="20"
                  formControlName="fedIdStarted"
                  class="inputs"
                />
              </div>
              <app-control-message
                [control]="form.controls.fedIdStarted"
              ></app-control-message>
            </div>

            <div class="field">
              <div class="flex">
                <label class="label">Fax Filling Type: </label>
                <input
                  type="text"
                  maxlength="20"
                  formControlName="faxFillinType"
                  class="inputs"
                />
              </div>
              <app-control-message
                [control]="form.controls.faxFillinType"
              ></app-control-message>
            </div>
            <div class="field">
              <div class="flex">
                <label class="label"
                  ><span
                    >(Sole Proprietor, Partnership, Corporation-Public or
                    Private)</span
                  ></label
                >
              </div>
            </div>
          </div>

          <div style="margin-top: 50px" class="field3">
            <div class="field">
              <div class="flex">
                <label class="label">Tax Exempt Organization: </label>
                <div class="flex items-center justify-center">
                  <div class="flex items-center justify-center">
                    <label for="yes2" class="mr-2">Yes</label>
                    <input
                      type="radio"
                      id="yes2"
                      name="radio2"
                      value="1"
                      formControlName="taxExemptOrganization"
                      class=" "
                    />
                  </div>

                  <div class="flex items-center justify-center ml-3">
                    <label class="mr-2" for="no2">No</label>
                    <input
                      type="radio"
                      id="no2"
                      name="radio2"
                      value="0"
                      formControlName="taxExemptOrganization"
                      class=" "
                    />
                  </div>
                </div>
              </div>
              <app-control-message
                [control]="form.controls.taxExemptOrganization"
              ></app-control-message>
            </div>
            <div class="field">
              <div class="flex">
                <label class="label">Number of Employees: </label>
                <input
                  type="text"
                  maxlength="20"
                  (keypress)="utils.numberOnly($event, 'numeric')"
                  formControlName="numberOfEmployees"
                  class="inputs"
                />
              </div>
              <app-control-message
                [control]="form.controls.numberOfEmployees"
              ></app-control-message>
            </div>

            <div class="field">
              <div class="flex">
                <label class="label">Total Gross Annual Sales: </label>
                <input
                  type="text"
                  maxlength="20"
                  (keypress)="enableDot($event)"
                  mask="separator.2"
                  thousandSeparator=""
                  formControlName="totalGrossAnnualSales"
                  class="inputs"
                />
              </div>
              <app-control-message
                [control]="form.controls.totalGrossAnnualSales"
              ></app-control-message>
            </div>
            <div class="field">
              <div class="flex">
                <label class="label"
                  >Estimated Annual Credit Card Sales:
                </label>
                <input
                  type="text"
                  maxlength="20"
                  (keypress)="enableDot($event)"
                  mask="separator.2"
                  thousandSeparator=""
                  formControlName="estimatedAnnualCreditCardSales"
                  class="inputs"
                />
              </div>
              <app-control-message
                [control]="form.controls.estimatedAnnualCreditCardSales"
              ></app-control-message>
            </div>

            <div class="field">
              <div class="flex">
                <label class="label"
                  >Estimated Average $$ Credit Card Individual Sale Amount:
                </label>
                <input
                  type="text"
                  maxlength="20"
                  (keypress)="enableDot($event)"
                  mask="separator.2"
                  thousandSeparator=""
                  formControlName="estimatedAverageCreditCardSaleAmount"
                  class="inputs"
                />
              </div>
              <app-control-message
                [control]="form.controls.estimatedAverageCreditCardSaleAmount"
              ></app-control-message>
            </div>

            <div class="field">
              <div class="flex">
                <label class="label"
                  >Estimated Heighest $$ Credit Card Individual Sale Amount:
                </label>
                <input
                  type="text"
                  maxlength="20"
                  (keypress)="enableDot($event)"
                  mask="separator.2"
                  thousandSeparator=""
                  formControlName="estimatedHeighestCreditCardSaleAmount"
                  class="inputs"
                />
              </div>
              <app-control-message
                [control]="form.controls.estimatedHeighestCreditCardSaleAmount"
              ></app-control-message>
            </div>
          </div>
        </div>

        <div *ngIf="step === 2 || step === 3">
          <div>
            <span class="signor_msg">
              Signor (Must be officer or controller of private Corp., member
              LLC, or individual only of sole proprietorship):
            </span>

            <div style="margin-top: 20px" class="field4">
              <div class="field">
                <div class="flex">
                  <label class="label">Signor/Owner Name: </label>
                  <input
                    type="text"
                    maxlength="20"
                    formControlName="signorName"
                    class="inputs"
                  />
                </div>
                <app-control-message
                  [control]="form.controls.signorName"
                ></app-control-message>
              </div>

              <div class="field">
                <div class="flex">
                  <label class="label">Signor Title: </label>
                  <input
                    type="text"
                    maxlength="20"
                    formControlName="signorTitle"
                    class="inputs"
                  />
                </div>
                <app-control-message
                  [control]="form.controls.signorTitle"
                ></app-control-message>
              </div>
              <div class="field">
                <div class="flex">
                  <label class="label">Signor Email: </label>
                  <input
                    type="text"
                    maxlength="20"
                    formControlName="signorEmail"
                    class="inputs"
                  />
                </div>
                <app-control-message
                  [control]="form.controls.signorEmail"
                ></app-control-message>
              </div>

              <div class="field">
                <div class="flex">
                  <label class="label"
                    >Signor Percentage ownership in company:
                  </label>
                  <input
                    type="text"
                    maxlength="20"
                    (keypress)="enableDot($event)"
                    formControlName="signorPercentageOwnership"
                    class="inputs"
                  /><span>%</span>
                </div>
                <app-control-message
                  [control]="form.controls.signorPercentageOwnership"
                ></app-control-message>
              </div>
              <div class="field">
                <div class="flex">
                  <label class="label">Signor Social Security: </label>
                  <input
                    type="text"
                    maxlength="20"
                    mask="000-00-0000"
                    formControlName="signorSocialSecurity"
                    class="inputs"
                  />
                </div>
                <app-control-message
                  [control]="form.controls.signorSocialSecurity"
                ></app-control-message>
              </div>

              <div class="field">
                <div class="flex">
                  <label class="label">Signor Date of Birth: </label>
                  <input
                    type="date"
                    [max]="newDate"
                    maxlength="20"
                    formControlName="signorDateOfBirth"
                    class="inputs"
                  />
                </div>
                <app-control-message
                  [control]="form.controls.signorDateOfBirth"
                ></app-control-message>
                <span *ngIf="dobInvalid" class="err"
                  >Future date note allowed</span
                >
              </div>
              <div class="field">
                <div class="flex">
                  <label class="label">Signor Home Phone: </label>
                  <input
                    type="text"
                    mask="(000) 000-0000"
                    placeholder="(000) 000-0000"
                    formControlName="signorPhone"
                    class="inputs"
                  />
                </div>
                <app-control-message
                  [control]="form.controls.signorPhone"
                ></app-control-message>
              </div>

              <div class="field">
                <div class="flex">
                  <label class="label">Signor Home Address: </label>
                  <input
                    type="text"
                    maxlength="40"
                    #signorAddress
                    (focus)="loadGoogleAddress(signorAddress, 1)"
                    formControlName="signorAddress"
                    class="inputs"
                  />
                </div>
                <app-control-message
                  [control]="form.controls.signorAddress"
                ></app-control-message>
              </div>

              <div class="field">
                <div class="flex">
                  <label class="label">City: </label>
                  <input
                    type="text"
                    maxlength="20"
                    formControlName="signorCity"
                    class="inputs"
                  />
                </div>
                <app-control-message
                  [control]="form.controls.signorCity"
                ></app-control-message>
              </div>
              <div class="field">
                <div class="flex">
                  <label class="label">State: </label>
                  <input
                    type="text"
                    maxlength="20"
                    formControlName="signorState"
                    class="inputs"
                  />
                </div>
                <app-control-message
                  [control]="form.controls.signorState"
                ></app-control-message>
              </div>
              <div class="field">
                <div class="flex">
                  <label class="label">Zip: </label>
                  <input
                    type="text"
                    maxlength="10"
                    formControlName="signorZip"
                    class="inputs"
                  />
                </div>
                <app-control-message
                  [control]="form.controls.signorZip"
                ></app-control-message>
              </div>
            </div>
          </div>

          <div style="margin-top: 50px">
            <span class="deposit_bank_details"
              >Deposit Bank Name (checking only):</span
            >

            <div class="field5">
              <div class="field">
                <div class="flex">
                  <label class="label">Bank Name: </label>
                  <input
                    type="text"
                    maxlength="30"
                    formControlName="BankName"
                    class="inputs"
                  />
                </div>
                <app-control-message
                  [control]="form.controls.BankName"
                ></app-control-message>
              </div>

              <div class="field">
                <div class="flex">
                  <label class="label">Bank Account #: </label>
                  <input
                    type="text"
                    maxlength="20"
                    (keypress)="utils.numberOnly($event, 'numeric')"
                    formControlName="BankAccountNo"
                    class="inputs"
                  />
                </div>
                <app-control-message
                  [control]="form.controls.BankAccountNo"
                ></app-control-message>
              </div>
              <div class="field">
                <div class="flex">
                  <label class="label">Bank Routing #: </label>
                  <input
                    type="text"
                    maxlength="9"
                    (keypress)="utils.numberOnly($event, 'numeric')"
                    formControlName="BankRoutingNo"
                    class="inputs"
                    (keyup)="upRoutingNumber($event)"
                  />
                </div>
                <app-control-message
                  [control]="form.controls.BankRoutingNo"
                ></app-control-message>
              </div>

              <div class="field">
                <div class="flex">
                  <label class="label">Bank Phone: </label>
                  <input
                    type="text"
                    mask="(000) 000-0000"
                    placeholder="(000) 000-0000"
                    formControlName="BankPhone"
                    class="inputs"
                  />
                </div>
                <app-control-message
                  [control]="form.controls.BankPhone"
                ></app-control-message>
              </div>

              <div class="field">
                <div class="flex">
                  <label class="label">Existing provider statement: </label>
                  <input
                    type="file"
                    (change)="fileInput($event)"
                    class="fileInput"
                  />
                </div>
                <app-control-message
                  [control]="form.controls.attachment"
                ></app-control-message>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="ocw_modal_footer" *ngIf="step === 1">
    <mat-dialog-actions align="end">
      <button mat-dialog-close class="ocw-btn ocw-btn-gray" (click)="next(1)">
        Back
      </button>
      <button
        type="submit"
        class="ocw-btn ocw-btn-light-green add_btn"
        (click)="next(2)"
      >
        <span>Next</span>
      </button>
    </mat-dialog-actions>
  </div>
  <div class="ocw_modal_footer" *ngIf="step === 2 || step === 3">
    <mat-dialog-actions align="end">
      <button mat-dialog-close class="ocw-btn ocw-btn-gray" (click)="next(1)">
        Back
      </button>
      <button
        type="submit"
        class="ocw-btn ocw-btn-light-green add_btn"
        (click)="next(3)"
        [disabled]="btnDisabled"
      >
        <span>SUBMIT</span>
        <span *ngIf="btnDisabled" class="loadingSpinner"></span>
      </button>
    </mat-dialog-actions>
  </div>
</div>
