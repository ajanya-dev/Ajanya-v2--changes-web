<div class="ocw_one_side_body">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    <div class="ocw_welcome_left_pane">
      <div class="title">
        <h3>Online Check Draft Software</h3>
        <p class="text-sm ml-3">
          Create Checks By Yourself On Behalf of Your Payee, No Signature
          Required.
        </p>
      </div>
      <div class="mt-9">
        <div class="my-2 what-we-provide-header shadow-xl">
          <h1 class="font-semibold">what we provide</h1>
        </div>
        <ul class="mt-3 ml-3">
          <li
            class="what-we-provide-options"
            *ngFor="let option of whatWeProvideOptions"
          >
            {{ option }}
          </li>
        </ul>
      </div>
    </div>

    <div
      class="ocw_welcome_right_pane flex justify-center items-center flex-col"
    >
      <div class="image-container w-4/5 p-3">
        <img
          src="../../../../assets/images/check-draft/check-draft.png"
          alt="check-draft-image"
        />
      </div>
      <p class="image-sub-text"></p>
      <a
        type="button"
        class="ocw-btn-gradient mt-3"
        routerLink="/manage/checkdraft/index"
      >
        Enter Now
      </a>
    </div>
  </div>
</div>
