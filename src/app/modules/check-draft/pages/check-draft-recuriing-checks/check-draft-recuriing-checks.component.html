<div class="data-table-wrapper bg-main-background-color h-full px-5 py-3">
  <app-v3-data-table
    [tableId]="tableId"
    dynamicHeaderText="Check Draft: Recurring Checks"
    [columnDefs]="columnDefs"
    [defaultColumnFields]="columnFields"
    [tableId]="tableId"
    [backButtonEnabled]="true"
    [headerElements]="headerElements()"
    (cellRendererIdEvent)="getActionComp($event)"
    (cellRendererViewEvent)="getViewAction($event)"
    [fieldsShownByDefault]="fieldsShownByDefault"
    (headerButtonEvent)="headerButtonNavigation($event)"
    [frameworkComponents]="frameworkComponents"
    (rowSelected)="onRowSelected($event)"
    [exportConfig]="exportConfig"
  >
  </app-v3-data-table>
</div>
