<div class="flex flex-col w-full h-full overflow-auto">
  @if (checkDraftAppStatus()) {
    <div class="flex gap-2 h-7 pl-2 font-semibold text-sm">
      @if (checkDraftAppStatus() === 1) {
        <div
          role="presentation"
          (click)="isEmailAndPhoneVerfied()"
          class="text-common-blue-color bg-common-secondary-blue-color underline rounded-t-md p-2 flex justify-center items-center cursor-pointer"
        >
          {{ loading ? "Please wait..." : "Apply For Check Draft" }}
        </div>
      }
      @if (checkDraftAppStatus() === 3) {
        <div
          class="bg-common-secondary-red-color text-common-red-color rounded-t-md p-2 flex justify-center items-center"
        >
          Status : Rejected
          <div
            role="presentation"
            (click)="isEmailAndPhoneVerfied()"
            class="underline text-common-blue-color cursor-pointer ml-2"
          >
            Re-Apply
          </div>
        </div>
      }
      @if (checkDraftAppStatus() === 2) {
        <div
          class="bg-common-secondary-green-color text-common-green-color rounded-t-md p-2 flex justify-center items-center"
        >
          Status : Applied
        </div>
      }
    </div>
  }
  <div class="data-table-wrapper bg-main-background-color flex-1 rounded">
    <div class="px-5 pt-3">
      <app-v3-data-table
        dynamicHeaderText="Check Draft"
        [(selectedPanelButton)]="selectedPanelButton"
        [deselectedColumns]="deselectedColumns"
        class="overflow-auto"
        [defaultColumnFields]="defaultColumnFields"
        [columnDefs]="columnDefs"
        [tableId]="tableId"
        domLayout="autoHeight"
        [fieldsShownByDefault]="fieldsShownByDefault"
        [frameworkComponents]="frameworkComponents"
        [headerElements]="headerElements()"
        (headerButtonEvent)="headerButtonClick($event)"
        (cellRendererIdEvent)="cellRendererActionClick($event)"
        (cellRendererViewEvent)="getViewAction($event)"
        (rowSelected)="onRowSelected($event)"
        [exportConfig]="exportConfig"
        (checkDraftExportEvent)="onExportData($event)"
      >
      </app-v3-data-table>
    </div>
  </div>
</div>
