<div class="ocw_man_modal_wrapper add_bank_modal">
  <form [formGroup]="recurringForm">
    <div class="ocw_modal_header">
      <div class="ocw_modal_title">Recurring</div>
      <div class="close_btn" [mat-dialog-close]="false">
        <svg
          aria-hidden="true"
          focusable="false"
          data-prefix="fal"
          data-icon="times"
          class="svg-inline--fa fa-times fa-w-10"
          role="img"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 320 512"
        >
          <path
            fill="currentColor"
            d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
          ></path>
        </svg>
      </div>
    </div>

    <!-- modal body start -->
    <div class="ocw_modal_body">
      <!-- <div class="relative mb-3">
            <input type="text" class="input_style floating_input_field" id="frequency" placeholder=" " />
            <label for="frequency" class=" floating_label_field"> Frequency </label>
         </div> Frequency -->

      <div class="relative mb-3">
        <small class="small_floating_label" id="small">Frequency</small>
        <select formControlName="frequency" class="input_style" required>
          <option value="1">Weekly</option>
          <option value="2">Bi-Weekly</option>
          <option value="3">Monthly</option>
          <option value="4">Quarterly</option>
          <option value="5">Yearly</option>
        </select>
      </div>
      <div class="relative mb-3">
        <input
          type="date"
          [min]="minDate"
          class="input_style floating_input_field"
          id="start_date"
          formControlName="startDate"
          placeholder=" "
        />
        <label for="date" class="floating_label_field"> Starting Date </label>
        <span
          *ngIf="recurringForm.controls.startDate.value < minDate"
          class="error_msg"
          >Starting date should be a future date.</span
        >
      </div>
      <div class="flex justify-center items-center w-full mb-3">
        <input
          type="radio"
          name="endSelect"
          id="frequency"
          value="1"
          formControlName="endSelect"
          (change)="getPatch()"
          placeholder=" "
          class="mr-2"
        />
        <div class="relative w-full">
          <input
            type="text"
            class="input_style floating_input_field"
            formControlName="count"
            max="999"
            maxlength="3"
            placeholder=" "
            (keypress)="utils.numberOnly($event, 'numeric')"
            (keyup)="isClick = false"
          />
          <label for="recurring-times" class="floating_label_field">
            How many times does this transaction occur
          </label>
          <span
            class="error_msg"
            *ngIf="
              recurringForm.controls.endSelect.value === '1' &&
              recurringForm.controls.count.value === '' &&
              isClick
            "
            >This field is required</span
          >
          <span
            class="error_msg"
            *ngIf="
              recurringForm.controls.endSelect.value === '1' &&
              recurringForm.controls.count.value == 0 &&
              isClick
            "
            >Enter valid input</span
          >
        </div>
      </div>
      <div class="flex w-full justify-center items-center mb-3">
        <input
          type="radio"
          name="endSelect"
          id="frequency"
          placeholder=" "
          formControlName="endSelect"
          (change)="getPatch()"
          value="2"
          class="mr-2"
        />
        <div class="relative w-full">
          <input
            type="date"
            class="input_style floating_input_field"
            formControlName="until"
            [min]="afterOneWeek"
            placeholder=" "
          />
          <label for="recurring-times" class="floating_label_field"
            >Specific Date
          </label>
          <span
            *ngIf="
              recurringForm.controls.until.value < afterOneWeek &&
              recurringForm.controls.endSelect.value === '2'
            "
            class="error_msg"
            >Enter valid specific date</span
          >
        </div>
      </div>
      <div>
        <input
          type="radio"
          name="endSelect"
          id="until-i-cancel"
          formControlName="endSelect"
          (change)="getPatch()"
          value="3"
        />
        <label for="until-i-cancel" class="until-i-cancel">
          Until I Cancel
        </label>
      </div>
    </div>
    <!-- modal body end   -->

    <div class="ocw_modal_footer">
      <mat-dialog-actions align="end">
        <button
          mat-dialog-close
          class="ocw-btn ocw-btn-modal-bordered close_btn"
        >
          Close
        </button>
        <button
          type="submit"
          (click)="setRecurring()"
          class="ocw-btn ocw-btn-modal-blue add_btn"
          [ngClass]="{ 'loadingSpinner spinner-gap': isProcess }"
        >
          <span>Set recurring</span>
        </button>
      </mat-dialog-actions>
    </div>
  </form>
</div>
