<div class="ocw_man_modal_wrapper add_bank_modal">
  <form>
    <div class="ocw_modal_header">
      <div class="ocw_modal_title">Check draft : Resend Permission</div>
    </div>

    <!-- modal body start -->
    <div class="ocw_modal_body">
      <form [formGroup]="resendPermissionForm">
        <div class="relative mb-3">
          <input
            type="text"
            name="email"
            id="email"
            class="input_style floating_input_field"
            placeholder=" "
            (keyup)="checkValidate('e')"
            formControlName="email"
          />
          <label for="email" class="floating_label_field"> Email </label>
          <app-control-message
            [control]="resendPermissionForm.controls.email"
          ></app-control-message>
        </div>
        <div class="relative">
          <input
            type="text"
            name="sms"
            id="sms"
            class="input_style floating_input_field"
            ng2TelInput
            id="phone"
            mask="(000) 000-0000"
            placeholder=" "
            (keyup)="checkValidate('s')"
            formControlName="sms"
          />
          <label for="email" class="floating_label_field"> SMS </label>
          <app-control-message
            [control]="resendPermissionForm.controls.sms"
          ></app-control-message>
        </div>
      </form>
    </div>
    <!-- modal body end -->

    <div class="ocw_modal_footer">
      <mat-dialog-actions align="end">
        <button mat-dialog-close class="ocw-btn ocw-btn-modal-bordered">
          Cancel
        </button>
        <button
          type="submit"
          class="ocw-btn ocw-btn-modal-blue add_btn"
          (click)="resendCheckDraftPermission()"
          [disabled]="btnDisable"
        >
          <span>Send</span
          ><span *ngIf="btnDisable" class="loadingSpinner"></span>
        </button>
      </mat-dialog-actions>
    </div>
  </form>
</div>
