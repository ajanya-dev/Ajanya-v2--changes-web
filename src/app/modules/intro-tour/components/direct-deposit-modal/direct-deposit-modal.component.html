<div class="ocw_man_modal_wrapper add_bank_modal intro-direct-deposit">
    <div class="flex justify-between pb-6">
      <div>
        <span
          class="mt-18 w-full text-base text-main-text-color align-middle flex items-center\"
        >
          <span class="pl-1 font-inter font-semibold text-base pb-0.5\">
            DIRECT DEPOSIT
          </span>
        </span>
      </div>
      <div [mat-dialog-close]="false">
        <fa-icon
          (mouseup)="close()"
          class="text-secondary-text-color cursor-pointer mr-2"
          [icon]="faXmark"
        ></fa-icon>
      </div>
    </div>
  
    <!-- modal body start -->
    <div class="ocw_modal_body">
      <div class="ocw_table_wrapper">
        <form >
          <table class="ocw-table ocw-table-base">
            <thead>
              <tr>
                <th class="text-left">#</th>
                <th class="text-left">Pay From</th>
                <th class="text-left">Pay To</th>
                <th class="text-left">Payee Email Address</th>
                <th class="text-left">Check #</th>
                <th class="text-left">Check Amount</th>
                <th class="text-left">Cost</th>
                <th class="text-left">Attachment</th>
                <th class="text-left">Enable Wallet Bypassing</th>
                <th class="text-left">Pay to Account</th>
              </tr>
            </thead>
            <ng-container >
             
                <ng-container>
                  <ng-container >
                    <tbody class="text-sm">
                      <tr>
                        <td class="text-left">1</td>
                        <td class="text-left">{{ data.payFrom }}</td>
                        <td class="text-left">
                          {{
                            data.payTo
                          }}
                        </td>
                        <td class="text-left">
                          <input
                            type="text"
                            class="input_style"
                            formControlName="email"
                            name="email"
                            id="email"
                          />
                        </td>
                        <td class="text-left">{{ data.checkNo }}</td>
                        <td class="text-left">{{ data.amount }}</td>
                        <td class="text-left">0.25</td>
                        <td>
                          <div class="attachment-panel">
                            <button
                              type="button disable"
                              class="attachment-btn"
                            >
                              Add
                            </button>
                          </div>
                        </td>
                        <td class="text-center">
                          <input
                            type="checkbox"
                            [checked]="true"
                            formControlName="walletBypassing"
                          />
                        </td>
                          <td class="text-left">
                           
                              <div class="single_input no_modal_btn">
                                <select
                                  class="input_style"
                                  formControlName="payee_account"
                                >
                                    <option >
                                      {{ data.payTo }}
                                    </option>
                                  
                                </select>
                              </div>
                          </td>
                      </tr>
                    </tbody>
                  </ng-container>
                </ng-container>
            </ng-container>
          </table>
        </form>
      </div>
    </div>
    <!-- modal body end  -->
  
    <div class="ocw_modal_footer flex !justify-between">
      <div>
          <h3 class="font-semibold">Total Amount: ${{ data.amount | number:'1.2-2' }}</h3>
          <h3 class="font-semibold">Total Cost: $0.25</h3>
      </div>
      <div class="flex mr-5 gap-2 mb-2">
        <mat-dialog-actions >
                <button
                  class="ocw-btn pointer-events-none text-secondary-text-color flex disab gap-2 mr-5 "
                >
                    <fa-icon class="text-sm" [icon]="faCalendar"></fa-icon>
                  <span class="text-sm font-semibold">Schedule</span>
                </button>
  
                <button
                  class="ocw-btn pointer-events-none text-secondary-text-color disable flex items-center gap-2 mr-5"
                >        
                <fa-icon class="text-sm" [icon]="faSync"></fa-icon>
                  <span class="text-sm font-semibold">Recurring</span>
                </button>
  
              <button
                class="ocw-btn ocw-btn-modal-blue "
                (click)="onProcess()"
              >
                <span>
                 Process Now
                </span>
              </button>
        </mat-dialog-actions>
      </div>
    </div>
   
  </div>
