<div class="ocw_man_modal_wrapper intro-modal-send-mail-button">
    <div class="ocw_modal_header flex justify-between items-center relative">
      <div class="ml-2 ocw_modal_title mail-modal-heading">
        <p>Mail Your Checks</p>
        <div class="video_icon_wrapper mr-6">
          <app-demo-video
            [disableText]="true"
            [slug]="'checkmailing'"
          ></app-demo-video>
        </div>
      </div>
      <div class="close_btn mr-2" (mouseup)="close()" [mat-dialog-close]="false">
        <fa-icon [icon]="faX"
        class="ml-2"
        (mouseup)="close()"></fa-icon>
      </div>
  
    </div>
  
    <div class="ocw_modal_body">
      <form >
        <div
          class="w-full flex justify-end items-center mb-5 flex-col md:flex-row"
        >
          
          <div class="refill-container mr-2">
            <div class="">
              <h3 class="refill">
                MY CREDITS
                <span class="amount-recharge">
                 $100.00</span>
              </h3>
            </div>
            <div class="">
              <button
                type="button"
                class="mr-2 refill-btn ocw-btn-gradient ocw-btn"
              >
                Recharge Now
              </button>
            </div>
          </div>
        </div>
        <div class="table-responsive ">
          <table class="check-mail-modal-table ocw-table">
            <thead>
              <th style="width: 5%">#</th>
              <th style="width: 10%">SHIPPING TYPE</th>
              <th style="width: 10%">CHECK PAPER</th>
              <th style="width: 58%">PAYEE NAME</th>
              <th style="width: 10%">CHECK NO</th>
              <th>
                <input
                  type="checkbox"
                  name="sms"
                  id="sms"
                />
              </th>
              <th style="width: 10%">SMS</th>
              <th style="width: 10%">
                <input
                  type="checkbox"
                  name="email"
                  id="email"
                  class="mr-2"
                />
                EMAIL
              </th>
              <th style="width: fit-content">COST</th>
              <th style="width: fit-content">ATTACHMENT</th>
            </thead>
  
            <tbody >
              <tr
               
              >
                <td>1</td>
                <td>
                  <select>
                    <option id="3443" value="34">
                       First Class 1.05
                    </option>
                    <option id="3443" value="34">
                       First Class with Tracking 6.00
                    </option>
                    <option id="3443" value="34">
                       Priority Mail USPS 11.99
                    </option>
                    <option id="3443" value="34">
                       Express Mail USPS 34.99
                    </option>
                    <option id="3443" value="34">
                       Fedex Overnight 20.99
                    </option>
                  </select>
                </td>
                <td>
                  <select class="select-down">
                    <option value="1">
                       Regular Check Paper
                    </option>
                    <option value="2">
                       Hollogram Check Paper
                    </option>
                    <option value="3">
                      Ultra Hollogram Check Paper 3
                    </option>
                  </select>
                </td>
                <td>
                  <div class="flex flex-col">
                    <div
                      
                      class="flex justify-start items-center w-full payee-name"                     
                    >
                      {{data.payTo}}
                      <fa-icon
                      [icon]="faPencil"
                      class="ml-2"
                    ></fa-icon>                  
                  </div>
                    
                  </div>
                </td>
                <td>{{data.checkNo}}</td>
                <td>
                  <input
                    type="checkbox"
                    id="sms_78"
                   
                    
                  />
                </td>
                <td>
                  <div class="relative">
                    <div>
                      <app-new-phone-input
                      type="text"
                      id="phone_2"
                      [showCountryFlag]="false"
                      [inputHeight]="'25px'"
                      [inputWidth]="'100px'"
                      [inputPadding]="'5px'"
                      formControlName="payee_phone"
                      [inputFontSize]="'12px'"
                      ></app-new-phone-input>               
                    </div>
                    
                  </div>
                </td>
                <td>
                  <div class="flex justify-center items-center">
                    <input
                      type="checkbox"
                      id="email_checkBox_7"
                      class="p-1 mr-2"
                    />
                    <div class="flex flex-col">
                      <input
                        type="text"
                        id="email_7"
                        class="check-mail-modal-input p-1"
                      />                 
                    </div>
                  </div>
                </td>
                <td id="singleCost_78">
                  <ng-container>
                    <span class="">
                      $2.25
                    </span>
                  </ng-container>
                </td>
                <td >
                  <div class="flex justify-center items-center">
                    <button
                      class="attachment-btn disable"
                      type="button"
                  
                    >
                      Add
                    </button>
        
                  </div>
                </td>
              </tr>
  
              <tr>
                <td colspan="2">
                  <p>Last 10 transactions</p>
                </td>
                <td colspan="6"> 
                </td> 
                <td
                  colspan="10"
                  style="text-align: right"
                >
                  <p>
                    SUB TOTAL : <span class="amount">$2.25</span>
                  </p>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
  
        <div class="flex justify-start shipping-details-container">
          <div class="flex payee-address-types">
            <div class="payee-address flex items-center">
              <input
                type="radio"
                name="payee-address"
                id="to-payee-address"
                class="cursor-pointer"
                checked
              />
              <label for="to-payee-address" class="ml-2 text-sm">
                Ship to payee address</label
              >
            </div>
          </div>
          <div class="custom-shipping-wrapper flex items-center disable">
            <div class="custom-shipping-input flex justify-start items-center ">
              <input
                type="radio"
                name="payee-address"
                id="to-custom-address"
                class="cursor-pointer"
              />
              <label
                for="to-custom-address"
                class="whitespace-nowrap ml-2 text-sm"
              >
                Ship to custom address</label
              >
            </div>
            <div
              class="flex custom-shipping-option items-center"
            >
              <div class="flex flex-col single-option">
                <label for="mail-from" class="text-xs font-medium"
                  >MAIL FROM</label
                >
                <div class="flex select-wrapper">
                  <select
                    id="mail-from"                  
                  >
                      <option value="" selected>Select</option>
                      <option value="1" id="From">Shipping Address 1</option>
                      <option value="2" id="From">Shipping Address 2</option>
                      <option value="3" id="From">Shipping Address 3</option>
                  </select>
                  <button
                    type="button "
                    class="ocw-btn-gradient ocw-btn"
                    value="mail-from"
                  >
                  <fa-icon
                    [icon]="faPencil"
                  ></fa-icon>
                  </button>
                </div>
              </div>
              <div class="flex flex-col single-option">
                <label for="mail-to" class="text-xs font-medium">MAIL TO</label>
                <div class="flex select-wrapper">
                  <select
                    id="mail-to"
                  >
                    <option value="" selected>Select</option>
                      <option value="1" id="From">Shipping Address 1</option>
                      <option value="2" id="From">Shipping Address 2</option>
                      <option value="3" id="From">Shipping Address 3</option>
                  </select>
                  <button
                    type="button "
                    class="ocw-btn-gradient ocw-btn"
                    value="mail-to"
                  >
                    <fa-icon
                      [icon]="faPencil"
                    ></fa-icon>
                  </button>
                </div>
              </div>
              <div class="flex flex-col single-option">
                <label for="shipping-type" class="text-xs font-medium"
                  >SHIPPING TYPE</label
                >
                <div class="flex select-wrapper shipping-type">
                  <select
                    id="shipping-type"
                    id="ShipType"
                    class="w-full"
                    placehoder
                    name="shipping-type-select"
                  >
                    <option value="" disabled selected>Select</option>
                    <ng-container *ngFor="let shipping_type of shippingvar">
                      <option
                        id="customtype_{{ shipping_type.id }}"
                        value="{{ shipping_type.id }}"
                      >
                        {{ shipping_type.name }}
                      </option>
                    </ng-container>
                  </select>
                </div>
              </div>
              <div>
                <div>
                  <div id="group_total" class="ship-custom-adrs2">
                    <p  class="whitespace-nowrap text-sm ml-auto">
                      Shipping Fee : <span class="amount">0.00</span>
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
  
        <div
          class="mail-types-container"
        >
          <div class="mail-types-input-wrapper flex flex-col">
            <div class="w-full flex mail-types-input">
              <div class="mail-types-option">
                <input
                  type="radio"
                  name="mail-type"
                  id="mail-now"
                  value="mail now"
                  checked
                />
                <label for="mail-now" class="text-sm ml-1"> MAIL NOW</label>
              </div>
              <div  class="flex mail-types disable">
                <div class="mail-types-option">
                  <input
                    type="radio"
                    name="mail-type"
                    id="schedule"
                    value="schedule-it"
                  />
                  <label for="schedule" class="text-sm ml-1">SCHEDULE IT</label>
                </div>
                <div class="mail-types-option">
                  <input
                    type="radio"
                    name="mail-type"
                    id="recurring"
                    value="recurring"
                  />
                  <label for="recurring" class="text-sm ml-1"> RECURRING </label>
                </div>
                
              </div>
            </div>
           
  
            
          </div>
        </div>
      </form>
      <div  class="note_message">
        Note: To include attachments, click 'Add' before sending the check.
      </div>
    </div>
    <div class="ocw_modal_footer w-full ">
      <div class="flex justify-end w-full">
        <div class="flex items-center justify-center">
          <p class="mr-4">
            TOTAL : <span class="amount">$2.25</span>
          </p>
        </div>
        <div class="mr-2">
          <button
            type="submit"
            class="ocw-btn ocw-btn-modal-blue add_btn "
            (click)="sendMail()"
          >
            <span class="text">Mail Now</span>
          </button>
        </div>
      </div>
    </div>
  </div>
