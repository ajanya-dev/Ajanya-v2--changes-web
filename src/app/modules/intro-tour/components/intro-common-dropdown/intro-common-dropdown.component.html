<div class="angular-ocw-v35-ng-select-dropdown relative">
  @if (labelIconNeeded()) {
    <div
      [class]="labelIconNeeded() ? 'height-' + customHeight() : ''"
      class="height-0 absolute top-0 z-[1000]"
    >
      <div
        class="flex justify-center items-center v35-dropdown-labeled-icon border-r border-input-border-color"
      >
        @if (icon[dropdownType()]) {
          <fa-icon
            [ngClass]="['text-' + icon[dropdownType()].colorVars.text]"
            [icon]="icon[dropdownType()].icon"
          ></fa-icon>
        }
      </div>
    </div>
  }
  <ng-select
    [appendTo]="append()"
    id="payee_drop_down_{{ id() }}"
    [class]="labelIconNeeded() ? 'height-' + customHeight() : ''"
    class="ng-dropdown-panel-v35 height-0 text-sm drop-down-select-bank-v3"
    [placeholder]="placeholder()"
    (change)="dropdownSelect($event)"
    [(ngModel)]="dropdownValue"
    (open)="ngSelectEvent('open')"
    (close)="ngSelectEvent('close')"
  >
    @for (
      item of dropdownType() ? dummyArrayData[dropdownType()] : [];
      track item
    ) {
      <ng-option [value]="item">
        <div class="min-w-full flex justify-between items-center">
          @if (icon[dropdownType()]?.icon) {
            <div
              class="rounded-full h-8 w-8 mr-2 flex justify-center items-center text-center"
              [ngClass]="[
                'text-' + icon[dropdownType()].colorVars.text,
                'bg-' + icon[dropdownType()].colorVars.bg
              ]"
            >
              <fa-icon [icon]="icon[dropdownType()].icon"></fa-icon>
            </div>
          }
          <div class="flex-1 flex flex-col items-start overflow-hidden">
            <div class="main-text-highlight font-medium truncate">
              {{ item.title ?? "No Data" }}
            </div>
            @if (item.subTitle) {
              <div class="truncate text-secondary-text-color">
                {{ item.subTitle }}
              </div>
            }
          </div>
        </div>
      </ng-option>
    }

    <ng-template ng-label-tmp let-item="item">
      {{ item.title }}
    </ng-template>
  </ng-select>
</div>
