<div class="ocw_man_modal_wrapper intro-modal-send-email-button">
    <div class="ocw_modal_header flex justify-between items-center">
      <div class="ocw_modal_title flex gap-2">
        <p>Email Your Check</p>
        <div class="video_icon_wrapper">
          <app-demo-video [disableText]="true" [slug]="'echeck'"></app-demo-video>
        </div>
      </div>
      <div class="close_btn" [mat-dialog-close]="false">
        <fa-icon 
        [icon]="faX"
        class="pe-2"
        ></fa-icon>
      </div>
  
      <div
        class="flex justify-center items-center absolute w-full gap-1 toast"
      >
        <div class="toast-header">

          <button
            type="button"
            class="close toast_close"
            data-dismiss="toast"
            aria-label="Close"
          ></button>
        </div>
      </div>
    </div>
  
    <div class="ocw_modal_body email_modal_body">
      <div class="table-responsive">
        <form >
          <table class="ocw-table ocw-table-base">
            <thead>
              <tr>
                <th>#</th>
                <th>PAY TO</th>
                <th>PAY FROM</th>
                <th>EMAIL</th>
                <th class="align-middle">
                  <input type="checkbox" name="sms" id="sms" />
                </th>
                <th>SMS</th>
                <th>CHECK#</th>
                <th>AMOUNT</th>
                <th>ATTACHMENT</th>
                <th>COST</th>
              </tr>
            </thead>
            <tbody>
              <ng-container >
                <ng-container
                 
                >
                  <ng-container >
                    <tr>
                      <td>1</td>
                      <td >
                        {{data.payTo}}
                      </td>
                      
                      <td>{{data.payFrom}}</td>
                      <td>
                        <input
                          type="email"
                          name="email_"
                          id="email_"
                          class="input_style w_min"
                          placeholder="Email Address"
                        />
                      
                      </td>
                      <td class="align-middle">
                        <input
                          type="checkbox"
                          name="sms_"
                          id="sms_"
                        />
                      </td>
                      <td>
                        <app-new-phone-input
                        type="text"
                        id="phone_2"
                        formControlName="payee_phone"
                        [inputWidth]="'150px'"
                        mask="(000) 000-0000"
                      ></app-new-phone-input>
                     
                      </td>
                      <td>{{data.checkNo}}</td>
                      <td>${{ data.amount | number:'1.2-2' }}</td>
                      <td>
                        <div class="flex gap-1 items-center">
                         
                          <button
                          type="button"
                          class="attachment-btn pointer-events-none"
                          >
                            Add
                          </button>
                          
                          
                        </div>
                      </td>
                      <td>
                        <span class="font-bold">
                          $1.00</span
                        >
                      </td>
                    </tr>
                  </ng-container>
                </ng-container>
              </ng-container>
  
              <tr>
                <td colspan="7">
                 
                  
                </td>
  
                <td colspan="2" class="text-center">
                  <span class="font-bold"> TOTAL </span>
                </td>
  
                <td colspan="1">
                  <span class="font-bold">
                    $1.00</span
                  >
                </td>
              </tr>
            </tbody>
          </table>
        </form>
  

      </div>
    </div>
  
    <div class="ocw_modal_footer">
      <div>
       
      </div>
      <div>
        <mat-dialog-actions align="end">
            <div class="">

                <button
                  (click)="sendEmail()"
                  class="ocw-btn ocw-btn-modal-blue add_btn mr-2 mb-2"
                >
                  <span >Send Email</span>
                  
                </button>
            </div>
        </mat-dialog-actions>
      </div>
    </div>
  </div>
