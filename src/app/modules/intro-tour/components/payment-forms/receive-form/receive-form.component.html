<form class="main-container">
  <div class="w-full flex items-center flex-col">
    <app-amount-input
      [maxLength]="12"
      customClass="amount-input-v3 intro-amount-receive-payer intro-amount-receive-email intro-amount-receive-sms"
    ></app-amount-input>
  </div>
  <div class="flex flex-col items-center">
    <app-memo-input
      class="w-full intro-memo-receive-payer intro-memo-receive-email intro-memo-receive-sms"
    ></app-memo-input>
  </div>
  <div
    class="intro-receive-wrapper-div w-full flex justify-center items-center mt-5 gap-1"
  >
    @if (["payer_bank"].includes(formId())) {
      <div
        class="receive-from-bank-dropdown custom-input-v3-wrapper flex grow shadow !max-w-[340px]"
      >
        <app-intro-common-dropdown
          (change)="commonDropdownChange('.receive-from-payee-dropdown')"
          class="w-full"
          customHeight="3"
          [labelIconNeeded]="true"
          dropdownType="bankAccount"
          placeholder="Select Bank Account"
          (openDropdown)="introStepUpdate('.ng-dropdown-panel-items')"
          (closeDropdown)="introStepUpdate('.receive-from-payee-dropdown')"
        ></app-intro-common-dropdown>
      </div>
    }
    @if (["email_bank"].includes(formId())) {
      <div
        class="receive-from-email-input custom-input-v3-wrapper flex grow shadow rounded h-12 border-input-border-color border-[1px] text-sm"
      >
        <div
          class="icon-box flex justify-center items-center border-r-[1px] border-r-input-border-color border-solid h-full w-11"
        >
          <fa-icon
            [icon]="['fas', 'envelope']"
            class="text-xl text-common-violet-color"
          ></fa-icon>
        </div>
        <div class="select-container grow">
          <input
            type="text"
            placeholder="Enter Email"
            class="h-full w-full pl-[0.75rem] text-sm rounded-r-md"
          />
        </div>
      </div>
    }
    @if (["sms_bank"].includes(formId())) {
      <div
        class="receive-from-sms-input custom-input-v3-wrapper flex grow shadow rounded h-12 border-input-border-color border-[1px] text-sm"
      >
        <div
          class="icon-box flex justify-center items-center border-r-[1px] border-r-input-border-color border-solid h-full w-11"
        >
          <fa-icon
            [icon]="['fas', 'message']"
            class="text-xl text-common-red-color"
          ></fa-icon>
        </div>
        <div class="select-container grow">
          <div class="single_input mt-3">
            <input
              type="text"
              class="pl-2 w-full text-sm"
              placeholder="Enter Mobile No "
              ng2TelInput
              id="phone"
              mask="(000) 000-0000"
              name="phone"
            />
          </div>
        </div>
      </div>
    }
    <div class="arrow-wrapper flex justify-center items-center">
      <div class="arrow flex justify-center items-center text-sm opacity-60">
        <fa-icon [icon]="['fas', 'arrow-right-long']"></fa-icon>
      </div>
    </div>
    <div
      class="receive-from-payee-dropdown custom-input-v3-wrapper flex grow shadow !max-w-[350px]"
    >
      <app-intro-common-dropdown
        (change)="commonDropdownChange('#intro-home-receive-request-button')"
        class="w-full"
        customHeight="3"
        [labelIconNeeded]="true"
        dropdownType="payee"
        placeholder="Select Your Payee"
        (openDropdown)="introStepUpdate('.ng-dropdown-panel-items')"
        (closeDropdown)="introStepUpdate('#intro-home-receive-request-button')"
      ></app-intro-common-dropdown>
    </div>
  </div>
  <section class="flex items-center text-secondary-text-color gap-5 mt-5">
    <mat-checkbox class="flex items-center"
      >Editable
      <fa-icon
        [icon]="['fas', 'circle-question']"
        class="cursor-pointer text-common-blue-color"
        matTooltip="If you enable it, payer will be able to edit the Amount and Memo."
      ></fa-icon>
    </mat-checkbox>
    <div class="flex items-center gap-2">
      <mat-checkbox class="">Recurring</mat-checkbox>
      <fa-icon
        [icon]="['fas', 'pen-to-square']"
        class="cursor-pointer text-common-blue-color"
      ></fa-icon>
    </div>
  </section>
  <div class="pt-6 flex gap-2 justify-between">
    <app-common-button-v35
      class="flex-1 p-1"
      [type]="{ style: 'filled', name: 'main' }"
      backGroundInput="var(--common-green-color)"
      text="Request"
      width="100%"
      (clickEvent)="requestButton()"
      id="intro-home-receive-request-button"
    ></app-common-button-v35>
  </div>
</form>
