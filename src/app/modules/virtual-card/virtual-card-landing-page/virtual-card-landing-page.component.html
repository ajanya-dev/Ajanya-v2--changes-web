<div class="min-h-screen">
    <!-- Main Content -->
    <main class="container">
      <!-- Text Content -->
      <div class="text-content">
        <!-- <div class="welcome-text">Welcome to the future</div> -->
        <h1>
          <span>Coming Soon</span>
        </h1>
        <p>
          We're crafting something extraordinary. Join our exclusive demo to be the first to experience the innovation.
        </p>
        <div class="button-container">
          <button class="demo-button" (click)="joinDemo()">
            Join a Demo
          </button>
        </div>
      </div>
  
      <!-- Virtual Card Image -->
      <div class="card-section">
        <!-- Decorative elements -->
        <div class="decoration-1"></div>
        <div class="decoration-2"></div>
        
        <div class="card-container">
          <!-- Card Container with Shadow and Reflection -->
          <div class="card">
            <!-- Card Content -->
            <div class="card-top">
              <div class="card-header">
                <div class="card-title">PREMIUM CARD</div>
              </div>
              <div class="card-info">
                <div class="card-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                  </svg>
                </div>
                <div class="card-name">Golden Experience</div>
              </div>
              <div class="card-number">•••• •••• •••• xxxx</div>
            </div>
            <div class="card-bottom">
              <div class="card-details">
                <div class="card-holder">
                  <div class="label">CARD HOLDER</div>
                  <div class="value">PREMIUM MEMBER</div>
                </div>
                <div class="card-expires">
                  <div class="label">EXPIRES</div>
                  <div class="value">MM/YY</div>
                </div>
              </div>
            </div>
            <!-- Card holographic effect -->
            <div class="card-effect"></div>
          </div>
          
          <!-- Shadow/Reflection Cards (positioned behind main card) -->
          <div class="card-shadow-1"></div>
          <div class="card-shadow-2"></div>
        </div>
      </div>
    </main>
  
    <!-- Decorative circle -->
    <div class="decoration-bottom"></div>
    <div class="decoration-top"></div>
  </div>
