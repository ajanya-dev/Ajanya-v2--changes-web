@if(complianceFreeze()) {
  <app-compliance-freeze></app-compliance-freeze>
}@else{
<div
  class="main-container main-component-container px-1 pb-1 card-main-container h-full rounded overflow-hidden"
>
  @if (requestStatus() === "Loading") {
    <div class="h-full w-full flex justify-center items-center">
      <div class="loadingSpinner"></div>
    </div>
  }

  @if (showStatus()) {
    <app-application-status [status]="showStatus()" [receivedCardCount]="receivedCardCount()" (showReceivedGiftCards)="showReceivedGiftCards($event)" />
  }

  @if (noApplication() && showWelcomePage()) {
    <app-welcome-page (changeStatus)="onChangeStatus($event)" />
  }

  @if (requestStatus() === "Approved") {
    <iframe #virtualCardIframe class="h-full w-full" [src]="src" allow="camera; microphone"></iframe>
    <app-demo-video [slug]="isZilMoney ? 'virtual_card_zil' : 'virtual_card_ocw'" class="hidden" #demoVideo [clickedFromOutside]="clickedFromOutside" (clickedFromOutsideChange)="clickedFromOutside = $event"></app-demo-video>
  }
</div>
}
