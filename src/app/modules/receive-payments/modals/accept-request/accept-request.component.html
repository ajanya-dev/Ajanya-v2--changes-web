<div>
  <div class="alert_header">
    <div [mat-dialog-close]="false" class="flex justify-end">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      ></fa-icon>
    </div>
    <div class="alert_icon">
      <svg
        version="1.1"
        id="Layer_1"
        xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink"
        x="0px"
        y="0px"
        viewBox="0 0 512 512"
        style="enable-background: new 0 0 512 512"
        xml:space="preserve"
      >
        <ellipse
          style="fill: #1fa785"
          cx="256"
          cy="256"
          rx="256"
          ry="255.832"
        />
        <polygon
          style="fill: #ffffff"
          points="235.472,392.08 114.432,297.784 148.848,253.616 223.176,311.52 345.848,134.504 
                391.88,166.392 "
        />
      </svg>
    </div>
  </div>

  <div class="text-center py-5">
    <h2 class="font-inter text-common-green-color font-semibold text-base">
      {{ title }}
    </h2>
  </div>

  <div>
    @for (item of optionList; track item.id; let i = $index) {
      <div class="flex justify-between items-center gap-2 p-1">
        <span class="font-inter text-main-text-color text-sm font-normal">
          {{ i + 1 + "." }}{{ item.title }}
        </span>
        <app-common-button-v35
          [type]="item.btnType"
          [text]="item.name"
          (clickEvent)="onClick(item.id)"
          [isAddIcon]="true"
          [icon]="item.icon"
          width="120px"
        />
      </div>
    }
  </div>
</div>
