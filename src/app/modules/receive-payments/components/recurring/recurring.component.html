<div
  class="main-component-container h-full bg-secondary-background-color relative"
>
  <div
    class="common-transaction-table-container bg-main-background-color pt-3 px-5 min-w-[700px] rounded"
  >
    <div class="v3-data-table-header flex">
      <div
        class="text-base font-semibold text-main-text-color font-inter flex gap-1"
      >
        <app-common-back-button-v35 /> <span>Recurring</span>
      </div>
      <div
        class="v35-small-tabs rounded flex gap-3 cursor-pointer text-sm font-semibold filter-item ml-4 bg-tertiary-background-color"
      >
        @for (item of paymentsFilterArray; track item.id) {
          <div
            role="presentation"
            [ngClass]="{
              selected: item.id === activeFilterIndex
            }"
            (click)="changeTable(item.id)"
          >
            <h1>
              {{ item.filterName }}
            </h1>
          </div>
        }
      </div>
    </div>

    <div
      class="h-auto min-h-[500px] w-full pb-4 pr-2 overflow-hidden v3-payments-table pt-2.5"
    >
      @if (activeFilterIndex === 0) {
        <app-gpbf-recurring />
      }
      @if (activeFilterIndex === 1) {
        <app-ach-recurring />
      }
      @if (activeFilterIndex === 2) {
        <app-request-ach-payments />
      }
    </div>
  </div>
</div>
