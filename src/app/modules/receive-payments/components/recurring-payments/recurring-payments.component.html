<div class="data-table-wrapper bg-main-background-color">
  <div class="px-5 pt-3">
    <app-v3-data-table
      backButtonEnabled="true"
      dynamicHeaderText="Recurring Payments"
      [columnDefs]="columnDefs"
      [defaultColumnFields]="columnFields"
      [tableId]="tableId"
      selectedPanelButton="id_all"
      [frameworkComponents]="frameworkComponents"
      (cellRendererIdEvent)="actionClick($event)"
    >
    </app-v3-data-table>
  </div>
</div>
