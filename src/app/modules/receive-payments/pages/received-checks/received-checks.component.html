@if (isReceiveChecksReport()) {
  <app-v3-data-table
    [columnDefs]="columnDefs"
    [defaultColumnFields]="columnFields"
    [tableId]="tableId"
    [frameworkComponents]="frameworkComponents"
    (cellRendererViewEvent)="getViewAction($event)"
  >
  </app-v3-data-table>
} @else {
  <div class="data-table-wrapper bg-main-background-color rounded min-h-full">
    <div class="px-3 pt-3">
      <app-v3-data-table
        [columnDefs]="columnDefs"
        [tableId]="tableId"
        [backButtonEnabled]="!!backUrl"
        [defaultColumnFields]="columnFields"
        dynamicHeaderText="Receive Payments"
        selectedPanelButton="id_all"
        [headerElements]="headerElements()"
        [frameworkComponents]="frameworkComponents"
        [fieldsShownByDefault]="fieldsShownByDefault"
        [HeaderButtonLoadingProp]="HeaderButtonLoadingProp"
        (headerButtonEvent)="headerButtonNavigation($event)"
        (cellRendererViewEvent)="getViewAction($event)"
        (cellRendererIdEvent)="getActionComp($event)"
        [exportConfig]="exportConfig"
        (rowSelected)="onRowSelected($event)"
        (tableExportEvent)="onExportData($event)"
      >
      </app-v3-data-table>
    </div>
  </div>
}
