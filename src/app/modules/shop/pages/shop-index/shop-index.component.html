<section class="main_common_module">
  <div class="main_wrapper">
    <!-- HEADER START -->
    <div class="module_main_header">
      <div class="header_title">
        <h3>Shop</h3>
      </div>

      <div class="flex items-center gap-2">
        <a [routerLink]="['../cart']">
          <div class="mr-3" [matBadge]="cartCount">
            <svg
              aria-hidden="true"
              focusable="false"
              data-prefix="fas"
              data-icon="shopping-cart"
              class="svg-inline--fa fa-shopping-cart fa-w-18"
              role="img"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 576 512"
            >
              <path
                fill="currentColor"
                d="M528.12 301.319l47.273-208C578.806 78.301 567.391 64 551.99 64H159.208l-9.166-44.81C147.758 8.021 137.93 0 126.529 0H24C10.745 0 0 10.745 0 24v16c0 13.255 10.745 24 24 24h69.883l70.248 343.435C147.325 417.1 136 435.222 136 456c0 30.928 25.072 56 56 56s56-25.072 56-56c0-15.674-6.447-29.835-16.824-40h209.647C430.447 426.165 424 440.326 424 456c0 30.928 25.072 56 56 56s56-25.072 56-56c0-22.172-12.888-41.332-31.579-50.405l5.517-24.276c3.413-15.018-8.002-29.319-23.403-29.319H218.117l-6.545-32h293.145c11.206 0 20.92-7.754 23.403-18.681z"
              ></path>
            </svg>
          </div>
        </a>

        <span class="divider-y"></span>

        <a [routerLink]="['../order_history']">
          <div class="flex items-center gap-1">
            <span>Order History</span>

            <svg
              aria-hidden="true"
              focusable="false"
              data-prefix="far"
              data-icon="shopping-bag"
              class="svg-inline--fa fa-shopping-bag fa-w-14"
              role="img"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 448 512"
            >
              <path
                fill="currentColor"
                d="M352 128C352 57.42 294.579 0 224 0 153.42 0 96 57.42 96 128H0v304c0 44.183 35.817 80 80 80h288c44.183 0 80-35.817 80-80V128h-96zM224 48c44.112 0 80 35.888 80 80H144c0-44.112 35.888-80 80-80zm176 384c0 17.645-14.355 32-32 32H80c-17.645 0-32-14.355-32-32V176h48v40c0 13.255 10.745 24 24 24s24-10.745 24-24v-40h160v40c0 13.255 10.745 24 24 24s24-10.745 24-24v-40h48v256z"
              ></path>
            </svg>
          </div>
        </a>
      </div>
    </div>
    <!-- HEADER END -->

    <!-- MAIN BODY START -->
    <div class="module_main_body">
      <div class="items">
        <app-shop-item-card
          *ngFor="let product of productsList; let i = index"
          (productCounts)="productCountHandler($event)"
          [product]="product"
          [addToCarts]="addToCart"
        >
        </app-shop-item-card>
      </div>
    </div>
    <!-- MAIN BODY END -->
  </div>
</section>
