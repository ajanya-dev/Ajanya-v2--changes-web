<div class="main_div">
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">{{ data?.mode }} Shipping Address</div>
    <div class="close_btn" [mat-dialog-close]="false">
      <svg
        aria-hidden="true"
        focusable="false"
        data-prefix="fal"
        data-icon="times"
        class="svg-inline--fa fa-times fa-w-10"
        role="img"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 320 512"
      >
        <path
          fill="currentColor"
          d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
        ></path>
      </svg>
    </div>
  </div>

  <div class="ocw_modal_body">
    <form [formGroup]="addressForm">
      <div class="form_wrapper">
        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="firstName"
          />
          <span class="floating_label_field">
            First Name <span class="required">*</span></span
          >
          <app-control-message
            [control]="addressForm.controls.firstName"
            labelName="First Name is required"
          >
          </app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="lastName"
          />
          <span class="floating_label_field">
            Last Name <span class="required">*</span></span
          >
          <app-control-message
            [control]="addressForm.controls.lastName"
            labelName="Last Name is required"
          >
          </app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="companyName"
          />
          <span class="floating_label_field"> Company Name</span>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="addressLine1"
            #addressLine1
            (focus)="loadGoogleAddress(addressLine1)"
          />
          <span class="floating_label_field">
            Address Line 1 <span class="required">*</span></span
          >
          <app-control-message
            [control]="addressForm.controls.addressLine1"
            labelName="Address is required"
          >
          </app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="addressLine2"
          />
          <span class="floating_label_field"> Address Line 2 </span>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="city"
            maxlength="50"
          />
          <span class="floating_label_field">
            City <span class="required">*</span></span
          >
          <app-control-message
            [control]="addressForm.controls.city"
            labelName="City is required"
          >
          </app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="state"
          />
          <span class="floating_label_field">
            State <span class="required">*</span></span
          >
          <app-control-message
            [control]="addressForm.controls.state"
            labelName="State is required"
          >
          </app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="zip"
          />
          <span class="floating_label_field">
            Zip <span class="required">*</span></span
          >
          <app-control-message
            [control]="addressForm.controls.zip"
            labelName="Zip is required"
          >
          </app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="phone"
            (keypress)="utils.numberOnly($event, 'numeric')"
            mask="(000) 000-0000"
          />
          <span class="floating_label_field">
            Phone <span class="required">*</span></span
          >
          <app-control-message
            [control]="addressForm.controls.phone"
            labelName="Phone is required"
          >
          </app-control-message>
        </div>

        <div class="single_input">
          <select class="input_style" formControlName="country" placeholder=" ">
            <option value="USA">USA</option>
          </select>
          <span class="floating_label_field">
            Country <span class="required">*</span></span
          >
          <app-control-message
            [control]="addressForm.controls.country"
            labelName="Country is required"
          >
          </app-control-message>
        </div>
      </div>
    </form>
  </div>

  <div class="ocw_modal_footer">
    <mat-dialog-actions align="end">
      <button mat-dialog-close class="ocw-btn ocw-btn-modal-bordered">
        Close
      </button>
      <button
        type="submit"
        class="ocw-btn ocw-btn-modal-blue add_btn"
        (click)="addAddress()"
        *ngIf="!isForUpdate"
      >
        <svg
          aria-hidden="true"
          focusable="false"
          data-prefix="fas"
          data-icon="plus"
          class="svg-inline--fa fa-plus fa-w-14"
          role="img"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 448 512"
        >
          <path
            fill="currentColor"
            d="M416 208H272V64c0-17.67-14.33-32-32-32h-32c-17.67 0-32 14.33-32 32v144H32c-17.67 0-32 14.33-32 32v32c0 17.67 14.33 32 32 32h144v144c0 17.67 14.33 32 32 32h32c17.67 0 32-14.33 32-32V304h144c17.67 0 32-14.33 32-32v-32c0-17.67-14.33-32-32-32z"
          ></path>
        </svg>
        <span>Add</span>
        <!-- <span *ngIf="btnDesable" class="loadingSpinner"></span> -->
      </button>
      <button
        type="submit"
        class="ocw-btn ocw-btn-modal-blue add_btn"
        (click)="updateAddress()"
        *ngIf="isForUpdate == true"
      >
        <!-- <svg aria-hidden="true" focusable="false" data-prefix="fas" data-icon="plus" class="svg-inline--fa fa-plus fa-w-14" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path fill="currentColor" d="M416 208H272V64c0-17.67-14.33-32-32-32h-32c-17.67 0-32 14.33-32 32v144H32c-17.67 0-32 14.33-32 32v32c0 17.67 14.33 32 32 32h144v144c0 17.67 14.33 32 32 32h32c17.67 0 32-14.33 32-32V304h144c17.67 0 32-14.33 32-32v-32c0-17.67-14.33-32-32-32z"></path></svg> -->
        <span>Update</span>
        <!-- <span *ngIf="btnDesable" class="loadingSpinner"></span> -->
      </button>
    </mat-dialog-actions>
  </div>
</div>
