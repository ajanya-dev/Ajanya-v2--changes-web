<mat-card appearance="outlined">
  <img
    class="item_image"
    alt="product"
    mat-card-image
    src="https://c.onlinecheckwriter.com/public/images/cart-product.jpg"
  />
  <mat-card-content>
    @if (isShowOutOfstock) {
      <div class="text"><p>Temporarily Out of Stock</p></div>
    }
  </mat-card-content>
  <mat-card-header>
    <div mat-card-avatar></div>
    <mat-card-title>{{ product?.name }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="flex justify-center font-medium price">
      ${{ product.price }}
    </div>
  </mat-card-content>
  <mat-card-actions>
    <div class="flex items-end justify-center gap-2">
      <div class="single_input">
        <input
          type="text"
          class="input_style"
          placeholder=" "
          maxlength="6"
          [value]="1"
          (keypress)="utils.numberOnly($event, 'numeric')"
          #quantity
        />
        <span class="floating_label_field">Qty</span>
      </div>

      <button
        class="ocw-btn ocw-btn-light-green"
        (click)="addToCart(product, quantity.value)"
        [disabled]="isDisable"
        [ngClass]="{ 'disable-btn': isShowOutOfstock }"
      >
        <div class="flex items-center gap-1">
          <fa-icon class="text-xl" [icon]="['fas', 'shopping-cart']"></fa-icon>
          <span> ADD TO CART </span>
        </div>
      </button>
    </div>
  </mat-card-actions>
</mat-card>
