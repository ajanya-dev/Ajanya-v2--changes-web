<div class="px-[6px] pb-[6px]">
  <!-- modal header -->
  <div class="flex justify-between pb-6">
    <div></div>

    <div [mat-dialog-close]="false" class="flex items-end">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      ></fa-icon>
    </div>
  </div>
  <!-- modal body start -->
  <div>
    <div class="pb-6 flex justify-center">
      <img
        ngSrc="/assets/images/integration/odoo.png"
        alt="odoo logo"
        width="190"
        height="75"
      />
    </div>
    <div>
      <div class="pb-3">
        <p class="font-inter font-bold text-main-text-color text-base">
          Enter your Odoo Credentials:
        </p>
      </div>
      <div class="border border-input-border-color rounded-lg">
        <div class="border-b border-input-border-color px-3 py-2">
          <span class="text-secondary-text-color font-inter font-medium text-xs"
            >How do I find my Odoo Credentials?</span
          >
        </div>
        <div class="overflow-y-auto px-3 py-2 max-h-52">
          <div class="text-main-text-color font-inter font-normal text-[13px]">
            <ol class="pb-3">
              <li>Log into your Odoo portal.</li>
              <li>
                <p>
                  Copy the <b>DB</b> of the URL at the top of your browser and
                  enter it within Merge Link.
                </p>
              </li>
            </ol>
            <ul>
              <li>
                Your Odoo DB is the combination of letters or numbers before
                "app.odoo.com"
              </li>
            </ul>
          </div>
        </div>
      </div>
      <form [formGroup]="odooConnectionForm">
        <div class="flex flex-col gap-3 my-4">
          <div>
            <app-common-input-field
              placeholder="Enter DB"
              formControlName="db"
            />
            <app-control-message-v35
              [control]="odooConnectionForm.controls.db"
            />
          </div>
          <div>
            <app-common-input-field
              placeholder="Username"
              formControlName="username"
            />
            <app-control-message-v35
              [control]="odooConnectionForm.controls.username"
            />
          </div>
          <div>
            <app-common-input-field
              placeholder="API Key"
              formControlName="api_key"
            />
            <app-control-message-v35
              [control]="odooConnectionForm.controls.api_key"
            />
          </div>
        </div>
      </form>
    </div>
  </div>
  <!-- modal body end -->
  <div class="flex w-full pt-8">
    <app-common-button-v35
      width="340px"
      [type]="{ style: 'modal', name: 'main' }"
      text="Submit"
      (clickEvent)="onSubmit()"
      [disabled]="isLoading"
      [loading]="isLoading"
    ></app-common-button-v35>
  </div>
</div>
