<div class="mx-3 flex flex-col justify-center items-center gap-3 lg:flex-row">
  <div
    class="mx-3 flex flex-col justify-center gap-3 xl:flex-row max-w-[1170px]"
  >
    <div
      class="flex-1 flex-col rounded-md bg-main-background-color min-w-[900px] p-6"
    >
      <div class="flex justify-between">
        <div class="flex justify-start gap-4 items-center">
          <app-ocw-back-button backUrl="manage/thirdparty_app/index">
          </app-ocw-back-button>
          <h3 class="header font-semibold text-lg font-inter">
            Square Integration
          </h3>
        </div>
        <div>
          <!-- help-video -->
        </div>
      </div>
      <div class="flex justify-center items-center mt-3 min-w-[600px]">
        <div
          class="min-w-[800px] min-h-[120px] flex bg-main-background-color border-2 border-input-border-color rounded-xl"
        >
          <div class="min-w-[100px]">
            <img
              height="100"
              width="210"
              ngSrc="/assets/images/integration/square.webp"
              class="!rounded-xl"
              alt=""
            />
          </div>
          <div
            class="flex-1 flex justify-between items-center px-4"
            [ngClass]="this.loading.globalLoading ? 'skelton' : ''"
          >
            <div class="flex flex-col">
              <div>
                <span class="font-inter text-main-text-color font-semibold"
                  >Square</span
                >
              </div>
              <div>
                <span class="font-inter text-main-text-color text-sm"
                  >Status:
                  <span
                    [ngClass]="
                      isConnected()
                        ? 'text-common-green-color font-semibold'
                        : 'text-common-red-color font-semibold'
                    "
                    >{{ isConnected() ? "Connected" : "Disconnected" }}</span
                  ></span
                >
              </div>
            </div>
            <div>
              @if (!isConnected()) {
                <button
                  type="button"
                  class="ocw-btn ocw-btn-dark-green single_btn mr-4"
                  (click)="connectToSquare()"
                  [ngStyle]="{
                    'pointer-events': loading.defaultLoading ? 'none' : 'auto'
                  }"
                >
                  @if (!loading.defaultLoading) {
                    <span>Connect</span>
                  } @else {
                    <div class="btn_spinner_wrapper">
                      <span class="loadingSpinner"></span>
                      <span>Connecting</span>
                    </div>
                  }
                </button>
              } @else {
                <button
                  type="button"
                  class="ocw-btn ocw-btn-trash single_btn mr-4"
                  (click)="onDisconnectSquare()"
                  [ngStyle]="{
                    'pointer-events': loading.defaultLoading ? 'none' : 'auto'
                  }"
                >
                  @if (!loading.defaultLoading) {
                    <span>Disconnect</span>
                  } @else {
                    <div class="btn_spinner_wrapper">
                      <span class="loadingSpinner"></span>
                      <span>Disconnecting</span>
                    </div>
                  }
                </button>
              }
            </div>
          </div>
        </div>
      </div>
      @if(isConnected()){
      <div class="w-full flex justify-end mt-4">
        <button
          type="button"
          class="ocw-btn ocw-btn-dark single_btn mr-4"
          (click)="import(2)"
          [ngStyle]="{
            'pointer-events': isImportLoading.customerImportLoading
              ? 'none'
              : 'auto'
          }"
        >
          @if (!isImportLoading.customerImportLoading) {
            <span>Import Customers</span>
          } @else {
            <div class="btn_spinner_wrapper">
              <span class="loadingSpinner"></span>
              <span>Importing Customers..</span>
            </div>
          }
        </button>
        <button
          type="button"
          class="ocw-btn ocw-btn-dark single_btn mr-4"
          (click)="import(3)"
          [ngStyle]="{
            'pointer-events': isImportLoading.vendorImportLoading
              ? 'none'
              : 'auto'
          }"
        >
          @if (!isImportLoading.vendorImportLoading) {
            <span>Import Vendors</span>
          } @else {
            <div class="btn_spinner_wrapper">
              <span class="loadingSpinner"></span>
              <span>Importing Vendors..</span>
            </div>
          }
        </button>
        <button
          type="button"
          class="ocw-btn ocw-btn-dark single_btn mr-4"
          (click)="import(4)"
          [ngStyle]="{
            'pointer-events': isImportLoading.employeeImportLoading
              ? 'none'
              : 'auto'
          }"
        >
          @if (!isImportLoading.employeeImportLoading) {
            <span>Import Employees</span>
          } @else {
            <div class="btn_spinner_wrapper">
              <span class="loadingSpinner"></span>
              <span>Importing Employees..</span>
            </div>
          }
        </button>
      </div>
    }
    </div>
    <div class="rounded-md lg:w-[400px]">
      <div
        class="h-[140px] rounded-md bg-main-background-color xl:w-[400px] p-4 mb-3"
      >
        <h4 class="text-main-text-color font-bold font-inter">Instructions</h4>
        <div class="mt-4">
          <fa-icon
            [icon]="faChevronRight"
            class="text-secondary-text-color mr-2"
          ></fa-icon>
          <span class="text-sm text-main-text-color font-semibold"
            >Click on connect</span
          >
        </div>
        <div>
          <fa-icon
            [icon]="faChevronRight"
            class="text-secondary-text-color mr-2"
          ></fa-icon>
          <span class="text-sm text-main-text-color font-semibold"
            >Authenticate with your Square credentials</span
          >
        </div>
      </div>
      <div
        class="h-[170px] rounded-md bg-main-background-color xl:w-[400px] p-4"
      >
        <app-customer-support></app-customer-support>
      </div>
    </div>
  </div>
</div>
