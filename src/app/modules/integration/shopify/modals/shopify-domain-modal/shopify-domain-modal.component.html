<div class="px-[6px] pb-[6px]">
  <div class="flex justify-between pb-6">
    <div>
      <span class="mt-18 w-full text-base text-main-text-color align-middle flex items-center">
        <fa-icon class="!text-[20px]" [icon]="faStore"></fa-icon>
        <span class="pl-1 font-inter font-semibold text-base pb-0.5"> Connect to Shopify </span>
      </span>
    </div>
    <div [mat-dialog-close]="null">
      <fa-icon class="text-secondary-text-color cursor-pointer" [icon]="faXmark"></fa-icon>
    </div>
  </div>

  <div>
    <form [formGroup]="shopForm" class="space-y-4">
      <div class="w-full">
        <app-common-input-field
          [placeholder]="'e.g. mystore.myshopify.com'"
          formControlName="shop"
          [isFieldRequired]="true"
          class="w-full"
        ></app-common-input-field>
        <app-control-message-v35
          [control]="shopForm.controls.shop"
        ></app-control-message-v35>
      </div>
    </form>
  </div>

  <div class="flex justify-end gap-3 pt-8">
    <app-common-button-v35
      [type]="{ style: 'bordered', name: 'main' }"
      [text]="'Cancel'"
      [mat-dialog-close]="null"
      width="125px"
    ></app-common-button-v35>

    <app-common-button-v35
      [type]="{ style: 'modal', name: 'main' }"
      [text]="'Connect'"
      (click)="onConnect()"
      width="125px"
    ></app-common-button-v35>
  </div>
</div>
