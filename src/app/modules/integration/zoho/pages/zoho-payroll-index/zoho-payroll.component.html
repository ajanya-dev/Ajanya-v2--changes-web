<!-------- main_common_module start -------->
<section class="main_common_module">
  <!--------left section start -------->
  <div class="main_left_wrapper">
    <!--------top section start -------->
    <div class="module_top_section">
      <div class="module_main_header">
        <div class="header_title flex items-center gap-1">
          <app-ocw-back-button backUrl="manage/thirdparty_app/index">
          </app-ocw-back-button>

          <h3>Third Party Integration</h3>
        </div>
        <!-- <app-demo-video slug="check"></app-demo-video> -->
      </div>
      <div class="module_main_body">
        <!-------- top-box start start -------->
        <section
          class="top-box mt-6 border-solid border-2 border-input-border-color relative"
        >
          <div class="logo-bg"></div>
          <div class="top-twobox">
            <div class="top-box-centr main-bx-padding">
              <p class="main-p">Zoho Payroll</p>
              <div class="status-color">
                <p>
                  <span>Status:</span
                  ><span class="green-clr" *ngIf="isConnected != undefined">{{
                    isConnected ? "Connected" : "Disconnected"
                  }}</span>
                </p>
              </div>
            </div>
            <div class="top-box-right main-bx-padding buton-desk">
              <button
                *ngIf="!isConnected"
                type="button"
                class="ocw-btn ocw-btn-dark-green single_btn mr-4"
                (click)="onConnectZohoPayroll()"
                [ngStyle]="{
                  'pointer-events': loading.defaultLoading ? 'none' : 'auto'
                }"
              >
                <span *ngIf="!loading.defaultLoading; else spinnerConnect"
                  >Connect</span
                >

                <ng-template #spinnerConnect>
                  <div class="btn_spinner_wrapper">
                    <span class="loadingSpinner"></span>
                    <span>Connecting</span>
                  </div>
                </ng-template>
              </button>
              <button
                *ngIf="isConnected"
                type="button"
                class="ocw-btn ocw-btn-trash single_btn mr-4"
                (click)="onDisconnectToZohoPayroll()"
                [ngStyle]="{
                  'pointer-events': loading.defaultLoading ? 'none' : 'auto'
                }"
              >
                <span *ngIf="!loading.defaultLoading; else spinnerConnect"
                  >Disconnect</span
                >

                <ng-template #spinnerConnect>
                  <div class="btn_spinner_wrapper">
                    <span class="loadingSpinner"></span>
                    <span>Disconnecting</span>
                  </div>
                </ng-template>
              </button>
              <button
                type="button"
                id="import_desk"
                class="ocw-btn ocw-btn-dark single_btn"
                (click)="importCompany()"
                *ngIf="isConnected"
                [ngStyle]="{
                  'pointer-events':
                    loading.importCompany || loading.defaultLoading
                      ? 'none'
                      : 'auto'
                }"
              >
                <span *ngIf="!loading.importCompany; else spinnerCompany"
                  >Import Companies</span
                >
                <ng-template #spinnerCompany>
                  <div class="btn_spinner_wrapper">
                    <span class="loadingSpinner"></span>
                    <span>Importing </span>
                  </div>
                </ng-template>
              </button>
            </div>
          </div>

          <div class="top-box-img"></div>
          <div class="top-box-img-2"></div>

          <div class="logo-sec">
            <img src="../../../../assets/images/logos/zoho-payroll-logo.png" />
          </div>
        </section>
        <div class="top-box-right main-bx-padding mr-8 buton-mobile">
          <button
            type="button"
            class="ocw-btn ocw-btn-dark-green single_btn mr-4"
            id="connect_desk_btn"
            (click)="onConnectZohoPayroll()"
            [ngStyle]="{
              'pointer-events': loading.defaultLoading ? 'none' : 'auto'
            }"
          >
            <span>Connect</span>
          </button>
          <button
            type="button"
            class="ocw-btn ocw-btn-dark single_btn"
            (click)="importCompany()"
            *ngIf="isConnected"
            [ngStyle]="{
              'pointer-events':
                loading.importCompany || loading.defaultLoading
                  ? 'none'
                  : 'auto'
            }"
          >
            <span *ngIf="!loading.importCompany; else spinnerCompany"
              >Import Companies</span
            >
            <ng-template #spinnerCompany>
              <div class="btn_spinner_wrapper">
                <span class="loadingSpinner"></span>
                <span>Importing </span>
              </div>
            </ng-template>
          </button>
        </div>
        <!-------- second-area start -------->
        <section class="second-area">
          <ng-container
            *ngIf="zohoPayrollData?.companies.length && !PayPeriodData"
          >
            <div class="for-compny-data main-head">
              <div class="company-name-sec">
                <h3 class="main-h4 text-left">Company Name</h3>
              </div>
              <div class="compny-updte-sec text-center">
                <h3 class="main-h4 text-center">Last Updated</h3>
              </div>
              <div></div>
            </div>
            <!-- List companies start -->
            <div class="company_details">
              <ng-container
                *ngFor="
                  let company of zohoPayrollData?.companies;
                  let i = index
                "
              >
                <div class="for-compny-data">
                  <div class="left_side_wrapper">
                    <div class="company-name-sec">
                      <h3 class="main-h4 text-left">
                        {{ company.companyName }}
                      </h3>
                    </div>
                    <div class="compny-updte-sec text-center">
                      <h3 class="main-h4">{{ company.lastUpdated }}</h3>
                    </div>
                  </div>
                  <div
                    class="compny-btn-sec text-right"
                    [ngStyle]="{
                      'pointer-events':
                        loading.importCompany || loading.companyLoading
                          ? 'none'
                          : 'auto'
                    }"
                  >
                    <ng-container *ngIf="loading.companyLoading != i">
                      <p
                        matTooltip="View payroll details"
                        (click)="importPayPeriod(company.companyId, i)"
                      >
                        <i
                          _ngcontent-dvo-c398=""
                          mattooltip="View"
                          class="mat-tooltip-trigger fa fa-eye eye"
                          ng-reflect-message="View"
                          aria-describedby="cdk-describedby-message-47"
                          cdk-describedby-host="0"
                        ></i>
                      </p>
                    </ng-container>
                    <span
                      class="loadingSpinner"
                      *ngIf="loading.companyLoading == i"
                    ></span>
                  </div>
                </div>
              </ng-container>
            </div>
            <!-- List companies end -->
          </ng-container>
        </section>

        <!--  Pay period data-->
        <ng-container *ngIf="PayPeriodData">
          <app-zoho-payroll-import-pay-period
            [PayPeriodData]="PayPeriodData"
            [companyId]="selectedCompanyId"
          >
          </app-zoho-payroll-import-pay-period>
        </ng-container>

        <div class="flex justify-end items-center bank-ac-map">
          <button
            type="button"
            class="ocw-btn ocw-btn-peacock single_btn"
            (click)="viewBankAccounts()"
          >
            Bank Account Mapping
          </button>
        </div>
      </div>
    </div>
  </div>
  <!-------- right section start -------->
  <div class="main_right_section">
    <div class="module_top_section">
      <div class="main__header">
        <div class="left">
          <p class="sub_head">Instructions</p>
        </div>
      </div>
      <!-------- module_body start -------->
      <div class="module_body">
        <div class="p-arrow">
          <div class="p-arrow-text" *ngFor="let item of instructions">
            <span>
              <p>{{ item }}</p>
            </span>
          </div>
        </div>
      </div>
    </div>
    <!-------- module_bottom_section start -------->
    <div class="module_bottom_section">
      <app-customer-support></app-customer-support>
    </div>
  </div>
</section>
<!-------- main_common_module end -------->
