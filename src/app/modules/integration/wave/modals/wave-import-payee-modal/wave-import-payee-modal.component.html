<div class="component-container flex flex-col">
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">Select a Company to Import {{ 'Payee' | whiteLabel: 'payeeName'}}</div>
    <div class="close_btn" [mat-dialog-close]="false">
      <i class="fa-duotone fa-x"></i>
    </div>
  </div>
  <div class="company-list grow">
    <div
      class="company-item flex items-center"
      *ngFor="let company of companies; let i = index"
    >
      <input
        type="radio"
        class="checkbx-left"
        [id]="'companycheckbox_' + i"
        [value]="company"
        [(ngModel)]="companySelected"
      /><label [for]="'companycheckbox_' + i" class="name-label pl-3">
        <span>{{ company?.companyName }}</span></label
      >
    </div>
  </div>
  <div class="import-section flex justify-end pt-4">
    <button
      type="button"
      class="ocw-data-btn ocw-btn ocw-btn-modal-blue"
      (click)="onImportClicked()"
    >
      <i class="fa-solid fa-down-to-line"></i> Import
    </button>
  </div>
</div>
