<div class="ocw_man_modal_wrapper">
  <!-- modal header -->
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">
      {{ !editmode ? "Bank Account Mapping" : "Update Bank Account Mapping" }}
    </div>
  </div>
  <!-- modal body start -->
  <div class="ocw_modal_body">
    <!-- <div>
        <span> QuickBooks Bank Account : </span>{{data.data.quickBookAccount}}
      </div>
      <div>
        <span> QuickBooks Company Name : </span>
        {{data.data.companyName}}
      </div> -->

    <!-- <div class="detail">
        <p>
          You are mapping the QuickBooks bank account <span class="font-bold">{{data?.data?.quickBookAccount}}</span> from QuickBooks company <span class="font-bold">{{data?.data?.QBCompanyName}}</span>   to OCW bank account.
        </p>
      </div> -->

    <div class="p-2.5">
      <p>Select a bank account to map:</p>
      <app-drop-down-bank
        (selectionEvent)="bankDropDownChange($event)"
        [ismapping]="ismapping"
        class="drop_style"
      >
      </app-drop-down-bank>
      <app-control-message
        [control]="bankAccount"
        labelName="Please select bank account"
      >
      </app-control-message>
    </div>
  </div>
  <!-- modal body end -->
  <div class="ocw_modal_footer">
    <mat-dialog-actions align="end">
      <button mat-dialog-close class="ocw-btn ocw-btn-modal-bordered">
        Cancel
      </button>
      <button
        type="submit"
        (click)="submit()"
        class="ocw-btn ocw-btn-modal-blue add_btn"
      >
        <span *ngIf="!loading; else spinner">Map Now</span>
        <ng-template #spinner>
          <span class="loadingSpinner"></span>
        </ng-template>
      </button>
    </mat-dialog-actions>
  </div>
</div>
