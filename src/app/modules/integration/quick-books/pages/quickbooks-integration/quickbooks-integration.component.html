<section class="common-center-box">
  <div class="quickbook-title">
    <div class="main-title">
      <h3>QUICKBOOKS INTEGRATION</h3>
      <p class="para-top">
        Integrate your {{ appConfig.websiteTitle }} account with QuickBooks
      </p>
    </div>
  </div>

  <div class="quickbook-box-row">
    <div
      class="quickbook-second-box"
      *ngFor="let items of quickbookLinks"
      [ngStyle]="items?.styles"
    >
      <div class="quickbook-mainbox" routerLink="{{ items.routerLink }}">
        <img src="{{ items.icon }}" [ngStyle]="items?.styles?.img" />
        <p>{{ items.title }}</p>
        <span class="arrow_box">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
            focusable="false"
            data-prefix="fas"
            data-icon="chevron-right"
            class="svg-inline--fa fa-chevron-right fa-w-10"
            role="img"
            viewBox="0 0 320 512"
          >
            <path
              fill="currentColor"
              d="M285.476 272.971L91.132 467.314c-9.373 9.373-24.569 9.373-33.941 0l-22.667-22.667c-9.357-9.357-9.375-24.522-.04-33.901L188.505 256 34.484 101.255c-9.335-9.379-9.317-24.544.04-33.901l22.667-22.667c9.373-9.373 24.569-9.373 33.941 0L285.475 239.03c9.373 9.372 9.373 24.568.001 33.941z"
            />
          </svg>
        </span>
      </div>
    </div>
  </div>

  <div class="quickbook-title">
    <div class="main-title" id="other-detail">
      <h3 class="other-inte">OTHER INTEGRATION</h3>
    </div>
  </div>

  <div class="quickbook-box-row">
    <div
      class="quickbook-second-box"
      *ngFor="let items of otherIntegrationLink"
      [ngStyle]="items?.styles"
    >
      <div class="quickbook-mainbox" (click)="navigate(items)">
        <img src="{{ items.icon }}" [ngStyle]="items?.styles?.img" />
        <p>{{ items.title }}</p>
        <span *ngIf="items.comingSoon" class="comingsoon-box">
          <p>Coming Soon</p>
        </span>
        <span *ngIf="!items.comingSoon" class="arrow_box id">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
            focusable="false"
            data-prefix="fas"
            data-icon="chevron-right"
            class="svg-inline--fa fa-chevron-right fa-w-10"
            role="img"
            viewBox="0 0 320 512"
          >
            <path
              fill="currentColor"
              d="M285.476 272.971L91.132 467.314c-9.373 9.373-24.569 9.373-33.941 0l-22.667-22.667c-9.357-9.357-9.375-24.522-.04-33.901L188.505 256 34.484 101.255c-9.335-9.379-9.317-24.544.04-33.901l22.667-22.667c9.373-9.373 24.569-9.373 33.941 0L285.475 239.03c9.373 9.372 9.373 24.568.001 33.941z"
            />
          </svg>
        </span>
      </div>
    </div>
  </div>
</section>
