<div class="ocw_man_modal_wrapper">
  <!-- modal header -->
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">
      {{ !data.editMode ? "Bank Account Mapping" : "Update Bank Account Mapping" }}
    </div>
  </div>
  <!-- modal body start -->
  <div class="ocw_modal_body">
    <div class="detail">
      <p>
        You are mapping the QuickBooks Online Payroll company
        <span class="font-bold">{{ data.companyName }}</span> to an OCW bank
        account.
      </p>
    </div>

    <div class="p-2.5">
      <p>Select a bank account to map:</p>
      <app-drop-down-bank
        (selectionEvent)="bankDropDownChange($event)"
        class="drop_style"
      >
      </app-drop-down-bank>
      <app-control-message
        [control]="bankAccount"
        labelName="Please select bank account"
      >
      </app-control-message>
    </div>
  </div>
  <!-- modal body end -->
  <div class="ocw_modal_footer">
    <mat-dialog-actions align="end">
      <button mat-dialog-close class="ocw-btn ocw-btn-gray">Cancel</button>
      <button
        type="submit"
        (click)="submit()"
        class="ocw-btn ocw-btn-light-green add_btn"
      >
        @if (loading) {
          <span class="loadingSpinner"></span>
        } @else {
          <span>{{ data.editMode ? "Update" : "Map Now" }}</span>
        }
      </button>
    </mat-dialog-actions>
  </div>
</div>
