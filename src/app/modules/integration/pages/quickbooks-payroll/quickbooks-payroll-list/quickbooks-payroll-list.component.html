<div class="quickbooks_payroll_list">
  <div class="top_section">
    <div class="btn_radio_wrapper">
      <div class="back_button">
        <button
          type="button"
          class="ocw-btn ocw-btn-dark single_btn"
          matTooltip="Back to company list"
          (click)="onGoBack()"
        >
          <fa-icon [icon]="faArrowLeft"></fa-icon>
          <span>Back</span>
        </button>
      </div>
      <div class="fetch_button">
        <button
          type="button"
          class="ocw-btn ocw-btn-dark-green single_btn"
          [disabled]="fetching"
          (click)="onFetchPayroll()"
        >
          <span>{{ fetching ? "Fetching..." : "Fetch Payroll" }}</span>
        </button>
      </div>
    </div>
  </div>
  <div class="ocw_table_wrapper">
    <div class="pl-3 py-2 font-semibold text-main-text-color">
      Company:
      <span class="text-secondary-text-color">{{
        companyName | titlecase
      }}</span>
    </div>
    <table class="ocw-table ocw-table-striped">
      <thead>
        <tr>
          @for (header of tableHeaders; track header) {
            <td>{{ header }}</td>
          }
        </tr>
      </thead>

      <tbody>
        @for (row of payrollDetails; track $index) {
          <tr>
            <td>{{ row.payPeriodFrom }} to {{ row.payPeriodTo }}</td>
            <td>{{ row.processedDate }}</td>
            <td>{{ row.checkDate }}</td>
            <td>
              <div class="action_buttons">
                <button
                  type="button"
                  class="ocw-btn single_btn"
                  [ngClass]="
                    row.isImported === 1 || !isBankMapped
                      ? 'ocw-btn-gray pointer-events-none'
                      : 'ocw-btn-dark-green'
                  "
                  [disabled]="
                    row.isImported === 1 ||
                    !isBankMapped ||
                    creatingPayrollId === row.payrollId
                  "
                  [matTooltip]="
                    !isBankMapped
                      ? 'Map a bank account for this company first'
                      : row.isImported === 1
                        ? 'Checks already created for this pay run'
                        : 'Create Check'
                  "
                  (click)="onCreateCheck(row)"
                >
                  <span>{{
                    creatingPayrollId === row.payrollId
                      ? "Creating..."
                      : "Create"
                  }}</span>
                </button>
                <fa-icon
                  [icon]="faEye"
                  class="view_icon"
                  matTooltip="View Details"
                  (click)="onViewDetails(row)"
                ></fa-icon>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
