<!-------- main_common_module start -------->
<section class="main_common_module">
  <!--------left section start -------->
  <div class="main_left_wrapper">
    <!--------top section start -------->
    <div class="module_top_section">
      <div class="module_main_header">
        <div class="header_title flex items-center gap-1">
          <app-ocw-back-button backUrl="manage/thirdparty_app/index">
          </app-ocw-back-button>
          <h3>Third Party Integration</h3>
        </div>
        <div class="help_video">
          <app-demo-video slug="sage"></app-demo-video>
        </div>
      </div>
      <div
        class="module_main_body"
        [ngStyle]="{
          'pointer-events': loading?.globalLoading ? 'none' : 'auto'
        }"
      >
        <!-------- top-box start -------->
        <section
          class="top-box mt-6 border-solid border-2 border-input-border-color relative"
        >
          <div class="logo-bg"></div>
          <div class="top-twobox">
            <div class="top-box-centr main-bx-padding">
              <p class="main-p">Sage Business Cloud Accounting</p>
              <div class="status-color">
                <p>
                  <span>Status:</span>
                  <span class="green-clr" *ngIf="isConnected">{{
                    "Connected"
                  }}</span>
                  <span class="red-clr" *ngIf="!isConnected">{{
                    "Disconnected"
                  }}</span>
                </p>
              </div>
            </div>
            <div
              class="top-box-right main-bx-padding mr-8 buton-desk"
              *ngIf="sageBusinessData"
            >
              <button
                *ngIf="!isConnected"
                type="button"
                class="ocw-btn ocw-btn-dark-green single_btn mr-4"
                (click)="onConnectSageBusiness()"
                [ngStyle]="{
                  'pointer-events': loading?.connecting ? 'none' : 'auto'
                }"
              >
                <span *ngIf="!loading?.connecting; else spinnerConnect"
                  >Connect</span
                >
                <ng-template #spinnerConnect>
                  <div class="btn_spinner_wrapper">
                    <span class="loadingSpinner"></span>
                    <span>Connecting</span>
                  </div>
                </ng-template>
              </button>
            </div>
          </div>
          <div class="top-box-img"></div>
          <div class="top-box-img-2"></div>
          <div class="logo-sec">
            <img
              src="../../../../../assets/images/integration/sage.png"
              alt="Sgae Business Cloud Accounting logo"
            />
          </div>
        </section>
        <!-------- table-main-sec start -------->
        <div class="table-main-sec">
          <div class="overflow-x-auto mt-10 mb-10 flex justify-center">
            <table class="table-auto w-11/12">
              <thead
                class="text-xs font-semibold uppercase ocw-table-light"
                *ngIf="sageBusinessData?.companies?.length"
              >
                <tr>
                  <th class="whitespace-nowrap">
                    <h3 class="main-h4 text-left">Company Name</h3>
                  </th>
                  <th class="p-2 whitespace-nowrap">
                    <h3 class="main-h4 text-left">Last Update</h3>
                  </th>
                  <th class="p-2 whitespace-nowrap">
                    <h3 class="main-h4 text-left">Action</h3>
                  </th>
                </tr>
              </thead>
              <tbody class="text-sm">
                <ng-container
                  *ngFor="
                    let company of sageBusinessData?.companies;
                    let i = index
                  "
                >
                  <tr>
                    <td>{{ company.companyName }}</td>
                    <td>{{ company.lastUpdated }}</td>
                    <td>
                      <div class="action_buttons">
                        <p
                          matTooltip="Disconnect"
                          (click)="onDisconnectToSageBusiness()"
                        >
                          Disconnect
                        </p>
                      </div>
                    </td>
                  </tr>
                </ng-container>
              </tbody>
            </table>
          </div>
          <!-- defalut loader -->
          <div
            class="data_spinner"
            [ngClass]="{ data_fetched: !loading?.defaultLoading }"
          ></div>
        </div>
        <div class="flex justify-end items-center bank-ac-map">
          <button
            type="button"
            class="ocw-btn ocw-btn-light-dark single_btn"
            (click)="importPayee()"
            matTooltip="Import your payees from Sage business to onlinecheckwriter.com."
          >
            <i class="fa-solid fa-down-to-line mr-2"></i>
            Import {{ 'Payee' | whiteLabel: 'payeeName'}}
          </button>
          <button
            type="button"
            class="ocw-btn ocw-btn-cloud single_btn"
            (click)="viewBankAccounts()"
            matTooltip="Here is the list of bank accounts imported from your Sage business."
          >
            Bank Account Mapping
          </button>
        </div>
      </div>
    </div>
  </div>
  <!-------- right section start -------->
  <div class="main_right_section">
    <div class="module_top_section">
      <div class="main__header">
        <div class="left">
          <p class="sub_head">Instructions</p>
        </div>
      </div>
      <!-------- module_body start -------->
      <div class="module_body">
        <div class="p-arrow">
          <div class="p-arrow-text" *ngFor="let item of instructions">
            <span>
              <p>{{ item }}</p>
            </span>
          </div>
        </div>
      </div>
    </div>
    <!-------- module_bottom_section start -------->
    <div class="module_bottom_section">
      <app-customer-support></app-customer-support>
    </div>
  </div>
</section>
<!-------- main_common_module end -------->
