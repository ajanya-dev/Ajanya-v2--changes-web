<div class="p-1.5 min-w-[580px]">
  <!-- Modal Header -->
  <div
    class="flex justify-between items-center pb-4 border-b border-input-border-color"
  >
    <div class="flex items-center gap-2">
      <span class="font-inter font-semibold text-lg text-main-text-color">
        FreshBooks Settings
      </span>
    </div>
    <button type="button" class="cursor-pointer" (click)="close()">
      <fa-icon
        class="text-secondary-text-color text-lg"
        [icon]="['fas','xmark']"
      ></fa-icon>
    </button>
  </div>

  <!-- Modal Body -->
  <div class="pt-4">
    <div class="flex flex-col gap-3">
      <!-- Auto Settings Options Row -->
      <div class="bg-secondary-background-color rounded-[10px] py-2.5 px-4">
        <div class="flex flex-wrap items-center gap-x-4">
          <div class="single_input flex auto-redirect-height items-center">
            <mat-checkbox
              [formControl]="autoDownloading"
              class="example-margin ml-2 p-0"
              [ngStyle]="{
                'pointer-events': loading.defaultLoading ? 'none' : 'auto'
              }"
              (change)="postQuickBookOnlineData()"
            >
              <span class="text-sm pb-1">Auto Downloading</span>
            </mat-checkbox>
          </div>
        </div>
      </div>

      <!-- Export Settings Section -->
      @if (isFreshbooksExport()) {
        <!-- Options Row -->
        <div class="bg-secondary-background-color rounded-[10px] py-2.5 px-4">
          <div class="flex flex-wrap items-center gap-x-4">
            <div class="single_input flex auto-redirect-height items-center">
              <mat-checkbox
                [formControl]="pushbackEnable"
                class="example-margin ml-2 p-0"
                [ngStyle]="{
                  'pointer-events': loading.defaultLoading ? 'none' : 'auto'
                }"
                (change)="postQuickBookOnlineData()"
              >
                <span class="text-sm pb-1">Enable Pushback</span>
              </mat-checkbox>
            </div>
          </div>
        </div>

        <!-- Import Section -->
        <div class="bg-secondary-background-color rounded-[10px] p-3">
          <div class="mb-2">
            <div class="flex items-center gap-2">
              <fa-icon
                [icon]="faCloudArrowDown"
                class="text-common-blue-color"
              ></fa-icon>
              <span
                class="font-inter font-semibold text-sm text-main-text-color"
                >Import Data from FreshBooks</span
              >
            </div>
            <span class="text-xs text-secondary-text-color"
              >Click on any item below to sync from your FreshBooks
              account</span
            >
          </div>
          <div
            class="flex flex-wrap gap-2"
            [ngClass]="!isConnected() ? 'opacity-40 pointer-events-none' : ''"
          >
            <app-common-button-v35
              [type]="{ style: 'green', name: 'money-action' }"
              [text]="'Payee' | whiteLabel: 'payeeName'"
              (clickEvent)="onPayeeImportClicked('Payee')"
              [loading]="loading.payeeLoading"
              [disabled]="
                loading.payeeLoading || (!pushbackEnable.value && isConnected())
              "
              [class.opacity-40]="!pushbackEnable.value && isConnected()"
              [class.pointer-events-none]="!pushbackEnable.value && isConnected()"
              [isAddIcon]="true"
              [icon]="faDownToLine"
              [toolTip]="
                isConnected()
                  ? 'Click here to import ' +
                    ('Payee' | whiteLabel: 'payeeName') +
                    ' from FreshBooks'
                  : 'Please connect to FreshBooks to import ' +
                    ('Payee' | whiteLabel: 'payeeName')
              "
            />
            <app-common-button-v35
              [type]="{ style: 'green', name: 'money-action' }"
              text="Category"
              (clickEvent)="onCategoryImportClicked('Category')"
              [loading]="loading.categoryLoading"
              [disabled]="
                loading.categoryLoading ||
                (!pushbackEnable.value && isConnected())
              "
              [class.opacity-40]="!pushbackEnable.value && isConnected()"
              [class.pointer-events-none]="!pushbackEnable.value && isConnected()"
              [isAddIcon]="true"
              [icon]="faDownToLine"
              [toolTip]="
                isConnected()
                  ? 'Click here to import categories from FreshBooks'
                  : 'Please connect to FreshBooks to import categories'
              "
            />
          </div>
        </div>
      }
    </div>
  </div>

  <!-- Modal Footer -->
  <div
    class="flex justify-end gap-3 pt-4 mt-4 border-t border-input-border-color"
  >
    <app-common-button-v35
      width="100px"
      [type]="{ style: 'bordered', name: 'main' }"
      text="Cancel"
      (clickEvent)="close()"
    />
    <app-common-button-v35
      width="100px"
      [type]="{ style: 'modal', name: 'main' }"
      text="Update"
      [disabled]="loading.defaultLoading"
      [loading]="loading.defaultLoading"
      (clickEvent)="postQuickBookOnlineData()"
    />
  </div>
</div>
