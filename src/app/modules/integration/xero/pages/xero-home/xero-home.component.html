<!-------- main_common_module start -------->
<section class="main_common_module">
  <!--------left section start -------->
  <div class="main_left_wrapper">
    <!--------top section start -------->
    <div class="module_top_section">
      <div class="module_main_header">
        <div class="header_title flex items-center gap-1">
          <app-ocw-back-button backUrl="manage/thirdparty_app/index">
          </app-ocw-back-button>

          <h3>Third Party Integration</h3>
        </div>
        <div class="help_video">
          <app-demo-video slug="xero"></app-demo-video>
        </div>
      </div>
      <div
        class="module_main_body"
        [ngStyle]="{
          'pointer-events': loading.globalLoading ? 'none' : 'auto'
        }"
      >
        <!-------- top-box start -------->
        <section
          class="top-box mt-6 border-solid border-2 border-input-border-color relative"
        >
          <div class="logo-bg"></div>
          <div class="top-twobox">
            <div class="top-box-centr main-bx-padding">
              <p class="main-p">Xero</p>
            </div>
            <div class="top-box-right main-bx-padding mr-8 buton-desk">
              <button
                type="button"
                class="ocw-btn ocw-btn-dark single_btn"
                (click)="onConnectToGusto()"
              >
                <span>{{
                  loading.connecting == 1
                    ? "processing.."
                    : isConnected
                      ? "Add Company"
                      : "Connect"
                }}</span>
              </button>
            </div>
          </div>
          <div class="top-box-img"></div>
          <div class="top-box-img-2"></div>
          <div class="logo-sec">
            <img src="../../../../assets/images/integration/xero.png" />
          </div>
        </section>
        <div class="top-box-right main-bx-padding mr-8 buton-mobile">
          <button
            type="button"
            class="ocw-btn ocw-btn-dark single_btn mr-4"
            *ngIf="!isConnected && isConnected != undefined"
            (click)="onConnectToGusto()"
          >
            <span>{{
              loading?.connecting == 1 ? "processing.." : "Connect"
            }}</span>
          </button>
          <button
            type="button"
            *ngIf="isConnected && isConnected != undefined"
            class="ocw-btn ocw-btn-dark single_btn"
            (click)="onDisConnectToGusto()"
          >
            <span>{{
              loading?.connecting == 0 ? "processing.." : "Add Company"
            }}</span>
          </button>
        </div>
        <!-------- table-main-sec start -------->
        <div class="table-main-sec">
          <div class="overflow-x-auto mt-10 mb-10">
            <table class="table-auto">
              <thead
                class="text-xs font-semibold uppercase ocw-table-light"
                *ngIf="xeroData?.companies.length"
              >
                <tr>
                  <th class="whitespace-nowrap">
                    <h3 class="main-h4 text-left">Company Name</h3>
                  </th>
                  <th class="whitespace-nowrap">
                    <h3 class="main-h4 text-left">Status</h3>
                  </th>
                  <th class="p-2 whitespace-nowrap">
                    <h3 class="main-h4 text-left">Last Update</h3>
                  </th>
                  <th class="p-2 whitespace-nowrap">
                    <h3 class="main-h4 text-left">action</h3>
                  </th>
                </tr>
              </thead>
              <tbody class="text-sm">
                <ng-container
                  *ngFor="let company of xeroData?.companies; let i = index"
                >
                  <tr>
                    <td>{{ company.companyName }}</td>
                    <td>
                      <span
                        [ngClass]="
                          company.status === 'Connected'
                            ? 'status_connect'
                            : 'status_disconnect'
                        "
                        >{{ company.status }}</span
                      >
                    </td>
                    <td>{{ company.lastUpdated }}</td>
                    <td>
                      <div class="action_buttons">
                        <!-- Import Bills start -->

                        <!-- Import Checks end -->
                        <ng-container
                          *ngIf="
                            company.status === 'Connected';
                            else disconnect
                          "
                        >
                          <p
                            matTooltip="Disconnect"
                            matTooltipPosition="right"
                            (click)="
                              onDisConnectXero(
                                company.companyId,
                                i,
                                company.status
                              )
                            "
                          >
                            Disconnect
                            <!-- {{loading.disconnecting!=i?'Disconnect':'Disconnecting..'}} -->
                            <!-- <span class="loadingSpinner" *ngIf="loading.disconnecting==i"></span> -->
                          </p>
                        </ng-container>
                        <ng-template #disconnect>
                          <p
                            matTooltip="Remove"
                            matTooltipPosition="right"
                            (click)="
                              onDisConnectXero(
                                company.companyId,
                                i,
                                company.status
                              )
                            "
                          >
                            Remove
                            <!-- {{loading.disconnecting!=i?'Remove':'Removing..'}} -->
                            <!-- <span class="loadingSpinner" *ngIf="loading.disconnecting==i"></span> -->
                          </p>
                        </ng-template>
                      </div>
                    </td>
                  </tr>
                </ng-container>
              </tbody>
            </table>
          </div>

          <!-- defalut loader -->
          <div
            class="data_spinner"
            [ngClass]="{ data_fetched: !loading.defaultLoading }"
          ></div>
        </div>

        <div class="flex justify-end items-center bank-ac-map">
          <!-- <div class="meta-text mr-3"></div> -->
          <button
            type="button"
            class="ocw-btn ocw-btn-cloud single_btn"
            (click)="viewBankAccounts()"
            matTooltip="Here is the list of bank accounts imported from your Xero."
          >
            Bank Account Mapping
          </button>
          <div
            class="flex items-center font-semibold w-min pl-2 pr-2 pt-1 pb-1 ml-2.5 settings cursor-pointer"
            matTooltip="settings"
            (click)="settings()"
          >
            <svg
              aria-hidden="true"
              focusable="false"
              data-prefix="fas"
              data-icon="cog"
              class="svg-inline--fa fa-cog fa-w-16"
              role="img"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 512 512"
            >
              <path
                fill="currentColor"
                d="M487.4 315.7l-42.6-24.6c4.3-23.2 4.3-47 0-70.2l42.6-24.6c4.9-2.8 7.1-8.6 5.5-14-11.1-35.6-30-67.8-54.7-94.6-3.8-4.1-10-5.1-14.8-2.3L380.8 110c-17.9-15.4-38.5-27.3-60.8-35.1V25.8c0-5.6-3.9-10.5-9.4-11.7-36.7-8.2-74.3-7.8-109.2 0-5.5 1.2-9.4 6.1-9.4 11.7V75c-22.2 7.9-42.8 19.8-60.8 35.1L88.7 85.5c-4.9-2.8-11-1.9-14.8 2.3-24.7 26.7-43.6 58.9-54.7 94.6-1.7 5.4.6 11.2 5.5 14L67.3 221c-4.3 23.2-4.3 47 0 70.2l-42.6 24.6c-4.9 2.8-7.1 8.6-5.5 14 11.1 35.6 30 67.8 54.7 94.6 3.8 4.1 10 5.1 14.8 2.3l42.6-24.6c17.9 15.4 38.5 27.3 60.8 35.1v49.2c0 5.6 3.9 10.5 9.4 11.7 36.7 8.2 74.3 7.8 109.2 0 5.5-1.2 9.4-6.1 9.4-11.7v-49.2c22.2-7.9 42.8-19.8 60.8-35.1l42.6 24.6c4.9 2.8 11 1.9 14.8-2.3 24.7-26.7 43.6-58.9 54.7-94.6 1.5-5.5-.7-11.3-5.6-14.1zM256 336c-44.1 0-80-35.9-80-80s35.9-80 80-80 80 35.9 80 80-35.9 80-80 80z"
              ></path>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-------- right section start -------->
  <div class="main_right_section">
    <div class="module_top_section">
      <div class="main__header">
        <div class="left">
          <p class="sub_head">Instructions</p>
        </div>
      </div>
      <!-------- module_body start -------->
      <div class="module_body">
        <div class="p-arrow">
          <div class="p-arrow-text" *ngFor="let item of instructions">
            <span>
              <p>{{ item }}</p>
            </span>
          </div>
        </div>
      </div>
    </div>
    <!-------- module_bottom_section start -------->
    <div class="module_bottom_section">
      <app-customer-support></app-customer-support>
    </div>
  </div>
</section>
<!-------- main_common_module end -------->
