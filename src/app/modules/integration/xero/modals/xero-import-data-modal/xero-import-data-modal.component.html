<div class="ocw_man_modal_wrapper add_bank_modal">
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">Import {{ data?.type }}</div>

    <div class="close_btn" [mat-dialog-close]="false">
      <svg
        aria-hidden="true"
        focusable="false"
        data-prefix="fal"
        data-icon="times"
        class="svg-inline--fa fa-times fa-w-10"
        role="img"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 320 512"
      >
        <path
          fill="currentColor"
          d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
        ></path>
      </svg>
    </div>
  </div>

  <!-- modal body start -->
  <div class="ocw_modal_body">
    <div class="grid grid-cols-1 gap-5 text-sm">
      <!-- left section start-->
      <!-- <div class="flex flex-col">
        <div class="mt-5">
          <div class="flex flex-wrap gap-2 flex-col import_from_wrapper">
            <span class="importFrom">
              <mat-checkbox class="setting_heading_main" [checked]="allComplete" [indeterminate]="someComplete()"
                (change)="setAll($event.checked);changeCheckBox();">
                {{importedCompanies.name}}
              </mat-checkbox>
            </span>
            <span class="importFrom_sub_check_box">
              <ul>
                <li *ngFor="let list of importedCompanies?.list let i=index">
                  <mat-checkbox [(ngModel)]="list.completed" [name]="list.value" [ngModelOptions]="{standalone: true}"
                    checked="true" (ngModelChange)="updateAllComplete()" (change)="changeCheckBox();">
                    {{list.name}}
                  </mat-checkbox>
                </li>
              </ul>
            </span>
          </div>

        </div>
      </div> -->
      <!-- left section end -->

      <!-- right section start -->
      <div class="flex flex-col gap-4">
        <div class="p-3 border rounded">
          <span class="setting_heading">Time Span</span>
          <mat-radio-group
            aria-labelledby="mat-radio-group-label"
            [formControl]="importTime"
            class="mat-radio-group grid grid-cols-2"
          >
            <mat-radio-button
              class="mat-radio-button"
              *ngFor="let time of timeSpan"
              [value]="time.value"
            >
              {{ time.name }}
            </mat-radio-button>
          </mat-radio-group>
        </div>
        <!-- Time span end -->

        <!-- Type start -->
        <!-- <div class="p-3 border rounded text-sm">
            <span class="setting_heading">Import Type</span>
            <div class="flex flex-wrap gap-2 flex-row">
              <mat-radio-group [formControl]="importType">
                <mat-radio-button  value="3">Checks</mat-radio-button>
                <mat-radio-button  value="1">Bills</mat-radio-button>
              </mat-radio-group>
            </div>
          </div> -->
        <!-- Type end -->
      </div>
      <!-- right section end -->
    </div>
  </div>
  <!-- modal body end  -->

  <div class="ocw_modal_footer">
    <mat-dialog-actions>
      <button mat-dialog-close class="ocw-btn ocw-btn-modal-bordered">
        Cancel
      </button>
      <button
        class="ocw-btn ocw-btn-modal-blue submit-btn"
        (click)="onSubmit()"
      >
        <ng-container *ngIf="loading">
          <span class="loadingSpinner"></span>
        </ng-container>
        <span> {{ !loading ? "Start Importing" : "Importing..." }}</span>
      </button>
    </mat-dialog-actions>
  </div>
</div>
