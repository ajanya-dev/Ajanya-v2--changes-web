<div class="px-[6px] pb-[6px]">
  <!-- modal header -->
  <div class="flex justify-end pb-6">
    <div [mat-dialog-close]="false">
      <fa-icon
        class="text-secondary-text-color cursor-pointer"
        [icon]="faXmark"
      />
    </div>
  </div>
  <!-- modal body start -->
  <div>
    <div class="pb-6 flex justify-center">
      <img
        ngSrc="/assets/images/integration/dayforce-text.svg"
        alt="dayforce logo"
        width="215"
        height="52"
      />
    </div>
    <div>
      <div class="pb-3">
        <p class="font-inter font-bold text-main-text-color text-base">
          Enter your Dayforce Credentials:
        </p>
      </div>
      <div
        class="border border-common-blue-color rounded-lg bg-common-secondary-blue-color"
      >
        <div class="px-3 py-2">
          <div class="flex items-start gap-2">
            <fa-icon
              class="text-common-blue-color text-sm mt-[2px]"
              [icon]="faCircleInfo"
            />
            <span class="text-common-blue-color font-inter font-medium text-xs">
              A Dayforce API integration and credentials must be created to
              generate a Company ID, Username, and Password.
            </span>
          </div>
        </div>
      </div>
      <form [formGroup]="dayforceForm" class="pt-4">
        <div class="flex flex-col gap-3">
          <div>
            <app-common-input-field
              placeholder="Company ID"
              formControlName="clientNamespace"
            />
            <app-control-message-v35
              [control]="dayforceForm.controls.clientNamespace"
            />
          </div>
          <div>
            <app-common-input-field
              placeholder="Username"
              formControlName="username"
            />
            <app-control-message-v35
              [control]="dayforceForm.controls.username"
            />
          </div>
          <div>
            <app-common-input-field
              placeholder="Password"
              type="password"
              formControlName="password"
            />
            <app-control-message-v35
              [control]="dayforceForm.controls.password"
            />
          </div>
        </div>
      </form>
    </div>
  </div>
  <!-- modal body end -->
  <div class="flex w-full pt-8">
    <app-common-button-v35
      width="340px"
      [type]="{ style: 'modal', name: 'main' }"
      text="Submit"
      (clickEvent)="onSubmit()"
      [disabled]="isSubmitting()"
      [loading]="isSubmitting()"
    ></app-common-button-v35>
  </div>
</div>
