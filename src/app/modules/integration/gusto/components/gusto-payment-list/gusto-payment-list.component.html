<div class="flex flex-col">
  @if (!isPaymentsLoading) {
    <button
      type="button"
      class="ocw-btn ocw-btn-dark single_btn !w-[100px] mt-5"
      matTooltip="Back to company list"
      (click)="onGoBack()"
    >
      <fa-icon [icon]="faAngleLeft"></fa-icon>
      <span>Back</span>
    </button>
  }
  <div class="ocw_table_wrapper mt-5">
    @if (!isPaymentsLoading) {
      <table class="ocw-table ocw-table-striped">
        <thead>
          <ng-container>
            <tr>
              <ng-container>
                <td>COMPANY NAME</td>
                <td>WAGE TOTAL</td>
                <td>ACTION</td>
              </ng-container>
            </tr>
          </ng-container>
        </thead>

        <tbody>
          @for (item of paymentsList; track item) {
            <ng-container>
              <tr>
                <td>
                  {{ selectedCompany?.companyName }}
                </td>
                <td style="text-align: right;">{{ item?.wage_total | currency }}</td>
                <td>
                  <div class="action_buttons">
                    <button
                      type="button"
                      class="ocw-btn ocw-btn-light-dark single_btn mr-2"
                      (click)="viewPaymentDetails(item.contractor_uuid)"
                    >
                      <span>View Payment</span>
                    </button>
                    <button
                      type="button"
                      class="ocw-btn ocw-btn-dark-green single_btn"
                      (click)="createCheck(item.contractor_uuid)"
                    >
                      @if (
                        item.contractor_uuid === selectedContractorId &&
                        isCheckCreating
                      ) {
                        <span> Creating... </span>
                      } @else {
                        <span> Create </span>
                      }
                    </button>
                  </div>
                </td>
              </tr>
            </ng-container>
          }
        </tbody>
      </table>
    }
    <div
      class="data_spinner"
      [ngClass]="{ data_fetched: !isPaymentsLoading }"
    ></div>
  </div>
</div>
