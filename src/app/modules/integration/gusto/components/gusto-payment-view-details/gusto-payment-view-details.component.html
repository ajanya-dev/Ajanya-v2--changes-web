<div class="flex flex-col">
  @if (!isPaymentDetailsLoading) {
    <button
      type="button"
      class="ocw-btn ocw-btn-dark single_btn !w-[100px] mt-5"
      matTooltip="Back to payment list"
      (click)="onGoBack()"
    >
      <fa-icon [icon]="faAngleLeft"></fa-icon>
      <span>Back</span>
    </button>
  }
  <div class="ocw_table_wrapper mt-5">
    @if (!isPaymentDetailsLoading) {
      <table class="ocw-table ocw-table-striped">
        <thead>
          <ng-container>
            <tr>
              <ng-container>
                <td>DATE</td>
                <td>PAYMENT METHOD</td>
                <td>WAGE TYPE</td>
                <td>WAGE TOTAL</td>
              </ng-container>
            </tr>
          </ng-container>
        </thead>

        <tbody>
          @for (item of paymentDetails; track item) {
            <ng-container>
              <tr>
                <td>
                  {{ item?.date | date: "dd-MM-yyyy" }}
                </td>
                <td>{{ item?.payment_method }}</td>
                <td>{{ item?.wage_type }}</td>
                <td style="text-align: right;">{{ item?.wage_total | currency }}</td>
              </tr>
            </ng-container>
          }
        </tbody>
      </table>
    }
    <div
      class="data_spinner"
      [ngClass]="{ data_fetched: !isPaymentDetailsLoading }"
    ></div>
  </div>
</div>
