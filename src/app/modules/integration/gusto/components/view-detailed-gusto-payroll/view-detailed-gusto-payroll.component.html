<div class="gusto_payroll_details_list">
  <div class="top_section">
    <div class="btn_wrapper">
      <div class="back_button">
        <button
          type="button"
          class="ocw-btn ocw-btn-dark single_btn"
          matTooltip="Back to company list"
          (click)="onGoBack('payroll_view')"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 256 512"
            width="20"
            height="20"
          >
            <path
              d="M166.5 424.5l-143.1-152c-4.375-4.625-6.562-10.56-6.562-16.5c0-5.938 2.188-11.88 6.562-16.5l143.1-152c9.125-9.625 24.31-10.03 33.93-.9375c9.688 9.125 10.03 24.38 .9375 33.94l-128.4 135.5l128.4 135.5c9.094 9.562 8.75 24.75-.9375 33.94C190.9 434.5 175.7 434.1 166.5 424.5z"
            />
          </svg>
          <span>Back</span>
        </button>
      </div>
    </div>
  </div>
  <div class="ocw_table_wrapper" *ngIf="!loading.default && companyDetails">
    <table class="ocw-table ocw-table-striped">
      <thead>
        <ng-container>
          <tr>
            <ng-container *ngFor="let header of tableHeaders">
              <td>{{ header }}</td>
            </ng-container>
          </tr>
        </ng-container>
      </thead>
      <tbody>
        <ng-container
          *ngFor="let row of companyDetails?.employee_compensations"
        >
          <tr>
            <td>{{ row.employee_id }}</td>
            <td>{{ row.employee_name }}</td>
            <td>{{ row.employee_email }}</td>
            <td>
              @if (row.net_pay !== 0 && !gustoReimbursements) {
                {{ row.net_pay }}
              } @else {
                {{ row.check_amount }} 
              }
            </td>
            <td>{{ row.payment_method }}</td>
          </tr>
        </ng-container>
      </tbody>
    </table>
  </div>

  <div
    class="data_spinner"
    [ngClass]="{ data_fetched: !loading.default }"
  ></div>
</div>
