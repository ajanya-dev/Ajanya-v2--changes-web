<div class="ocw_man_modal_wrapper">
  <!-- modal header -->
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">Create Companies</div>
  </div>
  <!-- modal body start -->
  <div class="ocw_modal_body">
    <form [formGroup]="newCompanyForm">
      <div class="form_wrapper">
        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            maxlength="15"
            formControlName="firstName"
          />
          <label class="floating_label_field">First Name</label>
          <app-control-message
            [control]="newCompanyForm.controls.firstName"
            labelName="First name is required"
          >
          </app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            maxlength="15"
            formControlName="lastName"
          />
          <label class="floating_label_field">Last Name</label>
          <app-control-message
            [control]="newCompanyForm.controls.lastName"
            labelName="Last name is required"
          >
          </app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            maxlength="50"
            formControlName="emailAddress"
          />
          <label class="floating_label_field">Email Address</label>
          <app-control-message
            [control]="newCompanyForm.controls.emailAddress"
            labelName="Email address is required"
          >
          </app-control-message>
        </div>

        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            maxlength="20"
            formControlName="companyName"
          />
          <label class="floating_label_field">Company Name</label>
          <app-control-message
            [control]="newCompanyForm.controls.companyName"
            labelName="Company name is required"
          >
          </app-control-message>
        </div>
      </div>
    </form>
  </div>
  <!-- modal body end -->
  <div class="ocw_modal_footer">
    <mat-dialog-actions align="end">
      <button mat-dialog-close class="ocw-btn ocw-btn-modal-bordered">
        close
      </button>
      <button
        type="submit"
        (click)="submit()"
        class="ocw-btn ocw-btn-modal-blue add_btn"
        [ngStyle]="{ 'pointer-events': loading ? 'none' : 'auto' }"
      >
        <span *ngIf="!loading; else spinner">Create</span>
        <ng-template #spinner>
          <span class="loadingSpinner"></span>
        </ng-template>
      </button>
    </mat-dialog-actions>
  </div>
</div>
