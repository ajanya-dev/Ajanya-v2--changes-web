<div class="ocw_man_modal_wrapper">
  <!-- modal header -->
  <div class="modal_header">
    <div class="moodal_header_image">
      <img
        src="../../../../../assets/images/integration/bill-dot-com-logo.png"
        alt=""
      />
    </div>
    <div class="ocw_modal_title">
      <p>Log in to Bill.com</p>
    </div>
  </div>
  <!-- modal body start -->
  <div class="ocw_modal_body">
    <div>
      <p>Please enter Bill.com credentials</p>
    </div>

    <form [formGroup]="myForm">
      <div class="input_group">
        <div class="single_input">
          <input
            type="text"
            class="input_style"
            placeholder=" "
            formControlName="userName"
          />
          <span class="floating_label_field"
            >User Name <span class="required">*</span></span
          >
          <app-control-message
            [control]="myForm.controls.userName"
          ></app-control-message>
        </div>

        <div class="single_input">
          <input
            type="password"
            class="input_style"
            placeholder=" "
            formControlName="password"
          />
          <span class="floating_label_field"
            >Password<span class="required">*</span></span
          >
          <app-control-message
            [control]="myForm.controls.password"
          ></app-control-message>
        </div>
      </div>
    </form>
  </div>
  <!-- modal body end -->
  <div class="ocw_modal_footer">
    <mat-dialog-actions align="end">
      <button mat-dialog-close class="ocw-btn ocw-btn-gray">Cancel</button>
      <button
        (click)="submit()"
        type="submit"
        class="ocw-btn ocw-btn-trash add_btn"
        [ngStyle]="submitting && { 'pointer-events': 'none' }"
      >
        <ng-container *ngIf="submitting">
          <span class="loadingSpinner"></span>
        </ng-container>

        <span>
          {{ submitting ? "Connecting..." : "Connect" }}
        </span>
      </button>
    </mat-dialog-actions>
  </div>
</div>
