<div class="ocw_man_modal_wrapper flex flex-col">
  <!-- modal header -->
  <div class="ocw_modal_header">
    <div class="ocw_modal_title">
      <span *ngIf="dialogueData?.mode === 'edit'; else new_Template"
        >Reset Integration File Password</span
      >
      <ng-template #new_Template>Download Integration File</ng-template>
    </div>
    <div class="close_btn" [mat-dialog-close]="false">
      <svg
        aria-hidden="true"
        focusable="false"
        data-prefix="fal"
        data-icon="times"
        class="svg-inline--fa fa-times fa-w-10"
        role="img"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 320 512"
      >
        <path
          fill="currentColor"
          d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
        ></path>
      </svg>
    </div>
  </div>
  <div class="flex flex-col justify-between grow">
    <div [formGroup]="fileCreationForm" class="grid grid-col-1 gap-4 pt-4">
      <div class="info" *ngIf="!dialogueData || dialogueData?.mode !== 'edit'">
        <i class="fa-solid fa-circle-info"></i>
        Download the integration file by giving file name and password. Add the
        downloaded file in your QuickBooks Desktop web connector. Make sure that
        the password given when downloading the file and at the web connecter is
        the same.
      </div>
      <div class="single_input mt-2">
        <input
          type="text"
          class="input_style"
          name="company-name"
          id="company-name"
          formControlName="fileName"
          placeholder=""
          maxlength="50"
          autocomplete="off"
        />
        <label class="floating_label_field"
          >File Name <span class="required">*</span></label
        >
        <app-control-message
          [control]="fileCreationForm.controls.fileName"
        ></app-control-message>
      </div>

      <div class="single_input">
        <div>
          <input
            type="password"
            #passwrd1
            class="input_style"
            formControlName="password1"
            placeholder=""
            name="company-password"
            id="company-password"
            maxlength="20"
            autocomplete="new-password"
          />
          <label class="floating_label_field"
            >Password<span class="required">*</span></label
          >
          <div class="eye-container">
            <ng-container *ngIf="passwrd1.type === 'text'">
              <svg
                (click)="passwrd1.type = 'password'"
                focusable="false"
                data-prefix="far"
                data-icon="eye"
                class="svg-inline--fa fa-eye fa-w-18"
                role="img"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 576 512"
              >
                <path
                  fill="currentColor"
                  d="M288 144a110.94 110.94 0 0 0-31.24 5 55.4 55.4 0 0 1 7.24 27 56 56 0 0 1-56 56 55.4 55.4 0 0 1-27-7.24A111.71 111.71 0 1 0 288 144zm284.52 97.4C518.29 135.59 410.93 64 288 64S57.68 135.64 3.48 241.41a32.35 32.35 0 0 0 0 29.19C57.71 376.41 165.07 448 288 448s230.32-71.64 284.52-177.41a32.35 32.35 0 0 0 0-29.19zM288 400c-98.65 0-189.09-55-237.93-144C98.91 167 189.34 112 288 112s189.09 55 237.93 144C477.1 345 386.66 400 288 400z"
                ></path>
              </svg>
            </ng-container>
            <ng-container *ngIf="passwrd1.type === 'password'">
              <svg
                (click)="passwrd1.type = 'text'"
                focusable=" false"
                data-prefix="far"
                data-icon="eye-slash"
                class="svg-inline--fa fa-eye-slash fa-w-20"
                role="img"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 640 512"
              >
                <path
                  fill="currentColor"
                  d="M634 471L36 3.51A16 16 0 0 0 13.51 6l-10 12.49A16 16 0 0 0 6 41l598 467.49a16 16 0 0 0 22.49-2.49l10-12.49A16 16 0 0 0 634 471zM296.79 146.47l134.79 105.38C429.36 191.91 380.48 144 320 144a112.26 112.26 0 0 0-23.21 2.47zm46.42 219.07L208.42 260.16C210.65 320.09 259.53 368 320 368a113 113 0 0 0 23.21-2.46zM320 112c98.65 0 189.09 55 237.93 144a285.53 285.53 0 0 1-44 60.2l37.74 29.5a333.7 333.7 0 0 0 52.9-75.11 32.35 32.35 0 0 0 0-29.19C550.29 135.59 442.93 64 320 64c-36.7 0-71.71 7-104.63 18.81l46.41 36.29c18.94-4.3 38.34-7.1 58.22-7.1zm0 288c-98.65 0-189.08-55-237.93-144a285.47 285.47 0 0 1 44.05-60.19l-37.74-29.5a333.6 333.6 0 0 0-52.89 75.1 32.35 32.35 0 0 0 0 29.19C89.72 376.41 197.08 448 320 448c36.7 0 71.71-7.05 104.63-18.81l-46.41-36.28C359.28 397.2 339.89 400 320 400z"
                ></path>
              </svg>
            </ng-container>
          </div>
        </div>
        <app-control-message
          [control]="fileCreationForm.controls.password1"
        ></app-control-message>
      </div>

      <div class="single_input">
        <div>
          <input
            type="password"
            #password2
            class="input_style"
            formControlName="password2"
            placeholder=" "
            maxlength="20"
          />

          <label class="floating_label_field"
            >Confirm Password<span class="required">*</span></label
          >
          <div class="eye-container">
            <ng-container *ngIf="password2.type === 'text'">
              <svg
                (click)="password2.type = 'password'"
                focusable="false"
                data-prefix="far"
                data-icon="eye"
                class="svg-inline--fa fa-eye fa-w-18"
                role="img"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 576 512"
              >
                <path
                  fill="currentColor"
                  d="M288 144a110.94 110.94 0 0 0-31.24 5 55.4 55.4 0 0 1 7.24 27 56 56 0 0 1-56 56 55.4 55.4 0 0 1-27-7.24A111.71 111.71 0 1 0 288 144zm284.52 97.4C518.29 135.59 410.93 64 288 64S57.68 135.64 3.48 241.41a32.35 32.35 0 0 0 0 29.19C57.71 376.41 165.07 448 288 448s230.32-71.64 284.52-177.41a32.35 32.35 0 0 0 0-29.19zM288 400c-98.65 0-189.09-55-237.93-144C98.91 167 189.34 112 288 112s189.09 55 237.93 144C477.1 345 386.66 400 288 400z"
                ></path>
              </svg>
            </ng-container>
            <ng-container *ngIf="password2.type === 'password'">
              <svg
                (click)="password2.type = 'text'"
                focusable="false"
                data-prefix="far"
                data-icon="eye-slash"
                class="svg-inline--fa fa-eye-slash fa-w-20"
                role="img"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 640 512"
              >
                <path
                  fill="currentColor"
                  d="M634 471L36 3.51A16 16 0 0 0 13.51 6l-10 12.49A16 16 0 0 0 6 41l598 467.49a16 16 0 0 0 22.49-2.49l10-12.49A16 16 0 0 0 634 471zM296.79 146.47l134.79 105.38C429.36 191.91 380.48 144 320 144a112.26 112.26 0 0 0-23.21 2.47zm46.42 219.07L208.42 260.16C210.65 320.09 259.53 368 320 368a113 113 0 0 0 23.21-2.46zM320 112c98.65 0 189.09 55 237.93 144a285.53 285.53 0 0 1-44 60.2l37.74 29.5a333.7 333.7 0 0 0 52.9-75.11 32.35 32.35 0 0 0 0-29.19C550.29 135.59 442.93 64 320 64c-36.7 0-71.71 7-104.63 18.81l46.41 36.29c18.94-4.3 38.34-7.1 58.22-7.1zm0 288c-98.65 0-189.08-55-237.93-144a285.47 285.47 0 0 1 44.05-60.19l-37.74-29.5a333.6 333.6 0 0 0-52.89 75.1 32.35 32.35 0 0 0 0 29.19C89.72 376.41 197.08 448 320 448c36.7 0 71.71-7.05 104.63-18.81l-46.41-36.28C359.28 397.2 339.89 400 320 400z"
                ></path>
              </svg>
            </ng-container>
          </div>
        </div>
        <app-control-message
          [control]="fileCreationForm.controls.password2"
        ></app-control-message>
      </div>

      <div class="flex justify-end">
        <button
          *ngIf="dialogueData?.mode === 'edit'; else downloadButton"
          class="ocw-btn ocw-btn-dark-green"
          (click)="onResetClicked()"
        >
          Reset
        </button>
        <ng-template #downloadButton>
          <button
            class="ocw-btn ocw-btn-dark-green"
            (click)="onDownloadClicked()"
          >
            <i class="fas fa-download"></i>
            Download
          </button>
        </ng-template>
      </div>
    </div>
  </div>
</div>
