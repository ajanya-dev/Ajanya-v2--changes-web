<div>
  @if (!isChildComponent()) {
    <div class="flex justify-end ">
      <app-common-button-v4
        [type]="{ style: 'primary', name: 'main' }"
        [text]="'New'"
        [lucideIcon]="'plus'"
        (clickEvent)="onNewGroup()"
      />
    </div>
  }
  <app-v4-data-table
    [columnDefs]="columnDefs"
    [tableId]="tableId"
    [frameworkComponents]="frameworkComponents"
    [fieldsShownByDefault]="fieldsShownByDefault"
    [headerElements]="headerElements()"
    [useCustomEmptyState]="true"
    [emptyStateConfig]="{
      icon: 'users',
      title: 'No payment groups yet',
      description: 'Create your first payment group to start sending bulk payments',
      buttonText: 'New Group'
    }"
    (emptyStateActionClick)="onNewGroup()"
    (headerButtonEvent)="headerButtonClick($event)"
  />
</div>
