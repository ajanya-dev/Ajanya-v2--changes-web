<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        {{ matDialogData?.groupName ? "Update" : "Provide" }} Group Name
      </h1>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <div class="flex items-start gap-2 mb-4">
      <lucide-icon
        [img]="InfoIcon"
        [size]="16"
        class="text-v4-primary-brand-color mt-0.5 flex-shrink-0 cursor-pointer"
        matTooltip="info"
      ></lucide-icon>
      <span class="text-xs text-v4-main-text-color font-peridot">
        Payments will be grouped according to the name you provide, and you can
        access and view them in the Payment Groups table.
      </span>
    </div>
    <app-common-input-v4
      [formControl]="groupName"
      placeholder="Group Name"
      [fieldLabel]="'Group Name'"
      [maxLength]="15"
      [control]="groupName"
    />
  </div>
  <!-- modal body end -->

  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Save"
      (clickEvent)="submit()"
    />
  </div>
</div>
