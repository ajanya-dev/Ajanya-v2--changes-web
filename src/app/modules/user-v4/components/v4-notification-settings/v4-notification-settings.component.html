<div class="w-full max-w-[900px]">
  <!-- Title -->
  <h2 class="text-2xl font-bold text-v4-main-text-color font-funnel mb-1">
    Notification Settings
  </h2>
  <p class="text-sm text-v4-secondary-text-color font-peridot mb-5">
    Manage your notification preferences
  </p>

  <!-- Card -->
  <div
    class="border border-v4-border-color rounded-2xl bg-v4-secondary-background-color px-8 py-7"
  >
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-5">
      @for (item of notifList() ?? []; track item; let i = $index) {
        <div
          class="flex items-center justify-between gap-4 rounded-xl border border-v4-border-color bg-v4-tertiary-background-color p-4"
        >
          <div class="flex flex-col gap-1">
            <p
              class="text-v4-main-text-color font-semibold text-sm font-peridot"
            >
              {{ item.name }}
            </p>
            <p
              class="text-v4-secondary-text-color font-normal text-xs font-peridot"
            >
              {{ item.description }}
            </p>
          </div>
          <label class="relative inline-block w-11 h-6 shrink-0 cursor-pointer">
            <input
              type="checkbox"
              class="peer opacity-0 w-0 h-0"
              [checked]="item.status"
              [disabled]="pendingIndices().has(i)"
              (click)="onToggleClick($event, item.status, item.id, i)"
            />
            <span
              class="absolute inset-0 rounded-full bg-v4-border-color transition-colors duration-300 peer-checked:bg-v4-primary-brand-color before:content-[''] before:absolute before:h-[18px] before:w-[18px] before:left-[3px] before:bottom-[3px] before:bg-white before:rounded-full before:transition-transform before:duration-300 peer-checked:before:translate-x-5"
            ></span>
          </label>
        </div>
      }
    </div>
  </div>
</div>
