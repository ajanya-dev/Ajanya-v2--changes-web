<div class="w-full max-w-[900px]">
  <!-- Title -->
  <h2 class="text-2xl font-bold text-v4-main-text-color font-funnel mb-1">
    Advanced Settings
  </h2>
  <p class="text-sm text-v4-secondary-text-color font-peridot mb-5">
    Configure advanced features and automations
  </p>

  <!-- Card -->
  <div
    class="border border-v4-border-color rounded-2xl bg-v4-secondary-background-color px-8 py-7"
  >
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-5">
      @for (item of adVanceSettings(); track item) {
        @if (item.en_id !== 12 && item.en_id !== "12") {
          <div
            class="flex flex-col gap-4 rounded-xl border border-v4-border-color bg-v4-tertiary-background-color p-4"
          >
            <div class="flex items-center justify-between gap-4">
              <div class="flex flex-col gap-1">
                <p
                  class="text-v4-main-text-color font-semibold text-sm font-peridot"
                >
                  {{ item.name }}
                </p>
                <p
                  class="text-v4-secondary-text-color font-normal text-xs font-peridot"
                >
                  {{ item.description }}
                </p>
              </div>
              <label
                class="relative inline-block w-11 h-6 shrink-0 cursor-pointer"
              >
                <input
                  #checked
                  type="checkbox"
                  class="peer opacity-0 w-0 h-0"
                  [value]="item.en_id"
                  [checked]="item.status === 1 || item.status === '1'"
                  (change)="onChange(checked.value, item.status)"
                />
                <span
                  class="absolute inset-0 rounded-full bg-v4-border-color transition-colors duration-300 peer-checked:bg-v4-primary-brand-color before:content-[''] before:absolute before:h-[18px] before:w-[18px] before:left-[3px] before:bottom-[3px] before:bg-white before:rounded-full before:transition-transform before:duration-300 peer-checked:before:translate-x-5"
                ></span>
              </label>
            </div>
            @if (showBanksList() && (item.en_id === 5 || item.en_id === "5")) {
              <div
                class="flex flex-col gap-3"
                [ngClass]="{
                  hidden:
                    (item.status === 0 || item.status === '0') && !loading()
                }"
              >
                <app-bank-multi-select-dropdown-v4
                  [ngClass]="{
                    'opacity-50 pointer-events-none':
                      (item.status === 0 || item.status === '0') && loading()
                  }"
                  placeholder="Select Bank Accounts"
                  (selectionEvent)="onBankSelection($event)"
                  [selectedBankAccountIds]="getBankAccounts()"
                ></app-bank-multi-select-dropdown-v4>
                <div class="flex justify-end">
                  <app-common-button-v4
                    [ngClass]="{
                      'opacity-50 pointer-events-none':
                        (item.status === 0 || item.status === '0') && loading()
                    }"
                    text="Apply"
                    [type]="{ style: 'neon', name: 'main' }"
                    (clickEvent)="applyWithBanks()"
                    [loading]="loading()"
                    [disabled]="loading()"
                  ></app-common-button-v4>
                </div>
              </div>
            }
          </div>
        }
      }
    </div>
  </div>
</div>
