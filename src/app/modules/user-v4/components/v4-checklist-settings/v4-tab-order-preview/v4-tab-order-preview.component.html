<div
  class="rounded-xl border border-v4-border-color bg-v4-tertiary-background-color px-4 py-3.5"
>
  <h4
    [id]="labelId"
    class="mb-2.5 text-xs font-semibold uppercase tracking-wide text-v4-tertiary-text-color font-peridot"
  >
    {{ tabOrderText.previewLabel }}
  </h4>

  @if (!isEmpty) {
    <ul
      class="flex list-none flex-wrap gap-2 p-0 m-0"
      [attr.aria-labelledby]="labelId"
    >
      @for (tab of tabs; track tab.number) {
        <li
          class="preview-pill flex items-center justify-center rounded-sm px-4 py-1.5 text-xs font-semibold font-peridot"
          [class.preview-pill--default]="isDefault(tab)"
        >
          {{ tab.name }}
          @if (isDefault(tab)) {
            <span class="sr-only">(default tab)</span>
          }
        </li>
      }
    </ul>
  } @else {
    <p class="m-0 text-xs text-v4-secondary-text-color font-peridot">
      {{ tabOrderText.emptySelected }}
    </p>
  }

  @if (isDefaultMissing) {
    <p class="mt-2 mb-0 text-xs text-v4-badge-warning-text-color font-peridot">
      {{ tabOrderText.defaultTabMissing }}
    </p>
  }
</div>
