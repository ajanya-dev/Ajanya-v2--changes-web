<div class="w-full max-w-[900px] mx-auto lg:mx-0">
  <!-- Title -->
  <h2 class="text-2xl font-bold text-v4-main-text-color font-funnel mb-4">
    Our Compliance
  </h2>

  <!-- Certificates Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
    @for (item of certificates; track item.id) {
      <div
        class="flex flex-col items-center gap-2 px-4 py-6 rounded-2xl border border-v4-border-color bg-v4-secondary-background-color hover:border-v4-primary-brand-color/30 transition-all cursor-pointer"
        (click)="showCertificationDetailsModal(item)"
        tabindex="0"
        (keypress)="onKeyPress($event, item)"
      >
        <div class="w-16 h-16 mb-2 flex items-center justify-center">
          <img
            [src]="item.image"
            [alt]="item.name"
            class="w-full h-full object-contain"
          />
        </div>
        <h3
          class="text-sm font-bold text-v4-main-text-color font-peridot text-center leading-tight"
        >
          {{ item.name }}
        </h3>
        <p
          class="text-xs text-v4-secondary-text-color font-peridot text-center flex-1"
        >
          {{ item.description }}
        </p>
        <span
          class="mt-auto inline-flex items-center gap-1 px-3 py-1 text-xs font-semibold font-peridot rounded-full bg-v4-surface-success-bold border border-v4-insight-card-main-number-green text-v4-insight-card-main-number-green"
        >
          <span
            class="w-1.5 h-1.5 rounded-full bg-v4-insight-card-main-number-green"
          ></span>
          {{ item.status }}
        </span>
      </div>
    }
  </div>
</div>
