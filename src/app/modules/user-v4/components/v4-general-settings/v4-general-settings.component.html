<div class="w-full max-w-[900px]">
  <!-- Title -->
  <h2 class="text-2xl font-bold text-v4-main-text-color font-funnel mb-1">
    General Settings
  </h2>
  <p class="text-sm text-v4-secondary-text-color font-peridot mb-5">
    Configure basic application preferences and formats
  </p>

  <!-- Form Card -->
  <div
    class="v4-general-settings-card border border-v4-border-color rounded-2xl bg-v4-secondary-background-color px-8 py-7"
  >
    <form
      [formGroup]="generalSettingsForm"
      class="grid grid-cols-1 xl:grid-cols-2 gap-5"
    >
      <div class="w-full flex flex-col">
        <label
          class="block text-sm font-medium text-v4-secondary-text-color font-peridot mb-1.5"
          >Time Zone <span class="text-v4-common-red-color">*</span></label
        >
        <app-v4-common-dropdown
          formControlName="systemTimezone"
          [config]="{
            placeholder: 'Time Zone',
            displayField: 'name',
            style: { size: 0 }
          }"
          [loading]="timeZoneLoading()"
          [listData]="timeZone"
          [clearable]="true"
          [appendTo]="'body'"
        ></app-v4-common-dropdown>
        <app-control-message-v4
          [control]="getFormControl('systemTimezone')"
        ></app-control-message-v4>
      </div>

      <div class="w-full flex flex-col">
        <label
          class="block text-sm font-medium text-v4-secondary-text-color font-peridot mb-1.5"
          >Serial Number Format
          <span class="text-v4-common-red-color">*</span></label
        >
        <app-v4-common-dropdown
          formControlName="serialFormatting"
          [config]="{
            placeholder: 'Serial Number Format',
            displayField: 'name',
            style: { size: 0 }
          }"
          [listData]="serialNumberFormatting"
          [clearable]="true"
          [appendTo]="'body'"
        ></app-v4-common-dropdown>
        <app-control-message-v4
          [control]="getFormControl('serialFormatting')"
        ></app-control-message-v4>
      </div>

      <div class="w-full flex flex-col">
        <label
          class="block text-sm font-medium text-v4-secondary-text-color font-peridot mb-1.5"
          >Amount Format <span class="text-v4-common-red-color">*</span></label
        >
        <app-v4-common-dropdown
          formControlName="amountFormatting"
          [config]="{
            placeholder: 'Amount Format',
            displayField: 'name',
            style: { size: 0 }
          }"
          [listData]="amountFormat"
          [clearable]="true"
          [appendTo]="'body'"
        ></app-v4-common-dropdown>
        <app-control-message-v4
          [control]="getFormControl('amountFormatting')"
        ></app-control-message-v4>
      </div>

      <div class="w-full flex flex-col">
        <label
          class="block text-sm font-medium text-v4-secondary-text-color font-peridot mb-1.5"
          >Payee Name Format
          <span class="text-v4-common-red-color">*</span></label
        >
        <app-v4-common-dropdown
          formControlName="payeeFormatting"
          [config]="{
            placeholder: 'Payee Name Format',
            displayField: 'name',
            style: { size: 0 }
          }"
          [listData]="payeeFormat"
          [clearable]="true"
          [appendTo]="'body'"
        ></app-v4-common-dropdown>
        <app-control-message-v4
          [control]="getFormControl('payeeFormatting')"
        ></app-control-message-v4>
      </div>

      <div class="w-full flex flex-col">
        <label
          class="block text-sm font-medium text-v4-secondary-text-color font-peridot mb-1.5"
          >Amounts in Words
          <span class="text-v4-common-red-color">*</span></label
        >
        <app-v4-common-dropdown
          formControlName="amountWordingFormatting"
          [config]="{
            placeholder: 'Amounts in Words',
            displayField: 'name',
            style: { size: 0 }
          }"
          [listData]="amountWordingFormat"
          [clearable]="true"
          [appendTo]="'body'"
        ></app-v4-common-dropdown>
        <app-control-message-v4
          [control]="getFormControl('amountWordingFormatting')"
        ></app-control-message-v4>
      </div>

      <div class="w-full flex flex-col">
        <label
          class="block text-sm font-medium text-v4-secondary-text-color font-peridot mb-1.5"
          >Date Format <span class="text-v4-common-red-color">*</span></label
        >
        <app-v4-common-dropdown
          formControlName="systemDateFormat"
          [config]="{
            placeholder: 'Date Format',
            displayField: 'name',
            style: { size: 0 }
          }"
          [listData]="dateFormate"
          [clearable]="true"
          [appendTo]="'body'"
        ></app-v4-common-dropdown>
        <app-control-message-v4
          [control]="getFormControl('systemDateFormat')"
        ></app-control-message-v4>
      </div>

      <div class="w-full flex flex-col">
        <label
          class="block text-sm font-medium text-v4-secondary-text-color font-peridot mb-1.5"
          >Currency Format
          <span class="text-v4-common-red-color">*</span></label
        >
        <app-v4-common-dropdown
          formControlName="userCurrency"
          [config]="{
            placeholder: 'Currency',
            displayField: 'name',
            style: { size: 0 }
          }"
          [listData]="currencyFormat"
          [clearable]="true"
          [appendTo]="'body'"
        ></app-v4-common-dropdown>
        <app-control-message-v4
          [control]="getFormControl('userCurrency')"
        ></app-control-message-v4>
      </div>

      <div class="w-full flex flex-col">
        <label
          class="block text-sm font-medium text-v4-secondary-text-color font-peridot mb-1.5"
          >Language <span class="text-v4-common-red-color">*</span></label
        >
        <app-v4-common-dropdown
          formControlName="userLanguage"
          [config]="{
            placeholder: 'Language',
            displayField: 'name',
            style: { size: 0 }
          }"
          [listData]="languages"
          [clearable]="true"
          [appendTo]="'body'"
        ></app-v4-common-dropdown>
        <app-control-message-v4
          [control]="getFormControl('userLanguage')"
        ></app-control-message-v4>
      </div>
    </form>

    <div class="flex justify-end mt-6">
      <app-common-button-v4
        [type]="{ style: 'neon', name: 'main' }"
        [text]="'Update Settings'"
        [textClasses]="'!font-bold'"
        [loading]="loading()"
        [disabled]="loading()"
        [width]="'180px'"
        (clickEvent)="updateGeneralSettings()"
      />
    </div>
  </div>
</div>
