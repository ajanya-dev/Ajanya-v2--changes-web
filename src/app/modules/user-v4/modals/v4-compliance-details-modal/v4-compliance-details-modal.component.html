<!-- Header -->
<div
  class="flex items-center justify-between border-b border-v4-border-color bg-v4-secondary-background-color px-6 py-4"
>
  <div class="flex items-center gap-3">
    <img
      [src]="certificateImage"
      alt="Certificate Logo"
      class="h-10 w-10 object-contain"
    />
    <h2 class="text-lg font-semibold text-v4-main-text-color font-funnel">
      {{ certificateName }}
    </h2>
  </div>
  <button
    class="text-v4-tertiary-text-color hover:text-v4-main-text-color transition-colors"
    (click)="close()"
  >
    <lucide-icon name="x" [size]="18"></lucide-icon>
  </button>
</div>

<!-- Body -->
<div class="bg-v4-tertiary-background-color px-6 py-5 space-y-5">
  <div>
    <h3
      class="text-sm font-semibold text-v4-main-text-color font-funnel mb-1.5"
    >
      Description
    </h3>
    <p
      class="text-sm text-v4-secondary-text-color font-peridot leading-relaxed"
    >
      {{ certificateDescription }}
    </p>
  </div>

  <div>
    <h3
      class="text-sm font-semibold text-v4-main-text-color font-funnel mb-1.5"
    >
      Applicable to
    </h3>
    <p
      class="text-sm text-v4-secondary-text-color font-peridot leading-relaxed"
    >
      {{ certificateApplicableTo }}
    </p>
  </div>
</div>
