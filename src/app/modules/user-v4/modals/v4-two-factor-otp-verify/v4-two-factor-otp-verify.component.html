<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        {{
          data?.mode === "advancedtwofactor"
            ? "Disable Advanced Two-Factor Authentication"
            : "Disable Two-Factor Authentication"
        }}
      </h1>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <!-- OTP Sent Notification -->
    <div
      class="bg-v4-badge-info-bg-color border border-v4-border-color rounded-xl p-3 mb-4"
    >
      <div class="flex items-start gap-2">
        <lucide-icon
          [img]="MailCheckIcon"
          [size]="18"
          class="text-v4-badge-info-text-color shrink-0 mt-0.5"
        />
        <div>
          <div
            class="text-sm font-semibold text-v4-badge-info-text-color font-peridot"
          >
            OTP Sent
          </div>
          <div class="text-xs text-v4-badge-info-text-color font-peridot">
            Please check your verified email address and phone number.
          </div>
        </div>
      </div>
    </div>

    <!-- OTP Input Section -->
    <div class="mb-4">
      <label
        class="block text-sm font-medium text-v4-main-text-color font-peridot mb-3"
        >Enter OTP</label
      >
      <div class="flex gap-2">
        <input
          class="otp w-11 h-11 text-base font-normal bg-v4-secondary-background-color border border-v4-border-color rounded-lg text-center text-v4-main-text-color font-peridot focus:border-v4-primary-brand-color focus:outline-none transition-colors"
          type="number"
          #box1
          (paste)="sharedService.onPaste($event)"
          (keypress)="utils.numberOnly($event, 'numeric')"
          (click)="clickVal(box1)"
          (keyup)="tabChange($event, box2, box1, 0)"
          oninput="javascript: if (this.value.length > this.maxLength) this.value = this.value.slice(0, this.maxLength);"
          maxlength="1"
        />
        <input
          class="otp w-11 h-11 text-base font-normal bg-v4-secondary-background-color border border-v4-border-color rounded-lg text-center text-v4-main-text-color font-peridot focus:border-v4-primary-brand-color focus:outline-none transition-colors"
          type="number"
          #box2
          (paste)="sharedService.onPaste($event)"
          (keypress)="utils.numberOnly($event, 'numeric')"
          (click)="clickVal(box2)"
          (keyup)="tabChange($event, box3, box1, 1)"
          oninput="javascript: if (this.value.length > this.maxLength) this.value = this.value.slice(0, this.maxLength);"
          maxlength="1"
        />
        <input
          class="otp w-11 h-11 text-base font-normal bg-v4-secondary-background-color border border-v4-border-color rounded-lg text-center text-v4-main-text-color font-peridot focus:border-v4-primary-brand-color focus:outline-none transition-colors"
          type="number"
          #box3
          (paste)="sharedService.onPaste($event)"
          (keypress)="utils.numberOnly($event, 'numeric')"
          (click)="clickVal(box3)"
          (keyup)="tabChange($event, box4, box2, 2)"
          oninput="javascript: if (this.value.length > this.maxLength) this.value = this.value.slice(0, this.maxLength);"
          maxlength="1"
        />
        <input
          class="otp w-11 h-11 text-base font-normal bg-v4-secondary-background-color border border-v4-border-color rounded-lg text-center text-v4-main-text-color font-peridot focus:border-v4-primary-brand-color focus:outline-none transition-colors"
          type="number"
          #box4
          (paste)="sharedService.onPaste($event)"
          (keypress)="utils.numberOnly($event, 'numeric')"
          (click)="clickVal(box4)"
          (keyup)="tabChange($event, box5, box3, 3)"
          oninput="javascript: if (this.value.length > this.maxLength) this.value = this.value.slice(0, this.maxLength);"
          maxlength="1"
        />
        <input
          class="otp w-11 h-11 text-base font-normal bg-v4-secondary-background-color border border-v4-border-color rounded-lg text-center text-v4-main-text-color font-peridot focus:border-v4-primary-brand-color focus:outline-none transition-colors"
          type="number"
          #box5
          (paste)="sharedService.onPaste($event)"
          (keypress)="utils.numberOnly($event, 'numeric')"
          (click)="clickVal(box5)"
          (keyup)="tabChange($event, box6, box4, 4)"
          oninput="javascript: if (this.value.length > this.maxLength) this.value = this.value.slice(0, this.maxLength);"
          maxlength="1"
        />
        <input
          class="otp w-11 h-11 text-base font-normal bg-v4-secondary-background-color border border-v4-border-color rounded-lg text-center text-v4-main-text-color font-peridot focus:border-v4-primary-brand-color focus:outline-none transition-colors"
          type="number"
          #box6
          (paste)="sharedService.onPaste($event)"
          (keypress)="utils.numberOnly($event, 'numeric')"
          (click)="clickVal(box6)"
          (keyup)="tabChange($event, box6, box5, 5)"
          oninput="javascript: if (this.value.length > this.maxLength) this.value = this.value.slice(0, this.maxLength);"
          maxlength="1"
        />
      </div>
    </div>
  </div>
  <!-- modal body end -->

  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Disable"
      [loading]="submitBtnDisable"
      [disabled]="submitBtnDisable"
      (clickEvent)="submit()"
    />
  </div>
</div>
