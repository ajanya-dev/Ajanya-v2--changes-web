<div>
  <!-- Header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
      Complete Payment
    </h1>
    <button
      (click)="close()"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </button>
  </div>

  <!-- Body -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <div
      class="rounded-xl border border-v4-border-color overflow-hidden bg-v4-secondary-background-color"
    >
      <iframe
        [src]="safePaymentUrl"
        class="w-full min-h-[500px] border-none"
        frameborder="0"
        allowtransparency="true"
        referrerpolicy="no-referrer"
        loading="lazy"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation"
      ></iframe>
    </div>
  </div>
</div>
