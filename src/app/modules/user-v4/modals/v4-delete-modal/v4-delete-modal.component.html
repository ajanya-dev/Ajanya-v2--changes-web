<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Confirm Password
      </h1>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color">
    <div class="flex flex-col gap-2 mb-4">
      <p class="text-sm text-v4-main-text-color font-peridot">
        Please enter the password to confirm
      </p>
      <span
        class="text-sm text-v4-secondary-text-color font-peridot font-medium"
      >
        {{ email ? email : userName }}
      </span>
    </div>
    <div [formGroup]="confirmAccount">
      <app-common-input-v4
        [fieldLabel]="'Password'"
        [placeholder]="'Password'"
        formControlName="password"
        type="password"
        [isFieldRequired]="true"
        [control]="confirmAccount.controls.password"
      />
    </div>
  </div>
  <!-- modal body end -->

  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Continue"
      [disabled]="isSubmit()"
      [loading]="isSubmit()"
      (clickEvent)="submit()"
    />
  </div>
</div>
