<div class="">
  <!-- modal header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Add IP Address
      </h1>
    </div>
    <div
      [mat-dialog-close]="false"
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
    >
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body start -->
  <div class="p-6 bg-v4-tertiary-background-color" [formGroup]="ipAddressForm">
    <div class="flex flex-col gap-4">
      <div>
        <app-common-input-v4
          [placeholder]="'Enter IP Address'"
          formControlName="ipAddress"
          [control]="ipAddressForm.controls.ipAddress"
        />
        @if (
          (ipAddressForm.controls.ipAddress.dirty ||
            ipAddressForm.controls.ipAddress.touched) &&
          ipAddressForm.controls.ipAddress.errors?.["pattern"]
        ) {
          <small class="flex mt-1 gap-1 items-center pl-1">
            <lucide-icon
              [img]="CircleAlertIcon"
              [size]="14"
              class="text-v4-common-red-color"
            />
            <p
              class="text-v4-common-red-color text-xs font-medium font-peridot"
            >
              Invalid IP address
            </p>
          </small>
        }
      </div>
      <app-common-input-v4
        [placeholder]="'Enter Nickname'"
        formControlName="nickname"
        [control]="ipAddressForm.controls.nickname"
      />
    </div>
  </div>
  <!-- modal body end -->

  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      mat-dialog-close=""
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
      [customClasses]="'!py-2.5 !px-6'"
      [textClasses]="'!text-sm'"
    />
    <app-common-button-v4
      [type]="{ style: 'primary', name: 'main' }"
      text="Add IP Address"
      [customClasses]="'!py-2.5 !px-6'"
      [textClasses]="'!text-sm'"
      [disabled]="isSubmitting()"
      [loading]="isSubmitting()"
      (clickEvent)="onSubmit()"
    />
  </div>
</div>
