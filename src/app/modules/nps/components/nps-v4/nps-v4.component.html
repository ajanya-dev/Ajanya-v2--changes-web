<div
  class="flex flex-col rounded-2xl overflow-hidden bg-v4-secondary-background-color font-peridot"
>
  <!-- Header -->
  <div class="flex items-center justify-between px-5 md:px-6 pt-5 pb-3">
    <div class="flex items-center gap-2.5">
      <div
        class="w-9 h-9 rounded-lg flex items-center justify-center bg-v4-badge-sky-bg-color"
      >
        <lucide-icon
          [img]="MessageSquareIcon"
          [size]="18"
          class="text-v4-badge-sky-text-color"
        />
      </div>
      <span
        class="text-sm font-semibold tracking-[0.18em] text-v4-primary-brand-bold-color uppercase"
      >
        Feedback
      </span>
    </div>
    <button
      type="button"
      class="p-1.5 rounded-lg hover:bg-v4-secondary-background-color transition-colors"
      (click)="close()"
      aria-label="Close"
    >
      <lucide-icon
        [img]="CloseIcon"
        [size]="20"
        class="text-v4-tertiary-text-color"
      />
    </button>
  </div>

  <!-- Body -->
  <div class="px-5 md:px-6 pb-5">
    <h4
      class="text-base md:text-[17px] font-semibold text-v4-main-text-color leading-snug m-0"
    >
      What is the likelihood of you recommending our service to a friend or
      colleague?
    </h4>

    <!-- Scores -->
    <div class="mt-5" (mouseleave)="onHoverLeave()">
      <ul class="flex items-center justify-between gap-1.5 m-0 p-0 list-none">
        <li *ngFor="let item of npsScoresArr">
          <button
            type="button"
            (click)="selectScore(item.score)"
            (mouseenter)="onHover(item.score)"
            [class.bg-v4-primary-brand-color]="isFilled(item.score)"
            [class.text-white]="isFilled(item.score)"
            [class.border-v4-primary-brand-color]="isFilled(item.score)"
            [class.ring-2]="isSelected(item.score)"
            [class.ring-v4-brand-focus-color]="isSelected(item.score)"
            class="w-8 h-8 md:w-9 md:h-9 rounded-full border border-v4-border-color text-v4-secondary-text-color text-sm font-medium flex items-center justify-center transition-all duration-150 hover:border-v4-primary-brand-color"
          >
            {{ item.score }}
          </button>
        </li>
      </ul>
      <div class="flex justify-between mt-1.5 px-0.5">
        <span class="text-xs text-v4-tertiary-text-color">Not likely</span>
        <span class="text-xs text-v4-tertiary-text-color">Very likely</span>
      </div>
    </div>

    <!-- Comment -->
    <form
      [formGroup]="npsForm"
      (ngSubmit)="submit()"
      class="mt-5 flex flex-col gap-2"
    >
      <textarea
        formControlName="feedback"
        rows="3"
        placeholder="Your feedback is valuable to us.."
        class="w-full rounded-xl border border-v4-input-border-color bg-v4-input-background-color text-sm text-v4-main-text-color placeholder:text-v4-placeholder-text-color px-3 py-2.5 resize-none focus:outline-none focus:border-v4-primary-brand-color transition-colors"
      ></textarea>
      @if (
        npsForm.controls['feedback'].touched &&
        npsForm.controls['feedback'].errors?.['required']
      ) {
        <span
          class="font-peridot text-xs text-v4-common-red-color leading-none"
        >
          Please give your feedback
        </span>
      }

      <!-- Actions -->
      <div class="flex items-center justify-between mt-2">
        <button
          type="button"
          (click)="remindLater()"
          class="text-sm font-medium text-v4-secondary-text-color underline underline-offset-4 hover:text-v4-primary-brand-color transition-colors"
        >
          Remind me later
        </button>

        <app-common-button-v4
          [type]="{ style: 'primary', name: 'main' }"
          text="Submit"
          [lucideIcon]="'arrow-right'"
          [iconPosition]="'end'"
          [lucideIconSize]="16"
          [loading]="loading"
          [disabled]="scoreCount === 0 || loading"
          (clickEvent)="submit()"
        />
      </div>
    </form>
  </div>
</div>
