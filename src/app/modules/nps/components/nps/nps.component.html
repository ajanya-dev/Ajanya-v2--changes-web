<div class="nps_overlay" *ngIf="showNps"></div>
<div class="nps_main_wrapper" *ngIf="showNps">
  <div class="nps_container">
    <!-- <div class="main_header">
      <h3>Rate your experience</h3>
    </div> -->
    <!--=====================================================
                        MAIN MODY START
    ======================================================-->
    <div class="main_body">
      <h4 class="sub_head">
        What is the likelihood of you recommending our service to a friend or
        colleague?
      </h4>

      <div class="score_wrapper" (mouseleave)="removeHilight()">
        <li
          *ngFor="let num of npsCoresArr"
          #current
          (click)="scoreInit(num.score, current)"
          (mouseover)="hilight(current)"
          class="{{ num.class }}"
        >
          <button>{{ num.score }}</button>
        </li>
        <div class="status_text">
          <p>Not likely</p>
          <p>Very likely</p>
        </div>
      </div>

      <div class="reason_comment">
        <!-- <h3>What is the main reason for the score ?</h3> -->

        <form [formGroup]="npsForm" (ngSubmit)="npsFormSubmit()">
          <textarea
            formControlName="feedback"
            placeholder="Your feedback is valuable to us.."
            cols="50"
            rows="4"
            class="input_style"
          ></textarea>
          <app-control-message
            [control]="npsForm.controls.feedback"
            labelName="Please give your feedback"
          >
          </app-control-message>

          <div class="submit_btn">
            <p (click)="remindClose()">Remind me later</p>
            <button
              type="submit"
              [ngClass]="scoreCount == 0 && 'disable-btn'"
              class="ocw-btn ocw-btn-dark-green"
            >
              <span *ngIf="!loading; else loadingTemp">Submit</span>

              <ng-template #loadingTemp>
                <div class="loading_msg">
                  <span class="loadingSpinner"></span>
                </div>
              </ng-template>

              <span *ngIf="!loading"
                ><i class="fa-solid fa-angle-right"></i
              ></span>
            </button>
          </div>
        </form>
      </div>
    </div>
    <!--=====================================================
                      MAIN MODY START
    ======================================================-->
  </div>
</div>
