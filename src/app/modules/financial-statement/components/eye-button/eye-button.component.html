@if (showButton) {
  <div class="eye_btn" role="presentation" (click)="btnClickedHandler()">
    <fa-icon
      class="cursor-pointer pl-3"
      matTooltip="view"
      [icon]="faEye"
    ></fa-icon>
  </div>
}

@if(params.data?.json_data?.document_enc_id){
  <fa-icon
  (click)="download(params.data?.json_data?.document_enc_id)"
  class="cursor-pointer pl-3 text-base"
  [matTooltip]="isDownload() ? 'Downloading' : 'Download Document'"
  [icon]="isDownload() ? faSpinner : faDownlaod"
  [animation]="isDownload() ? 'spin' : ''"
></fa-icon>
}
