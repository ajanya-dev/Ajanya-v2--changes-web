<div class="bg-v4-main-background-color">
  <div>
    @if (!isChildComponent()) {
      <app-v4-page-header
        [title]="'My Credits Statement'"
        subtitle="View your complete credit transaction history"
        [showBackButton]="true"
      />
    }

    <!-- V4 Data Table -->
    <div [class.mt-5]="!isChildComponent()">
      <app-v4-data-table
        [showActionButtonContainer]="false"
        [columnDefs]="columnDefs"
        [tableId]="tableId"
        [frameworkComponents]="frameworkComponents"
        [exportConfig]="exportConfig"
        [isRowSelectable]="isRowSelectable"
        [defaultDisabledColumn]="disabledColumns"
        [useCustomEmptyState]="true"
        [emptyStateConfig]="{
          icon: 'wallet',
          title: 'No credit activity yet',
          description: 'Recharge your credits to start sending payments and see activity here',
          buttonText: 'Recharge My Credits'
        }"
        (emptyStateActionClick)="onRechargeCredit()"
        (cellRendererViewEvent)="onViewEvent($event)"
      />
    </div>
  </div>
</div>

<!-- Detail Side Drawer -->
<app-detail-side-panel
  [isOpen]="drawerOpen()"
  [backdropZIndex]="200"
  [width]="'clamp(460px, 34vw, 640px)'"
  [expandable]="true"
  [expandedWidth]="'min(1150px, 94vw)'"
  [panelId]="'financial-statement-detail'"
  [title]="panelTitle()"
  [subtitle]="panelSubtitle()"
  [iconTemplate]="panelIcon"
  [contentTemplate]="drawerContent"
  (closed)="closeDrawer()"
  (expandedChange)="isPanelExpanded.set($event)"
/>

<ng-template #panelIcon>
  <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full"
       style="background: var(--v4-accent-violet-color)">
    <lucide-icon name="mail" [size]="18" color="white"></lucide-icon>
  </div>
</ng-template>

<!-- Drawer Content Template -->
<ng-template #drawerContent>
  <app-financial-statement-drawer-v4
    [row]="selectedRow()"
    [isPanelExpanded]="isPanelExpanded()"
  />
</ng-template>
