<div class="flex">
  <div>
    <image-cropper
      style="width: 400px"
      [imageChangedEvent]="data.event"
      [maintainAspectRatio]="true"
      [aspectRatio]="2 / 2"
      format="png"
      (imageCropped)="imageCropped($event)"
      (cropperReady)="cropperReady()"
      [resizeToWidth]="228"
      [onlyScaleDown]="true"
      [cropperMinWidth]="128"
      [roundCropper]="true"
    >
    </image-cropper>
  </div>

  <div>
    <img [src]="croppedImage" style="width: 100%; border-radius: 50%" />
  </div>
</div>

<div class="ocw_modal_footer">
  <mat-dialog-actions align="end">
    <button class="ocw-btn ocw-btn-trash" (click)="close()">Cancel</button>

    <div class="grid justify-items-end">
      <button
        (click)="addProfilepic()"
        type="submit"
        class="ocw-btn-dark-green hover_effect"
        [disabled]="btnDesable"
      >
        <ng-container *ngIf="!btnDesable">
          <span>{{ btnDesable ? "" : "SUBMIT" }}</span>
        </ng-container>
        <span *ngIf="btnDesable" class="loadingSpinner"></span>
        <!-- <i class="fa fa-angle-right" aria-hidden="true"></i> -->
      </button>
    </div>
  </mat-dialog-actions>
</div>
