<div class="ocw_man_modal_wrapper">
  <!-- modal header -->
  <form [formGroup]="checkForm">
    <div class="ocw_modal_header">
      <div class="ocw_modal_title">Add Account Nick Name</div>
      <div class="close_btn" [mat-dialog-close]="false">
        <svg
          aria-hidden="true"
          focusable="false"
          data-prefix="fal"
          data-icon="times"
          class="svg-inline--fa fa-times fa-w-10"
          role="img"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 320 512"
        >
          <path
            fill="currentColor"
            d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"
          ></path>
        </svg>
      </div>
    </div>
    <!-- modal body start -->
    <div class="ocw_modal_body">
      <div class="single_input">
        <input
          type="text"
          class="input_style"
          placeholder=" "
          minlength="3"
          maxlength="30"
          formControlName="nickName"
          (keypress)="backtickDesble($event)"
        />
        <span class="floating_label_field">Nick Name</span>
        <app-control-message
          [control]="checkForm.controls.nickName"
          labelName="This field is required"
        ></app-control-message>
      </div>
    </div>
    <!-- modal body end -->
    <div class="ocw_modal_footer">
      <mat-dialog-actions align="end">
        <button
          type="submit"
          class="ocw-btn ocw-btn-modal-blue add_btn"
          (click)="submit()"
          [disabled]="btnDisabled"
        >
          <span>SAVE</span>
          <span *ngIf="btnDisabled" class="loadingSpinner"></span>
        </button>
      </mat-dialog-actions>
    </div>
  </form>
</div>
