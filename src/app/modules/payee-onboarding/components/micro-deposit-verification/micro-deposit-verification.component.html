<div class="flex flex-col items-center justify-center h-full">
  <div class="flex flex-col items-center text-center mb-[30px]">
    <p class="text-2xl font-semibold mb-4 deposit-header text-main-text-color">
      Verify Your Bank Account
    </p>
  </div>
  <div
    class="flex flex-col items-center w-80"
    [formGroup]="confirmMicroDepositForm"
  >
    <div
      class="text-secondary-text-color text-sm pb-2.5"
      [ngClass]="dataLoading ? 'skelton' : ''"
    >
      <p>
        <span class="pl-2 font-semibold"
          ><i class="fa-sharp fa-light fa-building-columns text-[18px]"></i
        ></span>
        <span class="pl-2 font-semibold">{{ maskedBankAccountNumber }}</span>
        <span class="pl-2 font-semibold">{{
          bankAccountForMD?.bankAccountName ||
            bankAccountForMD?.bankAccountNickName
        }}</span>
      </p>
    </div>
    <div class="w-full p-3.5 bg-secondary-background-color rounded-md mb-4">
      <p class="text-sm font-medium text-main-text-color">
        Enter the two amounts received in your account, to verify your bank
        account
      </p>
    </div>
    <div class="flex flex-col gap-3 w-full">
      <div class="w-full">
        <app-common-input-field
          class="w-full"
          customMask="separator.2"
          formControlName="amount1"
          placeholder="Enter Amount 1"
          [maxLength]="320"
        ></app-common-input-field>
        <app-control-message-v35
          [control]="confirmMicroDepositForm.controls.amount1"
        ></app-control-message-v35>
      </div>
      <div>
        <app-common-input-field
          class="w-full"
          customMask="separator.2"
          formControlName="amount2"
          placeholder="Enter Amount 2"
          [maxLength]="320"
        ></app-common-input-field>
        <app-control-message-v35
          [control]="confirmMicroDepositForm.controls.amount2"
        ></app-control-message-v35>
      </div>
      <app-common-button-v35
        [type]="{ style: 'modal', name: 'main' }"
        text="Proceed"
        width="100%"
        [loading]="formSubmitting"
        (click)="processMicroDeposit()"
      ></app-common-button-v35>
    </div>
  </div>
</div>
