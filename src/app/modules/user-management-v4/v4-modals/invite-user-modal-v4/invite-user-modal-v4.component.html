<div class="flex flex-col max-h-[90vh] font-peridot">
  <!-- Header -->
  <div
    class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex items-center gap-3">
      <div
        class="w-10 h-10 rounded-lg bg-v4-primary-brand-color flex items-center justify-center"
      >
        <lucide-icon name="user" [size]="20" class="text-white"></lucide-icon>
      </div>
      <div>
        <h2 class="text-lg font-bold text-v4-main-text-color">Add New User</h2>
        <p class="text-xs text-v4-secondary-text-color">
          Invite a team member to the platform
        </p>
      </div>
    </div>
    <button
      [mat-dialog-close]="false"
      class="text-v4-secondary-text-color hover:text-v4-main-text-color transition-colors p-1"
    >
      <lucide-icon name="x" [size]="20"></lucide-icon>
    </button>
  </div>

  <!-- Content -->
  <div
    class="flex-1 overflow-y-auto p-5 sm:p-6 space-y-6 bg-v4-popup-background-color"
  >
    <form [formGroup]="newUserForm">
      <!-- Section A: Basic Information -->
      <div>
        <h3 class="text-sm font-bold text-v4-main-text-color mb-4">
          Basic Information
        </h3>
        <div class="space-y-4">
          <!-- Full Legal Name -->
          <div>
            <app-common-input-v4
              [fieldLabel]="'Full Legal Name'"
              [placeholder]="'John Smith'"
              [control]="newUserForm.controls['name']"
              [errorLabel]="'Please enter name'"
              formControlName="name"
            />
          </div>

          <!-- Nick Name -->
          <div appWhiteLabel hiddenIf="isCompassRequirement">
            <app-common-input-v4
              [fieldLabel]="'Nick Name'"
              [placeholder]="'Nickname'"
              [control]="newUserForm.controls['nickName']"
              [errorLabel]="'Please enter nickname'"
              formControlName="nickName"
            />
          </div>

          <!-- Email Address -->
          <div>
            <app-common-input-v4
              [fieldLabel]="'Email Address'"
              [placeholder]="'john.smith@company.com'"
              [type]="'email'"
              [control]="newUserForm.controls['email']"
              [errorLabel]="'Please enter email'"
              formControlName="email"
            />
          </div>

          <!-- Confirm Email -->
          <div>
            <app-common-input-v4
              [fieldLabel]="'Confirm Email'"
              [placeholder]="'Confirm email address'"
              [type]="'email'"
              [control]="newUserForm.controls['confirmUserEmail']"
              [errorLabel]="'Please confirm email'"
              formControlName="confirmUserEmail"
            />
          </div>

          <!-- Preferred Company Name -->
          <div>
            <app-common-input-v4
              [fieldLabel]="'Preferred Company Name'"
              [placeholder]="'Company name'"
              [control]="newUserForm.controls['companyName']"
              [errorLabel]="'Please enter company name'"
              formControlName="companyName"
            />
          </div>
        </div>
      </div>

      <!-- Section B: Role -->
      <div class="pt-2" appWhiteLabel hiddenIf="isCompassRequirement">
        <h3 class="text-sm font-bold text-v4-main-text-color mb-4">Role</h3>
        <div class="space-y-4">
          <div>
            <label
              class="block text-sm font-medium text-v4-secondary-text-color font-peridot mb-1.5"
            >
              User Role <span class="text-v4-badge-error-text-color">*</span>
            </label>
            <app-v4-common-dropdown
              [config]="{
                placeholder: 'Select a role',
                style: { size: 0 }
              }"
              [listData]="userType"
              formControlName="userType"
              (ngModelChange)="userChange()"
            ></app-v4-common-dropdown>
            <p class="text-xs text-v4-secondary-text-color mt-1">
              Permissions can be configured after creating the user
            </p>
            <app-control-message-v4
              [control]="newUserForm.controls['userType']"
            ></app-control-message-v4>
          </div>
        </div>
      </div>
    </form>
  </div>

  <!-- Footer -->
  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      [type]="{ style: 'outline', name: 'main' }"
      [text]="'Cancel'"
      [customHeight]="'44px'"
      mat-dialog-close
    />
    <app-common-button-v4
      [type]="{ style: 'primary', name: 'main' }"
      [text]="buttonText"
      [lucideIcon]="'check-circle-2'"
      [lucideIconSize]="14"
      [customHeight]="'44px'"
      [loading]="isUserAdding"
      [disabled]="isUserAdding"
      (clickEvent)="newUserSubmit()"
    />
  </div>
</div>
