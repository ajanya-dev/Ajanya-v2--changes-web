<div class="flex flex-col font-peridot">
  <!-- Header -->
  <div
    class="flex justify-between items-center px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color"
  >
    <div class="flex items-center gap-3">
      <div
        class="w-10 h-10 rounded-lg bg-v4-primary-brand-color flex items-center justify-center"
      >
        <lucide-icon name="user" [size]="20" class="text-white"></lucide-icon>
      </div>
      <div>
        <h2 class="text-lg font-bold text-v4-main-text-color">
          Edit {{ currentUserType }}
        </h2>
      </div>
    </div>
    <button
      [mat-dialog-close]="false"
      class="text-v4-secondary-text-color hover:text-v4-main-text-color transition-colors p-1"
    >
      <lucide-icon name="x" [size]="20"></lucide-icon>
    </button>
  </div>

  <!-- Body -->
  <div class="p-6 bg-v4-popup-background-color">
    <form [formGroup]="userForm" class="flex flex-col gap-4">
      <div>
        <label
          class="block text-sm font-medium text-v4-secondary-text-color font-peridot mb-1.5"
        >
          User Type <span class="text-v4-badge-error-text-color">*</span>
        </label>
        <app-v4-common-dropdown
          [config]="{
            placeholder: 'Select User Type',
            style: { size: 3 }
          }"
          [listData]="userType"
          formControlName="userType"
        />
      </div>

      <div>
        <app-common-input-v4
          [fieldLabel]="'Full Legal Name'"
          [placeholder]="'Enter name'"
          [control]="userForm.controls.name"
          [errorLabel]="'Please enter name'"
          formControlName="name"
        />
      </div>

      <div>
        <app-common-input-v4
          [fieldLabel]="'Nickname'"
          [placeholder]="'Enter nickname'"
          [control]="userForm.controls.nickName"
          [errorLabel]="'Please enter nickname'"
          formControlName="nickName"
        />
      </div>

      <div>
        <app-common-input-v4
          [fieldLabel]="'Company Name'"
          [placeholder]="'Enter company name'"
          [control]="userForm.controls.companyName"
          [errorLabel]="'Please enter company name'"
          formControlName="companyName"
        />
      </div>
    </form>
  </div>

  <!-- Footer -->
  <div
    class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color"
  >
    <app-common-button-v4
      [type]="{ style: 'outline', name: 'main' }"
      [text]="'Cancel'"
      [customHeight]="'44px'"
      mat-dialog-close
    />
    <app-common-button-v4
      [type]="{ style: 'primary', name: 'main' }"
      [text]="'Save Changes'"
      [customHeight]="'44px'"
      [loading]="loading"
      [disabled]="loading"
      (clickEvent)="submit()"
    />
  </div>
</div>
