<div class="flex flex-col max-h-[90vh] font-peridot">
  <!-- Header -->
  <div
    class="flex items-center justify-between px-5 sm:px-6 py-4 border-b border-v4-border-color bg-v4-popup-header-footer-color shrink-0"
  >
    <div class="flex items-center gap-3">
      <div
        class="w-10 h-10 rounded-lg bg-v4-badge-info-bg-color flex items-center justify-center"
      >
        <lucide-icon
          name="shield-check"
          [size]="20"
          class="text-v4-primary-brand-color"
        ></lucide-icon>
      </div>
      <div>
        <h2 class="text-xl font-bold text-v4-main-text-color">
          Permission Audit Log
        </h2>
        <p class="text-xs text-v4-secondary-text-color mt-0.5">
          {{ userName }}
        </p>
      </div>
    </div>
    <button
      [mat-dialog-close]="false"
      class="text-v4-secondary-text-color hover:text-v4-main-text-color transition-colors p-1"
    >
      <lucide-icon name="x" [size]="20"></lucide-icon>
    </button>
  </div>

  <!-- Table Content -->
  <div
    class="flex-1 min-h-0 min-w-0 overflow-auto bg-v4-popup-background-color p-4 sm:p-5"
  >
    <div
      class="w-full min-w-0 overflow-auto rounded-xl border border-v4-border-color h-[70vh] min-h-[500px]"
    >
      <app-v4-data-table
        [showActionButtonContainer]="false"
        [columnDefs]="columnDefs"
        [tableId]="tableId"
        [frameworkComponents]="frameworkComponents"
        [paginationCurrentPageNumber]="v3DataTableService.CurrentPage ?? 1"
        [additionalPayload]="{ userId: userId() }"
        [isInsideModal]="true"
        [freeColumnResize]="false"
        [defaultDisabledColumn]="fieldsShownByDefault"
        [useCustomEmptyState]="true"
        [emptyStateConfig]="{
          icon: 'shield-check',
          title: 'No audit entries yet',
          description:
            'Permission changes made for this user will be recorded here',
          buttonText: ''
        }"
      >
      </app-v4-data-table>
    </div>
  </div>
</div>
