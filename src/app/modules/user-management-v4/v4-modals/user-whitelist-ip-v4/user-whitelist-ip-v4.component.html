<div class="p-5" style="font-family: var(--font-peridot), sans-serif">
  <!-- Header -->
  <div class="flex justify-between items-center pb-4">
    <h2 class="text-lg font-bold text-v4-main-text-color">Add IP Address</h2>
    <button
      [mat-dialog-close]="false"
      class="text-v4-secondary-text-color hover:text-v4-main-text-color transition-colors"
    >
      <lucide-icon name="x" [size]="20"></lucide-icon>
    </button>
  </div>

  <!-- Form -->
  <div [formGroup]="IpAddressForm" class="flex flex-col gap-3">
    <div>
      <app-common-input-v4
        [fieldLabel]="'IP Address'"
        [placeholder]="'Enter IP Address'"
        formControlName="ipAddress"
      />
      <app-control-message-v4
        [control]="IpAddressForm.controls.ipAddress"
        [label]="'IP address is required'"
        [customMessages]="{ pattern: 'Invalid IP address' }"
        [isMarginTopEnabled]="false"
        [marginTopOverride]="'mt-1'"
      />
    </div>

    <div>
      <app-common-input-v4
        [fieldLabel]="'Device Name'"
        [placeholder]="'Enter Device Name'"
        [control]="IpAddressForm.controls.name"
        [errorLabel]="'Device name is required'"
        formControlName="name"
      />
    </div>

    <app-common-button-v4
      [type]="{ style: 'primary', name: 'main' }"
      [text]="'Add IP Address'"
      [width]="'100%'"
      [loading]="loading"
      [disabled]="loading"
      (clickEvent)="onSubmit()"
    />
  </div>

  <!-- IP List -->
  @if (ipList?.length) {
    <div class="pt-4 mt-4 border-t border-v4-border-color">
      <h3 class="text-sm font-semibold text-v4-main-text-color mb-2">
        Allowed IP Addresses
      </h3>
      <div class="max-h-[300px] overflow-auto">
        <table class="w-full text-xs">
          <thead>
            <tr class="bg-v4-secondary-background-color">
              <td class="px-3 py-2 font-semibold text-v4-secondary-text-color">
                IP Address
              </td>
              <td class="px-3 py-2 font-semibold text-v4-secondary-text-color">
                Device Name
              </td>
              <td class="px-3 py-2 font-semibold text-v4-secondary-text-color">
                Action
              </td>
            </tr>
          </thead>
          <tbody>
            @for (item of ipList; track item; let i = $index) {
              <tr class="border-t border-v4-border-color">
                <td
                  class="px-3 py-2 text-v4-main-text-color truncate max-w-[140px]"
                >
                  {{ item.ipAddress }}
                </td>
                <td
                  class="px-3 py-2 text-v4-main-text-color truncate max-w-[140px]"
                >
                  {{ item.name }}
                </td>
                <td class="px-3 py-2">
                  @if (isDeleteLoading[i]) {
                    <lucide-icon
                      name="loader-circle"
                      [size]="14"
                      class="animate-spin text-v4-common-red-color"
                    ></lucide-icon>
                  } @else {
                    <button
                      (click)="onDeleteIP(item.id, i)"
                      class="text-v4-common-red-color hover:opacity-70 transition-opacity"
                    >
                      <lucide-icon name="trash-2" [size]="14"></lucide-icon>
                    </button>
                  }
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  }
</div>
