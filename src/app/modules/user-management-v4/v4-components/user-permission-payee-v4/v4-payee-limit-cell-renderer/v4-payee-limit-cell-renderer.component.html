<div class="flex flex-row gap-1 p-1 items-center max-w-[100px] w-full">
  <span class="text-sm mr-2">$</span>
  <app-common-input-v4
    placeholder="Limit"
    required="false"
    [formControl]="limitFormControl"
    [maxLength]="15"
    customMask="separator.2"
    (click)="$event.stopPropagation()"
    (inputFocusEvent)="onLimitFocus()"
    (inputFocusOutEvent)="onLimitBlur($event)"
    class="w-[100px] flex-shrink-0"
    [disabled]="disableInput()"
    [fieldHeight]="'32px'"
  />
  <div class="cursor-pointer w-[100px] flex-shrink-0" (click)="$event.stopPropagation()">
    <app-v4-select-dropdown
      [items]="v4LimitsToList"
      placeholder="Select"
      [compact]="true"
      [autoWidth]="true"
      [extraStyle]="paginationDropdownStyle"
      [(ngModel)]="v4SelectedLimit"
      (ngModelChange)="onV4LimitChange($event)"
    />
  </div>
</div>
