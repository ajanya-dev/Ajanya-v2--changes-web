<div class="h-full w-full py-4 px-5 overflow-x-scroll">
  <div class="relative">
    <div class="absolute top-0 left-1 h-[40px] flex items-center z-10">
      <app-common-button-v4
        [type]="{ style: 'primary', name: 'main' }"
        [text]="'Invite User'"
        [lucideIcon]="'plus'"
        [lucideIconSize]="16"
        [customHeight]="'32px'"
        [textClasses]="'text-sm font-semibold'"
        [customClasses]="'rounded-lg px-4'"
        (clickEvent)="goToNew()"
      />
    </div>
  </div>
  <app-v4-data-table
    class="overflow-auto"
    [showActionButtonContainer]="false"
    [columnDefs]="columnDefs"
    [tableId]="tableId"
    [frameworkComponents]="frameworkComponents"
    [headerElements]="headerElements"
    (headerButtonEvent)="onHeaderButtonEvent($event)"
    [paginationCurrentPageNumber]="v3DataTableService.CurrentPage ?? 1"
  >
  </app-v4-data-table>
</div>
