<div>
  <app-v4-data-table
    [columnDefs]="columnDefs"
    [tableId]="tableId"
    [frameworkComponents]="frameworkComponents"
    [defaultColumnFields]="columnFields"
    [headerElements]="headerElements()"
    [exportConfig]="exportConfig"
    [responseMap]="mapper"
    [filterBarInline]="true"
    [forceHorizontalActions]="true"
    [useCustomEmptyState]="true"
    [emptyStateConfig]="{
      icon: 'wallet',
      title: 'No cash expenses yet',
      description: 'Track and record your first cash expense to get started',
      buttonText: 'Add Cash Expense'
    }"
    (emptyStateActionClick)="onEmptyStateCreate()"
    (headerButtonEvent)="headerButtonClick($event)"
    (cellRendererIdEvent)="cellRendererActionClick($event)"
    (cellRendererViewEvent)="cellRendererActionView($event)"
    (rowSelected)="onRowSelected($event)"
    (tableExportEvent)="onCashExpenseExport($event)"
    [filterAndExportLoadingInput]="exportLoading()"
  />
</div>
