<div>
  <app-v4-data-table
    dynamicHeaderButtonText="Add Cash Account"
    [buttonForModal]="true"
    [iconClass]="'plus'"
    [columnDefs]="columnDefs"
    [tableId]="tableId"
    [useCustomEmptyState]="true"
    [emptyStateConfig]="{
      icon: 'landmark',
      title: 'No cash accounts yet',
      description: 'Add a cash account to start tracking income and expenses against it',
      buttonText: 'Add Cash Account'
    }"
    (emptyStateActionClick)="openNewCashAccountModal()"
    [frameworkComponents]="frameworkComponents"
    [defaultColumnFields]="defaultColumnFields"
    [responseMap]="isCashExpenseBalanceEnabled() ? mapper : null"
    [showActionButtonContainer]="false"
    [filterBarInline]="true"
    [forceHorizontalActions]="true"
    [suppressRowClickSelection]="true"
    [showFloatingActionBar]="false"
    (modalOpenClick)="openNewCashAccountModal()"
  />
</div>
