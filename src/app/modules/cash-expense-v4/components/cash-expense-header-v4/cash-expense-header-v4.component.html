@if (!showCards()) {
  <app-v4-page-header
    [title]="'Cash Expense'"
    subtitle="Track cash income and expenses across your cash accounts"
    [actions]="headerActions"
    (actionClick)="onAction($event)"
  />
}

@if (showCards()) {
  <div class="grid grid-cols-1 xl:grid-cols-3 gap-4 mt-4">
    @for (card of summaryCards(); track card.title) {
      <app-overview-cards-v4 [card]="card" [loading]="isLoading()" />
    }
  </div>
}
