<div class="flex flex-col h-full w-full">
  <div class="main-container flex flex-col h-full w-full rounded">
    <app-cash-expense-header-v4 [showCards]="false" />

    <div class="flex flex-1 flex-col min-h-0 mt-5">
      <div
        class="flex flex-col xl:flex-row xl:items-end xl:justify-between mb-1 gap-2 min-h-[35px] border-b border-v4-border-color"
      >
        <app-common-tab-v4
          class="flex-1"
          [tabs]="tabs"
          [activeTab]="activeTab()"
          (tabChange)="onTabChange($event)"
          variant="underline"
          size="xs"
          [borderNone]="true"
        />
      </div>

      <div class="flex flex-1 flex-col min-h-0">
        @if (activeTab() === "transactions") {
          <app-cash-expense-header-v4 [showCards]="true" />
          <app-cash-expense-list-v4 />
        } @else {
          <app-cash-expense-bank-table-v4 />
        }
      </div>
    </div>
  </div>

  <app-cash-expense-detail-panel-v4
    [cashExpenseId]="stateService.selectedExpenseId()"
    [isOpen]="stateService.isDetailPanelOpen()"
    (closed)="stateService.closeDetail()"
  />
</div>
