<div class="v4-modal-container">
  <!-- Header -->
  <div
    class="flex items-center justify-between px-6 py-4 border-b border-v4-border-color"
  >
    <h2 class="m-0 text-lg font-bold text-v4-main-text-color">
      Add Cash Account
    </h2>
    <button
      class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center"
      (click)="close()"
    >
      <lucide-icon name="x" [size]="18" class="text-v4-secondary-text-color" />
    </button>
  </div>

  <!-- Body -->
  <div class="px-6 py-5">
    <form [formGroup]="cashForm" class="flex flex-col gap-4">
      <app-common-input-v4
        [fieldLabel]="'Account Name'"
        placeholder="Enter account name"
        [control]="cashForm.controls.cashAccountName"
        formControlName="cashAccountName"
      />

      <app-common-input-v4
        [fieldLabel]="'Nickname'"
        placeholder="Enter nickname"
        [control]="cashForm.controls.cashAccountNickName"
        formControlName="cashAccountNickName"
      />

      <div class="flex flex-col gap-1">
        <app-common-amount-input-v4
          [fieldLabel]="'Starting Balance'"
          formControlName="cashAccountStartingBalance"
        />
        <app-control-message-v4
          [control]="cashForm.controls.cashAccountStartingBalance"
        />
      </div>
    </form>
  </div>

  <!-- Footer -->
  <div
    class="flex items-center justify-end gap-3 px-6 py-4 border-t border-v4-border-color"
  >
    <app-common-button-v4
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
      (clickEvent)="close()"
    />
    <app-common-button-v4
      [type]="{ style: 'primary', name: 'main' }"
      text="Save"
      lucideIcon="check"
      [loading]="isSaving()"
      [disabled]="isSaving()"
      (clickEvent)="submit()"
    />
  </div>
</div>
