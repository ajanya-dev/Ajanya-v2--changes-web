<div class="flex flex-col gap-3">
  <form class="flex flex-col gap-2">
    <textarea
      placeholder="Write your comments.."
      [(ngModel)]="comment"
      name="comment"
      maxlength="190"
      class="w-full py-2.5 px-3 rounded-lg text-[13px] font-inherit resize-y border focus:outline-none border-v4-input-border-color text-v4-main-text-color bg-v4-input-background-color"
      rows="3"
    ></textarea>
    <div class="flex justify-end">
      <app-common-button-v4
        [type]="{ style: 'primary', name: 'main' }"
        (clickEvent)="onSubmit()"
        [text]="!loading ? 'Add Comment' : 'Loading'"
        [disabled]="loading || !comment.trim()"
        width="150px"
      />
    </div>
  </form>

  <div class="overflow-x-auto max-h-[300px] overflow-y-auto">
    <table class="v4-table">
      <thead>
        <tr>
          <td>Date</td>
          <td>User</td>
          <td>Comment</td>
          <td>Action</td>
        </tr>
      </thead>
      <tbody>
        @if (isLoading()) {
          @for (_ of [].constructor(3); track $index) {
            <tr>
              <td><span class="skelton w-20 h-4 block"></span></td>
              <td><span class="skelton w-20 h-4 block"></span></td>
              <td><span class="skelton w-20 h-4 block"></span></td>
              <td><span class="skelton w-20 h-4 block"></span></td>
            </tr>
          }
        } @else {
          @for (item of listData; track item) {
            <tr>
              <td>{{ item.formated_date }}</td>
              <td>{{ item.user_name }}</td>
              <td>{{ item.comments }}</td>
              <td>
                <fa-icon
                  [icon]="['fas', 'trash']"
                  class="!text-common-red-color cursor-pointer"
                  matTooltip="Delete"
                  (click)="onDeleteComment(item.encrypted_id)"
                ></fa-icon>
              </td>
            </tr>
          }
        }
      </tbody>
    </table>
  </div>
</div>
