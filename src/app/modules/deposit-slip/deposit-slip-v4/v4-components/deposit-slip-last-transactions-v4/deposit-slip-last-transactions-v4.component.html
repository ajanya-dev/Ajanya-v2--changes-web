<div class="v4-table-wrapper">
  <table class="v4-table">
    <thead>
      <tr>
        <th width="20%">Created By</th>
        <th width="15%">Amount</th>
        <th width="15%">Date</th>
        <th width="20%">Deposit From</th>
        <th width="20%">Memo</th>
        <th width="10%">Ref ID</th>
      </tr>
    </thead>
    <tbody>
      @if (isLoading()) {
        @for (_ of [].constructor(5); track $index) {
          <tr>
            <td><span class="skelton w-20 h-4 block"></span></td>
            <td><span class="skelton w-20 h-4 block"></span></td>
            <td><span class="skelton w-20 h-4 block"></span></td>
            <td><span class="skelton w-20 h-4 block"></span></td>
            <td><span class="skelton w-20 h-4 block"></span></td>
            <td><span class="skelton w-20 h-4 block"></span></td>
          </tr>
        }
      } @else {
        @for (item of lastTransactions(); track item) {
          <tr>
            <td>{{ item.createdBy }}</td>
            <td>{{ item.amount }}</td>
            <td>{{ item.depositDate }}</td>
            <td>{{ item.from }}</td>
            <td>{{ item.memo }}</td>
            <td>{{ item.refId }}</td>
          </tr>
        }
      }
    </tbody>
  </table>
</div>
