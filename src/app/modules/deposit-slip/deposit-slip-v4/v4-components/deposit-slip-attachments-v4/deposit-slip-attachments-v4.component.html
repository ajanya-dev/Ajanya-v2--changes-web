<div class="flex flex-col">
  <div class="flex justify-end mb-2">
    <app-common-button-v4
      [type]="{ style: 'primary', name: 'main' }"
      [isAddIcon]="true"
      [icon]="['fas', 'plus']"
      (clickEvent)="addAttachment()"
      text="Add Attachment"
      width="150px"
    />
  </div>

  <div class="overflow-x-auto max-h-[350px] overflow-y-auto">
    <table class="v4-table">
      <thead>
        <tr>
          <td>Date</td>
          <td>User</td>
          <td>File</td>
          <td>Action</td>
        </tr>
      </thead>
      <tbody>
        @if (isLoading()) {
          @for (_ of [].constructor(3); track $index) {
            <tr>
              <td><span class="skelton w-20 h-4 block"></span></td>
              <td><span class="skelton w-20 h-4 block"></span></td>
              <td><span class="skelton w-20 h-4 block"></span></td>
              <td><span class="skelton w-20 h-4 block"></span></td>
            </tr>
          }
        } @else {
          @for (item of depositSlipAttachmentData; track item; let i = $index) {
            <tr>
              <td width="30%">{{ item.formated_date }}</td>
              <td width="20%">{{ item.user_name }}</td>
              <td width="40%">
                <div class="flex items-center gap-1">
                  <a
                    role="presentation"
                    class="cursor-pointer underline hover:opacity-80"
                    style="color: var(--v4-primary-brand-bold-color)"
                    (click)="openAttachment(item.encrypted_id, true)"
                  >
                    {{ item.file_name }}
                  </a>
                  <lucide-icon
                    class="cursor-pointer"
                    style="color: var(--v4-tertiary-text-color)"
                    name="external-link"
                    [size]="12"
                    (click)="openAttachment(item.encrypted_id, false)"
                  ></lucide-icon>
                </div>
              </td>
              <td>
                <lucide-icon
                  name="trash-2"
                  [size]="15"
                  class="!text-common-red-color cursor-pointer"
                  matTooltip="Delete"
                  (click)="onDeleteAttachment(item.encrypted_id)"
                ></lucide-icon>
              </td>
            </tr>
          }
        }
      </tbody>
    </table>
  </div>
</div>
