<div class="flex items-center gap-1 h-full">
  @if (actionLoading) {
    <div class="flex items-center justify-center w-full h-full">
      <div class="action-spinner"></div>
    </div>
  } @else {
    <button aria-label="Actions"
      class="action-icon-btn"
      [matMenuTriggerFor]="menu"
      (click)="$event.stopPropagation()"
      matTooltip="Actions"
    >
      <lucide-icon
        name="ellipsis-vertical"
        [size]="16"
        class="v4-action-icon"
      ></lucide-icon>
    </button>

    <button aria-label="View Details"
      class="action-icon-btn"
      (click)="onViewClick(); $event.stopPropagation()"
      matTooltip="View Details"
    >
      <lucide-icon name="eye" [size]="16" class="v4-action-icon"></lucide-icon>
    </button>

    <mat-menu #menu="matMenu" class="v4-action-menu">
      @for (group of groupedActions; track group.title) {
        <div class="v4-menu-group-label">{{ group.title }}</div>
        @for (item of group.items; track item.id) {
          <button
            mat-menu-item
            [disabled]="isActionDisabled(item.id)"
            [class.v4-menu-item-danger]="item.isDanger"
            (click)="onActionClick(item.id)"
          >
            <div class="v4-menu-item">
              <lucide-icon [name]="item.icon" [size]="16"></lucide-icon>
              <span>{{ item.label }}</span>
            </div>
          </button>
        }
      }
    </mat-menu>
  }
</div>
