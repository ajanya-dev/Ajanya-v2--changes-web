<div class="font-peridot">
  <!-- modal header -->
  <div class="flex justify-between px-6 py-4 bg-v4-secondary-background-color border-b border-v4-border-color">
    <div class="flex flex-col">
      <h1 class="text-xl font-semibold text-v4-main-text-color font-funnel">
        Edit Device Name
      </h1>
      <h2 class="text-xs text-v4-subtle-text-color">Update the name for this device</h2>
    </div>
    <div [mat-dialog-close]="false" class="w-9 h-9 rounded-lg hover:bg-v4-tertiary-background-color cursor-pointer flex justify-center items-center">
      <lucide-icon [img]="XIcon" class="text-v4-subtle-text-color" />
    </div>
  </div>

  <!-- modal body -->
  <div class="p-6 bg-v4-tertiary-background-color">
    @if (loading()) {
      <div class="space-y-4">
        <div class="h-5 w-48 rounded bg-v4-border-color animate-pulse"></div>
        <div class="h-10 rounded-lg bg-v4-border-color animate-pulse"></div>
      </div>
    } @else {
      <form [formGroup]="deviceForm" (ngSubmit)="onSubmit()">
        <div class="mb-4">
          <label class="text-sm font-medium text-v4-secondary-text-color mb-1 block">Device Address</label>
          <p class="text-sm text-v4-main-text-color">{{ deviceAddress }}</p>
        </div>
        <div>
          <label class="text-sm font-medium text-v4-secondary-text-color mb-1 block">
            Device Name <span class="text-v4-common-red-color">*</span>
          </label>
          <input
            type="text"
            formControlName="deviceName"
            placeholder="Enter Device Name Here"
            class="w-full h-10 px-3 rounded-lg text-sm text-v4-main-text-color bg-v4-secondary-background-color border border-v4-input-border-color outline-none transition-colors focus:border-v4-brand-border-color"
          />
          <app-control-message-v4
            [control]="deviceForm.controls['deviceName']"
            label="Device Name is Required."
          ></app-control-message-v4>
        </div>
      </form>
    }
  </div>

  <!-- modal footer -->
  <div class="flex justify-end gap-3 p-6 bg-v4-secondary-background-color border-t border-v4-border-color">
    <app-common-button-v4
      mat-dialog-close=""
      width="120px"
      [type]="{ style: 'outline', name: 'main' }"
      text="Cancel"
    />
    <app-common-button-v4
      width="120px"
      [type]="{ style: 'primary', name: 'main' }"
      text="Save"
      (clickEvent)="onSubmit()"
      [disabled]="submitting()"
      [loading]="submitting()"
    />
  </div>
</div>
