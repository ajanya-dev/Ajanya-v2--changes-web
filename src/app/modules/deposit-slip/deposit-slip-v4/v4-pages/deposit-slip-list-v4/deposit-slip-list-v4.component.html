<div class="flex flex-col w-full h-full">
  <div class="mt-5 min-h-[35px] flex items-end border-b border-v4-border-color">
    <app-common-tab-v4
      [tabs]="filterTabs"
      [(activeTab)]="activeFilterTab"
      variant="underline"
      size="xs"
      [borderNone]="true"
      (tabChange)="onFilterTabChange($event)"
    />
  </div>

  <div class="mt-1">
    <app-v4-data-table
      [deselectedColumns]="deselectedColumns"
      [defaultColumnFields]="columnFields"
      [columnDefs]="columnDefs"
      [tableId]="tableId"
      [fieldsShownByDefault]="fieldsShownByDefault"
      [frameworkComponents]="frameworkComponents"
      [headerElements]="headerElements()"
      [showActionButtonContainer]="true"
      [useCustomEmptyState]="true"
      [emptyStateConfig]="{
        icon: 'file-text',
        title: 'No deposit slips yet',
        description:
          'Create your first deposit slip to start tracking deposits',
        buttonText: 'New Deposit Slip'
      }"
      (emptyStateActionClick)="createDepositSlip()"
      (headerButtonEvent)="headerButtonClick($event)"
      (cellRendererIdEvent)="cellRendererActionClick($event)"
      (cellRendererViewEvent)="openDetailPanel($event)"
      (rowSelected)="onRowSelected($event)"
    />
  </div>

  <app-deposit-slip-detail-panel-v4
    [row]="selectedRow()"
    [isOpen]="isDetailPanelOpen()"
    (closed)="isDetailPanelOpen.set(false)"
    (actionButtonClicked)="onPanelActionClicked($event)"
  />
</div>
