<div class="ocw_table_wrapper">
  <div class="flex justify-end gap-3 mt-2">
    <app-common-button-v35
      [type]="{ style: 'blue', name: 'money-action' }"
      [isAddIcon]="true"
      [icon]="['fas', 'plus']"
      (clickEvent)="addAttachment()"
      text="Add Attachment"
      width="150px"
    ></app-common-button-v35>
  </div>
  <table class="ocw-table ocw-table-striped mt-2">
    <thead>
      <tr>
        <td>Date</td>
        <td>User</td>
        <td>File</td>
        <td>Action</td>
      </tr>
    </thead>
    <tbody>
      @if(isLoading()){
        @for (_ of [].constructor(3); track $index) {
          <tr class="bg-tr">
            <td><span class="skelton w-20 h-5 block"></span></td>
            <td><span class="skelton w-20 h-5 block"></span></td>
            <td><span class="skelton w-20 h-5 block"></span></td>
            <td><span class="skelton w-20 h-5 block"></span></td>
          </tr>
        }
    }@else {
      @for (item of depositSlipAttachmentData; track item; let i = $index) {
        <tr class="bg-tr">
          <td width="30%">{{ item.formated_date }}</td>
          <td width="20%">{{ item.user_name }}</td>
          <td width="40%" class="file">
            <div class="flex items-center">
              <a role="presentation"
                class="cursor-pointer"
                (click)="openAttachment(item.encrypted_id, true)"
              >
                {{ item.file_name }}
              </a>
              <fa-icon
                class="cursor-pointer"
                [icon]="['fas', 'external-link']"
                (click)="openAttachment(item.encrypted_id, false)"
              ></fa-icon>
            </div>
          </td>
          <td class="icon">
            <a class="deleteButton" data-id="">
              <fa-icon
                [icon]="['fas', 'trash']"
                class="!text-common-red-color cursor-pointer"
                aria-hidden="true"
                title="Delete"
                (click)="onDeleteAttachment(item.encrypted_id)"
              ></fa-icon>
              <span class="sr-only">Delete</span></a
            >
          </td>
        </tr>
      }
    }
    </tbody>
  </table>
</div>
