<div class="ocw_table_wrapper">
  <table class="ocw-table ocw-table-striped">
    <thead>
      <tr>
        <th width="15%">Created By</th>
        <th width="15%">Amount</th>
        <th class="" width="15%">Date</th>
        <th class="" width="20%">Deposit From</th>
        <th class="" width="20%">Memo</th>
        <th width="15%">Ref Id</th>
      </tr>
    </thead>
    <tbody>
      @if (isLoading()) {
        @for (_ of [].constructor(5); track $index) {
          <tr class="bg-tr">
            <td><span class="skelton w-20 h-5 block"></span></td>
            <td><span class="skelton w-20 h-5 block"></span></td>
            <td><span class="skelton w-20 h-5 block"></span></td>
            <td><span class="skelton w-20 h-5 block"></span></td>
            <td><span class="skelton w-20 h-5 block"></span></td>
            <td><span class="skelton w-20 h-5 block"></span></td>
          </tr>
        }
      } @else {
        @for (item of lastTransactions(); track item) {
          <tr class="bg-tr">
            <td>{{ item.createdBy }}</td>
            <td>{{ item.amount }}</td>
            <td>{{ item.depositDate }}</td>
            <td>{{ item.from }}</td>
            <td>{{ item.memo }}</td>
            <td>{{ item.refId }}</td>
          </tr>
        }
      }
    </tbody>
  </table>
</div>
