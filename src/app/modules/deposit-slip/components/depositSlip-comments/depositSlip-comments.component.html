<span
  class="heading-h4 padng-top-main !text-[14px] !text-main-text-color font-inter"
  >Comments</span
>

<form class="example-form">
  <textarea
    placeholder="Write your comments.."
    [(ngModel)]="comment"
    name="comment"
    maxlength="190"
    class="input_style mb-4"
    rows="3"
  ></textarea>
  <div
    class="righ-tside-buton mb-4"
    [ngStyle]="{ 'pointer-events': loading ? 'none' : 'all' }"
  >
    <app-common-button-v35
      [type]="{ style: 'blue', name: 'money-action' }"
      (clickEvent)="onSubmit()"
      [text]="!loading ? 'Add Message' : 'Loading'"
      [disabled]="loading"
      width="150px"
    ></app-common-button-v35>
  </div>
</form>
<div class="ocw_table_wrapper">
  <table class="ocw-table ocw-table-striped">
    <thead>
      <tr class="border-under">
        <td>Date</td>
        <td>User</td>
        <td>Comment</td>
        <td>Action</td>
      </tr>
    </thead>
    <tbody>
      @if(isLoading()){
        @for (_ of [].constructor(3); track $index) {
          <tr class="bg-tr">
            <td><span class="skelton w-20 h-5 block"></span></td>
            <td><span class="skelton w-20 h-5 block"></span></td>
            <td><span class="skelton w-20 h-5 block"></span></td>
            <td><span class="skelton w-20 h-5 block"></span></td>
          </tr>
        }
    }@else {
      @for (item of listData; track item) {
        <tr>
          <td>{{ item.formated_date }}</td>
          <td>{{ item.user_name }}</td>
          <td>{{ item.comments }}</td>
          <td class="icon">
            <a class="deleteButton" data-id="">
              <fa-icon
                [icon]="['fas', 'trash']"
                class="!text-common-red-color cursor-pointer"
                aria-hidden="true"
                title="Delete"
                (click)="onDeleteComment(item.encrypted_id)"
              ></fa-icon>
              <span class="sr-only">Delete</span></a
            >
          </td>
        </tr>
      }
    }
    </tbody>
  </table>
</div>
