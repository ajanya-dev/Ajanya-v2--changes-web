<div class="flex items-center !w-full p-2">
  @if (!filterText) {
  <div class="relative flex-1">
    <ng-select 
      [items]="sourceTypes()" 
      [(ngModel)]="filterText" 
      [bindValue]="'value'" 
      [bindLabel]="'name'"
      (ngModelChange)="onFilterTextChange()" 
      placeholder="Filter source..."
      class="w-full"
      dropdownPosition="bottom"
      appendTo=".ag-root-wrapper"
      [clearable]="!!filterText"
      [closeOnSelect]="true"
    >
    </ng-select>
  </div>
}
@if (filterText) {
  <div class="flex flex-row gap-2 w-full">
    @if (filterText === 'BANK') {
    <ng-select
      [items]="bankSourceData()"
      [(ngModel)]="selectedBankSourceId"
      placeholder="Select Bank"
      (ngModelChange)="onSourceSelectionChange('BANK')"
      dropdownPosition="bottom"
      appendTo=".ag-root-wrapper"
      class="!border-0"
      [clearable]="true"
      [closeOnSelect]="true"
      [virtualScroll]="true"
      [searchable]="true"
      [bindLabel]="'nickName'"
      [bindValue]="'id'"
      [searchFn]="searchFn"
      [loading]="bankSearchLoading()"
      (search)="onSearch($event,'BANK')"
      (clear)="onClearSearch('BANK')"
      (close)="onDropdownClose('BANK')"
      (scrollToEnd)="onScrollToEnd()"
    >
    <ng-template ng-placeholder-tmp>
      <fa-icon [icon]="faBank"></fa-icon>
    </ng-template>
    <ng-template ng-label-tmp let-item="item">
      <fa-icon [icon]="faBank" class="mr-2"></fa-icon>
      {{ item.nickName }}
    </ng-template>
    <ng-template ng-option-tmp let-item="item">
        <ng-option [value]="item.id">
          {{ item.nickName }}
        </ng-option>
    </ng-template>
    </ng-select>
    <div class="flex items-center justify-center cursor-pointer">
      <fa-icon [icon]="faTimes" (click)="clearSubFilter()" class="w-full"></fa-icon>
    </div>
    }

    @if (filterText === 'WALLET') {
    <div class="flex flex-row gap-2 w-full">
    <ng-select
      [items]="walletSourceData()"
      [(ngModel)]="selectedWalletSourceId"
      (ngModelChange)="onSourceSelectionChange('WALLET')"
      placeholder="Select Wallet"
      dropdownPosition="bottom"
      appendTo=".ag-root-wrapper"
      [clearable]="true"
      [closeOnSelect]="true"
      [virtualScroll]="true"
      [searchable]="true"
      [bindLabel]="'walletName'"
      [bindValue]="'id'"
      [searchFn]="searchFn"
      [loading]="walletSearchLoading()"
      (search)="onSearch($event,'WALLET')"
      (clear)="onClearSearch('WALLET')"
      (close)="onDropdownClose('WALLET')"
      (scrollToEnd)="onScrollToEnd()"
    >
    <ng-template ng-placeholder-tmp>
      <fa-icon [icon]="faWallet"></fa-icon>
    </ng-template>
    <ng-template ng-label-tmp let-item="item">
      <fa-icon [icon]="faWallet" class="mr-2"></fa-icon>
      {{ item.walletName }}
    </ng-template>
    
    <ng-template ng-option-tmp let-item="item">
      <ng-option [value]="item.id">
        {{ item.walletName }}
      </ng-option>
    </ng-template>
    </ng-select>
    <div class="flex items-center justify-center cursor-pointer">
      <fa-icon [icon]="faTimes" (click)="clearSubFilter()" class="w-full"></fa-icon>
    </div>
    </div>
    }
    @if (filterText === 'CARD') {
    <div class="flex flex-row gap-2 w-full">
    <ng-select
      [items]="cardSourceData()"
      [(ngModel)]="selectedCardSourceId"
      (ngModelChange)="onSourceSelectionChange('CARD')"
      placeholder="Select Card"
      dropdownPosition="bottom"
      appendTo=".ag-root-wrapper"
      [clearable]="true"
      [closeOnSelect]="true"
      [virtualScroll]="true"
      [searchable]="true"
      [bindLabel]="'nickName'"
      [bindValue]="'cardId'"
      [searchFn]="searchFn"
      [loading]="cardSearchLoading()"
      (search)="onSearch($event,'CARD')"
      (clear)="onClearSearch('CARD')"
      (close)="onDropdownClose('CARD')"
      (scrollToEnd)="onScrollToEnd()"
    >
    <ng-template ng-placeholder-tmp>
      <fa-icon [icon]="faCreditCard"></fa-icon>
    </ng-template>
    <ng-template ng-label-tmp let-item="item">
      <fa-icon [icon]="faCreditCard" class="mr-2"></fa-icon>
      {{ item.nickName }}
    </ng-template>
    <ng-template ng-option-tmp let-item="item">
      <ng-option [value]="item.id">
        {{ item.nickName }}
      </ng-option>
    </ng-template>
    </ng-select>
    <div class="flex items-center justify-center cursor-pointer">
      <fa-icon [icon]="faTimes" (click)="clearSubFilter()" class="w-full"></fa-icon>
    </div>
    </div>
    }
    
  </div>
}
</div>
